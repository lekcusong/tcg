function bossStageMaxHp(stage, cycle){
  const base = BOSS_STAGE_HP[stage-1] || BOSS_STAGE_HP[0];
  return Math.round(base * Math.pow(BOSS_DIFFICULTY_MULT, cycle-1));
}
// 獎勵倍率：與血量難度倍率各自獨立，可設不同數字。同樣以「第1輪=基準值」往上疊。
function bossRewardMult(cycle){
  return Math.pow(BOSS_REWARD_MULT, cycle-1);
}
function bossCurrentBaseReward(cycle){
  const m = bossRewardMult(cycle);
  return {
    coins: Math.round(BOSS_BASE_REWARD.coins * m),
  };
}
function bossCurrentBonusPool(cycle){
  const m = bossRewardMult(cycle);
  return {
    coins: Math.round(BOSS_BONUS_POOL.coins * m),
  };
}
// ---------- 單人 Boss 進度：每位玩家一份獨立存檔 ----------
// 每人一把 key，天然沒有跨玩家的讀-改-寫競態，也不會有「別人的網路抖動
// 害我進度歸零」的問題（那是舊版全服共用一份 boss:state 才會發生的坑）。
function bossSoloKey(nickname){
  return `boss:solo:${CURRENT_SEASON_ID}:${nickname}`;
}
// 「今天」的日期字串（當地時間，YYYY-MM-DD），用來判斷是否跨過每日
// 00:00 重置點。用本地時間而非 UTC，這樣重置時間點才會符合玩家直覺的午夜。
function bossTodayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
// 方案A：擊敗才升輪，沒擊敗就重打同一輪。cycle 預設 1（第一次挑戰／換季），
// 呼叫端（ensureBossState）會依「昨天是否擊敗」決定要傳入 cycle+1 還是原本的 cycle。
function bossFreshState(cycle, killCount){
  cycle = cycle || 1;
  return {
    seasonId: CURRENT_SEASON_ID,
    resetDate: bossTodayStr(),
    cycle,
    stage: 1,
    hp: bossStageMaxHp(1,cycle),
    maxHp: bossStageMaxHp(1,cycle),
    cycleDamage: 0, // 本輪（尚未破台的這個 cycle）累積造成的傷害，僅供顯示用
    comboStreak: 0, // 🔥 連續組合命中次數（對子/豹子），沒接住就歸零；已接上 rollDiceAttack/resolveBossAttack
    minion: null,   // 👹 目前存活的小怪：{typeId, hp, maxHp}，已接上 resolveBossAttack 的攻擊流程
    activeEvent: null, // ✨ 目前生效中的隨機事件：{id, hitsLeft, value}，換階/換輪時可能重抽（見 maybeTriggerBossEvent）
    pendingChest: false, // 🎁 是否有待開啟的寶箱（玩家需先 3 選 1 才能繼續攻擊，見 resolveBossChestChoice）
    killCount: killCount || 0, // 🌀 今日已擊殺次數，達到 BOSS_MAX_DAILY_KILLS 才鎖到隔天（見 clearedToday）
    clearedToday: false,
    activeAffix: rollBossAffix(), // 🎯 這隻 Boss（本 cycle）是否帶詞綴，見 rollBossAffix/bossAffixLabel
  };
}
// 注意：這裡不再吞掉讀取失敗（網路抖動、API 錯誤等）。storage.get() 本身在
// 請求失敗時會 throw；過去全服共用版本曾經把任何失敗都當成「查無資料」
// 回傳 null，導致誤判成「還沒有 Boss」而覆蓋寫入，把進度整個抹掉。這裡
// 讀取失敗會直接往上拋出，由呼叫端決定重試或提示玩家稍後再試。
async function loadPlayerBossStateRaw(nickname){
  // CAS 比對改用 updated_at 短戳記，而不是整包 value 塞進網址（見 savePlayerBossStateCAS
  // 註解），所以這裡額外多 select updated_at 供比對用。
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(bossSoloKey(nickname))}&select=value,updated_at`,
    { headers: SB_HEADERS }
  );
  if(!res.ok) throw new Error('storage get failed: ' + res.status);
  const rows = await res.json();
  if(!rows || rows.length === 0) return {state: null, raw: null, updatedAt: null};
  return {state: JSON.parse(rows[0].value), raw: rows[0].value, updatedAt: rows[0].updated_at || null};
}
async function savePlayerBossState(nickname, s){
  await storage.set(bossSoloKey(nickname), JSON.stringify(s));
}
// 只有在資料庫現存 updated_at 仍等於 prevUpdatedAt 時才寫入 newState（Compare-And-Swap）。
// 單人模式下同一位玩家理論上不會有「別人」跟自己搶同一把 key，但玩家本人
// 短時間內連點兩次攻擊（一般爆發／超爆發）時，兩個請求還是可能交錯，一樣
// 需要 CAS 才不會互相覆蓋。
// 【2026-08 修正】原本比對條件是 value=eq.<整包舊 JSON>，等於每次寫入都要把整份狀態
// 塞進網址查詢參數；一旦狀態變大（例如骰子系統上線後 player 資料膨脹，這裡雖然存的是
// boss 狀態不含骰子，但同一顆 kv_store 表、同一套寫法用在 player 上就直接爆掉，見
// savePlayerCAS），網址長度可能超過伺服器/CDN 上限，導致每次寫入都失敗且重試無效。
// 改成比對 updated_at（一個很短的時間戳記），網址長度固定，不會再因為資料變大而壞掉。
async function savePlayerBossStateCAS(nickname, prevUpdatedAt, newState){
  const filter = prevUpdatedAt
    ? `updated_at=eq.${encodeURIComponent(prevUpdatedAt)}`
    : `updated_at=is.null`; // 舊資料/從未寫過 updated_at 的極少數情況 fallback
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(bossSoloKey(nickname))}&${filter}`,
    {
      method: 'PATCH',
      headers: {
        ...SB_HEADERS,
        'Content-Type': 'application/json',
        Prefer: 'return=representation',
      },
      body: JSON.stringify({ value: JSON.stringify(newState), updated_at: new Date().toISOString() }),
    }
  );
  if(!res.ok) throw new Error('storage CAS update failed: ' + res.status);
  const rows = await res.json();
  return Array.isArray(rows) && rows.length > 0;
}
// 確保這位玩家的 Boss 進度存在且是「今天」的（跨天、跨賽季都視為需要重置）。
// 資料庫已有一筆但需要覆蓋（換季／跨天／損毀資料）時用 CAS 覆蓋，沒搶到
// 就重讀最新狀態再試；資料庫完全沒有這筆（第一次挑戰）才直接寫入，沒有
// 「蓋掉別人進度」的風險（本來就是自己的 key）。
// 【方案A】同一賽季內的跨天重置才需要延續昨天的輪數：昨天擊敗了（clearedToday）
// 就 cycle+1（更難），沒擊敗就維持原本 cycle 重打一次；換季或第一次挑戰則從
// cycle 1 開始（s 不存在，或 seasonId 對不上，都不算「同一賽季的跨天」）。
async function ensureBossState(nickname, attempt){
  attempt = attempt || 0;
  if(attempt >= 8) throw new Error('ensureBossState contention exceeded retries');
  const {state: s, raw, updatedAt} = await loadPlayerBossStateRaw(nickname);
  const needsReset = !s || s.seasonId !== CURRENT_SEASON_ID || s.resetDate !== bossTodayStr();
  if(needsReset){
    const sameSeasonRollover = s && s.seasonId === CURRENT_SEASON_ID;
    const nextCycle = sameSeasonRollover ? (s.clearedToday ? (s.cycle||1) + 1 : (s.cycle||1)) : 1;
    const fresh = bossFreshState(nextCycle);
    if(raw){
      const applied = await savePlayerBossStateCAS(nickname, updatedAt, fresh);
      if(applied) return fresh;
      return ensureBossState(nickname, attempt + 1);
    }
    await savePlayerBossState(nickname, fresh);
    return fresh;
  }
  return s;
}
// 階段四：攻擊邏輯改寫 —— 用玩家裝備的 3 顆骰子取代原本的武器/飾品加成。
// 職業武器/飾品加成已不影響 Boss 戰，改為只在遠征生效（GM 後台對應設定已移除）；
// 這裡刻意不去讀 professionItems，Boss 戰的傷害完全由骰子決定。
// 注意：這裡呼叫的骰子相關 function（ensureDiceInventory / DICE_FACE_MULT 等）
// 在檔案稍後才定義，但因為都是 function 宣告會被提升（hoisted），提前呼叫沒有問題。
function rollDiceAttack(p, activeEvent, comboStreak, activeAffix){
  ensureDiceInventory(p);
  const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
  const rolls = equippedIds.map(id => {
    const dice = p.dice[id];
    const faceIdx = Math.floor(Math.random() * 6);
    const face = dice.faces[faceIdx];
    const mult = DICE_FACE_MULT[face.num] || 1;
    return {diceId: id, quality: dice.quality, face, damage: dice.baseAttack * mult};
  });
  let totalDamage = rolls.reduce((sum, r) => sum + r.damage, 0);
  // 面效果：3 顆骰子若同時開出多個帶效果的面，同時生效、疊加套用，影響整次攻擊的總傷害
  let atkBonus = 0, critRateBonus = 0, critDmgBonus = 0, flatDmgBonus = 0, comboBoostBonus = 0, contribBonusPct = 0, coinRefundChance = 0;
  rolls.forEach(r => {
    // 面數字固有加成（1~4 號的暴擊流路線）：擲到就保證觸發，跟下面隨機抽到的
    // 面效果各自獨立疊加。
    const numBonus = DICE_FACE_NUM_BONUS[r.face.num];
    if(numBonus){
      if(numBonus.critRate) critRateBonus += numBonus.critRate;
      if(numBonus.critDmg) critDmgBonus += numBonus.critDmg;
    }
    const eff = r.face.effect;
    if(!eff) return;
    if(eff.kind === 'atk') atkBonus += eff.value;
    else if(eff.kind === 'crit_rate') critRateBonus += eff.value;
    else if(eff.kind === 'crit_dmg') critDmgBonus += eff.value;
    else if(eff.kind === 'flat_dmg') flatDmgBonus += eff.value;
    else if(eff.kind === 'contrib_bonus') contribBonusPct += eff.value;
    else if(eff.kind === 'coin_refund') coinRefundChance += eff.value;
    else if(eff.kind === 'combo_boost') comboBoostBonus += eff.value;
    // 'wild' 沒有數值型加成，只影響下面 computeNumberCombo 的對子/豹子判定
  });
  // 🎉 萬能三連彩蛋：裝備的骰子這次「每一顆」都恰好擲出萬能面（機率很低，效果池權重
  // 只有 2/100，三顆同時中的機率極小）——保底觸發暴擊，並額外疊加一段固定暴擊傷害
  // 當作驚喜獎勵，跟其他來源的 critDmgBonus 用同一套機制累加，不是另開一條公式。
  const allWild = rolls.length >= DICE_EQUIP_SLOTS && rolls.every(r => r.face.effect && r.face.effect.kind === 'wild');
  if(allWild) critDmgBonus += TRIPLE_WILD_CRIT_DMG_BONUS;
  critRateBonus += starChartMoonCritRateBonus(p); // 🌙 星盤月亮節點：固定加成，不受骰子面效果封頂限制
  totalDamage += flatDmgBonus; // 固定傷害先加進基數，之後才吃百分比加成，這樣才「划算」
  if(atkBonus > 0) totalDamage *= (1 + atkBonus);
  let isCrit = critRateBonus > 0 && Math.random() < critRateBonus;
  if(allWild) isCrit = true; // 🎉 三顆全萬能保底觸發暴擊，不用擲機率
  if(isCrit) totalDamage *= (1 + critDmgBonus);
  // 組合加成：改為分級——2 顆骰子開出同號碼（對子）與 3 顆骰子開出同號碼（豹子）
  // 給不同倍率，只取最大重複次數對應的最高一階（不會疊加），只要裝備 ≥2 顆骰子
  // 就有機會觸發，不再要求一定要裝滿 3 顆才算數。萬能面（wild）視為與任何數字相同。
  const combo = computeNumberCombo(rolls);
  if(combo.mult > 1) totalDamage *= (combo.mult + comboBoostBonus);
  // 🔷 品質組合加成：跟上面的數字對子/豹子各自獨立判定，找到的話直接疊乘上去
  // （不吃 comboBoostBonus，那個效果面文案明確寫「觸發對子/豹子」指的是數字組合）。
  const qualityCombo = computeQualityCombo(rolls);
  if(qualityCombo.mult > 1) totalDamage *= qualityCombo.mult;
  // 🔥 連擊加成：依「這次攻擊之前」已經累積的連續組合命中次數（comboStreak）
  // 疊加額外傷害倍率，每級 +BOSS_COMBO_STREAK_BONUS_PER_HIT，封頂於 BOSS_COMBO_STREAK_CAP。
  // 這次攻擊本身是否觸發組合（進而讓下次攻擊的 streak +1）交給 resolveBossAttack 更新，
  // 這裡只負責讀取傳入的既有 streak 值來套用傷害加成，不做累加。
  const comboStreakBonus = Math.min((comboStreak||0) * BOSS_COMBO_STREAK_BONUS_PER_HIT, BOSS_COMBO_STREAK_CAP);
  if(comboStreakBonus > 0) totalDamage *= (1 + comboStreakBonus);
  // 金幣返還：多個效果面疊加時直接加總機率，但設上限避免疊到接近「打怪不用錢」。
  coinRefundChance = Math.min(coinRefundChance, 0.8);
  const coinRefunded = coinRefundChance > 0 && Math.random() < coinRefundChance;
  // ✨ 隨機事件效果：套用在最終傷害上（祝福/風暴為加成、迷霧為減損），並標記
  // 這次攻擊是否吃到事件效果，供 UI/訊息顯示；實際的 hitsLeft 遞減交給
  // resolveBossAttack 在 CAS 迴圈內處理（見該函式開頭），這裡只負責算傷害。
  let eventApplied = null;
  if(activeEvent){
    if(activeEvent.id === 'blessing'){
      totalDamage *= (1 + (activeEvent.value||0.30));
      isCrit = true;
      eventApplied = {id:'blessing'};
    } else if(activeEvent.id === 'storm'){
      totalDamage *= (1 + (activeEvent.value||0.25));
      eventApplied = {id:'storm'};
    } else if(activeEvent.id === 'fog'){
      totalDamage *= Math.max(0, 1 - (activeEvent.value||0.30));
      eventApplied = {id:'fog'};
    }
  }
  // 🎯 Boss 詞綴判定：以「整次攻擊」為單位——數字強化看這次擲出的骰面裡有沒有指定
  // 數字，爆擊強化看這次攻擊有沒有觸發暴擊；符合條件時，最終傷害額外 +BOSS_AFFIX_BONUS_PCT，
  // 不符合條件傷害維持正常（不打折），套用在其他加成都算完之後，是最後一道倍率。
  let affixResult = null;
  if(activeAffix){
    let met = false;
    if(activeAffix.type === 'weakness_number') met = rolls.some(r => r.face.num === activeAffix.num);
    else if(activeAffix.type === 'crit_only') met = isCrit;
    if(met) totalDamage *= (1 + BOSS_AFFIX_BONUS_PCT);
    affixResult = {type: activeAffix.type, met};
  }
  return {
    damage: Math.max(1, Math.round(totalDamage * starChartSunDamageMultiplier(p))), // ☀️ 星盤太陽節點：對最終傷害套倍率
    rolls, atkBonus, critRateBonus, critDmgBonus, isCrit, allWild,
    flatDmgBonus, comboBoostBonus, contribBonusPct, coinRefunded,
    comboTier: combo.tier, sameNumber: combo.tier === 'triple', // sameNumber 保留給舊程式相容，等同「豹子」
    qualityComboTier: qualityCombo.tier, // 🔷 品質對子/豹子（跟 comboTier 各自獨立），供 UI 顯示徽章用
    comboStreakUsed: comboStreak||0, comboStreakBonus,
    eventApplied, affixResult,
  };
}

// 計算「N 顆骰子開出相同數字」的組合加成：只看最大重複次數，2 顆同號=對子、
// 3 顆同號=豹子；只裝備 1 顆（或 0 顆）骰子時沒有比較基準，不會觸發。
// 萬能面（wild 效果）不看自己的數字，直接算進目前最大的那一組，等同「百搭」。
function computeNumberCombo(rolls){
  if(rolls.length < 2) return {tier:null, mult:1};
  let wildCount = 0;
  const counts = {};
  rolls.forEach(r => {
    if(r.face.effect && r.face.effect.kind === 'wild'){ wildCount++; return; }
    counts[r.face.num] = (counts[r.face.num]||0) + 1;
  });
  const values = Object.values(counts);
  let maxCount = (values.length ? Math.max(...values) : 0) + wildCount;
  maxCount = Math.min(maxCount, rolls.length);
  if(maxCount >= 3) return {tier:'triple', mult: DICE_COMBO_MULT.triple};
  if(maxCount === 2) return {tier:'pair', mult: DICE_COMBO_MULT.pair};
  return {tier:null, mult:1};
}

// 🔷 計算「N 顆骰子品質相同」的套裝加成：只看最大重複次數，2 顆同品質=品質對子、
// 3 顆同品質=品質豹子；跟 computeNumberCombo 的數字判定完全獨立、不互相影響，
// 沒有萬能面這種例外（品質是固定屬性，不像數字面每次擲骰才決定）。只裝備
// 1 顆（或 0 顆）骰子時沒有比較基準，不會觸發。
function computeQualityCombo(rolls){
  if(rolls.length < 2) return {tier:null, mult:1};
  const counts = {};
  rolls.forEach(r => { counts[r.quality] = (counts[r.quality]||0) + 1; });
  const maxCount = Math.max(...Object.values(counts));
  if(maxCount >= 3) return {tier:'triple', mult: DICE_QUALITY_COMBO_MULT.triple};
  if(maxCount === 2) return {tier:'pair', mult: DICE_QUALITY_COMBO_MULT.pair};
  return {tier:null, mult:1};
}

// 核心：用樂觀鎖 (CAS) 處理單次攻擊對「自己這份」boss 狀態的讀-改-寫。
// 每次重試都會重新讀取「當下最新」的自己 boss 狀態並在其基礎上扣血/判斷
// 破關，只有寫入當下狀態仍等於自己讀到的那份時才會成功；沒搶到（例如手滑
// 短時間內連點一般爆發+超爆發交錯送出）會立刻重讀最新狀態、在最新進度上
// 重新計算後再試一次，而不是直接拿舊快照覆蓋，因此不會發生進度倒退。
// 👹 小怪：若目前有存活小怪，這次攻擊的傷害優先打在小怪身上；打不死則剩餘
// （溢出）傷害才繼續打 Boss。小怪被打死後，沒有存活小怪時才有機會刷出新的
// 一隻（不會同時存在 2 隻）。實際的金幣獎勵留給呼叫端用 minionResult
// 另外走 updatePlayerCAS 發放，這裡只負責 boss/小怪血量本身的讀-改-寫。
async function resolveBossAttack(nickname, damage, comboTier){
  for(let attempt = 0; attempt < 8; attempt++){
    const {state: boss, raw, updatedAt} = await loadPlayerBossStateRaw(nickname);
    if(!boss || !raw){
      await ensureBossState(nickname);
      continue;
    }
    if(boss.hp <= 0) continue; // 理論上不會出現（結算與重置在同一次寫入內完成），保底重試
    const newBoss = {...boss};
    // ✨ 這次攻擊若吃到持續生效型事件（祝福/風暴/迷霧），消耗 1 次；歸零後自動清除。
    // 傷害本身已經在呼叫端 rollDiceAttack 算好套用了，這裡只負責更新剩餘次數。
    if(newBoss.activeEvent){
      const ae = {...newBoss.activeEvent, hitsLeft: newBoss.activeEvent.hitsLeft - 1};
      newBoss.activeEvent = ae.hitsLeft > 0 ? ae : null;
    }
    // 🔥 連擊：這次攻擊若開出對子/豹子（comboTier 非 null）就累加連擊數，
    // 沒開出則整個歸零重來——傷害本身已經在呼叫端 rollDiceAttack 用「攻擊前」
    // 的 streak 值算好套用了，這裡只負責更新給「下一次攻擊」使用的 streak。
    // 封頂存值：超過封頂加成所需的次數後再累加也沒有實際效果，避免顯示一個
    // 意義不大的巨大數字。
    const comboStreakCapCount = BOSS_COMBO_STREAK_BONUS_PER_HIT > 0
      ? Math.ceil(BOSS_COMBO_STREAK_CAP / BOSS_COMBO_STREAK_BONUS_PER_HIT)
      : Infinity;
    newBoss.comboStreak = (comboTier === 'pair' || comboTier === 'triple')
      ? Math.min((boss.comboStreak||0) + 1, comboStreakCapCount)
      : 0;
    let bossDamage = damage;
    let minionResult = null; // 給呼叫端顯示訊息/發獎用：{typeId, killed, hp, maxHp}
    if(newBoss.minion){
      const minion = {...newBoss.minion};
      const minionDamage = Math.min(bossDamage, minion.hp);
      minion.hp -= minionDamage;
      bossDamage -= minionDamage; // 只有打死小怪後還剩的傷害，才會繼續打 Boss
      if(minion.hp <= 0){
        minionResult = {typeId: minion.typeId, killed: true};
        newBoss.minion = null;
      } else {
        minionResult = {typeId: minion.typeId, killed: false, hp: minion.hp, maxHp: minion.maxHp};
        newBoss.minion = minion;
      }
    }
    let minionSpawned = null;
    if(!newBoss.minion && Math.random() < BOSS_MINION_SPAWN_CHANCE){
      minionSpawned = spawnBossMinion(newBoss.cycle);
      newBoss.minion = minionSpawned;
    }
    newBoss.hp = Math.max(0, boss.hp - bossDamage);
    newBoss.cycleDamage = (boss.cycleDamage||0) + bossDamage;
    let cycleCompleteFor = null;
    let eventTriggered = null; // ✨ 這次攻擊若打進了新階段/新一輪，這裡記錄新抽到的事件卡（供顯示/發獎用）
    if(newBoss.hp <= 0){
      if(newBoss.stage < 3){
        newBoss.stage += 1;
        newBoss.maxHp = bossStageMaxHp(newBoss.stage, newBoss.cycle);
        newBoss.hp = newBoss.maxHp;
        eventTriggered = maybeTriggerBossEvent(newBoss); // 詛咒會就地調整剛設好的 maxHp/hp
      } else {
        // 🌀 全破三階＝擊殺一次。今日擊殺次數 +1；還沒到每日上限就立刻在原地重生下一隻
        // （新 cycle、階段重置回第1階、機率重抽詞綴），達到上限才鎖到隔天 00:00。
        cycleCompleteFor = newBoss.cycle;
        const killCount = (boss.killCount||0) + 1;
        if(killCount >= BOSS_MAX_DAILY_KILLS){
          newBoss.hp = 0;
          newBoss.killCount = killCount;
          newBoss.clearedToday = true; // 今日已達擊殺上限，鎖定攻擊直到隔日重置（見 ensureBossState 的 resetDate 判斷）
        } else {
          const fresh = bossFreshState(newBoss.cycle + 1, killCount);
          Object.assign(newBoss, fresh);
        }
      }
    }
    const applied = await savePlayerBossStateCAS(nickname, updatedAt, newBoss);
    if(applied) return {prevBoss: boss, newBoss, cycleCompleteFor, minionResult, minionSpawned, eventTriggered};
    // 沒搶到：這段期間已經有另一次攻擊先寫入了，回到迴圈開頭重讀最新狀態再試
  }
  throw new Error('boss state contention exceeded retries');
}

// 小怪被擊殺時發放獎勵：跟 Boss 破台獎勵一樣走 CAS 安全寫入玩家資料，避免跟
// 同時間其他資料寫入（例如剛好在買賣、拆解骰子）互相蓋掉。獎勵金額每次擊殺
// 現場隨機（在該小怪種類的區間內），不放進 resolveBossAttack 的 CAS 迴圈裡，
// 這樣即使 boss 狀態那邊重試好幾輪，獎勵也只會真的計算、發放一次。
async function grantBossMinionReward(nickname, minionTypeId){
  const meta = BOSS_MINION_TYPES.find(m => m.id === minionTypeId) || BOSS_MINION_TYPES[0];
  const rewardCoins = Math.round(meta.rewardCoinsMin + Math.random() * (meta.rewardCoinsMax - meta.rewardCoinsMin));
  // 💠 精華掉落機率/數量獨立於金幣，兩者可能同時發放（見 BOSS_MINION_TYPES 的 essence* 欄位）
  let rewardEssence = 0;
  if(Math.random() < (meta.essenceChance||0)){
    rewardEssence = Math.round(meta.essenceMin + Math.random() * (meta.essenceMax - meta.essenceMin));
  }
  const applied = await updatePlayerCAS(nickname, (player)=>{
    ensureMaterials(player);
    player.coins = (player.coins||0) + rewardCoins;
    if(rewardEssence > 0) player.materials.diceEssence = (player.materials.diceEssence||0) + rewardEssence;
  });
  if(!applied) return null; // 玩家不存在（理論上不會發生，保底）
  return {coins: rewardCoins, essence: rewardEssence, player: applied}; // 把 CAS 寫入成功後的完整玩家物件一起回傳，
  // 呼叫端可以直接拿來更新 state.player，不用再多打一次可能失敗的 loadPlayer
}
// 💠 每破一階（非全破）發放的骰子精華，跟小怪/寶箱獨立，走自己的 CAS 更新。
async function grantBossStageEssence(nickname, cycle){
  const essence = bossCurrentStageEssence(cycle);
  if(essence <= 0) return {essence: 0};
  const applied = await updatePlayerCAS(nickname, (player)=>{
    ensureMaterials(player);
    player.materials.diceEssence = (player.materials.diceEssence||0) + essence;
  });
  if(!applied) return null;
  return {essence, player: applied};
}

// ✨ 隨機事件（寶箱／詛咒）獎勵發放：金額已經在 maybeTriggerBossEvent 觸發當下
// 算好並存在 eventTriggered.coins 裡（跟著那次成功寫入的 boss 狀態一起
// 決定，不會因為 resolveBossAttack 重試而重複算錢），這裡只是照抄那個數字用
// CAS 安全地加進玩家資料，寫法跟 grantBossMinionReward 一致。
async function grantBossEventReward(nickname, eventTriggered){
  const rewardCoins = eventTriggered.coins || 0;
  if(rewardCoins <= 0) return {coins:0};
  const applied = await updatePlayerCAS(nickname, (player)=>{
    ensureMaterials(player);
    player.coins = (player.coins||0) + rewardCoins;
  });
  if(!applied) return null; // 玩家不存在（理論上不會發生，保底）
  return {coins: rewardCoins, player: applied};
}

// 單人模式破台獎勵：不用再等全服結算、不跟別人分獎池，直接全額發給自己
// （這在數學上等同舊版「依貢獻比例分配」公式中只有自己一位玩家的極限情況：
// share = 自己的點數 / 自己的點數 = 100%）。
async function settleBossReward(nickname, cycle){
  const baseReward = bossCurrentBaseReward(cycle);
  const bonusPool = bossCurrentBonusPool(cycle);
  const rewardCoins = baseReward.coins + bonusPool.coins;
  const rewardEssence = bossCurrentClearEssence(cycle); // 💠 全破三階的通關加碼精華
  // 用 CAS 安全地把獎勵加上去：即使玩家這一刻剛好也在收成、買賣而觸發別的
  // 存檔動作，這裡的重試機制都會在「當下最新」的資料上重新加總，不會被
  // 互相蓋掉。
  const applied = await updatePlayerCAS(nickname, (player)=>{
    player.coins = (player.coins||0) + rewardCoins;
    ensureMaterials(player);
    player.materials.diceEssence = (player.materials.diceEssence||0) + rewardEssence;
  });
  if(!applied) return null; // 玩家不存在（理論上不會發生，保底）
  // 只有在確定獎勵真的寫進玩家資料後才發通知，避免「恭喜獲得獎勵」的通知
  // 先到，但錢包/背包其實沒真的加到的情況。
  await createNotification(nickname, 'system', 'boss_reward', {coins: rewardCoins, essence: rewardEssence});
  return {coins: rewardCoins, essence: rewardEssence, player: applied};
}
// 🎁 寶箱選擇（階段C）：先把 boss 狀態的 pendingChest 標記清掉（CAS，避免跟同一時間
// 的攻擊/其他寶箱請求互相覆蓋），成功後才真正發放玩家選的那份獎勵。
async function clearBossPendingChest(nickname){
  for(let attempt = 0; attempt < 8; attempt++){
    const {state: boss, raw, updatedAt} = await loadPlayerBossStateRaw(nickname);
    if(!boss || !raw) return null;
    if(!boss.pendingChest) return boss; // 已經被清掉（例如手滑連點两次選擇按鈕），視為成功
    const newBoss = {...boss, pendingChest: false};
    const applied = await savePlayerBossStateCAS(nickname, updatedAt, newBoss);
    if(applied) return newBoss;
    // 沒搶到：重讀最新狀態再試
  }
  throw new Error('clear pending chest contention exceeded retries');
}
// choice: 'coins' | 'essence' | 'material'。材料寶箱掉落玩家「目前生效中職業」對應的材料，
// 若玩家還沒選職業，退而求其次隨機給一種（藥草/礦石/木料），避免發一個完全用不到的空獎勵。
// 🎁 寶箱盲選：3 個寶箱位置對應的實際獎勵類型是隨機洗牌過的，玩家看不到內容，
// 只能憑感覺選一個。用 cycle+stage 當 key 快取洗牌結果，確保同一個寶箱在畫面
// 多次重繪（例如輪詢）之間位置不會跳動，只有進到新的階段/輪次才會重新洗牌。
let bossChestShuffleCache = {key: null, order: null};
function getBossChestShuffleOrder(boss){
  const key = `${boss.cycle}-${boss.stage}`;
  if(bossChestShuffleCache.key !== key){
    const order = ['coins','essence','material'];
    for(let i=order.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    bossChestShuffleCache = {key, order};
  }
  return bossChestShuffleCache.order;
}
async function resolveBossChestChoice(nickname, choice){
  const clearedBoss = await clearBossPendingChest(nickname);
  if(!clearedBoss) return null; // 玩家不存在（理論上不會發生，保底）
  if(choice === 'coins'){
    const coins = Math.round(BOSS_TREASURE_COINS.min + Math.random() * (BOSS_TREASURE_COINS.max - BOSS_TREASURE_COINS.min));
    const applied = await updatePlayerCAS(nickname, (player)=>{
      player.coins = (player.coins||0) + coins;
    });
    if(!applied) return null;
    return {choice, coins, player: applied};
  }
  if(choice === 'essence'){
    const essence = Math.round(BOSS_CHEST_ESSENCE.min + Math.random() * (BOSS_CHEST_ESSENCE.max - BOSS_CHEST_ESSENCE.min));
    const applied = await updatePlayerCAS(nickname, (player)=>{
      ensureMaterials(player);
      player.materials.diceEssence = (player.materials.diceEssence||0) + essence;
    });
    if(!applied) return null;
    return {choice, essence, player: applied};
  }
  if(choice === 'material'){
    const qty = Math.round(BOSS_CHEST_MATERIAL_QTY.min + Math.random() * (BOSS_CHEST_MATERIAL_QTY.max - BOSS_CHEST_MATERIAL_QTY.min));
    let materialId = null;
    const applied = await updatePlayerCAS(nickname, (player)=>{
      ensureProfession(player);
      materialId = player.profession ? professionDef(player.profession).materialId
        : PROFESSION_MATERIAL_IDS[Math.floor(Math.random() * PROFESSION_MATERIAL_IDS.length)];
      player.professionMaterials[materialId] = (player.professionMaterials[materialId]||0) + qty;
    });
    if(!applied) return null;
    return {choice, materialId, qty, player: applied};
  }
  return null;
}

// 階段六：HP 條「殘影慢半拍追上」+ 受擊閃光/立繪震動。都是純 DOM 操作，不碰 state，
// 每次攻擊 render() 完之後呼叫一次即可；沒有對應的 DOM（例如面板還沒渲染出來、
// 或這次沒有殘影可播）就靜靜跳過，不丟例外。
function animateHpGhostBar(fillId, ghostId, fromPct, toPct){
  const fillEl = document.getElementById(fillId);
  const ghostEl = document.getElementById(ghostId);
  if(!fillEl || !ghostEl) return;
  const clampedFrom = Math.max(0, Math.min(100, fromPct));
  const clampedTo = Math.max(0, Math.min(100, toPct));
  // 前景條（實色）：立刻跳到新血量，打擊當下馬上看到掉了多少。
  fillEl.style.width = clampedTo + '%';
  // 殘影條（半透明白）：先無過場地定格在「打之前」的寬度，強制 reflow 後才套上
  // 過場動畫慢慢縮到新寬度——這段延遲追趕就是「殘影」，兩條疊在一起看起來才有重量。
  ghostEl.style.transition = 'none';
  ghostEl.style.width = clampedFrom + '%';
  void ghostEl.offsetWidth; // 強制 reflow，讓瀏覽器先畫出舊寬度再接上過場
  ghostEl.style.transition = 'width .6s cubic-bezier(.22,.85,.32,1) .12s';
  ghostEl.style.width = clampedTo + '%';
}
function playHitImpactFx(opts){
  opts = opts || {};
  if(opts.portraitId){
    const img = document.getElementById(opts.portraitId);
    if(img){
      img.classList.remove('boss-portrait-shake');
      void img.offsetWidth;
      img.classList.add('boss-portrait-shake');
    }
  }
  if(opts.trackId){
    const track = document.getElementById(opts.trackId);
    if(track){
      const flash = document.createElement('div');
      flash.className = 'hp-hit-flash' + (opts.crit ? ' crit' : '');
      track.appendChild(flash);
      setTimeout(()=>flash.remove(), 600);
    }
  }
}

// 階段五：擲骰動畫。真正的骰子結果（burst）在動畫開始前就已經算好（rollDiceAttack
// 是純運算、無副作用），動畫只是「開獎」式地把已經決定好的數字揭曉出來，
// 不會出現動畫播完後結果又變的情況。用 #dice-roll-anim 容器直接操作 DOM，
// 全程不呼叫 renderTab()，避免整個 Boss 面板重繪把動畫打斷。
function playDiceRollAnimation(diceObjs, burst, stageId, btnId){
  const stage = document.getElementById(stageId || 'dice-roll-anim');
  const btn = document.getElementById(btnId || 'boss-burst-btn');
  if(!stage || diceObjs.length === 0){
    return Promise.resolve(); // 沒有動畫容器（理論上不會發生）或沒裝備骰子時直接跳過
  }
  return new Promise(resolve=>{
    if(btn){ btn.disabled = true; btn.style.display = 'none'; }
    stage.style.display = 'flex';
    stage.innerHTML = diceObjs.map((d, i)=>{
      const meta = DICE_QUALITY_META[d.quality];
      return `<div class="dice-roll-die" id="dice-roll-die-${i}" style="border-color:${meta.color};color:${meta.color};animation-delay:${i*40}ms;">?</div>`;
    }).join('');
    const dieEls = diceObjs.map((_,i)=>document.getElementById(`dice-roll-die-${i}`));
    const spin = setInterval(()=>{
      dieEls.forEach(el=>{ if(el) el.textContent = String(1 + Math.floor(Math.random()*6)); });
    }, 80);
    setTimeout(()=>{
      clearInterval(spin);
      burst.rolls.forEach((r, i)=>{
        const el = dieEls[i];
        if(!el) return;
        el.style.animation = 'none';
        void el.offsetWidth; // 強制重新觸發 settle 動畫（重設 animation 需要先讓瀏覽器讀到 'none'）
        el.classList.add('settled');
        el.textContent = String(r.face.num);
        if(r.face.effect) el.classList.add('has-effect');
        // 對子/豹子開出時，讓每顆骰子跟著脈動發光，呼應暴擊般的視覺衝擊
        if(burst.comboTier === 'triple') el.classList.add('combo-glow-triple');
        else if(burst.comboTier === 'pair') el.classList.add('combo-glow-pair');
      });
      if(burst.comboTier === 'triple' || burst.comboTier === 'pair'){
        const flash = document.createElement('div');
        flash.className = `dice-roll-flash ${burst.comboTier}`;
        stage.insertBefore(flash, stage.firstChild);
      }
      const badges = [];
      if(burst.allWild) badges.push(`<span class="dice-roll-badge allwild">${tt(`🎉 萬能三連！暴擊傷害+${Math.round(TRIPLE_WILD_CRIT_DMG_BONUS*100)}%`, `🎉 Triple Wild! Crit dmg +${Math.round(TRIPLE_WILD_CRIT_DMG_BONUS*100)}%`)}</span>`);
      if(burst.comboTier === 'triple') badges.push(`<span class="dice-roll-badge triple">${tt('🎯 豹子 ×2！','🎯 Triple ×2!')}</span>`);
      else if(burst.comboTier === 'pair') badges.push(`<span class="dice-roll-badge pair">${tt(`✌️ 對子 ×${DICE_COMBO_MULT.pair}！`, `✌️ Pair ×${DICE_COMBO_MULT.pair}!`)}</span>`);
      // 🔷 品質對子/豹子跟上面數字對子/豹子各自獨立判定，兩者可能同時出現（例如
      // 3 顆 epic 骰同時開出同一個數字），所以用獨立的 if（不是 else if）接在後面。
      if(burst.qualityComboTier === 'triple') badges.push(`<span class="dice-roll-badge quality">${tt(`🔷 品質豹子 ×${DICE_QUALITY_COMBO_MULT.triple}！`, `🔷 Quality Triple ×${DICE_QUALITY_COMBO_MULT.triple}!`)}</span>`);
      else if(burst.qualityComboTier === 'pair') badges.push(`<span class="dice-roll-badge quality">${tt(`🔷 品質對子 ×${DICE_QUALITY_COMBO_MULT.pair}！`, `🔷 Quality Pair ×${DICE_QUALITY_COMBO_MULT.pair}!`)}</span>`);
      if(burst.isCrit) badges.push(`<span class="dice-roll-badge crit">${tt('💥 暴擊！','💥 Critical!')}</span>`);
      if(badges.length){
        const wrap = document.createElement('div');
        wrap.className = 'dice-roll-badges';
        wrap.style.position = 'relative';
        wrap.style.zIndex = '1';
        wrap.innerHTML = badges.join('');
        stage.appendChild(wrap);
      }
      setTimeout(()=>{
        // 🎲 骰子畫面不再自動收掉：讓開出的結果留在畫面上，直到玩家按下一次攻擊
        // 才會被新一輪的擲骰畫面換掉（下面 renderSettledDiceHtml 負責在重繪/翻頁後
        // 把同一組結果原樣畫回來，避免像之前那樣被整段重繪清空）。
        if(btn){ btn.style.display = ''; }
        resolve();
      }, badges.length ? 750 : 450);
    }, 900);
  });
}

// 把「已經開獎」的骰子結果直接畫成 settled 狀態的靜態 HTML（不重播擲骰動畫），
// 給 render 模板在重繪整個面板時使用，讓上一次攻擊的骰子畫面能原樣保留在畫面上，
// 而不是每次重繪都被换成空的、隱藏的容器。跟 playDiceRollAnimation 收尾時產生的
// DOM 結構刻意保持一致，看起來才會像同一個東西只是沒有播放動畫。
function renderSettledDiceHtml(rolls, comboTier, qualityComboTier, allWild, isCrit){
  if(!rolls || rolls.length === 0) return '';
  const diceHtml = rolls.map(r=>{
    const meta = DICE_QUALITY_META[r.quality];
    const comboClass = comboTier === 'triple' ? ' combo-glow-triple' : comboTier === 'pair' ? ' combo-glow-pair' : '';
    const effectClass = r.face.effect ? ' has-effect' : '';
    return `<div class="dice-roll-die settled${effectClass}${comboClass}" style="border-color:${meta.color};color:${meta.color};">${r.face.num}</div>`;
  }).join('');
  const badges = [];
  if(allWild) badges.push(`<span class="dice-roll-badge allwild">${tt(`🎉 萬能三連！暴擊傷害+${Math.round(TRIPLE_WILD_CRIT_DMG_BONUS*100)}%`, `🎉 Triple Wild! Crit dmg +${Math.round(TRIPLE_WILD_CRIT_DMG_BONUS*100)}%`)}</span>`);
  if(comboTier === 'triple') badges.push(`<span class="dice-roll-badge triple">${tt('🎯 豹子 ×2！','🎯 Triple ×2!')}</span>`);
  else if(comboTier === 'pair') badges.push(`<span class="dice-roll-badge pair">${tt(`✌️ 對子 ×${DICE_COMBO_MULT.pair}！`, `✌️ Pair ×${DICE_COMBO_MULT.pair}!`)}</span>`);
  if(qualityComboTier === 'triple') badges.push(`<span class="dice-roll-badge quality">${tt(`🔷 品質豹子 ×${DICE_QUALITY_COMBO_MULT.triple}！`, `🔷 Quality Triple ×${DICE_QUALITY_COMBO_MULT.triple}!`)}</span>`);
  else if(qualityComboTier === 'pair') badges.push(`<span class="dice-roll-badge quality">${tt(`🔷 品質對子 ×${DICE_QUALITY_COMBO_MULT.pair}！`, `🔷 Quality Pair ×${DICE_QUALITY_COMBO_MULT.pair}!`)}</span>`);
  if(isCrit) badges.push(`<span class="dice-roll-badge crit">${tt('💥 暴擊！','💥 Critical!')}</span>`);
  const badgesHtml = badges.length ? `<div class="dice-roll-badges" style="position:relative;z-index:1;">${badges.join('')}</div>` : '';
  return diceHtml + badgesHtml;
}

// 攻擊流程：擲 3 顆骰子取代原本的「一般爆發／超爆發」雙按鈕設計。
// 攻擊消耗金幣：預設固定扣 BOSS_COIN_COST，但骰子若開出「金幣返還」效果面，
// 這次攻擊有機率不扣（見 burst.coinRefunded）；CAS 重試、貢獻結算、
// 破關發獎、UI 訊息與階段二/三完全共用。
async function performBossAttack(){
  const p = state.player;
  ensureMaterials(p);
  ensureDiceInventory(p);
  const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
  if(equippedIds.length === 0){
    showToast(tt('請先到「骰子」分頁裝備至少 1 顆骰子', 'Equip at least 1 die in the Dice tab first'));
    return;
  }
  const cost = BOSS_COIN_COST;
  if(p.coins < cost){
    showToast(tt(`金幣不足，需要 ${cost}`, `Not enough coins, need ${cost}`));
    return;
  }
  // ✨ 先確保/讀取今日 Boss 狀態，才知道目前是否有生效中的隨機事件（祝福/風暴/迷霧）
  // 要套用到這次攻擊上；接著才算出這次攻擊的真實結果（純運算，無副作用），
  // 動畫只負責把它「揭曉」出來。
  const currentBoss = await ensureBossState(p.nickname);
  if(currentBoss.clearedToday){
    showToast(tt(`今日已達擊殺上限（${BOSS_MAX_DAILY_KILLS} 次），請明天再來挑戰！`, `You've reached today's kill limit (${BOSS_MAX_DAILY_KILLS}) - come back tomorrow!`));
    return;
  }
  const burst = rollDiceAttack(p, currentBoss.activeEvent, currentBoss.comboStreak||0, currentBoss.activeAffix);
  await playDiceRollAnimation(equippedIds.map(id => p.dice[id]), burst);

  if(!burst.coinRefunded){
    p.coins -= cost; // 觸發「金幣返還」效果時這次攻擊不扣金幣
  }
  const contribGain = Math.round(burst.damage * BOSS_CONTRIB_RATE * (1 + (burst.contribBonusPct||0)) * starChartContribMultiplier(p)); // 貢獻點依「實際造成的傷害」計算，骰子加成的傷害、貢獻點加成面效果與星盤風象加成都會反映在這裡
  p.materials.contrib += contribGain; // 賽季總貢獻點（可花費，賽季結束才歸零）
  const bossStats = ensureStats(p);
  bossStats.maxBossHitDamage = Math.max(bossStats.maxBossHitDamage||0, burst.damage); // 單擊最高傷害（永久紀錄最高值，用於排行榜／稱號，不隨賽季重置）
  bumpQuest(p, 'boss_attack', 1);
  await savePlayer(p);

  let result;
  try{
    result = await resolveBossAttack(p.nickname, burst.damage, burst.comboTier);
  }catch(e){
    showToast(tt('Boss 狀態忙碌中，請稍後再試','Boss state is busy, try again shortly'));
    renderTab();
    updateHeaderCoins();
    return;
  }
  const { prevBoss, newBoss, cycleCompleteFor, minionResult, minionSpawned, eventTriggered } = result;

  // 🔊 打擊感：記下這次攻擊「前」跟「後」的血量百分比，交給 renderBoss 在下次渲染完
  // 之後拿去播殘影追趕動畫。只在同一階段/同一輪內才播——一旦破階或全破，血量池
  // 本身換了一組（新階段滿血 or 明天才重置），殘影動畫套在上面只會很奇怪，直接跳過。
  state.bossHpAnim = (newBoss.stage === prevBoss.stage && newBoss.cycle === prevBoss.cycle) ? {
    fromPct: Math.max(0, Math.min(100, (prevBoss.hp/prevBoss.maxHp)*100)),
    stage: newBoss.stage,
    cycle: newBoss.cycle,
    crit: burst.isCrit,
  } : null;

  // 👹 小怪擊殺獎勵：獨立於 Boss 破台獎勵，用自己的 CAS 更新玩家資料，不影響
  // 上面已經寫入的 state.player（擊殺當下先算好）；CAS 回傳的物件本身就是寫入
  // 成功後的最新玩家資料，直接沿用即可，不用再多打一次可能失敗的 loadPlayer。
  let minionReward = null;
  if(minionResult && minionResult.killed){
    minionReward = await grantBossMinionReward(p.nickname, minionResult.typeId);
    if(minionReward && minionReward.player) state.player = minionReward.player;
  }

  // ✨ 事件卡獎勵：詛咒的補償金幣走 CAS 獨立發放，不影響已寫入的 state.player；
  // 寶箱（treasure）改成階段C的「待選擇」流程，不在這裡自動發獎——實際獎勵要
  // 等玩家在 Boss 分頁 3 選 1 之後才由 resolveBossChestChoice 發放；
  // 祝福/風暴/迷霧是 buff/debuff，同樣不會走到這裡發獎，純粹顯示用。
  let eventReward = null;
  if(eventTriggered && eventTriggered.id === 'curse'){
    eventReward = await grantBossEventReward(p.nickname, eventTriggered);
    if(eventReward && eventReward.player) state.player = eventReward.player;
  }

  let defeatMsg = '';
  if(cycleCompleteFor){
    const reward = await settleBossReward(p.nickname, cycleCompleteFor);
    if(newBoss.clearedToday){
      defeatMsg = tt(`🎉 你擊敗了「終焉蛇神」！獲得 ✦${reward?reward.coins:0} 金幣、💠${reward?reward.essence:0} 骰子精華，今日已達擊殺上限（${newBoss.killCount}/${BOSS_MAX_DAILY_KILLS}），明天再來挑戰新一輪（更難）！`, `🎉 You defeated the Doomsday Serpent God! Gained ✦${reward?reward.coins:0} coins and 💠${reward?reward.essence:0} Dice Essence. You've reached today's kill limit (${newBoss.killCount}/${BOSS_MAX_DAILY_KILLS}) - come back tomorrow for a new (harder) cycle!`);
    } else {
      defeatMsg = tt(`🎉 你擊敗了「終焉蛇神」！獲得 ✦${reward?reward.coins:0} 金幣、💠${reward?reward.essence:0} 骰子精華，今日已擊殺 ${newBoss.killCount}/${BOSS_MAX_DAILY_KILLS} 次，Boss 立刻重生了，繼續挑戰更難的一輪！`, `🎉 You defeated the Doomsday Serpent God! Gained ✦${reward?reward.coins:0} coins and 💠${reward?reward.essence:0} Dice Essence. Kills today: ${newBoss.killCount}/${BOSS_MAX_DAILY_KILLS} - the Boss respawned immediately, tougher than before!`);
    }
    if(reward && reward.player) state.player = reward.player;
  } else if(newBoss.stage > prevBoss.stage){
    // 💠 每破一階（非全破）額外發放骰子精華，跟金幣/事件獎勵各自獨立走 CAS
    const stageEssenceReward = await grantBossStageEssence(p.nickname, newBoss.cycle);
    if(stageEssenceReward && stageEssenceReward.player) state.player = stageEssenceReward.player;
    defeatMsg = tt(`⚔️ 「${BOSS_STAGE_META[newBoss.stage-2].label}」被擊破！Boss 進入「${BOSS_STAGE_META[newBoss.stage-1].label}」！${stageEssenceReward?`　💠精華 +${stageEssenceReward.essence}`:''}`, `⚔️ "${BOSS_STAGE_META[newBoss.stage-2].labelEn}" defeated! The Boss enters "${BOSS_STAGE_META[newBoss.stage-1].labelEn}"!${stageEssenceReward?`  💠Essence +${stageEssenceReward.essence}`:''}`);
  }

  state.bossLastAttack = {damage: burst.damage, contrib: contribGain, rolls: burst.rolls, comboTier: burst.comboTier, sameNumber: burst.sameNumber, qualityComboTier: burst.qualityComboTier, allWild: burst.allWild, isCrit: burst.isCrit, eventApplied: burst.eventApplied, comboStreakUsed: burst.comboStreakUsed, comboStreakBonus: burst.comboStreakBonus, comboStreakAfter: newBoss.comboStreak};
  checkAchievementUnlocks(state.player);
  renderTab();
  updateHeaderCoins();
  // 👹 小怪這次攻擊的結果（打傷/擊殺/新出現），附加在後面一起顯示，不管這次
  // 攻擊本身是不是同時打出了 Boss 階段/輪次的結算訊息都要提到。
  let minionMsgPart = '';
  if(minionResult){
    const meta = BOSS_MINION_TYPES.find(m => m.id === minionResult.typeId) || BOSS_MINION_TYPES[0];
    if(minionResult.killed){
      minionMsgPart += tt(`　💀擊殺了「${meta.labelZh}」！獲得 ✦${minionReward?minionReward.coins:0}`, `　💀Defeated the ${meta.labelEn}! Gained ✦${minionReward?minionReward.coins:0}`);
    } else {
      minionMsgPart += tt(`　🗡️「${meta.labelZh}」剩餘 ${minionResult.hp}/${minionResult.maxHp} HP`, `　🗡️${meta.labelEn} at ${minionResult.hp}/${minionResult.maxHp} HP`);
    }
  }
  if(minionSpawned){
    const spawnMeta = BOSS_MINION_TYPES.find(m => m.id === minionSpawned.typeId) || BOSS_MINION_TYPES[0];
    minionMsgPart += tt(`　👹一隻「${spawnMeta.labelZh}」出現了！`, `　👹A ${spawnMeta.labelEn} appeared!`);
  }
  // ✨ 事件相關訊息：這次攻擊「吃到」了持續生效型事件的加成/減損（eventApplied），
  // 以及這次攻擊「打進新階段」因而重新抽到的事件卡（eventTriggered），兩者互相獨立、
  // 同一次攻擊有可能同時出現（例如：吃到風暴的最後一次加成，同時又打穿階段抽到新事件）。
  let eventMsgPart = '';
  if(burst.eventApplied){
    const meta = BOSS_EVENT_TYPES.find(e => e.id === burst.eventApplied.id);
    if(meta) eventMsgPart += tt(`　${meta.icon}「${meta.labelZh}」生效中！`, `　${meta.icon}${meta.labelEn} in effect!`);
  }
  if(eventTriggered){
    const meta = BOSS_EVENT_TYPES.find(e => e.id === eventTriggered.id);
    if(meta){
      if(eventTriggered.id === 'treasure'){
        eventMsgPart += tt(`　${meta.icon}觸發「${meta.labelZh}」！請到下方選擇要開啟的獎勵`, `　${meta.icon}${meta.labelEn} triggered! Choose your reward below`);
      } else if(eventTriggered.id === 'curse'){
        eventMsgPart += tt(`　${meta.icon}觸發「${meta.labelZh}」！本階段血量 +20%，補償 ✦${eventReward?eventReward.coins:0}`, `　${meta.icon}${meta.labelEn} triggered! This stage's HP +20%, compensation ✦${eventReward?eventReward.coins:0}`);
      } else {
        eventMsgPart += tt(`　${meta.icon}新階段出現「${meta.labelZh}」：${meta.descZh}`, `　${meta.icon}New stage event: ${meta.descEn}`);
      }
    }
  }
  if(defeatMsg){
    showToast(defeatMsg + minionMsgPart + eventMsgPart);
  } else {
    const diceTag = burst.rolls.map(r => r.face.num).join('·');
    const bonusTags = [];
    if(burst.allWild) bonusTags.push(tt('🎉萬能三連','🎉Triple Wild'));
    if(burst.comboTier === 'triple') bonusTags.push(tt('🎯豹子×2','🎯Triple×2'));
    else if(burst.comboTier === 'pair') bonusTags.push(tt(`✌️對子×${DICE_COMBO_MULT.pair}`, `✌️Pair×${DICE_COMBO_MULT.pair}`));
    if(burst.qualityComboTier === 'triple') bonusTags.push(tt(`🔷品質豹子×${DICE_QUALITY_COMBO_MULT.triple}`, `🔷Quality Triple×${DICE_QUALITY_COMBO_MULT.triple}`));
    else if(burst.qualityComboTier === 'pair') bonusTags.push(tt(`🔷品質對子×${DICE_QUALITY_COMBO_MULT.pair}`, `🔷Quality Pair×${DICE_QUALITY_COMBO_MULT.pair}`));
    if(burst.comboStreakBonus > 0) bonusTags.push(tt(`🔥連擊+${Math.round(burst.comboStreakBonus*100)}%`, `🔥Streak+${Math.round(burst.comboStreakBonus*100)}%`));
    if(burst.isCrit) bonusTags.push(tt('💥暴擊','💥Crit'));
    if(burst.affixResult) bonusTags.push(burst.affixResult.met ? tt(`🎯詞綴強化+${Math.round(BOSS_AFFIX_BONUS_PCT*100)}%`, `🎯Affix Boost+${Math.round(BOSS_AFFIX_BONUS_PCT*100)}%`) : tt('⚪未觸發強化','⚪Boost not triggered'));
    if(burst.coinRefunded) bonusTags.push(tt('♻️金幣未消耗','♻️Coin refunded'));
    const bonusStr = bonusTags.length ? `（${bonusTags.join('、')}）` : '';
    showToast(tt(`🎲 擲出 ${diceTag}，造成 ${burst.damage.toLocaleString()} 傷害！${bonusStr}　貢獻點 +${contribGain}`, `🎲 Rolled ${diceTag}, dealt ${burst.damage.toLocaleString()} damage!${bonusStr}  Contribution +${contribGain}`) + minionMsgPart + eventMsgPart);
  }
}

//   入場：每天用 4 張死神卡（major_13）解鎖當日挑戰資格，解鎖後當天可一直打，
//        不像主線Boss有「每日最多擊殺N次」，這隻打完4階當天就結束、不重生。
//   攻擊：沿用主線Boss的骰子攻擊機制（rollDiceAttack 完全共用），每次消耗 100 金幣。
//   進度：每人自己一份（比照主線Boss，不是全服共用血量），CAS讀寫同一套模式。
//   難度：全破4階＝1輪(cycle)，隔天沒破持續同一輪重打，破了cycle+1、隔天更難。
//        血量/獎勵倍率跟主線Boss數值完全分開（獨立一組 config，GM可分開調），
//        不會互相影響。
//   範圍：這階段先不做小怪/隨機事件/詞綴（比照跟玩家講好的「先做乾淨版本」），
//        獎勵道具「幽冥骰符」的發放與使用邏輯留給階段2。

const GHOST_BOSS_STAGE_META = [
  {label:'紫焰戰魂', labelEn:'Violet Flame Warsoul',   img:'assets/ghost_boss_stage1.png', desc:'紫色鬼火纏身、持劍的亡靈武將。', descEn:'A undead warrior wreathed in violet ghostfire, wielding a blade.'},
  {label:'幽弦怨姬', labelEn:'Spectral Strings Wraith', img:'assets/ghost_boss_stage2.png', desc:'彈奏古琴、操縱亡魂的女鬼。', descEn:'A female ghost who plays a haunted zither and commands wandering spirits.'},
  {label:'鎮魂巨煞', labelEn:'Soul-Binding Colossus',   img:'assets/ghost_boss_stage3.png', desc:'背負巨鐘、由怨靈組成的巨獸。', descEn:'A colossus of bound grudge-spirits, carrying a great temple bell.'},
  {label:'幽冥鬼王', labelEn:'Netherworld Ghost King',  img:'assets/ghost_boss_stage4.png', desc:'綠焰鎧甲、鎖鏈法器的鬼王，全破後才算通關。', descEn:'The Ghost King in green-flame armor wielding chained relics - defeating him clears the run.'},
];
const GHOST_BOSS_ENTRY_CARD_ID = 'major_13';   // 死神卡（Death），入場券素材
const DEFAULT_GHOST_BOSS_ENTRY_CARD_COST = 4;  // 入場需要消耗的張數
const DEFAULT_GHOST_BOSS_STAGE_HP = [6000, 12000, 20000, 30000]; // 4階基礎血量（cycle=1），GM可調
const DEFAULT_GHOST_BOSS_DIFFICULTY_MULT = 1.20; // 每輪(cycle)血量複利成長倍率，跟主線Boss數值分開設定
const DEFAULT_GHOST_BOSS_COIN_COST = 100; // 每次攻擊消耗金幣（GM可調）
const DEFAULT_GHOST_TALISMAN_CONTRIB_COST = 30000; // 貢獻點直接兌換1個幽冥骰符所需點數（GM可調）

let GHOST_BOSS_ENTRY_CARD_COST = DEFAULT_GHOST_BOSS_ENTRY_CARD_COST;
let GHOST_BOSS_STAGE_HP = [...DEFAULT_GHOST_BOSS_STAGE_HP];
let GHOST_BOSS_DIFFICULTY_MULT = DEFAULT_GHOST_BOSS_DIFFICULTY_MULT;
let GHOST_BOSS_COIN_COST = DEFAULT_GHOST_BOSS_COIN_COST;
let GHOST_TALISMAN_CONTRIB_COST = DEFAULT_GHOST_TALISMAN_CONTRIB_COST;

// GM 後台設定讀寫，跟主線Boss的 loadBossConfig/saveBossConfig 同一套寫法，
// 但存在自己獨立的 seasonKey，不會互相覆蓋。
async function loadGhostBossConfig(){
  try{
    const r = await storage.get(seasonKey('ghost_boss_settings'));
    if(r){
      const s = JSON.parse(r.value);
      if(Array.isArray(s.stageHp) && s.stageHp.length===4) GHOST_BOSS_STAGE_HP = s.stageHp;
      if(typeof s.difficultyMult === 'number') GHOST_BOSS_DIFFICULTY_MULT = s.difficultyMult;
      if(typeof s.coinCost === 'number') GHOST_BOSS_COIN_COST = s.coinCost;
      if(typeof s.entryCardCost === 'number') GHOST_BOSS_ENTRY_CARD_COST = s.entryCardCost;
      if(s.talismanRates && typeof s.talismanRates.rare === 'number') GHOST_DICE_TALISMAN_RATES = s.talismanRates;
      if(typeof s.talismanContribCost === 'number' && s.talismanContribCost >= 0) GHOST_TALISMAN_CONTRIB_COST = s.talismanContribCost;
    }
  }catch(e){ console.warn('loadGhostBossConfig failed', e); }
}
async function saveGhostBossConfig(){
  await storage.set(seasonKey('ghost_boss_settings'), JSON.stringify({
    stageHp: GHOST_BOSS_STAGE_HP,
    difficultyMult: GHOST_BOSS_DIFFICULTY_MULT,
    coinCost: GHOST_BOSS_COIN_COST,
    entryCardCost: GHOST_BOSS_ENTRY_CARD_COST,
    talismanRates: GHOST_DICE_TALISMAN_RATES,
    talismanContribCost: GHOST_TALISMAN_CONTRIB_COST,
  }));
}

function ghostBossStageMaxHp(stage, cycle){
  const base = GHOST_BOSS_STAGE_HP[stage-1] ?? GHOST_BOSS_STAGE_HP[GHOST_BOSS_STAGE_HP.length-1];
  return Math.round(base * Math.pow(GHOST_BOSS_DIFFICULTY_MULT, (cycle||1) - 1));
}

function ghostBossFreshState(cycle){
  cycle = cycle || 1;
  return {
    seasonId: CURRENT_SEASON_ID,
    resetDate: bossTodayStr(),
    cycle,
    stage: 1,
    hp: ghostBossStageMaxHp(1, cycle),
    maxHp: ghostBossStageMaxHp(1, cycle),
    unlockedToday: false, // 今天是否已花4張死神卡解鎖挑戰資格
    clearedToday: false,  // 今天是否已全破4階（全破後鎖到隔天，不會重生重打）
    comboStreak: 0, // 🔥 連續組合命中次數（對子/豹子），沒接住就歸零；跟主線Boss共用同一套連擊公式（BOSS_COMBO_STREAK_BONUS_PER_HIT/CAP）
    cycleDamage: 0, // 本輪（今日這個cycle，跨4階累計）造成的總傷害，僅供顯示用；跟主線Boss的cycleDamage同一套邏輯
    stagesClearedToday: [], // 今天已經發過階段獎勵的階數（防止CAS重試/重複結算重複發獎，階段2會用到）
  };
}

async function loadPlayerGhostBossStateRaw(nickname){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(ghostBossSoloKey(nickname))}&select=value,updated_at`,
    {headers: SB_HEADERS}
  );
  if(!res.ok) throw new Error('load ghost boss state failed: ' + res.status);
  const rows = await res.json();
  if(!rows || rows.length === 0) return {state: null, raw: null, updatedAt: null};
  const row = rows[0];
  return {state: JSON.parse(row.value), raw: row.value, updatedAt: row.updated_at};
}
async function savePlayerGhostBossState(nickname, s){
  await storage.set(ghostBossSoloKey(nickname), JSON.stringify(s));
}
async function savePlayerGhostBossStateCAS(nickname, prevUpdatedAt, newState){
  const filter = prevUpdatedAt
    ? `updated_at=eq.${encodeURIComponent(prevUpdatedAt)}`
    : `updated_at=is.null`;
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(ghostBossSoloKey(nickname))}&${filter}`,
    {
      method: 'PATCH',
      headers: {...SB_HEADERS, 'Content-Type': 'application/json', Prefer: 'return=representation'},
      body: JSON.stringify({value: JSON.stringify(newState), updated_at: new Date().toISOString()}),
    }
  );
  if(!res.ok) throw new Error('ghost boss state CAS update failed: ' + res.status);
  const rows = await res.json();
  return Array.isArray(rows) && rows.length > 0;
}

// 確保這位玩家的幽冥Boss進度存在且是「今天」的。跨天：擊敗了(clearedToday)就
// cycle+1(更難)，沒擊敗就維持原cycle重打；換季或第一次挑戰則從 cycle 1 開始。
// 注意：這裡只重置「今天的進度」，不會自動解鎖（unlockedToday 永遠從 false 開始），
// 玩家仍要每天花4張死神卡才能解鎖攻擊，跟主線Boss最大的不同就在這裡。
async function ensureGhostBossState(nickname, attempt){
  attempt = attempt || 0;
  if(attempt >= 8) throw new Error('ensureGhostBossState contention exceeded retries');
  const {state: s, raw, updatedAt} = await loadPlayerGhostBossStateRaw(nickname);
  const needsReset = !s || s.seasonId !== CURRENT_SEASON_ID || s.resetDate !== bossTodayStr();
  if(needsReset){
    const sameSeasonRollover = s && s.seasonId === CURRENT_SEASON_ID;
    const nextCycle = sameSeasonRollover ? (s.clearedToday ? (s.cycle||1) + 1 : (s.cycle||1)) : 1;
    const fresh = ghostBossFreshState(nextCycle);
    if(raw){
      const applied = await savePlayerGhostBossStateCAS(nickname, updatedAt, fresh);
      if(applied) return fresh;
      return ensureGhostBossState(nickname, attempt + 1);
    }
    await savePlayerGhostBossState(nickname, fresh);
    return fresh;
  }
  return s;
}

// 入場：消耗玩家庫存的 4 張死神卡，解鎖今天的挑戰資格。分兩步、各自 CAS：
//   1. 先確保今天的Boss狀態存在（ensureGhostBossState，可能剛好跨天重置）
//   2. 扣卡（玩家資料 CAS）成功後，才把 unlockedToday 標記寫回Boss狀態（Boss狀態 CAS）
// 兩步分開走各自的 CAS，理由跟其他發獎函式一致：玩家資料和Boss狀態是兩張不同的
// kv_store row，沒辦法用同一次 CAS 一起原子寫入，只能先扣資源成功後再標記解鎖。
// 如果卡片不夠，直接回傳 {ok:false, reason:'not_enough_cards'}，不觸碰任何存檔。
async function unlockGhostBossToday(nickname){
  const boss = await ensureGhostBossState(nickname);
  if(boss.unlockedToday) return {ok:true, alreadyUnlocked:true, boss};
  const player = await updatePlayerCAS(nickname, (p)=>{
    const have = p.cards[GHOST_BOSS_ENTRY_CARD_ID] || 0;
    if(have < GHOST_BOSS_ENTRY_CARD_COST){
      throw new Error('NOT_ENOUGH_ENTRY_CARDS');
    }
    p.cards[GHOST_BOSS_ENTRY_CARD_ID] = have - GHOST_BOSS_ENTRY_CARD_COST;
  }).catch(e=>{
    if(e && e.message === 'NOT_ENOUGH_ENTRY_CARDS') return null;
    throw e;
  });
  if(!player) return {ok:false, reason:'not_enough_cards'};
  for(let attempt = 0; attempt < 8; attempt++){
    const {state: current, raw, updatedAt} = await loadPlayerGhostBossStateRaw(nickname);
    if(!current || !raw){ await ensureGhostBossState(nickname); continue; }
    if(current.unlockedToday) return {ok:true, alreadyUnlocked:true, boss:current, player};
    const newBoss = {...current, unlockedToday: true};
    const applied = await savePlayerGhostBossStateCAS(nickname, updatedAt, newBoss);
    if(applied) return {ok:true, alreadyUnlocked:false, boss:newBoss, player};
  }
  throw new Error('unlockGhostBossToday contention exceeded retries');
}

// 攻擊結算：CAS讀-改-寫迴圈，跟主線Boss的 resolveBossAttack 結構一樣，但沒有
// 小怪/事件/詞綴這些roguelike機制（先做乾淨版本），但連擊streak有做，跟主線Boss
// 共用同一套公式（BOSS_COMBO_STREAK_BONUS_PER_HIT/CAP）。4階打完（stage
// 從4破到0血）就整個鎖到隔天，不像主線Boss會原地重生下一隻。
// 回傳 stageCompletedAt：這次攻擊若剛好破了某一階，記下「破的是第幾階」，
// 給呼叫端（階段2）拿去發「幽冥骰符」獎勵用（每破1階發1個）。
async function resolveGhostBossAttack(nickname, damage, comboTier){
  for(let attempt = 0; attempt < 8; attempt++){
    const {state: boss, raw, updatedAt} = await loadPlayerGhostBossStateRaw(nickname);
    if(!boss || !raw){ await ensureGhostBossState(nickname); continue; }
    if(boss.hp <= 0 || boss.clearedToday) continue; // 保底重試，理論上呼叫端會先擋掉這個狀態
    const newBoss = {...boss};
    // 🔥 連擊：這次攻擊若開出對子/豹子（comboTier非null）就累加連擊數，沒開出則歸零重來。
    // 跟主線Boss共用同一套封頂公式（BOSS_COMBO_STREAK_BONUS_PER_HIT/CAP），傷害本身已經
    // 在呼叫端 rollDiceAttack 用「攻擊前」的 streak 值算好套用了，這裡只更新給下一次用的值。
    const comboStreakCapCount = BOSS_COMBO_STREAK_BONUS_PER_HIT > 0
      ? Math.ceil(BOSS_COMBO_STREAK_CAP / BOSS_COMBO_STREAK_BONUS_PER_HIT)
      : Infinity;
    newBoss.comboStreak = (comboTier === 'pair' || comboTier === 'triple')
      ? Math.min((boss.comboStreak||0) + 1, comboStreakCapCount)
      : 0;
    newBoss.hp = Math.max(0, boss.hp - damage);
    newBoss.cycleDamage = (boss.cycleDamage||0) + damage;
    let stageCompletedAt = null;
    let fullyCleared = false;
    if(newBoss.hp <= 0){
      stageCompletedAt = newBoss.stage;
      if(newBoss.stage < GHOST_BOSS_STAGE_META.length){
        newBoss.stage += 1;
        newBoss.maxHp = ghostBossStageMaxHp(newBoss.stage, newBoss.cycle);
        newBoss.hp = newBoss.maxHp;
      } else {
        // 第4階（幽冥鬼王）被打死＝全破，今天結束，鎖到隔天重置（cycle+1）
        fullyCleared = true;
        newBoss.clearedToday = true;
      }
    }
    const applied = await savePlayerGhostBossStateCAS(nickname, updatedAt, newBoss);
    if(applied) return {prevBoss: boss, newBoss, stageCompletedAt, fullyCleared};
  }
  throw new Error('ghost boss state contention exceeded retries');
}

// 攻擊入口：先檢查裝備骰子/金幣/是否已解鎖今天資格，通過才真正結算。骰子攻擊
// 傷害計算完全共用 rollDiceAttack（不重寫），只是不傳入主線Boss的事件/連擊
// streak/詞綴（傳 null/0/null），這隻Boss這階段先不做那些機制。
// 這階段先不接獎勵發放（幽冥骰符）和 UI 渲染，回傳完整結果方便先用 console 驗證
// 規則對不對，階段2/3會接上去。
async function performGhostBossAttack(){
  const p = state.player;
  ensureMaterials(p);
  ensureDiceInventory(p);
  const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
  if(equippedIds.length === 0){
    showToast(tt('請先到「骰子」分頁裝備至少 1 顆骰子', 'Equip at least 1 die in the Dice tab first'));
    return null;
  }
  const boss = await ensureGhostBossState(p.nickname);
  if(!boss.unlockedToday){
    showToast(tt(`尚未解鎖今日挑戰，需要 ${GHOST_BOSS_ENTRY_CARD_COST} 張死神卡`, `Not unlocked today - need ${GHOST_BOSS_ENTRY_CARD_COST} Death cards`));
    return null;
  }
  if(boss.clearedToday){
    showToast(tt('今日已全破，明天再來挑戰更難的一輪！', 'Already cleared today - come back tomorrow for a tougher round!'));
    return null;
  }
  const cost = GHOST_BOSS_COIN_COST;
  if(p.coins < cost){
    showToast(tt(`金幣不足，需要 ${cost}`, `Not enough coins, need ${cost}`));
    return null;
  }
  const burst = rollDiceAttack(p, null, boss.comboStreak||0, null);
  await playDiceRollAnimation(equippedIds.map(id => p.dice[id]), burst, 'ghost-dice-roll-anim', 'ghost-boss-burst-btn');
  if(!burst.coinRefunded){
    p.coins -= cost;
  }
  const contribGain = Math.round(burst.damage * BOSS_CONTRIB_RATE * (1 + (burst.contribBonusPct||0)) * starChartContribMultiplier(p));
  p.materials.contrib += contribGain;
  bumpQuest(p, 'boss_attack', 1);
  await savePlayer(p);

  let result;
  try{
    result = await resolveGhostBossAttack(p.nickname, burst.damage, burst.comboTier);
  }catch(e){
    showToast(tt('幽冥Boss狀態忙碌中，請稍後再試', 'Ghost boss state is busy, try again shortly'));
    return null;
  }
  const { prevBoss, newBoss } = result;
  // 🔊 打擊感：跟主線Boss同一套「殘影追趕」動畫，只在同一階段/同一輪內才播，
  // 破階/全破/隔天重置時血量池整個換掉了，套動畫在上面只會很奇怪，直接跳過。
  state.ghostBossHpAnim = (newBoss.stage === prevBoss.stage && newBoss.cycle === prevBoss.cycle) ? {
    fromPct: Math.max(0, Math.min(100, (prevBoss.hp/prevBoss.maxHp)*100)),
    stage: newBoss.stage,
    cycle: newBoss.cycle,
    crit: burst.isCrit,
  } : null;

  // 每破1階（不管是不是全破的那一階）都發1個「幽冥骰符」——resolveGhostBossAttack
  // 的 CAS 迴圈保證了同一次階段轉換只有一次成功寫入，所以這裡收到 stageCompletedAt
  // 非null時發獎，不會因為CAS重試而重複發放。
  let stageReward = null;
  if(result.stageCompletedAt !== null){
    stageReward = await grantGhostBossStageReward(p.nickname);
    if(stageReward && stageReward.player) state.player = stageReward.player;
  }

  let msg;
  if(result.fullyCleared){
    msg = tt(
      `🎉 你擊敗了「幽冥鬼王」，全破本輪！獲得 幽冥骰符 +1（今日共集滿4個），明天再來挑戰更難的一輪！`,
      `🎉 You defeated the Netherworld Ghost King and cleared the run! Gained Ghost Dice Talisman +1 (4 collected today). Come back tomorrow for a tougher round!`
    );
  } else if(result.stageCompletedAt !== null){
    const clearedMeta = GHOST_BOSS_STAGE_META[result.stageCompletedAt-1];
    const nextMeta = GHOST_BOSS_STAGE_META[result.newBoss.stage-1];
    msg = tt(
      `⚔️「${clearedMeta.label}」被擊破！獲得 幽冥骰符 +1，Boss 進入「${nextMeta.label}」！`,
      `⚔️ "${clearedMeta.labelEn}" defeated! Gained Ghost Dice Talisman +1. The Boss enters "${nextMeta.labelEn}"!`
    );
  } else {
    const diceTag = burst.rolls.map(r => r.face.num).join('·');
    const bonusTags = [];
    if(burst.comboTier === 'triple') bonusTags.push(tt('🎯豹子×2','🎯Triple×2'));
    else if(burst.comboTier === 'pair') bonusTags.push(tt(`✌️對子×${DICE_COMBO_MULT.pair}`, `✌️Pair×${DICE_COMBO_MULT.pair}`));
    if(burst.comboStreakBonus > 0) bonusTags.push(tt(`🔥連擊+${Math.round(burst.comboStreakBonus*100)}%`, `🔥Streak+${Math.round(burst.comboStreakBonus*100)}%`));
    if(burst.isCrit) bonusTags.push(tt('💥暴擊','💥Crit'));
    const bonusStr = bonusTags.length ? `（${bonusTags.join('、')}）` : '';
    msg = tt(`🎲 擲出 ${diceTag}，造成 ${burst.damage.toLocaleString()} 傷害！${bonusStr}`, `🎲 Rolled ${diceTag}, dealt ${burst.damage.toLocaleString()} damage!${bonusStr}`);
  }
  showToast(msg);
  state.ghostBossLastAttack = {damage: burst.damage, contrib: contribGain, rolls: burst.rolls, comboTier: burst.comboTier, qualityComboTier: burst.qualityComboTier, allWild: burst.allWild, isCrit: burst.isCrit, comboStreakBonus: burst.comboStreakBonus, comboStreakAfter: newBoss.comboStreak};
  renderTab();
  updateHeaderCoins();
  return {burst, contribGain, stageReward, ...result};
}

// 破階獎勵：每破1階發1個「幽冥骰符」，跟主線Boss的 grantBossStageEssence 同一套
// CAS 寫法，各自獨立不影響上面已經寫入的骰子攻擊結果（p.coins/materials.contrib）。
async function grantGhostBossStageReward(nickname){
  const applied = await updatePlayerCAS(nickname, (player)=>{
    ensureMaterials(player);
    player.materials.ghostDiceTalisman = (player.materials.ghostDiceTalisman||0) + 1;
  });
  if(!applied) return null;
  return {count: 1, player: applied};
}

// ---------- 幽冥骰符：消耗品，用了直接抽1顆骰子，保底稀有以上 ----------
// 品質只在「稀有／史詩」之間抽（不會抽到普通），機率GM可調，預設稀有70%／史詩30%。
// 骰子本身的生成（面數字/效果面數量/基礎攻擊力）完全共用 rollNewDice，跟一般抽骰
// 拿到的骰子在資料結構上沒有任何差異，只是品質保底比較高。
const DEFAULT_GHOST_DICE_TALISMAN_RATES = {rare:0.70, epic:0.30};
let GHOST_DICE_TALISMAN_RATES = {...DEFAULT_GHOST_DICE_TALISMAN_RATES};

function rollGhostDiceTalismanQuality(){
  const r = Math.random();
  return r < GHOST_DICE_TALISMAN_RATES.rare ? 'rare' : 'epic';
}

// 使用幽冥骰符：CAS 保護「扣道具 + 產生骰子」這整個讀-改-寫，跟 doDiceGacha 同一套
// 防手滑寫法，避免連點兩次時道具被扣兩次卻只拿到一顆骰子。
async function useGhostDiceTalisman(){
  const p = state.player;
  ensureMaterials(p);
  ensureDiceInventory(p);
  if((p.materials.ghostDiceTalisman||0) < 1){
    showToast(tt('沒有幽冥骰符可以使用', 'No Ghost Dice Talisman to use'));
    return null;
  }
  let resultDice = null;
  let applied;
  try{
    applied = await updatePlayerCAS(p.nickname, (player)=>{
      ensureMaterials(player);
      ensureDiceInventory(player);
      const have = player.materials.ghostDiceTalisman||0;
      if(have < 1) throw new Error('NO_GHOST_DICE_TALISMAN');
      player.materials.ghostDiceTalisman = have - 1;
      const dice = rollNewDice(rollGhostDiceTalismanQuality());
      player.dice[dice.id] = dice;
      resultDice = dice;
    });
  }catch(e){
    showToast(tt('道具不足或資料忙碌中，請重新整理後再試', 'Not enough talismans, or data is busy — refresh and try again'));
    return null;
  }
  if(!applied || !resultDice) return null;
  state.player = applied;
  const meta = DICE_QUALITY_META[resultDice.quality];
  showToast(tt(`🔮 幽冥骰符化為一顆「${meta.label}」骰子！`, `🔮 The Ghost Dice Talisman became a ${meta.labelEn} die!`));
  renderTab();
  updateHeaderCoins();
  return resultDice;
}

// 用貢獻點直接兌換 1 個幽冥骰符（不用打Boss，純粹拿累積的貢獻點換）。
// CAS 保護「扣貢獻點 + 發骰符」這整個讀-改-寫，理由跟 useGhostDiceTalisman 一樣：
// 避免連點兩次時貢獻點被扣兩次，卻只拿到一個骰符。
async function exchangeContribForGhostTalisman(){
  const p = state.player;
  ensureMaterials(p);
  const cost = GHOST_TALISMAN_CONTRIB_COST;
  if((p.materials.contrib||0) < cost){
    showToast(tt(`貢獻點不足，需要 ${cost.toLocaleString()}`, `Not enough contribution points, need ${cost.toLocaleString()}`));
    return null;
  }
  let applied;
  try{
    applied = await updatePlayerCAS(p.nickname, (player)=>{
      ensureMaterials(player);
      const have = player.materials.contrib||0;
      if(have < cost) throw new Error('NOT_ENOUGH_CONTRIB');
      player.materials.contrib = have - cost;
      player.materials.ghostDiceTalisman = (player.materials.ghostDiceTalisman||0) + 1;
    });
  }catch(e){
    showToast(tt('貢獻點不足或資料忙碌中，請重新整理後再試', 'Not enough contribution points, or data is busy — refresh and try again'));
    return null;
  }
  if(!applied) return null;
  state.player = applied;
  showToast(tt(`✨ 兌換成功！花費 🏅${cost.toLocaleString()} 貢獻點，獲得 🔮 幽冥骰符 x1`, `✨ Exchanged! Spent 🏅${cost.toLocaleString()} contribution for 🔮 Ghost Dice Talisman x1`));
  renderTab();
  return applied;
}


// 這階段只做「擁有骰子」這件事：資料模型、玩家骰子欄位、抽卡機率與消耗。
// 還沒接上真正的攻擊流程（面數字倍率、面效果疊加、相同號碼加成留到階段四），
// 方便先獨立驗證抽卡機率分佈與資料是否正確，不受戰鬥邏輯干擾。

// 抽骰消耗的 3 張特定 epic 卡：沿用現有牌庫的「太陽／月亮／星星」（非新設計卡片）。
// 選這三張是因為主題上跟賽季的星象/星軌意象最搭；若要改成別的 epic 卡，改這個陣列即可。
const DEFAULT_DICE_GACHA_CARD_IDS = ['major_17', 'major_18', 'major_19']; // The Star / The Moon / The Sun
let DICE_GACHA_CARD_IDS = [...DEFAULT_DICE_GACHA_CARD_IDS]; // GM 可在「骰子商店設定」調整成任意 3 張 epic 卡
const DEFAULT_DICE_GACHA_COST_QTY = 1; // 每張消耗數量（固定 3 張不同 epic 卡 = 1 抽，暫定）
let DICE_GACHA_COST_QTY = DEFAULT_DICE_GACHA_COST_QTY;

const DICE_QUALITY_IDS = ['common', 'rare', 'epic'];
// effectFaces：品質對應「有幾面帶效果」。史詩暫定固定 3 面（設計文件寫「3 面或以上」，
// 這裡先取下限，之後若要做成隨機 3~4 面，只要改這裡的 rollDice 邏輯即可）。
const DICE_QUALITY_META = {
  common: {label:'普通', labelEn:'Common', effectFaces:1, color:'var(--common)'},
  rare:   {label:'稀有', labelEn:'Rare',   effectFaces:2, color:'var(--rare)'},
  epic:   {label:'史詩', labelEn:'Epic',   effectFaces:3, color:'var(--legendary-a)'},
};
const DEFAULT_DICE_GACHA_RATES = {common:0.80, rare:0.15, epic:0.05}; // 無保底
let DICE_GACHA_RATES = {...DEFAULT_DICE_GACHA_RATES};

// 骰子基礎攻擊力隨機範圍（暫定數值，待階段四攻擊公式定案時再校準）。
// common/rare 共用這組區間；epic 改用獨立的 DICE_EPIC_BASE_ATTACK_RANGE，
// 讓史詩骰子的基礎傷害明顯高一截，而不是跟 common/rare 抽同一組數字。
const DEFAULT_DICE_BASE_ATTACK_RANGE = [80, 160];

const DICE_FACE_MULT = {1:1.1, 2:1.2, 3:1.3, 4:1.4, 5:1.5, 6:1.6};

// ---------- 骰子完美度評分（排行榜／曬骰用，不影響戰鬥數值）----------
// 目的：把「這顆骰子多強／多稀有」換算成單一分數，用於「完美骰排行榜」排名與展示。
// 純展示用途，跟 rollDiceAttack 的實際傷害計算完全獨立，改這裡的權重不會影響戰鬥平衡。
//
// 設計重點：
// 1. 品質/等級分＝已投入的資源量（愈難獲得/愈花錢愈高分）。
// 2. 面數字分＝原本倍率 (DICE_FACE_MULT) 折算成分數，1~4 號額外把 DICE_FACE_NUM_BONUS
//    的暴擊率/暴擊傷害用「等值換算係數」補回來，避免 1~4 號因為原始倍率較低被誤判成爛面
//    （這兩個係數只是拍腦袋抓的期望值估算，正式上線後應依實戰數據回頭校準，故獨立成常數
//    方便之後調整或丟進 GM 後台）。
// 3. 暴擊率／暴擊傷害協同：暴擊傷害要有暴擊率撐才吃得到，這顆骰子（6 面一起看）若同時
//    有暴擊率面與暴擊傷害面，暴擊傷害那面的分數吃滿；若只有暴擊傷害沒有暴擊率來源，
//    視為「配裝失敗」打折——排行榜前段的骰子因此會自然長成「有配對」的樣子。
// 4. 效果面分＝依效果 tier 給分，且刻意跟抽取權重成反比（rare 效果權重最低、分數最高），
//    「湊滿全部面都有效果」還不夠強，要湊到稀有效果分數才會真的拉開差距。
// 5. 完美加成＝非線性突破分：全數字滿 6、全面帶效果、湊到頂級稀有效果組合時額外給大量
//    分數，讓「差最後一兩面」與「湊齊」分數差一大截，製造持續洗練的動機。
// 6. 基礎攻擊力分＝跟該品質「初抽隨機下限」的差距換算分數，反映洗練/抽卡運氣與強化投入，
//    沒有上限，只要 baseAttack 愈高（不管是抽得好還是練得多）分數就愈高。
const DICE_NUM_BONUS_SCORE_PER_PCT = {critRate: 12, critDmg: 7}; // 每 1% 暴擊率/暴擊傷害折算的分數
const DICE_CRIT_SYNERGY_BONUS_MULT = 1.4;  // 骰子同時有暴擊率面與暴擊傷害面：暴擊傷害面分數 ×1.4
const DICE_CRIT_SYNERGY_PENALTY_MULT = 0.5; // 只有暴擊傷害沒有暴擊率來源：暴擊傷害面分數 ×0.5
const DICE_EFFECT_TIER_SCORE = {common: 8, uncommon: 25, rare: 80}; // 面效果分（依 tier，跟抽取權重刻意反比）
const DICE_QUALITY_SCORE = {common: 100, rare: 180, epic: 350}; // 品質基礎分（比照強化係數 6:10:20 抓比例，epic 拉更開）
const DICE_LEVEL_SCORE_PER_LEVEL = 20; // 每強化 1 級的分數，滿 10 級 = 200 分
const DICE_BASE_ATK_SCORE_PER_POINT = 0.5; // 基礎攻擊力每超過該品質隨機下限 1 點，折算的分數

// 計算單一面的分數：面數字倍率分 + (若有暴擊加成)暴擊等值分 + (若有效果)效果分。
// hasCritRateFace/hasCritDmgFace 用來判斷這顆骰子整體是否「配對成功」，決定暴擊傷害面吃全額還是打折。
function diceFaceScore(face, hasCritRateFace, hasCritDmgFace){
  let score = (DICE_FACE_MULT[face.num] - 1) * 100; // 面數字分：1號=10分…6號=60分
  const numBonus = DICE_FACE_NUM_BONUS[face.num];
  if(numBonus){
    if(numBonus.critRate){
      score += numBonus.critRate * 100 * DICE_NUM_BONUS_SCORE_PER_PCT.critRate;
    }
    if(numBonus.critDmg){
      const synergyMult = hasCritRateFace ? DICE_CRIT_SYNERGY_BONUS_MULT : DICE_CRIT_SYNERGY_PENALTY_MULT;
      score += numBonus.critDmg * 100 * DICE_NUM_BONUS_SCORE_PER_PCT.critDmg * synergyMult;
    }
  }
  if(face.effect){
    score += DICE_EFFECT_TIER_SCORE[face.effect.tier] || 0;
  }
  return score;
}

// 計算一顆骰子的完美度總分，回傳分數與拆解明細（明細用於排行榜/曬骰面板顯示分數怎麼來的）。
function diceScore(dice){
  if(!dice || !Array.isArray(dice.faces)) return {total: 0, breakdown: {}};
  const faces = dice.faces;
  const hasCritRateFace = faces.some(f => DICE_FACE_NUM_BONUS[f.num] && DICE_FACE_NUM_BONUS[f.num].critRate);
  const hasCritDmgFace = faces.some(f => DICE_FACE_NUM_BONUS[f.num] && DICE_FACE_NUM_BONUS[f.num].critDmg);
  const qualityScore = DICE_QUALITY_SCORE[dice.quality] || DICE_QUALITY_SCORE.common;
  const levelScore = (dice.level || 1) * DICE_LEVEL_SCORE_PER_LEVEL;
  const facesScore = faces.reduce((sum, f) => sum + diceFaceScore(f, hasCritRateFace, hasCritDmgFace), 0);
  // 基礎攻擊力分：跟該品質「初抽隨機下限」比差距（史詩用自己獨立的範圍下限），
  // 差距愈大代表洗練/抽卡運氣愈好，分數沒有上限——持續強化拉高 baseAttack 也會持續加分，
  // 呼應 levelScore「投入愈多分愈高」的精神，但反映的是實際擲出的數值而非單純等級數字。
  const atkRangeMin = (dice.quality === 'epic' ? DICE_EPIC_BASE_ATTACK_RANGE : DICE_BASE_ATTACK_RANGE)[0];
  const baseAtkScore = Math.max(0, (dice.baseAttack || 0) - atkRangeMin) * DICE_BASE_ATK_SCORE_PER_POINT;

  const effectFaceCount = faces.filter(f => f.effect).length;
  const sixCount = faces.filter(f => f.num === 6).length;
  const hasRareEffect = faces.some(f => f.effect && f.effect.tier === 'rare');
  const rareEffectCount = faces.filter(f => f.effect && f.effect.tier === 'rare').length;
  let perfectBonus = 0;
  if(effectFaceCount === 6) perfectBonus += 50;      // 六面全部有效果（實務上只有練滿的史詩骰做得到）
  if(sixCount === 6) perfectBonus += 80;             // 六面全部是 6 號
  if(rareEffectCount >= 2) perfectBonus += 150;       // 同時擁有 2 個稀有效果面（例如萬能面+組合加成）
  else if(hasRareEffect) perfectBonus += 40;          // 至少 1 個稀有效果面

  const total = Math.round(qualityScore + levelScore + facesScore + baseAtkScore + perfectBonus);
  return {
    total,
    breakdown: {qualityScore, levelScore, facesScore: Math.round(facesScore), baseAtkScore: Math.round(baseAtkScore), perfectBonus, effectFaceCount, sixCount, hasCritRateFace, hasCritDmgFace},
  };
}

// 從玩家的整個骰子倉庫（p.dice）挑出分數最高的一顆，用於排行榜「這位玩家的最強骰」。
// 排行榜資料來自 fetchAllPlayers() 抓回來的「其他玩家」原始存檔，沒有經過 ensureDiceInventory
// 那一輪還原，faces[].effect 可能還是存檔精簡格式（純 id 字串），這裡先用 resolveDiceFaceEffect
// 查表換回完整物件（含 label/labelEn），不然排行榜畫面上的效果名稱會顯示成 undefined。
function playerBestDice(p){
  if(!p || !p.dice) return null;
  let best = null, bestScore = -1;
  Object.values(p.dice).forEach(d=>{
    if(Array.isArray(d.faces)) d.faces = d.faces.map(f => ({...f, effect: resolveDiceFaceEffect(f.effect)}));
    const {total} = diceScore(d);
    if(total > bestScore){ bestScore = total; best = d; }
  });
  return best ? {dice: best, score: bestScore} : null;
}


// 組合加成：原本「三顆骰子開出同號才 ×2」改成分級——2 顆同號（對子）與 3 顆同號（豹子）
// 給不同倍率，只要裝備 ≥2 顆骰子就有機會觸發，不再要求一定要裝滿 3 顆。
const DEFAULT_DICE_COMBO_MULT = {pair:1.3, triple:2.0};
let DICE_COMBO_MULT = {...DEFAULT_DICE_COMBO_MULT};

// 🔷 品質對子套裝加成：跟上面「數字」對子/豹子是完全獨立的判定維度，改看裝備的
// 骰子「品質」是否相同——2 顆同品質（品質對子）/ 3 顆同品質（品質豹子）。用意是
// 讓玩家有「湊一套同品質骰子」的誘因，不會被「只練一顆數值最高的主力骰」取代
// （因為單顆骰子不管多強都湊不出品質對子）。倍率刻意設得比數字對子/豹子溫和，
// 純粹當作額外的「配裝」加分，不喧賓奪主；兩者可以同時觸發、疊乘計算（見
// rollDiceAttack：totalDamage 先吃數字組合倍率，再吃品質組合倍率）。
const DEFAULT_DICE_QUALITY_COMBO_MULT = {pair:1.10, triple:1.25};
let DICE_QUALITY_COMBO_MULT = {...DEFAULT_DICE_QUALITY_COMBO_MULT};

// ---------- 骰子強化系統 ----------
// 玩家可花費「骰子精華」提升已擁有骰子的基礎攻擊力，每滿一定等級數會嘗試把一面
// 還沒有效果的面轉換成帶效果的面（等於變相增加觸發機率）；精華主要來源是拆解
// 用不到的骰子（DICE_DISMANTLE_REFUND），形成「抽到重複/低階骰子 → 拆解 → 強化主力骰子」的循環。
const DICE_ENHANCE_MAX_LEVEL = 10;
const DEFAULT_DICE_ENHANCE_ATK_PER_LEVEL = {common:6, rare:10, epic:20}; // 每級增加的基礎攻擊力（依品質；epic 加碼調強）
let DICE_ENHANCE_ATK_PER_LEVEL = {...DEFAULT_DICE_ENHANCE_ATK_PER_LEVEL};
const DEFAULT_DICE_ENHANCE_BASE_COST = {common:8, rare:14, epic:22}; // 精華消耗 = 品質基礎值 × 目標等級
let DICE_ENHANCE_BASE_COST = {...DEFAULT_DICE_ENHANCE_BASE_COST};
const DICE_ENHANCE_EFFECT_FACE_INTERVAL = 3; // 每滿 3 級嘗試新增一面效果面（若六面都已有效果，改發基礎攻擊力）
const DEFAULT_DICE_DISMANTLE_REFUND = {common:5, rare:15, epic:40}; // 拆解骰子返還的精華基準值（依品質）
let DICE_DISMANTLE_REFUND = {...DEFAULT_DICE_DISMANTLE_REFUND};

// 計算強化到下一級所需的精華，已達上限回傳 null。
function diceEnhanceCost(dice){
  if(dice.level >= DICE_ENHANCE_MAX_LEVEL) return null;
  const nextLevel = dice.level + 1;
  return Math.round((DICE_ENHANCE_BASE_COST[dice.quality]||8) * nextLevel);
}
// 拆解可回收的精華：品質基礎值，另外把該骰子已投入強化的部份精華以五折折算返還，
// 避免「強化到很高等級再拆解」變成無腦刷精華的漏洞，但仍保留部分回收誘因。
function diceDismantleRefund(dice){
  const base = DICE_DISMANTLE_REFUND[dice.quality] || 5;
  let invested = 0;
  for(let lvl=0; lvl<dice.level; lvl++){
    invested += Math.round((DICE_ENHANCE_BASE_COST[dice.quality]||8) * (lvl+1));
  }
  return base + Math.round(invested * 0.5);
}

// ---------- 骰子洗練系統 ----------
// 玩家可以選擇花「金幣」或「骰子精華」（兩種資源池擇一，玩家自選）重骰骰子的「面數字＋面效果」。
// 可以勾選最多 5 面設為「鎖定」，鎖定的面保留原本數字與效果不變；至少 1 面永遠會被
// 重骰（6 面全鎖等於沒得洗，UI 層要擋掉這個情況）。鎖的面數愈多，總費用愈高——
// 金幣費用查 DICE_REFINE_LOCK_COST（用「鎖定面數」查表，不是逐級疊加），精華費用
// 查 DICE_REFINE_LOCK_COST_ESSENCE（同一張表換算，約 1 精華 ≈ 500 金幣，取整百）。
// 鎖定是「逐次付費」——每次洗練都要重新選要鎖哪幾面、重新付那筆鎖定費，不是買斷。
// 未鎖定的面用跟骰子誕生時（rollNewDice）一樣的隨機邏輯重骰數字（1~6）與效果（rollFaceEffect）。
// 已標記最愛的骰子不能洗練（跟拆解一樣，需先取消最愛），避免玩家在珍藏骰子上誤按重骰。
const DEFAULT_DICE_REFINE_LOCK_COST = {0:50000, 1:100000, 2:200000, 3:400000, 4:600000, 5:1000000};
let DICE_REFINE_LOCK_COST = {...DEFAULT_DICE_REFINE_LOCK_COST};
// 精華版費用：約等於金幣表 ÷500（邊際兌換率，取自遠征連勝加碼戰的金幣/精華同時發放公式），取整百。
const DEFAULT_DICE_REFINE_LOCK_COST_ESSENCE = {0:100, 1:200, 2:400, 3:800, 4:1200, 5:2000};
let DICE_REFINE_LOCK_COST_ESSENCE = {...DEFAULT_DICE_REFINE_LOCK_COST_ESSENCE};
// 洗練「基礎攻擊力」是獨立按鈕、獨立計費，跟上面的面數字/效果洗練互不影響、不能一起結算。
const DEFAULT_DICE_REFINE_BASE_ATTACK_COST = 100000;
let DICE_REFINE_BASE_ATTACK_COST = DEFAULT_DICE_REFINE_BASE_ATTACK_COST;
const DEFAULT_DICE_REFINE_BASE_ATTACK_COST_ESSENCE = 200;
let DICE_REFINE_BASE_ATTACK_COST_ESSENCE = DEFAULT_DICE_REFINE_BASE_ATTACK_COST_ESSENCE;

// 計算洗練面數字/效果這一次要付多少：payMethod 為 'coins' 或 'essence'，依鎖定面數查對應費用表。
function diceRefineCost(lockedCount, payMethod){
  const table = payMethod === 'essence' ? DICE_REFINE_LOCK_COST_ESSENCE : DICE_REFINE_LOCK_COST;
  return (table[lockedCount] !== undefined) ? table[lockedCount] : table[0];
}

// 洗練骰子：lockedFaceIndexes 是要保留不變的面索引陣列（0-based，對應 dice.faces），
// 最多 5 個、至少留 1 面重骰。用 CAS 保護讀-改-寫，避免連點兩次洗練只扣一次金幣
// 卻重骰兩次（或反過來扣兩次錢只重骰一次）。
async function doRefineDice(diceId, lockedFaceIndexes, payMethod){
  const p = state.player;
  ensureDiceInventory(p);
  const dice = p.dice[diceId];
  if(!dice) return;
  if(dice.favorite){
    showToast(tt('這顆骰子已標記為最愛，請先取消最愛才能洗練','This die is marked as favorite — unmark it before refining'));
    return;
  }
  const method = payMethod === 'essence' ? 'essence' : 'coins';
  const locked = Array.isArray(lockedFaceIndexes) ? [...new Set(lockedFaceIndexes)].filter(i => Number.isInteger(i) && i >= 0 && i < 6) : [];
  if(locked.length > 5){
    showToast(tt('最多只能鎖定 5 面，至少要留 1 面重骰','You can lock at most 5 faces — at least 1 must be re-rolled'));
    return;
  }
  const cost = diceRefineCost(locked.length, method);
  const balance = method === 'essence' ? (p.materials.diceEssence||0) : (p.coins||0);
  if(balance < cost){
    showToast(method === 'essence'
      ? tt(`骰子精華不足，洗練需要 💠${cost}`, `Not enough Dice Essence — refining needs 💠${cost}`)
      : tt(`金幣不足，洗練需要 ✦${cost}`, `Not enough coins — refining needs ✦${cost}`));
    return;
  }
  const unlockedCount = 6 - locked.length;
  const costLabel = method === 'essence' ? `💠${cost}` : `✦${cost}`;
  if(!confirm(tt(`確定要花費 ${costLabel} 洗練這顆骰子嗎？未鎖定的 ${unlockedCount} 面將重新隨機（數字+效果），此動作無法復原。`, `Spend ${costLabel} to refine this die? The ${unlockedCount} unlocked face(s) will be re-rolled (number + effect). This cannot be undone.`))) return;
  let applied;
  try{
    applied = await updatePlayerCAS(p.nickname, (player)=>{
      ensureDiceInventory(player);
      const d = player.dice[diceId];
      if(!d) throw new Error('dice not found');
      if(d.favorite) throw new Error('dice is favorited');
      const c = diceRefineCost(locked.length, method);
      if(method === 'essence'){
        if((player.materials.diceEssence||0) < c) throw new Error('insufficient essence');
        player.materials.diceEssence -= c;
      }else{
        if((player.coins||0) < c) throw new Error('insufficient coins');
        player.coins -= c;
      }
      d.faces = d.faces.map((f, i) => locked.includes(i) ? f : {num: 1 + Math.floor(Math.random()*6), effect: rollFaceEffect()});
      bumpQuest(player, 'dice_refine', 1);
    });
  }catch(e){
    if(e && e.message === 'dice is favorited'){
      showToast(tt('這顆骰子已標記為最愛，請先取消最愛才能洗練','This die is marked as favorite — unmark it before refining'));
    }else if(e && e.message === 'insufficient essence'){
      showToast(tt('洗練失敗，骰子精華不足或資料忙碌中，請重新整理後再試','Refine failed — not enough Dice Essence or data busy, refresh and try again'));
    }else{
      showToast(tt('洗練失敗，金幣不足或資料忙碌中，請重新整理後再試','Refine failed — not enough coins or data busy, refresh and try again'));
    }
    return;
  }
  if(!applied) return;
  state.player = applied; // ✅ 沿用 CAS 寫入成功後的物件，不再多打一次可能失敗的 loadPlayer
  showToast(tt('🎲 洗練完成！','🎲 Refine complete!'));
  renderTab();
  updateHeaderCoins();
}

// 洗練基礎攻擊力：獨立按鈕、固定費用（不隨等級/品質遞增），跟面數字/效果洗練分開計費。
// 注意：這裡是直接在 quality 對應的隨機範圍內重骰一個全新的 baseAttack，會連同強化

// 洗練面板的「鎖定哪幾面」是純前端暫存的 UI 選擇，不寫進玩家存檔——玩家還沒按下
// 「洗練」按鈕之前，這只是他在畫面上勾選的草稿。用 diceId 當 key 存在這個模組層級
// 物件裡，好處是切分頁/renderTab() 重繪整個骰子庫存時，勾選狀態還能保留下來；
// 真的執行洗練（doRefineDice）之後也刻意不清空，因為未鎖定的那幾面剛重骰完，
// 玩家很可能想接著再看一次結果、决定要不要繼續鎖同一面。
const DICE_REFINE_SELECTION = {};
function diceRefineGetLocked(diceId){
  const arr = DICE_REFINE_SELECTION[diceId];
  return Array.isArray(arr) ? arr.filter(i => Number.isInteger(i) && i >= 0 && i < 6) : [];
}
// 洗練付款方式（'coins' 或 'essence'）同樣是純前端暫存的 UI 選擇，跟鎖定面數一樣不寫進存檔，
// 用另一個以 diceId 為 key 的模組層級物件記住，切分頁/renderTab() 重繪也不會跑掉。
const DICE_REFINE_PAYMENT = {};
function diceRefineGetPayment(diceId){
  return DICE_REFINE_PAYMENT[diceId] === 'essence' ? 'essence' : 'coins';
}

// 渲染單顆骰子卡片裡的洗練區塊：6 面各一個鎖定 checkbox（最多勾 5 個，
// 至少留 1 面重骰）、即時費用顯示、洗練按鈕、以及獨立的基礎攻擊力洗練按鈕。
// 只有 renderDiceShop 的庫存列表會傳 opts.showRefine=true；拍賣行預覽等唯讀
// 情境不會顯示這塊，避免玩家在別人的骰子上誤按洗練。
function renderDiceRefineSection(dice){
  const p = state.player;
  const coins = p.coins || 0;
  const essence = (p.materials && p.materials.diceEssence) || 0;
  if(dice.favorite){
    return `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);">
      <div class="countdown" style="margin-bottom:4px;">🧪 ${tt('洗練','Refine')}</div>
      <div class="sub" style="margin:0;">${tt('這顆骰子已標記為最愛，請先取消最愛才能洗練','This die is marked as favorite — unmark it before refining')}</div>
    </div>`;
  }
  const faces = Array.isArray(dice.faces) ? dice.faces : [];
  const locked = diceRefineGetLocked(dice.id);
  const payMethod = diceRefineGetPayment(dice.id);
  const cost = diceRefineCost(locked.length, payMethod);
  const baseAtkCost = payMethod === 'essence' ? DICE_REFINE_BASE_ATTACK_COST_ESSENCE : DICE_REFINE_BASE_ATTACK_COST;
  const balance = payMethod === 'essence' ? essence : coins;
  const unlockedCount = faces.length - locked.length;
  const checkboxesHtml = faces.map((f,i)=>{
    const checked = locked.includes(i);
