// 系統隨機指定出征所需的「特定卡牌」（而非讓玩家自行選擇要帶哪些卡）。
// 每個任務需要 commonCount 張不同的 common 卡 + uncommonCount 張不同的 uncommon 卡，
// 這些卡牌由系統隨機抽定、每種各需 1 張；玩家若沒有該卡，需要去拍賣行收購。
// 同一階的四種時長選項共用相同的卡牌需求數量。
// 3小時遠征額外需要 tier.rareCount 張 rare 卡；8小時遠征額外需要 tier.epicCount 張 epic（頂級稀有度）卡
// （rareCount / epicCount 由 GM 頁面「遠征玩法設定」調整，每一階分別設定）
function expeditionExtraCardsForDuration(durationKey, tier){
  if(durationKey === 'd3h') return {rare:(tier&&tier.rareCount)||0, epic:0};
  if(durationKey === 'd8h') return {rare:0, epic:(tier&&tier.epicCount)||0};
  return {rare:0, epic:0};
}
function expeditionQuestCardCount(variant, durationKey, tier){
  const extra = expeditionExtraCardsForDuration(durationKey, tier);
  return (variant.commonCount||0) + (variant.uncommonCount||0) + extra.rare + extra.epic;
}
function rollExpeditionRequiredCards(variant, durationKey, tier){
  const picks = [];
  const used = new Set();
  function pickFrom(rarity, count){
    const pool = DECK.filter(c=>c.rarity===rarity && !used.has(c.id));
    for(let i=0; i<count && pool.length>0; i++){
      const idx = Math.floor(Math.random()*pool.length);
      const card = pool.splice(idx,1)[0];
      used.add(card.id);
      picks.push(card.id);
    }
  }
  if(variant.commonCount > 0) pickFrom('common', variant.commonCount);
  if(variant.uncommonCount > 0) pickFrom('uncommon', variant.uncommonCount);
  const extra = expeditionExtraCardsForDuration(durationKey, tier);
  if(extra.rare > 0) pickFrom('rare', extra.rare);
  if(extra.epic > 0) pickFrom('epic', extra.epic);
  return picks;
}
// 取得（必要時重新產生）某個任務＋時長目前指定的出征卡牌清單。
// 回傳 {cards, changed}；changed=true 代表需要把 p 存檔。
function getExpeditionRequiredCards(p, tier, durationKey){
  ensureExpedition(p);
  const variant = tier.durations[durationKey];
  const key = expeditionRollKey(tier.id, durationKey);
  const wanted = expeditionQuestCardCount(variant, durationKey, tier);
  const existing = p.expeditionRolls[key];
  const valid = Array.isArray(existing) && existing.length === wanted && existing.every(id=>DECK_BY_ID[id]);
  if(valid) return {cards: existing, changed:false};
  const cards = rollExpeditionRequiredCards(variant, durationKey, tier);
  p.expeditionRolls[key] = cards;
  return {cards, changed:true};
}
// 遠征等級所需的累積經驗值表（EXP_TABLE[n] = 升到 Lv.n 所需的累積經驗）。
// 最高等級 EXP_MAX_LEVEL 需 >= 所有遠征任務的 unlockLevel（目前最高為 10）。
const EXP_MAX_LEVEL = 10;
const EXP_TABLE = [0, 150, 400, 800, 1400, 2200, 3200, 4500, 6200, 8500, 12000];
function expeditionNextLevelExp(level){
  return EXP_TABLE[Math.min(level+1, EXP_MAX_LEVEL)];
}
function applyExpeditionExpGain(p, gain){
  p.expExp = (p.expExp||0) + gain;
  let leveled = false;
  while(p.expLevel < EXP_MAX_LEVEL && p.expExp >= EXP_TABLE[p.expLevel+1]){
    p.expLevel += 1;
    leveled = true;
  }
  return leveled;
}
async function confirmStartExpedition(tierId, durationKey, itemUsage){
  const p = state.player;
  if(!p) return;
  ensureExpedition(p);
  ensureProfession(p);
  if(p.expedition){ showToast(tt('目前已經有一趟遠征進行中','An expedition is already in progress')); return; }
  const tier = EXPEDITION_QUESTS.find(q=>q.id===tierId);
  let variant = tier && tier.durations[durationKey];
  if(!tier || !variant){ showToast(tt('找不到這個遠征任務','Could not find this expedition')); return; }
  if((p.expLevel||0) < tier.unlockLevel){ showToast(tt('遠征等級尚未達到需求','Your expedition level is too low')); return; }
  const {cards} = getExpeditionRequiredCards(p, tier, durationKey);
  const missing = cards.filter(cid=>(p.cards[cid]||0) < 1);
  if(missing.length > 0){
    showToast(tt('缺少系統指定的出征卡牌，請先到拍賣行收購','Missing the system-assigned expedition cards - please buy them from the Auction House first'));
    return;
  }
  // 向下相容：階段五之前的舊呼叫方式是傳入 boolean（是否使用家具），這裡統一轉成物件格式
  const usage = (typeof itemUsage === 'boolean') ? {furnitureCount: itemUsage ? 1 : 0} : (itemUsage || {});

  // 階段二：職業道具 × 遠征 —— 派遣當下扣道具、算好這趟的加成值存進 p.expedition（結算時直接讀取，之後 GM 調整設定不會影響已派出的遠征）
  // 🪑 家具：可疊加最多 FURNITURE_MAX_STACK 件，逐件遞減，總和封頂 100%
  const furnitureStock = p.professionItems.furniture_common||0;
  const furnitureCount = Math.max(0, Math.min(FURNITURE_MAX_STACK, Math.floor(usage.furnitureCount||0), furnitureStock));
  const furnitureBonus = Math.min(1, FURNITURE_SUCCESS_TIERS.slice(0, furnitureCount).reduce((sum,v)=>sum+v, 0));

  // ⚔️ 武器：只能用 1 把，成功時獎勵區間 +N%（結算時套用）
  const weaponStock = p.professionItems.weapon_common||0;
  const weaponUsed = !!usage.useWeapon && weaponStock > 0;
  const weaponRewardPct = weaponUsed ? WEAPON_EXPEDITION_REWARD_PCT : 0;

  // 💍 飾品：可疊加最多 ACCESSORY_EXPEDITION_MAX_STACK 件，把獎勵下限往上限拉近，總和封頂 100%
  const accessoryStock = p.professionItems.accessory_common||0;
  const accessoryCount = Math.max(0, Math.min(ACCESSORY_EXPEDITION_MAX_STACK, Math.floor(usage.accessoryCount||0), accessoryStock));
  const accessoryFloorPct = Math.min(1, accessoryCount * ACCESSORY_EXPEDITION_FLOOR_PCT);

  // 🎲 階段二：風險等級 + 局內祝福/詛咒 —— 僅 Lv >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL 生效，未達門檻一律視為「標準／無」
  const rogueUnlocked = (p.expLevel||0) >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL;
  const riskKey = (rogueUnlocked && usage.riskLevel && EXPEDITION_RISK_LEVELS[usage.riskLevel]) ? usage.riskLevel : 'standard';
  const riskData = EXPEDITION_RISK_LEVELS[riskKey];
  const risk = {successDelta: riskData.successDelta, rewardMult: riskData.rewardMult, extraCardLossOnFail: riskData.extraCardLossOnFail};
  let blessingCurse = null;
  if(rogueUnlocked && usage.blessingCardId){
    const card = EXPEDITION_BLESSING_CURSE_POOL.find(c=>c.id === usage.blessingCardId);
    if(card) blessingCurse = JSON.parse(JSON.stringify(card)); // 存快照，之後 GM 調整卡池內容不影響已出征的這趟
  }
  // 翻牌選卡是這趟遠征的必要步驟（跟門檻解鎖綁在一起），沒選就不能出征
  if(rogueUnlocked && !blessingCurse){
    showToast(tt('請先選好風險等級並翻牌選1張效果卡','Pick a risk level and draw+select a card first'));
    return;
  }
  // 祝福/詛咒的時間類效果（疾行/束縛）在派遣當下就決定這趟的實際時長
  let effectiveDurationMs = variant.durationMs;
  if(blessingCurse && typeof blessingCurse.durationPctDelta === 'number'){
    effectiveDurationMs = Math.max(1000, Math.round(variant.durationMs * (1 + blessingCurse.durationPctDelta)));
  }

  if(furnitureCount > 0) p.professionItems.furniture_common -= furnitureCount;
  if(weaponUsed) p.professionItems.weapon_common -= 1;
  if(accessoryCount > 0) p.professionItems.accessory_common -= accessoryCount;

  const staked = {};
  cards.forEach(cid=>{
    p.cards[cid] = (p.cards[cid]||0) - 1;
    staked[cid] = (staked[cid]||0) + 1;
  });
  const now = Date.now();
  p.expedition = {
    tierId: tier.id, durationKey, startAt: now, readyAt: now + effectiveDurationMs, staked,
    furnitureBonus, furnitureCount,
    weaponUsed, weaponRewardPct,
    accessoryCount, accessoryFloorPct,
    potionMinutesUsed: 0, // 階段四：進行中頁面使用藥水縮時，會累加這個欄位
    riskLevel: riskKey, risk, // 階段二：風險等級快照，結算時（階段四）直接讀取
    blessingCurse, // 階段二：這趟帶著出征的祝福/詛咒卡快照（null 表示未解鎖或無），事件節點/結算時讀取
    events: rogueUnlocked ? buildExpeditionEventSchedule(durationKey, now, effectiveDurationMs) : [], // 階段三：事件節點時刻表
    eventSuccessDelta: 0, eventRewardPctDelta: 0, extraBlessings: [], // 階段三：事件節點結算時疊加進來的加成，結算時（階段四）讀取
  };
  // 這批卡牌已經帶出去了，重新替這個任務＋時長隨機指定下一批出征所需卡牌
  p.expeditionRolls[expeditionRollKey(tier.id, durationKey)] = rollExpeditionRequiredCards(variant, durationKey, tier);
  delete expeditionRogueDraft[`${tier.id}-${durationKey}`];
  await savePlayer(p);
  const usedNotes = [];
  if(furnitureCount > 0) usedNotes.push(tt(`🪑家具×${furnitureCount}（成功率+${Math.round(furnitureBonus*100)}%）`, `🪑Furniture×${furnitureCount} (success +${Math.round(furnitureBonus*100)}%)`));
  if(weaponUsed) usedNotes.push(tt(`⚔️武器（獎勵區間+${Math.round(weaponRewardPct*100)}%）`, `⚔️Weapon (reward range +${Math.round(weaponRewardPct*100)}%)`));
  if(accessoryCount > 0) usedNotes.push(tt(`💍飾品×${accessoryCount}（獎勵下限拉近${Math.round(accessoryFloorPct*100)}%）`, `💍Accessory×${accessoryCount} (reward floor pulled ${Math.round(accessoryFloorPct*100)}% toward max)`));
  if(rogueUnlocked) usedNotes.push(tt(`🎲${riskData.labelZh}`, `🎲${riskData.labelEn}`));
  if(blessingCurse) usedNotes.push(`${blessingCurse.icon}${tt(blessingCurse.labelZh, blessingCurse.labelEn)}`);
  const usedSuffix = usedNotes.length ? `（${usedNotes.join('、')}）` : '';
  showToast(tt(`🧭 已派出「${expeditionTierLabel(tier)}・${expeditionDurationLabel(durationKey)}」${usedSuffix}，${formatDuration(effectiveDurationMs)} 後回來查看結果`, `🧭 Sent out on "${expeditionTierLabel(tier)} · ${expeditionDurationLabel(durationKey)}"${usedSuffix} - check back in ${formatDuration(effectiveDurationMs)}`));
  render();
}
// 階段四：玩家沒回來點事件節點、遠征就已到期的「逾時安全預設」——
// 選擇型節點自動套用該節點的第一個選項（岔路/陷阱/商人的池子設計上第一個選項都是「不變」的安全選項，無成本無風險）；
// 戰鬥型節點正常情況下 renderExpedition 每次渲染就會自動判定掉，這裡是保底（例如結算前沒有先渲染過的呼叫路徑）。
function autoResolveTimedOutExpeditionEvents(p, exp){
  if(!exp || !Array.isArray(exp.events)) return;
  exp.events.forEach(ev=>{
    if(ev.resolved) return;
    if(ev.kind === 'combat'){
      autoResolveExpeditionCombatEvent(p, ev);
    } else {

      const safeOption = evDef && evDef.options[0];
      if(safeOption){
        resolveExpeditionEventOption(p, ev, safeOption.id);
        ev.autoResolved = true; // 標記為逾時自動選擇，非玩家手動操作，供遭遇紀錄顯示區分
      } else {
        ev.resolved = true; // 找不到定義（例如舊存檔/GM改過池子），安全跳過不疊加任何效果
      }
    }
  });
}
async function claimExpedition(){
  const p = state.player;
  if(!p) return;
  ensureExpedition(p);
  const exp = p.expedition;
  if(!exp){ return; }
  if(Date.now() < exp.readyAt){ showToast(tt('遠征尚未歸來','The expedition hasn\'t returned yet')); return; }
  const tier = EXPEDITION_QUESTS.find(q=>q.id===exp.tierId);
  const variant = tier && tier.durations[exp.durationKey];
  if(!tier || !variant){
    p.expedition = null;
    await savePlayer(p);
    showToast(tt('這個遠征任務已被移除，卡牌無法退還','This expedition no longer exists - cards cannot be refunded'));
    render();
    return;
  }
  // 玩家沒點到的事件節點（逾時未處理）先用安全預設結算掉，效果會疊進 eventSuccessDelta/eventRewardPctDelta
  autoResolveTimedOutExpeditionEvents(p, exp);

  const risk = exp.risk || {successDelta:0, rewardMult:1, extraCardLossOnFail:0};
  const blessingCurse = exp.blessingCurse || null;
  const eventSuccessDelta = exp.eventSuccessDelta || 0;
  const eventRewardPctDelta = exp.eventRewardPctDelta || 0;
  // 🔥 連勝加成用「派遣當下」的連勝數（= 目前這趟結算前 p.expeditionStreak 的值，因為同時只能有一趟遠征在進行，
  // 這個計數在派遣後、這趟結算前不會被其他遠征變動過）
  const streakBefore = Math.max(0, p.expeditionStreak||0);

  // 🎲 最終成功率：既有家具加成 + 風險等級 + 局內祝福/詛咒 + 事件節點結果，全部疊加後夾在 0~100%
  const effectiveRate = Math.min(1, Math.max(0,
    variant.successRate
    + (exp.furnitureBonus||0)
    + (risk.successDelta||0)
    + (blessingCurse ? (blessingCurse.successDelta||0) : 0)
    + eventSuccessDelta
  ));
  const success = Math.random() < effectiveRate;
  p.expedition = null;

  let msg;
  const bonusNotes = [];
  if(success){
    // 獎勵區間：⚔️武器/💍飾品(既有) + 🎴祝福獎勵區間 + 🗺️事件節點結果，先疊加成一個百分比套用在上下限，
    // 再乘上 🎲 風險等級倍率；💍飾品最後把下限往（疊加後的）上限拉近；成功後再套 🎴祝福/詛咒的成功獎勵倍率、🔥連勝加成。
    const weaponPct = exp.weaponRewardPct||0;
    const accessoryPct = exp.accessoryFloorPct||0;
    const blessingRangePct = blessingCurse ? (blessingCurse.rewardRangePctDelta||0) : 0;
    const riskMult = risk.rewardMult || 1;
    const totalRangePct = Math.max(-0.95, weaponPct + blessingRangePct + eventRewardPctDelta);
    const boostedMin = variant.rewardCoinsMin * (1 + totalRangePct) * riskMult;
    const boostedMax = variant.rewardCoinsMax * (1 + totalRangePct) * riskMult;
    const rangeMin = Math.min(boostedMin, boostedMax);
    const rangeMax = Math.max(boostedMin, boostedMax);
    const effectiveMin = Math.min(rangeMax, rangeMin + (rangeMax - rangeMin) * accessoryPct);
    let coins = effectiveMin + Math.random()*(rangeMax - effectiveMin);
    const successMult = blessingCurse ? (blessingCurse.successRewardMult||1) : 1;
    coins *= successMult;
    const streakBonusPct = Math.min(EXPEDITION_STREAK_BONUS_CAP, streakBefore * EXPEDITION_STREAK_BONUS_PER_WIN);
    coins *= (1 + streakBonusPct);
    coins = Math.max(0, Math.round(coins));
    p.coins = (p.coins||0) + coins;

    const expPct = blessingCurse ? (blessingCurse.expRewardPctDelta||0) : 0;
    const rewardExp = Math.max(0, Math.round(variant.rewardExp * (1 + expPct)));
    const leveled = applyExpeditionExpGain(p, rewardExp);
    // 🔥 只有「亡命」風險等級 + 8小時時長的遠征才計入連勝，其餘任務成功不影響連勝數
    if(exp.riskLevel === 'reckless' && exp.durationKey === 'd8h'){
      p.expeditionStreak = streakBefore + 1;
      p.expeditionRecklessStreak = (p.expeditionRecklessStreak||0) + 1;
    }

    if(exp.furnitureBonus) bonusNotes.push(tt('🪑家具加成生效','🪑Furniture bonus applied'));
    if(weaponPct) bonusNotes.push(tt(`⚔️武器獎勵區間+${Math.round(weaponPct*100)}%`, `⚔️Weapon reward range +${Math.round(weaponPct*100)}%`));
    if(accessoryPct) bonusNotes.push(tt(`💍飾品拉近上限${Math.round(accessoryPct*100)}%`, `💍Accessory pulled ${Math.round(accessoryPct*100)}% toward max`));
    if(exp.riskLevel && exp.riskLevel !== 'standard') bonusNotes.push(tt(`🎲${EXPEDITION_RISK_LEVELS[exp.riskLevel]?.labelZh||exp.riskLevel}（獎勵×${riskMult}）`, `🎲${EXPEDITION_RISK_LEVELS[exp.riskLevel]?.labelEn||exp.riskLevel} (reward ×${riskMult})`));
    if(blessingCurse) bonusNotes.push(`${blessingCurse.icon}${tt(blessingCurse.labelZh, blessingCurse.labelEn)}`);
    if(eventRewardPctDelta) bonusNotes.push(tt(`🗺️遭遇加成${eventRewardPctDelta>=0?'+':''}${Math.round(eventRewardPctDelta*100)}%`, `🗺️Encounter bonus ${eventRewardPctDelta>=0?'+':''}${Math.round(eventRewardPctDelta*100)}%`));
    if(streakBonusPct > 0) bonusNotes.push(tt(`🔥連勝${streakBefore}次（獎勵+${Math.round(streakBonusPct*100)}%）`, `🔥${streakBefore}-win streak (reward +${Math.round(streakBonusPct*100)}%)`));
    const bonusSuffix = bonusNotes.length ? `（${bonusNotes.join('、')}）` : '';
    msg = tt(`🧭 遠征成功！獲得 ✦${coins} 金幣、經驗 +${rewardExp}${leveled ? `，遠征等級提升到 Lv.${p.expLevel}！` : ''}${bonusSuffix}`, `🧭 Expedition succeeded! +✦${coins} coins, +${rewardExp} exp${leveled ? `, expedition level up to Lv.${p.expLevel}!` : ''}${bonusSuffix}`);
  } else {
    // 🔥 連勝只在「亡命」風險等級 + 8小時時長成功時累計，但只要遠征失敗（不論風險等級／時長），連勝一律中斷歸零
    p.expeditionStreak = 0;
    p.expeditionRecklessStreak = 0;
    // 🛡️守護：帶出去的卡牌按比例退回一部分（原本全損，這裡按 type 各自四捨五入退回）
    const keepPct = blessingCurse ? (blessingCurse.failCardKeepPct||0) : 0;
    if(keepPct > 0 && exp.staked){
      let refundedTotal = 0;
      Object.keys(exp.staked).forEach(cid=>{
        const refund = Math.round(exp.staked[cid] * keepPct);
        if(refund > 0){
          p.cards[cid] = (p.cards[cid]||0) + refund;
          refundedTotal += refund;
        }
      });
      if(refundedTotal > 0) bonusNotes.push(tt(`🛡️守護保留${refundedTotal}張卡牌`, `🛡️Guardian kept ${refundedTotal} card(s)`));
    }
    // 🎲亡命/💀死亡契約：失敗時從現有庫存額外隨機扣卡（跟帶出去、已經全損的出征卡是分開的）
    const extraLoss = (risk.extraCardLossOnFail||0) + (blessingCurse ? (blessingCurse.failExtraCardLoss||0) : 0);
    if(extraLoss > 0){
      let actuallyLost = 0;
      for(let i=0;i<extraLoss;i++){
        const ownedIds = Object.keys(p.cards).filter(cid=>(p.cards[cid]||0) > 0);
        if(ownedIds.length===0) break;
        const pickId = ownedIds[Math.floor(Math.random()*ownedIds.length)];
        p.cards[pickId] -= 1;
        actuallyLost += 1;
      }
      if(actuallyLost > 0) bonusNotes.push(tt(`💀額外損失${actuallyLost}張隨機庫存卡`, `💀Lost ${actuallyLost} extra random card(s)`));
    }
    const expPct = blessingCurse ? (blessingCurse.expRewardPctDelta||0) : 0;
    const failExpVal = Math.max(0, Math.round(variant.failExp * (1 + expPct)));
    const leveled = applyExpeditionExpGain(p, failExpVal);
    const bonusSuffix = bonusNotes.length ? `（${bonusNotes.join('、')}）` : '';
    msg = tt(`⚠️ 遠征失敗了，帶出去的卡牌沒能收回，僅獲得經驗 +${failExpVal}${leveled ? `，遠征等級提升到 Lv.${p.expLevel}！` : ''}${bonusSuffix}`, `⚠️ The expedition failed - the cards you brought were lost, but you gained +${failExpVal} exp${leveled ? `, expedition level up to Lv.${p.expLevel}!` : ''}${bonusSuffix}`);
  }
  await savePlayer(p);
  showToast(msg);
  render();
}
async function usePotionOnExpedition(){
  const p = state.player;
  if(!p) return;
  ensureExpedition(p);
  ensureProfession(p);
  const exp = p.expedition;
  if(!exp){ showToast(tt('目前沒有進行中的遠征','No expedition in progress')); return; }
  if(Date.now() >= exp.readyAt){ showToast(tt('遠征已經可以領取了','The expedition is already ready to claim')); return; }
  if(exp.blessingCurse && exp.blessingCurse.blockPotion){ showToast(tt('🚫封印生效中，這趟遠征無法使用小藥水縮時','🚫Sealed - Small Potions can\'t be used to shorten this run')); return; }
  if((p.professionItems.potion_small||0) < 1){ showToast(tt('沒有小藥水','No Small Potions')); return; }
  const reduceMs = POTION_EXPEDITION_MINUTES * 60 * 1000;
  const floorAt = Date.now() + POTION_EXPEDITION_MIN_REMAIN_MINUTES * 60 * 1000;
  if(exp.readyAt <= floorAt){
    showToast(tt(`剩餘時間已經接近下限（${POTION_EXPEDITION_MIN_REMAIN_MINUTES} 分鐘），無法再縮短`, `Remaining time is already near the floor (${POTION_EXPEDITION_MIN_REMAIN_MINUTES} min) - can't shorten further`));
    return;
  }
  p.professionItems.potion_small -= 1;
  exp.readyAt = Math.max(floorAt, exp.readyAt - reduceMs);
  exp.potionMinutesUsed = (exp.potionMinutesUsed||0) + POTION_EXPEDITION_MINUTES;
  await savePlayer(p);
  const nowReady = Date.now() >= exp.readyAt;
  showToast(nowReady
    ? tt('🧪 已使用小藥水，遠征剩餘時間已縮短完畢，可以領取了！','🧪 Used a Small Potion - remaining time is up, the expedition is ready to claim!')
    : tt(`🧪 已使用小藥水，遠征剩餘時間 -${POTION_EXPEDITION_MINUTES} 分鐘`, `🧪 Used a Small Potion, expedition time -${POTION_EXPEDITION_MINUTES} min`));
  render();
}

  const savedChecks = Array.from(document.querySelectorAll('input[type=checkbox][id^="weapon-cb-"]:checked')).map(el=>el.id);

    ${(p.expLevel||0) >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL ? `<div class="countdown" style="font-size:11px;margin-top:2px;">${tt('🔥僅「亡命」風險等級＋8小時遠征才計入連勝次數', '🔥Only Reckless risk + 8-hour expeditions count toward the win streak')}</div>` : ''}
  </div>`;

  if(exp){
    const tier = EXPEDITION_QUESTS.find(q=>q.id===exp.tierId);
    const ready = now >= exp.readyAt;
    const stakedLines = Object.keys(exp.staked||{}).map(cid=>{
      const c = DECK_BY_ID[cid];
      return c ? `${c.icon||''} ${escapeHtml(c.name)} ×${exp.staked[cid]}` : `${cid} ×${exp.staked[cid]}`;
    }).join('　');
    const inProgressLabel = tier ? `：${expeditionTierLabel(tier)}・${expeditionDurationLabel(exp.durationKey)}` : '';
    const potionQty = p.professionItems.potion_small||0;
    const rogueLine = (exp.riskLevel && exp.riskLevel !== 'standard') || exp.blessingCurse
      ? `<p class="sub">${exp.riskLevel && exp.riskLevel!=='standard' ? tt(`🎲 風險：${EXPEDITION_RISK_LEVELS[exp.riskLevel]?.labelZh||exp.riskLevel}　`, `🎲 Risk: ${EXPEDITION_RISK_LEVELS[exp.riskLevel]?.labelEn||exp.riskLevel}　`) : ''}${exp.blessingCurse ? `${exp.blessingCurse.icon} ${tt(exp.blessingCurse.labelZh, exp.blessingCurse.labelEn)}` : ''}</p>`
      : '';
    // 階段三：遭遇紀錄（已處理的事件節點）
    const resolvedEvents = (exp.events||[]).filter(ev=>ev.resolved);
    const eventLogHtml = resolvedEvents.length
      ? `<div class="farm-upgrade-line" style="color:var(--muted);margin-top:6px;">${tt('🗺️ 遭遇紀錄','🗺️ Encounter Log')}</div>${resolvedEvents.map(ev=>`<div class="farm-upgrade-line" style="font-size:11px;">${expeditionEventLogLine(ev)}</div>`).join('')}`
      : '';
    html += `<div class="panel">
      <h2>${tt('進行中的遠征','Expedition In Progress')}${inProgressLabel}</h2>
      <p class="sub">${tt('帶出去的卡牌','Cards brought along')}：${stakedLines}</p>
      ${rogueLine}
      ${ready
        ? `<div class="countdown" style="color:var(--gold-bright);margin-bottom:10px;">${tt('遠征已歸來！','The expedition has returned!')}</div>
           <button class="btn" id="expedition-claim-btn">${tt('領取遠征成果','Claim Expedition Result')}</button>`
        : (exp.blessingCurse && exp.blessingCurse.blockPotion)
          ? `<div class="countdown" style="margin-bottom:10px;">${tt(`還需 ${formatDuration(exp.readyAt-now)}`, `${formatDuration(exp.readyAt-now)} remaining`)}</div>
             <button class="btn small secondary" disabled style="opacity:0.5;">${tt('🚫 封印生效中，無法使用小藥水','🚫 Sealed - Small Potion unavailable')}</button>`
          : `<div class="countdown" style="margin-bottom:10px;">${tt(`還需 ${formatDuration(exp.readyAt-now)}`, `${formatDuration(exp.readyAt-now)} remaining`)}</div>
             <button class="btn small secondary" id="expedition-use-potion-btn" ${potionQty>0?'':'disabled'} style="${potionQty>0?'':'opacity:0.5;'}">${tt(`🧪 使用小藥水（-${POTION_EXPEDITION_MINUTES}分鐘，庫存 ${potionQty}）`, `🧪 Use Small Potion (-${POTION_EXPEDITION_MINUTES}min, stock ${potionQty})`)}</button>`
      }
      ${eventLogHtml}
    </div>`;
    // 階段三：尚未處理、時間已到的「選擇型」節點——無論遠征是否已經「可領取」都要顯示，
    // 讓玩家有機會互動（喝藥水縮時、或單純太晚回來查看，都可能讓 ready 早於節點觸發時間）
    const pendingChoiceEvent = (exp.events||[]).find(ev=>!ev.resolved && now>=ev.triggerAt && ev.kind==='choice');
    if(pendingChoiceEvent) html += renderExpeditionEventChoicePanel(p, pendingChoiceEvent);
  } else {
    // 升級後只顯示「當前等級」對應的那個任務（已解鎖任務中，解鎖門檻最高的一個），
    // 較低等級、已經超越的任務不再顯示。
    const eligible = EXPEDITION_QUESTS.filter(q=>(p.expLevel||0) >= q.unlockLevel);
    const currentTier = eligible.length ? eligible.reduce((a,b)=> b.unlockLevel > a.unlockLevel ? b : a) : null;
    const unlocked = currentTier ? [currentTier] : [];
    const locked = EXPEDITION_QUESTS.filter(q=> !currentTier || q.unlockLevel > currentTier.unlockLevel);

    // 為每個已解鎖的任務＋時長組合準備（必要時重新產生）系統指定的出征卡牌
    let rollsChanged = false;
    const tierDurationCards = {};
    unlocked.forEach(tier=>{
      tierDurationCards[tier.id] = {};
      EXPEDITION_DURATION_KEYS.forEach(durKey=>{
        const {cards, changed} = getExpeditionRequiredCards(p, tier, durKey);
        tierDurationCards[tier.id][durKey] = cards;
        if(changed) rollsChanged = true;
      });
    });
    if(rollsChanged) await savePlayer(p);

    html += `<div class="panel"><h2>${tt('可出征的任務','Available Expeditions')}</h2>
      <div class="farm-upgrade-line" style="color:var(--muted);">${tt('出征前可選用職業成品加成這一趟：🪑家具提升成功率、⚔️武器提升獎勵區間、💍飾品讓獎勵更容易貼近上限。', 'Before dispatch you can use profession items to boost this run: 🪑Furniture raises success rate, ⚔️Weapon raises the reward range, 💍Accessory makes rewards more likely to land near the max.')}</div>`;
    if(unlocked.length===0){
      html += `<div class="empty-note">${tt('目前沒有已解鎖的任務','No unlocked expeditions yet')}</div>`;
    } else {
      unlocked.forEach(tier=>{
        html += `<div class="farm-upgrade-box" style="margin-bottom:12px;">
          <div class="farm-upgrade-title">${expeditionTierLabel(tier)}</div>`;
        EXPEDITION_DURATION_KEYS.forEach(durKey=>{
          const variant = tier.durations[durKey];
          const cards = (tierDurationCards[tier.id] && tierDurationCards[tier.id][durKey]) || [];
          const canAfford = cards.every(cid=>(p.cards[cid]||0) >= 1);
          html += `<div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;">
            <div class="farm-upgrade-line" style="color:var(--gold-bright);">⏱ ${expeditionDurationLabel(durKey)}</div>
            <div class="farm-upgrade-line" style="color:var(--muted);">${tt('本次系統指定的出征卡牌：','Cards the system has assigned for this run:')}</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;">
              ${cards.map(cid=>{
                const c = DECK_BY_ID[cid];
                const have = (p.cards[cid]||0) >= 1;
                return `<div style="display:flex;align-items:center;gap:6px;background:var(--bg-panel-raised);border:1px solid ${have?'var(--line)':'var(--danger)'};border-radius:8px;padding:5px 9px;font-size:12px;">
                  <span style="color:${have?'#7ec98f':'var(--danger)'};">${have?'✓':'✗'}</span> ${c?(c.icon||''):''} ${escapeHtml(c?c.name:cid)}
                </div>`;
              }).join('')}
            </div>
            <div class="farm-upgrade-line">🎲 ${tt(`成功率 ${Math.round(variant.successRate*100)}%`, `Success ${Math.round(variant.successRate*100)}%`)}</div>
            <div class="farm-upgrade-line">✦ ${tt(`獎勵 ${variant.rewardCoinsMin}–${variant.rewardCoinsMax} 金幣、經驗 +${variant.rewardExp}`, `Reward ${variant.rewardCoinsMin}-${variant.rewardCoinsMax} coins, +${variant.rewardExp} exp`)}</div>
            ${canAfford ? (()=>{
              const uid = `${tier.id}-${durKey}`;
              const furnitureQty = p.professionItems.furniture_common||0;
              const weaponQty = p.professionItems.weapon_common||0;
              const accessoryQty = p.professionItems.accessory_common||0;
              const furnitureMax = Math.min(FURNITURE_MAX_STACK, furnitureQty);
              const accessoryMax = Math.min(ACCESSORY_EXPEDITION_MAX_STACK, accessoryQty);
              const furnitureOptions = Array.from({length: furnitureMax+1}, (_,n)=>{
                const bonus = Math.round(FURNITURE_SUCCESS_TIERS.slice(0,n).reduce((s,v)=>s+v,0)*100);
                return `<option value="${n}">${n===0 ? tt('不使用','None') : tt(`${n} 件（成功率 +${bonus}%）`, `${n} (success +${bonus}%)`)}</option>`;
              }).join('');
              const accessoryOptions = Array.from({length: accessoryMax+1}, (_,n)=>{
                const pct = Math.round(Math.min(1, n*ACCESSORY_EXPEDITION_FLOOR_PCT)*100);
                return `<option value="${n}">${n===0 ? tt('不使用','None') : tt(`${n} 件（下限拉近 ${pct}%）`, `${n} (floor pulled ${pct}%)`)}</option>`;
              }).join('');
              return `<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">
                <label style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;${furnitureQty>0?'':'opacity:0.5;'}">
                  🪑 ${tt('家具','Furniture')}
                  <select id="furniture-sel-${uid}" ${furnitureQty>0?'':'disabled'} style="min-width:150px;">${furnitureOptions}</select>
                  <span style="color:var(--muted);font-size:11px;">${tt(`庫存 ${furnitureQty}`, `Stock ${furnitureQty}`)}</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;${weaponQty>0?'':'opacity:0.5;'}">
                  <input type="checkbox" id="weapon-cb-${uid}" ${weaponQty>0?'':'disabled'} />
                  ⚔️ ${tt(`使用武器（獎勵區間 +${Math.round(WEAPON_EXPEDITION_REWARD_PCT*100)}%）`, `Use Weapon (reward range +${Math.round(WEAPON_EXPEDITION_REWARD_PCT*100)}%)`)}
                  <span style="color:var(--muted);font-size:11px;">${tt(`庫存 ${weaponQty}`, `Stock ${weaponQty}`)}</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;${accessoryQty>0?'':'opacity:0.5;'}">
                  💍 ${tt('飾品','Accessory')}
                  <select id="accessory-sel-${uid}" ${accessoryQty>0?'':'disabled'} style="min-width:150px;">${accessoryOptions}</select>
                  <span style="color:var(--muted);font-size:11px;">${tt(`庫存 ${accessoryQty}`, `Stock ${accessoryQty}`)}</span>
                </label>
              </div>${(p.expLevel||0) >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL ? renderExpeditionRogueDraftUI(uid) : ''}`;
            })() : ''}
            ${canAfford ? (()=>{
              const uid = `${tier.id}-${durKey}`;
              const rogueUnlocked = (p.expLevel||0) >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL;
              const draft = rogueUnlocked ? getExpeditionRogueDraft(uid) : null;
              const rogueReady = !rogueUnlocked || (draft && draft.drawnCards && draft.selectedIdx !== null);
              return `<button class="btn small" data-expedition-start-tier="${tier.id}" data-expedition-start-dur="${durKey}" data-expedition-uid="${uid}" ${rogueReady?'':'disabled'} style="margin-top:8px;${rogueReady?'':'opacity:0.5;'}">${tt('確認出征','Confirm Expedition')}</button>`;
            })() : `<button class="btn small secondary" data-expedition-goto-auction="1" style="margin-top:8px;">${tt('卡牌不足，前往拍賣行收購','Not enough cards - go to Auction House')}</button>`
            }
          </div>`;
        });
        html += `</div>`;
      });
    }
    if(locked.length>0){
      html += `<div class="farm-upgrade-title" style="margin-top:6px;">${tt('尚未解鎖','Not yet unlocked')}</div>`;
      locked.forEach(tier=>{
        html += `<div class="farm-upgrade-line" style="color:var(--muted);">🔒 ${expeditionTierLabel(tier)}（${tt(`需遠征 Lv.${tier.unlockLevel}`, `Needs Expedition Lv.${tier.unlockLevel}`)}）</div>`;
      });
    }
    html += `</div>`;
  }

  body.innerHTML = html;
  const claimBtn = document.getElementById('expedition-claim-btn');
  if(claimBtn) claimBtn.onclick = claimExpedition;
  const usePotionBtn = document.getElementById('expedition-use-potion-btn');
  if(usePotionBtn) usePotionBtn.onclick = usePotionOnExpedition;
  document.querySelectorAll('[data-rogue-event-idx]').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.dataset.rogueEventIdx, 10);
      const curExp = state.player.expedition;
      const event = curExp && (curExp.events||[]).find(e=>e.idx===idx);
      if(!event || event.resolved) return;
      const result = resolveExpeditionEventOption(state.player, event, btn.dataset.rogueEventOption);
      if(result && result.error){
        showToast(result.error==='item' ? tt('庫存不足','Not enough stock') : tt('金幣不足','Not enough coins'));
        return;
      }
      await savePlayer(state.player);
      render();
    };
  });
  document.querySelectorAll('[data-rogue-risk-key]').forEach(btn=>{
    btn.onclick = ()=>{
      const uid = btn.dataset.rogueRiskUid;
      const key = btn.dataset.rogueRiskKey;
      const draft = getExpeditionRogueDraft(uid);
      if(draft.riskLevel !== key){
        draft.riskLevel = key;
        draft.drawnCards = null; // 風險等級變了，之前翻的牌作廢，需要重新翻
        draft.selectedIdx = null;
      }
      renderPreservingExpeditionItemInputs();
    };
  });
  document.querySelectorAll('[data-rogue-draw-uid]').forEach(btn=>{
    btn.onclick = ()=>{
      const uid = btn.dataset.rogueDrawUid;
      const draft = getExpeditionRogueDraft(uid);
      draft.drawnCards = drawExpeditionBlessingCurseCards(draft.riskLevel);
      draft.selectedIdx = null;
      renderPreservingExpeditionItemInputs();
    };
  });
  document.querySelectorAll('[data-rogue-card-idx]').forEach(btn=>{
    btn.onclick = ()=>{
      const uid = btn.dataset.rogueCardUid;
      const idx = parseInt(btn.dataset.rogueCardIdx, 10);
      const draft = getExpeditionRogueDraft(uid);
      draft.selectedIdx = idx;
      renderPreservingExpeditionItemInputs();
    };
  });
  document.querySelectorAll('[data-expedition-start-tier]').forEach(btn=>{
    btn.onclick = ()=>{
      const uid = btn.dataset.expeditionUid;
      const furnitureSel = uid ? document.getElementById(`furniture-sel-${uid}`) : null;
      const weaponCb = uid ? document.getElementById(`weapon-cb-${uid}`) : null;
      const accessorySel = uid ? document.getElementById(`accessory-sel-${uid}`) : null;
      const rogueUnlocked = (state.player.expLevel||0) >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL;
      const draft = rogueUnlocked && uid ? getExpeditionRogueDraft(uid) : null;
      const hasSelectedCard = !!(draft && draft.drawnCards && draft.selectedIdx !== null);
      if(rogueUnlocked && !hasSelectedCard){
        showToast(tt('請先選好風險等級並翻牌選1張效果卡','Pick a risk level and draw+select a card first'));
        return;
      }
      const itemUsage = {
        furnitureCount: furnitureSel ? parseInt(furnitureSel.value,10)||0 : 0,
        useWeapon: !!weaponCb?.checked,
        accessoryCount: accessorySel ? parseInt(accessorySel.value,10)||0 : 0,
        riskLevel: draft ? draft.riskLevel : 'standard',
        blessingCardId: hasSelectedCard ? draft.drawnCards[draft.selectedIdx].id : null,
      };
      confirmStartExpedition(parseInt(btn.dataset.expeditionStartTier,10), btn.dataset.expeditionStartDur, itemUsage);
    };
  });
  document.querySelectorAll('[data-expedition-goto-auction]').forEach(btn=>{
    btn.onclick = async ()=>{
      state.tab = 'auction';
      await refreshPlayer();
      render();
    };
  });
}

async function plantSeed(plotIndex, seedKey){
  const p = state.player;
  if(!p) return;
  const seed = SEED_TYPES[seedKey];
  if(!seed) return;
  const farm = ensureFarm(p);
  const plot = farm[plotIndex];
  if(!plot || plot.seed){ showToast(tt('這塊地已經種了東西','This plot already has something planted')); return; }
  if((seed.tierLevel||0) > (p.farmLevel||0)){
    showToast(tt(`花園等級需達 Lv.${seed.tierLevel} 才能解鎖此種子`, `Requires garden Lv.${seed.tierLevel} to unlock this seed`));
    return;
  }
  if(seed.seasonOnly && !SEASON_ACTIVE){
    showToast(tt('賽季已結束，無法再種植此種子','The season has ended - this seed can no longer be planted'));
    return;
  }
  if(seed.unlockTotal){
    const total = seed.uniqueUnlock ? playerUniqueCards(p) : playerTotalCards(p);
    if(total < seed.unlockTotal){
      const msg = seed.uniqueUnlock
        ? tt(`收藏超過 ${seed.unlockTotal-1} 種不同卡牌才能種植${seedName(seed)}`, `Collect more than ${seed.unlockTotal-1} unique cards to unlock planting ${seedName(seed)}`)
        : tt(`收藏滿 ${seed.unlockTotal} 張卡才能種植${seedName(seed)}`, `Collect ${seed.unlockTotal} cards to unlock planting ${seedName(seed)}`);
      showToast(msg);
      return;
    }
  }
  if((p.coins||0) < seed.cost){ showToast(tt('金幣不足','Not enough coins')); return; }
  p.coins -= seed.cost;
  const now = Date.now();
  const effectiveGrowMs = Math.round(seed.growMs * starChartGrowMsMultiplier(p));
  plot.seed = seedKey;
  plot.plantedAt = now;
  plot.readyAt = now + effectiveGrowMs;
  plot.witherAt = seed.wither ? plot.readyAt + seed.witherMs : null;
  plot.waterLog = {};
  plot.stolenBy = [];
  bumpQuest(p, 'plant', 1);
  await savePlayer(p);
  showToast(tt(`已種下${seedName(seed)}`, `Planted ${seedName(seed)}`));
  render();
}

async function harvestPlot(plotIndex, opts){
  opts = opts || {};
  const p = state.player;
  if(!p) return null;
  const farm = ensureFarm(p);
  const plot = farm[plotIndex];
  const now = Date.now();
  const status = plotStatus(plot, now);
  if(status === 'empty' || status === 'growing') return null;

  const seed = SEED_TYPES[plot.seed];
  let result = null;
  if(status === 'withered'){
    result = {withered:true, seedName: seedName(seed)};
  } else {
    ensureMaterials(p);
    let coinGain = Math.floor(Math.random()*(seed.coinMax-seed.coinMin+1)) + seed.coinMin;
    coinGain = Math.round(coinGain * starChartCoinMultiplier(p) * starChartYieldMultiplier(p));
    p.coins = (p.coins||0) + coinGain;
    let moonGain = 0;
    if(seed.moonBrillianceMin){
      moonGain = Math.floor(Math.random()*(seed.moonBrillianceMax-seed.moonBrillianceMin+1)) + seed.moonBrillianceMin;
      moonGain = Math.round(moonGain * starChartYieldMultiplier(p));
      p.materials.moon += moonGain;
    }
    let bonusCard = null;
    if(seed.bonusCardChance && Math.random() < seed.bonusCardChance){
      const pool = DECK.filter(c=>seed.bonusCardRarities.includes(c.rarity));
      if(pool.length){
        const card = pool[Math.floor(Math.random()*pool.length)];
        p.cards[card.id] = (p.cards[card.id]||0) + 1;
        bonusCard = card;
      }
    }
    let materialDrop = null;
    if(Math.random() < FARM_MATERIAL_DROP_CHANCE){
      ensureProfession(p);
      const materialId = PROFESSION_MATERIAL_IDS[Math.floor(Math.random()*PROFESSION_MATERIAL_IDS.length)];
      const qty = FARM_MATERIAL_DROP_MIN + Math.floor(Math.random()*(FARM_MATERIAL_DROP_MAX-FARM_MATERIAL_DROP_MIN+1));
      p.professionMaterials[materialId] = (p.professionMaterials[materialId]||0) + qty;
      const def = PROFESSION_DEFS.find(d=>d.materialId===materialId);
      materialDrop = {materialId, qty, icon: def ? def.materialIcon : '', label: def ? professionMaterialLabel(def) : materialId};
    }
    result = {withered:false, seedName: seedName(seed), coinGain, bonusCard, moonGain, materialDrop};
    bumpQuest(p, 'harvest', 1);
    ensureStats(p).totalHarvests += 1;
  }
  plot.seed = null; plot.plantedAt = null; plot.readyAt = null; plot.witherAt = null;
  plot.waterLog = {}; plot.stolenBy = [];
  if(!opts.skipSave) await savePlayer(p);
  return result;
}

async function harvestOne(plotIndex){
  const result = await harvestPlot(plotIndex);
  if(!result) return;
  if(result.withered){
    showToast(tt(`${result.seedName}已經枯萎了，白忙一場 🥀`, `${result.seedName} withered away - all for nothing 🥀`));
  } else {
    let msg = tt(`收成${result.seedName}，獲得 ✦${result.coinGain}`, `Harvested ${result.seedName} for ✦${result.coinGain}`);
    if(result.moonGain) msg += tt(` + 🌙 日月之輝 x${result.moonGain}`, ` + 🌙 Sun-Moon Brilliance x${result.moonGain}`);
    if(result.bonusCard) msg += tt(` + 額外一張「${result.bonusCard.name}」！`, ` + a bonus "${result.bonusCard.name}"!`);
    if(result.materialDrop) msg += tt(` + ${result.materialDrop.icon} ${result.materialDrop.label} x${result.materialDrop.qty}`, ` + ${result.materialDrop.icon} ${result.materialDrop.label} x${result.materialDrop.qty}`);
    showToast(msg);
  }
  render();
}

async function harvestAllReady(){
  const p = state.player;
  if(!p) return;
  const farm = ensureFarm(p);
  const now = Date.now();
  let coinTotal = 0, harvestedCount = 0, witheredCount = 0, moonTotal = 0;
  const bonusCards = [];
  const materialTotals = {};
  for(let i=0;i<farm.length;i++){
    const status = plotStatus(farm[i], now);
    if(status !== 'ready' && status !== 'withered') continue;
    const result = await harvestPlot(i, {skipSave:true});
    if(!result) continue;
    if(result.withered){ witheredCount++; }
    else{
      harvestedCount++; coinTotal += result.coinGain; moonTotal += (result.moonGain||0);
      if(result.bonusCard) bonusCards.push(result.bonusCard.name);
      if(result.materialDrop){
        const md = result.materialDrop;
        if(!materialTotals[md.materialId]) materialTotals[md.materialId] = {icon: md.icon, label: md.label, qty: 0};
        materialTotals[md.materialId].qty += md.qty;
      }
    }
  }

function weightedDraw(){
  const pools = {};
  RARITY_ORDER.forEach(r=>pools[r]=DECK.filter(c=>c.rarity===r));
  const total = Object.values(DRAW_WEIGHTS).reduce((a,b)=>a+b,0);
  let roll = Math.random()*total;
  for(const r of RARITY_ORDER){
    if(roll < DRAW_WEIGHTS[r]){
      const pool = pools[r];
      return pool[Math.floor(Math.random()*pool.length)];
    }
    roll -= DRAW_WEIGHTS[r];
  }
  return pools.common[0];
}

async function loadPlayer(nick){
  try{
    const res = await storage.get(playerKey(nick));
    if(!res) return null;
    const p = JSON.parse(res.value);
    ensureMaterials(p);
    ensureExpedition(p);
    ensureProfession(p);
    ensureDiceInventory(p); // 順便把骰子面效果從精簡格式（id）還原成完整物件，見該函式註解
    return p;
  }catch(e){ return null; }
}
async function savePlayer(p){
  await storage.set(playerKey(p.nickname), serializePlayerForStorage(p));
}
// 讀出玩家資料時保留原始字串（raw，目前只做「存在與否」判斷用）與 updated_at
// （updatedAt，供樂觀鎖 (CAS) 比對用，見 savePlayerCAS 註解）。這裡刻意不吞讀取
// 失敗（不像上面的 loadPlayer），因為呼叫端（updatePlayerCAS）需要準確分辨
// 「讀取失敗」和「玩家真的不存在」，才能正確重試。
async function loadPlayerRaw(nick){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(playerKey(nick))}&select=value,updated_at`,
    { headers: SB_HEADERS }
  );
  if(!res.ok) throw new Error('storage get failed: ' + res.status);
  const rows = await res.json();
  if(!rows || rows.length === 0) return {player: null, raw: null, updatedAt: null};
  const p = JSON.parse(rows[0].value);
  ensureMaterials(p);
  ensureExpedition(p);
  ensureProfession(p);
  ensureDiceInventory(p);
  return {player: p, raw: rows[0].value, updatedAt: rows[0].updated_at || null};
}
// 只有在資料庫現存 updated_at 仍等於 prevUpdatedAt 時才寫入 newPlayer（Compare-And-Swap），
// 回傳 true 代表搶到寫入；false 代表寫入前已被別的併發動作改過，需重讀最新資料後重試。
// 【2026-08 修正】原本比對條件是 value=eq.<整包舊 JSON>：每次寫入都要把玩家整份存檔字串
// 塞進網址查詢參數。骰子系統上線、玩家骰子越囤越多之後，玩家 JSON 可以輕易膨脹到幾十 KB
// （尤其是骰子每一面帶效果都存了完整的中英文說明文字，見 serializePlayerForStorage），
// URL-encode 後長度更是數倍膨脹，超過伺服器/CDN 的網址長度上限，導致寫入永遠失敗、重試
// 幾次都一樣（這就是玩家回報的「拆解失敗」「資料忙碌中」）。改成比對 updated_at 這種固定
// 長度的短戳記，網址長度不會再隨玩家資料量成長，從根本解決這個問題。
async function savePlayerCAS(prevUpdatedAt, newPlayer){
  const filter = prevUpdatedAt
    ? `updated_at=eq.${encodeURIComponent(prevUpdatedAt)}`
    : `updated_at=is.null`; // 舊資料/從未寫過 updated_at 的極少數情況 fallback
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(playerKey(newPlayer.nickname))}&${filter}`,
    {
      method: 'PATCH',
      headers: {
        ...SB_HEADERS,
        'Content-Type': 'application/json',
        Prefer: 'return=representation',
      },
      body: JSON.stringify({ value: serializePlayerForStorage(newPlayer), updated_at: new Date().toISOString() }),
    }
  );
  if(!res.ok) throw new Error('storage CAS update failed: ' + res.status);
  const rows = await res.json();
  return Array.isArray(rows) && rows.length > 0;
}
// 通用：對單一玩家資料做「讀-改-寫」，全程用樂觀鎖保護。
// mutator(player) 直接在傳入的 player 物件上修改欄位；每次重試都會重新讀取
// 「當下最新」的玩家資料再套用 mutator，只有寫入當下資料仍等於自己讀到的
// 那份時才會成功，不會發生後手覆蓋先手的情況（例如發獎的同時玩家剛好在買
// 東西、收成，兩者互相蓋掉導致「收到通知但東西沒進口袋」）。
// 用於「這筆更新絕對不能被其他併發寫入覆蓋掉」的場合（例如發放獎勵）；
// 一般高頻互動（單純收成、買賣）維持用舊版 savePlayer 即可，衝突機率低，
// 沒必要為每個寫入都付 CAS 的額外請求成本。
// 玩家不存在時回傳 null；正常完成則回傳寫入成功當下的玩家物件。
async function updatePlayerCAS(nick, mutator){
  for(let attempt = 0; attempt < 8; attempt++){
    const {player, updatedAt} = await loadPlayerRaw(nick);
    if(!player) return null;
    mutator(player);
    const applied = await savePlayerCAS(updatedAt, player);
    if(applied) return player;
    // 沒搶到：這段期間已經有別人先寫入了，重讀最新資料再試一次
  }
  throw new Error('player state contention exceeded retries');
}
function newPlayer(nick, passwordHash){
  return {nickname:nick, passwordHash, coins:START_COINS, cards:{}, lastClaim:null, lastDrawCards:[], streak:0, joinedAt:Date.now(), slotSpend:0, farmLevel:0, avatarId:DEFAULT_AVATAR_ID, unlockedAvatars:[], stats:{totalHarvests:0, totalAuctionTrades:0}, equippedBadges:[], unlockedBadges:[], lastSeenChatAt:0, lastActiveAt:Date.now(), materials:{}, seasonCards:{}, expLevel:0, expExp:0, expedition:null, expeditionRolls:{},
    profession:null,
    professionProgress:{alchemist:{level:1,exp:0}, blacksmith:{level:1,exp:0}, carpenter:{level:1,exp:0}},
    professionMaterials:{herb:0, ore:0, lumber:0},
    professionItems:{potion_small:0, weapon_common:0, accessory_common:0, furniture_common:0},
    stamina:PROFESSION_STAMINA_MAX, staminaMax:PROFESSION_STAMINA_MAX, lastStaminaRegenAt:Date.now()};

function ensureStats(p){
  if(!p.stats) p.stats = {totalHarvests:0, totalAuctionTrades:0, totalBossDamage:0};
  if(typeof p.stats.totalHarvests !== 'number') p.stats.totalHarvests = 0;
  if(typeof p.stats.totalAuctionTrades !== 'number') p.stats.totalAuctionTrades = 0;
  if(typeof p.stats.totalBossDamage !== 'number') p.stats.totalBossDamage = 0;
  return p.stats;
}
// 每日打 Boss 次數：依 todayStr() 換日自動歸零，跟每日簽到（lastClaim）同一套判斷方式。
function ensureBossAttackCount(p){
  const today = todayStr();
  if(p.bossAttackDate !== today){ p.bossAttackDate = today; p.bossAttackCount = 0; }
  if(typeof p.bossAttackCount !== 'number') p.bossAttackCount = 0;
  return p.bossAttackCount;
}
function bossAttacksRemaining(p){
  if(!BOSS_DAILY_ATTACK_LIMIT || BOSS_DAILY_ATTACK_LIMIT <= 0) return Infinity;
  return Math.max(0, BOSS_DAILY_ATTACK_LIMIT - ensureBossAttackCount(p));
}

async function hashPassword(pw){
  try{
    const enc = new TextEncoder().encode('lekcus-tarot-salt:' + pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // fallback if crypto.subtle unavailable
    let h = 0;
    for(let i=0;i<pw.length;i++){ h = (h*31 + pw.charCodeAt(i)) >>> 0; }
    return 'fallback-' + h.toString(16);
  }
}

// 依文字長度動態調整顯示時間：短訊息維持原本 2.2 秒的節奏，長訊息（例如遠征結算列出一堆加成來源）停久一點才不會來不及看完。
// 抓中文閱讀速度約每秒 8~9 字，額外加一段固定的基礎時間（讓使用者有反應時間看到通知跳出來），並設下限/上限避免太短或太長。
const TOAST_MIN_MS = 2200;
const TOAST_MAX_MS = 6000;
const TOAST_LEGENDARY_MIN_MS = 3200;
function toastDurationForMsg(msg, legendary){
  const base = legendary ? TOAST_LEGENDARY_MIN_MS : TOAST_MIN_MS;
  const len = (msg||'').length;
  // 前 20 字算在基礎時間內免費，超過的部分每個字追加 90ms
  const extra = Math.max(0, len - 20) * 90;
  return Math.min(TOAST_MAX_MS, base + extra);
}
function showToast(msg, opts){
  opts = opts || {};
  clearTimeout(state.toastTimer);
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast'; t.className='toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'toast show' + (opts.legendary ? ' legendary-toast' : '');
  state.toastTimer = setTimeout(()=>t.classList.remove('show'), toastDurationForMsg(msg, opts.legendary));
}

// ---------- Background music ----------
// Map each tab to its own track. Add/replace filenames here once you have the mp3s
// (they should sit next to index.html, same as the original bgm.mp3).
// Any tab not listed here just falls back to BGM_TRACKS.default.
const BGM_TRACKS = {
  default: 'bgm.mp3',          // 一般頁面用的預設音樂
  boss: 'bgm-boss.mp3',        // Boss 戰：刺激一點的
  farm: 'bgm-farm.mp3',        // 花園農場：放鬆一點的
  expedition: 'bgm-expedition.mp3', // 遠征：專屬音樂
};
const BGM_VOLUME = 0.35;
let bgmAudioEl = null;
let bgmToggleBtn = null;
let bgmPlaying = false;
let bgmCurrentKey = null;
let bgmFadeTimer = null;

function bgmKeyForTab(tab){
  return BGM_TRACKS[tab] ? tab : 'default';
}

function bgmFadeTo(targetVolume, duration, done){
  if(!bgmAudioEl) return;
  clearInterval(bgmFadeTimer);
  const steps = 12;
  const stepTime = Math.max(16, duration / steps);
  const startVolume = bgmAudioEl.volume;
  const delta = (targetVolume - startVolume) / steps;
  let i = 0;
  bgmFadeTimer = setInterval(()=>{
    i++;
    bgmAudioEl.volume = Math.max(0, Math.min(1, startVolume + delta * i));
    if(i >= steps){
      clearInterval(bgmFadeTimer);
      bgmAudioEl.volume = targetVolume;
      if(done) done();
    }
  }, stepTime);
}

function initBgm(){
  const audio = document.getElementById('bgm-audio');
  const btn = document.getElementById('bgm-toggle');
  if(!audio || !btn) return;
  bgmAudioEl = audio;
  bgmToggleBtn = btn;
  audio.volume = BGM_VOLUME;
  bgmCurrentKey = bgmKeyForTab(state.tab);
  const source = audio.querySelector('source');
  if(source) source.src = BGM_TRACKS[bgmCurrentKey] || BGM_TRACKS.default;
  btn.onclick = ()=>{
    if(bgmPlaying){
      audio.pause();
      btn.textContent = '🔇';
      bgmPlaying = false;
    } else {
      audio.play().catch(()=>{ showToast(tt('無法播放音樂，請再點一次','Could not play music, please click again')); });
      btn.textContent = '🔊';
      bgmPlaying = true;
    }
  };
}

// Call this whenever state.tab changes so each page can have its own music.
// If music isn't playing yet, it just quietly swaps the source (so the right
// track is ready the moment the user presses play). If it IS playing, it
// fades out, swaps, and fades back in so the change isn't jarring.
function updateBgmForTab(tab){
  if(!bgmAudioEl) return;
  const key = bgmKeyForTab(tab);
  if(key === bgmCurrentKey) return;
  bgmCurrentKey = key;
  const newSrc = BGM_TRACKS[key] || BGM_TRACKS.default;
  const source = bgmAudioEl.querySelector('source');

  if(!bgmPlaying){
    if(source) source.src = newSrc;
    bgmAudioEl.load();
    return;
  }

  bgmFadeTo(0, 450, ()=>{
    bgmAudioEl.pause();
    if(source) source.src = newSrc;
    bgmAudioEl.load();
    bgmAudioEl.play().catch(()=>{});
    bgmFadeTo(BGM_VOLUME, 450);
  });
}

function updateLangToggleBtn(){
  const btn = document.getElementById('lang-toggle');

// ---------- Card enlarge modal ----------
let COLLECTION_MODAL_LIST = [];

function openCardModal(cardId){
  const c = DECK_BY_ID[cardId];
  if(!c) return;
  const owned = (state.player && state.player.cards[cardId]) || 0;
  const price = SELL_PRICES[c.rarity] || 0;
  const content = document.getElementById('card-modal-content');
  const isLegendaryReveal = c.rarity === 'epic' && owned > 0;

  let bodyHtml = `
    ${c.image ? `<img src="${c.image}" alt="${escapeHtml(c.name)}" class="card-modal-img${owned>0?'':' locked-img'}${isLegendaryReveal?' legendary-img':''}" />` : `<div class="card-modal-icon${owned>0?'':' locked-img'}">${c.icon}</div>`}
    ${isLegendaryReveal ? `<div class="legendary-modal-badge">✨ ${tt('史詩卡','Epic Card')} ✨</div>` : ''}
    <div class="card-modal-name">${owned>0 ? escapeHtml(c.name) : '???'}</div>
    <div class="card-modal-rarity">${RARITY_LABEL[c.rarity]}</div>
  `;

  if(owned > 0){
    bodyHtml += `
      <div class="card-modal-sell-box">
        <div style="font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;">${tt(`持有 x${owned} · 每張 ✦${price}`, `Owned x${owned} · ✦${price} each`)}</div>
        <div class="card-modal-qty-row">
          <input type="number" id="sell-qty-input" value="1" min="1" max="${owned}" />
          <button class="btn small" id="sell-qty-btn">${tt('出售所選','Sell selected')}（+✦<span id="sell-qty-total">${price}</span>）</button>
        </div>
        ${owned > 1 ? `<div style="margin-top:8px;"><button class="btn small secondary" id="sell-extra-btn">${tt(`賣出多餘 ${owned-1} 張，保留 1 張`, `Sell ${owned-1} extra, keep 1`)}（+✦${(owned-1)*price}）</button></div>` : ''}
      </div>
    `;
  } else {
    const pool = DECK.filter(d=>d.rarity===c.rarity);
    const totalWeight = RARITY_ORDER.reduce((a,r)=>a+(DRAW_WEIGHTS[r]||0),0) || 1;
    const rarityChance = (DRAW_WEIGHTS[c.rarity]||0) / totalWeight;
    const cardChance = pool.length ? (rarityChance / pool.length) * 100 : 0;
    bodyHtml += `
      <div class="card-modal-locked-note">
        ${tt('尚未擁有此卡 · 每次抽卡約有','Not yet owned · roughly a')} <span class="odds">${cardChance.toFixed(2)}%</span> ${tt('機率抽到','chance per draw')}
      </div>
    `;
  }

  content.innerHTML = bodyHtml;

  const idx = COLLECTION_MODAL_LIST.indexOf(cardId);
  const hasList = idx !== -1 && COLLECTION_MODAL_LIST.length > 1;
  let navHtml = '';
  if(hasList){
    navHtml = `
      <button class="card-modal-nav prev" id="card-modal-prev">‹</button>
      <button class="card-modal-nav next" id="card-modal-next">›</button>
    `;
  }
  document.getElementById('card-modal-nav-slot').innerHTML = navHtml;
  if(hasList){
    document.getElementById('card-modal-prev').onclick = ()=>{
      const prevIdx = (idx - 1 + COLLECTION_MODAL_LIST.length) % COLLECTION_MODAL_LIST.length;
      openCardModal(COLLECTION_MODAL_LIST[prevIdx]);
    };
    document.getElementById('card-modal-next').onclick = ()=>{
      const nextIdx = (idx + 1) % COLLECTION_MODAL_LIST.length;
      openCardModal(COLLECTION_MODAL_LIST[nextIdx]);
    };
  }

  document.getElementById('card-modal').style.display = 'flex';
  const modalBox = document.querySelector('.card-modal-box');
  if(modalBox) modalBox.classList.toggle('legendary-modal', isLegendaryReveal);
  if(isLegendaryReveal) playLegendaryRevealFx();

  const qtyInput = document.getElementById('sell-qty-input');
  const qtyTotal = document.getElementById('sell-qty-total');
  if(qtyInput){
    qtyInput.oninput = ()=>{
      let v = parseInt(qtyInput.value, 10) || 1;
      v = Math.max(1, Math.min(owned, v));
      qtyTotal.textContent = v * price;
    };
  }
  const sellQtyBtn = document.getElementById('sell-qty-btn');
  if(sellQtyBtn) sellQtyBtn.onclick = ()=>{
    let qty = parseInt(qtyInput.value, 10) || 1;
    qty = Math.max(1, Math.min(owned, qty));
    sellCard(cardId, qty);
  };
  const sellExtraBtn = document.getElementById('sell-extra-btn');
  if(sellExtraBtn) sellExtraBtn.onclick = ()=>sellCard(cardId, owned - 1);
}

function sellableExtraCommonUncommon(){
  const targets = ['common','uncommon'];
  const items = [];
  let totalQty = 0, totalCoins = 0;
  DECK.filter(c=>targets.includes(c.rarity)).forEach(c=>{
    const owned = (state.player.cards[c.id]) || 0;
    if(owned > 1){
      const qty = owned - 1;
      const price = SELL_PRICES[c.rarity] || 0;
      items.push({cardId:c.id, qty, price});
      totalQty += qty;
      totalCoins += qty * price;
    }
  });
  return {items, totalQty, totalCoins};
}

async function sellExtraCommonUncommon(){
  if(!state.player) return;
  const {items, totalQty, totalCoins} = sellableExtraCommonUncommon();
  if(items.length === 0){
    showToast(tt('目前沒有多餘的普通或罕見卡牌可以出售','No extra common or uncommon cards to sell right now'));
    return;
  }
  const ok = window.confirm(tt(
    `確定要一鍵出售所有多出來的普通與罕見卡牌嗎？\n每張卡都會保留 1 張，其餘 ${totalQty} 張將被出售，共獲得 ✦${totalCoins} 枚金幣，此動作無法復原。`,
    `Sell all extra common and uncommon cards? Each card keeps 1 copy - the remaining ${totalQty} cards will be sold for ✦${totalCoins} coins total. This cannot be undone.`
  ));
  if(!ok) return;
  items.forEach(it=>{
    state.player.cards[it.cardId] = (state.player.cards[it.cardId] || 0) - it.qty;
  });
  state.player.coins = (state.player.coins||0) + totalCoins;
  bumpQuest(state.player, 'sell', 1);
  await savePlayer(state.player);
  showToast(tt(`已出售 ${totalQty} 張多餘卡牌，獲得 ✦${totalCoins} 枚金幣`, `Sold ${totalQty} extra cards for ✦${totalCoins} coins`));
  render();
}

async function sellCard(cardId, qty){
  if(!state.player) return;
  const c = DECK_BY_ID[cardId];
  if(!c) return;
  qty = Math.max(1, parseInt(qty, 10) || 1);
  const owned = state.player.cards[cardId] || 0;
  if(owned <= 0){ showToast(tt('你沒有這張卡可以出售',"You don't have this card to sell")); return; }
  qty = Math.min(qty, owned);
  const price = SELL_PRICES[c.rarity] || 0;
  const total = qty * price;
  const warnPrefix = (c.rarity === 'rare' || c.rarity === 'epic') ? tt('⚠️ 這是稀有卡牌！\n','⚠️ This is a rare card!\n') : '';
  const ok = window.confirm(tt(`${warnPrefix}確定要出售「${c.name}」x${qty} 嗎？\n將獲得 ✦${total} 枚金幣，此動作無法復原。`, `${warnPrefix}Sell "${c.name}" x${qty}?\nYou'll receive ✦${total} coins. This cannot be undone.`));
  if(!ok) return;
  state.player.cards[cardId] = owned - qty;
  state.player.coins = (state.player.coins||0) + total;
  bumpQuest(state.player, 'sell', 1);
  await savePlayer(state.player);
  closeCardModal();
  showToast(tt(`已出售 ${c.name} x${qty}，獲得 ✦${total} 枚金幣`, `Sold ${c.name} x${qty} for ✦${total} coins`));
  render();
}

let DAILY_POPUP_IMAGE_URL = null; // dataURL uploaded by GM, or null = use default local daily-popup.png
let DAILY_POPUP_META = null; // {updatedAt, updatedBy}
let DAILY_POPUP_DISABLED = false; // GM 可完全關閉彈窗，不顯示任何圖片
async function loadDailyPopupImage(){
  try{
    const r = await storage.get('config:daily-popup');
    if(r){
      const cfg = JSON.parse(r.value);
      DAILY_POPUP_IMAGE_URL = cfg.dataUrl || null;
      DAILY_POPUP_DISABLED = !!cfg.disabled;
      DAILY_POPUP_META = {updatedAt: cfg.updatedAt, updatedBy: cfg.updatedBy};
    } else {
      DAILY_POPUP_IMAGE_URL = null;
      DAILY_POPUP_DISABLED = false;
      DAILY_POPUP_META = null;
    }
  }catch(e){ /* keep previous value */ }
}
async function saveDailyPopupImage(dataUrl){

  DAILY_POPUP_DISABLED = false;

async function clearDailyPopupImage(){

function todayDateStr(){

async function showDailyPopupIfNeeded(){

async function doLogin(nick, password, confirmPassword){
  nick = nick.trim();
  if(!nick){ showToast(tt('請輸入暱稱 ✦','Please enter a nickname ✦')); return; }
  if(nick.length > 20){ showToast(tt('暱稱請在20字以內','Nickname must be 20 characters or fewer')); return; }
  if(!password || password.length < 4){ showToast(tt('密碼至少需要4個字元','Password must be at least 4 characters')); return; }

  const btn = document.getElementById('login-btn');
  if(btn){ btn.disabled = true; btn.textContent = t('loggingIn'); }

  try{
    const hash = await hashPassword(password);
    let p = await loadPlayer(nick);

    if(!p){
      if(!confirmPassword || confirmPassword !== password){
        showToast(tt('這是新帳號，請再次輸入相同密碼以確認 🔒','This is a new account - please confirm your password 🔒'));
        if(btn){ btn.disabled = false; btn.textContent = t('loginBtn'); }
        return;
      }
      p = newPlayer(nick, hash);
      await savePlayer(p);
      showToast(tt(`歡迎加入，${nick}！已為你建立帳號 ✦`, `Welcome, ${nick}! Your account has been created ✦`));
    } else if(!p.passwordHash){
      p.passwordHash = hash;
      await savePlayer(p);
      showToast(tt('已為此帳號設定密碼','Password set for this account'));
    } else if(p.passwordHash !== hash){
      showToast(tt('密碼錯誤，請重新輸入 🔒','Incorrect password, please try again 🔒'));
      if(btn){ btn.disabled = false; btn.textContent = t('loginBtn'); }
      return;
    }

    state.nickname = p.nickname;
    state.player = p;
    await applyPendingRewards(state.player);
    try{ localStorage.setItem('my-nickname', p.nickname); }catch(e){}
    updatePresenceHeartbeat();
    render();
    fetchNotifications().then(notifs=>{
      const unread = notifs.filter(n=>!n.read);
      notifUnreadCount = unread.length;
      unread.forEach(n=>notifBadgeSeenIds.add(n.id));
      const badge = document.getElementById('notif-badge');
      if(badge){ badge.style.display = notifUnreadCount>0 ? 'inline-flex' : 'none'; badge.textContent = notifUnreadCount>9?'9+':String(notifUnreadCount); }
    }).catch(()=>{});
    showDailyPopupIfNeeded().then(()=>{
      fetchAnnouncement().then(ann=>{
        if(ann && ann.body && ann.updatedAt && (!p.lastSeenAnnouncementAt || ann.updatedAt > p.lastSeenAnnouncementAt)){
          showAnnounceModal(ann);
        }
      }).catch(()=>{});
    });
    fetchChatMessages().then(messages=>{
      const lastSeen = p.lastSeenChatAt || 0;
      chatUnreadCount = messages.filter(m=>m.nickname !== state.nickname && m.createdAt > lastSeen).length;
      updateChatBadgeDom();
    }).catch(()=>{});
  }catch(err){
    showToast(tt('登入失敗，請檢查網路後再試一次 ⚠','Login failed, please check your connection and try again ⚠'));
    if(btn){ btn.disabled = false; btn.textContent = t('loginBtn'); }
    console.error('Login error:', err);
  }
}

async function claimDaily(){

function flipCard(i){

// ---------- Slot machine (三牌共鳴) ----------
let lastSeenBroadcastTs = Date.now();
let notifUnreadCount = 0;
let notifBadgeSeenIds = new Set();
let chatUnreadCount = 0;
// 中頭獎（三張 Epic）時，發信箱通知給「全服」所有玩家（離線玩家下次登入也會看到，不只是當下在線才收到 toast）
async function broadcastJackpotWin(winnerNick, amount){
  const allPlayers = await fetchAllPlayers();
  await Promise.all(allPlayers.map(p=>{
    if(!p.nickname || p.nickname.toLowerCase() === winnerNick.toLowerCase()) return null;
    return createNotification(p.nickname, winnerNick, 'jackpot_win', {amount});
  }));
}
async function pullSlot(){
  if(state.player.coins < SLOT_SETTINGS.cost){ showToast(tt('金幣不足，無法共鳴','Not enough coins to resonate')); return; }
  const drawn = [weightedDraw(), weightedDraw(), weightedDraw()];

  // 先在區域變數裡試算這次的結果，成功存檔後才套用到 state.player。
  // 避免「本地已經改了、但伺服器沒存到」造成中頭獎卻沒拿到錢的資料不一致。
  const prevCoins = state.player.coins;
  const prevSlotSpend = state.player.slotSpend || 0;
  const prevCards = {...state.player.cards};
  const prevStats = state.player.stats ? {...state.player.stats} : null;

  let coins = prevCoins - SLOT_SETTINGS.cost;
  const cards = {...state.player.cards};
  drawn.forEach(c=>{ cards[c.id] = (cards[c.id]||0) + 1; });

  const rarities = drawn.map(c=>c.rarity);
  const allSame = rarities.every(r=>r===rarities[0]);
  let winMsg = null;
  let winAmount = 0;
  let winTier = null;
  let jackpotAfterWin = null;   // 中頭獎時，存檔成功後才要 reset 成的獎池新值
  let jackpotContribution = null; // 沒中獎時，存檔成功後才要疊加的獎池貢獻

  // 結算前重新同步獎池最新值，避免用這個分頁自己過期的快照
  // 去計算頭獎金額，或用舊數字疊加抽成蓋掉其他玩家剛存進去的貢獻
  try{
    await syncSlotJackpot();
  }catch(e){
    showToast(tt('連線異常，請稍後再試','Connection issue, please try again later'));
    return;
  }

  if(allSame && rarities[0] === 'epic'){
    winAmount = SLOT_JACKPOT;
    coins += winAmount;
    winTier = 'jackpot';
    winMsg = tt(`✨💫 命運共鳴！贏得整個獎池 ✦${winAmount}！`, `✨💫 Fated Resonance! Won the entire jackpot pool ✦${winAmount}!`);
    jackpotAfterWin = SLOT_SETTINGS.jackpotBase;
  } else if(allSame && rarities[0] === 'rare'){
    winAmount = SLOT_SETTINGS.cost * SLOT_SETTINGS.multRare;
    coins += winAmount;
    winTier = 'rare';
    winMsg = tt(`✨ 三張稀有共鳴！獲得 ✦${winAmount} 金幣`, `✨ Three Rare Resonance! Won ✦${winAmount} coins`);
  } else if(allSame && rarities[0] === 'uncommon'){
    winAmount = SLOT_SETTINGS.cost * SLOT_SETTINGS.multUncommon;
    coins += winAmount;
    winTier = 'uncommon';
    winMsg = tt(`✨ 三張罕見共鳴！獲得 ✦${winAmount} 金幣`, `✨ Three Uncommon Resonance! Won ✦${winAmount} coins`);
  } else if(allSame && rarities[0] === 'common'){
    winAmount = SLOT_SETTINGS.cost * SLOT_SETTINGS.multCommon;
    coins += winAmount;
    winTier = 'common';
    winMsg = tt(`✨ 三張普通共鳴！獲得 ✦${winAmount} 金幣`, `✨ Three Common Resonance! Won ✦${winAmount} coins`);
  } else {
    const contrib = Math.round(SLOT_SETTINGS.cost * SLOT_SETTINGS.contribRate / 100);
    jackpotContribution = SLOT_JACKPOT + contrib;
  }

  // 把這次結果套用到本地玩家物件，準備存檔；下面若存檔失敗會整組復原。
  state.player.coins = coins;
  state.player.slotSpend = prevSlotSpend + SLOT_SETTINGS.cost;
  state.player.cards = cards;
  bumpQuest(state.player, 'slot', 1);
  if(winTier === 'jackpot'){
    state.player.stats = state.player.stats || {};
    state.player.stats.totalJackpotWins = (state.player.stats.totalJackpotWins || 0) + 1;
  }
  state.drawResults = drawn;
  state.drawSource = 'slot';
  state.flipped = [false,false,false];

  try{
    // 關鍵順序：先確保玩家「自己」的獎勵存檔成功，才去動「全服共用」的獎池與廣播通知。
    // 這樣即使中途斷線，最壞情況只是這次共鳴沒生效、可以重試，
    // 不會出現獎池已經清空、全服都收到中獎公告，但贏家自己卻沒拿到錢的情況。
    await savePlayer(state.player);
    if(jackpotAfterWin !== null){
      await saveSlotJackpot(jackpotAfterWin);
      broadcastJackpotWin(state.nickname, winAmount).catch(()=>{});
    } else if(jackpotContribution !== null){
      await saveSlotJackpot(jackpotContribution);
    }
  }catch(e){
    // 存檔失敗：整組復原本地狀態，不套用任何本次抽卡效果，提示玩家重試
    state.player.coins = prevCoins;
    state.player.slotSpend = prevSlotSpend;
    state.player.cards = prevCards;
    if(prevStats) state.player.stats = prevStats; else delete state.player.stats;
    state.drawResults = null;
    state.drawSource = null;
    showToast(tt('存檔失敗，本次共鳴未生效，請檢查網路後重試','Save failed, this pull did not take effect, please check your connection and retry'));
    render();
    return;
  }

  render();
  setTimeout(()=>{ flipCard(0); }, 300);

  if(winMsg){
    setTimeout(()=>showToast(winMsg), 1700);
    storage.set('config:latest_win', JSON.stringify({
      nickname: state.nickname, tier: winTier, amount: winAmount, ts: Date.now()
    })).catch(()=>{});
    lastSeenBroadcastTs = Date.now();
  }
}

// ---------- Friends ----------
function freqKey(id){ return `freq:${id}`; }
// 依玩家分流：key 前綴帶上收件人暱稱，讓 fetchNotifications 只需查詢
// 自己的通知，不用再撈全站 notif: 資料回瀏覽器端過濾（那個做法會讓
// 每個在線玩家每次輪詢都重複下載全站所有人的通知，流量隨玩家數/
// 通知數倍增）。
function notifKey(nick, id){ return `notif:${(nick||'').toLowerCase()}:${id}`; }
// 依玩家分流：key 前綴帶上暱稱，讓 fetchPendingRewardsFor 只需查詢
// 該玩家自己的資料，不會被全站 pendingreward: 資料量拖累、撞到
// PostgREST 預設回傳筆數上限而撈不到（曾導致「有通知但收不到卡」）。
function pendingRewardKey(nick, id){ return `pendingreward:${(nick||'').toLowerCase()}:${id}`; }

// ---------- Notifications (e.g. a friend watered/stole from your plot) ----------
async function fetchNotifications(){
  try{
    // 只查詢自己的前綴（notif:<nick>:），不再撈全站 notif: 資料
    // 回瀏覽器端過濾——避免每個玩家每次輪詢都重複下載全站所有人
    // 的通知內容。
    const myNick = (state.nickname||'').toLowerCase();
    const list = await storage.list(`notif:${myNick}:`);
    if(!list || !list.keys) return [];
    const items = await Promise.all(list.keys.map(async k=>{
      try{ const r = await storage.get(k); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }));
    return items.filter(Boolean).sort((a,b)=>b.createdAt-a.createdAt);
  }catch(e){ return []; }
}
const NOTIF_MAX_STORED = 200; // 每位玩家保留的通知上限，避免單一玩家的 notif: 前綴無限長大
async function createNotification(to, from, type, extra){
  if((to||'').toLowerCase() === (from||'').toLowerCase()) return; // don't notify yourself
  const n = {id: uid(), to, from, type, read:false, createdAt: Date.now(), ...extra};
  try{ await storage.set(notifKey(to, n.id), JSON.stringify(n)); }catch(e){ /* best effort */ }
  pruneNotifications(to).catch(()=>{});
}
async function pruneNotifications(nick){
  // notif: 從不刪除的話，單一玩家的通知會無限長大。這裡只保留
  // 該玩家最新的 NOTIF_MAX_STORED 筆（storage.list 已依 key 由新到舊排序）。
  const myNick = (nick||'').toLowerCase();
  const list = await storage.list(`notif:${myNick}:`);
  if(!list || !list.keys || list.keys.length <= NOTIF_MAX_STORED) return;
  const excessKeys = list.keys.slice(NOTIF_MAX_STORED);
  await Promise.all(excessKeys.map(k=>storage.delete(k).catch(()=>{})));
}
// ---------- Pending rewards (GM grants land here first, then get applied to the
// player's own freshest data next time they refresh/open mailbox — avoids the
// grant being silently overwritten if the player's client saves stale data
// in the meantime) ----------
async function createPendingReward(targetNick, grantKind, payload){
  const r = {id: uid(), to: targetNick, grantKind, createdAt: Date.now(), ...payload};
  try{ await storage.set(pendingRewardKey(targetNick, r.id), JSON.stringify(r)); return true; }
  catch(e){ return false; }
}
async function fetchPendingRewardsFor(nick){
  try{
    // 只查詢這個玩家自己的前綴（pendingreward:<nick>:），
    // 不再撈全站 pendingreward: 資料再靠前端過濾，避免被全站資料量
    // 拖累而撞到 PostgREST 預設回傳筆數上限撈不到自己的獎勵。
    const myLower = (nick||'').toLowerCase();
    const list = await storage.list(`pendingreward:${myLower}:`);

// Applies any pending rewards for this player directly onto the freshly-loaded
// player object (mutates in place), deletes the consumed records, and saves.
// Safe to call every time a player's data is freshly loaded.
async function applyPendingRewards(player){
  const pending = await fetchPendingRewardsFor(player.nickname);
  if(pending.length === 0) return player;
  let changed = false;
  for(const {key, data} of pending){
    if(data.grantKind === 'coins'){
      player.coins = Math.max(0, (player.coins||0) + (data.amount||0));
      changed = true;
    } else if(data.grantKind === 'card'){
      player.cards[data.cardId] = Math.max(0, (player.cards[data.cardId]||0) + (data.qty||1));
      changed = true;
    } else if(data.grantKind === 'material'){
      ensureProfession(player);
      player.professionMaterials[data.materialId] = Math.max(0, (player.professionMaterials[data.materialId]||0) + (data.qty||1));
      changed = true;
    } else if(data.grantKind === 'item'){
      ensureProfession(player);
      player.professionItems[data.itemId] = Math.max(0, (player.professionItems[data.itemId]||0) + (data.qty||1));
      changed = true;
    } else if(data.grantKind === 'dice'){
      ensureDiceInventory(player);
      if(data.diceData && data.diceData.id){
        player.dice[data.diceData.id] = {...data.diceData};
        changed = true;
      }
    } else if(data.grantKind === 'auction_sale'){
      // 拍賣賣家收款：金額 + 成交次數一起套用，避免分兩筆寫入時中間被覆蓋
      player.coins = Math.max(0, (player.coins||0) + (data.amount||0));
      ensureStats(player).totalAuctionTrades += 1;
      changed = true;
    } else if(data.grantKind === 'auction_trade_stat'){
      ensureStats(player).totalAuctionTrades += 1;
      changed = true;
    }
    await storage.delete(key).catch(()=>{});
  }
  if(changed) await savePlayer(player);
  return player;
}

// ---------- Chat channel ----------
// 聊天訊息改成單一 key（CHAT_LOG_KEY）存整個陣列，
// 取代舊版「每則訊息各自存一個 chat:<id> key」的做法：
// 舊做法每次抓訊息都要 storage.list 再對每個 key 各發一次 storage.get（N+1），
// 輪詢、送訊息、算未讀都各自重抓一次，訊息一多就非常吃頻寬。
// 改成單一 key 後，讀/寫都只需要一次網路請求。
const CHAT_LOG_KEY = 'chat:log';
const CHAT_META_KEY = 'chat:meta'; // 輕量 key：只存 {count,lastId,updatedAt}，輪詢先讀這個，變了才抓整包聊天記錄
const CHAT_MAX_MESSAGES = 500;
const CHAT_TRIM_BATCH = 100; // 累積超過上限+100則才一次清洗回上限，減少清洗頻率
let lastChatFingerprint = null;
async function fetchChatMessages(){
  try{
    const r = await storage.get(CHAT_LOG_KEY);
    if(!r) return [];
    const arr = JSON.parse(r.value);
    return Array.isArray(arr) ? arr.sort((a,b)=>a.createdAt-b.createdAt) : [];
  }catch(e){ return []; }
}
async function fetchChatMeta(){
  try{
    const r = await storage.get(CHAT_META_KEY);
    if(!r) return null;
    return JSON.parse(r.value);
  }catch(e){ return null; }
}
function chatMetaSignature(meta){
  return meta ? `${meta.count}:${meta.lastId}` : '';
}
async function updateChatMeta(all){
  try{
    const last = all[all.length-1];
    await storage.set(CHAT_META_KEY, JSON.stringify({count: all.length, lastId: last ? last.id : null, updatedAt: Date.now()}));
  }catch(e){ /* best effort，meta 更新失敗頂多讓輪詢多抓一次整包，不影響正確性 */ }
}
async function sendChatMessage(text){
  text = (text||'').trim();
  if(!text) return;
  if(text.length > 300){ showToast(tt('訊息請在300字以內','Message must be 300 characters or fewer')); return; }
  const msg = {id: uid(), nickname: state.nickname, text, createdAt: Date.now(), isGM: isGM(), badges: equippedBadgeKeys(state.player), titles: titleKeysHeldBy(state.nickname), avatarId: state.player && state.player.avatarId};
  let all;
  try{
    all = await fetchChatMessages();
    all.push(msg);
    if(all.length > CHAT_MAX_MESSAGES + CHAT_TRIM_BATCH) all.splice(0, all.length - CHAT_MAX_MESSAGES);
    await storage.set(CHAT_LOG_KEY, JSON.stringify(all));
  }catch(e){ showToast(tt('傳送失敗，請再試一次 ⚠','Failed to send - please try again ⚠')); return; }
  updateChatMeta(all).catch(()=>{});
  if(state.tab === 'chat') renderTab();
}
async function deleteChatMessage(id){
  if(!isGM()) return;
  let filtered;
  try{
    const all = await fetchChatMessages();
    filtered = all.filter(m=>m.id !== id);
    await storage.set(CHAT_LOG_KEY, JSON.stringify(filtered));
  }catch(e){ /* ignore */ }
  if(filtered) updateChatMeta(filtered).catch(()=>{});
  if(state.tab === 'chat') renderTab();
}
function initChatPoll(){
  let lastPollMetaSig = null;
  setInterval(async ()=>{
    if(!state.nickname || state.tab !== 'chat') return;
    try{
      const meta = await fetchChatMeta();
      const sig = chatMetaSignature(meta);
      if(sig === lastPollMetaSig) return; // meta 沒變，代表聊天記錄沒有新增/刪除，不需要重抓整包
      lastPollMetaSig = sig;
      const messages = await fetchChatMessages();
      const fingerprint = messages.map(m=>m.id).join(',');
      if(fingerprint === lastChatFingerprint) return;
      lastChatFingerprint = fingerprint;
      const inputEl = document.getElementById('chat-input');
      const draft = inputEl ? inputEl.value : '';
      const hadFocus = document.activeElement === inputEl;
      await renderTab();
      const newInput = document.getElementById('chat-input');
      if(newInput && draft){ newInput.value = draft; if(hadFocus) newInput.focus(); }
      markChatAsRead();
    }catch(e){ /* ignore */ }
  }, 4000);
}
function updateChatBadgeDom(){
  const badge = document.getElementById('chat-tab-badge');

async function markChatAsRead(){

function initChatUnreadPoll(){
  let lastUnreadMetaSig = null;
  setInterval(async ()=>{
    if(!state.nickname || !state.player) return;
    if(state.tab === 'chat') return; // already tracked as read while viewing
    try{
      const meta = await fetchChatMeta();
      const sig = chatMetaSignature(meta);
      if(sig === lastUnreadMetaSig) return; // meta 沒變，代表沒有新訊息，不需要重抓整包聊天記錄算未讀
      lastUnreadMetaSig = sig;
      const messages = await fetchChatMessages();

    }catch(e){ /* ignore */ }
  }, 15000);
}

function friendshipKey(nickA, nickB){
  const a = (nickA||'').trim().toLowerCase(), b = (nickB||'').trim().toLowerCase();
  const [first, second] = a < b ? [a, b] : [b, a];
  return `friendship:${first}_${second}`;
}
async function fetchAllFriendships(){

      try{ const r = await storage.get(k); const v = r ? JSON.parse(r.value) : null; return v ? {...v, _key:k} : null; }
      catch(e){ return null; }
    }));
    return items.filter(Boolean);
  }catch(e){ return []; }
}
async function fetchMyFriends(nickname){

  return all
    .filter(f=>f.a && f.b && (f.a.toLowerCase()===lower || f.b.toLowerCase()===lower))
    .map(f=> f.a.toLowerCase()===lower ? f.b : f.a);
}
async function isFriendWith(nickA, nickB){
  try{
    const all = await fetchAllFriendships();
    const a = (nickA||'').toLowerCase(), b = (nickB||'').toLowerCase();
    return all.some(f=> f.a && f.b && (
      (f.a.toLowerCase()===a && f.b.toLowerCase()===b) ||
      (f.a.toLowerCase()===b && f.b.toLowerCase()===a)
    ));
  }catch(e){ return false; }
}
async function createFriendship(nickA, nickB){

async function deleteFriendship(nickA, nickB){
  try{
    const all = await fetchAllFriendships();
    const a = (nickA||'').toLowerCase(), b = (nickB||'').toLowerCase();
    const match = all.find(f=> f.a && f.b && (
      (f.a.toLowerCase()===a && f.b.toLowerCase()===b) ||
      (f.a.toLowerCase()===b && f.b.toLowerCase()===a)
    ));
    if(match && match._key){ await storage.delete(match._key); return; }
    await storage.delete(friendshipKey(nickA, nickB));
  }catch(e){ /* ignore */ }
}

async function sendFriendRequest(targetNick){
  targetNick = (targetNick||'').trim();
  if(!targetNick){ showToast(tt('請輸入好友暱稱 ✦','Please enter a friend nickname ✦')); return; }
  if(targetNick.toLowerCase() === state.nickname.toLowerCase()){ showToast(tt('不能加自己為好友',"You can't add yourself as a friend")); return; }

    ((r.from||'').toLowerCase()===meLower && (r.to||'').toLowerCase()===targetLower) ||
    ((r.from||'').toLowerCase()===targetLower && (r.to||'').toLowerCase()===meLower)
  ));

  render();
}

async function respondFriendRequest(reqId, accept){

// 拍賣行支援多種物品類型：卡片（cardId，數量固定 1）、材料、職業成品（可堆疊，數量可自訂）
function auctionItemMeta(itemType, itemId){
  if(itemType === 'material'){
    const def = PROFESSION_DEFS.find(d=>d.materialId===itemId);
    return def ? {icon:def.materialIcon, label:professionMaterialLabel(def)} : {icon:'❓', label:itemId};
  }
  if(itemType === 'professionItem'){
    const meta = professionItemMeta(itemId);
    return meta ? {icon:meta.icon, label:professionRecipeLabel(meta)} : {icon:'❓', label:itemId};
  }
  const c = DECK_BY_ID[itemId];
  return c ? {icon:c.icon||'🎴', label:c.name, rarity:c.rarity} : {icon:'❓', label:itemId};
}
// 依卡片稀有度回傳對應的 CSS 顏色變數名稱（與 .rar-xxx 徽章顏色一致）
function rarityColorVar(rarity){
  const map = {common:'--common', uncommon:'--uncommon', rare:'--rare', epic:'--legendary-a', legendary:'--legendary-a'};
  return map[rarity] || null;
}
function auctionDisplayInfo(a){
  if(a.itemType === 'dice'){
    const d = a.diceData;
    if(!d) return {iconHtml:`<div class="icon-box">🎲</div>`, name: tt('未知骰子','Unknown die'), nameOnly: tt('未知骰子','Unknown die')};
    const meta = DICE_QUALITY_META[d.quality] || DICE_QUALITY_META.common;
    const effectFaceCount = (d.faces||[]).filter(f=>f.effect).length;
    const label = tt(`${meta.label} 骰子 Lv.${d.level||1}（基礎 ${d.baseAttack}）`, `${meta.labelEn} Die Lv.${d.level||1} (Base ${d.baseAttack})`);
    return {
      iconHtml: `<div class="icon-box" style="display:flex;align-items:center;justify-content:center;font-size:24px;border-color:${meta.color};">🎲</div>`,
      name: `<span style="color:${meta.color};font-weight:600;">${escapeHtml(label)}</span>`,
      nameOnly: label,
    };
  }
  if(a.itemType === 'material' || a.itemType === 'professionItem'){
    const meta = auctionItemMeta(a.itemType, a.itemId);
    return {
      iconHtml: `<div class="icon-box" style="display:flex;align-items:center;justify-content:center;font-size:26px;">${meta.icon}</div>`,
      name: `${escapeHtml(meta.label)} × ${a.qty}`,
      nameOnly: meta.label,
    };
  }
  const c = DECK_BY_ID[a.itemId];
  if(!c) return {iconHtml:`<div class="icon-box">❓</div>`, name: tt('未知卡片','Unknown card'), nameOnly: tt('未知卡片','Unknown card')};
  const colorVar = rarityColorVar(c.rarity);
  const styledName = colorVar ? `<span style="color:var(${colorVar});font-weight:600;">${escapeHtml(c.name)}</span>` : escapeHtml(c.name);
  return {iconHtml: `<div class="icon-box cf-${c.rarity}">${iconBoxInner(c)}</div>`, name: styledName, nameOnly: c.name, rarity: c.rarity};
}
function auctionOwnedQty(p, itemType, itemId){
  if(itemType === 'dice') return (p.dice && p.dice[itemId]) ? 1 : 0;
  if(itemType === 'material') return (p.professionMaterials && p.professionMaterials[itemId]) || 0;
  if(itemType === 'professionItem') return (p.professionItems && p.professionItems[itemId]) || 0;
  return (p.cards && p.cards[itemId]) || 0;
}
function auctionAdjustInventory(p, itemType, itemId, delta, diceData){
  if(itemType === 'dice'){
    ensureDiceInventory(p);
    if(delta < 0){
      // 上架時移除：若正裝備中先卸下，再從庫存刪除
      p.diceSlots = p.diceSlots.map(id => id === itemId ? null : id);
      delete p.dice[itemId];
    } else if(delta > 0 && diceData){
      // 得標／流標退回：用拍賣建立時存下的骰子快照還原完整物件（品質/等級/面效果都要一致）
      p.dice[itemId] = {...diceData};
    }
    return;
  }
  if(itemType === 'material'){
    ensureProfession(p);
    p.professionMaterials[itemId] = (p.professionMaterials[itemId]||0) + delta;
  } else if(itemType === 'professionItem'){
    ensureProfession(p);
    p.professionItems[itemId] = (p.professionItems[itemId]||0) + delta;
  } else {
    p.cards[itemId] = (p.cards[itemId]||0) + delta;
  }
}
// 拍賣物品發放給「別人」（得標者/流標退回賣家）一律走 pendingReward，
// 不直接 loadPlayer+mutate+savePlayer —— 因為拍賣結算可能由任何正在瀏覽
// 拍賣頁的玩家觸發，得標者當下若在自己畫面做其他操作並存檔，會用他手上
// 舊的資料整包覆寫掉這裡剛加上去的卡，導致「收購成功卻沒收到卡」。
async function grantAuctionItem(nick, itemType, itemId, qty, diceData){
  if(itemType === 'dice') return createPendingReward(nick, 'dice', {diceData});
  if(itemType === 'material') return createPendingReward(nick, 'material', {materialId:itemId, qty});
  if(itemType === 'professionItem') return createPendingReward(nick, 'item', {itemId, qty});
  return createPendingReward(nick, 'card', {cardId:itemId, qty});
}
// 讓舊資料（只有 cardId，沒有 itemType/itemId/qty）也能沿用同一套邏輯
function normalizeAuction(a){
  if(!a) return a;
  if(!a.itemType){ a.itemType = 'card'; a.itemId = a.cardId; }
  if(typeof a.qty !== 'number' || a.qty < 1) a.qty = 1;
  if(!Array.isArray(a.bidHistory)) a.bidHistory = [];
  return a;
}

    return `<option value="${d.id}">${label}</option>`;
