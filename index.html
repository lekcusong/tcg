<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title>Mystic Tarot Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #120a1e;
    --bg-panel: #1c1030;
    --bg-panel-raised: #251540;
    --gold: #c9a24a;
    --gold-bright: #e8c468;
    --violet: #8b6bd1;
    --cream: #f0e6d6;
    --muted: #9a8ca8;
    --line: rgba(201,162,74,0.25);
    --common: #8a94a6;
    --uncommon: #4fb286;
    --rare: #4a90e2;
    --legendary-a: #b98cf0;
    --legendary-b: #8b3fd6;
    --danger: #c15b5b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(139,107,209,0.18), transparent 55%),
      radial-gradient(ellipse at 90% 10%, rgba(201,162,74,0.12), transparent 50%),
      var(--bg-void);
    color:var(--cream);
    font-family:'EB Garamond', serif;
    min-height:100vh;
  }
  #app{max-width:920px;margin:0 auto;padding:22px 16px 60px;}

  .brand{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;flex-wrap:wrap;gap:10px;
  }
  .brand h1{
    font-family:'Cinzel Decorative', serif;
    font-size:22px;letter-spacing:1px;color:var(--gold-bright);
    margin:0;
    text-shadow:0 0 18px rgba(201,162,74,0.35);
  }
  .brand .tag{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:'Space Mono',monospace;}
  .ig-link{color:var(--gold-bright);text-decoration:none;}
  .ig-link:hover{text-decoration:underline;}
  .player-chip{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-panel);border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;font-family:'Space Mono',monospace;font-size:13px;
  }
  .player-chip .coin{color:var(--gold-bright);font-weight:700;}
  .player-chip .name{color:var(--cream);}
  .player-chip button{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;
    text-decoration:underline;font-family:'EB Garamond',serif;
  }

  .login-screen{
    max-width:420px;margin:12vh auto;text-align:center;
    background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;
    padding:36px 28px;
  }
  .login-screen .sigil{font-size:40px;margin-bottom:6px;filter:drop-shadow(0 0 12px rgba(139,107,209,0.5));}
  .login-screen h1{font-family:'Cinzel Decorative',serif;color:var(--gold-bright);font-size:24px;margin:0 0 6px;}
  .login-screen p{color:var(--muted);font-size:15px;margin:0 0 22px;}
  .login-screen input{
    width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg-void);color:var(--cream);font-family:'EB Garamond',serif;font-size:16px;
    margin-bottom:14px;
  }
  .login-screen input:focus{outline:none;border-color:var(--gold);}
  .btn{
    display:inline-block;padding:11px 22px;border-radius:8px;border:1px solid var(--gold);
    background:linear-gradient(180deg, rgba(201,162,74,0.18), rgba(201,162,74,0.06));
    color:var(--gold-bright);font-family:'Cinzel',serif;font-weight:600;font-size:14px;
    letter-spacing:0.5px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(201,162,74,0.25);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.secondary{border-color:var(--line);color:var(--muted);background:transparent;}
  .btn.small{padding:6px 14px;font-size:12px;}
  .btn.full{width:100%;}

  .tabs{display:flex;gap:6px;margin:20px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tab{
    padding:9px 16px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:0.5px;
    color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--gold-bright);border-bottom-color:var(--gold);}

  .panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}

  /* 最高榮譽排行榜（完美骰）：金色漸層 + 呼吸光暈 + 流動光澤掃過效果，
     用來跟其他排行榜拉開視覺層級，暗示這是「最難刷、最值得曬」的榜。 */
  .panel.honor-panel{
    position:relative;
    border:1px solid var(--gold);
    background:
      linear-gradient(160deg, rgba(201,162,74,0.2), rgba(232,196,104,0.08) 45%, var(--bg-panel) 75%);
    animation: honor-panel-glow 3.2s ease-in-out infinite;
    overflow:visible;
  }
  .panel.honor-panel::before{
    content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;z-index:0;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.4) 48%, rgba(232,196,104,0.6) 52%, transparent 70%);
    background-size:250% 100%;background-position:-120% 0;
    animation: honor-shimmer-sweep 3.2s ease-in-out infinite;
  }
  .panel.honor-panel > *{position:relative;z-index:1;}
  @keyframes honor-panel-glow{
    0%,100%{ box-shadow:0 0 16px rgba(201,162,74,0.28); }
    50%{ box-shadow:0 0 34px rgba(232,196,104,0.6); }
  }
  @keyframes honor-shimmer-sweep{
    0%{ background-position:-120% 0; }
    55%,100%{ background-position:120% 0; }
  }
  .panel.honor-panel h2{
    background:linear-gradient(90deg, var(--gold-bright), #fff6d8, var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .honor-ribbon{
    position:absolute;top:-12px;left:16px;z-index:2;
    display:inline-flex;align-items:center;gap:4px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#241608;font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:1px;
    padding:4px 12px;border-radius:999px;box-shadow:0 2px 12px rgba(201,162,74,0.55);
  }

  .panel h2{font-family:'Cinzel',serif;font-size:16px;color:var(--gold-bright);margin:0 0 4px;letter-spacing:0.5px;}
  .panel .sub{color:var(--muted);font-size:13px;margin:0 0 16px;}

  .draw-cta{text-align:center;padding:28px 20px;}
  .draw-cta .countdown{font-family:'Space Mono',monospace;color:var(--muted);font-size:13px;margin-top:10px;}
  .draw-cta.tarot-banner{
    position:relative;border-radius:16px;overflow:hidden;padding:34px 20px 26px;
    background:
      linear-gradient(180deg, rgba(14,8,24,0.55) 0%, rgba(14,8,24,0.3) 38%, rgba(14,8,24,0.88) 100%),
      url('https://lekcusong.github.io/tcg/assets/css-tarot-banner.jpg') center 32%/cover no-repeat,
      var(--bg-panel);
    border-color:rgba(201,162,74,0.4);
  }
  .draw-cta.tarot-banner h2{text-shadow:0 2px 14px rgba(0,0,0,0.65);}
  .draw-cta.tarot-banner .sub{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .draw-cta.tarot-banner .countdown{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .draw-cta.resonance-banner{
    position:relative;border-radius:16px;overflow:hidden;padding:34px 20px 26px;
    background:
      linear-gradient(180deg, rgba(14,8,24,0.55) 0%, rgba(14,8,24,0.3) 38%, rgba(14,8,24,0.88) 100%),
      url('https://lekcusong.github.io/tcg/assets/css-resonance-banner.jpg') center 40%/cover no-repeat,
      var(--bg-panel);
    border-color:rgba(201,162,74,0.4);
  }
  .draw-cta.resonance-banner h2{text-shadow:0 2px 14px rgba(0,0,0,0.65);}
  .draw-cta.resonance-banner .sub{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .draw-cta.resonance-banner .countdown{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  /* 手機版：桌機用 cover 裁切成電影感的橫幅，但手機寬度太窄時同樣的裁切比例會讓圖片主體被切掉一大半、
     看起來像只看到中間一小條。改用 contain 讓整張圖完整顯示，並拉高 min-height 給圖片足夠的顯示空間。 */
  @media (max-width:600px){
    .draw-cta.resonance-banner{
      min-height:220px;
      background:
        linear-gradient(180deg, rgba(14,8,24,0.55) 0%, rgba(14,8,24,0.3) 38%, rgba(14,8,24,0.88) 100%),
        url('https://lekcusong.github.io/tcg/assets/css-resonance-banner.jpg') center/contain no-repeat,
        var(--bg-panel);
    }
  }
  .panel.profession-banner{
    position:relative;border-radius:14px;overflow:hidden;
    background:
      linear-gradient(180deg, rgba(14,8,24,0.55) 0%, rgba(14,8,24,0.32) 45%, rgba(14,8,24,0.88) 100%),
      url('https://lekcusong.github.io/tcg/assets/css-profession-banner.jpg') center 38%/cover no-repeat,
      var(--bg-panel);
    border-color:rgba(201,162,74,0.4);
  }
  .panel.profession-banner h2{text-shadow:0 2px 14px rgba(0,0,0,0.65);}
  .panel.profession-banner .sub{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .panel.profession-banner .countdown{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .profession-banner-group{
    position:relative;border-radius:14px;overflow:hidden;padding:0;
    background:
      linear-gradient(180deg, rgba(14,8,24,0.55) 0%, rgba(14,8,24,0.3) 38%, rgba(14,8,24,0.88) 100%),
      url('https://lekcusong.github.io/tcg/assets/css-profession-banner.jpg') center 38%/cover no-repeat,
      var(--bg-panel);
    border-color:rgba(201,162,74,0.4);
  }
  .profession-banner-group .profession-banner-section{padding:20px;}
  .profession-banner-group .profession-banner-section + .profession-banner-section{border-top:1px solid rgba(201,162,74,0.3);}
  .profession-banner-group h2{text-shadow:0 2px 14px rgba(0,0,0,0.65);}
  .profession-banner-group .sub{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .profession-banner-group .countdown{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .dice-banner-group{
    position:relative;border-radius:14px;overflow:hidden;padding:0;
    background:
      linear-gradient(180deg, rgba(14,8,24,0.55) 0%, rgba(14,8,24,0.3) 38%, rgba(14,8,24,0.88) 100%),
      url('https://lekcusong.github.io/tcg/assets/css-dice-banner.jpg') center 40%/cover no-repeat,
      var(--bg-panel);
    border-color:rgba(201,162,74,0.4);
  }
  .dice-banner-group .dice-banner-section{padding:20px;}
  .dice-banner-group .dice-banner-section + .dice-banner-section{border-top:1px solid rgba(201,162,74,0.3);}
  .dice-banner-group h2{text-shadow:0 2px 14px rgba(0,0,0,0.65);}
  .dice-banner-group .sub{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .dice-banner-group .countdown{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .pet-banner-group{
    position:relative;border-radius:14px;overflow:hidden;padding:0;
    background:
      linear-gradient(180deg, rgba(14,8,24,0.5) 0%, rgba(14,8,24,0.28) 30%, rgba(14,8,24,0.5) 55%, rgba(14,8,24,0.92) 100%),
      url('https://lekcusong.github.io/tcg/assets/css-pet-banner.jpg') center 30%/cover no-repeat,
      var(--bg-panel);
    border-color:rgba(201,162,74,0.4);
  }
  .pet-banner-group .pet-banner-section{padding:20px;}
  .pet-banner-group .pet-banner-section + .pet-banner-section{border-top:1px solid rgba(201,162,74,0.3);}
  .pet-banner-group h2{text-shadow:0 2px 14px rgba(0,0,0,0.65);}
  .pet-banner-group .sub{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .pet-banner-group .countdown{color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,0.65);}
  .fortune-panel{
    opacity:0;transform:translateY(6px);transition:opacity .5s ease, transform .5s ease;
    margin-top:16px;padding-top:14px;border-top:1px solid rgba(212,175,90,0.25);text-align:left;
  }
  .fortune-panel.show{opacity:1;transform:translateY(0);}
  .draw-cta.tarot-banner .fortune-panel{
    background:rgba(14,8,24,0.6);border-radius:12px;padding:14px 16px;
    border-top:1px solid rgba(212,175,90,0.3);
  }
  .fortune-card{margin-bottom:10px;}
  .fortune-card:last-child{margin-bottom:0;}
  .fortune-card .fc-name{font-family:'Cinzel',serif;color:var(--gold-bright);font-size:13px;margin-bottom:2px;}
  .fortune-card .fc-text{font-size:13px;color:var(--cream);line-height:1.6;}

  .card-flip-row{display:flex;justify-content:center;gap:14px;margin:18px 0;flex-wrap:wrap;}
  .flip-card{width:104px;aspect-ratio:2/3;perspective:800px;}
  .flip-card-inner{
    position:relative;width:100%;height:100%;transition:transform 0.8s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
  .flip-card.flipped{cursor:pointer;}
  .flip-face{
    position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px solid var(--line);
  }
  .flip-back{
    background:
      repeating-linear-gradient(45deg, rgba(201,162,74,0.08) 0 6px, transparent 6px 12px),
      var(--bg-panel-raised);
    font-size:26px;color:var(--gold);
  }
  .flip-front{transform:rotateY(180deg);padding:8px;text-align:center;}

  .card-face{
    width:100%;height:100%;border-radius:9px;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:10px 6px;position:relative;
  }
  .card-face.has-art::before{
    content:'';position:absolute;inset:0;border-radius:9px;
    background:linear-gradient(180deg, rgba(10,8,16,0.05) 0%, rgba(10,8,16,0.1) 55%, rgba(10,8,16,0.72) 100%);
  }
  .card-face > *{position:relative;z-index:1;}
  .card-face .icon{font-size:30px;margin-top:4px;}
  .card-face .name{font-family:'Cinzel',serif;font-size:11px;line-height:1.25;color:var(--cream);}
  .card-face .rarity-tag{
    font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;
    padding:2px 8px;border-radius:999px;
  }
  .rar-common{background:rgba(138,148,166,0.18);border:1px solid var(--common);color:var(--common);}
  .rar-uncommon{background:rgba(79,178,134,0.15);border:1px solid var(--uncommon);color:var(--uncommon);}
  .rar-rare{background:rgba(155,107,209,0.15);border:1px solid var(--rare);color:var(--rare);}
  .rar-legendary{background:linear-gradient(90deg, rgba(185,140,240,0.2), rgba(139,63,214,0.2));border:1px solid var(--legendary-a);color:var(--legendary-a);}
  .rar-epic{background:linear-gradient(90deg, rgba(185,140,240,0.2), rgba(139,63,214,0.2));border:1px solid var(--legendary-a);color:var(--legendary-a);}

  .cf-common .card-face{background:linear-gradient(160deg, #26303f, #1c232e);}
  .cf-uncommon .card-face{background:linear-gradient(160deg, #17332a, #142521);}
  .cf-rare .card-face{background:linear-gradient(160deg, #2c1f45, #1e1533);}
  .cf-legendary .card-face{background:linear-gradient(160deg, #3a2a1a, #2a1530);box-shadow:0 0 20px rgba(185,140,240,0.25) inset;}

  .cf-epic .card-face{background:linear-gradient(160deg, #3a2a1a, #2a1530);box-shadow:0 0 20px rgba(185,140,240,0.25) inset;}

  /* 這條規則故意放在稀有度背景設定之後，確保「有美術圖」時的顯示方式(完整不裁切)
     一定會蓋掉上面幾條稀有度預設漸層背景的設定，兩者優先權相同時後寫的才會生效 */
  .card-face.has-art{background-size:contain;background-repeat:no-repeat;background-position:center;background-color:rgba(0,0,0,0.35);overflow:hidden;}

  /* ---- Legendary reveal effects ---- */
  @keyframes legendary-pulse{
    0%,100%{ box-shadow:0 0 14px rgba(185,140,240,0.4), 0 0 0 rgba(185,140,240,0) inset; }
    50%{ box-shadow:0 0 34px rgba(185,140,240,0.95), 0 0 55px rgba(139,63,214,0.55); }
  }
  @keyframes legendary-spin-glow{
    0%{ transform:rotate(0deg); opacity:0.55; }
    100%{ transform:rotate(360deg); opacity:0.55; }
  }
  @keyframes legendary-sparkle{
    0%{ opacity:0; transform:scale(0.3) rotate(0deg); }
    35%{ opacity:1; }
    100%{ opacity:0; transform:scale(1.8) rotate(45deg); }
  }
  @keyframes legendary-shake{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-2px,1px); }
    40%{ transform:translate(2px,-1px); }
    60%{ transform:translate(-1px,-2px); }
    80%{ transform:translate(1px,2px); }
  }
  .flip-card.legendary-reveal{ animation: legendary-shake .5s ease 1; }
  .flip-card.legendary-reveal .flip-face.flip-front{
    animation: legendary-pulse 1.3s ease-in-out infinite;
    border-color:var(--legendary-a);
    z-index:2;
  }
  .flip-card.legendary-reveal .flip-face.flip-front::before{
    content:'';position:absolute;inset:-10px;border-radius:50%;pointer-events:none;
    background:conic-gradient(from 0deg, rgba(185,140,240,0), rgba(185,140,240,0.55), rgba(139,63,214,0.4), rgba(185,140,240,0));
    animation: legendary-spin-glow 3.2s linear infinite;
    z-index:-1;
  }
  .flip-card.legendary-reveal .flip-face.flip-front::after{
    content:'✨'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:44px; pointer-events:none; animation: legendary-sparkle 1s ease-out .05s 1;
  }
  .legendary-flash{
    position:fixed; inset:0; z-index:1200; pointer-events:none;
    background:radial-gradient(circle at 50% 40%, rgba(185,140,240,0.55), rgba(139,63,214,0.15) 45%, transparent 75%);
    opacity:0; animation: legendary-flash-anim 1.1s ease-out forwards;
  }
  @keyframes legendary-flash-anim{
    0%{ opacity:0; }
    15%{ opacity:1; }
    100%{ opacity:0; }
  }
  .toast.legendary-toast{
    border-color:var(--legendary-a);
    background:linear-gradient(90deg, rgba(185,140,240,0.25), rgba(139,63,214,0.25)), var(--bg-panel-raised);
    color:var(--legendary-a);
    box-shadow:0 6px 28px rgba(185,140,240,0.4);
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));gap:10px;}
  .avatar-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(52px, 1fr));gap:8px;}
  .avatar-opt{
    aspect-ratio:1/1;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);
    display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .avatar-opt:hover{transform:translateY(-1px);border-color:var(--gold);}
  .avatar-opt.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 14px rgba(201,162,74,0.4);background:linear-gradient(180deg, rgba(201,162,74,0.18), rgba(201,162,74,0.06));}
  .avatar-current{
    width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:26px;
    background:var(--bg-panel-raised);flex-shrink:0;overflow:hidden;
  }
  .avatar-img-inline{width:1em;height:1em;border-radius:50%;object-fit:cover;vertical-align:-0.2em;display:inline-block;}
  .avatar-current .avatar-img-inline{width:100%;height:100%;}
  .chat-avatar{width:20px;height:20px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--bg-void);flex-shrink:0;}
  .avatar-opt.shop-avatar{background-size:cover;background-position:center;font-size:0;position:relative;}
  .avatar-opt.shop-avatar.locked{opacity:0.5;filter:grayscale(0.7);}
  .avatar-opt.shop-avatar .avatar-cost-tag{

  .dice-roll-anim{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;padding:6px 0;}

<script>
(function(){

// ---------- Supabase 設定 ----------
// 請把下面兩個值換成你自己 Supabase 專案的 Project URL 和 Publishable key
// （在 Supabase 後台 Settings → API Keys 頁面可以找到）
const SUPABASE_URL = 'https://hmkpwrefecwjxnyggcej.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_vs1K1Ao4Gjl2JK5xrK-GpQ_aXsHyty7';

const SB_HEADERS = {
  apikey: SUPABASE_ANON_KEY,
  Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
};

// 模仿原本 window.storage 的介面（get/set/list），
// 底層改用 Supabase 的 kv_store 資料表透過 REST API 讀寫。
const storage = {
  async get(key){
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`,
      { headers: SB_HEADERS }
    );
    if(!res.ok) throw new Error('storage get failed: ' + res.status);
    const rows = await res.json();
    if(!rows || rows.length === 0) return null;
    return { key, value: rows[0].value };
  },
  async set(key, value){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store`, {
      method: 'POST',
      headers: {
        ...SB_HEADERS,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates,return=minimal',
      },
      body: JSON.stringify({ key, value, updated_at: new Date().toISOString() }),
    });
    if(!res.ok) throw new Error('storage set failed: ' + res.status);
    return { key, value };
  },
  async delete(key){
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}`,
      { method: 'DELETE', headers: SB_HEADERS }
    );
    if(!res.ok) throw new Error('storage delete failed: ' + res.status);
    return { key, deleted: true };
  },
  async list(prefix){
    const pattern = (prefix || '') + '*'; // PostgREST 的 like 用 * 代表 %
    // 明確依 key 由新到舊排序：key 內含時間戳記前綴，若資料表筆數超過
    // PostgREST 預設回傳上限，未指定排序時可能撈不到最新資料，導致新寫入
    // 的資料（例如通知）在前綴資料量大時「消失」。加上 order 可確保優先
    // 拿到最新的那一批。
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/kv_store?key=like.${encodeURIComponent(pattern)}&select=key&order=key.desc`,
      { headers: SB_HEADERS }
    );
    if(!res.ok) throw new Error('storage list failed: ' + res.status);
    const rows = await res.json();
    return { keys: rows.map(r=>r.key) };
  },
  // 一次要「某前綴底下全部資料」時用這個，取代「list() 拿 key 清單、
  // 再逐一 get() 每個 key」的寫法。原本的寫法就算靠 fetchKeysBatch 把
  // 同時飛的請求數限制在 6 支，拍賣行、好友、玩家清單這種一多起來還是要
  // 排隊發好幾輪 HTTP 請求，是「進拍賣很卡」的主因。這裡用 PostgREST
  // 的 key=in.(...) 一次把 key 跟 value 都選出來，整個前綴只需要 1 支
  // 請求（key 太多時仍分批用 in.() 查，但一批可以裝上百個 key，遠比
  // 逐一 get() 快）。
  async listValues(prefix){
    const pattern = (prefix || '') + '*';
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/kv_store?key=like.${encodeURIComponent(pattern)}&select=key,value&order=key.desc`,
      { headers: SB_HEADERS }
    );
    if(!res.ok) throw new Error('storage listValues failed: ' + res.status);
    return await res.json(); // [{key, value}, ...]
  },
};
// 搭配 storage.listValues() 使用：把 [{key,value}] 逐筆 JSON.parse，
// 單筆壞資料（例如舊格式、資料損毀）只跳過那一筆，不會讓整份清單掛掉。
function parseKvRows(rows, mapFn){
  mapFn = mapFn || (v=>v);
  const out = [];
  for(const r of (rows||[])){
    try{ out.push(mapFn(JSON.parse(r.value), r.key)); }
    catch(e){ /* 單筆壞資料略過 */ }
  }
  return out;
}

const MINOR_IMAGES = {

function buildDeck(){
  const deck = [];
  SUITS.forEach(suit=>{
    RANKS.forEach((rank, i)=>{
      const rarity = i < 10 ? 'common' : 'uncommon';
      deck.push({
        id: `${suit.key}_${i}`,
        name: `${rank} of ${suit.label}`,
        icon: suit.icon,
        rarity,
        arcana:'minor',
        image: MINOR_IMAGES[`${suit.key}_${i}`] || null,
        meaningZh: `${SUIT_THEMES[suit.key].zh}方面，${RANK_MEANINGS[rank].zh}`,
        meaningEn: `On the theme of ${SUIT_THEMES[suit.key].en}: ${RANK_MEANINGS[rank].en}`
      });
    });
  });
  MAJOR.forEach((m, i)=>{
    deck.push({id:`major_${i}`, name:m.name, icon:m.icon, rarity:m.rarity, arcana:'major', image:m.image, meaningZh: MAJOR_MEANINGS[i].zh, meaningEn: MAJOR_MEANINGS[i].en});
  });
  return deck;
}
function cardMeaning(c){
  return appLang === 'zh' ? c.meaningZh : c.meaningEn;
}

let SHOP_AVATARS = []; // [{id, image(dataUrl), name, cost}]
let SHOP_AVATAR_BY_ID = {};
async function loadAvatarShop(){
  try{
    const r = await storage.get('config:avatar_shop');
    if(r){
      const arr = JSON.parse(r.value);
      if(Array.isArray(arr)) SHOP_AVATARS = arr;
    } else {
      SHOP_AVATARS = [];
    }
  }catch(e){ /* keep previous value */ }
  SHOP_AVATAR_BY_ID = Object.fromEntries(SHOP_AVATARS.map(a=>[a.id, a]));
}
async function saveAvatarShop(){
  await storage.set('config:avatar_shop', JSON.stringify(SHOP_AVATARS));
  SHOP_AVATAR_BY_ID = Object.fromEntries(SHOP_AVATARS.map(a=>[a.id, a]));
}
function isAvatarUnlocked(p, avatarId){
  if(AVATAR_BY_ID[avatarId]) return true; // 預設頭像永遠可用
  return !!(p && Array.isArray(p.unlockedAvatars) && p.unlockedAvatars.includes(avatarId));
}
async function buyShopAvatar(avatarId){
  const shopAvatar = SHOP_AVATAR_BY_ID[avatarId];
  const p = state.player;
  if(!shopAvatar || !p) return;
  if(!Array.isArray(p.unlockedAvatars)) p.unlockedAvatars = [];
  if(p.unlockedAvatars.includes(avatarId)){
    // 已購買過，直接切換
    await setAvatar(avatarId);
    return;
  }
  if(!p.materials || typeof p.materials.contrib !== 'number' || p.materials.contrib < shopAvatar.cost){
    showToast(tt(`貢獻點不足，需要 ${shopAvatar.cost}`, `Not enough contribution points, need ${shopAvatar.cost}`));
    return;
  }
  p.materials.contrib -= shopAvatar.cost;
  p.unlockedAvatars.push(avatarId);
  p.avatarId = avatarId;
  await savePlayer(p);
  showToast(tt(`已購買頭像「${shopAvatar.name || avatarId}」✦`, `Avatar "${shopAvatar.name || avatarId}" purchased ✦`));
  render();
}

const DEFAULT_SEASON_CONTRIB_EXCHANGE_RATE = {coins: 1};

let SEASON_ACTIVE = true;
let SEASON_CONTRIB_EXCHANGE_RATE = {...DEFAULT_SEASON_CONTRIB_EXCHANGE_RATE};

function seasonKey(suffix){ return `config:${CURRENT_SEASON_ID}_${suffix}`; }

async function loadSeasonConfig(){
  try{
    const active = await storage.get('config:season_current');
    SEASON_ACTIVE = active ? (JSON.parse(active.value) === CURRENT_SEASON_ID) : true;
  }catch(e){ SEASON_ACTIVE = true; }
  try{
    const r = await storage.get(seasonKey('cards'));
    if(r){
      const arr = JSON.parse(r.value);
      if(Array.isArray(arr) && arr.length){ SEASON_CARDS = arr; rebuildSeasonCardIndex(); }
    }
  }catch(e){ /* keep defaults */ }
  try{
    const r = await storage.get(seasonKey('card_draw_cost'));
    if(r){
      const v = parseFloat(r.value);
      if(!isNaN(v) && v >= 0) SEASON_CARD_DRAW_COST = v;
    }
  }catch(e){ /* keep default */ }
  try{
    const r = await storage.get(seasonKey('contrib_exchange_rate'));
    if(r){
      const s = JSON.parse(r.value);
      if(typeof s.coins === 'number' && s.coins >= 0) SEASON_CONTRIB_EXCHANGE_RATE.coins = s.coins;
    }
  }catch(e){ /* keep default */ }
}
async function saveSeasonActive(isActive){
  SEASON_ACTIVE = isActive;
  await storage.set('config:season_current', JSON.stringify(isActive ? CURRENT_SEASON_ID : ''));
}
async function saveSeasonCardDrawCost(){
  await storage.set(seasonKey('card_draw_cost'), JSON.stringify(SEASON_CARD_DRAW_COST));
}
async function saveSeasonContribExchangeRate(){
  await storage.set(seasonKey('contrib_exchange_rate'), JSON.stringify(SEASON_CONTRIB_EXCHANGE_RATE));
}
function ensureMaterials(p){
  if(!p.materials) p.materials = {};
  if(typeof p.materials.contrib !== 'number') p.materials.contrib = 0;
  if(typeof p.materials.diceEssence !== 'number') p.materials.diceEssence = 0; // 骰子精華：拆解骰子取得，用於強化骰子
  if(typeof p.materials.ghostDiceTalisman !== 'number') p.materials.ghostDiceTalisman = 0; // 幽冥骰符：幽冥活動Boss破階獎勵，用了保底抽稀有以上骰子
  if(!p.seasonCards) p.seasonCards = {};
  if(!p.starChart) p.starChart = {unlocked:[]};
  if(!Array.isArray(p.unlockedAvatars)) p.unlockedAvatars = [];
  return p.materials;
}

function expeditionStreakBossHp(streak){
  return EXPEDITION_STREAK_BOSS_BASE_HP + Math.max(0, streak - EXPEDITION_STREAK_BOSS_TRIGGER) * EXPEDITION_STREAK_BOSS_HP_STEP;

  return EXPEDITION_STREAK_BOSS_COIN_BASE + Math.max(0, streak - EXPEDITION_STREAK_BOSS_TRIGGER) * EXPEDITION_STREAK_BOSS_COIN_STEP;
}

// ---------- 階段二：派遣邏輯（風險等級 + 局內祝福/詛咒翻牌）----------
// 純前端暫存的「翻牌」草稿狀態，key 是 `${tierId}-${durationKey}`；只影響尚未派遣的選擇畫面，
// 派遣成功後清掉、重新整理頁面也會重置，不需要存進玩家存檔。
let expeditionRogueDraft = {};
function getExpeditionRogueDraft(uid){
  if(!expeditionRogueDraft[uid]){
    expeditionRogueDraft[uid] = {riskLevel:'standard', drawnCards:null, selectedIdx:null};
  }
  return expeditionRogueDraft[uid];
}
// 依風險等級的 blessingWeight 機率翻 EXPEDITION_BLESSING_CURSE_DRAW_COUNT 張祝福/詛咒卡（允許重複）
function drawExpeditionBlessingCurseCards(riskLevel){
  const riskData = EXPEDITION_RISK_LEVELS[riskLevel] || EXPEDITION_RISK_LEVELS.standard;
  const weight = riskData.blessingWeight;
  const drawn = [];
  for(let i=0;i<EXPEDITION_BLESSING_CURSE_DRAW_COUNT;i++){
    const isBlessing = Math.random() < weight;
    const pool = EXPEDITION_BLESSING_CURSE_POOL.filter(c=>c.type===(isBlessing?'blessing':'curse'));
    drawn.push(pool[Math.floor(Math.random()*pool.length)]);
  }
  return drawn;
}

// ---------- 階段三：進行中頁面——事件節點觸發與互動 ----------
// 派遣當下就依這趟的時長，照 EXPEDITION_EVENT_SCHEDULE 的進度百分比排好節點時刻表；
// 每個節點觸發時是「選擇型」還是「戰鬥型」各 50% 機率隨機決定，內容也隨機從對應池子抽一個。
// 🐛 共用修正：任何會改變 exp.readyAt 的效果（小藥水縮時、選擇型節點的時間增減、額外祝福卡
// 的時長效果）都要連帶把「還沒解決」的事件節點觸發時間往同方向移動同樣的量，否則節點的
// triggerAt（派遣當下依原始總時長算好的絕對時間戳）會跟縮短/延長後的剩餘時間脫節——縮時
// 縮到 readyAt 追過 triggerAt 時，節點會在玩家還沒看到互動面板前就被 claimExpedition 的
// 逾時安全結算吃掉，看起來就像「事件節點沒有觸發」。
function shiftUnresolvedExpeditionEventTriggers(exp, deltaMs){
  if(!exp || !deltaMs || !Array.isArray(exp.events)) return;
  exp.events.forEach(ev=>{
    if(!ev.resolved) ev.triggerAt -= deltaMs;
  });
}
function buildExpeditionEventSchedule(durationKey, startAt, durationMs){
  const points = EXPEDITION_EVENT_SCHEDULE[durationKey] || [];
  return points.map((pct, idx)=>{
    const kind = Math.random() < 0.5 ? 'choice' : 'combat';
    const pool = kind==='choice' ? EXPEDITION_CHOICE_EVENT_POOL : EXPEDITION_COMBAT_EVENT_POOL;
    const ev = pool[Math.floor(Math.random()*pool.length)];
    return {idx, progressPct: pct, triggerAt: startAt + Math.round(durationMs*pct), kind, eventId: ev.id, resolved:false, chosenOptionId:null, result:null};
  });
}
// 選擇型節點：玩家點選項後立即結算，效果疊加進 p.expedition.eventSuccessDelta / eventRewardPctDelta（結算時／階段四讀取）。
// 需要道具或金幣的選項，庫存/金幣不足時回傳 {error}，UI 端要先擋掉不給點。
function resolveExpeditionEventOption(p, event, optionId){
  const evDef = EXPEDITION_CHOICE_EVENT_POOL.find(e=>e.id===event.eventId);
  const opt = evDef && evDef.options.find(o=>o.id===optionId);
  if(!opt) return {error:'not_found'};
  if(opt.requiresItem && (p.professionItems[opt.requiresItem]||0) < (opt.itemCost||1)) return {error:'item'};
  if(opt.coinsCost && (p.coins||0) < opt.coinsCost) return {error:'coins'};

  if(opt.requiresItem) p.professionItems[opt.requiresItem] = (p.professionItems[opt.requiresItem]||0) - (opt.itemCost||1);
  if(opt.coinsCost) p.coins = (p.coins||0) - opt.coinsCost;
  if(opt.instantCoins) p.coins = (p.coins||0) + opt.instantCoins;

  let successDelta = opt.successDelta || 0;
  let rewardPctDelta = opt.rewardPctDelta || 0;
  let gambleWin = null;
  if(opt.gamble){
    gambleWin = Math.random() < opt.gamble.successPct;
    rewardPctDelta += gambleWin ? opt.gamble.winRewardPctDelta : opt.gamble.loseRewardPctDelta;
  }
  if(opt.remainingTimePctDelta){
    const remaining = Math.max(0, p.expedition.readyAt - Date.now());
    const prevReadyAt = p.expedition.readyAt;
    p.expedition.readyAt = Date.now() + Math.max(0, Math.round(remaining * (1+opt.remainingTimePctDelta)));
    shiftUnresolvedExpeditionEventTriggers(p.expedition, prevReadyAt - p.expedition.readyAt);
  }
  const extraBlessingsApplied = [];
  if(opt.extraBlessingDraw){
    for(let i=0;i<opt.extraBlessingDraw;i++){
      const blessingPool = EXPEDITION_BLESSING_CURSE_POOL.filter(c=>c.type==='blessing');
      const card = JSON.parse(JSON.stringify(blessingPool[Math.floor(Math.random()*blessingPool.length)]));
      extraBlessingsApplied.push(card);
      p.expedition.extraBlessings.push(card);
      if(typeof card.successDelta === 'number') successDelta += card.successDelta;
      if(typeof card.rewardRangePctDelta === 'number') rewardPctDelta += card.rewardRangePctDelta;
      if(typeof card.durationPctDelta === 'number'){
        const remaining2 = Math.max(0, p.expedition.readyAt - Date.now());
        const prevReadyAt2 = p.expedition.readyAt;
        p.expedition.readyAt = Date.now() + Math.max(0, Math.round(remaining2 * (1+card.durationPctDelta)));
        shiftUnresolvedExpeditionEventTriggers(p.expedition, prevReadyAt2 - p.expedition.readyAt);
      }
    }
  }
  p.expedition.eventSuccessDelta = (p.expedition.eventSuccessDelta||0) + successDelta;
  p.expedition.eventRewardPctDelta = (p.expedition.eventRewardPctDelta||0) + rewardPctDelta;
  event.resolved = true;
  event.chosenOptionId = optionId;
  event.result = {successDelta, rewardPctDelta, gambleWin, extraBlessingIds: extraBlessingsApplied.map(c=>c.id)};
  return event.result;
}
// 戰鬥型節點：不需要玩家操作，偵測到時間到就自動判定（依 difficulty 換算勝率），結果直接疊加進 eventRewardPctDelta。
function autoResolveExpeditionCombatEvent(p, event){
  const evDef = EXPEDITION_COMBAT_EVENT_POOL.find(e=>e.id===event.eventId);
  if(!evDef) return null;
  const winChance = Math.max(0.15, Math.min(0.9, 1 - evDef.difficulty*0.35));
  const win = Math.random() < winChance;
  const rewardPctDelta = win ? evDef.winRewardPctDelta : evDef.loseRewardPctDelta;
  p.expedition.eventRewardPctDelta = (p.expedition.eventRewardPctDelta||0) + rewardPctDelta;
  event.resolved = true;
  event.result = {win, rewardPctDelta, winChance};
  return event.result;
}

// 花園收成時，隨機機率掉落職業材料：隨機掉藥草/礦石/木料其中一種，寫死不開放 GM 調整
const FARM_MATERIAL_DROP_CHANCE = 0.55; // 55% 機率掉落
const FARM_MATERIAL_DROP_MIN = 2;
const FARM_MATERIAL_DROP_MAX = 4; // 隨機 2~4 個

// 職業升級所需經驗表，公式仿照 expeditionNextLevelExp（先把骨架建好，之後可調整）
const PROFESSION_MAX_LEVEL = 10;
const PROFESSION_EXP_TABLE = [0, 150, 400, 800, 1400, 2200, 3200, 4500, 6200, 8500, 12000];
function professionNextLevelExp(level){
  return PROFESSION_EXP_TABLE[Math.min(level+1, PROFESSION_MAX_LEVEL)];
}
function applyProfessionExpGain(p, professionId, gain){
  ensureProfession(p);
  const prog = p.professionProgress[professionId];
  if(!prog) return false;
  prog.exp = (prog.exp||0) + gain;
  let leveled = false;
  while(prog.level < PROFESSION_MAX_LEVEL && prog.exp >= PROFESSION_EXP_TABLE[prog.level+1]){
    prog.level += 1;
    leveled = true;
  }
  return leveled;
}

// 🎲 職業等級加成：每級（超過Lv.1）製作時有機率發動職業技能，完全不消耗材料與體力（仍正常獲得成品與經驗），機率隨等級疊加、封頂
const DEFAULT_PROFESSION_MATERIAL_SAVE_PER_LEVEL = 0.03; // 每級 +3%
const DEFAULT_PROFESSION_MATERIAL_SAVE_CAP = 0.30; // 封頂 30%
let PROFESSION_MATERIAL_SAVE_PER_LEVEL = DEFAULT_PROFESSION_MATERIAL_SAVE_PER_LEVEL;
let PROFESSION_MATERIAL_SAVE_CAP = DEFAULT_PROFESSION_MATERIAL_SAVE_CAP;
function professionMaterialSaveChance(level){
  const lv = Math.max(1, level||1);
  return Math.min(PROFESSION_MATERIAL_SAVE_CAP, Math.max(0, (lv-1) * PROFESSION_MATERIAL_SAVE_PER_LEVEL));
}

// 依離線/被動經過時間補算體力回復（每 PROFESSION_STAMINA_REGEN_MS 回 1 點，最高 staminaMax）
function regenStamina(p){
  if(typeof p.staminaMax !== 'number' || p.staminaMax <= 0) p.staminaMax = PROFESSION_STAMINA_MAX;
  if(typeof p.stamina !== 'number' || isNaN(p.stamina)) p.stamina = p.staminaMax;
  if(typeof p.lastStaminaRegenAt !== 'number') p.lastStaminaRegenAt = Date.now();
  if(p.stamina >= p.staminaMax){
    p.lastStaminaRegenAt = Date.now();
    return;
  }
  const now = Date.now();
  const elapsed = now - p.lastStaminaRegenAt;
  const ticks = Math.floor(elapsed / PROFESSION_STAMINA_REGEN_MS);
  if(ticks <= 0) return;
  p.stamina = Math.min(p.staminaMax, p.stamina + ticks);
  p.lastStaminaRegenAt = p.lastStaminaRegenAt + ticks * PROFESSION_STAMINA_REGEN_MS;
}

function ensureProfession(p){
  if(p.profession === undefined) p.profession = null;
  if(p.profession !== null && !PROFESSION_IDS.includes(p.profession)) p.profession = null;

  if(!p.professionProgress || typeof p.professionProgress !== 'object') p.professionProgress = {};
  PROFESSION_IDS.forEach(id=>{
    const prog = p.professionProgress[id];
    if(!prog || typeof prog !== 'object'){
      p.professionProgress[id] = {level:1, exp:0};
    } else {
      if(typeof prog.level !== 'number' || prog.level < 1) prog.level = 1;
      if(typeof prog.exp !== 'number' || prog.exp < 0) prog.exp = 0;
    }
  });

  if(!p.professionMaterials || typeof p.professionMaterials !== 'object') p.professionMaterials = {};
  PROFESSION_MATERIAL_IDS.forEach(id=>{
    if(typeof p.professionMaterials[id] !== 'number') p.professionMaterials[id] = 0;
  });

  if(!p.professionItems || typeof p.professionItems !== 'object') p.professionItems = {};
  PROFESSION_ITEM_IDS.forEach(id=>{
    if(typeof p.professionItems[id] !== 'number') p.professionItems[id] = 0;
  });

  regenStamina(p);
  return p;
}

function professionDef(id){ return PROFESSION_DEFS.find(d=>d.id===id); }

async function chooseProfession(professionId){
  const p = state.player;
  if(!p) return;
  ensureProfession(p);
  const def = professionDef(professionId);
  if(!def) return;
  if(p.profession === professionId){ showToast(tt('已經是這個職業了','Already your current profession')); return; }
  if(p.profession === null){
    p.profession = professionId;
    await savePlayer(p);
    showToast(tt(`已選擇職業：${def.icon} ${professionLabel(def)}`, `Profession selected: ${def.icon} ${professionLabel(def)}`));
    render();
    return;
  }
  if((p.coins||0) < PROFESSION_RESPEC_COST){
    showToast(tt(`金幣不足，轉職需要 ${PROFESSION_RESPEC_COST} 金幣`, `Not enough coins - switching profession costs ${PROFESSION_RESPEC_COST} coins`));
    return;
  }
  const fromDef = professionDef(p.profession);
  if(!confirm(tt(`確定要花費 ✦${PROFESSION_RESPEC_COST} 轉職為「${professionLabel(def)}」嗎？（${professionLabel(fromDef)}的等級與經驗會保留，之後可以再轉回來）`, `Switch profession to "${professionLabel(def)}" for ✦${PROFESSION_RESPEC_COST}? (Your ${professionLabel(fromDef)} level/exp is kept and you can switch back later)`))) return;
  p.coins -= PROFESSION_RESPEC_COST;
  p.profession = professionId;
  await savePlayer(p);
  showToast(tt(`已轉職為：${def.icon} ${professionLabel(def)}`, `Switched profession to: ${def.icon} ${professionLabel(def)}`));
  render();
}

async function produceProfessionItem(itemId){
  const p = state.player;
  if(!p) return;
  ensureProfession(p);
  if(!p.profession){ showToast(tt('請先選擇職業','Please choose a profession first')); return; }
  const def = professionDef(p.profession);
  const recipe = def && def.recipes.find(r=>r.itemId===itemId);
  if(!def || !recipe){ showToast(tt('這不是你目前職業的配方','This recipe does not belong to your current profession')); return; }
  const prog = p.professionProgress[p.profession];
  if(recipe.unlockLevel && (prog.level||0) < recipe.unlockLevel){
    showToast(tt(`需要職業等級 Lv.${recipe.unlockLevel} 才能生產這項成品`, `Requires profession level Lv.${recipe.unlockLevel} to produce this item`));
    return;
  }
  if((p.professionMaterials[def.materialId]||0) < recipe.materialCost){
    showToast(tt(`${professionMaterialLabel(def)}不足`, `Not enough ${professionMaterialLabel(def)}`));
    return;
  }
  if((p.stamina||0) < recipe.staminaCost){
    showToast(tt('體力不足','Not enough stamina'));
    return;
  }
  if(recipe.consumeItemId && (p.professionItems[recipe.consumeItemId]||0) < (recipe.consumeQty||1)){
    const consumeMeta = professionItemMeta(recipe.consumeItemId);
    const consumeLabel = consumeMeta ? professionRecipeLabel(consumeMeta) : recipe.consumeItemId;
    showToast(tt(`${consumeLabel}庫存不足（需要 ${recipe.consumeQty||1} 件）`, `Not enough ${consumeLabel} in stock (needs ${recipe.consumeQty||1})`));
    return;
  }
  const saveChance = professionMaterialSaveChance(prog && prog.level);
  const skillProc = Math.random() < saveChance; // 職業技能發動：材料與體力（含加工材料）皆不消耗
  if(!skillProc){
    // 防呆：跟 auctionAdjustInventory 同一種寫法，避免材料被扣成負數
    p.professionMaterials[def.materialId] = Math.max(0, p.professionMaterials[def.materialId] - recipe.materialCost);
    p.stamina = Math.max(0, p.stamina - recipe.staminaCost);
    if(recipe.consumeItemId){
      p.professionItems[recipe.consumeItemId] = Math.max(0, (p.professionItems[recipe.consumeItemId]||0) - (recipe.consumeQty||1));
    }
  }
  p.professionItems[itemId] = (p.professionItems[itemId]||0) + 1;
  const leveled = applyProfessionExpGain(p, p.profession, recipe.exp);
  await savePlayer(p);
  showToast(tt(`🔨 生產完成：${recipe.icon} ${professionRecipeLabel(recipe)} +1${skillProc ? `（✨職業技能發動，材料與體力皆未消耗）` : ''}${leveled ? `，${professionLabel(def)}等級提升！` : ''}`, `🔨 Produced: ${recipe.icon} ${professionRecipeLabel(recipe)} +1${skillProc ? ` (✨Profession skill triggered - no material or stamina consumed)` : ''}${leveled ? `, ${professionLabel(def)} leveled up!` : ''}`));
  render();
}

async function useProfessionPotion(){
  const p = state.player;
  if(!p) return;
  ensureProfession(p);
  if((p.professionItems.potion_small||0) < 1){ showToast(tt('沒有小藥水','No Small Potions')); return; }
  if(p.stamina >= p.staminaMax){ showToast(tt('體力已滿','Stamina is already full')); return; }
  p.professionItems.potion_small -= 1;
  p.stamina = Math.min(p.staminaMax, p.stamina + 20);
  await savePlayer(p);
  showToast(tt('🧪 已使用小藥水，體力 +20','🧪 Used a Small Potion, +20 stamina'));
  render();
}

  const meta = PET_LOCATION_META[locationKey];

  const rarityOk = req.petRarity ? (!!pet && pet.rarity === req.petRarity) : true;
  return (farmOk || starOk) && rarityOk;
}
function petLocationUnlockHint(locationKey){

  if(req.petRarity) text += tt(`（且出戰寵物需為${petRarityLabel(req.petRarity)}）`, ` (active pet must also be ${petRarityLabel(req.petRarity)})`);

}

async function loadPetConfig(){
  try{
    const r = await storage.get('config:pet_hunt');
    if(!r) return;
    const s = JSON.parse(r.value);
    const pick = (val, fallback, min=0)=> (typeof val==='number' && !isNaN(val) && val>=min) ? val : fallback;
    PET_EGG_GROW_MS = pick(s.eggGrowMs, DEFAULT_PET_EGG_GROW_MS, 1000);
    PET_EGG_MATERIAL_COST = pick(s.eggMaterialCost, DEFAULT_PET_EGG_MATERIAL_COST, 1);
    PET_SWAP_COST = pick(s.swapCost, DEFAULT_PET_SWAP_COST, 0);
    PET_BONUS_EGG_CHANCE = pick(s.bonusEggChance, DEFAULT_PET_BONUS_EGG_CHANCE, 0);
    if(s.rarityBaseWeight && typeof s.rarityBaseWeight === 'object'){
      PET_RARITY_IDS.forEach(id=>{ PET_RARITY_BASE_WEIGHT[id] = pick(s.rarityBaseWeight[id], DEFAULT_PET_RARITY_BASE_WEIGHT[id], 0); });
    }
    if(s.rarityLevelBonus && typeof s.rarityLevelBonus === 'object'){
      ['rare','epic'].forEach(id=>{ PET_RARITY_LEVEL_BONUS[id] = pick(s.rarityLevelBonus[id], DEFAULT_PET_RARITY_LEVEL_BONUS[id], 0); });
    }
    if(s.durationRewards && typeof s.durationRewards === 'object'){
      PET_DURATION_KEYS.forEach(key=>{
        const dv = DEFAULT_PET_DURATION_REWARDS[key];
        const sv = (s.durationRewards[key]) || {};
        const range2 = (val, fallback)=> (Array.isArray(val) && val.length===2 && val.every(n=>typeof n==='number' && !isNaN(n) && n>=0)) ? [val[0], val[1]] : [...fallback];
        PET_DURATION_REWARDS[key] = {
          coin: range2(sv.coin, dv.coin),
          essence: range2(sv.essence, dv.essence),
          material: range2(sv.material, dv.material),
        };
      });
    }
    if(s.rareLootChance && typeof s.rareLootChance === 'object'){
      PET_DURATION_KEYS.forEach(key=>{ PET_RARE_LOOT_CHANCE[key] = pick(s.rareLootChance[key], DEFAULT_PET_RARE_LOOT_CHANCE[key], 0); });
    }
  }catch(e){ /* keep defaults */ }
}
async function savePetConfig(){
  await storage.set('config:pet_hunt', JSON.stringify({
    eggGrowMs: PET_EGG_GROW_MS,
    eggMaterialCost: PET_EGG_MATERIAL_COST,
    swapCost: PET_SWAP_COST,
    bonusEggChance: PET_BONUS_EGG_CHANCE,
    rarityBaseWeight: PET_RARITY_BASE_WEIGHT,
    rarityLevelBonus: PET_RARITY_LEVEL_BONUS,
    durationRewards: PET_DURATION_REWARDS,
    rareLootChance: PET_RARE_LOOT_CHANCE,
  }));
}

function ensurePets(p){
  if(!Array.isArray(p.pets)) p.pets = [];
  p.pets.forEach(pet=>{
    // 舊資料相容：原本是餵食材料升「等級」，改版後統一用合成升「星」。
    if(typeof pet.star !== 'number' || pet.star < 1) pet.star = 1;
    if(pet.star > PET_STAR_MAX) pet.star = PET_STAR_MAX;
    if(!PET_ELEMENT_IDS.includes(pet.element)) pet.element = 'herb';
    if(!PET_RARITY_IDS.includes(pet.rarity)) pet.rarity = 'common';
  });
  if(p.petActiveId === undefined) p.petActiveId = null;
  if(p.petActiveId && !p.pets.some(pet=>pet.id===p.petActiveId)) p.petActiveId = null;
  if(!p.petNest || typeof p.petNest !== 'object') p.petNest = {element:null, plantedAt:null, readyAt:null};
  // 舊資料相容：原本尋寶只有單一 p.petHunt 物件（出戰寵物兼尋寶），改版後拆成
  // 出戰寵物（petActiveId，功能不變）＋多個尋寶派遣格（p.petHunts 陣列）。
  // 若偵測到舊格式且當時正在尋寶中，搬進 slot 0、地點一律當作古道結算（無門檻，安全預設），
  // 確保沒有人會因為這次更新卡在無法領獎的狀態。
  if(!Array.isArray(p.petHunts)){
    const migrated = [];
    for(let i=0;i<PET_HUNT_SLOT_COUNT;i++) migrated.push({slotId:i, active:false, locationKey:null, durationKey:null, startAt:null, readyAt:null, petId:null, helpLog:{}});
    if(p.petHunt && typeof p.petHunt === 'object' && p.petHunt.active){
      migrated[0] = {slotId:0, active:true, locationKey:'trail', durationKey:p.petHunt.durationKey, startAt:p.petHunt.startAt, readyAt:p.petHunt.readyAt, petId:p.petHunt.petId, helpLog:{}};
    }
    p.petHunts = migrated;
    delete p.petHunt;
  }
  while(p.petHunts.length < PET_HUNT_SLOT_COUNT) p.petHunts.push({slotId:p.petHunts.length, active:false, locationKey:null, durationKey:null, startAt:null, readyAt:null, petId:null, helpLog:{}});
  p.petHunts.forEach((slot, i)=>{
    if(typeof slot.slotId !== 'number') slot.slotId = i;
    if(slot.active && !PET_LOCATION_KEYS.includes(slot.locationKey)) slot.locationKey = 'trail';
    if(!slot.helpLog || typeof slot.helpLog !== 'object') slot.helpLog = {}; // 舊資料相容：補上好友加速紀錄欄位
  });
  return p;
}
function isPetHunting(p, petId){ return p.petHunts.some(h=>h.active && h.petId===petId); }
function petElementLabel(id){ const m = PET_ELEMENT_META[id]; return m ? tt(m.labelZh, m.labelEn) : id; }
function petRarityLabel(id){ const m = PET_RARITY_META[id]; return m ? tt(m.labelZh, m.labelEn) : id; }
function petDurationLabel(key){ const m = PET_DURATION_META[key]; return m ? tt(m.labelZh, m.labelEn) : key; }
function getActivePet(p){ ensurePets(p); return p.pets.find(pet=>pet.id===p.petActiveId) || null; }
// 每星效果線性疊加，從 ★1（起始）算起，★5 封頂共疊加 4 星：
// 尋寶時間縮短 -4.5%/星（封頂 -18%）、獎勵倍率 +11.25%/星（封頂 +45%）、稀有掉落機率 +3.375%/星（封頂 +13.5%）
// （封頂數值與改版前的 Lv.10 系統一致，只是把 9 級的成長曲線換算成 4 星）
function petEffects(pet){
  if(!pet) return {durationReduction:0, rewardMult:1, rareChanceBonus:0};
  const steps = Math.max(0, (pet.star||1) - 1);
  return {
    durationReduction: Math.min(0.18, steps*0.045),
    rewardMult: 1 + Math.min(0.45, steps*0.1125),
    rareChanceBonus: Math.min(0.135, steps*0.03375),
  };
}
function createPet(elementId, rarity){
  return {id: uid(), element: elementId, rarity, star: 1, createdAt: Date.now()};
}
function rollPetRarity(gardenLevel){
  const lv = gardenLevel || 0;
  const bonusRare = Math.min(60, lv * PET_RARITY_LEVEL_BONUS.rare);
  const bonusEpic = Math.min(60, lv * PET_RARITY_LEVEL_BONUS.epic);
  const weights = {
    epic: PET_RARITY_BASE_WEIGHT.epic + bonusEpic,
    rare: PET_RARITY_BASE_WEIGHT.rare + bonusRare,
    common: Math.max(1, PET_RARITY_BASE_WEIGHT.common - bonusRare - bonusEpic),
  };
  const total = weights.common + weights.rare + weights.epic;
  let r = Math.random()*total;
  for(const id of ['epic','rare','common']){
    if(r < weights[id]) return id;
    r -= weights[id];
  }
  return 'common';
}

async function plantPetEgg(elementId){
  const p = state.player;
  if(!p) return;
  ensurePets(p); ensureProfession(p);
  if(!PET_ELEMENT_IDS.includes(elementId)) return;
  if(p.petNest.plantedAt){ showToast(tt('巢裡已經有一顆蛋了','Your nest already has an egg')); return; }
  if((p.professionMaterials[elementId]||0) < PET_EGG_MATERIAL_COST){
    showToast(tt(`材料不足，種蛋需要 ${PET_ELEMENT_META[elementId].icon} × ${PET_EGG_MATERIAL_COST}`, `Not enough material - planting needs ${PET_ELEMENT_META[elementId].icon} × ${PET_EGG_MATERIAL_COST}`));
    return;
  }
  p.professionMaterials[elementId] = Math.max(0, p.professionMaterials[elementId] - PET_EGG_MATERIAL_COST);
  const now = Date.now();
  p.petNest = {element: elementId, plantedAt: now, readyAt: now + PET_EGG_GROW_MS};
  await savePlayer(p);
  showToast(tt('🥚 已在寵物巢種下一顆蛋','🥚 Planted a pet egg in the nest'));
  renderTab();
}
async function collectPetEgg(){
  const p = state.player;
  if(!p) return;
  ensurePets(p);
  const nest = p.petNest;
  if(!nest.plantedAt){ showToast(tt('巢裡沒有蛋','No egg in the nest')); return; }
  if(Date.now() < nest.readyAt){ showToast(tt('蛋還沒孵化好','The egg is not ready yet')); return; }
  const rarity = rollPetRarity(p.farmLevel||0);
  const pet = createPet(nest.element, rarity);
  p.pets.push(pet);
  if(!p.petActiveId) p.petActiveId = pet.id;
  p.petNest = {element:null, plantedAt:null, readyAt:null};
  await savePlayer(p);
  showToast(tt(`🐣 孵化成功！獲得 ${PET_ELEMENT_META[pet.element].icon} ${petRarityLabel(rarity)}寵物`, `🐣 Hatched! Got a ${petRarityLabel(rarity)} ${PET_ELEMENT_META[pet.element].icon} pet`));
  renderTab();
}
async function setActivePet(petId){
  const p = state.player;
  if(!p) return;
  ensurePets(p);
  if(p.petActiveId === petId) return;
  const pet = p.pets.find(pt=>pt.id===petId);
  if(!pet) return;
  if(p.petActiveId){
    if((p.coins||0) < PET_SWAP_COST){
      showToast(tt(`金幣不足，更換出戰寵物需要 ✦${PET_SWAP_COST}`, `Not enough coins - switching pets costs ✦${PET_SWAP_COST}`));
      return;
    }
    if(!confirm(tt(`確定要花費 ✦${PET_SWAP_COST} 更換出戰寵物嗎？（換下場的寵物等級與經驗會保留）`, `Switch active pet for ✦${PET_SWAP_COST}? (The pet you swap out keeps its level/exp)`))) return;
    p.coins -= PET_SWAP_COST;
  }
  p.petActiveId = petId;
  await savePlayer(p);
  showToast(tt('已更換出戰寵物','Active pet switched'));
  renderTab();
}
// 合成升星面板狀態：目前展開中的目標寵物 id，以及已勾選的素材寵物 id 集合。
// 素材＝與目標寵物「同名」（同屬性＋同稀有度＋同星級）的其他寵物，出戰中／尋寶中的寵物不可被選為素材。
let petSynthesisOpenId = null;
let petSynthesisSelected = new Set();

function petSynthesisEligibleMaterials(p, pet){
  return p.pets.filter(pt=>
    pt.id !== pet.id &&
    pt.element === pet.element &&
    pt.rarity === pet.rarity &&
    pt.star === pet.star &&
    pt.id !== p.petActiveId &&
    !isPetHunting(p, pt.id)
  );
}

function togglePetSynthesisPanel(petId){
  petSynthesisOpenId = (petSynthesisOpenId === petId) ? null : petId;
  petSynthesisSelected = new Set();
  renderTab();
}

function togglePetSynthesisMaterial(petId, materialId, required){
  if(petSynthesisSelected.has(materialId)){
    petSynthesisSelected.delete(materialId);
  } else {
    if(petSynthesisSelected.size >= required) return; // 已達所需數量，忽略多選
    petSynthesisSelected.add(materialId);
  }
  renderTab();
}

async function synthesizePet(petId){
  const p = state.player;
  if(!p) return;
  ensurePets(p);
  const pet = p.pets.find(pt=>pt.id===petId);
  if(!pet) return;
  if(isPetFullyMaxed(pet)){ showToast(tt('這隻寵物已經是最高星級與最高品質了，無法再合成','This pet is already max star and max quality')); return; }
  // 每次固定用 1 隻同名（同屬性＋同稀有度＋同星級）素材，跟目標寵物本身合併（共消耗 2 隻）。
  const required = 1;
  const eligible = petSynthesisEligibleMaterials(p, pet);
  const eligibleIds = new Set(eligible.map(pt=>pt.id));
  const chosenIds = Array.from(petSynthesisSelected).filter(id=>eligibleIds.has(id));
  if(chosenIds.length < required){
    showToast(tt('請選擇 1 隻同名（同屬性、同稀有度、同星級）的寵物來合併', 'Please select 1 matching pet (same element, rarity, and star) to merge'));
    return;
  }
  const isBreakthrough = pet.star >= PET_STAR_MAX; // 滿星再合併＝品質突破，不是繼續升星
  const nextRarity = isBreakthrough ? petNextRarity(pet.rarity) : null;
  if(isBreakthrough && !nextRarity){
    showToast(tt('已經是最高品質，無法再突破','Already max quality - cannot upgrade further'));
    return;
  }
  const confirmMsg = isBreakthrough
    ? tt(`確定要用 2 隻 ★${PET_STAR_MAX} ${petRarityLabel(pet.rarity)}寵物合併，突破品質為「${petRarityLabel(nextRarity)}」（星級歸零為 ★1）嗎？保證成功，此動作無法復原。`,
         `Merge 2 ★${PET_STAR_MAX} ${petRarityLabel(pet.rarity)} pets to upgrade quality to "${petRarityLabel(nextRarity)}" (star resets to ★1)? Guaranteed success - this cannot be undone.`)
    : tt(`確定要用 2 隻 ★${pet.star} 同名寵物合併升到 ★${pet.star+1} 嗎？保證成功，此動作無法復原。`,
         `Merge 2 ★${pet.star} matching pets to reach ★${pet.star+1}? Guaranteed success - this cannot be undone.`);
  if(!confirm(confirmMsg)) return;
  const useIds = new Set(chosenIds.slice(0, required));
  p.pets = p.pets.filter(pt=>!useIds.has(pt.id));
  let resultMsg;
  if(isBreakthrough){
    pet.rarity = nextRarity;
    pet.star = 1;
    resultMsg = tt(`✨ 品質突破成功！寵物晉升為「${petRarityLabel(pet.rarity)}」★1`, `✨ Quality breakthrough succeeded! Pet is now ${petRarityLabel(pet.rarity)} ★1`);
  } else {
    pet.star += 1;
    resultMsg = tt(`✨ 合成成功！寵物升到 ★${pet.star}`, `✨ Synthesis succeeded! Pet is now ★${pet.star}`);
  }
  petSynthesisOpenId = null;
  petSynthesisSelected = new Set();
  await savePlayer(p);
  showToast(resultMsg);
  renderTab();
}
// 尋寶派遣格的「選擇中」草稿狀態（尚未正式派遣）：slotId -> {petId, locationKey}
// 選寵物 → 選地點 → 選時長 三步驟走完才會真正呼叫 startPetHunt 寫入 p.petHunts。
let petHuntDraft = {};
function petHuntAvailablePets(p){
  ensurePets(p);
  return p.pets.filter(pt=>!isPetHunting(p, pt.id));
}
function pickHuntPet(slotId, petId){
  petHuntDraft[slotId] = {petId, locationKey:null};
  renderTab();
}
function pickHuntLocation(slotId, locationKey){
  const p = state.player;
  if(!p || !petHuntDraft[slotId]) return;
  if(!isPetLocationUnlocked(p, locationKey)){
    const hint = petLocationUnlockHint(locationKey);
    showToast(tt(`${petLocationLabel(locationKey)}尚未解鎖，還差：${hint}`, `${petLocationLabel(locationKey)} isn't unlocked yet - need: ${hint}`));
    return;
  }
  petHuntDraft[slotId].locationKey = locationKey;
  renderTab();
}
function cancelHuntDraft(slotId){
  delete petHuntDraft[slotId];
  renderTab();
}
async function startPetHunt(slotId, durationKey){
  const p = state.player;
  if(!p) return;
  ensurePets(p);
  if(!PET_DURATION_KEYS.includes(durationKey)) return;
  const slot = p.petHunts[slotId];
  if(!slot || slot.active) return;
  const draft = petHuntDraft[slotId];
  if(!draft || !draft.petId || !draft.locationKey){ showToast(tt('請先選好寵物與地點','Pick a pet and a location first')); return; }
  const pet = p.pets.find(pt=>pt.id===draft.petId);
  if(!pet){ showToast(tt('請先選擇要派遣的寵物','Pick a pet to dispatch first')); return; }
  if(isPetHunting(p, pet.id)){ showToast(tt('這隻寵物已經在尋寶中了','This pet is already out on a hunt')); delete petHuntDraft[slotId]; renderTab(); return; }
  if(!isPetLocationUnlocked(p, draft.locationKey)){ showToast(tt('這個地點尚未解鎖','This location is not unlocked yet')); return; }
  const eff = petEffects(pet);
  const baseMs = PET_DURATION_META[durationKey].ms;
  const actualMs = Math.round(baseMs * (1 - eff.durationReduction));
  const now = Date.now();
  p.petHunts[slotId] = {slotId, active:true, locationKey:draft.locationKey, durationKey, startAt:now, readyAt:now+actualMs, petId:pet.id, helpLog:{}};
  delete petHuntDraft[slotId];
  await savePlayer(p);
  showToast(tt(`🧭 已派遣寵物前往${petLocationLabel(draft.locationKey)}尋寶（${petDurationLabel(durationKey)}）`, `🧭 Pet dispatched to ${petLocationLabel(draft.locationKey)} (${petDurationLabel(durationKey)})`));
  renderTab();
}
async function claimPetHunt(slotId){
  const p = state.player;
  if(!p) return;
  ensurePets(p); ensureProfession(p); ensureMaterials(p);
  const hunt = p.petHunts[slotId];
  if(!hunt || !hunt.active) return;
  if(Date.now() < hunt.readyAt){ showToast(tt('尋寶還沒結束','The hunt is not finished yet')); return; }
  const pet = p.pets.find(pt=>pt.id===hunt.petId) || getActivePet(p);
  const eff = petEffects(pet);
  const locMeta = PET_LOCATION_META[hunt.locationKey] || PET_LOCATION_META.trail;
  const cfg = PET_DURATION_REWARDS[hunt.durationKey] || DEFAULT_PET_DURATION_REWARDS['15m'];
  const roll = (range)=> Math.floor(range[0] + Math.random()*(range[1]-range[0]+1));
  let coin = roll(cfg.coin);
  let essence = roll(cfg.essence);
  let material = roll(cfg.material);
  // 屬性決定掉落偏向：草系偏藥草、礦系偏金幣礦石、木系偏骰子精華木料
  const element = pet ? pet.element : null;
  if(element === 'herb'){ material = Math.round(material*1.6); coin = Math.round(coin*0.6); essence = Math.round(essence*0.5); }
  else if(element === 'ore'){ coin = Math.round(coin*1.6); material = Math.round(material*0.8); essence = Math.round(essence*0.4); }
  else if(element === 'lumber'){ essence = Math.round(essence*1.6); material = Math.round(material*0.8); coin = Math.round(coin*0.5); }
  // 地點偏向（第三層乘數，疊在屬性偏向與星級加成之上）
  coin = Math.round(coin * eff.rewardMult * locMeta.rewardBias.coin);
  essence = Math.round(essence * eff.rewardMult * locMeta.rewardBias.essence);
  material = Math.round(material * eff.rewardMult * locMeta.rewardBias.material);
  const rareChance = (PET_RARE_LOOT_CHANCE[hunt.durationKey]||0) + eff.rareChanceBonus + locMeta.rareChanceBonus;
  const rareHit = Math.random() < rareChance;
  if(rareHit){ coin *= PET_RARE_LOOT_MULT; essence *= PET_RARE_LOOT_MULT; material *= PET_RARE_LOOT_MULT; }
  p.coins = (p.coins||0) + coin;
  p.materials.diceEssence = (p.materials.diceEssence||0) + essence;
  const materialId = element || PROFESSION_MATERIAL_IDS[Math.floor(Math.random()*PROFESSION_MATERIAL_IDS.length)];
  p.professionMaterials[materialId] = (p.professionMaterials[materialId]||0) + material;
  p.petHunts[slotId] = {slotId, active:false, locationKey:null, durationKey:null, startAt:null, readyAt:null, petId:null, helpLog:{}};
  await savePlayer(p);
  const matMeta = PET_ELEMENT_META[materialId];
  showToast(tt(
    `🎉 尋寶完成${rareHit?'（✨稀有掉落 x2！）':''}：✦${coin}、精華 × ${essence}、${matMeta.icon} × ${material}`,
    `🎉 Hunt complete${rareHit?' (✨Rare loot x2!)':''}: ✦${coin}, Essence × ${essence}, ${matMeta.icon} × ${material}`
  ));
  renderTab();
}

    html += `</div>`;
  }
  html += `</div>`;

  return html;
}
function petHuntSlotHtml(p, slot, now){
  const slotId = slot.slotId;
  if(slot.active){
    const pet = p.pets.find(pt=>pt.id===slot.petId);
    const meta = pet ? PET_ELEMENT_META[pet.element] : null;
    const locMeta = PET_LOCATION_META[slot.locationKey] || PET_LOCATION_META.trail;
    const ready = now >= slot.readyAt;
    return `<div class="farm-upgrade-box">
      <div class="farm-upgrade-title">${locMeta.icon} ${petLocationLabel(slot.locationKey)} · ${petDurationLabel(slot.durationKey)}</div>
      <div class="farm-upgrade-line" style="color:var(--muted);font-size:12px;">${pet ? `${meta.icon} ${petRarityLabel(pet.rarity)}${petElementLabel(pet.element)} · ${'★'.repeat(pet.star)}${'☆'.repeat(PET_STAR_MAX-pet.star)}` : tt('（寵物不見了？）','(pet missing?)')}</div>
      ${ready
        ? `<div class="farm-upgrade-line" style="color:var(--gold-bright);">${tt('✨ 尋寶完成，可以領取獎勵了！','✨ Hunt complete - claim your reward!')}</div>
           <button class="btn small" data-claim-hunt="${slotId}">${tt('領取','Claim')}</button>`
        : `<div class="countdown" id="pet-hunt-countdown-${slotId}">${tt('倒數：','Remaining: ')}${formatDuration(slot.readyAt-now)}</div>`
      }
    </div>`;
  }
  const draft = petHuntDraft[slotId];
  if(!draft || !draft.petId){
    const available = petHuntAvailablePets(p);
    let html = `<div class="farm-upgrade-box"><div class="farm-upgrade-title">${tt('空格','Empty slot')}</div>`;
    if(!available.length){
      html += `<p class="sub" style="margin:6px 0 0;">${tt('目前沒有可派遣的寵物（都在尋寶中，或還沒孵化）','No pets available to dispatch (all busy, or none hatched yet)')}</p>`;
    } else {
      html += `<div class="farm-upgrade-line" style="color:var(--muted);font-size:12px;margin-bottom:4px;">${tt('第一步：選擇要派遣的寵物','Step 1: choose a pet to dispatch')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">`;
      available.forEach(pet=>{
        const meta = PET_ELEMENT_META[pet.element];
        html += `<button class="btn small secondary" data-hunt-pick-pet="${slotId}|${pet.id}">${meta.icon} ${petRarityLabel(pet.rarity)}${petElementLabel(pet.element)} ${'★'.repeat(pet.star)}</button>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }
  const pet = p.pets.find(pt=>pt.id===draft.petId);
  if(!pet){ delete petHuntDraft[slotId]; return petHuntSlotHtml(p, slot, now); }
  const petMeta = PET_ELEMENT_META[pet.element];
  const petLine = `${petMeta.icon} ${petRarityLabel(pet.rarity)}${petElementLabel(pet.element)} · ${'★'.repeat(pet.star)}${'☆'.repeat(PET_STAR_MAX-pet.star)}`;
  if(!draft.locationKey){
    let html = `<div class="farm-upgrade-box"><div class="farm-upgrade-title">${petLine}</div>
      <div class="farm-upgrade-line" style="color:var(--muted);font-size:12px;margin-bottom:4px;">${tt('第二步：選擇尋寶地點','Step 2: choose a location')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">`;
    PET_LOCATION_KEYS.forEach(key=>{
      const meta = PET_LOCATION_META[key];
      const unlocked = isPetLocationUnlocked(p, key);
      html += `<button class="btn small ${unlocked?'secondary':''}" data-hunt-pick-loc="${slotId}|${key}" ${unlocked?'':'style="opacity:.6;"'}>${meta.icon} ${petLocationLabel(key)}${unlocked?'':' 🔒'}</button>`;
    });
    html += `</div>
      <button class="btn small secondary" style="margin-top:8px;" data-hunt-cancel="${slotId}">${tt('取消','Cancel')}</button>
    </div>`;
    return html;
  }
  const locMeta = PET_LOCATION_META[draft.locationKey];
  let html = `<div class="farm-upgrade-box"><div class="farm-upgrade-title">${petLine}</div>
    <div class="farm-upgrade-line" style="color:var(--muted);font-size:12px;margin-bottom:4px;">${locMeta.icon} ${petLocationLabel(draft.locationKey)} · ${tt('第三步：選擇派遣時長','Step 3: choose a duration')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">`;
  PET_DURATION_KEYS.forEach(key=>{
    html += `<button class="btn small" data-hunt-start="${slotId}|${key}">${petDurationLabel(key)}</button>`;
  });
  html += `</div>
    <button class="btn small secondary" style="margin-top:8px;" data-hunt-cancel="${slotId}">${tt('取消','Cancel')}</button>
  </div>`;
  return html;
}
function petSynthesisPanelHtml(p, pet){
  const required = 1; // 固定選 1 隻同名（同屬性＋同稀有度＋同星級）素材，跟目標寵物本身合併（共消耗 2 隻）
  const isBreakthrough = pet.star >= PET_STAR_MAX;
  const nextRarity = isBreakthrough ? petNextRarity(pet.rarity) : null;
  const eligible = petSynthesisEligibleMaterials(p, pet);
  const selectedCount = Array.from(petSynthesisSelected).filter(id=>eligible.some(pt=>pt.id===id)).length;
  const canConfirm = selectedCount >= required;
  let html = `<div class="farm-upgrade-box" style="margin-top:8px;background:var(--bg-panel-raised);">
    <div class="farm-upgrade-line" style="color:var(--cream);">${tt('合成素材：勾選 1 隻同名（同屬性、同稀有度、同星級）寵物','Synthesis material: select 1 matching pet (same element, rarity, and star)')}（<span style="color:${canConfirm?'var(--gold-bright)':'var(--danger)'};">${selectedCount}/${required}</span>）</div>
    <div class="farm-upgrade-line" style="color:var(--muted);font-size:12px;">${isBreakthrough
      ? tt(`兩隻 ★${PET_STAR_MAX} 合併會突破品質為「${petRarityLabel(nextRarity)}」，星級歸零為 ★1，保證成功`, `Merging two ★${PET_STAR_MAX} pets upgrades quality to "${petRarityLabel(nextRarity)}" and resets star to ★1 - guaranteed success`)
      : tt(`兩隻 ★${pet.star} 合併升到 ★${pet.star+1}，保證成功`, `Merging two ★${pet.star} pets reaches ★${pet.star+1} - guaranteed success`)
    }</div>`;
  if(!eligible.length){
    html += `<p class="sub" style="margin:8px 0 0;">${tt('目前沒有可用的同名寵物（需同屬性＋同稀有度＋同星級，且不在出戰／尋寶中）','No matching pets available (needs same element + rarity + star, and must not be active or on a hunt)')}</p>`;
  } else {
    html += `<div style="display:flex;flex-direction:column;gap:4px;margin-top:8px;">`;
    eligible.forEach(mat=>{
      const checked = petSynthesisSelected.has(mat.id);
      const matStar = '★'.repeat(mat.star) + '☆'.repeat(PET_STAR_MAX-mat.star);
      html += `<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
        <input type="checkbox" data-synth-toggle="${pet.id}|${mat.id}|${required}" ${checked?'checked':''} />
        ${PET_ELEMENT_META[mat.element].icon} ${petRarityLabel(mat.rarity)}${petElementLabel(mat.element)} · ${matStar}
      </label>`;
    });
    html += `</div>`;
  }
  html += `<div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn small ${canConfirm?'':'secondary'}" data-synth-confirm="${pet.id}" ${canConfirm?'':'disabled'}>${tt('確認合成','Confirm Synthesis')}</button>
      <button class="btn small secondary" data-open-synth="${pet.id}">${tt('取消','Cancel')}</button>
    </div>
  </div>`;
  return html;
}
function wirePetEvents(){
  document.querySelectorAll('[data-plant-egg]').forEach(btn=>{ btn.onclick = ()=>plantPetEgg(btn.dataset.plantEgg); });
  const collectBtn = document.getElementById('pet-collect-btn');
  if(collectBtn) collectBtn.onclick = collectPetEgg;
  document.querySelectorAll('[data-hunt-pick-pet]').forEach(btn=>{
    btn.onclick = ()=>{ const [slotId, petId] = btn.dataset.huntPickPet.split('|'); pickHuntPet(parseInt(slotId,10), petId); };
  });
  document.querySelectorAll('[data-hunt-pick-loc]').forEach(btn=>{
    btn.onclick = ()=>{ const [slotId, locKey] = btn.dataset.huntPickLoc.split('|'); pickHuntLocation(parseInt(slotId,10), locKey); };
  });
  document.querySelectorAll('[data-hunt-cancel]').forEach(btn=>{ btn.onclick = ()=>cancelHuntDraft(parseInt(btn.dataset.huntCancel,10)); });
  document.querySelectorAll('[data-hunt-start]').forEach(btn=>{
    btn.onclick = ()=>{ const [slotId, durationKey] = btn.dataset.huntStart.split('|'); startPetHunt(parseInt(slotId,10), durationKey); };
  });
  document.querySelectorAll('[data-claim-hunt]').forEach(btn=>{ btn.onclick = ()=>claimPetHunt(parseInt(btn.dataset.claimHunt,10)); });
  const petHelpAllBtn = document.getElementById('pet-help-all-btn');
  if(petHelpAllBtn) petHelpAllBtn.onclick = helpAllFriendsPetHunts;
  document.querySelectorAll('[data-set-active]').forEach(btn=>{ btn.onclick = ()=>setActivePet(btn.dataset.setActive); });
  document.querySelectorAll('[data-open-synth]').forEach(btn=>{ btn.onclick = ()=>togglePetSynthesisPanel(btn.dataset.openSynth); });
  document.querySelectorAll('[data-synth-toggle]').forEach(input=>{
    input.onchange = ()=>{
      const [petId, materialId, required] = input.dataset.synthToggle.split('|');
      togglePetSynthesisMaterial(petId, materialId, parseInt(required, 10));
    };
  });
  document.querySelectorAll('[data-synth-confirm]').forEach(btn=>{ btn.onclick = ()=>synthesizePet(btn.dataset.synthConfirm); });
}

// 行星圈：太陽/月亮/火星/木星/金星/水星，各 3 節點。沿用貢獻點與星座節點同一套

const STAR_CHART_PLANET_NODES = Object.keys(STAR_CHART_PLANET_DEFS).flatMap(key=>{

async function loadStarChartConfig(){
  try{
    const r = await storage.get(seasonKey('starchart'));
    if(r){
      const s = JSON.parse(r.value);
      if(Array.isArray(s.costTiers) && s.costTiers.length===3) STAR_CHART_COST_TIERS = s.costTiers;
      if(s.bonusPerNode) ['fire','wind','water','earth'].forEach(e=>{ if(typeof s.bonusPerNode[e]==='number' && s.bonusPerNode[e]>=0) STAR_CHART_BONUS_PER_NODE[e] = s.bonusPerNode[e]; });
    }
  }catch(e){ /* keep defaults */ }
}
async function saveStarChartConfig(){
  await storage.set(seasonKey('starchart'), JSON.stringify({costTiers: STAR_CHART_COST_TIERS, bonusPerNode: STAR_CHART_BONUS_PER_NODE}));
}
function starChartUnlockedCountByElement(p, element){
  ensureMaterials(p);
  return p.starChart.unlocked.filter(id=>STAR_CHART_ZODIAC_BY_ID[id] && STAR_CHART_ZODIAC_BY_ID[id].element===element).length;
}
function starChartNodeCost(p, element){
  const count = starChartUnlockedCountByElement(p, element);
  return STAR_CHART_COST_TIERS[Math.min(count, STAR_CHART_COST_TIERS.length-1)];
}
function starChartBonusPercent(p, element){
  ensureMaterials(p);
  return starChartUnlockedCountByElement(p, element) * (STAR_CHART_BONUS_PER_NODE[element]||0);
}
function starChartCoinMultiplier(p){ return 1 + starChartBonusPercent(p,'fire')/100; }
function starChartContribMultiplier(p){ return 1 + starChartBonusPercent(p,'wind')/100; }
function starChartGrowMsMultiplier(p){ return Math.max(0.1, 1 - starChartBonusPercent(p,'water')/100); }
function starChartYieldMultiplier(p){ return 1 + starChartBonusPercent(p,'earth')/100; }
function starChartAllZodiacUnlocked(p){
  ensureMaterials(p);
  return STAR_CHART_ZODIAC.every(z=>p.starChart.unlocked.includes(z.id));
}
function starChartUnlockedCountByPlanet(p, planet){
  ensureMaterials(p);
  return p.starChart.unlocked.filter(id=>{
    const n = STAR_CHART_PLANET_NODES.find(pn=>pn.id===id);
    return n && n.planet===planet;
  }).length;
}
function starChartPlanetNodeCost(p, planet){
  const count = starChartUnlockedCountByPlanet(p, planet);
  return STAR_CHART_COST_TIERS[Math.min(count, STAR_CHART_COST_TIERS.length-1)];
}
function starChartPlanetBonusPercent(p, planet){
  return starChartUnlockedCountByPlanet(p, planet) * (STAR_CHART_PLANET_DEFS[planet].bonusPerNode); // 百分點，固定值不受 GM 調整
}
function starChartSunDamageMultiplier(p){ return 1 + starChartPlanetBonusPercent(p,'sun')/100; } // Boss 傷害
function starChartMoonCritRateBonus(p){ return starChartPlanetBonusPercent(p,'moon')/100; } // Boss 暴擊率（0~1）
function starChartMarsSuccessBonus(p){ return starChartPlanetBonusPercent(p,'mars')/100; } // 遠征成功率（0~1）
function starChartJupiterRewardBonus(p){ return starChartPlanetBonusPercent(p,'jupiter')/100; } // 遠征獎勵區間（0~1）
function starChartVenusFeeReductionPct(p){ return starChartPlanetBonusPercent(p,'venus')/100; } // 拍賣行手續費減免（0~1，直接扣掉百分點）
function starChartMercuryDropChanceBonus(p){ return starChartPlanetBonusPercent(p,'mercury'); } // 百分點，+5%/節點封頂15%（35%→50%）
function starChartMercuryExtraQtyChance(p){ return starChartUnlockedCountByPlanet(p,'mercury') * STAR_CHART_MERCURY_EXTRA_QTY_CHANCE_PER_NODE; } // 0~1
async function unlockStarChartNode(zodiacId){
  const p = state.player;
  ensureMaterials(p);
  const z = STAR_CHART_ZODIAC_BY_ID[zodiacId];
  if(!z) return;
  if(p.starChart.unlocked.includes(zodiacId)){ showToast(tt('這個星座已經點亮了','This constellation is already lit')); return; }
  const cost = starChartNodeCost(p, z.element);
  if(p.materials.contrib < cost){ showToast(tt(`貢獻點不足，需要 ${cost}`, `Not enough contribution points, need ${cost}`)); return; }
  p.materials.contrib -= cost;
  p.starChart.unlocked.push(zodiacId);
  await savePlayer(p);
  render();
  showToast(tt(`✦ 點亮「${tt(z.label,z.labelEn)}」！`, `✦ Lit up "${z.labelEn}"!`));
}
async function unlockStarChartPlanetNode(nodeId){
  const p = state.player;
  ensureMaterials(p);
  const n = STAR_CHART_PLANET_NODES.find(pn=>pn.id===nodeId);
  if(!n) return;
  if(p.starChart.unlocked.includes(nodeId)){ showToast(tt('這個行星節點已經點亮了','This planet node is already lit')); return; }
  if(!starChartAllZodiacUnlocked(p)){ showToast(tt('要先點滿全部 12 星座才能解鎖行星圈','Light up all 12 zodiac nodes first to unlock the Planet Ring')); return; }
  const idx = STAR_CHART_PLANET_NODES.filter(pn=>pn.planet===n.planet).indexOf(n);
  const alreadyUnlocked = starChartUnlockedCountByPlanet(p, n.planet);
  if(idx !== alreadyUnlocked){ showToast(tt('要照順序點亮','Unlock in order')); return; }
  const cost = starChartPlanetNodeCost(p, n.planet);
  if(p.materials.contrib < cost){ showToast(tt(`貢獻點不足，需要 ${cost}`, `Not enough contribution points, need ${cost}`)); return; }
  p.materials.contrib -= cost;
  p.starChart.unlocked.push(nodeId);
  await savePlayer(p);
  render();
  showToast(tt(`✦ 點亮「${tt(n.label,n.labelEn)}」！`, `✦ Lit up "${n.labelEn}"!`));
}

function spawnBossMinion(cycle){
  const totalWeight = BOSS_MINION_TYPES.reduce((sum, m) => sum + m.weight, 0);
  let roll = Math.random() * totalWeight;
  let picked = BOSS_MINION_TYPES[BOSS_MINION_TYPES.length - 1];
  for(const m of BOSS_MINION_TYPES){
    if(roll < m.weight){ picked = m; break; }

  }
  const cycleGap = Math.max(0, (cycle||1) - 1);
  const scaledHp = Math.round(picked.hp * Math.pow(BOSS_DIFFICULTY_MULT, cycleGap * BOSS_MINION_HP_SCALE_RATE));
  return {typeId: picked.id, hp: scaledHp, maxHp: scaledHp};

let BOSS_EVENT_TRIGGER_CHANCE = DEFAULT_BOSS_EVENT_TRIGGER_CHANCE;
// 📈 事件卡難度曲線：Boss 血量每輪(cycle)複利成長（BOSS_DIFFICULTY_MULT），但玩家
// 傷害輸出沒有對應的複利成長，導致固定百分比的 debuff（迷霧 -30%、詛咒 +20%血量）
// 换算成「因此多打的絕對次數」在後期輪次會越滾越痛。這裡讓 buff（祝福/風暴）權重
// 隨輪數遞增、debuff/詛咒（curveDir:-1）權重隨輪數遞減，兩邊都夾在
// [BOSS_EVENT_CURVE_MIN_MULT, BOSS_EVENT_CURVE_MAX_MULT] 之間，不會完全歸零（維持風險）
// 也不會無限膨脹（維持刺激感），實際套用見 pickBossEvent。
const DEFAULT_BOSS_EVENT_CURVE_RATE = 0.15;     // 每輪偏移權重的比例
const DEFAULT_BOSS_EVENT_CURVE_MIN_MULT = 0.3;  // 權重偏移下限
const DEFAULT_BOSS_EVENT_CURVE_MAX_MULT = 2.0;  // 權重偏移上限
let BOSS_EVENT_CURVE_RATE = DEFAULT_BOSS_EVENT_CURVE_RATE;
let BOSS_EVENT_CURVE_MIN_MULT = DEFAULT_BOSS_EVENT_CURVE_MIN_MULT;
let BOSS_EVENT_CURVE_MAX_MULT = DEFAULT_BOSS_EVENT_CURVE_MAX_MULT;
const DEFAULT_BOSS_TREASURE_COINS = {min:50, max:120};
let BOSS_TREASURE_COINS = {...DEFAULT_BOSS_TREASURE_COINS};
// 💠 骰子精華獎勵（階段A）：每破一階固定發放，全破三階再加一筆通關加碼，兩者都乘上
// bossRewardMult(cycle)，跟金幣獎勵一樣「輪數越高獎勵越高」。
const DEFAULT_BOSS_STAGE_ESSENCE = 10;
let BOSS_STAGE_ESSENCE = DEFAULT_BOSS_STAGE_ESSENCE;
const DEFAULT_BOSS_CLEAR_ESSENCE_BONUS = 30;
let BOSS_CLEAR_ESSENCE_BONUS = DEFAULT_BOSS_CLEAR_ESSENCE_BONUS;
function bossCurrentStageEssence(cycle){ return Math.round(BOSS_STAGE_ESSENCE * bossRewardMult(cycle)); }
function bossCurrentClearEssence(cycle){ return Math.round(BOSS_CLEAR_ESSENCE_BONUS * bossRewardMult(cycle)); }
// 🎁 寶箱選擇（階段C）：金幣寶箱沿用 BOSS_TREASURE_COINS，另外新增精華寶箱與職業材料寶箱。
const DEFAULT_BOSS_CHEST_ESSENCE = {min:15, max:30};
let BOSS_CHEST_ESSENCE = {...DEFAULT_BOSS_CHEST_ESSENCE};
const DEFAULT_BOSS_CHEST_MATERIAL_QTY = {min:12, max:20};
let BOSS_CHEST_MATERIAL_QTY = {...DEFAULT_BOSS_CHEST_MATERIAL_QTY};
// 🎁 寶箱獨立判定機率：跟祝福/風暴/詛咒/迷霧的 BOSS_EVENT_TRIGGER_CHANCE 分開算，
// 不佔用那 4 張卡的權重池（見 pickBossEvent 已排除 treasure），單純每次換階
// 就直接骰一次「要不要出寶箱」。
const DEFAULT_BOSS_CHEST_TRIGGER_CHANCE = 0.30;
let BOSS_CHEST_TRIGGER_CHANCE = DEFAULT_BOSS_CHEST_TRIGGER_CHANCE;

// 依 BOSS_EVENT_TYPES 的 weight 權重（套用難度曲線後）抽一張事件卡（寶箱已獨立
// 判定，這裡排除在外，只在祝福/風暴/詛咒/迷霧之間抽）。
function pickBossEvent(cycle){
  const pool = BOSS_EVENT_TYPES.filter(e => e.id !== 'treasure');
  const cycleGap = Math.max(0, (cycle||1) - 1);
  const weighted = pool.map(e => {
    const dir = e.curveDir || 0;
    const curveMult = Math.max(BOSS_EVENT_CURVE_MIN_MULT, Math.min(BOSS_EVENT_CURVE_MAX_MULT, 1 + dir * BOSS_EVENT_CURVE_RATE * cycleGap));
    return {event: e, adjustedWeight: e.weight * curveMult};
  });
  const totalWeight = weighted.reduce((sum, w) => sum + w.adjustedWeight, 0);
  let roll = Math.random() * totalWeight;
  let picked = weighted[weighted.length - 1].event;
  for(const w of weighted){
    if(roll < w.adjustedWeight){ picked = w.event; break; }
    roll -= w.adjustedWeight;
  }
  return picked;
}
// 換階/換輪時呼叫：寶箱獨立判定（BOSS_CHEST_TRIGGER_CHANCE），觸發就直接標記待開啟、

// 祝福/風暴/詛咒/迷霧其中一張。直接就地修改傳入的 newBoss（清掉舊事件、寫入新的
// activeEvent 或套用詛咒血量）。回傳值給呼叫端（resolveBossAttack → performBossAttack）
// 用來顯示訊息/發放寶箱與詛咒補償；buff/debuff 卡不需要額外發獎，回傳 {id, kind} 純粹供顯示用。
function maybeTriggerBossEvent(newBoss){
  newBoss.activeEvent = null; // 進新階段一律先清掉上一階殘留的事件效果，同時間只會有一張事件卡生效
  const treasureMeta = BOSS_EVENT_TYPES.find(e => e.id === 'treasure');
  if(Math.random() < BOSS_CHEST_TRIGGER_CHANCE){
    // 階段C：不再當場自動決定獎勵，改成標記「待開啟」，由玩家在 Boss 分頁 3 選 1
    // （金幣／骰子精華／職業材料），實際發放走 resolveBossChestChoice。
    newBoss.pendingChest = true;
    return {id: 'treasure', kind: treasureMeta ? treasureMeta.kind : 'instant'};
  }
  if(Math.random() >= BOSS_EVENT_TRIGGER_CHANCE) return null;
  const ev = pickBossEvent(newBoss.cycle);
  if(ev.kind === 'buff' || ev.kind === 'debuff'){
    newBoss.activeEvent = {id: ev.id, hitsLeft: ev.hits, value: ev.value || 0};
    return {id: ev.id, kind: ev.kind};
  }
  if(ev.id === 'curse'){
    const bonusHp = Math.round(newBoss.maxHp * (ev.value || 0.20));
    newBoss.maxHp += bonusHp;
    newBoss.hp += bonusHp;
    const coins = Math.round((BOSS_TREASURE_COINS.min + BOSS_TREASURE_COINS.max) / 4); // 詛咒補償：約寶箱金幣量的一半
    return {id: ev.id, kind: ev.kind, coins, bonusHp};
  }
  return null;
}

    if(r){
      const s = JSON.parse(r.value);
      if(typeof s.comboStreakBonusPerHit === 'number' && s.comboStreakBonusPerHit >= 0) BOSS_COMBO_STREAK_BONUS_PER_HIT = s.comboStreakBonusPerHit;
      if(typeof s.comboStreakCap === 'number' && s.comboStreakCap >= 0) BOSS_COMBO_STREAK_CAP = s.comboStreakCap;
      if(typeof s.minionSpawnChance === 'number' && s.minionSpawnChance >= 0 && s.minionSpawnChance <= 1) BOSS_MINION_SPAWN_CHANCE = s.minionSpawnChance;
      if(typeof s.minionHpScaleRate === 'number' && s.minionHpScaleRate >= 0) BOSS_MINION_HP_SCALE_RATE = s.minionHpScaleRate;
      if(typeof s.eventTriggerChance === 'number' && s.eventTriggerChance >= 0 && s.eventTriggerChance <= 1) BOSS_EVENT_TRIGGER_CHANCE = s.eventTriggerChance;
      if(typeof s.eventCurveRate === 'number' && s.eventCurveRate >= 0) BOSS_EVENT_CURVE_RATE = s.eventCurveRate;
      if(typeof s.eventCurveMinMult === 'number' && s.eventCurveMinMult >= 0) BOSS_EVENT_CURVE_MIN_MULT = s.eventCurveMinMult;
      if(typeof s.eventCurveMaxMult === 'number' && s.eventCurveMaxMult >= 0) BOSS_EVENT_CURVE_MAX_MULT = s.eventCurveMaxMult;
      if(s.treasureCoins) BOSS_TREASURE_COINS = s.treasureCoins;
      if(typeof s.stageEssence === 'number' && s.stageEssence >= 0) BOSS_STAGE_ESSENCE = s.stageEssence;
      if(typeof s.clearEssenceBonus === 'number' && s.clearEssenceBonus >= 0) BOSS_CLEAR_ESSENCE_BONUS = s.clearEssenceBonus;
      if(s.chestEssence) BOSS_CHEST_ESSENCE = s.chestEssence;
      if(s.chestMaterialQty) BOSS_CHEST_MATERIAL_QTY = s.chestMaterialQty;
      if(typeof s.chestTriggerChance === 'number' && s.chestTriggerChance >= 0 && s.chestTriggerChance <= 1) BOSS_CHEST_TRIGGER_CHANCE = s.chestTriggerChance;
    }
  }catch(e){ /* keep defaults */ }
}
