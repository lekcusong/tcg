      const ownedLine = `<div class="who" style="opacity:0.75;">${tt(`你另外擁有 ${ownedQty} 個`, `You also own: ${ownedQty}`)}</div>`;
      const detailsBlockHtml = info.detailsHtml ? `<details class="bid-history" open><summary>${tt('詳細屬性','Details')}</summary>${info.detailsHtml}</details>` : '';
      return `<div class="listing">
        <div class="left">
          ${info.iconHtml}
          <div class="meta"><div>${info.name}</div><div class="who">${statusLine}</div>${ownedLine}${biddersHtml}${detailsBlockHtml}</div>
        </div>
        <div class="right">
          <span class="timer">${fmtCountdown(a.endsAt - Date.now())}</span>
          ${!a.currentBidder ? `<button class="btn small secondary" data-cancel-auction="${a.id}">${tt('取消','Cancel')}</button>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  html += `<div class="panel">
    <h2>${t('publicAuctionsHeader')}</h2>
    ${otherAuctions.length===0 ? `<div class="empty-note">${tt('目前沒有進行中的拍賣','No active auctions right now')}</div>` : otherAuctions.map(a=>{
      const info = auctionDisplayInfo(a);
      const minBid = a.currentBid > 0 ? a.currentBid+1 : a.startBid;
      const sellerLine = tt(`掛賣者：${escapeHtml(a.seller)}`, `Listed by ${escapeHtml(a.seller)}`);
      const priceLine = a.currentBidder
        ? tt(`目前出價 ✦${a.currentBid} by ${escapeHtml(a.currentBidder)}`, `Current bid ✦${a.currentBid} by ${escapeHtml(a.currentBidder)}`)
        : a.startBid ? tt(`起標 ✦${a.startBid}`, `Start ✦${a.startBid}`) : tt(`固定價格上架`, `Fixed price listing`);
      const bidders = (a.bidHistory||[]).slice().reverse();
      const biddersHtml = bidders.length ? `<details class="bid-history"><summary>${tt(`出價紀錄（${bidders.length}）`, `Bid history (${bidders.length})`)}</summary>${bidders.map(b=>`<div class="bid-row">${escapeHtml(b.bidder)} — ✦${b.amount}</div>`).join('')}</details>` : '';
      const ownedQty = auctionOwnedQty(state.player, a.itemType, a.itemId);
      const ownedLine = `<div class="who" style="opacity:0.75;">${tt(`你目前擁有 ${ownedQty} 個`, `You currently own: ${ownedQty}`)}</div>`;
      const detailsBlockHtml = info.detailsHtml ? `<details class="bid-history" open><summary>${tt('詳細屬性','Details')}</summary>${info.detailsHtml}</details>` : '';
      return `<div class="listing">
        <div class="left">
          ${info.iconHtml}
          <div class="meta"><div>${info.name}</div><div class="who">${sellerLine} · ${priceLine} · <span class="timer">${fmtCountdown(a.endsAt-Date.now())}</span></div>${ownedLine}${biddersHtml}${detailsBlockHtml}</div>
        </div>
        <div class="right">
          ${a.startBid ? `
            <input type="number" min="${minBid}" placeholder="${minBid}" style="width:80px;" data-bid-input="${a.id}" />
            <button class="btn small" data-bid-btn="${a.id}">${tt('出價','Bid')}</button>
          ` : ''}
          ${a.buyoutPrice ? `<button class="btn small" data-buyout-btn="${a.id}">${tt(`直接購買 ✦${a.buyoutPrice}`, `Buy Now ✦${a.buyoutPrice}`)}</button>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  html += `<div class="panel">
    <h2>📥 ${t('createWtbHeader')}</h2>
    <p class="sub">${tt('指定卡片並開出收購單價與數量，金幣會先鎖定；其他占卜師可以直接把手上的卡賣給你。','Pick a card and set a price per card and quantity - coins are locked up front, and other diviners can sell that card straight to you.')}</p>
    <div class="form-row">
      <div><label>${tt('選擇卡片','Choose card')}</label><select id="wtb-card-select">${allCardOptions()}</select></div>
      <div><label>${tt('收購單價','Price per card')}</label><input type="number" id="wtb-price-input" min="1" style="width:110px;" /></div>
      <div><label>${tt('收購數量','Quantity')}</label><input type="number" id="wtb-qty-input" min="1" value="1" style="width:90px;" /></div>
      <div><label>${tt('求購時長','Duration')}</label><select id="wtb-dur-select">${DURATIONS.map((d,i)=>`<option value="${i}">${tt(d.labelZh, d.labelEn)}</option>`).join('')}</select></div>
      <button class="btn" id="wtb-create-btn">${tt('建立求購','Create Buy Order')}</button>
    </div>
  </div>`;

  html += `<div class="panel">
    <h2>${t('myWtbHeader')}</h2>
    ${myWtb.length===0 ? `<div class="empty-note">${tt('尚未建立任何求購單','No buy orders created yet')}</div>` : myWtb.map(o=>{
      const c = DECK_BY_ID[o.cardId];
      const statusLine = tt(`收購 ✦${o.pricePerCard}/張 · 剩餘 ${o.remaining}/${o.quantity} 張`, `✦${o.pricePerCard}/card · ${o.remaining}/${o.quantity} left`);
      return `<div class="listing">
        <div class="left">
          <div class="icon-box cf-${c.rarity}">${iconBoxInner(c)}</div>
          <div class="meta"><div>${c.name}</div><div class="who">${statusLine}</div></div>
        </div>
        <div class="right">
          <span class="timer">${fmtCountdown(o.endsAt - Date.now())}</span>
          <button class="btn small secondary" data-cancel-wtb="${o.id}">${tt('取消','Cancel')}</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  html += `<div class="panel">
    <h2>${t('publicWtbHeader')}</h2>
    ${otherWtb.length===0 ? `<div class="empty-note">${tt('目前沒有進行中的求購','No active buy orders right now')}</div>` : otherWtb.map(o=>{
      const c = DECK_BY_ID[o.cardId];
      const ownedQty = state.player.cards[o.cardId] || 0;
      const maxSell = Math.min(ownedQty, o.remaining);
      const priceLine = tt(`收購 ✦${o.pricePerCard}/張 by ${escapeHtml(o.buyer)} · 剩餘 ${o.remaining}/${o.quantity} 張`, `✦${o.pricePerCard}/card by ${escapeHtml(o.buyer)} · ${o.remaining}/${o.quantity} left`);
      return `<div class="listing">
        <div class="left">
          <div class="icon-box cf-${c.rarity}">${iconBoxInner(c)}</div>
          <div class="meta"><div>${c.name}</div><div class="who">${priceLine} · <span class="timer">${fmtCountdown(o.endsAt-Date.now())}</span></div></div>
        </div>
        <div class="right">
          ${maxSell > 0 ? `
            <input type="number" min="1" max="${maxSell}" placeholder="1" style="width:70px;" data-wtb-sell-input="${o.id}" />
            <button class="btn small" data-wtb-sell-btn="${o.id}">${tt('賣給他','Sell')}</button>
          ` : `<span class="who">${tt('你沒有這張卡','You have none of this card')}</span>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  const aucScrollY = window.scrollY;
  body.innerHTML = html;
  window.scrollTo(0, aucScrollY);

  const typeSelect = document.getElementById('auc-type-select');
  if(typeSelect) typeSelect.onchange = ()=>{
    state.auctionListType = typeSelect.value;
    renderTab();
  };
  const listBtn = document.getElementById('auc-list-btn');
  if(listBtn) listBtn.onclick = ()=>{
    const itemType = state.auctionListType;
    const itemId = document.getElementById('auc-item-select').value;
    const qtyInput = document.getElementById('auc-qty-input');
    const qty = qtyInput ? parseInt(qtyInput.value) : 1;
    const startBid = parseInt(document.getElementById('auc-start-input').value) || null;
    const buyoutPrice = parseInt(document.getElementById('auc-buyout-input').value) || null;
    const durIdx = parseInt(document.getElementById('auc-dur-select').value);
    listAuction(itemType, itemId, qty, startBid, buyoutPrice, DURATIONS[durIdx].ms);
  };
  document.querySelectorAll('[data-cancel-auction]').forEach(b=>{
    b.onclick = ()=>cancelAuction(b.dataset.cancelAuction);
  });
  document.querySelectorAll('[data-bid-btn]').forEach(b=>{
    b.onclick = ()=>{
      const aid = b.dataset.bidBtn;
      const input = document.querySelector(`[data-bid-input="${aid}"]`);
      const amount = parseInt(input.value || input.placeholder);
      placeBid(aid, amount);
    };
  });
  document.querySelectorAll('[data-buyout-btn]').forEach(b=>{
    b.onclick = ()=>buyoutAuction(b.dataset.buyoutBtn);
  });
  const wtbCreateBtn = document.getElementById('wtb-create-btn');
  if(wtbCreateBtn) wtbCreateBtn.onclick = ()=>{
    const cardId = document.getElementById('wtb-card-select').value;
    const price = parseInt(document.getElementById('wtb-price-input').value);
    const qty = parseInt(document.getElementById('wtb-qty-input').value);
    const durIdx = parseInt(document.getElementById('wtb-dur-select').value);
    createWantToBuy(cardId, price, qty, DURATIONS[durIdx].ms);
  };
  document.querySelectorAll('[data-cancel-wtb]').forEach(b=>{
    b.onclick = ()=>cancelWantToBuy(b.dataset.cancelWtb);
  });
  document.querySelectorAll('[data-wtb-sell-btn]').forEach(b=>{
    b.onclick = ()=>{
      const oid = b.dataset.wtbSellBtn;
      const input = document.querySelector(`[data-wtb-sell-input="${oid}"]`);
      const qty = parseInt(input.value || input.placeholder);
      fulfillWantToBuy(oid, qty);
    };
  });
}

async function renderFarm(body){
  const myRenderToken = renderToken; // 記住這次呼叫當下的序號，稍後寫入 DOM 前用來判斷自己是否已經過期
  const p = state.player;
  const farm = ensureFarm(p);
  ensureMaterials(p);
  const now = Date.now();
  const total = playerTotalCards(p);
  const uniqueTotal = playerUniqueCards(p);
  const farmLevel = p.farmLevel||0;

  const anyReady = farm.some(pl=>{
    const s = plotStatus(pl, now);
    return s === 'ready' || s === 'withered';
  });

  let html = `<div class="panel farm-banner" style="background-image:url('${FARM_BANNER_IMAGE}');">
    <div class="farm-banner-inner">
      <h2>${t('gardenHeader')}</h2>
      <p class="sub">${tt(`用金幣種下元素種子，靜待時間發芽 · 花色種子對應塔羅四元素 · 別忘了到下方看看好友的花園，互相澆水偷菜 🌿`, `Spend coins to plant elemental seeds and wait for them to grow · Suit seeds match the four tarot elements · Don't forget to check your friends' gardens below to water or take from each other 🌿`)}</p>
      <button class="btn small" id="farm-harvest-all-btn" ${anyReady?'':'disabled'}>${tt('收成全部','Harvest All')}</button>
    </div>
  </div>`;

  // ---------- 花園等級 / 升級 ----------
  const isMaxLevel = farmLevel >= FARM_MAX_LEVEL;
  const nextLevel = farmLevel + 1;
  const nextReq = FARM_UPGRADE_REQS[nextLevel];
  html += `<div class="panel">
    <h2>${tt(`🌿 花園等級 Lv.${farmLevel}`, `🌿 Garden Level Lv.${farmLevel}`)}${isMaxLevel ? tt('（已滿級）','(Max Level)') : ''}</h2>
    <p class="sub">${tt(`目前地塊數：${farm.length} 塊 · 消耗特定卡牌可以升級花園，解鎖更多地塊與更強的種子`, `Current plots: ${farm.length} · Consume specific cards to upgrade your garden, unlocking more plots and stronger seeds`)}</p>
    ${isMaxLevel ? '' : `
      <div class="farm-upgrade-box">
        <div class="farm-upgrade-title">${tt(`升級到 Lv.${nextLevel} 所需材料：`, `Materials needed for Lv.${nextLevel}:`)}</div>
        ${nextReq.cards.map(c=>{
          const have = countCardsForReq(p, c);
          const ok = have >= c.count;
          return `<div class="farm-upgrade-line" style="color:${ok?'#7ec98f':'var(--muted)'};">${ok?'✓':'✗'} ${reqLabel(c)}（${tt('目前擁有','have')} ${have}）</div>`;
        }).join('')}
        ${nextReq.coins ? `<div class="farm-upgrade-line" style="color:${(p.coins||0)>=nextReq.coins?'#7ec98f':'var(--muted)'};">${(p.coins||0)>=nextReq.coins?'✓':'✗'} ${tt('金幣','Coins')} ✦${nextReq.coins}（${tt('目前擁有','have')} ✦${p.coins||0}）</div>` : ''}
        ${nextReq.harvests ? (()=>{ const hv = (p.stats && p.stats.totalHarvests)||0; const hvOk = hv >= nextReq.harvests; return `<div class="farm-upgrade-line" style="color:${hvOk?'#7ec98f':'var(--muted)'};">${hvOk?'✓':'✗'} ${tt('累計收成次數','Total harvests')} ${Math.min(hv,nextReq.harvests)}/${nextReq.harvests}</div>`; })() : ''}
        ${(nextLevel===3 || nextLevel===6) ? `<div class="farm-upgrade-line" style="color:var(--gold-bright);">✨ ${tt(nextLevel===3 ? '達成後解鎖「新芽」層種子' : '達成後解鎖「綻放」層種子', nextLevel===3 ? 'Unlocks Sprout-tier seeds' : 'Unlocks Bloom-tier seeds')}</div>` : ''}
        ${nextLevel===8 ? `<div class="farm-upgrade-line" style="color:var(--gold-bright);">✨ ${tt('達成後解鎖「星輝」層花色升級','Unlocks the Starlight suit-upgrade tier')}</div>` : ''}
        ${FARM_LEVEL_PLOTS[nextLevel] > FARM_LEVEL_PLOTS[farmLevel] ? `<div class="farm-upgrade-line" style="color:var(--gold-bright);">✨ ${tt('達成後 +1 塊地','Unlocks +1 plot')}</div>` : ''}
        ${state.farmUpgradeMode ? renderFarmUpgradeSelectionUI(p, nextReq) : (nextReq.harvests && (((p.stats && p.stats.totalHarvests)||0) < nextReq.harvests) ? `<button class="btn small" disabled style="margin-top:8px;opacity:0.5;">${tt('選擇升級材料','Choose Upgrade Materials')}</button>` : `<button class="btn small" id="farm-upgrade-btn" style="margin-top:8px;">${tt('選擇升級材料','Choose Upgrade Materials')}</button>`)}
      </div>
    `}
  </div>`;

  // ---------- 花色升級（花商店素材，永久把某花色升級為新芽／綻放）----------
  ensureSuitUpgrades(p);
  html += `<div class="panel">
    <h2>${tt('🌟 花色升級', '🌟 Suit Upgrades')}</h2>
    <p class="sub">${tt('每個花色都是一條升級鏈：基礎 → 新芽 → 綻放 → 星輝。花費對應花色的卡牌把整個花色永久升級，之後在下方商店買這個花色都會直接拿到升級後的種子。', 'Each suit is an upgrade chain: base → sprout → bloom → starlight. Spend matching cards to permanently upgrade a suit — future purchases of that suit will give you the upgraded seed.')}</p>
    <div class="farm-suit-upgrade-list">
      ${SUIT_KEYS.map(suitKey=>{
        const level = suitUpgradeTier(p, suitKey);
        const curSeed = SEED_TYPES[effectiveSeedKey(p, suitKey)];
        const tierName = nextSuitUpgradeTierName(level);
        if(!tierName){
          return `<div class="farm-upgrade-line" style="color:var(--gold-bright);">${curSeed.icon} ${seedName(SEED_TYPES[suitKey])}：${tt('已達最高階','Max tier')}（${seedName(curSeed)}）</div>`;
        }
        const req = SUIT_UPGRADE_REQS[suitKey][tierName];
        const levelOk = (p.farmLevel||0) >= req.tierLevel;
        // 星輝階在花園未達 Lv.8 前先不顯示整個區塊，避免版面太長
        if(tierName === 'starlight' && !levelOk) return '';
        const nextSeed = SEED_TYPES[curSeed.upgradesTo];
        let line = `<div class="farm-upgrade-box" style="margin-top:8px;">
          <div class="farm-upgrade-title">${curSeed.icon} ${tt(`${seedName(SEED_TYPES[suitKey])}：目前為「${seedName(curSeed)}」，升級到「${seedName(nextSeed)}」`, `${seedName(SEED_TYPES[suitKey])}: currently "${seedName(curSeed)}" → upgrade to "${seedName(nextSeed)}"`)}</div>
          ${!levelOk ? `<div class="farm-upgrade-line" style="color:var(--muted);">✗ ${tt(`花園等級需達 Lv.${req.tierLevel}`, `Requires garden Lv.${req.tierLevel}`)}</div>` : ''}
          ${req.cards.map(c=>{
            const have = countCardsForReq(p, c);
            const ok = have >= c.count;
            return `<div class="farm-upgrade-line" style="color:${ok?'#7ec98f':'var(--muted)'};">${ok?'✓':'✗'} ${reqLabel(c)}（${tt('目前擁有','have')} ${have}）</div>`;
          }).join('')}
          <button class="btn small" data-suit-upgrade="${suitKey}" ${levelOk && req.cards.every(c=>countCardsForReq(p,c)>=c.count) ? '' : 'disabled'} style="margin-top:6px;">${tt('升級此花色','Upgrade Suit')}</button>
        </div>`;
        return line;
      }).join('')}
    </div>
  </div>`;

  // 花園種子分類篩選（共用一份，所有空地都套用同一個篩選結果）
  const anyEmptyPlot = farm.some(pl => plotStatus(pl, now) === 'empty');
  if(anyEmptyPlot){
    // 商店只賣基礎花色種子（依目前升級鏈換算成實際會拿到的種子）與賽季限定種子；新芽/綻放不再直接販售
    const shopBaseSeeds = SUIT_KEYS.map(k=>SEED_TYPES[effectiveSeedKey(p, k)]);
    const seasonSeeds = Object.values(SEED_TYPES).filter(s=>s.seasonOnly && SEASON_ACTIVE);
    const allSeeds = [...shopBaseSeeds, ...seasonSeeds];
    const availableGroups = Array.from(new Set(allSeeds.map(seedGroupKey)));
    if(!state.farmSeedGroup || !['all',...availableGroups].includes(state.farmSeedGroup)){
      state.farmSeedGroup = 'all';
    }
    const activeGroup = state.farmSeedGroup;
    // 一鍵種植：只有在選了「單一花色」分類（剛好只有一種可種的種子）時才顯示，
    // 「全部」或同時有多顆候選種子(例如賽季分類)時不顯示，避免種到玩家沒選到的種子
    let oneClickBtnHtml = '';
    if(activeGroup !== 'all'){
      const groupSeeds = allSeeds.filter(s=>seedGroupKey(s)===activeGroup);
      if(groupSeeds.length === 1){
        const seed = groupSeeds[0];
        const levelLocked = (seed.tierLevel||0) > farmLevel;
        const collectionCheck = seed.uniqueUnlock ? uniqueTotal : total;
        const collectionLocked = seed.unlockTotal && collectionCheck < seed.unlockTotal;
        const locked = levelLocked || (seed.seasonOnly && !SEASON_ACTIVE) || collectionLocked;
        const emptyCount = farm.filter(pl=>plotStatus(pl, now)==='empty').length;
        const affordableCount = locked ? 0 : Math.min(emptyCount, Math.floor((p.coins||0)/seed.cost));
        const disabled = locked || emptyCount===0 || affordableCount===0;
        oneClickBtnHtml = `<button class="btn small" id="farm-plant-all-btn" data-plant-all-seed="${seed.key}" ${disabled?'disabled':''}>${tt(`⚡一鍵種植${seedName(seed)}`,`⚡Plant All: ${seedName(seed)}`)}（${emptyCount} ${tt('塊空地','plots')} · ✦${seed.cost}${tt('/顆','/ea')}）</button>`;
      }
    }
    html += `<div class="farm-seed-tabs">
      <button class="farm-seed-tab ${activeGroup==='all'?'active':''}" data-seedtab="all">${tt('全部','All')}</button>
      ${availableGroups.map(g=>{
        const meta = SEED_GROUP_META[g] || {icon:'🌱', zh:g, en:g};
        const label = appLang==='zh' ? meta.zh : meta.en;
        return `<button class="farm-seed-tab ${activeGroup===g?'active':''}" data-seedtab="${g}">${meta.icon} ${label}</button>`;
      }).join('')}
      ${oneClickBtnHtml}
    </div>`;
  }

  html += `<div class="farm-grid">`;
  farm.forEach((plot, i)=>{
    const status = plotStatus(plot, now);
    if(status === 'empty'){
      const activeGroup = state.farmSeedGroup || 'all';
      const showLocked = !!state.farmShowLocked;
      // 商店只賣基礎花色種子（已依花色升級鏈換算成實際版本）與賽季限定種子
      const shopSeeds = [
        ...SUIT_KEYS.map(k=>SEED_TYPES[effectiveSeedKey(p, k)]),
        ...Object.values(SEED_TYPES).filter(s=>s.seasonOnly && SEASON_ACTIVE),
      ];
      const visibleSeeds = shopSeeds
        .filter(s=> activeGroup==='all' || seedGroupKey(s)===activeGroup);
      const built = visibleSeeds.map(seed=>{
        const levelLocked = (seed.tierLevel||0) > farmLevel;
        const collectionCheck = seed.uniqueUnlock ? uniqueTotal : total;
        const collectionLocked = seed.unlockTotal && collectionCheck < seed.unlockTotal;
        const locked = levelLocked || collectionLocked;
        const affordable = (p.coins||0) >= seed.cost;
        const disabled = locked || !affordable;
        let label;
        if(levelLocked) label = tt(`需花園 Lv.${seed.tierLevel}`, `Needs garden Lv.${seed.tierLevel}`);
        else if(collectionLocked) label = seed.uniqueUnlock ? tt(`需超過 ${seed.unlockTotal-1} 種不同卡`, `Need >${seed.unlockTotal-1} unique cards`) : tt(`需收藏 ${seed.unlockTotal} 張`, `Need ${seed.unlockTotal} cards`);
        else label = tt(`成長 ${formatDuration(seed.growMs)}`, `Grows in ${formatDuration(seed.growMs)}`);
        const btnHtml = `<button class="farm-seed-btn" data-plant="${i}" data-seed="${seed.key}" ${disabled?'disabled':''}>
          <span class="fs-name">${seed.icon} ${seedName(seed)}${locked?' 🔒':''}<br/><span style="color:var(--muted);font-size:11px;">${label}</span></span>
          <span class="fs-cost">✦${seed.cost}</span>
        </button>`;
        return {locked, html: btnHtml};
      });
      const unlockedHtml = built.filter(b=>!b.locked).map(b=>b.html).join('');
      const lockedItems = built.filter(b=>b.locked);
      const lockedHtml = lockedItems.map(b=>b.html).join('');
      const seedListHtml = unlockedHtml || `<div class="farm-seed-empty-note">${tt('此分類目前沒有可種的種子','No plantable seeds in this category')}</div>`;
      const lockedToggleHtml = lockedItems.length > 0
        ? `<button class="farm-seed-toggle-locked" data-toggle-locked="1">${showLocked ? tt('隱藏已鎖定','Hide locked') : tt(`顯示已鎖定（${lockedItems.length}）`, `Show locked (${lockedItems.length})`)}</button>
           ${showLocked ? `<div class="farm-seed-list locked">${lockedHtml}</div>` : ''}`
        : '';
      html += `<div class="farm-plot">
        <div class="farm-plot-icon">🪴</div>
        <div class="farm-plot-name">${tt('空地','Empty plot')}</div>
        <div class="farm-plot-sub">${tt('選一顆種子種下','Choose a seed to plant')}</div>
        <div class="farm-seed-list">${seedListHtml}</div>
        ${lockedToggleHtml}
      </div>`;
    } else {
      // 🐞修正：plot.seed 可能指向已被移除／改版下架的舊種子（例如過去的季節限定
      // 種子），此時 SEED_TYPES[plot.seed] 會是 undefined。原本這裡的「已成熟」與
      // 「成長中」分支會直接讀 seed.icon / seed.growMs 等欄位，整個 renderFarm()
      // 因此拋出例外中斷，畫面停在切換前的分頁、點花園分頁看起來完全沒反應。
      // 補一個安全預設值，讓孤兒種子的地塊至少能正常顯示、可以被收成/清掉。
      const seed = SEED_TYPES[plot.seed] || {icon:'❓', nameZh:'未知種子（已下架）', nameEn:'Unknown Seed (discontinued)', coinMin:0, coinMax:0, growMs:1};
      if(status === 'withered'){
        html += `<div class="farm-plot withered">
          <div class="farm-plot-icon">🥀</div>
          <div class="farm-plot-name">${tt(`${seedName(seed)}已枯萎`, `${seedName(seed)} withered`)}</div>

      } else if(status === 'ready'){
        html += `<div class="farm-plot ready">
          <div class="farm-plot-icon">${seed.icon}</div>
          <div class="farm-plot-name">${seedName(seed)}</div>

        </div>`;
      } else {
        const elapsed = now - plot.plantedAt;
        const pct = Math.min(100, Math.floor((elapsed / seed.growMs) * 100));
        const remain = plot.readyAt - now;
        let witherNote = '';
        if(plot.witherAt){
          witherNote = `<div class="farm-plot-sub" style="color:#c98;">${tt(`成熟後 ${formatDuration(plot.witherAt - plot.readyAt)} 內要收成，否則會枯萎`, `Must harvest within ${formatDuration(plot.witherAt - plot.readyAt)} of ripening, or it will wither`)}</div>`;
        }
        html += `<div class="farm-plot">
          <div class="farm-plot-icon">${seed.icon}</div>
          <div class="farm-plot-name">${seedName(seed)}</div>
          <div class="farm-plot-sub">${tt(`還需 ${formatDuration(remain)}`, `${formatDuration(remain)} remaining`)}</div>
          <div class="farm-progress"><div class="farm-progress-fill" style="width:${pct}%;"></div></div>
          ${witherNote}
        </div>`;
      }
    }
  });
  html += `</div>`;

  // ---------- 好友花園：互相澆水/偷菜 ----------
  const friends = await fetchMyFriendsCached(state.nickname);
  html += `<div class="panel">
    <h2>${t('friendGardenHeader')}</h2>
    <p class="sub">${tt('幫好友的作物澆水可以加速生長（雙方都有小獎勵），成熟後太久沒收成也可以被好友偷一點走，但不影響本人收成',"Watering a friend's crop speeds up its growth (small reward for both of you); crops left unharvested too long after ripening can be taken from by friends, but it doesn't affect the owner's harvest")}</p>
    ${friends.length>0 ? `<div class="farm-bulk-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      <button class="btn small" id="farm-water-all-btn">${tt('🚿 一鍵幫好友澆水','🚿 Water all friends')}</button>
      <button class="btn small" id="farm-steal-all-btn">${tt('🌾 一鍵偷好友菜','🌾 Take from all friends')}</button>
    </div>` : ''}
    ${friends.length===0 ? `<div class="empty-note">${tt('尚未加入任何好友，先到「好友」分頁加人吧 ✦','No friends yet - add some on the Friends tab first ✦')}</div>` : (state.farmFriendsShowAll ? friends : friends.slice(0,5)).map(f=>`
      <div class="listing">
        <div class="left"><div class="icon-box">✦</div><div class="meta"><div>${escapeHtml(f)}</div></div></div>
        <div class="right"><button class="btn small" data-visit-farm="${escapeHtml(f)}">${state.farmVisiting===f ? tt('收合','Collapse') : tt('查看花園','View Garden')}</button></div>
      </div>
    `).join('')}
    ${friends.length>5 ? `<div style="margin-top:6px;">
      <button class="btn small secondary" id="farm-friends-toggle-btn">${state.farmFriendsShowAll ? tt('收合好友名單','Collapse friend list') : tt(`顯示全部好友（共 ${friends.length} 位）`, `Show all friends (${friends.length} total)`)}</button>
    </div>` : ''}
  </div>`;

  let visitingFarm = null, visitingPlayer = null;
  if(state.farmVisiting && friends.includes(state.farmVisiting)){
    visitingPlayer = await loadPlayerCached(state.farmVisiting);
    if(visitingPlayer) visitingFarm = ensureFarm(visitingPlayer);
  }
  if(state.farmVisiting && visitingFarm){
    const vnow = Date.now();
    html += `<div class="panel">
      <h2>${tt(`${escapeHtml(state.farmVisiting)} 的花園`, `${escapeHtml(state.farmVisiting)}'s Garden`)}</h2>
      <div class="farm-grid">`;
    visitingFarm.forEach((plot, i)=>{
      const status = plotStatus(plot, vnow);
      if(status === 'empty'){
        html += `<div class="farm-plot">
          <div class="farm-plot-icon">🪴</div>
          <div class="farm-plot-name">${tt('空地','Empty plot')}</div>
          <div class="farm-plot-sub">${tt('還沒有種東西','Nothing planted yet')}</div>
        </div>`;
      } else {
        // 🐞修正：跟上面自己的花園一樣，好友的地塊也可能種著已下架的舊種子，
        // 補一樣的安全預設值，避免查看好友花園時整段拋出例外。
        const seed = SEED_TYPES[plot.seed] || {icon:'❓', nameZh:'未知種子（已下架）', nameEn:'Unknown Seed (discontinued)', coinMin:0, coinMax:0, growMs:1};
        if(status === 'withered'){
          html += `<div class="farm-plot withered">
            <div class="farm-plot-icon">🥀</div>
            <div class="farm-plot-name">${tt(`${seedName(seed)}已枯萎`, `${seedName(seed)} withered`)}</div>
            <div class="farm-plot-sub">${tt('錯過了最佳收成時機','Missed the best harvest window')}</div>
          </div>`;
        } else if(status === 'ready'){
          const stolen = plot.stolenBy.includes(state.nickname);
          html += `<div class="farm-plot ready">
            <div class="farm-plot-icon">${seed.icon}</div>
            <div class="farm-plot-name">${seedName(seed)}</div>
            <div class="farm-plot-sub">${tt('已成熟，還沒收成','Ripe, not yet harvested')}</div>
            <button class="btn small secondary" data-steal-plot="${i}" data-steal-friend="${escapeHtml(state.farmVisiting)}" ${stolen?'disabled':''}>${stolen?tt('已偷過','Already taken'):tt(`🌾 偷一點（+✦${stealYieldFor(plot.seed)}）`, `🌾 Take some (+✦${stealYieldFor(plot.seed)})`)}</button>
          </div>`;
        } else {
          const elapsed = vnow - plot.plantedAt;
          const pct = Math.min(100, Math.floor((elapsed / seed.growMs) * 100));
          const remain = plot.readyAt - vnow;
          const watered = !!plot.waterLog[state.nickname];
          html += `<div class="farm-plot">
            <div class="farm-plot-icon">${seed.icon}</div>
            <div class="farm-plot-name">${seedName(seed)}</div>
            <div class="farm-plot-sub">${tt(`還需 ${formatDuration(remain)}`, `${formatDuration(remain)} remaining`)}</div>
            <div class="farm-progress"><div class="farm-progress-fill" style="width:${pct}%;"></div></div>
            <button class="btn small" data-water-plot="${i}" data-water-friend="${escapeHtml(state.farmVisiting)}" ${watered?'disabled':''}>${watered?tt('已澆過水','Already watered'):tt('🚿 幫忙澆水','🚿 Water it')}</button>
          </div>`;
        }
      }
    });
    html += `</div></div>`;
  }

  html += petSectionHtml(p);

  // 這段 await 期間如果又有更新一次的 renderTab() 被觸發（例如玩家澆完水後自己觸發的重繪，
  // 或下一次 farmTickInterval），代表這次拿到的資料已經過期，放棄寫入 DOM，避免用舊資料
  // （例如「還沒澆過水」）蓋掉剛畫出來的新狀態。
  if(myRenderToken !== renderToken) return;
  body.innerHTML = html;

  const harvestAllBtn = document.getElementById('farm-harvest-all-btn');
  if(harvestAllBtn) harvestAllBtn.onclick = harvestAllReady;
  const waterAllBtn = document.getElementById('farm-water-all-btn');
  if(waterAllBtn) waterAllBtn.onclick = waterAllFriendsPlots;
  const stealAllBtn = document.getElementById('farm-steal-all-btn');
  if(stealAllBtn) stealAllBtn.onclick = stealAllFriendsPlots;
  const friendsToggleBtn = document.getElementById('farm-friends-toggle-btn');
  if(friendsToggleBtn) friendsToggleBtn.onclick = ()=>{ state.farmFriendsShowAll = !state.farmFriendsShowAll; renderTab(); };
  const upgradeBtn = document.getElementById('farm-upgrade-btn');
  if(upgradeBtn) upgradeBtn.onclick = openFarmUpgradeSelect;
  document.querySelectorAll('.farm-mat-input').forEach(inp=>{
    inp.oninput = ()=>{
      const ri = parseInt(inp.dataset.req,10);
      const cid = inp.dataset.card;
      const max = parseInt(inp.max,10)||0;
      let v = parseInt(inp.value,10); if(isNaN(v)||v<0) v=0;
      v = Math.min(v, max);
      inp.value = v;
      if(!state.farmUpgradeSelections || !state.farmUpgradeSelections[ri]) return;
      if(v>0) state.farmUpgradeSelections[ri][cid] = v;
      else delete state.farmUpgradeSelections[ri][cid];
      const totalEl = document.getElementById(`mat-total-${ri}`);
      if(totalEl) totalEl.textContent = Object.values(state.farmUpgradeSelections[ri]).reduce((a,b)=>a+b,0);
    };
  });
  const upgradeConfirmBtn = document.getElementById('farm-upgrade-confirm-btn');
  if(upgradeConfirmBtn) upgradeConfirmBtn.onclick = confirmFarmUpgrade;
  const upgradeCancelBtn = document.getElementById('farm-upgrade-cancel-btn');
  if(upgradeCancelBtn) upgradeCancelBtn.onclick = ()=>{
    state.farmUpgradeMode = false;
    state.farmUpgradeSelections = null;
    render();
  };
  document.querySelectorAll('[data-plant]').forEach(btn=>{
    btn.onclick = ()=>plantSeed(parseInt(btn.dataset.plant,10), btn.dataset.seed);
  });
  const plantAllBtn = document.getElementById('farm-plant-all-btn');
  if(plantAllBtn) plantAllBtn.onclick = ()=>plantSeedToAllEmpty(plantAllBtn.dataset.plantAllSeed);
  document.querySelectorAll('[data-suit-upgrade]').forEach(btn=>{
    btn.onclick = ()=>confirmSuitUpgrade(btn.dataset.suitUpgrade);
  });
  document.querySelectorAll('[data-seedtab]').forEach(btn=>{
    btn.onclick = ()=>{
      state.farmSeedGroup = btn.dataset.seedtab;
      render();
    };
  });
  document.querySelectorAll('[data-toggle-locked]').forEach(btn=>{
    btn.onclick = ()=>{
      state.farmShowLocked = !state.farmShowLocked;
      render();
    };
  });
  document.querySelectorAll('[data-harvest]').forEach(btn=>{
    btn.onclick = ()=>harvestOne(parseInt(btn.dataset.harvest,10));
  });
  document.querySelectorAll('[data-visit-farm]').forEach(btn=>{
    btn.onclick = ()=>{
      const f = btn.dataset.visitFarm;
      state.farmVisiting = state.farmVisiting===f ? null : f;
      render();
    };
  });
  document.querySelectorAll('[data-water-plot]').forEach(btn=>{
    btn.onclick = ()=>waterFriendPlot(btn.dataset.waterFriend, parseInt(btn.dataset.waterPlot,10));
  });
  document.querySelectorAll('[data-steal-plot]').forEach(btn=>{
    btn.onclick = ()=>stealFriendPlot(btn.dataset.stealFriend, parseInt(btn.dataset.stealPlot,10));
  });
  wirePetEvents();
}

// 排行榜快取：直接抓全站玩家完整資料（含卡牌、材料、道具等大型物件）再挑幾個數字欄位，
// 每次有人打開排行榜分頁就整批下載一次全站玩家資料，流量成本很高。
// 改成把算好的排行結果快取進單一 key，一段時間內重複打開分頁的玩家直接讀快取，
// 只有快取過期時才需要真的抓一次全站玩家資料重新計算。
const LEADERBOARD_CACHE_KEY = 'config:leaderboard_cache';
const LEADERBOARD_CACHE_TTL_MS = 3 * 60 * 1000; // 3 分鐘內重複打開不重抓
async function computeLeaderboards(){
  const allPlayers = await fetchAllPlayers();
  syncPlayerIndexFromPlayers(allPlayers).catch(()=>{}); // 順便補齊暱稱索引，不額外發請求
  const players = allPlayers.filter(pl=>pl.nickname.toLowerCase() !== GM_NICKNAME.toLowerCase());
  const byCards = players.map(pl=>({nickname:pl.nickname, total: playerTotalCards(pl)}))
    .sort((a,b)=>b.total-a.total).slice(0,5);
  const byCoins = players.map(pl=>({nickname:pl.nickname, coins: pl.coins||0}))
    .sort((a,b)=>b.coins-a.coins).slice(0,5);
  const bySlotSpend = players.map(pl=>({nickname:pl.nickname, spend: pl.slotSpend||0}))
    .sort((a,b)=>b.spend-a.spend).slice(0,5);
  const byStreak = players.map(pl=>({nickname:pl.nickname, streak: pl.expeditionRecklessStreak||0}))
    .sort((a,b)=>b.streak-a.streak).slice(0,5);
  const byBossDamage = players.map(pl=>({nickname:pl.nickname, damage: (pl.stats && pl.stats.maxBossHitDamage) || 0}))
    .sort((a,b)=>b.damage-a.damage).slice(0,5);
  const byHarvest = players.map(pl=>({nickname:pl.nickname, harvests: (pl.stats && pl.stats.totalHarvests) || 0}))
    .sort((a,b)=>b.harvests-a.harvests).slice(0,5);
  const byAuctionVolume = players.map(pl=>({nickname:pl.nickname, volume: (pl.stats && pl.stats.totalAuctionVolume) || 0, trades: (pl.stats && pl.stats.totalAuctionTrades) || 0}))
    .sort((a,b)=>b.volume-a.volume).slice(0,5);
  // 完美骰排行榜：每位玩家挑出自己骰子倉庫裡分數最高的一顆（不限是否已裝備），
  // 用 diceScore() 算分並附上骰子快照本身，讓排行榜可以直接畫出 6 面內容曬骰。
  const byDiceScore = players.map(pl=>{
    const best = playerBestDice(pl);
    return best ? {nickname: pl.nickname, score: best.score, dice: best.dice} : null;
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,5);
  return {byCards, byCoins, bySlotSpend, byStreak, byBossDamage, byHarvest, byAuctionVolume, byDiceScore, updatedAt: Date.now()};
}
async function fetchLeaderboards(){
  try{
    const r = await storage.get(LEADERBOARD_CACHE_KEY);
    if(r){
      const cached = JSON.parse(r.value);
      if(cached && (Date.now() - (cached.updatedAt||0)) < LEADERBOARD_CACHE_TTL_MS) return cached;
    }
  }catch(e){ /* 讀快取失敗就直接重算 */ }
  const fresh = await computeLeaderboards();
  storage.set(LEADERBOARD_CACHE_KEY, JSON.stringify(fresh)).catch(()=>{});
  return fresh;
}

        <div class="chat-msg${m.nickname.toLowerCase()===state.nickname.toLowerCase()?' mine':''}">
          <div class="chat-msg-head">
            <div class="chat-avatar" data-view-profile="${escapeHtml(m.nickname)}">${avatarBoxHtml(m.avatarId)}</div>
            <span class="chat-msg-name" data-view-profile="${escapeHtml(m.nickname)}" style="${m.isGM?'color:var(--gold);':''}">${escapeHtml(m.nickname)}${m.isGM?' ⚡':''}</span>
            ${(m.titles||[]).length ? `<span class="title-row" style="display:inline-flex;gap:3px;">${(m.titles||[]).map(k=>titleInlineHtml(k,11)).join('')}</span>` : ''}
            ${(m.badges||[]).length ? `<span class="badge-row" style="display:inline-flex;gap:2px;">${(m.badges||[]).map(k=>badgeInlineHtml(k,15)).join('')}</span>` : ''}
            <span class="chat-msg-time">${timeAgo(m.createdAt)}</span>
            ${isGM() ? `<button class="chat-msg-del" data-chat-del="${m.id}" title="${tt('刪除訊息','Delete message')}">✕</button>` : ''}
          </div>
          <div class="chat-msg-text">${escapeHtml(m.text)}</div>
        </div>
      `).join('')}
    </div>
    <div class="form-row" style="margin-top:10px;">
      <input type="text" id="chat-input" placeholder="${tt('輸入訊息...','Type a message...')}" maxlength="300" style="flex:1;min-width:160px;" />
      <button class="btn small" id="chat-send-btn">${tt('送出','Send')}</button>
    </div>
  </div>`;

  body.innerHTML = html;
  bindProfileClickTargets(body);

  const scrollBox = document.getElementById('chat-scroll');
  if(scrollBox) scrollBox.scrollTop = scrollBox.scrollHeight;

  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send-btn');
  const doSend = ()=>{
    if(!input) return;
    const v = input.value;
    input.value = '';
    sendChatMessage(v);
  };
  if(sendBtn) sendBtn.onclick = doSend;
  if(input){
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') doSend(); });
  }
  document.querySelectorAll('[data-chat-del]').forEach(btn=>{
    btn.onclick = ()=>deleteChatMessage(btn.dataset.chatDel);
  });
}

    if(invalid){ showToast(tt('請確認每項數值皆為有效的非負數字，區間上限需大於等於下限','Please check all values are valid non-negative numbers, and range max ≥ min')); return; }
    PET_EGG_GROW_MS = Math.round(hours*3600000);
    PET_EGG_MATERIAL_COST = eggCost;
    PET_BONUS_EGG_CHANCE = bonusChance/100;
    PET_SWAP_COST = swapCost;
    PET_RARITY_BASE_WEIGHT = rarityWeights;
    PET_RARITY_LEVEL_BONUS = {rare:rarityBonusRare, epic:rarityBonusEpic};
    PET_DURATION_REWARDS = durationRewards;
    PET_RARE_LOOT_CHANCE = rareLootChance;
    await savePetConfig();
    showToast(tt('寵物尋寶設定已更新，即時對所有玩家生效 ⚡','Pet hunt settings updated, effective immediately for all players ⚡'));
    renderTab();
  };
  const petResetBtn = document.getElementById('gm-pet-reset-btn');
  if(petResetBtn) petResetBtn.onclick = async ()=>{
    PET_EGG_GROW_MS = DEFAULT_PET_EGG_GROW_MS;
    PET_EGG_MATERIAL_COST = DEFAULT_PET_EGG_MATERIAL_COST;
    PET_SWAP_COST = DEFAULT_PET_SWAP_COST;
    PET_BONUS_EGG_CHANCE = DEFAULT_PET_BONUS_EGG_CHANCE;
    PET_RARITY_BASE_WEIGHT = {...DEFAULT_PET_RARITY_BASE_WEIGHT};
    PET_RARITY_LEVEL_BONUS = {...DEFAULT_PET_RARITY_LEVEL_BONUS};
    PET_DURATION_REWARDS = JSON.parse(JSON.stringify(DEFAULT_PET_DURATION_REWARDS));
    PET_RARE_LOOT_CHANCE = {...DEFAULT_PET_RARE_LOOT_CHANCE};
    await savePetConfig();
    showToast(tt('已還原為預設寵物尋寶設定','Reverted to default pet hunt settings'));
    renderTab();
  };
}

boot();
})();
</script>
</body>
</html>
