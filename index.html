  let variant = tier && tier.durations[durationKey];
  if(!tier || !variant){ showToast(tt('找不到這個遠征任務','Could not find this expedition')); return; }
  if((p.expLevel||0) < tier.unlockLevel){ showToast(tt('遠征等級尚未達到需求','Your expedition level is too low')); return; }
  const {cards} = getExpeditionRequiredCards(p, tier, durationKey);
  const missing = cards.filter(cid=>(p.cards[cid]||0) < 1);
  if(missing.length > 0){
    showToast(tt('缺少系統指定的出征卡牌，請先到拍賣行收購','Missing the system-assigned expedition cards - please buy them from the Auction House first'));
    return;
  }
  // 向下相容：階段五之前的舊呼叫方式是傳入 boolean（是否使用家具）或舊版 {furnitureCount, useWeapon, accessoryCount}（一律視為 common 等級），這裡統一轉成新版 tier 格式
  const rawUsage = (typeof itemUsage === 'boolean') ? {furnitureCount: itemUsage ? 1 : 0} : (itemUsage || {});
  const usage = {
    furnitureSel: rawUsage.furnitureSel !== undefined ? rawUsage.furnitureSel : (rawUsage.furnitureCount ? `common:${rawUsage.furnitureCount}` : ''),
    weaponTier: rawUsage.weaponTier !== undefined ? rawUsage.weaponTier : (rawUsage.useWeapon ? 'common' : null),
    accessorySel: rawUsage.accessorySel !== undefined ? rawUsage.accessorySel : (rawUsage.accessoryCount ? `common:${rawUsage.accessoryCount}` : ''),
    riskLevel: rawUsage.riskLevel, blessingCardId: rawUsage.blessingCardId,
  };
  // "tier:count" 字串解析成 {tier, count}；空字串/未選代表不使用
  function parseTierSel(sel){
    if(!sel) return {tier:null, count:0};
    const parts = String(sel).split(':');
    return {tier: parts[0], count: parseInt(parts[1],10)||0};
  }

  // 階段二：職業道具 × 遠征 —— 派遣當下扣道具、算好這趟的加成值存進 p.expedition（結算時直接讀取，之後 GM 調整設定不會影響已派出的這趟）
  // 🪑 家具：可疊加最多 FURNITURE_MAX_STACK 件，逐件遞減，總和封頂 100%；common／uncommon 互斥，只能擇一等級疊加
  const furnitureSelParsed = parseTierSel(usage.furnitureSel);
  const furnitureTier = furnitureSelParsed.tier;
  const furnitureStock = furnitureTier === 'uncommon' ? (p.professionItems.furniture_uncommon||0) : (p.professionItems.furniture_common||0);
  const furnitureCount = Math.max(0, Math.min(FURNITURE_MAX_STACK, furnitureSelParsed.count, furnitureStock));
  const furnitureTiersArr = furnitureTier === 'uncommon' ? FURNITURE_UNCOMMON_SUCCESS_TIERS : FURNITURE_SUCCESS_TIERS;
  const furnitureBonus = furnitureCount>0 ? Math.min(1, furnitureTiersArr.slice(0, furnitureCount).reduce((sum,v)=>sum+v, 0)) : 0;

  // ⚔️ 武器：只能用 1 把，成功時獎勵區間 +N%（結算時套用）；common／uncommon 互斥，只能擇一
  const weaponTier = usage.weaponTier === 'uncommon' ? 'uncommon' : (usage.weaponTier === 'common' ? 'common' : null);
  const weaponStock = weaponTier === 'uncommon' ? (p.professionItems.weapon_uncommon||0) : (weaponTier === 'common' ? (p.professionItems.weapon_common||0) : 0);
  const weaponUsed = !!weaponTier && weaponStock > 0;
  const weaponRewardPct = weaponUsed ? (weaponTier === 'uncommon' ? WEAPON_UNCOMMON_EXPEDITION_REWARD_PCT : WEAPON_EXPEDITION_REWARD_PCT) : 0;

  // 💍 飾品：可疊加最多 ACCESSORY_EXPEDITION_MAX_STACK 件，把獎勵下限往上限拉近，總和封頂 100%；common／uncommon 互斥，只能擇一等級疊加
  const accessorySelParsed = parseTierSel(usage.accessorySel);
  const accessoryTier = accessorySelParsed.tier;
  const accessoryStock = accessoryTier === 'uncommon' ? (p.professionItems.accessory_uncommon||0) : (p.professionItems.accessory_common||0);
  const accessoryCount = Math.max(0, Math.min(ACCESSORY_EXPEDITION_MAX_STACK, accessorySelParsed.count, accessoryStock));
  const accessoryFloorPctPerItem = accessoryTier === 'uncommon' ? ACCESSORY_UNCOMMON_EXPEDITION_FLOOR_PCT : ACCESSORY_EXPEDITION_FLOOR_PCT;
  const accessoryFloorPct = Math.min(1, accessoryCount * accessoryFloorPctPerItem);

  // 🎲 階段二：風險等級 + 局內祝福/詛咒 —— 僅 Lv >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL 生效，未達門檻一律視為「標準／無」
  const rogueUnlocked = (p.expLevel||0) >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL;
  const riskKey = (rogueUnlocked && usage.riskLevel && EXPEDITION_RISK_LEVELS[usage.riskLevel]) ? usage.riskLevel : 'standard';
  const riskData = EXPEDITION_RISK_LEVELS[riskKey];
  const risk = {successDelta: riskData.successDelta, rewardMult: riskData.rewardMult, extraCardLossOnFail: riskData.extraCardLossOnFail};
  let blessingCurse = null;
  if(rogueUnlocked && usage.blessingCardId){
    const card = EXPEDITION_BLESSING_CURSE_POOL.find(c=>c.id === usage.blessingCardId);
    if(card) blessingCurse = JSON.parse(JSON.stringify(card)); // 存快照，之後 GM 調整卡池內容不影響已出征的這趟
  }
  // 翻牌選卡是這趟遠征的必要步驟（跟門檻解鎖綁在一起），沒選就不能出征
  if(rogueUnlocked && !blessingCurse){
    showToast(tt('請先選好風險等級並翻牌選1張效果卡','Pick a risk level and draw+select a card first'));
    return;
  }
  // 祝福/詛咒的時間類效果（疾行/束縛）在派遣當下就決定這趟的實際時長
  let effectiveDurationMs = variant.durationMs;
  if(blessingCurse && typeof blessingCurse.durationPctDelta === 'number'){
    effectiveDurationMs = Math.max(1000, Math.round(variant.durationMs * (1 + blessingCurse.durationPctDelta)));
  }

  if(furnitureCount > 0) p.professionItems[furnitureTier === 'uncommon' ? 'furniture_uncommon' : 'furniture_common'] -= furnitureCount;
  if(weaponUsed) p.professionItems[weaponTier === 'uncommon' ? 'weapon_uncommon' : 'weapon_common'] -= 1;
  if(accessoryCount > 0) p.professionItems[accessoryTier === 'uncommon' ? 'accessory_uncommon' : 'accessory_common'] -= accessoryCount;

  const staked = {};
  cards.forEach(cid=>{
    p.cards[cid] = (p.cards[cid]||0) - 1;
    staked[cid] = (staked[cid]||0) + 1;
  });
  const now = Date.now();
  p.expedition = {
    tierId: tier.id, durationKey, startAt: now, readyAt: now + effectiveDurationMs, staked,
    furnitureBonus, furnitureCount, furnitureTier,
    weaponUsed, weaponRewardPct, weaponTier,
    accessoryCount, accessoryFloorPct, accessoryTier,
    starChartSuccessBonus: starChartMarsSuccessBonus(p), // ♂️ 星盤火星節點：出征當下 snapshot，之後點新節點不影響已出征的這趟
    starChartRewardBonus: starChartJupiterRewardBonus(p), // ♃ 星盤木星節點：同上
    potionMinutesUsed: 0, // 階段四：進行中頁面使用藥水縮時，會累加這個欄位
    riskLevel: riskKey, risk, // 階段二：風險等級快照，結算時（階段四）直接讀取
    blessingCurse, // 階段二：這趟帶著出征的祝福/詛咒卡快照（null 表示未解鎖或無），事件節點/結算時讀取
    events: rogueUnlocked ? buildExpeditionEventSchedule(durationKey, now, effectiveDurationMs) : [], // 階段三：事件節點時刻表
    eventSuccessDelta: 0, eventRewardPctDelta: 0, extraBlessings: [], // 階段三：事件節點結算時疊加進來的加成，結算時（階段四）讀取
  };
  // 這批卡牌已經帶出去了，重新替這個任務＋時長隨機指定下一批出征所需卡牌
  p.expeditionRolls[expeditionRollKey(tier.id, durationKey)] = rollExpeditionRequiredCards(variant, durationKey, tier);
  delete expeditionRogueDraft[`${tier.id}-${durationKey}`];
  bumpQuest(p, 'expedition', 1);
  await savePlayer(p);
  const usedNotes = [];
  if(furnitureCount > 0) usedNotes.push(tt(`🪑家具(${furnitureTier})×${furnitureCount}（成功率+${Math.round(furnitureBonus*100)}%）`, `🪑Furniture(${furnitureTier})×${furnitureCount} (success +${Math.round(furnitureBonus*100)}%)`));
  if(weaponUsed) usedNotes.push(tt(`⚔️武器(${weaponTier})（獎勵區間+${Math.round(weaponRewardPct*100)}%）`, `⚔️Weapon(${weaponTier}) (reward range +${Math.round(weaponRewardPct*100)}%)`));
  if(accessoryCount > 0) usedNotes.push(tt(`💍飾品(${accessoryTier})×${accessoryCount}（獎勵下限拉近${Math.round(accessoryFloorPct*100)}%）`, `💍Accessory(${accessoryTier})×${accessoryCount} (reward floor pulled ${Math.round(accessoryFloorPct*100)}% toward max)`));
  if(rogueUnlocked) usedNotes.push(tt(`🎲${riskData.labelZh}`, `🎲${riskData.labelEn}`));
  if(blessingCurse) usedNotes.push(`${blessingCurse.icon}${tt(blessingCurse.labelZh, blessingCurse.labelEn)}`);
  const usedSuffix = usedNotes.length ? `（${usedNotes.join('、')}）` : '';
  showToast(tt(`🧭 已派出「${expeditionTierLabel(tier)}・${expeditionDurationLabel(durationKey)}」${usedSuffix}，${formatDuration(effectiveDurationMs)} 後回來查看結果`, `🧭 Sent out on "${expeditionTierLabel(tier)} · ${expeditionDurationLabel(durationKey)}"${usedSuffix} - check back in ${formatDuration(effectiveDurationMs)}`));
  render();
}
// 階段四：玩家沒回來點事件節點、遠征就已到期的「逾時安全預設」——
// 選擇型節點自動套用該節點的第一個選項（岔路/陷阱/商人的池子設計上第一個選項都是「不變」的安全選項，無成本無風險）；
// 戰鬥型節點正常情況下 renderExpedition 每次渲染就會自動判定掉，這裡是保底（例如結算前沒有先渲染過的呼叫路徑）。
function autoResolveTimedOutExpeditionEvents(p, exp){
  if(!exp || !Array.isArray(exp.events)) return;
  exp.events.forEach(ev=>{
    if(ev.resolved) return;
    if(ev.kind === 'combat'){
      autoResolveExpeditionCombatEvent(p, ev);
    } else {
      const evDef = EXPEDITION_CHOICE_EVENT_POOL.find(e=>e.id===ev.eventId);
      const safeOption = evDef && evDef.options[0];
      if(safeOption){
        resolveExpeditionEventOption(p, ev, safeOption.id);
        ev.autoResolved = true; // 標記為逾時自動選擇，非玩家手動操作，供遭遇紀錄顯示區分
      } else {
        ev.resolved = true; // 找不到定義（例如舊存檔/GM改過池子），安全跳過不疊加任何效果
      }
    }
  });
}
// 🎲 遠征救援骰：初判失敗時，若玩家 3 個裝備欄都有骰子，允許補丟一次骰子——
// 開出「豹子」（3 顆同號，萬能面可搭配湊數）就直接把這次失敗逆轉成功，
// 沒吃到成功率的失敗還有一次翻盤機會。純判定用途，重用 computeNumberCombo
// 同一套對子/豹子判定邏輯，不消耗骰子/道具，也不影響戰鬥傷害計算。
// 這顆骰子現在改成玩家自己按按鈕才會真的丟（見 rollExpeditionRescue），
// 這個函式只負責「真的丟一次」，呼叫前應該已經用 isExpeditionRescueEligible 確認過資格。
function isExpeditionRescueEligible(p){
  ensureDiceInventory(p);
  const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
  return equippedIds.length >= DICE_EQUIP_SLOTS;
}
function rollExpeditionRescueDice(p){
  ensureDiceInventory(p);
  const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
  if(equippedIds.length < DICE_EQUIP_SLOTS) return {eligible:false, rescued:false, rolls:[]};
  const rolls = equippedIds.map(id => {
    const dice = p.dice[id];
    const faceIdx = Math.floor(Math.random() * 6);
    return {diceId: id, quality: dice.quality, face: dice.faces[faceIdx]};
  });
  const combo = computeNumberCombo(rolls);
  return {eligible:true, rescued: combo.tier === 'triple', rolls, comboTier: combo.tier};
}
// 領取遠征：先判定初判成功/失敗。初判失敗但玩家裝備滿 3 顆骰子時，先別結算，
// 把結算需要的所有資料存進 state.expeditionRescuePending（純前端記憶體，不落地存檔，
// 比照 state.streakBossEncounter 的作法——玩家中途離開/重新整理就視同放棄這次翻盤機會，
// 重新點「領取」會是全新的一次初判），等玩家自己按下「擲救援骰」（rollExpeditionRescue）
// 才會真的丟骰子；沒裝滿 3 顆骰子則直接照原本邏輯結算失敗，不會卡在半路。
async function claimExpedition(){
  const p = state.player;
  if(!p) return;
  ensureExpedition(p);
  const exp = p.expedition;
  if(!exp){ return; }
  if(Date.now() < exp.readyAt){ showToast(tt('遠征尚未歸來','The expedition hasn\'t returned yet')); return; }
  const tier = EXPEDITION_QUESTS.find(q=>q.id===exp.tierId);
  const variant = tier && tier.durations[exp.durationKey];
  if(!tier || !variant){
    p.expedition = null;
    await savePlayer(p);
    showToast(tt('這個遠征任務已被移除，卡牌無法退還','This expedition no longer exists - cards cannot be refunded'));
    render();
    return;
  }
  // 玩家沒點到的事件節點（逾時未處理）先用安全預設結算掉，效果會疊進 eventSuccessDelta/eventRewardPctDelta
  autoResolveTimedOutExpeditionEvents(p, exp);

  const risk = exp.risk || {successDelta:0, rewardMult:1, extraCardLossOnFail:0};
  const blessingCurse = exp.blessingCurse || null;
  const eventSuccessDelta = exp.eventSuccessDelta || 0;
  const eventRewardPctDelta = exp.eventRewardPctDelta || 0;
  // 🔥 連勝加成用「派遣當下」的連勝數（= 目前這趟結算前 p.expeditionStreak 的值，因為同時只能有一趟遠征在進行，
  // 這個計數在派遣後、這趟結算前不會被其他遠征變動過）
  const streakBefore = Math.max(0, p.expeditionStreak||0);

  // 🎲 最終成功率：既有家具加成 + 風險等級 + 局內祝福/詛咒 + 事件節點結果，全部疊加後夾在 0~100%
  const effectiveRate = Math.min(1, Math.max(0,
    variant.successRate
    + (exp.furnitureBonus||0)
    + (risk.successDelta||0)
    + (blessingCurse ? (blessingCurse.successDelta||0) : 0)
    + eventSuccessDelta
    + (exp.starChartSuccessBonus||0)
  ));
  const success = Math.random() < effectiveRate;
  const ctx = {tier, variant, risk, blessingCurse, eventSuccessDelta, eventRewardPctDelta, streakBefore, exp};

  if(!success && isExpeditionRescueEligible(p)){
    // 初判失敗、但裝滿 3 顆骰子有翻盤資格：先不結算、不動 p.expedition，等玩家自己按按鈕丟骰子。
    state.expeditionRescuePending = ctx;
    render();
    return;
  }
  await resolveExpeditionOutcome(p, ctx, success, null);
}
// 玩家按下「擲救援骰」才會真的丟這次骰子：播完擲骰動畫再繼續原本的成功/失敗結算流程
// （獎勵/經驗/連勝都正常計算），animating 旗標比照 attackStreakBoss 的作法，
// 擋掉動畫播放期間的整段重繪把 DOM 節點換掉、以及連點造成的重複結算。
async function rollExpeditionRescue(){
  const p = state.player;
  const pending = state.expeditionRescuePending;
  if(!p || !pending || state.expeditionRescueAnimating) return;
  if(!isExpeditionRescueEligible(p)){
    // 保險：按下按鈕前骰子被其他分頁卸下了，資格重新檢查一次沒過就直接照失敗結算。
    state.expeditionRescuePending = null;
    await resolveExpeditionOutcome(p, pending, false, null);
    return;
  }
  const btn = document.getElementById('expedition-rescue-btn');
  if(btn) btn.disabled = true;
  state.expeditionRescueAnimating = true;
  try{
    const rescue = rollExpeditionRescueDice(p);
    const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
    await playDiceRollAnimation(equippedIds.map(id => p.dice[id]), rescue, 'expedition-rescue-dice-anim', 'expedition-rescue-btn');
    state.expeditionRescuePending = null;
    const rescueNote = rescue.rescued
      ? tt(`🎲補骰逆轉！開出豹子（${rescue.rolls.map(r=>r.face.num).join('·')}），失敗轉成功`, `🎲Dice rescue! Rolled a Triple (${rescue.rolls.map(r=>r.face.num).join('·')}) — turned the failure into a success!`)
      : tt(`🎲補骰未中（${rescue.rolls.map(r=>r.face.num).join('·')}，沒開出豹子）`, `🎲Dice rescue attempt failed (${rescue.rolls.map(r=>r.face.num).join('·')}, no Triple)`);
    await resolveExpeditionOutcome(p, pending, rescue.rescued, rescueNote);
  } finally {
    state.expeditionRescueAnimating = false;
  }
}
// 實際結算遠征成功/失敗：把 claimExpedition 原本的完整結算邏輯搬到這裡，讓
// 「初判就成功」「初判失敗直接判負（沒有翻盤資格）」「補骰翻盤後才結算」三條路徑
// 共用同一份計算，只差 success 這個布林值跟要不要插入一行補骰結果的提示文字。
async function resolveExpeditionOutcome(p, ctx, success, rescueNote){
  const {tier, variant, risk, blessingCurse, eventSuccessDelta, eventRewardPctDelta, streakBefore, exp} = ctx;
  p.expedition = null;

  let msg;
  const bonusNotes = [];
  let streakBossEncounter = null; // 🐲 這次領獎若觸發連勝加碼 Boss 戰，存這裡供結尾交給 state 顯示
  if(rescueNote) bonusNotes.push(rescueNote);
  if(success){
    // 獎勵區間：⚔️武器/💍飾品(既有) + 🎴祝福獎勵區間 + 🗺️事件節點結果，先疊加成一個百分比套用在上下限，
    // 再乘上 🎲 風險等級倍率；💍飾品最後把下限往（疊加後的）上限拉近；成功後再套 🎴祝福/詛咒的成功獎勵倍率、🔥連勝加成。
    const weaponPct = exp.weaponRewardPct||0;
    const accessoryPct = exp.accessoryFloorPct||0;
    const blessingRangePct = blessingCurse ? (blessingCurse.rewardRangePctDelta||0) : 0;
    const riskMult = risk.rewardMult || 1;
    const totalRangePct = Math.max(-0.95, weaponPct + blessingRangePct + eventRewardPctDelta + (exp.starChartRewardBonus||0));
    const boostedMin = variant.rewardCoinsMin * (1 + totalRangePct) * riskMult;
    const boostedMax = variant.rewardCoinsMax * (1 + totalRangePct) * riskMult;
    const rangeMin = Math.min(boostedMin, boostedMax);
    const rangeMax = Math.max(boostedMin, boostedMax);
    const effectiveMin = Math.min(rangeMax, rangeMin + (rangeMax - rangeMin) * accessoryPct);
    let coins = effectiveMin + Math.random()*(rangeMax - effectiveMin);
    const successMult = blessingCurse ? (blessingCurse.successRewardMult||1) : 1;
    coins *= successMult;
    const streakBonusPct = Math.min(EXPEDITION_STREAK_BONUS_CAP, streakBefore * EXPEDITION_STREAK_BONUS_PER_WIN);
    coins *= (1 + streakBonusPct);
    coins = Math.max(0, Math.round(coins));
    p.coins = (p.coins||0) + coins;

    const expPct = blessingCurse ? (blessingCurse.expRewardPctDelta||0) : 0;
    const rewardExp = Math.max(0, Math.round(variant.rewardExp * (1 + expPct)));
    const leveled = applyExpeditionExpGain(p, rewardExp);
    // 🔥 只有「亡命」風險等級 + 8小時時長的遠征才計入連勝，其餘任務成功不影響連勝數
    if(exp.riskLevel === 'reckless' && exp.durationKey === 'd8h'){
      p.expeditionStreak = streakBefore + 1;
      p.expeditionRecklessStreak = (p.expeditionRecklessStreak||0) + 1;
      // 🐲 連勝達門檻後，每次成功回來都先進一段加碼 Boss 戰（純加碼，打輸不影響任何東西）。
      // 沒裝備骰子的話必輸，直接跳過不讓玩家看一段注定輸的動畫。
      if(p.expeditionStreak >= EXPEDITION_STREAK_BOSS_TRIGGER){
        ensureDiceInventory(p);
        const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
        if(equippedIds.length > 0){
          const hp = expeditionStreakBossHp(p.expeditionStreak);
          streakBossEncounter = {
            streak: p.expeditionStreak, hp, maxHp: hp,
            attacksLeft: EXPEDITION_STREAK_BOSS_ATTACKS, comboStreak: 0, dealt: 0,
          };
        }
      }
    }

    if(exp.furnitureBonus) bonusNotes.push(tt('🪑家具加成生效','🪑Furniture bonus applied'));
    if(weaponPct) bonusNotes.push(tt(`⚔️武器獎勵區間+${Math.round(weaponPct*100)}%`, `⚔️Weapon reward range +${Math.round(weaponPct*100)}%`));
    if(accessoryPct) bonusNotes.push(tt(`💍飾品拉近上限${Math.round(accessoryPct*100)}%`, `💍Accessory pulled ${Math.round(accessoryPct*100)}% toward max`));
    if(exp.riskLevel && exp.riskLevel !== 'standard') bonusNotes.push(tt(`🎲${EXPEDITION_RISK_LEVELS[exp.riskLevel]?.labelZh||exp.riskLevel}（獎勵×${riskMult}）`, `🎲${EXPEDITION_RISK_LEVELS[exp.riskLevel]?.labelEn||exp.riskLevel} (reward ×${riskMult})`));
    if(blessingCurse) bonusNotes.push(`${blessingCurse.icon}${tt(blessingCurse.labelZh, blessingCurse.labelEn)}`);
    if(eventRewardPctDelta) bonusNotes.push(tt(`🗺️遭遇加成${eventRewardPctDelta>=0?'+':''}${Math.round(eventRewardPctDelta*100)}%`, `🗺️Encounter bonus ${eventRewardPctDelta>=0?'+':''}${Math.round(eventRewardPctDelta*100)}%`));
    if(streakBonusPct > 0) bonusNotes.push(tt(`🔥連勝${streakBefore}次（獎勵+${Math.round(streakBonusPct*100)}%）`, `🔥${streakBefore}-win streak (reward +${Math.round(streakBonusPct*100)}%)`));
    const bonusSuffix = bonusNotes.length ? `（${bonusNotes.join('、')}）` : '';
    msg = tt(`🧭 遠征成功！獲得 ✦${coins} 金幣、經驗 +${rewardExp}${leveled ? `，遠征等級提升到 Lv.${p.expLevel}！` : ''}${bonusSuffix}`, `🧭 Expedition succeeded! +✦${coins} coins, +${rewardExp} exp${leveled ? `, expedition level up to Lv.${p.expLevel}!` : ''}${bonusSuffix}`);
  } else {
    // rescueNote（若有）已經在上面加進 bonusNotes 了，這裡不用重複判斷 rescue.eligible/rescued。
    // 🔥 連勝只在「亡命」風險等級 + 8小時時長成功時累計，但只要遠征失敗（不論風險等級／時長），連勝一律中斷歸零
    p.expeditionStreak = 0;
    p.expeditionRecklessStreak = 0;
    // 🛡️守護：帶出去的卡牌按比例退回一部分（原本全損，這裡按 type 各自四捨五入退回）
    // 守護效果可能來自出征當下選的 blessingCurse，也可能來自途中跟神秘商人多抽到的 extraBlessings，兩者需疊加（封頂100%）
    const extraKeepPct = (exp.extraBlessings||[]).reduce((s,c)=>s+(c.failCardKeepPct||0), 0);
    const keepPct = Math.min(1, (blessingCurse ? (blessingCurse.failCardKeepPct||0) : 0) + extraKeepPct);
    if(keepPct > 0 && exp.staked){
      let refundedTotal = 0;
      Object.keys(exp.staked).forEach(cid=>{
        const refund = Math.round(exp.staked[cid] * keepPct);
        if(refund > 0){
          p.cards[cid] = (p.cards[cid]||0) + refund;
          refundedTotal += refund;
        }
      });
      if(refundedTotal > 0) bonusNotes.push(tt(`🛡️守護保留${refundedTotal}張卡牌`, `🛡️Guardian kept ${refundedTotal} card(s)`));
    }
    // 🎲亡命/💀死亡契約：失敗時從現有庫存額外隨機扣卡（跟帶出去、已經全損的出征卡是分開的）
    const extraLoss = (risk.extraCardLossOnFail||0) + (blessingCurse ? (blessingCurse.failExtraCardLoss||0) : 0);
    if(extraLoss > 0){
      let actuallyLost = 0;
      for(let i=0;i<extraLoss;i++){
        const ownedIds = Object.keys(p.cards).filter(cid=>(p.cards[cid]||0) > 0);
        if(ownedIds.length===0) break;
        const pickId = ownedIds[Math.floor(Math.random()*ownedIds.length)];
        p.cards[pickId] -= 1;
        actuallyLost += 1;
      }
      if(actuallyLost > 0) bonusNotes.push(tt(`💀額外損失${actuallyLost}張隨機庫存卡`, `💀Lost ${actuallyLost} extra random card(s)`));
    }
    const expPct = blessingCurse ? (blessingCurse.expRewardPctDelta||0) : 0;
    const failExpVal = Math.max(0, Math.round(variant.failExp * (1 + expPct)));
    const leveled = applyExpeditionExpGain(p, failExpVal);
    const bonusSuffix = bonusNotes.length ? `（${bonusNotes.join('、')}）` : '';
    msg = tt(`⚠️ 遠征失敗了，帶出去的卡牌沒能收回，僅獲得經驗 +${failExpVal}${leveled ? `，遠征等級提升到 Lv.${p.expLevel}！` : ''}${bonusSuffix}`, `⚠️ The expedition failed - the cards you brought were lost, but you gained +${failExpVal} exp${leveled ? `, expedition level up to Lv.${p.expLevel}!` : ''}${bonusSuffix}`);
  }
  await savePlayer(p);
  showToast(msg);
  state.streakBossEncounter = streakBossEncounter; // null 就是沒觸發，正常清掉舊的殘留
  render();
}
// 🐲 連勝加碼 Boss 戰：每次點擊消耗 1 次攻擊機會，100% 沿用 rollDiceAttack 的傷害運算與
// playDiceRollAnimation 的動畫（傳自訂 DOM id 避免跟 Boss 分頁互相干擾）。純前端計算、
// 不落地存檔（state.streakBossEncounter 只存在記憶體），玩家中途離開視同放棄挑戰。
async function attackStreakBoss(){
  const p = state.player;
  const enc = state.streakBossEncounter;
  // 🐛 修正「骰子不會消失」：expeditionTickInterval 每秒會整段重繪遠征分頁（含這個
  // 面板），如果剛好在骰子動畫播放中間重繪，playDiceRollAnimation 正在操作的
  // #streak-boss-dice-anim 節點會被整個換掉——動畫自己收尾的 display:none 是作用在
  // 已經被換掉、玩家看不到的舊節點上，畫面上留著的新節點反而沒被控制到，於是骰子
  // 就卡在顯示最後一次的數字，直到下次點擊攻擊重新呼叫動畫才會被換掉，造成「按下
  // 一次攻擊前不會消失」的錯覺。用 state.streakBossAnimating 這個旗標讓計時器在動畫
  // 播放期間跳過那一秒的重繪（比照下面 isPickerActive 的作法），同時擋掉重繪出的
  // 按鈕還沒 disable 時被連點造成的重複攻擊。
  if(!p || !enc || enc.result || enc.attacksLeft <= 0 || state.streakBossAnimating) return;
  ensureDiceInventory(p);
  const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
  if(equippedIds.length === 0) return;
  const btn = document.getElementById('streak-boss-attack-btn');
  if(btn) btn.disabled = true;
  state.streakBossAnimating = true;
  try{
    const burst = rollDiceAttack(p, null, enc.comboStreak);
    await playDiceRollAnimation(equippedIds.map(id => p.dice[id]), burst, 'streak-boss-dice-anim', 'streak-boss-attack-btn');
    // 🔊 打擊感：跟大 Boss 那邊一樣，先記下「打之前」的血量%，畫面重繪後才知道要
    // 讓殘影條從哪裡開始追趕；hpAnimFrom 只是暫存在記憶體物件上，不落地存檔。
    enc.hpAnimFrom = Math.max(0, Math.min(100, (enc.hp/enc.maxHp)*100));
    enc.dealt += burst.damage;
    enc.hp = Math.max(0, enc.hp - burst.damage);
    enc.comboStreak = (burst.comboTier === 'pair' || burst.comboTier === 'triple') ? enc.comboStreak + 1 : 0;
    enc.attacksLeft -= 1;
    // 🔥 每一擊的傷害數字都留在面板上（不只是骰子動畫裡一閃而過的徽章），戰鬥結束後
    // 也保留在畫面上讓玩家看清楚結果，不自動關閉——需要玩家自己按「關閉」才會清掉。
    enc.lastDamage = burst.damage;
    enc.lastComboTier = burst.comboTier;
    enc.lastCrit = burst.isCrit;
    // 🎲 連同完整擲骰結果一起存下來，讓遠征分頁每秒重繪時能把骰子畫面原樣重畫出來
    // （見下面 render 模板的 renderSettledDiceHtml），不會只剩文字紀錄。
    enc.lastRolls = burst.rolls;
    enc.lastQualityComboTier = burst.qualityComboTier;
    enc.lastAllWild = burst.allWild;
    // 🔊 打擊感：骰子動畫本身只會停留 0.45~0.75 秒（跟大 Boss 那邊的 playDiceRollAnimation
    // 完全共用同一段計時），大 Boss 之所以感覺比較重，其實是因為它額外跳了一則 showToast
    // （至少 2.2 秒起跳，見 toastDurationForMsg），把「這一擊」的回饋延續下去。連勝加碼 Boss
    // 之前完全沒呼叫 showToast，畫面上只剩那行小字，動畫一收就像沒打到一樣。這裡補上同款
    // toast，讓兩邊的打擊感一致。
    const diceTag = burst.rolls.map(r => r.face.num).join('·');
    const bonusTags = [];
    if(burst.allWild) bonusTags.push(tt('🎉萬能三連','🎉Triple Wild'));
    if(burst.comboTier === 'triple') bonusTags.push(tt('🎯豹子×2','🎯Triple×2'));
    else if(burst.comboTier === 'pair') bonusTags.push(tt(`✌️對子×${DICE_COMBO_MULT.pair}`, `✌️Pair×${DICE_COMBO_MULT.pair}`));
    if(burst.qualityComboTier === 'triple') bonusTags.push(tt(`🔷品質豹子×${DICE_QUALITY_COMBO_MULT.triple}`, `🔷Quality Triple×${DICE_QUALITY_COMBO_MULT.triple}`));
    else if(burst.qualityComboTier === 'pair') bonusTags.push(tt(`🔷品質對子×${DICE_QUALITY_COMBO_MULT.pair}`, `🔷Quality Pair×${DICE_QUALITY_COMBO_MULT.pair}`));
    if(burst.comboStreakBonus > 0) bonusTags.push(tt(`🔥連擊+${Math.round(burst.comboStreakBonus*100)}%`, `🔥Streak+${Math.round(burst.comboStreakBonus*100)}%`));
    if(burst.isCrit) bonusTags.push(tt('💥暴擊','💥Crit'));
    const bonusStr = bonusTags.length ? `（${bonusTags.join('、')}）` : '';
    if(enc.hp <= 0){
      const essence = expeditionStreakBossEssenceReward(enc.streak);
      const coins = expeditionStreakBossCoinReward(enc.streak);
      ensureMaterials(p);
      p.materials.diceEssence = (p.materials.diceEssence||0) + essence;
      p.coins = (p.coins||0) + coins;
      await savePlayer(p);
      enc.result = 'win';
      enc.essence = essence;
      enc.coins = coins;
      showToast(tt(`🐲 擲出 ${diceTag}，造成 ${burst.damage.toLocaleString()} 傷害！${bonusStr}　擊退成功！獲得 💠${essence}、✦${coins}`, `🐲 Rolled ${diceTag}, dealt ${burst.damage.toLocaleString()} damage!${bonusStr}  Boss repelled! Gained 💠${essence}, ✦${coins}`));
    } else if(enc.attacksLeft <= 0){
      enc.result = 'lose';
      showToast(tt(`🐲 擲出 ${diceTag}，造成 ${burst.damage.toLocaleString()} 傷害！${bonusStr}　沒能擊退，下次連勝再挑戰吧`, `🐲 Rolled ${diceTag}, dealt ${burst.damage.toLocaleString()} damage!${bonusStr}  Could not repel it - try again next streak`));
    } else {
      showToast(tt(`🐲 擲出 ${diceTag}，造成 ${burst.damage.toLocaleString()} 傷害！${bonusStr}`, `🐲 Rolled ${diceTag}, dealt ${burst.damage.toLocaleString()} damage!${bonusStr}`));
    }
  } finally {
    state.streakBossAnimating = false;
  }
  render();
}
function dismissStreakBossEncounter(){

// itemId: 'potion_small' 或 'potion_medium' —— 兩種藥水可在同一趟遠征混用，各自扣自己的庫存，縮短的分鐘數直接疊加
async function usePotionOnExpedition(itemId){
  itemId = itemId === 'potion_medium' ? 'potion_medium' : 'potion_small';
  const minutesPerPotion = itemId === 'potion_medium' ? POTION_MEDIUM_EXPEDITION_MINUTES : POTION_EXPEDITION_MINUTES;
  const potionLabel = itemId === 'potion_medium' ? tt('中藥水','Medium Potion') : tt('小藥水','Small Potion');
  const p = state.player;
  if(!p) return;
  ensureExpedition(p);
  ensureProfession(p);
  const exp = p.expedition;
  if(!exp){ showToast(tt('目前沒有進行中的遠征','No expedition in progress')); return; }
  if(Date.now() >= exp.readyAt){ showToast(tt('遠征已經可以領取了','The expedition is already ready to claim')); return; }
  if(exp.blessingCurse && exp.blessingCurse.blockPotion){ showToast(tt('🚫封印生效中，這趟遠征無法使用藥水縮時','🚫Sealed - Potions can\'t be used to shorten this run')); return; }
  if((p.professionItems[itemId]||0) < 1){ showToast(tt(`沒有${potionLabel}`, `No ${potionLabel}`)); return; }
  const reduceMs = minutesPerPotion * 60 * 1000;
  const floorAt = Date.now() + POTION_EXPEDITION_MIN_REMAIN_MINUTES * 60 * 1000;
  if(exp.readyAt <= floorAt){
    showToast(tt(`剩餘時間已經接近下限（${POTION_EXPEDITION_MIN_REMAIN_MINUTES} 分鐘），無法再縮短`, `Remaining time is already near the floor (${POTION_EXPEDITION_MIN_REMAIN_MINUTES} min) - can't shorten further`));
    return;
  }
  p.professionItems[itemId] -= 1;
  const prevReadyAt = exp.readyAt;
  exp.readyAt = Math.max(floorAt, exp.readyAt - reduceMs);
  shiftUnresolvedExpeditionEventTriggers(exp, prevReadyAt - exp.readyAt);
  exp.potionMinutesUsed = (exp.potionMinutesUsed||0) + minutesPerPotion;
  await savePlayer(p);
  const nowReady = Date.now() >= exp.readyAt;
  showToast(nowReady
    ? tt(`🧪 已使用${potionLabel}，遠征剩餘時間已縮短完畢，可以領取了！`, `🧪 Used a ${potionLabel} - remaining time is up, the expedition is ready to claim!`)
    : tt(`🧪 已使用${potionLabel}，遠征剩餘時間 -${minutesPerPotion} 分鐘`, `🧪 Used a ${potionLabel}, expedition time -${minutesPerPotion} min`));
  render();
}
// 派遣前的「風險等級 + 翻牌選祝福/詛咒」UI，只在 p.expLevel >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL 時渲染

      ? tt('成功率不變','Success unchanged')
      : tt(`成功率${v.successDelta*100>0?'+':''}${Math.round(v.successDelta*100)}%`, `Success ${v.successDelta*100>0?'+':''}${Math.round(v.successDelta*100)}%`);
    const failTxt = v.extraCardLossOnFail>0 ? tt('・失敗多損1張卡','・+1 card lost on fail') : '';
    return `<button type="button" class="btn small ${active?'':'secondary'}" data-rogue-risk-uid="${uid}" data-rogue-risk-key="${key}" style="flex:1;min-width:96px;line-height:1.5;">

          <div>${c.icon} ${tt(c.labelZh, c.labelEn)}${isCurse?tt('（詛咒）','(Curse)'):tt('（祝福）','(Blessing)')}</div>
          <div style="font-size:10px;opacity:0.85;">${tt(c.descZh, c.descEn)}</div>
        </button>`;
      }).join('')}
    </div>`;
  }

  return `<div style="border:1px dashed var(--line);border-radius:8px;padding:8px;margin-top:8px;">
    <div class="farm-upgrade-line" style="color:var(--gold-bright);">🎲 ${tt('風險等級','Risk Level')}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">${riskButtons}</div>
    <div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <button type="button" class="btn small secondary" data-rogue-draw-uid="${uid}">🎴 ${tt('翻牌（抽3張，選1張帶著出征）','Draw Cards (draw 3, pick 1 to bring)')}</button>
      ${(draft.drawnCards && draft.selectedIdx===null) ? `<span style="font-size:11px;color:var(--muted);">${tt('請從下方選 1 張','Pick 1 card below')}</span>` : ''}
      ${!draft.drawnCards ? `<span style="font-size:11px;color:var(--muted);">${tt('翻牌並選好效果卡後才能出征','Draw and pick a card before you can dispatch')}</span>` : ''}
    </div>
    ${cardsHtml}

// 選擇型事件節點的互動面板：列出這個節點的所有選項，庫存/金幣不足的選項會被鎖住不能點
function renderExpeditionEventChoicePanel(p, event){
  const def = EXPEDITION_CHOICE_EVENT_POOL.find(e=>e.id===event.eventId);
  if(!def) return '';
  const optionsHtml = def.options.map(opt=>{
    const itemQty = opt.requiresItem ? (p.professionItems[opt.requiresItem]||0) : null;
    const lackItem = opt.requiresItem && itemQty < (opt.itemCost||1);
    const lackCoins = opt.coinsCost && (p.coins||0) < opt.coinsCost;
    const disabled = lackItem || lackCoins;
    const costNotes = [];
    if(opt.requiresItem) costNotes.push(tt(`需${opt.itemCost||1}件庫存（現有${itemQty}）`, `Needs ${opt.itemCost||1} in stock (have ${itemQty})`));
    if(opt.coinsCost) costNotes.push(tt(`需${opt.coinsCost}金幣`, `Needs ${opt.coinsCost} coins`));
    return `<button type="button" class="btn small secondary" data-rogue-event-idx="${event.idx}" data-rogue-event-option="${opt.id}" ${disabled?'disabled':''} style="flex:1;min-width:150px;text-align:left;line-height:1.5;${disabled?'opacity:0.5;':''}">
      <div>${tt(opt.labelZh, opt.labelEn)}</div>
      <div style="font-size:10px;opacity:0.85;">${tt(opt.descZh, opt.descEn)}</div>
      ${costNotes.length ? `<div style="font-size:10px;color:var(--danger);">${costNotes.join('・')}</div>` : ''}
    </button>`;
  }).join('');
  return `<div class="panel" style="border:1px solid var(--gold-bright);">
    <h2>${def.icon} ${tt(def.labelZh, def.labelEn)}</h2>
    <p class="sub">${tt('遠征途中遇到了狀況，選一個應對方式：','Something happened along the way — pick how to respond:')}</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">${optionsHtml}</div>
  </div>`;
}
// 遭遇紀錄裡每個已處理事件的一行摘要
function expeditionEventLogLine(event){
  if(event.kind === 'combat'){
    const def = EXPEDITION_COMBAT_EVENT_POOL.find(e=>e.id===event.eventId);
    const r = event.result || {};
    const pctTxt = `${r.rewardPctDelta>0?'+':''}${Math.round((r.rewardPctDelta||0)*100)}%`;
    return `${def?def.icon:'⚔️'} ${tt(def?def.labelZh:event.eventId, def?def.labelEn:event.eventId)}：${r.win ? tt(`獲勝（獎勵${pctTxt}）`,`Won (reward ${pctTxt})`) : tt(`落敗（獎勵${pctTxt}）`,`Lost (reward ${pctTxt})`)}`;
  }
  const def = EXPEDITION_CHOICE_EVENT_POOL.find(e=>e.id===event.eventId);
  const opt = def && def.options.find(o=>o.id===event.chosenOptionId);
  const autoTag = event.autoResolved ? tt('（逾時自動）','（timed out）') : '';
  const drawnIds = (event.result && event.result.extraBlessingIds) || [];
  const drawnTxt = drawnIds.length
    ? '　→　' + drawnIds.map(cid=>{
        const c = EXPEDITION_BLESSING_CURSE_POOL.find(x=>x.id===cid);
        return c ? `${c.icon}${tt(c.labelZh, c.labelEn)}` : cid;
      }).join('、')
    : '';
  return `${def?def.icon:'❓'} ${tt(def?def.labelZh:event.eventId, def?def.labelEn:event.eventId)}：${opt ? tt(opt.labelZh, opt.labelEn) : '-'}${autoTag}${drawnTxt}`;
}
// 遠征頁很多互動（選風險等級、翻牌、選卡）都只是改 draft 狀態、跟家具/武器/飾品的選擇無關，
// 但這些互動的 onclick 直接呼叫 render() 整段重繪，原生 <select>/<checkbox> 會被換成全新 DOM、
// 值重設回預設 —— 所以呼叫前先記住目前的選擇，重繪後再還原（跟下面 expeditionTickInterval 用的是同一招）。
async function renderPreservingExpeditionItemInputs(){
  const savedSelects = Array.from(document.querySelectorAll('select[id^="furniture-sel-"], select[id^="accessory-sel-"], select[id^="weapon-sel-"]')).map(el=>({id: el.id, value: el.value}));
  await render();
  savedSelects.forEach(({id, value})=>{
    const el = document.getElementById(id);
    if(el && !el.disabled && Array.from(el.options).some(o=>o.value===value)) el.value = value;
  });
}
async function renderExpedition(body){
  const p = state.player;
  ensureExpedition(p);
  ensureProfession(p);
  const now = Date.now();
  const exp = p.expedition;
  // 階段三：戰鬥型事件節點不需要玩家操作，時間一到就自動判定，這裡先掃一輪，有變更才存檔
  if(exp && Array.isArray(exp.events) && exp.events.length){
    let eventsChanged = false;
    exp.events.forEach(ev=>{
      if(!ev.resolved && now >= ev.triggerAt && ev.kind === 'combat'){
        autoResolveExpeditionCombatEvent(p, ev);
        eventsChanged = true;
      }
    });
    if(eventsChanged) await savePlayer(p);
  }
  const nextExp = expeditionNextLevelExp(p.expLevel);
  const curExpBase = EXP_TABLE[p.expLevel] || 0;
  const isMaxExpLevel = p.expLevel >= EXP_MAX_LEVEL;
  const pct = isMaxExpLevel ? 100 : Math.max(0, Math.min(100, ((p.expExp-curExpBase)/(nextExp-curExpBase))*100));

  let html = `<div class="panel" style="padding:0;overflow:hidden;">
    <img src="${EXPEDITION_BANNER_IMG}" alt="${tt('遠征','Expedition')}" style="display:block;width:100%;height:auto;max-height:220px;object-fit:cover;object-position:center 30%;" />
  </div>
  <div class="panel">
    <h2>🧭 ${tt('遠征','Expedition')}</h2>
    <p class="sub">${tt('派人出征，等待一段時間後回來領取金幣與經驗。每個等級都可以選擇 10分鐘／1小時／3小時／8小時 四種時長，時長越長獎勵越豐厚、但成功率略低。每個任務所需的出征卡牌由系統隨機指定（並非玩家自行挑選），沒有指定的卡牌可以到拍賣行收購。等級越高能接更好的任務，需要的卡牌也越多。','Send an expedition and wait for it to return for coins and exp. Each level offers 4 duration choices — 10 min / 1 hour / 3 hours / 8 hours — longer runs pay more but succeed slightly less often. The cards each quest needs are randomly assigned by the system (not freely chosen by the player) - buy any you\'re missing from the Auction House. Higher levels unlock better quests that need more cards.')}</p>
    <div class="countdown" style="margin-bottom:6px;">${tt(`遠征等級 Lv.${p.expLevel}`, `Expedition Level Lv.${p.expLevel}`)}${isMaxExpLevel ? tt('（已滿級）','(Max Level)') : ''}</div>
    ${isMaxExpLevel ? '' : `
      <div style="background:var(--bg-panel-raised, rgba(255,255,255,0.06));border-radius:999px;height:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:4px;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg, var(--violet), var(--gold));"></div>
      </div>
      <div class="countdown" style="font-size:11px;">${tt(`經驗 ${p.expExp} / ${nextExp}`, `Exp ${p.expExp} / ${nextExp}`)}</div>
    `}
    ${(p.expeditionStreak||0) > 0 ? `<div class="countdown" style="font-size:11px;color:var(--gold-bright);margin-top:2px;">${tt(`🔥連勝 ${p.expeditionStreak} 次（下趟成功時獎勵加成 +${Math.round(Math.min(EXPEDITION_STREAK_BONUS_CAP, p.expeditionStreak*EXPEDITION_STREAK_BONUS_PER_WIN)*100)}%）`, `🔥${p.expeditionStreak}-win streak (next success reward +${Math.round(Math.min(EXPEDITION_STREAK_BONUS_CAP, p.expeditionStreak*EXPEDITION_STREAK_BONUS_PER_WIN)*100)}%)`)}</div>` : ''}
    ${(p.expLevel||0) >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL ? `<div class="countdown" style="font-size:11px;margin-top:2px;">${tt('🔥僅「亡命」風險等級＋8小時遠征才計入連勝次數', '🔥Only Reckless risk + 8-hour expeditions count toward the win streak')}</div>` : ''}
  </div>`;

  // 🐲 連勝加碼 Boss 戰：純前端記憶體狀態，跟 exp 進行中／可領取無關，優先顯示在最上面
  const enc = state.streakBossEncounter;
  if(enc){
    const hpPct = Math.max(0, Math.min(100, (enc.hp/enc.maxHp)*100));
    let lastHitLine = '';
    if(enc.lastDamage != null){
      const tags = [];
      if(enc.lastComboTier === 'triple') tags.push(tt('🎯豹子','🎯Triple'));
      else if(enc.lastComboTier === 'pair') tags.push(tt('✌️對子','✌️Pair'));
      if(enc.lastCrit) tags.push(tt('💥暴擊','💥Crit'));
      const tagSuffix = tags.length ? `（${tags.join('、')}）` : '';
      lastHitLine = `<div class="countdown" style="color:var(--gold-bright);margin-bottom:6px;">${tt(`⚔️ 本次造成 ${enc.lastDamage} 傷害${tagSuffix}`, `⚔️ Dealt ${enc.lastDamage} damage${tagSuffix}`)}</div>`;
    }
    let resultLine = '';
    let controls = `<button class="btn" id="streak-boss-attack-btn">${tt(`⚔️ 攻擊（剩 ${enc.attacksLeft} 次）`, `⚔️ Attack (${enc.attacksLeft} left)`)}</button>`;
    if(enc.result === 'win'){
      resultLine = `<div class="countdown" style="color:var(--gold-bright);margin-bottom:10px;">${tt(`🐲 擊退成功！獲得 💠骰子精華 +${enc.essence}、✦${enc.coins} 金幣`, `🐲 Boss repelled! Gained 💠Dice Essence +${enc.essence}, ✦${enc.coins} coins`)}</div>`;
      controls = `<button class="btn small secondary" id="streak-boss-dismiss-btn">${tt('關閉','Close')}</button>`;
    } else if(enc.result === 'lose'){
      resultLine = `<div class="countdown" style="margin-bottom:10px;">${tt('🐲 這次沒能擊退，下次連勝再挑戰吧（連勝與遠征獎勵不受影響）','🐲 Could not repel it this time - try again next streak (your streak and expedition reward are unaffected)')}</div>`;
      controls = `<button class="btn small secondary" id="streak-boss-dismiss-btn">${tt('關閉','Close')}</button>`;
    }
    html += `<div class="panel">
      <h2>🐲 ${tt('連勝加碼挑戰','Streak Bonus Boss')}</h2>
      <p class="sub">${tt(`連勝 ${enc.streak} 場，遭遇強敵！用裝備的骰子攻擊，總傷害打光血量即可擊退，獲得額外骰子精華。打輸完全不影響連勝與遠征獎勵。`, `${enc.streak}-win streak - a strong foe appears! Attack with your equipped dice. Deplete its HP to repel it for bonus Dice Essence. Losing doesn't affect your streak or expedition reward at all.`)}</p>
      <div id="streak-hp-track" style="position:relative;background:var(--bg-panel-raised, rgba(255,255,255,0.06));border-radius:999px;height:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:4px;">
        <div id="streak-hp-ghost" class="hp-bar-ghost" style="width:${hpPct}%;"></div>
        <div id="streak-hp-fill" class="hp-bar-fill" style="width:${hpPct}%;background:linear-gradient(90deg, var(--danger), var(--gold));"></div>
      </div>
      <div class="countdown" style="font-size:11px;margin-bottom:10px;">${tt(`HP ${enc.hp} / ${enc.maxHp}`, `HP ${enc.hp} / ${enc.maxHp}`)}</div>
      ${lastHitLine}
      ${resultLine}
      <!-- 🎲 同樣道理：有上次擲骰結果就直接畫出來、保持可見，每秒重繪（見上面
           expeditionTickInterval 的 streakBossAnimating 判斷）不會再把它清空。 -->
      <div id="streak-boss-dice-anim" class="dice-roll-anim" style="${enc.lastRolls ? '' : 'display:none;'}">${enc.lastRolls ? renderSettledDiceHtml(enc.lastRolls, enc.lastComboTier, enc.lastQualityComboTier, enc.lastAllWild, enc.lastCrit) : ''}</div>
      ${controls}
    </div>`;
  }

  if(exp){
    const tier = EXPEDITION_QUESTS.find(q=>q.id===exp.tierId);
    const ready = now >= exp.readyAt;
    // 🎲 補骰翻盤面板：純前端記憶體狀態（見 claimExpedition/rollExpeditionRescue 說明），
    // 只要 pending 存在就代表初判已經失敗、正在等玩家自己按按鈕丟救援骰，優先於一般的「領取」按鈕顯示。
    const rescuePending = state.expeditionRescuePending;
    const stakedLines = Object.keys(exp.staked||{}).map(cid=>{
      const c = DECK_BY_ID[cid];
      return c ? `${c.icon||''} ${escapeHtml(c.name)} ×${exp.staked[cid]}` : `${cid} ×${exp.staked[cid]}`;
    }).join('　');
    const inProgressLabel = tier ? `：${expeditionTierLabel(tier)}・${expeditionDurationLabel(exp.durationKey)}` : '';
    const variant = tier && tier.durations ? tier.durations[exp.durationKey] : null;
    let variantLine = '';
    if(variant){
      // 只套用「出征當下就已固定」的加成（家具/武器/飾品/風險等級/祝福詛咒），
      // 尚未觸發的遭遇事件節點效果無法預知，故不計入，顯示為「大概」估計值。
      const risk = exp.risk || {successDelta:0, rewardMult:1};
      const blessingCurse = exp.blessingCurse || null;
      const effRate = Math.min(1, Math.max(0,
        variant.successRate
        + (exp.furnitureBonus||0)
        + (risk.successDelta||0)
        + (blessingCurse ? (blessingCurse.successDelta||0) : 0)
        + (exp.starChartSuccessBonus||0)
      ));
      const weaponPct = exp.weaponRewardPct||0;
      const accessoryPct = exp.accessoryFloorPct||0;
      const blessingRangePct = blessingCurse ? (blessingCurse.rewardRangePctDelta||0) : 0;
      const riskMult = risk.rewardMult || 1;
      const totalRangePct = Math.max(-0.95, weaponPct + blessingRangePct + (exp.starChartRewardBonus||0));
      const boostedMin = variant.rewardCoinsMin * (1 + totalRangePct) * riskMult;
      const boostedMax = variant.rewardCoinsMax * (1 + totalRangePct) * riskMult;
      const rangeMin = Math.min(boostedMin, boostedMax);
      const rangeMax = Math.max(boostedMin, boostedMax);
      const effMin = Math.round(Math.min(rangeMax, rangeMin + (rangeMax - rangeMin) * accessoryPct));
      const effMax = Math.round(rangeMax);
      const rescueEligible = p.diceSlots.filter(id => id && p.dice[id]).length >= DICE_EQUIP_SLOTS;
      variantLine = `<p class="sub">🎲 ${tt(`成功率約 ${Math.round(effRate*100)}%`, `~${Math.round(effRate*100)}% success`)}　✦ ${tt(`預估獎勵 ${effMin}–${effMax} 金幣、經驗 +${variant.rewardExp}`, `Est. reward ${effMin}-${effMax} coins, +${variant.rewardExp} exp`)}<br><span style="font-size:11px;color:var(--muted);">${tt('（未包含尚未觸發的遭遇事件效果）','(excludes effects from encounter events not yet triggered)')}</span>${rescueEligible ? `<br><span style="font-size:11px;color:var(--gold-bright);">${tt('🎲已裝備滿 3 顆骰子：若失敗會多一次翻盤機會，自己按按鈕丟救援骰，開出豹子直接逆轉成功','🎲3 dice equipped: on failure you get one more chance — click to roll the rescue die yourself, a Triple turns it into a success')}</span>` : ''}</p>`;
    }
    const potionQty = p.professionItems.potion_small||0;
    const potionMediumQty = p.professionItems.potion_medium||0;
    const rogueLine = (exp.riskLevel && exp.riskLevel !== 'standard') || exp.blessingCurse
      ? `<p class="sub">${exp.riskLevel && exp.riskLevel!=='standard' ? tt(`🎲 風險：${EXPEDITION_RISK_LEVELS[exp.riskLevel]?.labelZh||exp.riskLevel}　`, `🎲 Risk: ${EXPEDITION_RISK_LEVELS[exp.riskLevel]?.labelEn||exp.riskLevel}　`) : ''}${exp.blessingCurse ? `${exp.blessingCurse.icon} ${tt(exp.blessingCurse.labelZh, exp.blessingCurse.labelEn)}` : ''}</p>`
      : '';
    // 階段三：遭遇紀錄（已處理的事件節點）
    const resolvedEvents = (exp.events||[]).filter(ev=>ev.resolved);
    const eventLogHtml = resolvedEvents.length
      ? `<div class="farm-upgrade-line" style="color:var(--muted);margin-top:6px;">${tt('🗺️ 遭遇紀錄','🗺️ Encounter Log')}</div>${resolvedEvents.map(ev=>`<div class="farm-upgrade-line" style="font-size:11px;">${expeditionEventLogLine(ev)}</div>`).join('')}`
      : '';
    html += `<div class="panel">
      <h2>${tt('進行中的遠征','Expedition In Progress')}${inProgressLabel}</h2>
      <p class="sub">${tt('帶出去的卡牌','Cards brought along')}：${stakedLines}</p>
      ${variantLine}
      ${rogueLine}
      ${rescuePending
        ? `<div class="countdown" style="color:var(--gold-bright);margin-bottom:6px;">${tt('🎲 初判失敗了，但你裝滿了 3 顆骰子——還有一次翻盤機會！開出「豹子」（3 顆同號，萬能面可搭配湊數）就能把這次失敗逆轉成功。','🎲 The first roll failed, but you have all 3 dice slots equipped — one more shot! Roll a Triple (3 matching numbers, Wild faces count) to turn this failure into a success.')}</div>
           <div id="expedition-rescue-dice-anim" class="dice-roll-anim" style="display:none;"></div>
           <button class="btn" id="expedition-rescue-btn">${tt('🎲 擲救援骰','🎲 Roll Rescue Dice')}</button>`
        : ready
        ? `<div class="countdown" style="color:var(--gold-bright);margin-bottom:10px;">${tt('遠征已歸來！','The expedition has returned!')}</div>
           <button class="btn" id="expedition-claim-btn">${tt('領取遠征成果','Claim Expedition Result')}</button>`
        : (exp.blessingCurse && exp.blessingCurse.blockPotion)
          ? `<div class="countdown" style="margin-bottom:10px;">${tt(`還需 ${formatDuration(exp.readyAt-now)}`, `${formatDuration(exp.readyAt-now)} remaining`)}</div>
             <button class="btn small secondary" disabled style="opacity:0.5;">${tt('🚫 封印生效中，無法使用藥水','🚫 Sealed - Potions unavailable')}</button>`
          : `<div class="countdown" style="margin-bottom:10px;">${tt(`還需 ${formatDuration(exp.readyAt-now)}`, `${formatDuration(exp.readyAt-now)} remaining`)}</div>
             <div style="display:flex;flex-wrap:wrap;gap:8px;">
               <button class="btn small secondary" id="expedition-use-potion-btn" data-potion-item="potion_small" ${potionQty>0?'':'disabled'} style="${potionQty>0?'':'opacity:0.5;'}">${tt(`🧪 使用小藥水（-${POTION_EXPEDITION_MINUTES}分鐘，庫存 ${potionQty}）`, `🧪 Use Small Potion (-${POTION_EXPEDITION_MINUTES}min, stock ${potionQty})`)}</button>
               <button class="btn small secondary" id="expedition-use-potion-medium-btn" data-potion-item="potion_medium" ${potionMediumQty>0?'':'disabled'} style="${potionMediumQty>0?'':'opacity:0.5;'}">${tt(`🧪 使用中藥水（-${POTION_MEDIUM_EXPEDITION_MINUTES}分鐘，庫存 ${potionMediumQty}）`, `🧪 Use Medium Potion (-${POTION_MEDIUM_EXPEDITION_MINUTES}min, stock ${potionMediumQty})`)}</button>
             </div>`
      }
      ${eventLogHtml}
    </div>`;
    // 階段三：尚未處理、時間已到的「選擇型」節點——無論遠征是否已經「可領取」都要顯示，
    // 讓玩家有機會互動（喝藥水縮時、或單純太晚回來查看，都可能讓 ready 早於節點觸發時間）
    const pendingChoiceEvent = (exp.events||[]).find(ev=>!ev.resolved && now>=ev.triggerAt && ev.kind==='choice');
    if(pendingChoiceEvent) html += renderExpeditionEventChoicePanel(p, pendingChoiceEvent);
  } else {
    // 升級後只顯示「當前等級」對應的那個任務（已解鎖任務中，解鎖門檻最高的一個），
    // 較低等級、已經超越的任務不再顯示。
    const eligible = EXPEDITION_QUESTS.filter(q=>(p.expLevel||0) >= q.unlockLevel);
    const currentTier = eligible.length ? eligible.reduce((a,b)=> b.unlockLevel > a.unlockLevel ? b : a) : null;
    const unlocked = currentTier ? [currentTier] : [];
    const locked = EXPEDITION_QUESTS.filter(q=> !currentTier || q.unlockLevel > currentTier.unlockLevel);

    // 為每個已解鎖的任務＋時長組合準備（必要時重新產生）系統指定的出征卡牌
    let rollsChanged = false;
    const tierDurationCards = {};
    unlocked.forEach(tier=>{
      tierDurationCards[tier.id] = {};
      EXPEDITION_DURATION_KEYS.forEach(durKey=>{
        const {cards, changed} = getExpeditionRequiredCards(p, tier, durKey);
        tierDurationCards[tier.id][durKey] = cards;
        if(changed) rollsChanged = true;
      });
    });
    if(rollsChanged) await savePlayer(p);

    html += `<div class="panel"><h2>${tt('可出征的任務','Available Expeditions')}</h2>
      <div class="farm-upgrade-line" style="color:var(--muted);">${tt('出征前可選用職業成品加成這一趟：🪑家具提升成功率、⚔️武器提升獎勵區間、💍飾品讓獎勵更容易貼近上限。', 'Before dispatch you can use profession items to boost this run: 🪑Furniture raises success rate, ⚔️Weapon raises the reward range, 💍Accessory makes rewards more likely to land near the max.')}</div>`;
    if(unlocked.length===0){
      html += `<div class="empty-note">${tt('目前沒有已解鎖的任務','No unlocked expeditions yet')}</div>`;
    } else {
      unlocked.forEach(tier=>{
        html += `<div class="farm-upgrade-box" style="margin-bottom:12px;">
          <div class="farm-upgrade-title">${expeditionTierLabel(tier)}</div>`;
        EXPEDITION_DURATION_KEYS.forEach(durKey=>{
          const variant = tier.durations[durKey];
          const cards = (tierDurationCards[tier.id] && tierDurationCards[tier.id][durKey]) || [];
          const canAfford = cards.every(cid=>(p.cards[cid]||0) >= 1);
          html += `<div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;">
            <div class="farm-upgrade-line" style="color:var(--gold-bright);">⏱ ${expeditionDurationLabel(durKey)}</div>
            <div class="farm-upgrade-line" style="color:var(--muted);">${tt('本次系統指定的出征卡牌：','Cards the system has assigned for this run:')}</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;">
              ${cards.map(cid=>{
                const c = DECK_BY_ID[cid];
                const have = (p.cards[cid]||0) >= 1;
                return `<div style="display:flex;align-items:center;gap:6px;background:var(--bg-panel-raised);border:1px solid ${have?'var(--line)':'var(--danger)'};border-radius:8px;padding:5px 9px;font-size:12px;">
                  <span style="color:${have?'#7ec98f':'var(--danger)'};">${have?'✓':'✗'}</span> ${c?(c.icon||''):''} ${escapeHtml(c?c.name:cid)}
                </div>`;
              }).join('')}
            </div>
            <div class="farm-upgrade-line">🎲 ${tt(`成功率 ${Math.round(variant.successRate*100)}%`, `Success ${Math.round(variant.successRate*100)}%`)}</div>
            <div class="farm-upgrade-line">✦ ${tt(`獎勵 ${variant.rewardCoinsMin}–${variant.rewardCoinsMax} 金幣、經驗 +${variant.rewardExp}`, `Reward ${variant.rewardCoinsMin}-${variant.rewardCoinsMax} coins, +${variant.rewardExp} exp`)}</div>
            ${canAfford ? (()=>{
              const uid = `${tier.id}-${durKey}`;
              const furnitureQty = p.professionItems.furniture_common||0;
              const furnitureUncommonQty = p.professionItems.furniture_uncommon||0;
              const weaponQty = p.professionItems.weapon_common||0;
              const weaponUncommonQty = p.professionItems.weapon_uncommon||0;
              const accessoryQty = p.professionItems.accessory_common||0;
              const accessoryUncommonQty = p.professionItems.accessory_uncommon||0;
              // 家具／飾品：common 與 uncommon 互斥堆疊（不可混插），用單一 select 以 "tier:count" 編碼避免同時選兩層
              const furnitureOptions = `<option value="">${tt('不使用','None')}</option>` +
                Array.from({length: Math.min(FURNITURE_MAX_STACK, furnitureQty)}, (_,i)=>i+1).map(n=>{
                  const bonus = Math.round(FURNITURE_SUCCESS_TIERS.slice(0,n).reduce((s,v)=>s+v,0)*100);
                  return `<option value="common:${n}">${tt(`${n} 件・common（成功率 +${bonus}%）`, `${n}・Common (success +${bonus}%)`)}</option>`;
                }).join('') +
                Array.from({length: Math.min(FURNITURE_MAX_STACK, furnitureUncommonQty)}, (_,i)=>i+1).map(n=>{
                  const bonus = Math.round(FURNITURE_UNCOMMON_SUCCESS_TIERS.slice(0,n).reduce((s,v)=>s+v,0)*100);
                  return `<option value="uncommon:${n}">${tt(`${n} 件・uncommon（成功率 +${bonus}%）`, `${n}・Uncommon (success +${bonus}%)`)}</option>`;
                }).join('');
              const accessoryOptions = `<option value="">${tt('不使用','None')}</option>` +
                Array.from({length: Math.min(ACCESSORY_EXPEDITION_MAX_STACK, accessoryQty)}, (_,i)=>i+1).map(n=>{
                  const pct = Math.round(Math.min(1, n*ACCESSORY_EXPEDITION_FLOOR_PCT)*100);
                  return `<option value="common:${n}">${tt(`${n} 件・common（下限拉近 ${pct}%）`, `${n}・Common (floor pulled ${pct}%)`)}</option>`;
                }).join('') +
                Array.from({length: Math.min(ACCESSORY_EXPEDITION_MAX_STACK, accessoryUncommonQty)}, (_,i)=>i+1).map(n=>{
                  const pct = Math.round(Math.min(1, n*ACCESSORY_UNCOMMON_EXPEDITION_FLOOR_PCT)*100);

                </label>
                <label style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;${hasWeapon?'':'opacity:0.5;'}">

                  <select id="weapon-sel-${uid}" ${hasWeapon?'':'disabled'} style="min-width:170px;">${weaponOptions}</select>
                  <span style="color:var(--muted);font-size:11px;">${tt(`庫存 common ${weaponQty}／uncommon ${weaponUncommonQty}`, `Stock Common ${weaponQty} / Uncommon ${weaponUncommonQty}`)}</span>

                  <select id="accessory-sel-${uid}" ${hasAccessory?'':'disabled'} style="min-width:170px;">${accessoryOptions}</select>
                  <span style="color:var(--muted);font-size:11px;">${tt(`庫存 common ${accessoryQty}／uncommon ${accessoryUncommonQty}`, `Stock Common ${accessoryQty} / Uncommon ${accessoryUncommonQty}`)}</span>
                </label>
              </div>${(p.expLevel||0) >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL ? renderExpeditionRogueDraftUI(uid) : ''}`;
            })() : ''}

              return `<button class="btn small" data-expedition-start-tier="${tier.id}" data-expedition-start-dur="${durKey}" data-expedition-uid="${uid}" ${rogueReady?'':'disabled'} style="margin-top:8px;${rogueReady?'':'opacity:0.5;'}">${tt('確認出征','Confirm Expedition')}</button>`;
            })() : `<button class="btn small secondary" data-expedition-goto-auction="1" style="margin-top:8px;">${tt('卡牌不足，前往拍賣行收購','Not enough cards - go to Auction House')}</button>`
            }
          </div>`;
        });
        html += `</div>`;
      });
    }
    if(locked.length>0){
      html += `<div class="farm-upgrade-title" style="margin-top:6px;">${tt('尚未解鎖','Not yet unlocked')}</div>`;
      locked.forEach(tier=>{

  body.innerHTML = html;

      const curExp = state.player.expedition;

  document.querySelectorAll('[data-rogue-risk-key]').forEach(btn=>{

    btn.onclick = ()=>{

      const idx = parseInt(btn.dataset.rogueCardIdx, 10);
      const draft = getExpeditionRogueDraft(uid);
      draft.selectedIdx = idx;
      renderPreservingExpeditionItemInputs();
    };

      const accessorySel = uid ? document.getElementById(`accessory-sel-${uid}`) : null;
      const rogueUnlocked = (state.player.expLevel||0) >= EXPEDITION_ROGUELIKE_UNLOCK_LEVEL;
      const draft = rogueUnlocked && uid ? getExpeditionRogueDraft(uid) : null;
      const hasSelectedCard = !!(draft && draft.drawnCards && draft.selectedIdx !== null);
      if(rogueUnlocked && !hasSelectedCard){
        showToast(tt('請先選好風險等級並翻牌選1張效果卡','Pick a risk level and draw+select a card first'));
        return;
      }

        // "tier:count" 編碼（例如 "common:2"／"uncommon:1"），空字串代表不使用；武器沒有件數，直接用 "common"／"uncommon"
        furnitureSel: furnitureSel ? furnitureSel.value : '',
        weaponTier: weaponSel && weaponSel.value ? weaponSel.value : null,

        riskLevel: draft ? draft.riskLevel : 'standard',

      };
      confirmStartExpedition(parseInt(btn.dataset.expeditionStartTier,10), btn.dataset.expeditionStartDur, itemUsage);
    };
  });
  document.querySelectorAll('[data-expedition-goto-auction]').forEach(btn=>{
    btn.onclick = async ()=>{
      state.tab = 'auction';
      await refreshPlayer();
      render();
    };
  });
}

async function plantSeed(plotIndex, seedKey){
  const p = state.player;
  if(!p) return;
  const seed = SEED_TYPES[seedKey];
  if(!seed) return;
  const farm = ensureFarm(p);
  const plot = farm[plotIndex];
  if(!plot || plot.seed){ showToast(tt('這塊地已經種了東西','This plot already has something planted')); return; }
  if((seed.tierLevel||0) > (p.farmLevel||0)){
    showToast(tt(`花園等級需達 Lv.${seed.tierLevel} 才能解鎖此種子`, `Requires garden Lv.${seed.tierLevel} to unlock this seed`));
    return;
  }
  if(seed.seasonOnly && !SEASON_ACTIVE){
    showToast(tt('賽季已結束，無法再種植此種子','The season has ended - this seed can no longer be planted'));
    return;
  }
  if(seed.unlockTotal){
    const total = seed.uniqueUnlock ? playerUniqueCards(p) : playerTotalCards(p);
    if(total < seed.unlockTotal){
      const msg = seed.uniqueUnlock
        ? tt(`收藏超過 ${seed.unlockTotal-1} 種不同卡牌才能種植${seedName(seed)}`, `Collect more than ${seed.unlockTotal-1} unique cards to unlock planting ${seedName(seed)}`)
        : tt(`收藏滿 ${seed.unlockTotal} 張卡才能種植${seedName(seed)}`, `Collect ${seed.unlockTotal} cards to unlock planting ${seedName(seed)}`);
      showToast(msg);
      return;
    }
  }
  if((p.coins||0) < seed.cost){ showToast(tt('金幣不足','Not enough coins')); return; }
  p.coins -= seed.cost;
  const now = Date.now();
  const effectiveGrowMs = Math.round(seed.growMs * starChartGrowMsMultiplier(p));
  plot.seed = seedKey;
  plot.plantedAt = now;
  plot.readyAt = now + effectiveGrowMs;
  plot.witherAt = seed.wither ? plot.readyAt + seed.witherMs : null;
  plot.waterLog = {};
  plot.stolenBy = [];
  bumpQuest(p, 'plant', 1);
  await savePlayer(p);
  showToast(tt(`已種下${seedName(seed)}`, `Planted ${seedName(seed)}`));
  render();
}

// 一鍵種植：把目前選定的種子種進所有空地，金幣不夠或地種完就停下來，最後統一存檔、統一提示一次
async function plantSeedToAllEmpty(seedKey){
  const p = state.player;
  if(!p) return;
  const seed = SEED_TYPES[seedKey];
  if(!seed) return;
  if((seed.tierLevel||0) > (p.farmLevel||0)){
    showToast(tt(`花園等級需達 Lv.${seed.tierLevel} 才能解鎖此種子`, `Requires garden Lv.${seed.tierLevel} to unlock this seed`));
    return;
  }
  if(seed.seasonOnly && !SEASON_ACTIVE){
    showToast(tt('賽季已結束，無法再種植此種子','The season has ended - this seed can no longer be planted'));
    return;
  }
  if(seed.unlockTotal){
    const total = seed.uniqueUnlock ? playerUniqueCards(p) : playerTotalCards(p);
    if(total < seed.unlockTotal){
      const msg = seed.uniqueUnlock
        ? tt(`收藏超過 ${seed.unlockTotal-1} 種不同卡牌才能種植${seedName(seed)}`, `Collect more than ${seed.unlockTotal-1} unique cards to unlock planting ${seedName(seed)}`)
        : tt(`收藏滿 ${seed.unlockTotal} 張卡才能種植${seedName(seed)}`, `Collect ${seed.unlockTotal} cards to unlock planting ${seedName(seed)}`);
      showToast(msg);
      return;
    }
  }
  const farm = ensureFarm(p);
  const now = Date.now();
  const effectiveGrowMs = Math.round(seed.growMs * starChartGrowMsMultiplier(p));
  let planted = 0;
  for(const plot of farm){
    if(plot.seed) continue; // 只種空地
    if((p.coins||0) < seed.cost) break; // 金幣不夠就停下來
    p.coins -= seed.cost;
    plot.seed = seedKey;
    plot.plantedAt = now;
    plot.readyAt = now + effectiveGrowMs;
    plot.witherAt = seed.wither ? plot.readyAt + seed.witherMs : null;
    plot.waterLog = {};
    plot.stolenBy = [];
    bumpQuest(p, 'plant', 1);
    planted++;
  }
  if(planted === 0){
    showToast(tt('沒有可種植的空地，或金幣不足','No empty plots to plant, or not enough coins'));
    return;
  }
  await savePlayer(p);
  showToast(tt(`已一鍵種下 ${planted} 顆${seedName(seed)}`, `Planted ${planted} × ${seedName(seed)}`));
  render();
}

async function harvestPlot(plotIndex, opts){
  opts = opts || {};
  const p = state.player;
  if(!p) return null;
  const farm = ensureFarm(p);
  const plot = farm[plotIndex];
  const now = Date.now();
  const status = plotStatus(plot, now);
  if(status === 'empty' || status === 'growing') return null;

  // 🐞修正：舊資料相容 — 若 plot.seed 指向的種子已經被移除／改版下架（例如過去的
  // 季節限定種子），SEED_TYPES[plot.seed] 會是 undefined。過去這裡沒有防呆，
  // 收成時直接讀 seed.coinMax 等欄位會整段拋出例外，玩家連清空這塊地都做不到。
  // 補一個安全預設值，讓孤兒種子至少能被正常清掉（金幣/掉落一律視為 0）。
  const seed = SEED_TYPES[plot.seed] || {icon:'❓', nameZh:'未知種子（已下架）', nameEn:'Unknown Seed (discontinued)', coinMin:0, coinMax:0, growMs:1};
  let result = null;
  if(status === 'withered'){
    result = {withered:true, seedName: seedName(seed)};
  } else {
    ensureMaterials(p);
    let coinGain = Math.floor(Math.random()*(seed.coinMax-seed.coinMin+1)) + seed.coinMin;
    coinGain = Math.round(coinGain * starChartCoinMultiplier(p) * starChartYieldMultiplier(p));
    p.coins = (p.coins||0) + coinGain;
    let bonusCard = null;
    if(seed.bonusCardChance && Math.random() < seed.bonusCardChance){
      const pool = DECK.filter(c=>seed.bonusCardRarities.includes(c.rarity));
      if(pool.length){
        const card = pool[Math.floor(Math.random()*pool.length)];
        p.cards[card.id] = (p.cards[card.id]||0) + 1;
        bonusCard = card;
      }
    }
    let materialDrop = null;
    const mercuryDropChance = FARM_MATERIAL_DROP_CHANCE + starChartMercuryDropChanceBonus(p)/100; // 水星節點：+5%/節點，封頂50%
    if(Math.random() < mercuryDropChance){
      ensureProfession(p);
      // 隨機掉藥草/礦石/木料其中一種，不受目前職業影響
      const materialId = PROFESSION_MATERIAL_IDS[Math.floor(Math.random()*PROFESSION_MATERIAL_IDS.length)];
      let qty = FARM_MATERIAL_DROP_MIN + Math.floor(Math.random()*(FARM_MATERIAL_DROP_MAX-FARM_MATERIAL_DROP_MIN+1));
      if(Math.random() < starChartMercuryExtraQtyChance(p)) qty += 1; // 水星節點：+10%/節點機率多掉1個
      p.professionMaterials[materialId] = (p.professionMaterials[materialId]||0) + qty;
      const def = PROFESSION_DEFS.find(d=>d.materialId===materialId);
      materialDrop = {materialId, qty, icon: def ? def.materialIcon : '', label: def ? professionMaterialLabel(def) : materialId};
    }
    // 寵物尋寶玩法：花園收成掉落職業材料的同時，額外有小機率直接開出一隻寵物
    // （對應規格書「蛋的另一來源：職業採集有機率額外掉落」；此處為求簡化，命中時
    // 直接產生已孵化的寵物，不吃花園等級加成，維持基礎稀有度機率）。
    let bonusPet = null;
    if(materialDrop && Math.random() < PET_BONUS_EGG_CHANCE){
      ensurePets(p);
      const rarity = rollPetRarity(0);
      const pet = createPet(materialDrop.materialId, rarity);
      p.pets.push(pet);
      if(!p.petActiveId) p.petActiveId = pet.id;
      bonusPet = pet;
    }
    result = {withered:false, seedName: seedName(seed), coinGain, bonusCard, materialDrop, bonusPet};
    bumpQuest(p, 'harvest', 1);
    ensureStats(p).totalHarvests += 1;
  }
  plot.seed = null; plot.plantedAt = null; plot.readyAt = null; plot.witherAt = null;
  plot.waterLog = {}; plot.stolenBy = [];
  if(!opts.skipSave) await savePlayer(p);
  return result;
}

async function harvestOne(plotIndex){
  const result = await harvestPlot(plotIndex);
  if(!result) return;
  if(result.withered){
    showToast(tt(`${result.seedName}已經枯萎了，白忙一場 🥀`, `${result.seedName} withered away - all for nothing 🥀`));
  } else {
    let msg = tt(`收成${result.seedName}，獲得 ✦${result.coinGain}`, `Harvested ${result.seedName} for ✦${result.coinGain}`);
    if(result.bonusCard) msg += tt(` + 額外一張「${result.bonusCard.name}」！`, ` + a bonus "${result.bonusCard.name}"!`);
    if(result.materialDrop) msg += tt(` + ${result.materialDrop.icon} ${result.materialDrop.label} x${result.materialDrop.qty}`, ` + ${result.materialDrop.icon} ${result.materialDrop.label} x${result.materialDrop.qty}`);
    if(result.bonusPet) msg += tt(` + 🥚➡️🐾 額外孵化一隻${petRarityLabel(result.bonusPet.rarity)}寵物！`, ` + 🥚➡️🐾 bonus hatched a ${petRarityLabel(result.bonusPet.rarity)} pet!`);
    showToast(msg);
  }
  render();
}

async function harvestAllReady(){
  const p = state.player;
  if(!p) return;
  const farm = ensureFarm(p);
  const now = Date.now();
  let coinTotal = 0, harvestedCount = 0, witheredCount = 0;
  const bonusCards = [];
  const bonusPets = [];
  const materialTotals = {};
  for(let i=0;i<farm.length;i++){
    const status = plotStatus(farm[i], now);
    if(status !== 'ready' && status !== 'withered') continue;
    const result = await harvestPlot(i, {skipSave:true});
    if(!result) continue;
    if(result.withered){ witheredCount++; }
    else{
      harvestedCount++; coinTotal += result.coinGain;
      if(result.bonusCard) bonusCards.push(result.bonusCard.name);
      if(result.bonusPet) bonusPets.push(result.bonusPet);
      if(result.materialDrop){
        const md = result.materialDrop;
        if(!materialTotals[md.materialId]) materialTotals[md.materialId] = {icon: md.icon, label: md.label, qty: 0};
        materialTotals[md.materialId].qty += md.qty;
      }
    }
  }
  if(harvestedCount===0 && witheredCount===0){ showToast(tt('目前沒有可收成的作物','Nothing ready to harvest right now')); return; }
  await savePlayer(p);
  let msg = '';
  if(harvestedCount>0) msg += tt(`收成 ${harvestedCount} 塊地，獲得 ✦${coinTotal}`, `Harvested ${harvestedCount} plot(s) for ✦${coinTotal}`);
  const materialParts = Object.values(materialTotals).map(m=>`${m.icon} ${m.label} x${m.qty}`);
  if(materialParts.length) msg += ` + ${materialParts.join('、')}`;
  if(bonusCards.length) msg += tt(`（額外獲得：${bonusCards.join('、')}）`, ` (bonus: ${bonusCards.join(', ')})`);
  if(bonusPets.length) msg += tt(` + 🥚➡️🐾 額外孵化 ${bonusPets.length} 隻寵物！`, ` + 🥚➡️🐾 bonus hatched ${bonusPets.length} pet(s)!`);
  if(witheredCount>0) msg += `${msg?tt('；', '; '):''}${tt(`${witheredCount} 塊地作物枯萎了`, `${witheredCount} plot(s) withered`)}`;
  showToast(msg);
  render();
}

async function waterFriendPlot(friendNick, plotIndex){
  if(!state.nickname){ return; }
  // 🔒 跟 stealFriendPlot 同一種漏洞、同一種修法：讀跟寫中間有網路延遲空檔，
  // 連續請求會各自讀到「還沒澆過」的舊資料，各自通過 waterLog 檢查、各自領一次謝禮。
  // 改用 updatePlayerCAS，把檢查跟標記 waterLog 包進同一次樂觀鎖讀-改-寫。
  let waterInfo = null;
  let failReason = null;
  const appliedOwner = await updatePlayerCAS(friendNick, (owner)=>{
    const farm = ensureFarm(owner);
    const plot = farm[plotIndex];
    const now = Date.now();
    const status = plotStatus(plot, now);
    if(status !== 'growing'){ failReason = 'not_growing'; return; }
    if(plot.waterLog[state.nickname]){ failReason = 'already_watered'; return; }
    const remain = plot.readyAt - now;
    const speedup = Math.floor(remain * WATER_SPEEDUP_RATIO);
    plot.readyAt = plot.readyAt - speedup;
    if(plot.witherAt) plot.witherAt = plot.witherAt - speedup;
    plot.waterLog[state.nickname] = now;
    waterInfo = {speedup, seed: plot.seed};
  });
  if(!appliedOwner){ showToast(tt('找不到這位好友的資料',"Couldn't find this friend's data")); return; }

  const appliedSelf = await updatePlayerCAS(state.nickname, (player)=>{
    player.coins = (player.coins||0) + WATER_HELPER_REWARD;
    bumpQuest(player, 'water', 1);
  });

async function stealFriendPlot(friendNick, plotIndex){

  // （連點、多分頁、或直接呼叫這個函式），每個請求都各自讀到「尚未偷過」的
  // 舊資料、各自通過檢查、各自加到自己的金幣，等於同一塊地能被同一人偷很多次。

  // 對同一玩家只會成功標記一次。
  let stealInfo = null;
  let failReason = null;

  if(failReason === 'already_stolen'){ showToast(tt('你已經偷過這塊地了',"You've already taken from this plot")); return; }
  if(!stealInfo) return;
  const gain = stealInfo.gain;

  // 自己這邊拿獎勵也改用 CAS，避免跟同一時間的其他收益（例如剛好在收成、抽卡）互相蓋掉。
  const appliedSelf = await updatePlayerCAS(state.nickname, (player)=>{
    player.coins = (player.coins||0) + gain;
  });
  if(appliedSelf) state.player = appliedSelf;

  const stolenSeedName = seedName(SEED_TYPES[stealInfo.seed]);
  await createNotification(friendNick, state.nickname, 'steal', {plotIndex, seedName: stolenSeedName, amount: gain});
  invalidateVisitingPlayerCache(); // 剛改了這位好友的地，正在看他花園的話別讓快取顯示舊資料

  showToast(tt(`偷偷順走一點 ${friendNick} 的${stolenSeedName}，獲得 ✦${gain}（不影響對方收成）`, `Sneaked a bit of ${friendNick}'s ${stolenSeedName}, gaining ✦${gain} (doesn't affect their harvest)`));
  const coinEl = document.getElementById('player-coin');
  if(coinEl) coinEl.textContent = `✦ ${state.player.coins}`;
  await renderTab();
}

function weightedDraw(){
  const pools = {};
  RARITY_ORDER.forEach(r=>pools[r]=DECK.filter(c=>c.rarity===r));
  const total = Object.values(DRAW_WEIGHTS).reduce((a,b)=>a+b,0);
  let roll = Math.random()*total;
  for(const r of RARITY_ORDER){
    if(roll < DRAW_WEIGHTS[r]){
      const pool = pools[r];
      return pool[Math.floor(Math.random()*pool.length)];
    }
    roll -= DRAW_WEIGHTS[r];
  }
  return pools.common[0];
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function dateStrFromDate(d){
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function parseDateStr(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDaysToDateStr(baseDateStr, offset){
  const dt = parseDateStr(baseDateStr);
  dt.setDate(dt.getDate() + offset);
  return dateStrFromDate(dt);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function playerKey(nick){ return `player:${nick.trim().toLowerCase()}`; }

// ---------- Session token（讓 Safari 分頁被系統重新載入後不用手動重新輸入密碼）----------
// 密碼本身仍然「永遠不存」——這裡存的是登入成功後才簽發的隨機 token，
// 效期到就失效、登出會立刻在伺服器端撤銷，跟密碼是兩回事。
const SESSION_TOKEN_TTL_MS = 14 * 24 * 60 * 60 * 1000; // 14 天滑動效期，每次靜默續登都會延長並換發新 token
function genSessionToken(){
  try{
    const bytes = new Uint8Array(24);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // 極少數不支援 crypto.getRandomValues 的環境退回較弱的隨機來源，仍比明文密碼安全
    return uid() + uid() + uid();
  }
}

async function loadPlayer(nick){
  try{
    const res = await storage.get(playerKey(nick));
    if(!res) return null;
    const p = JSON.parse(res.value);
    ensureMaterials(p);
    ensureExpedition(p);
    ensureProfession(p);
    ensurePets(p);
    ensureDiceInventory(p); // 順便把骰子面效果從精簡格式（id）還原成完整物件，見該函式註解
    return p;
  }catch(e){ return null; }
}
async function savePlayer(p){
  await storage.set(playerKey(p.nickname), serializePlayerForStorage(p));
}
// 讀出玩家資料時保留原始字串（raw，目前只做「存在與否」判斷用）與 updated_at
// （updatedAt，供樂觀鎖 (CAS) 比對用，見 savePlayerCAS 註解）。這裡刻意不吞讀取
// 失敗（不像上面的 loadPlayer），因為呼叫端（updatePlayerCAS）需要準確分辨
// 「讀取失敗」和「玩家真的不存在」，才能正確重試。
async function loadPlayerRaw(nick){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(playerKey(nick))}&select=value,updated_at`,
    { headers: SB_HEADERS }
  );
  if(!res.ok) throw new Error('storage get failed: ' + res.status);
  const rows = await res.json();
  if(!rows || rows.length === 0) return {player: null, raw: null, updatedAt: null};
  const p = JSON.parse(rows[0].value);
  ensureMaterials(p);
  ensureExpedition(p);
  ensureProfession(p);
  ensurePets(p);
  ensureDiceInventory(p);
  return {player: p, raw: rows[0].value, updatedAt: rows[0].updated_at || null};
}
// 只有在資料庫現存 updated_at 仍等於 prevUpdatedAt 時才寫入 newPlayer（Compare-And-Swap），
// 回傳 true 代表搶到寫入；false 代表寫入前已被別的併發動作改過，需重讀最新資料後重試。
// 【2026-08 修正】原本比對條件是 value=eq.<整包舊 JSON>：每次寫入都要把玩家整份存檔字串
// 塞進網址查詢參數。骰子系統上線、玩家骰子越囤越多之後，玩家 JSON 可以輕易膨脹到幾十 KB
// （尤其是骰子每一面帶效果都存了完整的中英文說明文字，見 serializePlayerForStorage），
// URL-encode 後長度更是數倍膨脹，超過伺服器/CDN 的網址長度上限，導致寫入永遠失敗、重試
// 幾次都一樣（這就是玩家回報的「拆解失敗」「資料忙碌中」）。改成比對 updated_at 這種固定
// 長度的短戳記，網址長度不會再隨玩家資料量成長，從根本解決這個問題。
async function savePlayerCAS(prevUpdatedAt, newPlayer){
  const filter = prevUpdatedAt
    ? `updated_at=eq.${encodeURIComponent(prevUpdatedAt)}`
    : `updated_at=is.null`; // 舊資料/從未寫過 updated_at 的極少數情況 fallback
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(playerKey(newPlayer.nickname))}&${filter}`,
    {
      method: 'PATCH',
      headers: {
        ...SB_HEADERS,
        'Content-Type': 'application/json',
        Prefer: 'return=representation',
      },
      body: JSON.stringify({ value: serializePlayerForStorage(newPlayer), updated_at: new Date().toISOString() }),
    }
  );
  if(!res.ok) throw new Error('storage CAS update failed: ' + res.status);
  const rows = await res.json();
  return Array.isArray(rows) && rows.length > 0;
}
// 通用：對單一玩家資料做「讀-改-寫」，全程用樂觀鎖保護。
// mutator(player) 直接在傳入的 player 物件上修改欄位；每次重試都會重新讀取
// 「當下最新」的玩家資料再套用 mutator，只有寫入當下資料仍等於自己讀到的
// 那份時才會成功，不會發生後手覆蓋先手的情況（例如發獎的同時玩家剛好在買
// 東西、收成，兩者互相蓋掉導致「收到通知但東西沒進口袋」）。
// 用於「這筆更新絕對不能被其他併發寫入覆蓋掉」的場合（例如發放獎勵）；
// 一般高頻互動（單純收成、買賣）維持用舊版 savePlayer 即可，衝突機率低，
// 沒必要為每個寫入都付 CAS 的額外請求成本。
// 玩家不存在時回傳 null；正常完成則回傳寫入成功當下的玩家物件。
async function updatePlayerCAS(nick, mutator){
  for(let attempt = 0; attempt < 8; attempt++){
    const {player, updatedAt} = await loadPlayerRaw(nick);
    if(!player) return null;
    mutator(player);
    const applied = await savePlayerCAS(updatedAt, player);
    if(applied) return player;
    // 沒搶到：這段期間已經有別人先寫入了，重讀最新資料再試一次
  }
  throw new Error('player state contention exceeded retries');
}
function newPlayer(nick, passwordHash){
  return {nickname:nick, passwordHash, coins:START_COINS, cards:{}, lastClaim:null, lastDrawCards:[], streak:0, joinedAt:Date.now(), slotSpend:0, farmLevel:0, avatarId:DEFAULT_AVATAR_ID, unlockedAvatars:[], stats:{totalHarvests:0, totalAuctionTrades:0, totalAuctionVolume:0}, equippedBadges:[], unlockedBadges:[], lastSeenChatAt:0, lastActiveAt:Date.now(), materials:{}, seasonCards:{}, expLevel:0, expExp:0, expedition:null, expeditionRolls:{},
    profession:null,
    professionProgress:{alchemist:{level:1,exp:0}, blacksmith:{level:1,exp:0}, carpenter:{level:1,exp:0}},
    professionMaterials:{herb:0, ore:0, lumber:0},
    professionItems:{potion_small:0, weapon_common:0, accessory_common:0, furniture_common:0, potion_medium:0, weapon_uncommon:0, accessory_uncommon:0, furniture_uncommon:0},
    stamina:PROFESSION_STAMINA_MAX, staminaMax:PROFESSION_STAMINA_MAX, lastStaminaRegenAt:Date.now(),
    pets:[], petActiveId:null,

}
function ensureStats(p){
  if(!p.stats) p.stats = {totalHarvests:0, totalAuctionTrades:0, totalAuctionVolume:0, maxBossHitDamage:0};
  if(typeof p.stats.totalHarvests !== 'number') p.stats.totalHarvests = 0;
  if(typeof p.stats.totalAuctionTrades !== 'number') p.stats.totalAuctionTrades = 0;
  if(typeof p.stats.totalAuctionVolume !== 'number') p.stats.totalAuctionVolume = 0;
  if(typeof p.stats.maxBossHitDamage !== 'number') p.stats.maxBossHitDamage = 0;
  return p.stats;
}

async function hashPassword(pw){
  try{
    const enc = new TextEncoder().encode('lekcus-tarot-salt:' + pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // fallback if crypto.subtle unavailable
    let h = 0;
    for(let i=0;i<pw.length;i++){ h = (h*31 + pw.charCodeAt(i)) >>> 0; }
    return 'fallback-' + h.toString(16);
  }
}

// 依文字長度動態調整顯示時間：短訊息維持原本 2.2 秒的節奏，長訊息（例如遠征結算列出一堆加成來源）停久一點才不會來不及看完。
// 抓中文閱讀速度約每秒 8~9 字，額外加一段固定的基礎時間（讓使用者有反應時間看到通知跳出來），並設下限/上限避免太短或太長。
const TOAST_MIN_MS = 2200;
const TOAST_MAX_MS = 6000;
const TOAST_LEGENDARY_MIN_MS = 3200;
function toastDurationForMsg(msg, legendary){
  const base = legendary ? TOAST_LEGENDARY_MIN_MS : TOAST_MIN_MS;
  const len = (msg||'').length;
  // 前 20 字算在基礎時間內免費，超過的部分每個字追加 90ms
  const extra = Math.max(0, len - 20) * 90;
  return Math.min(TOAST_MAX_MS, base + extra);
}
function showToast(msg, opts){
  opts = opts || {};
  clearTimeout(state.toastTimer);
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast'; t.className='toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'toast show' + (opts.legendary ? ' legendary-toast' : '');
  state.toastTimer = setTimeout(()=>t.classList.remove('show'), toastDurationForMsg(msg, opts.legendary));
}

function playLegendaryRevealFx(){
  const flash = document.createElement('div');
  flash.className = 'legendary-flash';

// ---------- Background music ----------
// Map each tab to its own track. Add/replace filenames here once you have the mp3s
// (they should sit next to index.html, same as the original bgm.mp3).
// Any tab not listed here just falls back to BGM_TRACKS.default.
const BGM_TRACKS = {
  default: 'bgm.mp3',          // 一般頁面用的預設音樂
  boss: 'bgm-boss.mp3',        // Boss 戰：刺激一點的
  ghostboss: 'bgm-ghostboss.mp3', // 幽冥活動Boss：獨立音樂，跟主線Boss(boss)分開，可自行換成別的檔名
  farm: 'bgm-farm.mp3',        // 花園農場：放鬆一點的
  expedition: 'bgm-expedition.mp3', // 遠征：專屬音樂
};
const BGM_VOLUME = 0.35;
let bgmAudioEl = null;
let bgmToggleBtn = null;
let bgmPlaying = false;
let bgmCurrentKey = null;
let bgmFadeTimer = null;

function bgmKeyForTab(tab){
  return BGM_TRACKS[tab] ? tab : 'default';
}

function bgmFadeTo(targetVolume, duration, done){
  if(!bgmAudioEl) return;
  clearInterval(bgmFadeTimer);
  const steps = 12;
  const stepTime = Math.max(16, duration / steps);
  const startVolume = bgmAudioEl.volume;
  const delta = (targetVolume - startVolume) / steps;
  let i = 0;
  bgmFadeTimer = setInterval(()=>{
    i++;
    bgmAudioEl.volume = Math.max(0, Math.min(1, startVolume + delta * i));
    if(i >= steps){
      clearInterval(bgmFadeTimer);
      bgmAudioEl.volume = targetVolume;
      if(done) done();
    }
  }, stepTime);
}

function initBgm(){
  const audio = document.getElementById('bgm-audio');
  const btn = document.getElementById('bgm-toggle');
  if(!audio || !btn) return;
  bgmAudioEl = audio;
  bgmToggleBtn = btn;
  audio.volume = BGM_VOLUME;
  bgmCurrentKey = bgmKeyForTab(state.tab);
  const source = audio.querySelector('source');
  if(source) source.src = BGM_TRACKS[bgmCurrentKey] || BGM_TRACKS.default;
  btn.onclick = ()=>{
    if(bgmPlaying){
      audio.pause();
      btn.textContent = '🔇';
      bgmPlaying = false;
    } else {
      audio.play().catch(()=>{ showToast(tt('無法播放音樂，請再點一次','Could not play music, please click again')); });
      btn.textContent = '🔊';
      bgmPlaying = true;
    }
  };
}

// Call this whenever state.tab changes so each page can have its own music.
// If music isn't playing yet, it just quietly swaps the source (so the right
// track is ready the moment the user presses play). If it IS playing, it
// fades out, swaps, and fades back in so the change isn't jarring.
function updateBgmForTab(tab){
  if(!bgmAudioEl) return;
  const key = bgmKeyForTab(tab);
  if(key === bgmCurrentKey) return;
  bgmCurrentKey = key;
  const newSrc = BGM_TRACKS[key] || BGM_TRACKS.default;
  const source = bgmAudioEl.querySelector('source');

  if(!bgmPlaying){
    if(source) source.src = newSrc;
    bgmAudioEl.load();
    return;
  }

  bgmFadeTo(0, 450, ()=>{
    bgmAudioEl.pause();
    if(source) source.src = newSrc;
    bgmAudioEl.load();
    bgmAudioEl.play().catch(()=>{});
    bgmFadeTo(BGM_VOLUME, 450);
  });
}

let COLLECTION_MODAL_LIST = [];

function openCardModal(cardId){
  const c = DECK_BY_ID[cardId];
  if(!c) return;
  const owned = (state.player && state.player.cards[cardId]) || 0;
  const price = SELL_PRICES[c.rarity] || 0;
  const content = document.getElementById('card-modal-content');
  const isLegendaryReveal = c.rarity === 'epic' && owned > 0;

  let bodyHtml = `
    ${c.image ? `<img src="${c.image}" alt="${escapeHtml(c.name)}" class="card-modal-img${owned>0?'':' locked-img'}${isLegendaryReveal?' legendary-img':''}" />` : `<div class="card-modal-icon${owned>0?'':' locked-img'}">${c.icon}</div>`}
    ${isLegendaryReveal ? `<div class="legendary-modal-badge">✨ ${tt('史詩卡','Epic Card')} ✨</div>` : ''}
    <div class="card-modal-name">${owned>0 ? escapeHtml(c.name) : '???'}</div>
    <div class="card-modal-rarity">${RARITY_LABEL[c.rarity]}</div>
  `;

  if(owned > 0){
    bodyHtml += `
      <div class="card-modal-sell-box">
        <div style="font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;">${tt(`持有 x${owned} · 每張 ✦${price}`, `Owned x${owned} · ✦${price} each`)}</div>
        <div class="card-modal-qty-row">
          <input type="number" id="sell-qty-input" value="1" min="1" max="${owned}" />
          <button class="btn small" id="sell-qty-btn">${tt('出售所選','Sell selected')}（+✦<span id="sell-qty-total">${price}</span>）</button>
        </div>
        ${owned > 1 ? `<div style="margin-top:8px;"><button class="btn small secondary" id="sell-extra-btn">${tt(`賣出多餘 ${owned-1} 張，保留 1 張`, `Sell ${owned-1} extra, keep 1`)}（+✦${(owned-1)*price}）</button></div>` : ''}
      </div>
    `;
  } else {
    const pool = DECK.filter(d=>d.rarity===c.rarity);
    const totalWeight = RARITY_ORDER.reduce((a,r)=>a+(DRAW_WEIGHTS[r]||0),0) || 1;
    const rarityChance = (DRAW_WEIGHTS[c.rarity]||0) / totalWeight;
    const cardChance = pool.length ? (rarityChance / pool.length) * 100 : 0;
    bodyHtml += `
      <div class="card-modal-locked-note">
        ${tt('尚未擁有此卡 · 每次抽卡約有','Not yet owned · roughly a')} <span class="odds">${cardChance.toFixed(2)}%</span> ${tt('機率抽到','chance per draw')}
      </div>
    `;
  }

  content.innerHTML = bodyHtml;

  const idx = COLLECTION_MODAL_LIST.indexOf(cardId);
  const hasList = idx !== -1 && COLLECTION_MODAL_LIST.length > 1;
  let navHtml = '';
  if(hasList){
    navHtml = `
      <button class="card-modal-nav prev" id="card-modal-prev">‹</button>
      <button class="card-modal-nav next" id="card-modal-next">›</button>
    `;
  }
  document.getElementById('card-modal-nav-slot').innerHTML = navHtml;
  if(hasList){
    document.getElementById('card-modal-prev').onclick = ()=>{
      const prevIdx = (idx - 1 + COLLECTION_MODAL_LIST.length) % COLLECTION_MODAL_LIST.length;
      openCardModal(COLLECTION_MODAL_LIST[prevIdx]);
    };
    document.getElementById('card-modal-next').onclick = ()=>{
      const nextIdx = (idx + 1) % COLLECTION_MODAL_LIST.length;
      openCardModal(COLLECTION_MODAL_LIST[nextIdx]);
    };
  }

  document.getElementById('card-modal').style.display = 'flex';
  const modalBox = document.querySelector('.card-modal-box');
  if(modalBox) modalBox.classList.toggle('legendary-modal', isLegendaryReveal);
  if(isLegendaryReveal) playLegendaryRevealFx();

  const qtyInput = document.getElementById('sell-qty-input');
  const qtyTotal = document.getElementById('sell-qty-total');
  if(qtyInput){
    qtyInput.oninput = ()=>{
      let v = parseInt(qtyInput.value, 10) || 1;
      v = Math.max(1, Math.min(owned, v));
      qtyTotal.textContent = v * price;
    };
  }
  const sellQtyBtn = document.getElementById('sell-qty-btn');
  if(sellQtyBtn) sellQtyBtn.onclick = ()=>{
    let qty = parseInt(qtyInput.value, 10) || 1;
    qty = Math.max(1, Math.min(owned, qty));
    sellCard(cardId, qty);
  };
  const sellExtraBtn = document.getElementById('sell-extra-btn');
  if(sellExtraBtn) sellExtraBtn.onclick = ()=>sellCard(cardId, owned - 1);
}
