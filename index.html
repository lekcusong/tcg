// 拍賣行成交手續費：賣家成交金額會被抽走這個比例（直接從遊戲幣總量中消失，作為金幣回收機制），
// 避免玩家間買賣完全不影響金幣總量、加速通膨。GM 可在後台調整。
const DEFAULT_AUCTION_FEE_PCT = 0.08;
let AUCTION_FEE_PCT = DEFAULT_AUCTION_FEE_PCT;
async function loadAuctionConfig(){
  try{
    const r = await storage.get('config:auction_fee');
    if(r){
      const s = JSON.parse(r.value);
      if(typeof s.feePct === 'number' && s.feePct >= 0 && s.feePct <= 1) AUCTION_FEE_PCT = s.feePct;
    }
  }catch(e){ /* keep defaults */ }
}
async function saveAuctionConfig(){
  await storage.set('config:auction_fee', JSON.stringify({feePct: AUCTION_FEE_PCT}));
}
function auctionFeeAmount(price){
  return Math.min(price, Math.round((price||0) * AUCTION_FEE_PCT));
}
async function listAuction(itemType, itemId, qty, startBid, buyoutPrice, durMs){
  if(!itemId){ showToast(tt('請選擇物品','Please choose an item')); return; }
  if(itemType !== 'material' && itemType !== 'professionItem' && itemType !== 'dice') itemType = 'card';
  qty = (itemType === 'card' || itemType === 'dice') ? 1 : Math.max(1, Math.floor(qty||1));
  const owned = auctionOwnedQty(state.player, itemType, itemId);
  if(owned < qty){ showToast(tt('數量不足，無法上架','Not enough quantity to list')); return; }
  let diceSnapshot = null;
  if(itemType === 'dice'){
    ensureDiceInventory(state.player);
    if(state.player.diceSlots.includes(itemId)){
      showToast(tt('請先到「骰子」分頁卸下裝備中的骰子，再上架拍賣','Unequip this die in the Dice tab before listing it for auction'));
      return;
    }
    diceSnapshot = {...state.player.dice[itemId]};
  }
  const hasStart = startBid && startBid >= 1;
  const hasBuyout = buyoutPrice && buyoutPrice >= 1;
  if(!hasStart && !hasBuyout){ showToast(tt('起標價與一口價至少要填一個','Please fill in either a starting bid or a buyout price')); return; }
  if(hasStart && hasBuyout && buyoutPrice <= startBid){ showToast(tt('一口價必須高於起標價','Buyout price must be higher than the starting bid')); return; }
  auctionAdjustInventory(state.player, itemType, itemId, -qty);
  bumpQuest(state.player, 'auction', 1);
  await savePlayer(state.player);
  const auction = {
    id: uid(), seller: state.nickname, itemType, itemId, qty,
    diceData: diceSnapshot,
    startBid: hasStart ? startBid : null,
    buyoutPrice: hasBuyout ? buyoutPrice : null,
    currentBid: 0, currentBidder: null, createdAt: Date.now(),
    endsAt: Date.now() + durMs, status:'active', bidHistory: []
  };
  await storage.set(`auction:${auction.id}`, JSON.stringify(auction));
  showToast(tt('已建立拍賣 🔨','Auction created 🔨'));
  render();
}
async function fetchAuctions(){
  try{
    const list = await storage.list('auction:');
    if(!list || !list.keys) return [];
    const items = await Promise.all(list.keys.map(async k=>{
      try{ const r = await storage.get(k); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }));
    return items.filter(Boolean).map(normalizeAuction);
  }catch(e){ return []; }
}
async function placeBid(auctionId, amount){
  const r = await storage.get(`auction:${auctionId}`);
  if(!r){ showToast(tt('拍賣不存在','Auction does not exist')); return; }
  const auction = normalizeAuction(JSON.parse(r.value));
  if(auction.status !== 'active' || Date.now() > auction.endsAt){ showToast(tt('此拍賣已結束','This auction has ended')); return; }
  if(!auction.startBid){ showToast(tt('這個拍賣沒有開放競標，只能直接購買','This auction is not open for bidding - only direct purchase')); return; }
  const minBid = auction.currentBid > 0 ? auction.currentBid + 1 : auction.startBid;
  if(amount < minBid){ showToast(tt(`出價至少要 ${minBid} 枚遊戲幣`, `Bid must be at least ${minBid} coins`)); return; }
  if(auction.buyoutPrice && amount >= auction.buyoutPrice){ showToast(tt(`出價已達一口價，請直接使用「直接購買」`, `Your bid has reached the buyout price - please use "Buy Now" instead`)); return; }
  if(auction.seller === state.nickname){ showToast(tt('不能競標自己的拍賣',"You can't bid on your own auction")); return; }
  // refund previous bidder. If it's the same person raising their own bid,
  // refund straight into state.player instead of a separately-loaded copy —
  // otherwise savePlayer(state.player) below overwrites that refund.
  if(auction.currentBidder === state.nickname){
    state.player.coins += auction.currentBid;
  } else if(auction.currentBidder){
    await createPendingReward(auction.currentBidder, 'coins', {amount: auction.currentBid});
    const itemName = auctionDisplayInfo(auction).nameOnly;
    await createNotification(auction.currentBidder, state.nickname, 'auction_outbid', {cardName: itemName, price: amount});
  }
  if(amount > state.player.coins){ showToast(tt('遊戲幣不足','Not enough coins')); return; }
  state.player.coins -= amount;
  bumpQuest(state.player, 'auction', 1);
  await savePlayer(state.player);
  auction.currentBid = amount;
  auction.currentBidder = state.nickname;
  if(!Array.isArray(auction.bidHistory)) auction.bidHistory = [];
  auction.bidHistory.push({bidder: state.nickname, amount, at: Date.now()});
  if(auction.bidHistory.length > 20) auction.bidHistory = auction.bidHistory.slice(-20);
  await storage.set(`auction:${auctionId}`, JSON.stringify(auction));
  showToast(tt('出價成功！✦','Bid placed! ✦'));
  renderTab();
  updateHeaderCoins();
}
async function buyoutAuction(auctionId){
  const r = await storage.get(`auction:${auctionId}`);
  if(!r){ showToast(tt('拍賣不存在','Auction does not exist')); return; }
  const auction = normalizeAuction(JSON.parse(r.value));
  if(auction.status !== 'active' || Date.now() > auction.endsAt){ showToast(tt('此拍賣已結束','This auction has ended')); return; }
  if(!auction.buyoutPrice){ showToast(tt('這個拍賣沒有開放直接購買','This auction is not open for direct purchase')); return; }
  if(auction.seller === state.nickname){ showToast(tt('不能購買自己的拍賣',"You can't buy your own auction")); return; }
  const price = auction.buyoutPrice;
  const itemName = auctionDisplayInfo(auction).nameOnly;
  // refund previous bidder if any (they got beaten by a buyout).
  // If the buyer IS the previous bidder, refund straight into state.player
  // instead of a separately-loaded copy — otherwise the savePlayer(state.player)
  // below would overwrite that refund with the stale in-memory balance.
  if(auction.currentBidder === state.nickname){
    state.player.coins += auction.currentBid;
  } else if(auction.currentBidder){
    await createPendingReward(auction.currentBidder, 'coins', {amount: auction.currentBid});
    await createNotification(auction.currentBidder, state.nickname, 'auction_outbid', {cardName: itemName, price});
  }
  if(price > state.player.coins){ showToast(tt('遊戲幣不足','Not enough coins')); return; }
  state.player.coins -= price;
  auctionAdjustInventory(state.player, auction.itemType, auction.itemId, auction.qty, auction.diceData);
  bumpQuest(state.player, 'auction', 1);
  ensureStats(state.player).totalAuctionTrades += 1;
  await savePlayer(state.player);
  const fee = auctionFeeAmount(price);
  const payout = price - fee;
  // 賣家收款走 pendingReward：賣家不是當前操作者，若直接 loadPlayer+savePlayer，
  // 賣家自己那邊若同時存檔會把這筆收款覆蓋掉（同「沒收到卡」的成因）。
  await createPendingReward(auction.seller, 'auction_sale', {amount: payout});
  auction.status = 'completed';
  auction.currentBid = price;
  auction.currentBidder = state.nickname;
  auction.viaBuyout = true;
  await storage.set(`auction:${auctionId}`, JSON.stringify(auction));
  await createNotification(auction.seller, state.nickname, 'auction_sold', {cardName: itemName, price: payout, viaBuyout:true});
  showToast(tt('購買成功！✦','Purchase successful! ✦'));
  renderTab();
  updateHeaderCoins();
}
async function resolveAuction(auction){
  if(auction.status !== 'active' || Date.now() < auction.endsAt) return;
  const itemName = auctionDisplayInfo(auction).nameOnly;
  if(auction.currentBidder){
    await grantAuctionItem(auction.currentBidder, auction.itemType, auction.itemId, auction.qty, auction.diceData);
    await createPendingReward(auction.currentBidder, 'auction_trade_stat', {});
    const fee = auctionFeeAmount(auction.currentBid);
    const payout = auction.currentBid - fee;
    await createPendingReward(auction.seller, 'auction_sale', {amount: payout});
    await createNotification(auction.seller, auction.currentBidder, 'auction_sold', {cardName: itemName, price: payout});
    await createNotification(auction.currentBidder, auction.seller, 'auction_won', {cardName: itemName, price: auction.currentBid});
  } else {
    await grantAuctionItem(auction.seller, auction.itemType, auction.itemId, auction.qty, auction.diceData);
    await createNotification(auction.seller, 'system', 'auction_unsold', {cardName: itemName});
  }
  auction.status = 'completed';
  await storage.set(`auction:${auction.id}`, JSON.stringify(auction));
}
async function cancelAuction(auctionId){
  const r = await storage.get(`auction:${auctionId}`);
  if(!r) return;
  const auction = normalizeAuction(JSON.parse(r.value));
  if(auction.status !== 'active' || auction.seller !== state.nickname || auction.currentBidder) return;
  auctionAdjustInventory(state.player, auction.itemType, auction.itemId, auction.qty, auction.diceData);
  await savePlayer(state.player);
  auction.status = 'cancelled';
  await storage.set(`auction:${auctionId}`, JSON.stringify(auction));
  showToast(tt('已取消拍賣並取回物品','Auction canceled and item returned'));
  renderTab();
}
// ---------- Want-to-buy orders (reverse auction: buyer locks coins, sellers fulfill) ----------
function allCardOptions(){
  return DECK.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}
async function createWantToBuy(cardId, pricePerCard, quantity, durMs){
  if(!cardId){ showToast(tt('請選擇卡片','Please choose a card')); return; }
  if(!pricePerCard || pricePerCard < 1){ showToast(tt('請輸入有效的收購單價','Please enter a valid price per card')); return; }
  quantity = Math.floor(quantity);
  if(!quantity || quantity < 1){ showToast(tt('請輸入有效的收購數量','Please enter a valid quantity')); return; }
  const totalCost = pricePerCard * quantity;
  if(totalCost > state.player.coins){ showToast(tt('遊戲幣不足以鎖定這筆收購款項','Not enough coins to lock this buy order')); return; }
  state.player.coins -= totalCost;
  await savePlayer(state.player);
  const order = {
    id: uid(), buyer: state.nickname, cardId,
    pricePerCard, quantity, remaining: quantity,
    createdAt: Date.now(), endsAt: Date.now() + durMs, status: 'active'
  };
  await storage.set(`wtb:${order.id}`, JSON.stringify(order));
  showToast(tt('已建立求購單 📥','Buy order created 📥'));
  render();
}
async function fetchWantToBuys(){
  try{
    const list = await storage.list('wtb:');
    if(!list || !list.keys) return [];
    const items = await Promise.all(list.keys.map(async k=>{
      try{ const r = await storage.get(k); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }));
    return items.filter(Boolean);
  }catch(e){ return []; }
}
async function fulfillWantToBuy(orderId, sellQty){
  const r = await storage.get(`wtb:${orderId}`);
  if(!r){ showToast(tt('求購單不存在','Buy order does not exist')); return; }
  const order = JSON.parse(r.value);
  if(order.status !== 'active' || Date.now() > order.endsAt){ showToast(tt('這個求購單已結束','This buy order has ended')); return; }
  if(order.buyer === state.nickname){ showToast(tt('不能賣給自己的求購單',"You can't fulfill your own buy order")); return; }
  const owned = state.player.cards[order.cardId] || 0;
  sellQty = Math.floor(sellQty) || 0;
  if(sellQty < 1){ showToast(tt('請輸入有效的出售數量','Please enter a valid quantity')); return; }
  if(sellQty > owned){ showToast(tt('你沒有這麼多這張卡',"You don't have that many of this card")); return; }
  if(sellQty > order.remaining){ showToast(tt('超過這筆求購單剩餘的收購數量','Exceeds the remaining quantity on this buy order')); return; }
  const total = order.pricePerCard * sellQty;
  const cardName = (DECK_BY_ID[order.cardId] && DECK_BY_ID[order.cardId].name) || tt('未知卡片','Unknown card');
  state.player.cards[order.cardId] = owned - sellQty;
  state.player.coins += total;
  bumpQuest(state.player, 'auction', 1);
  ensureStats(state.player).totalAuctionTrades += 1;
  await savePlayer(state.player);
  // 求購單買家收到卡片：買家不是當前操作者（是賣家在賣），若直接
  // loadPlayer+savePlayer，買家自己那邊若同時存檔會把這張卡覆蓋掉。
  await grantAuctionItem(order.buyer, 'card', order.cardId, sellQty);
  await createPendingReward(order.buyer, 'auction_trade_stat', {});
  order.remaining -= sellQty;
  if(order.remaining <= 0){ order.status = 'completed'; }
  await storage.set(`wtb:${orderId}`, JSON.stringify(order));
  await createNotification(order.buyer, state.nickname, 'wtb_filled', {cardName, price: order.pricePerCard, qty: sellQty});
  showToast(tt(`已賣出 x${sellQty}「${cardName}」，獲得 ✦${total}`, `Sold x${sellQty} "${cardName}" for ✦${total}`));
  render();
}
async function resolveWantToBuy(order){
  if(order.status !== 'active' || Date.now() < order.endsAt) return;
  if(order.remaining > 0){
    await createPendingReward(order.buyer, 'coins', {amount: order.pricePerCard * order.remaining});
  }
  order.status = 'expired';
  await storage.set(`wtb:${order.id}`, JSON.stringify(order));
}
async function cancelWantToBuy(orderId){
  const r = await storage.get(`wtb:${orderId}`);
  if(!r) return;
  const order = JSON.parse(r.value);
  if(order.status !== 'active' || order.buyer !== state.nickname) return;
  if(order.remaining > 0){
    state.player.coins += order.pricePerCard * order.remaining;
    await savePlayer(state.player);
  }
  order.status = 'cancelled';
  await storage.set(`wtb:${orderId}`, JSON.stringify(order));
  showToast(tt('已取消求購並退回剩餘金幣','Buy order cancelled, remaining coins refunded'));
  render();
}

function fmtCountdown(ms){

}

async function gmDeletePlayer(targetNick){

async function gmResetPlayer(targetNick){

  };

async function gmResetPlayerPassword(targetNick){

        <h1>${t('appName')}</h1>
        <div class="tag">Tarot Collection · <a href="https://www.instagram.com/lekcusong" target="_blank" rel="noopener" class="ig-link">@lekcusong</a></div>
      </div>
      <div class="player-chip">
        <span class="name">${playerAvatarIcon(p)} ${escapeHtml(p.nickname)}${nameWithBadgesHtml(p, 16)}</span>
        <span class="coin" id="player-coin">✦ ${p.coins}</span>
        <button id="notif-bell-btn" style="position:relative;">🔔<span id="notif-badge" style="display:${notifUnreadCount>0?'inline-flex':'none'};position:absolute;top:-4px;right:-4px;background:#e0455f;color:#fff;border-radius:999px;font-size:10px;line-height:1;padding:2px 5px;">${notifUnreadCount>9?'9+':notifUnreadCount}</span></button>
        <button id="logout-btn">${t('logout')}</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${state.tab==='home'?'active':''}" data-tab="home">${t('tabHome')}</div>
      <div class="tab ${state.tab==='resonance'?'active':''}" data-tab="resonance">${t('tabResonance')}</div>
      ${SEASON_ACTIVE ? `<div class="tab ${state.tab==='season'?'active':''}" data-tab="season">✦ ${tt(SEASON_LABEL_ZH, SEASON_LABEL_EN)}</div>` : ''}
      ${SEASON_ACTIVE ? `<div class="tab ${state.tab==='starchart'?'active':''}" data-tab="starchart">🌌 ${tt('星盤','Star Chart')}</div>` : ''}
      ${SEASON_ACTIVE ? `<div class="tab ${state.tab==='boss'?'active':''}" data-tab="boss">⚔️ ${tt('Boss 和骰子','Boss & Dice')}</div>` : ''}
      <div class="tab ${state.tab==='collection'?'active':''}" data-tab="collection">${t('tabCollection')}</div>
      <div class="tab ${state.tab==='friends'?'active':''}" data-tab="friends">${t('tabFriends')}</div>
      <div class="tab ${state.tab==='auction'?'active':''}" data-tab="auction">${t('tabAuction')}</div>
      <div class="tab ${state.tab==='farm'?'active':''}" data-tab="farm">${t('tabFarm')}</div>
      <div class="tab ${state.tab==='expedition'?'active':''}" data-tab="expedition">${t('tabExpedition')}</div>
      <div class="tab ${state.tab==='profession'?'active':''}" data-tab="profession">${t('tabProfession')}</div>
      <div class="tab ${state.tab==='leaderboard'?'active':''}" data-tab="leaderboard">${t('tabLeaderboard')}</div>
      <div class="tab ${state.tab==='chat'?'active':''}" data-tab="chat" style="position:relative;">${t('tabChat')}<span id="chat-tab-badge" style="display:${chatUnreadCount>0?'inline-flex':'none'};position:absolute;top:2px;right:2px;background:#e0455f;color:#fff;border-radius:999px;font-size:9px;line-height:1;padding:2px 5px;">${chatUnreadCount>9?'9+':chatUnreadCount}</span></div>

      ${isGM() ? `<div class="tab ${state.tab==='gm'?'active':''}" data-tab="gm">${t('tabGM')}</div>` : ''}
    </div>
    <div id="tab-body">${prevTabHtml}</div>
  `);

  const bellBtn = document.getElementById('notif-bell-btn');
  if(bellBtn){ bellBtn.onclick = async ()=>{ state.tab = 'mailbox'; await refreshPlayer(); render(); }; }
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = async ()=>{
      state.tab = t.dataset.tab;
      if(state.tab !== 'farm'){ state.farmUpgradeMode = false; state.farmUpgradeSelections = null; }
      // Re-pull our own player record from storage before rendering: friend
      // requests/trades accepted by *other* players are written straight into
      // our storage record by their client, but our in-memory state.player
      // only reflects what we last loaded/saved ourselves. Without this
      // refresh the tab can show stale data, and worse, a later savePlayer()
      // from this session could overwrite those external changes.
      await refreshPlayer();
      if(state.tab === 'chat') markChatAsRead();
      render();
    };
  });
  const tabPromise = renderTab();
  await tabPromise;
  window.scrollTo(0, scrollY);
  if(farmTickInterval){ clearInterval(farmTickInterval); farmTickInterval = null; }
  if(state.tab === 'farm'){
    farmTickInterval = setInterval(()=>{
      if(state.tab === 'farm'){ if(!state.farmUpgradeMode) renderTab(); }
      else { clearInterval(farmTickInterval); farmTickInterval = null; }
    }, 1000);
  }
  if(expeditionTickInterval){ clearInterval(expeditionTickInterval); expeditionTickInterval = null; }
  if(state.tab === 'expedition'){
    expeditionTickInterval = setInterval(async ()=>{
      if(state.tab === 'expedition'){
        // 玩家正在點開家具/飾品下拉選單或武器勾選框時，這個元素會是 document.activeElement；
        // 這時候如果整段重繪，原生 <select> 的下拉選單會因為底層 DOM 被整個換掉而被強制關閉，
        // 玩家還沒選完選項視窗就消失了。所以偵測到正在互動時，這一秒先跳過重繪，等選完失焦後再繼續倒數。
        const active = document.activeElement;
        const isPickerActive = active && typeof active.id === 'string' &&
          (active.id.startsWith('furniture-sel-') || active.id.startsWith('accessory-sel-') || active.id.startsWith('weapon-cb-'));
        if(isPickerActive) return;
        // 遠征頁每秒重繪倒數計時，會連帶重建「使用道具」的選單，重繪後預設值會被重設；
        // 重繪前先記住家具/飾品下拉選單的值、武器勾選框的勾選狀態，重繪後再還原，避免玩家選了下一秒就消失。
        const savedSelects = Array.from(document.querySelectorAll('select[id^="furniture-sel-"], select[id^="accessory-sel-"]')).map(el=>({id: el.id, value: el.value}));
        const savedChecks = Array.from(document.querySelectorAll('input[type=checkbox][id^="weapon-cb-"]:checked')).map(el=>el.id);
        await renderTab();
        savedSelects.forEach(({id, value})=>{
          const el = document.getElementById(id);
          if(el && !el.disabled && Array.from(el.options).some(o=>o.value===value)) el.value = value;
        });
        savedChecks.forEach(id=>{
          const el = document.getElementById(id);
          if(el && !el.disabled) el.checked = true;
        });
      }
      else { clearInterval(expeditionTickInterval); expeditionTickInterval = null; }
    }, 1000);
  }
  if(professionTickInterval){ clearInterval(professionTickInterval); professionTickInterval = null; }
  if(state.tab === 'profession'){
    professionTickInterval = setInterval(()=>{
      if(state.tab === 'profession'){ renderTab(); }
      else { clearInterval(professionTickInterval); professionTickInterval = null; }
    }, 30000);
  }
}

const GM_PAGE_SIZE = 10;
function pagerHtml(current, total, idPrefix){
  if(total<=1) return '';
  return `<div class="form-row" style="justify-content:center;margin-top:10px;gap:10px;align-items:center;">
    <button class="btn small secondary" id="${idPrefix}-prev" ${current<=1?'disabled':''}>‹ ${tt('上一頁','Prev')}</button>
    <span style="font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);">${tt(`第 ${current} / ${total} 頁`, `Page ${current} / ${total}`)}</span>
    <button class="btn small secondary" id="${idPrefix}-next" ${current>=total?'disabled':''}>${tt('下一頁','Next')} ›</button>
  </div>`;
}
function wirePager(current, total, idPrefix, pageField){
  if(total<=1) return;
  const prevBtn = document.getElementById(`${idPrefix}-prev`);
  const nextBtn = document.getElementById(`${idPrefix}-next`);
  if(prevBtn) prevBtn.onclick = ()=>{ state[pageField] = Math.max(1, current - 1); renderTab(); };
  if(nextBtn) nextBtn.onclick = ()=>{ state[pageField] = Math.min(total, current + 1); renderTab(); };
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderHome(body){
  const p = state.player;
  const claimed = !canClaimToday();
  const totalOwned = Object.values(p.cards).reduce((a,b)=>a+b,0);
  const uniqueOwned = Object.keys(p.cards).filter(k=>p.cards[k]>0).length;
  const streak = p.streak || 0;
  const milestones = Object.keys(STREAK_BONUS).map(Number).sort((a,b)=>a-b);
  const nextMilestone = milestones.find(m=>m > streak);

  // 若今天已經抽過，但本次瀏覽（例如重新整理頁面）還沒有暫存的抽卡結果，
  // 則從玩家資料還原今日已抽到的塔羅牌，讓「今日的塔羅指引」持續保留顯示。
  if(claimed && !(state.drawResults && state.drawSource === 'daily') && p.lastDrawCards && p.lastDrawCards.length){
    const restored = p.lastDrawCards.map(id=>DECK_BY_ID[id]).filter(Boolean);
    if(restored.length === p.lastDrawCards.length){
      state.drawResults = restored;
      state.drawSource = 'daily';
      state.flipped = restored.map(()=>true);
    }
  }

  let html = `<div class="panel draw-cta tarot-banner">
    <h2>${t('homeHeader')}</h2>
    <p class="sub">${tt(`每天可免費抽取三張塔羅牌，並獲得 ${DAILY_COINS} 枚遊戲幣`, `Draw three free tarot cards every day and earn ${DAILY_COINS} coins`)}</p>`;

  const showDrawResults = state.drawResults && state.drawSource === 'daily';
  if(showDrawResults){
    html += `<div class="card-flip-row">` + state.drawResults.map((c,i)=>`
      <div class="flip-card ${state.flipped[i]?'flipped':''}" data-card-id="${c.id}" data-idx="${i}">
        <div class="flip-card-inner">
          <div class="flip-face flip-back">🔮</div>
          <div class="flip-face flip-front cf-${c.rarity}">
            <div class="card-face${cardArtClass(c)}"${cardArtAttr(c)}>
              <span class="rarity-tag rar-${c.rarity}">${RARITY_LABEL[c.rarity]}</span>
              ${c.image ? '' : `<div class="icon">${c.icon}</div>`}
              <div class="name">${c.name}</div>
            </div>
          </div>
        </div>
      </div>
    `).join('') + `</div>`;

    const allFlipped = state.flipped && state.flipped.every(f=>f);
    html += `<div class="fortune-panel${allFlipped?' show':''}" id="fortune-panel">
      <div class="sub" style="margin-bottom:8px;">🔮 ${t('homeHeader')}</div>
      ${state.drawResults.map(c=>`
        <div class="fortune-card">
          <div class="fc-name">${c.name}</div>
          <div class="fc-text">${cardMeaning(c)}</div>
        </div>
      `).join('')}
    </div>`;
  }

  if(claimed){
    html += `<button class="btn" disabled>${tt('今日已抽取 ✓','Drawn for today ✓')}</button>
      <div class="countdown">${tt('明天再回來抽新的塔羅牌吧 ✦','Come back tomorrow for a new tarot draw ✦')}</div>`;
  } else {
    html += `<button class="btn" id="draw-btn">${tt('抽取今日塔羅 🔮',"Draw Today's Tarot 🔮")}</button>`;
  }
  html += `<div class="countdown">${tt(`連續簽到 <b style="color:var(--gold-bright);">${streak}</b> 天${nextMilestone ? ` · 再簽到 ${nextMilestone - streak} 天可額外獲得 ${STREAK_BONUS[nextMilestone]} 枚金幣 🔥` : ''}`, `<b style="color:var(--gold-bright);">${streak}</b>-day streak${nextMilestone ? ` · ${nextMilestone - streak} more day(s) for a bonus ${STREAK_BONUS[nextMilestone]} coins 🔥` : ''}`)}</div>`;
  html += `</div>`;

  const daily = ensureDailyQuests(p);
  const allDone = QUEST_DEFS.every(q=>daily.claimed.includes(q.key));
  html += `<div class="panel">
    <h2>${t('questHeader')}</h2>
    ${allDone ? `<p class="sub" style="color:var(--gold-bright);">🎉 ${t('questAllDone')}</p>` : ''}
    ${QUEST_DEFS.map(q=>{
      const progress = daily.progress[q.key] || 0;
      const done = progress >= q.target;
      const claimedQ = daily.claimed.includes(q.key);
      const reward = QUEST_SETTINGS.rewards[q.key] || 0;
      return `<div class="listing">
        <div class="left"><div class="icon-box">${q.icon}</div><div class="meta"><div>${tt(q.nameZh, q.nameEn)}</div><div class="who">${progress}/${q.target} · ✦${reward}</div></div></div>
        <div class="right">${claimedQ ? `<span style="color:var(--muted);font-size:13px;">${t('questClaimed')}</span>` : `<button class="btn small" data-claim-quest="${q.key}" ${done?'':'disabled'}>${t('questClaim')}</button>`}</div>
      </div>`;
    }).join('')}
  </div>`;

  html += `<div class="panel">
    <h2>${t('profileHeader')}</h2>
    <div class="stat-row">
      <div class="stat">${tt('遊戲幣','Coins')} <b>✦ ${p.coins}</b></div>
      <div class="stat">${tt('收藏張數','Cards Owned')} <b>${totalOwned}</b></div>
      <div class="stat">${tt('已集齊卡種','Unique Cards')} <b>${uniqueOwned} / ${DECK.length}</b></div>
      <div class="stat">${tt('連續簽到','Streak')} <b>${streak} ${tt('天','days')}</b></div>
    </div>
  </div>`;

  body.innerHTML = html;
  const btn = document.getElementById('draw-btn');
  if(btn) btn.onclick = claimDaily;
  document.querySelectorAll('[data-claim-quest]').forEach(b=>{
    b.onclick = ()=>claimQuest(b.dataset.claimQuest);
  });

  if(showDrawResults){
    COLLECTION_MODAL_LIST = state.drawResults.map(c=>c.id);
    document.querySelectorAll('.flip-card').forEach(el=>{
      el.onclick = ()=>{
        const idx = Number(el.dataset.idx);
        if(!state.flipped[idx]) return; // 還沒翻開，先別讓玩家看到內容
        openCardModal(el.dataset.cardId);
      };
    });
  }
}

async function renderMailbox(body){
  body.innerHTML = `<div class="loading-line">${tt('讀取信箱中...','Loading mailbox...')}</div>`;
  await refreshPlayer();
  const notifs = await fetchNotifications();
  const unreadNotifCount = notifs.filter(n=>!n.read).length;

  if(!state.mailboxCat) state.mailboxCat = 'all';
  const filtered = state.mailboxCat==='all' ? notifs : notifs.filter(n=>notifCategory(n.type)===state.mailboxCat);

  const NOTIF_PAGE_SIZE = 8;
  const NOTIF_MAX_PAGES = 10;
  const notifsCapped = filtered.slice(0, NOTIF_PAGE_SIZE * NOTIF_MAX_PAGES);
  const notifTotalPages = Math.max(1, Math.ceil(notifsCapped.length / NOTIF_PAGE_SIZE));
  if(!state.notifPage || state.notifPage < 1) state.notifPage = 1;
  if(state.notifPage > notifTotalPages) state.notifPage = notifTotalPages;
  const notifPageStart = (state.notifPage - 1) * NOTIF_PAGE_SIZE;
  const recentNotifs = notifsCapped.slice(notifPageStart, notifPageStart + NOTIF_PAGE_SIZE);

  const CATS = [
    {key:'all', label:t('mailboxCatAll')},
    {key:'auction', label:t('mailboxCatAuction')},
    {key:'boss', label:t('mailboxCatBoss')},
    {key:'friends', label:t('mailboxCatFriends')},
    {key:'gm', label:t('mailboxCatGM')},
    {key:'resonance', label:t('mailboxCatResonance')},
  ];

  let html = `<div class="panel">
    <h2>${t('tabMailbox')}${unreadNotifCount>0?` <span style="color:#e0455f;font-size:12px;">(${unreadNotifCount})</span>`:''}</h2>
    <div class="form-row" style="gap:6px;flex-wrap:wrap;">
      ${CATS.map(c=>`<button class="btn small${state.mailboxCat===c.key?'':' secondary'}" data-mailbox-cat="${c.key}">${c.label}</button>`).join('')}
    </div>
  </div>`;

  html += `<div class="panel">
    ${recentNotifs.length===0 ? `<div class="empty-note">${t('mailboxEmpty')}</div>` : recentNotifs.map(n=>`
      <div class="listing">
        <div class="left"><div class="icon-box">${n.type==='friend_request'?'🕊':(n.type==='steal'||n.type==='steal_bulk')?'🌾':(n.type==='water'||n.type==='water_bulk')?'🚿':(n.type.startsWith('auction')||n.type.startsWith('wtb'))?'💰':n.type==='gm_grant'?'⚡':n.type==='boss_reward'?'⚔️':n.type==='jackpot_win'?'💫':'🔔'}</div><div class="meta"><div>${escapeHtml(notifText(n))}</div><div class="who">${timeAgo(n.createdAt)}</div></div></div>
      </div>
    `).join('')}
    ${notifTotalPages > 1 ? `
      <div class="form-row" style="justify-content:center;margin-top:8px;gap:6px;">
        <button class="btn small secondary" id="notif-page-prev" ${state.notifPage<=1?'disabled':''}>‹</button>
        ${Array.from({length:notifTotalPages}, (_,i)=>i+1).map(pn=>`<button class="btn small${pn===state.notifPage?'':' secondary'}" data-notif-page="${pn}">${pn}</button>`).join('')}
        <button class="btn small secondary" id="notif-page-next" ${state.notifPage>=notifTotalPages?'disabled':''}>›</button>
      </div>
    ` : ''}
  </div>`;

  body.innerHTML = html;

  document.querySelectorAll('[data-mailbox-cat]').forEach(b=>{
    b.onclick = ()=>{ state.mailboxCat = b.dataset.mailboxCat; state.notifPage = 1; renderTab(); };
  });
  document.querySelectorAll('[data-notif-page]').forEach(b=>{
    b.onclick = ()=>{ state.notifPage = Number(b.dataset.notifPage); renderTab(); };
  });
  const notifPrevBtn = document.getElementById('notif-page-prev');
  if(notifPrevBtn) notifPrevBtn.onclick = ()=>{ state.notifPage = Math.max(1, state.notifPage - 1); renderTab(); };
  const notifNextBtn = document.getElementById('notif-page-next');
  if(notifNextBtn) notifNextBtn.onclick = ()=>{ state.notifPage = state.notifPage + 1; renderTab(); };

  // Viewing this tab counts as having seen the notifications: mark them
  // read and clear the header badge (without a full re-render, so we don't
  // interrupt anything the user is doing on this screen).
  if(unreadNotifCount > 0){
    markAllNotificationsRead(notifs).then(()=>{
      notifUnreadCount = 0;
      notifs.forEach(n=>notifBadgeSeenIds.add(n.id));
      const badge = document.getElementById('notif-badge');
      if(badge) badge.style.display = 'none';
    });
  }
}

        <div><label>${tt('起標價（選填）','Starting bid (optional)')}</label><input type="number" id="auc-start-input" min="1" placeholder="${tt('不填=不開放競標','blank = no bidding')}" style="width:130px;" /></div>
        <div><label>${tt('一口價（選填）','Buyout price (optional)')}</label><input type="number" id="auc-buyout-input" min="1" placeholder="${tt('不填=無法直接購買','blank = no direct buy')}" style="width:130px;" /></div>
        <div><label>${tt('拍賣時長','Duration')}</label><select id="auc-dur-select">${DURATIONS.map((d,i)=>`<option value="${i}">${tt(d.labelZh, d.labelEn)}</option>`).join('')}</select></div>
        <button class="btn" id="auc-list-btn">${tt('開始拍賣','Start Auction')}</button>
      </div>` : `<div class="empty-note">${tt('你目前沒有可拍賣的卡片','You have no cards available to auction')}</div>`;
    })()}
  </div>`;

  html += `<div class="panel">
    <h2>${t('myAuctionsHeader')}</h2>
    ${myAuctions.length===0 ? `<div class="empty-note">${tt('尚未建立任何拍賣','No auctions created yet')}</div>` : myAuctions.map(a=>{
      const info = auctionDisplayInfo(a);
      let statusLine;
      if(a.currentBidder){ statusLine = tt(`目前出價 ✦${a.currentBid} by ${escapeHtml(a.currentBidder)}`, `Current bid ✦${a.currentBid} by ${escapeHtml(a.currentBidder)}`); }
      else if(a.startBid && a.buyoutPrice){ statusLine = tt(`起標 ✦${a.startBid} · 一口價 ✦${a.buyoutPrice}，尚無出價`, `Start ✦${a.startBid} · Buyout ✦${a.buyoutPrice}, no bids yet`); }
      else if(a.startBid){ statusLine = tt(`起標 ✦${a.startBid}，尚無出價`, `Start ✦${a.startBid}, no bids yet`); }
      else { statusLine = tt(`直接購買價 ✦${a.buyoutPrice}`, `Buy-now price ✦${a.buyoutPrice}`); }
      const bidders = (a.bidHistory||[]).slice().reverse();
      const biddersHtml = bidders.length ? `<details class="bid-history"><summary>${tt(`出價紀錄（${bidders.length}）`, `Bid history (${bidders.length})`)}</summary>${bidders.map(b=>`<div class="bid-row">${escapeHtml(b.bidder)} — ✦${b.amount}</div>`).join('')}</details>` : '';
      const ownedQty = auctionOwnedQty(state.player, a.itemType, a.itemId);
      const ownedLine = `<div class="who" style="opacity:0.75;">${tt(`你另外擁有 ${ownedQty} 個`, `You also own: ${ownedQty}`)}</div>`;
      return `<div class="listing">
        <div class="left">
          ${info.iconHtml}
          <div class="meta"><div>${info.name}</div><div class="who">${statusLine}</div>${ownedLine}${biddersHtml}</div>
        </div>
        <div class="right">
          <span class="timer">${fmtCountdown(a.endsAt - Date.now())}</span>
          ${!a.currentBidder ? `<button class="btn small secondary" data-cancel-auction="${a.id}">${tt('取消','Cancel')}</button>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  html += `<div class="panel">
    <h2>${t('publicAuctionsHeader')}</h2>
    ${otherAuctions.length===0 ? `<div class="empty-note">${tt('目前沒有進行中的拍賣','No active auctions right now')}</div>` : otherAuctions.map(a=>{
      const info = auctionDisplayInfo(a);
      const minBid = a.currentBid > 0 ? a.currentBid+1 : a.startBid;
      const sellerLine = tt(`掛賣者：${escapeHtml(a.seller)}`, `Listed by ${escapeHtml(a.seller)}`);
      const priceLine = a.currentBidder
        ? tt(`目前出價 ✦${a.currentBid} by ${escapeHtml(a.currentBidder)}`, `Current bid ✦${a.currentBid} by ${escapeHtml(a.currentBidder)}`)
        : a.startBid ? tt(`起標 ✦${a.startBid}`, `Start ✦${a.startBid}`) : tt(`固定價格上架`, `Fixed price listing`);
      const bidders = (a.bidHistory||[]).slice().reverse();
      const biddersHtml = bidders.length ? `<details class="bid-history"><summary>${tt(`出價紀錄（${bidders.length}）`, `Bid history (${bidders.length})`)}</summary>${bidders.map(b=>`<div class="bid-row">${escapeHtml(b.bidder)} — ✦${b.amount}</div>`).join('')}</details>` : '';
      const ownedQty = auctionOwnedQty(state.player, a.itemType, a.itemId);
      const ownedLine = `<div class="who" style="opacity:0.75;">${tt(`你目前擁有 ${ownedQty} 個`, `You currently own: ${ownedQty}`)}</div>`;
      return `<div class="listing">
        <div class="left">
          ${info.iconHtml}
          <div class="meta"><div>${info.name}</div><div class="who">${sellerLine} · ${priceLine} · <span class="timer">${fmtCountdown(a.endsAt-Date.now())}</span></div>${ownedLine}${biddersHtml}</div>
        </div>
        <div class="right">
          ${a.startBid ? `
            <input type="number" min="${minBid}" placeholder="${minBid}" style="width:80px;" data-bid-input="${a.id}" />
            <button class="btn small" data-bid-btn="${a.id}">${tt('出價','Bid')}</button>
          ` : ''}
          ${a.buyoutPrice ? `<button class="btn small" data-buyout-btn="${a.id}">${tt(`直接購買 ✦${a.buyoutPrice}`, `Buy Now ✦${a.buyoutPrice}`)}</button>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  html += `<div class="panel">
    <h2>📥 ${t('createWtbHeader')}</h2>
    <p class="sub">${tt('指定卡片並開出收購單價與數量，金幣會先鎖定；其他占卜師可以直接把手上的卡賣給你。','Pick a card and set a price per card and quantity - coins are locked up front, and other diviners can sell that card straight to you.')}</p>
    <div class="form-row">
      <div><label>${tt('選擇卡片','Choose card')}</label><select id="wtb-card-select">${allCardOptions()}</select></div>
      <div><label>${tt('收購單價','Price per card')}</label><input type="number" id="wtb-price-input" min="1" style="width:110px;" /></div>
      <div><label>${tt('收購數量','Quantity')}</label><input type="number" id="wtb-qty-input" min="1" value="1" style="width:90px;" /></div>
      <div><label>${tt('求購時長','Duration')}</label><select id="wtb-dur-select">${DURATIONS.map((d,i)=>`<option value="${i}">${tt(d.labelZh, d.labelEn)}</option>`).join('')}</select></div>
      <button class="btn" id="wtb-create-btn">${tt('建立求購','Create Buy Order')}</button>
    </div>
  </div>`;

  html += `<div class="panel">
    <h2>${t('myWtbHeader')}</h2>
    ${myWtb.length===0 ? `<div class="empty-note">${tt('尚未建立任何求購單','No buy orders created yet')}</div>` : myWtb.map(o=>{
      const c = DECK_BY_ID[o.cardId];
      const statusLine = tt(`收購 ✦${o.pricePerCard}/張 · 剩餘 ${o.remaining}/${o.quantity} 張`, `✦${o.pricePerCard}/card · ${o.remaining}/${o.quantity} left`);
      return `<div class="listing">
        <div class="left">
          <div class="icon-box cf-${c.rarity}">${iconBoxInner(c)}</div>
          <div class="meta"><div>${c.name}</div><div class="who">${statusLine}</div></div>
        </div>
        <div class="right">
          <span class="timer">${fmtCountdown(o.endsAt - Date.now())}</span>
          <button class="btn small secondary" data-cancel-wtb="${o.id}">${tt('取消','Cancel')}</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  html += `<div class="panel">
    <h2>${t('publicWtbHeader')}</h2>
    ${otherWtb.length===0 ? `<div class="empty-note">${tt('目前沒有進行中的求購','No active buy orders right now')}</div>` : otherWtb.map(o=>{
      const c = DECK_BY_ID[o.cardId];
      const ownedQty = state.player.cards[o.cardId] || 0;
      const maxSell = Math.min(ownedQty, o.remaining);
      const priceLine = tt(`收購 ✦${o.pricePerCard}/張 by ${escapeHtml(o.buyer)} · 剩餘 ${o.remaining}/${o.quantity} 張`, `✦${o.pricePerCard}/card by ${escapeHtml(o.buyer)} · ${o.remaining}/${o.quantity} left`);
      return `<div class="listing">
        <div class="left">
          <div class="icon-box cf-${c.rarity}">${iconBoxInner(c)}</div>
          <div class="meta"><div>${c.name}</div><div class="who">${priceLine} · <span class="timer">${fmtCountdown(o.endsAt-Date.now())}</span></div></div>
        </div>
        <div class="right">
          ${maxSell > 0 ? `
            <input type="number" min="1" max="${maxSell}" placeholder="1" style="width:70px;" data-wtb-sell-input="${o.id}" />
            <button class="btn small" data-wtb-sell-btn="${o.id}">${tt('賣給他','Sell')}</button>
          ` : `<span class="who">${tt('你沒有這張卡','You have none of this card')}</span>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  const aucScrollY = window.scrollY;
  body.innerHTML = html;
  window.scrollTo(0, aucScrollY);

  const typeSelect = document.getElementById('auc-type-select');
  if(typeSelect) typeSelect.onchange = ()=>{
    state.auctionListType = typeSelect.value;
    renderTab();
  };
  const listBtn = document.getElementById('auc-list-btn');
  if(listBtn) listBtn.onclick = ()=>{
    const itemType = state.auctionListType;
    const itemId = document.getElementById('auc-item-select').value;
    const qtyInput = document.getElementById('auc-qty-input');
    const qty = qtyInput ? parseInt(qtyInput.value) : 1;
    const startBid = parseInt(document.getElementById('auc-start-input').value) || null;
    const buyoutPrice = parseInt(document.getElementById('auc-buyout-input').value) || null;
    const durIdx = parseInt(document.getElementById('auc-dur-select').value);
    listAuction(itemType, itemId, qty, startBid, buyoutPrice, DURATIONS[durIdx].ms);
  };
  document.querySelectorAll('[data-cancel-auction]').forEach(b=>{
    b.onclick = ()=>cancelAuction(b.dataset.cancelAuction);
  });
  document.querySelectorAll('[data-bid-btn]').forEach(b=>{
    b.onclick = ()=>{
      const aid = b.dataset.bidBtn;
      const input = document.querySelector(`[data-bid-input="${aid}"]`);
      const amount = parseInt(input.value || input.placeholder);
      placeBid(aid, amount);
    };
  });
  document.querySelectorAll('[data-buyout-btn]').forEach(b=>{
    b.onclick = ()=>buyoutAuction(b.dataset.buyoutBtn);
  });
  const wtbCreateBtn = document.getElementById('wtb-create-btn');
  if(wtbCreateBtn) wtbCreateBtn.onclick = ()=>{
    const cardId = document.getElementById('wtb-card-select').value;
    const price = parseInt(document.getElementById('wtb-price-input').value);
    const qty = parseInt(document.getElementById('wtb-qty-input').value);
    const durIdx = parseInt(document.getElementById('wtb-dur-select').value);
    createWantToBuy(cardId, price, qty, DURATIONS[durIdx].ms);
  };
  document.querySelectorAll('[data-cancel-wtb]').forEach(b=>{
    b.onclick = ()=>cancelWantToBuy(b.dataset.cancelWtb);
  });
  document.querySelectorAll('[data-wtb-sell-btn]').forEach(b=>{
    b.onclick = ()=>{
      const oid = b.dataset.wtbSellBtn;
      const input = document.querySelector(`[data-wtb-sell-input="${oid}"]`);
      const qty = parseInt(input.value || input.placeholder);
      fulfillWantToBuy(oid, qty);
    };
  });
}

async function renderFarm(body){
  const myRenderToken = renderToken; // 記住這次呼叫當下的序號，稍後寫入 DOM 前用來判斷自己是否已經過期
  const p = state.player;
  const farm = ensureFarm(p);
  const now = Date.now();
  const total = playerTotalCards(p);
  const uniqueTotal = playerUniqueCards(p);
  const farmLevel = p.farmLevel||0;

  const anyReady = farm.some(pl=>{
    const s = plotStatus(pl, now);
    return s === 'ready' || s === 'withered';
  });

  let html = `<div class="panel farm-banner" style="background-image:url('${FARM_BANNER_IMAGE}');">
    <div class="farm-banner-inner">
      <h2>${t('gardenHeader')}</h2>
      <p class="sub">${tt(`用金幣種下元素種子，靜待時間發芽 · 花色種子對應塔羅四元素 · 別忘了到下方看看好友的花園，互相澆水偷菜 🌿`, `Spend coins to plant elemental seeds and wait for them to grow · Suit seeds match the four tarot elements · Don't forget to check your friends' gardens below to water or take from each other 🌿`)}</p>
      <button class="btn small" id="farm-harvest-all-btn" ${anyReady?'':'disabled'}>${tt('收成全部','Harvest All')}</button>
    </div>
  </div>`;

  // ---------- 花園等級 / 升級 ----------
  const isMaxLevel = farmLevel >= FARM_MAX_LEVEL;
  const nextLevel = farmLevel + 1;
  const nextReq = FARM_UPGRADE_REQS[nextLevel];
  html += `<div class="panel">
    <h2>${tt(`🌿 花園等級 Lv.${farmLevel}`, `🌿 Garden Level Lv.${farmLevel}`)}${isMaxLevel ? tt('（已滿級）','(Max Level)') : ''}</h2>
    <p class="sub">${tt(`目前地塊數：${farm.length} 塊 · 消耗特定卡牌可以升級花園，解鎖更多地塊與更強的種子`, `Current plots: ${farm.length} · Consume specific cards to upgrade your garden, unlocking more plots and stronger seeds`)}</p>
    ${isMaxLevel ? '' : `
      <div class="farm-upgrade-box">
        <div class="farm-upgrade-title">${tt(`升級到 Lv.${nextLevel} 所需材料：`, `Materials needed for Lv.${nextLevel}:`)}</div>
        ${nextReq.cards.map(c=>{
          const have = countCardsForReq(p, c);
          const ok = have >= c.count;
          return `<div class="farm-upgrade-line" style="color:${ok?'#7ec98f':'var(--muted)'};">${ok?'✓':'✗'} ${reqLabel(c)}（${tt('目前擁有','have')} ${have}）</div>`;
        }).join('')}
        ${nextReq.coins ? `<div class="farm-upgrade-line" style="color:${(p.coins||0)>=nextReq.coins?'#7ec98f':'var(--muted)'};">${(p.coins||0)>=nextReq.coins?'✓':'✗'} ${tt('金幣','Coins')} ✦${nextReq.coins}（${tt('目前擁有','have')} ✦${p.coins||0}）</div>` : ''}
        ${nextReq.harvests ? (()=>{ const hv = (p.stats && p.stats.totalHarvests)||0; const hvOk = hv >= nextReq.harvests; return `<div class="farm-upgrade-line" style="color:${hvOk?'#7ec98f':'var(--muted)'};">${hvOk?'✓':'✗'} ${tt('累計收成次數','Total harvests')} ${Math.min(hv,nextReq.harvests)}/${nextReq.harvests}</div>`; })() : ''}
        ${(nextLevel===3 || nextLevel===6) ? `<div class="farm-upgrade-line" style="color:var(--gold-bright);">✨ ${tt(nextLevel===3 ? '達成後解鎖「新芽」層種子' : '達成後解鎖「綻放」層種子', nextLevel===3 ? 'Unlocks Sprout-tier seeds' : 'Unlocks Bloom-tier seeds')}</div>` : ''}
        ${nextLevel===8 ? `<div class="farm-upgrade-line" style="color:var(--gold-bright);">✨ ${tt('達成後解鎖「星輝」層花色升級','Unlocks the Starlight suit-upgrade tier')}</div>` : ''}
        ${FARM_LEVEL_PLOTS[nextLevel] > FARM_LEVEL_PLOTS[farmLevel] ? `<div class="farm-upgrade-line" style="color:var(--gold-bright);">✨ ${tt('達成後 +1 塊地','Unlocks +1 plot')}</div>` : ''}
        ${state.farmUpgradeMode ? renderFarmUpgradeSelectionUI(p, nextReq) : (nextReq.harvests && (((p.stats && p.stats.totalHarvests)||0) < nextReq.harvests) ? `<button class="btn small" disabled style="margin-top:8px;opacity:0.5;">${tt('選擇升級材料','Choose Upgrade Materials')}</button>` : `<button class="btn small" id="farm-upgrade-btn" style="margin-top:8px;">${tt('選擇升級材料','Choose Upgrade Materials')}</button>`)}
      </div>
    `}
  </div>`;

  // ---------- 花色升級（花商店素材，永久把某花色升級為新芽／綻放）----------
  ensureSuitUpgrades(p);
  html += `<div class="panel">
    <h2>${tt('🌟 花色升級', '🌟 Suit Upgrades')}</h2>
    <p class="sub">${tt('每個花色都是一條升級鏈：基礎 → 新芽 → 綻放 → 星輝。花費對應花色的卡牌把整個花色永久升級，之後在下方商店買這個花色都會直接拿到升級後的種子。', 'Each suit is an upgrade chain: base → sprout → bloom → starlight. Spend matching cards to permanently upgrade a suit — future purchases of that suit will give you the upgraded seed.')}</p>
    <div class="farm-suit-upgrade-list">
      ${SUIT_KEYS.map(suitKey=>{
        const level = suitUpgradeTier(p, suitKey);
        const curSeed = SEED_TYPES[effectiveSeedKey(p, suitKey)];
        const tierName = nextSuitUpgradeTierName(level);
        if(!tierName){
          return `<div class="farm-upgrade-line" style="color:var(--gold-bright);">${curSeed.icon} ${seedName(SEED_TYPES[suitKey])}：${tt('已達最高階','Max tier')}（${seedName(curSeed)}）</div>`;
        }
        const req = SUIT_UPGRADE_REQS[suitKey][tierName];
        const levelOk = (p.farmLevel||0) >= req.tierLevel;
        // 星輝階在花園未達 Lv.8 前先不顯示整個區塊，避免版面太長
        if(tierName === 'starlight' && !levelOk) return '';
        const nextSeed = SEED_TYPES[curSeed.upgradesTo];
        let line = `<div class="farm-upgrade-box" style="margin-top:8px;">
          <div class="farm-upgrade-title">${curSeed.icon} ${tt(`${seedName(SEED_TYPES[suitKey])}：目前為「${seedName(curSeed)}」，升級到「${seedName(nextSeed)}」`, `${seedName(SEED_TYPES[suitKey])}: currently "${seedName(curSeed)}" → upgrade to "${seedName(nextSeed)}"`)}</div>
          ${!levelOk ? `<div class="farm-upgrade-line" style="color:var(--muted);">✗ ${tt(`花園等級需達 Lv.${req.tierLevel}`, `Requires garden Lv.${req.tierLevel}`)}</div>` : ''}
          ${req.cards.map(c=>{
            const have = countCardsForReq(p, c);
            const ok = have >= c.count;
            return `<div class="farm-upgrade-line" style="color:${ok?'#7ec98f':'var(--muted)'};">${ok?'✓':'✗'} ${reqLabel(c)}（${tt('目前擁有','have')} ${have}）</div>`;
          }).join('')}
          <button class="btn small" data-suit-upgrade="${suitKey}" ${levelOk && req.cards.every(c=>countCardsForReq(p,c)>=c.count) ? '' : 'disabled'} style="margin-top:6px;">${tt('升級此花色','Upgrade Suit')}</button>
        </div>`;
        return line;
      }).join('')}
    </div>
  </div>`;

  // 花園種子分類篩選（共用一份，所有空地都套用同一個篩選結果）
  const anyEmptyPlot = farm.some(pl => plotStatus(pl, now) === 'empty');
  if(anyEmptyPlot){
    // 商店只賣基礎花色種子（依目前升級鏈換算成實際會拿到的種子）與賽季限定種子；新芽/綻放不再直接販售
    const shopBaseSeeds = SUIT_KEYS.map(k=>SEED_TYPES[effectiveSeedKey(p, k)]);
    const seasonSeeds = Object.values(SEED_TYPES).filter(s=>s.seasonOnly && SEASON_ACTIVE);
    const allSeeds = [...shopBaseSeeds, ...seasonSeeds];
    const availableGroups = Array.from(new Set(allSeeds.map(seedGroupKey)));
    if(!state.farmSeedGroup || !['all',...availableGroups].includes(state.farmSeedGroup)){
      state.farmSeedGroup = 'all';
    }
    const activeGroup = state.farmSeedGroup;
    html += `<div class="farm-seed-tabs">
      <button class="farm-seed-tab ${activeGroup==='all'?'active':''}" data-seedtab="all">${tt('全部','All')}</button>
      ${availableGroups.map(g=>{
        const meta = SEED_GROUP_META[g] || {icon:'🌱', zh:g, en:g};
        const label = appLang==='zh' ? meta.zh : meta.en;
        return `<button class="farm-seed-tab ${activeGroup===g?'active':''}" data-seedtab="${g}">${meta.icon} ${label}</button>`;
      }).join('')}
    </div>`;
  }

  html += `<div class="farm-grid">`;
  farm.forEach((plot, i)=>{
    const status = plotStatus(plot, now);
    if(status === 'empty'){
      const activeGroup = state.farmSeedGroup || 'all';
      const showLocked = !!state.farmShowLocked;
      // 商店只賣基礎花色種子（已依花色升級鏈換算成實際版本）與賽季限定種子
      const shopSeeds = [
        ...SUIT_KEYS.map(k=>SEED_TYPES[effectiveSeedKey(p, k)]),
        ...Object.values(SEED_TYPES).filter(s=>s.seasonOnly && SEASON_ACTIVE),
      ];
      const visibleSeeds = shopSeeds
        .filter(s=> activeGroup==='all' || seedGroupKey(s)===activeGroup);
      const built = visibleSeeds.map(seed=>{
        const levelLocked = (seed.tierLevel||0) > farmLevel;
        const collectionCheck = seed.uniqueUnlock ? uniqueTotal : total;
        const collectionLocked = seed.unlockTotal && collectionCheck < seed.unlockTotal;
        const locked = levelLocked || collectionLocked;
        const affordable = (p.coins||0) >= seed.cost;
        const disabled = locked || !affordable;
        let label;
        if(levelLocked) label = tt(`需花園 Lv.${seed.tierLevel}`, `Needs garden Lv.${seed.tierLevel}`);
        else if(collectionLocked) label = seed.uniqueUnlock ? tt(`需超過 ${seed.unlockTotal-1} 種不同卡`, `Need >${seed.unlockTotal-1} unique cards`) : tt(`需收藏 ${seed.unlockTotal} 張`, `Need ${seed.unlockTotal} cards`);
        else label = tt(`成長 ${formatDuration(seed.growMs)}`, `Grows in ${formatDuration(seed.growMs)}`);
        const btnHtml = `<button class="farm-seed-btn" data-plant="${i}" data-seed="${seed.key}" ${disabled?'disabled':''}>
          <span class="fs-name">${seed.icon} ${seedName(seed)}${locked?' 🔒':''}<br/><span style="color:var(--muted);font-size:11px;">${label}</span></span>
          <span class="fs-cost">✦${seed.cost}</span>
        </button>`;
        return {locked, html: btnHtml};
      });
      const unlockedHtml = built.filter(b=>!b.locked).map(b=>b.html).join('');

  const upgradeCancelBtn = document.getElementById('farm-upgrade-cancel-btn');

  document.querySelectorAll('[data-suit-upgrade]').forEach(btn=>{

  });
  document.querySelectorAll('[data-visit-farm]').forEach(btn=>{

  document.querySelectorAll('[data-water-plot]').forEach(btn=>{
    btn.onclick = ()=>waterFriendPlot(btn.dataset.waterFriend, parseInt(btn.dataset.waterPlot,10));
  });
  document.querySelectorAll('[data-steal-plot]').forEach(btn=>{
    btn.onclick = ()=>stealFriendPlot(btn.dataset.stealFriend, parseInt(btn.dataset.stealPlot,10));
  });

// 排行榜快取：直接抓全站玩家完整資料（含卡牌、材料、道具等大型物件）再挑幾個數字欄位，
// 每次有人打開排行榜分頁就整批下載一次全站玩家資料，流量成本很高。
// 改成把算好的排行結果快取進單一 key，一段時間內重複打開分頁的玩家直接讀快取，
// 只有快取過期時才需要真的抓一次全站玩家資料重新計算。
const LEADERBOARD_CACHE_KEY = 'config:leaderboard_cache';
const LEADERBOARD_CACHE_TTL_MS = 3 * 60 * 1000; // 3 分鐘內重複打開不重抓
async function computeLeaderboards(){
  const allPlayers = await fetchAllPlayers();
  const players = allPlayers.filter(pl=>pl.nickname.toLowerCase() !== GM_NICKNAME.toLowerCase());
  const byCards = players.map(pl=>({nickname:pl.nickname, total: playerTotalCards(pl)}))
    .sort((a,b)=>b.total-a.total).slice(0,10);
  const byCoins = players.map(pl=>({nickname:pl.nickname, coins: pl.coins||0}))
    .sort((a,b)=>b.coins-a.coins).slice(0,10);
  const bySlotSpend = players.map(pl=>({nickname:pl.nickname, spend: pl.slotSpend||0}))
    .sort((a,b)=>b.spend-a.spend).slice(0,10);
  const byStreak = players.map(pl=>({nickname:pl.nickname, streak: pl.expeditionRecklessStreak||0}))
    .sort((a,b)=>b.streak-a.streak).slice(0,10);
  const byBossDamage = players.map(pl=>({nickname:pl.nickname, damage: (pl.stats && pl.stats.totalBossDamage) || 0}))
    .sort((a,b)=>b.damage-a.damage).slice(0,10);
  return {byCards, byCoins, bySlotSpend, byStreak, byBossDamage, updatedAt: Date.now()};
}
async function fetchLeaderboards(){
  try{
    const r = await storage.get(LEADERBOARD_CACHE_KEY);
    if(r){
      const cached = JSON.parse(r.value);
      if(cached && (Date.now() - (cached.updatedAt||0)) < LEADERBOARD_CACHE_TTL_MS) return cached;
    }
  }catch(e){ /* 讀快取失敗就直接重算 */ }
  const fresh = await computeLeaderboards();
  storage.set(LEADERBOARD_CACHE_KEY, JSON.stringify(fresh)).catch(()=>{});
  return fresh;
}

async function renderGM(body){
  body.innerHTML = `<div class="loading-line">${tt('開啟 GM 控制台...','Opening GM console...')}</div>`;

  const cardOptions = DECK.map(c=>`<option value="${c.id}">${c.name}（${RARITY_LABEL[c.rarity]}）</option>`).join('');
  const allPlayers = (await fetchAllPlayers()).sort((a,b)=>(b.coins||0)-(a.coins||0));
  const allFriendships = await fetchAllFriendships();
  const friendCountMap = {};
  allFriendships.forEach(f=>{
    if(!f.a || !f.b) return;
    const a = f.a.toLowerCase(), b = f.b.toLowerCase();
    friendCountMap[a] = (friendCountMap[a]||0) + 1;
    friendCountMap[b] = (friendCountMap[b]||0) + 1;

  const bossSaveBtn = document.getElementById('gm-boss-save-btn');

    if(nums.some(v=>isNaN(v)||v<0) || diff <= 0 || rewardMult <= 0){
      showToast(tt('請輸入有效的非負數字','Please enter a valid non-negative number')); return;

    BOSS_DIFFICULTY_MULT = diff;
    BOSS_COIN_COST = cost;
    BOSS_BURST_DAMAGE = dmg;
    BOSS_CONTRIB_RATE = contribRatePct / 100;
    BOSS_MEGA_COIN_COST = megaCost;
    BOSS_MEGA_BURST_DAMAGE = megaDmg;
    BOSS_MEGA_WEAPON_COST = megaWeaponCost;
    BOSS_MEGA_ACCESSORY_MAX = megaAccessoryMax;
    BOSS_BASE_REWARD = {coins: baseCoins};
    BOSS_BONUS_POOL = {coins: bonusCoins};
    BOSS_REWARD_MULT = rewardMult;
    BOSS_WEAPON_DMG_BONUS = weaponPct / 100;
    BOSS_ACCESSORY_CRIT_PER = accCritPct / 100;
    BOSS_ACCESSORY_CRIT_DMG_BONUS = accCritDmgPct / 100;
    BOSS_DAILY_ATTACK_LIMIT = Math.floor(dailyLimit);
    await saveBossConfig();
    showToast(tt('Boss 設定已更新','Boss settings updated'));
    renderTab();

    BOSS_CONTRIB_RATE = DEFAULT_BOSS_CONTRIB_RATE;
    BOSS_MEGA_COIN_COST = DEFAULT_BOSS_MEGA_COIN_COST;
    BOSS_MEGA_BURST_DAMAGE = DEFAULT_BOSS_MEGA_BURST_DAMAGE;
    BOSS_MEGA_WEAPON_COST = DEFAULT_BOSS_MEGA_WEAPON_COST;

    BOSS_REWARD_MULT = DEFAULT_BOSS_REWARD_MULT;

    BOSS_ACCESSORY_CRIT_PER = DEFAULT_BOSS_ACCESSORY_CRIT_PER;
    BOSS_ACCESSORY_CRIT_DMG_BONUS = DEFAULT_BOSS_ACCESSORY_CRIT_DMG_BONUS;
    BOSS_DAILY_ATTACK_LIMIT = DEFAULT_BOSS_DAILY_ATTACK_LIMIT;
    await saveBossConfig();
    showToast(tt('已還原為預設 Boss 設定','Reverted to default boss settings'));

  };
  const diceShopSaveBtn = document.getElementById('gm-dice-shop-save-btn');

    const costQty = parseInt(document.getElementById('gm-dice-cost-qty').value, 10);
    if(cardIds.some(id=>!id) || isNaN(costQty) || costQty < 1){
      showToast(tt('請選擇 3 張卡片並輸入有效的數量','Please select 3 cards and enter a valid quantity')); return;

  if(expSaveBtn) expSaveBtn.onclick = async ()=>{
    const updated = [];
    let invalid = false;
    DEFAULT_EXPEDITION_QUESTS.forEach(def=>{
      const unlockLevel = parseInt(document.getElementById(`gm-exp-q${def.id}-unlock`).value, 10);
      const commonCount = parseInt(document.getElementById(`gm-exp-q${def.id}-common`).value, 10);
      const uncommonCount = parseInt(document.getElementById(`gm-exp-q${def.id}-uncommon`).value, 10);
      const rareCount = parseInt(document.getElementById(`gm-exp-q${def.id}-rare`).value, 10);
      const epicCount = parseInt(document.getElementById(`gm-exp-q${def.id}-epic`).value, 10);
      const tierNums = [unlockLevel, commonCount, uncommonCount, rareCount, epicCount];
      if(tierNums.some(v=>isNaN(v) || v<0) || (commonCount===0 && uncommonCount===0)){
        invalid = true;
      }
      const durations = {};
      EXPEDITION_DURATION_KEYS.forEach(durKey=>{
        const rate = parseFloat(document.getElementById(`gm-exp-q${def.id}-${durKey}-rate`).value);
        const coinMin = parseFloat(document.getElementById(`gm-exp-q${def.id}-${durKey}-coinmin`).value);
        const coinMax = parseFloat(document.getElementById(`gm-exp-q${def.id}-${durKey}-coinmax`).value);
        const rewardExp = parseFloat(document.getElementById(`gm-exp-q${def.id}-${durKey}-exp`).value);
        const failExp = parseFloat(document.getElementById(`gm-exp-q${def.id}-${durKey}-failexp`).value);
        const nums = [rate, coinMin, coinMax, rewardExp, failExp];
        if(nums.some(v=>isNaN(v) || v<0) || rate>100 || coinMax<coinMin){
          invalid = true;
        }
        durations[durKey] = {
          durationMs: EXPEDITION_DURATION_META[durKey].ms,
          commonCount, uncommonCount,
          successRate: rate/100, rewardCoinsMin: coinMin, rewardCoinsMax: coinMax, rewardExp, failExp,
        };
      });
      updated.push({id:def.id, unlockLevel, rareCount, epicCount, durations});
    });
    if(invalid){ showToast(tt('請確認每項數值皆為有效的非負數字，成功率需在0-100之間，獎勵金幣上限不小於下限，且每個等級至少需要一種卡牌','Please check all values are valid non-negative numbers, success rate is 0-100, reward max ≥ min, and each tier requires at least one card type')); return; }
    EXPEDITION_QUESTS = updated;
    await saveExpeditionConfig();
    showToast(tt('遠征設定已更新，即時對所有玩家生效 ⚡','Expedition settings updated, effective immediately for all players ⚡'));
    renderTab();
  };

    EXPEDITION_QUESTS = cloneExpeditionQuests(DEFAULT_EXPEDITION_QUESTS);
    await saveExpeditionConfig();
    showToast(tt('已還原為預設遠征設定','Reverted to default expedition settings'));
    renderTab();
  };
  const rogueSaveBtn = document.getElementById('gm-rogue-save-btn');
  if(rogueSaveBtn) rogueSaveBtn.onclick = async ()=>{
    const unlockLevel = parseInt(document.getElementById('gm-rogue-unlock').value, 10);
    let invalid = isNaN(unlockLevel) || unlockLevel < 0;
    const riskLevels = {};
    EXPEDITION_RISK_LEVEL_KEYS.forEach(key=>{
      const success = parseFloat(document.getElementById(`gm-rogue-${key}-success`).value);
      const mult = parseFloat(document.getElementById(`gm-rogue-${key}-mult`).value);
      const blessing = parseFloat(document.getElementById(`gm-rogue-${key}-blessing`).value);
      if([success, mult, blessing].some(v=>isNaN(v)) || mult < 0 || blessing < 0 || blessing > 100 || success < -100 || success > 100){
        invalid = true;
      }
      riskLevels[key] = {successDelta: success/100, rewardMult: mult, blessingWeight: blessing/100};
    });
    const eventSchedule = {};
    EXPEDITION_DURATION_KEYS.forEach(durKey=>{
      const raw = document.getElementById(`gm-rogue-schedule-${durKey}`).value;
      const parts = raw.split(',').map(s=>s.trim()).filter(s=>s.length>0).map(s=>parseFloat(s));
      if(parts.length===0 || parts.some(v=>isNaN(v) || v<0 || v>100)){ invalid = true; }
      eventSchedule[durKey] = parts.map(v=>v/100);
    });
    const streakPerWin = parseFloat(document.getElementById('gm-rogue-streak-perwin').value);
    const streakCap = parseFloat(document.getElementById('gm-rogue-streak-cap').value);
    if([streakPerWin, streakCap].some(v=>isNaN(v) || v<0 || v>100)) invalid = true;
    if(invalid){ showToast(tt('請輸入有效的數字（詳見各欄位範圍提示）','Please enter valid numbers (see each field\'s range)')); return; }
    EXPEDITION_ROGUELIKE_UNLOCK_LEVEL = unlockLevel;
    EXPEDITION_RISK_LEVEL_KEYS.forEach(key=>{
      EXPEDITION_RISK_LEVELS[key] = {...EXPEDITION_RISK_LEVELS[key], ...riskLevels[key]};
    });
    EXPEDITION_EVENT_SCHEDULE = eventSchedule;
    EXPEDITION_STREAK_BONUS_PER_WIN = streakPerWin/100;
    EXPEDITION_STREAK_BONUS_CAP = streakCap/100;
    await saveExpeditionRoguelikeConfig();
    showToast(tt('遠征 Roguelike 設定已更新，即時對所有玩家生效 ⚡','Expedition roguelike settings updated, effective immediately for all players ⚡'));
    renderTab();
  };
  const rogueResetBtn = document.getElementById('gm-rogue-reset-btn');
  if(rogueResetBtn) rogueResetBtn.onclick = async ()=>{
    EXPEDITION_ROGUELIKE_UNLOCK_LEVEL = DEFAULT_EXPEDITION_ROGUELIKE_UNLOCK_LEVEL;
    EXPEDITION_RISK_LEVELS = JSON.parse(JSON.stringify(DEFAULT_EXPEDITION_RISK_LEVELS));
    EXPEDITION_EVENT_SCHEDULE = JSON.parse(JSON.stringify(DEFAULT_EXPEDITION_EVENT_SCHEDULE));
    EXPEDITION_STREAK_BONUS_PER_WIN = DEFAULT_EXPEDITION_STREAK_BONUS_PER_WIN;
    EXPEDITION_STREAK_BONUS_CAP = DEFAULT_EXPEDITION_STREAK_BONUS_CAP;
    await saveExpeditionRoguelikeConfig();
    showToast(tt('已還原為預設 Roguelike 設定','Reverted to default roguelike settings'));
    renderTab();
  };
}

boot();
})();
