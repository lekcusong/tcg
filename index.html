(function(){
  const W = 640, H = 460;
  let canvasEl = null, ctx = null;
  const PIVOT = {x: W/2, y: 56};
  const GROUND_Y = 104;
  const STARS = Array.from({length: 22}, () => ({
    x: Math.random()*W,
    y: Math.random()*(GROUND_Y-6),
    r: 0.6 + Math.random()*1.3,
    phase: Math.random()*Math.PI*2,
  }));
  const BASE_LENGTH = 42;
  const MAX_LENGTH = 400;
  const SWING_MAX_ANGLE = 1.05;
  const SWING_SPEED = 1.5;
  const SHOOT_SPEED = 520;

  let elMoney, elGoal, elTime, elLevel, elStreakBadge, elStreakCount, btnPause, btnSound, btnCashout, btnStart, overlayEl;

  const ITEM_TYPES = {
    goldSmall:  {radius:13, weight:1.0, valueMin:75,  valueMax:150, kind:'gold'},
    goldMedium: {radius:19, weight:2.1, valueMin:210, valueMax:380, kind:'gold'},
    goldLarge:  {radius:27, weight:3.8, valueMin:285, valueMax:495, kind:'gold'},
    diamond:    {radius:11, weight:0.5, valueMin:520, valueMax:900, kind:'diamond'},
    rock:       {radius:18, weight:3.3, valueMin:10,  valueMax:60,  kind:'rock'},
    tnt:        {radius:16, weight:2.0, valueMin:0,   valueMax:0,   kind:'tnt'},
    mystery:    {radius:15, weight:1.2, valueMin:0,   valueMax:0,   kind:'mystery'},
  };

  let audioCtx = null;
  function beep(freq, dur, type){
    if(!state.soundOn) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type||'sine';
      o.frequency.value = freq;
      g.gain.value = 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }

  function rand(min,max){ return min + Math.random()*(max-min); }
  function randInt(min,max){ return Math.floor(rand(min,max+1)); }
  function choiceWeighted(entries){
    // entries: [[key, weight], ...]
    const total = entries.reduce((s,e)=>s+e[1],0);
    let r = Math.random()*total;
    for(const [key,w] of entries){ if(r<w) return key; r-=w; }
    return entries[entries.length-1][0];
  }

  function clampNum(v, min, max){ return Math.min(max, Math.max(min, v)); }

  // Sample a point inside the claw's actual reach (swing angle + max
  // length from the pivot) instead of a plain rectangle, so no item ever
  // spawns in a corner the claw physically can't swing to.
  function randomReachablePos(radius){
    const angle = rand(-SWING_MAX_ANGLE, SWING_MAX_ANGLE);
    const maxLen = Math.max(90, MAX_LENGTH - radius - 12);
    const minLen = Math.max(70, (GROUND_Y + 40) - PIVOT.y);
    const length = rand(minLen, maxLen);
    const x = clampNum(PIVOT.x + Math.sin(angle)*length, radius+20, W-radius-20);
    const y = clampNum(PIVOT.y + Math.cos(angle)*length, GROUND_Y+40, H-radius-14);
    return {x, y};
  }

  function isWithinClawReach(x, y, radius){
    const dx = x - PIVOT.x, dy = y - PIVOT.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dx, dy);
    return dist <= MAX_LENGTH - radius - 4 && Math.abs(angle) <= SWING_MAX_ANGLE;
  }

  const state = {
    level: 1,
    money: 0,
    goldEarned: 0,
    diamondEarned: 0,
    goal: 650,
    timeLeft: 60,
    streak: 0,
    running: false,
    paused: false,
    phase: 'start', // start | playing | levelComplete | gameOver
    soundOn: true,
    resultSent: false,
    items: [],
    particles: [],
    floaters: [],
    claw: {
      angle: 0,
      length: BASE_LENGTH,
      mode: 'swing', // swing | shoot | retract
      attached: null,
      retractSpeed: SHOOT_SPEED,
    },
    t: 0,
  };

  function goalForLevel(lv){ return Math.round(560 + lv*430 + lv*lv*40); }

  function generateItems(level){
    const items = [];
    const count = Math.min(20, 12 + Math.floor(level*0.9));
    const tntWeight = (level > 20 ? 2 : 1) * Math.min(14, 4 + level*1.1);
    const rockWeight = Math.min(30, 22 + level*0.6);
    const weights = [
      ['goldSmall', 30],
      ['goldMedium', 20],
      ['goldLarge', 14 + Math.min(8, level*0.4)],
      ['diamond', 7],
      ['rock', rockWeight],
      ['tnt', tntWeight],
      ['mystery', 6],
    ];

    function placeOne(type){
      const cfg = ITEM_TYPES[type];
      const {x, y} = randomReachablePos(cfg.radius);
      if(!isWithinClawReach(x, y, cfg.radius)){ return false; }
      for(const it of items){
        const dx = it.x-x, dy = it.y-y;
        if(Math.sqrt(dx*dx+dy*dy) < it.radius+cfg.radius+10){ return false; }
      }
      items.push({
        type, x, y,
        radius: cfg.radius,
        weight: cfg.weight,
        value: cfg.valueMax ? randInt(cfg.valueMin, cfg.valueMax) : 0,
        rot: rand(0, Math.PI*2),
        wobble: rand(0, Math.PI*2),
      });
      return true;
    }

    // Guarantee every level spawns at least a couple of big gold nuggets so
    // players are never stuck with a board that has no large payout item.
    const guaranteedGoldLarge = level <= 3 ? 2 : 1;
    let guaranteeAttempts = 0, placedLarge = 0;
    while(placedLarge < guaranteedGoldLarge && guaranteeAttempts < guaranteedGoldLarge*40){
      guaranteeAttempts++;
      if(placeOne('goldLarge')) placedLarge++;
    }

    let attempts = 0;
    while(items.length < count && attempts < count*40){
      attempts++;
      const type = choiceWeighted(weights);
      placeOne(type);
    }
    return items;
  }

  function startLevel(level, carryTime){
    state.level = level;
    state.goal = goalForLevel(level);
    state.items = generateItems(level);
    const timeCap = level > 10 ? 30 : 60;
    state.timeLeft = Math.min(timeCap, Math.min(75, 55 + level*1.5) + (carryTime||0));
    state.claw.mode = 'swing';
    state.claw.length = BASE_LENGTH;
    state.claw.attached = null;
    state.phase = 'playing';
    updateHud();
    hideOverlay();
  }

  function resetGame(){
    state.money = 0;
    state.goldEarned = 0;
    state.diamondEarned = 0;
    state.streak = 0;
    state.t = 0;
    state.resultSent = false;
    startLevel(1, 0);
  }

  function updateHud(){
    elMoney.textContent = '$' + Math.floor(state.money).toLocaleString();
    elGoal.textContent = '$' + state.goal.toLocaleString();
    elLevel.textContent = state.level;
    const t = Math.ceil(state.timeLeft);
    elTime.textContent = t;
    elTime.classList.toggle('mn-low', t<=10);
    if(state.streak > 1){
      elStreakBadge.classList.remove('mn-hidden');
      elStreakCount.textContent = state.streak;
    } else {
      elStreakBadge.classList.add('mn-hidden');
    }
  }

  function showOverlay(html){
    overlayEl.innerHTML = html;
    overlayEl.classList.remove('mn-hidden');
  }
  function hideOverlay(){ overlayEl.classList.add('mn-hidden'); overlayState = null; }

  // Tracks which overlay is currently supposed to be on screen (paused /
  // level-complete / settling / settled-with-result), so that if the whole
  // page re-renders mid-flow (e.g. Eu() fires while we're still awaiting the
  // reward claim), mount() below can rebuild the exact same overlay instead
  // of silently falling back to the default "Start Mining" card and losing
  // the player's view of their score/reward.
  let overlayState = null;

  function renderPausedOverlay(){
    overlayState = {type:'paused'};
    showOverlay('<div class="mn-overlay-card"><h2>⏸ 已暫停</h2><p>按下繼續回到礦坑。</p><button id="mn-btn-resume" class="mn-btn-primary">繼續</button></div>');
    document.getElementById('mn-btn-resume').onclick = ()=>{
      state.paused = false;
      btnPause.textContent = '⏸';
      hideOverlay();
    };
  }

  function renderSettlingOverlay(titleHtml, descHtml){
    overlayState = {type:'settling', titleHtml, descHtml};
    showOverlay('<div class="mn-overlay-card">'+titleHtml+descHtml+'</div>');
  }

  function renderSettlementOverlay(titleHtml, descHtml, result){
    overlayState = {type:'settled', titleHtml, descHtml, result};
    showOverlay(buildSettlementCardHtml(titleHtml, descHtml, result));
    document.getElementById('mn-btn-settlement-ok').onclick = ()=>{ hideOverlay(); if(typeof Eu === 'function') Eu(); };
  }

  // Called by mount() whenever the miner DOM has just been (re)created, to
  // put the overlay back exactly the way it was before the re-render, using
  // whichever renderer produced it originally (this also re-wires all its
  // button handlers against the fresh DOM nodes).
  function restoreOverlayForRemount(){
    if(overlayState){
      if(overlayState.type === 'paused') return renderPausedOverlay();
      if(overlayState.type === 'levelComplete') return renderLevelCompleteOverlay();
      if(overlayState.type === 'settling') return renderSettlingOverlay(overlayState.titleHtml, overlayState.descHtml);
      if(overlayState.type === 'settled') return renderSettlementOverlay(overlayState.titleHtml, overlayState.descHtml, overlayState.result);
    }
    if(state.phase === 'playing') hideOverlay();
  }

  // Builds the final "settlement" card shown when a run ends (timeout, manual
  // cash-out, or cash-out-from-level-complete). Clearly states the final
  // score and any materials/feathers converted, and always ends with a
  // confirm button - the card is never auto-dismissed, only the player
  // clicking that button (wired by the caller) closes it.
  function buildSettlementCardHtml(titleHtml, descHtml, result){
    const moneyLine = '<div class="mn-big-money">$'+Math.floor(state.money).toLocaleString()+'</div>';
    let rewardHtml;
    if(result && result.ok){
      const parts = [];
      if(result.materialQty > 0) parts.push(result.materialIcon+result.materialLabel+'×'+result.materialQty);
      if(result.featherQty > 0) parts.push('🕊️'+dc('羽毛','Feather')+'×'+result.featherQty);
      rewardHtml = parts.length
        ? '<div class="countdown" style="margin-top:8px;color:var(--gold-bright);font-size:14px;">'+parts.join('、')+'</div>'
        : '<div class="countdown" style="margin-top:8px;">'+dc('這次沒有滿足換算門檻','Not enough to convert this run')+'</div>';
      if(result.capped) rewardHtml += '<div class="countdown" style="margin-top:4px;font-size:11px;">'+dc('（偵測到分數異常，已依遊玩時間校正）','(score looked off, adjusted to your play time)')+'</div>';
    } else if(result && !result.ok && result.reason === 'noplays'){
      rewardHtml = '<div class="countdown" style="margin-top:8px;">'+dc('今天的挖礦次數已經用完了','No miner plays left today')+'</div>';
    } else {
      rewardHtml = '<div class="countdown" style="margin-top:8px;">'+dc('結算失敗，請稍後再回主頁面查看','Settlement failed - please check back later')+'</div>';
    }
    return '<div class="mn-overlay-card">'+titleHtml+descHtml+moneyLine+rewardHtml+
      '<button id="mn-btn-settlement-ok" class="mn-btn-primary" style="margin-top:14px;">'+dc('確定','OK')+'</button></div>';
  }

  function streakMultiplier(){
    return 1 + Math.min(state.streak, 6) * 0.12;
  }

  function addFloater(x,y,text,color){
    state.floaters.push({x,y,text,color,life:1});
  }
  function addBurst(x,y,color,n){
    for(let i=0;i<(n||10);i++){
      const a = Math.random()*Math.PI*2;
      const sp = rand(40,160);
      state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color});
    }
  }

  function grabResolve(item){
    const cfg = ITEM_TYPES[item.type];
    if(cfg.kind === 'gold' || cfg.kind === 'diamond'){
      state.streak++;
      const gained = Math.round(item.value * streakMultiplier());
      state.money += gained;
      if(cfg.kind === 'diamond') state.diamondEarned += gained; else state.goldEarned += gained;
      addFloater(PIVOT.x, PIVOT.y+10, '+$'+gained, cfg.kind==='diamond' ? '#b98cf0':'#e8c468');
      beep(cfg.kind==='diamond'?880:660, 0.12, 'triangle');
    } else if(cfg.kind === 'rock'){
      state.streak = 0;
      state.money += item.value;
      state.goldEarned += item.value;
      addFloater(PIVOT.x, PIVOT.y+10, '+$'+item.value, '#9a8ca8');
      beep(180,0.15,'square');
    } else if(cfg.kind === 'tnt'){
      state.streak = 0;
      state.timeLeft = Math.max(0, state.timeLeft - 10);
      addFloater(PIVOT.x, PIVOT.y+10, '-10s 💥', '#c15b5b');
      addBurst(item.x, item.y, '#c15b5b', 20);
      beep(90,0.3,'sawtooth');
    } else if(cfg.kind === 'mystery'){
      const roll = Math.random();
      if(roll < 0.35){
        const bonus = randInt(300,800);
        state.money += bonus;
        state.goldEarned += bonus; // mystery cash bonus counts toward the gold/material bucket
        addFloater(PIVOT.x, PIVOT.y+10, '+$'+bonus+' 🎁', '#e8c468');
        beep(760,0.15,'triangle');
      } else if(roll < 0.7){
        state.timeLeft += 10;
        addFloater(PIVOT.x, PIVOT.y+10, '+10s ⏱', '#5fd66a');
        beep(520,0.15,'sine');
      } else if(roll < 0.9){
        state.streak += 3;
        addFloater(PIVOT.x, PIVOT.y+10, '連擊 +3 🔥', '#b98cf0');
        beep(920,0.12,'triangle');
      } else {
        state.timeLeft = Math.max(0, state.timeLeft - 5);
        addFloater(PIVOT.x, PIVOT.y+10, '-5s 😬', '#c15b5b');
        beep(140,0.2,'square');
      }
    }
    updateHud();
    checkLevelComplete();
  }

  function renderLevelCompleteOverlay(){
    const carryTime = Math.min(60, Math.round(state.timeLeft));
    overlayState = {type:'levelComplete'};
    showOverlay(
      '<div class="mn-overlay-card">'+
      '<h2>🎉 過關！</h2>'+
      '<p>第 '+state.level+' 關達成目標，剩餘時間將轉換成下一關的加成秒數。</p>'+
      '<div class="mn-big-money">+'+carryTime+'s 加成</div>'+
      '<button id="mn-btn-next" class="mn-btn-primary">前往第 '+(state.level+1)+' 關</button>'+
      '<div style="margin-top:10px;"><button id="mn-btn-cashout-complete" style="background:none;border:none;color:#9a8ca8;text-decoration:underline;cursor:pointer;font-size:12.5px;">見好就收，結束並領取獎勵</button></div>'+
      '</div>'
    );
    document.getElementById('mn-btn-next').onclick = ()=>{
      startLevel(state.level+1, carryTime);
    };
    document.getElementById('mn-btn-cashout-complete').onclick = async ()=>{
      state.phase = 'gameOver';
      renderSettlingOverlay('<h2>💰 結算中…</h2>', '<p>正在核對本次挖礦成果，請稍候。</p>');
      const result = await submitMinerResult('cashout');
      renderSettlementOverlay(
        '<h2>💰 已結算</h2>',
        '<p>本次挖礦到此結束，第 '+state.level+' 關。</p>',
        result
      );
    };
  }

  function checkLevelComplete(){
    if(state.phase==='playing' && state.money >= state.goal){
      state.phase = 'levelComplete';
      renderLevelCompleteOverlay();
    }
  }

  // Sends the session's tallied earnings directly to claimMinerReward() (a
  // global function defined by the main game script) since the mini-game now
  // lives in the same document instead of a separate iframe. Safe to call at
  // most once per session.
  async function submitMinerResult(reason){
    if(state.resultSent) return null;
    state.resultSent = true;
    const payload = {
      goldEarned: Math.floor(state.goldEarned),
      diamondEarned: Math.floor(state.diamondEarned),
      elapsedSeconds: Math.max(1, Math.round(state.t)),
      level: state.level,
      reason: reason, // 'timeout' | 'cashout'
    };
    try{
      return await claimMinerReward(payload);
    }catch(e){
      return null;
    }
  }

  async function triggerGameOver(){
    state.phase = 'gameOver';
    renderSettlingOverlay('<h2>⏳ 時間到！</h2>', '<p>正在核對本次挖礦成果，請稍候。</p>');
    const result = await submitMinerResult('timeout');
    renderSettlementOverlay(
      '<h2>⏳ 時間到！</h2>',
      '<p>沒能在時限內達成第 '+state.level+' 關的目標金額。</p>',
      result
    );
  }

  async function cashOut(){
