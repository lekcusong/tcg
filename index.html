    return `<label style="display:inline-flex;align-items:center;gap:3px;margin:2px 8px 2px 0;font-size:11px;color:${lockFull?'var(--muted)':'inherit'};cursor:${lockFull?'default':'pointer'};">
      <input type="checkbox" data-refine-lock="${dice.id}" data-face-index="${i}" ${checked?'checked':''} ${lockFull?'disabled':''} style="cursor:pointer;">${tt('鎖','Lock')} ${diceFaceLabel(f)}
    </label>`;
  }).join('');
  const paymentToggleHtml = `<div style="display:flex;gap:6px;margin-bottom:6px;">
    <label style="display:inline-flex;align-items:center;gap:3px;font-size:11px;cursor:pointer;">
      <input type="radio" name="refine-pay-${dice.id}" data-refine-pay="${dice.id}" value="coins" ${payMethod==='coins'?'checked':''} style="cursor:pointer;">💰 ${tt('金幣','Coins')}
    </label>
    <label style="display:inline-flex;align-items:center;gap:3px;font-size:11px;cursor:pointer;">
      <input type="radio" name="refine-pay-${dice.id}" data-refine-pay="${dice.id}" value="essence" ${payMethod==='essence'?'checked':''} style="cursor:pointer;">💠 ${tt('骰子精華','Dice Essence')}
    </label>
  </div>`;
  const refineDisabled = balance < cost;
  const baseAtkDisabled = balance < baseAtkCost;
  const costLabel = payMethod === 'essence' ? `💠${cost}` : `💰${cost}`;
  const baseAtkCostLabel = payMethod === 'essence' ? `💠${baseAtkCost}` : `💰${baseAtkCost}`;
  return `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);">
    <div class="countdown" style="margin-bottom:4px;">🧪 ${tt('洗練','Refine')}　💰 <b style="color:var(--gold-bright);">${coins}</b>　💠 <b style="color:var(--gold-bright);">${essence}</b></div>
    ${paymentToggleHtml}
    <div style="margin-bottom:4px;">${checkboxesHtml}</div>
    <div class="countdown" style="margin-bottom:6px;">${tt(`已鎖定 ${locked.length} 面，未鎖定的 ${unlockedCount} 面洗練時會重骰數字＋效果`, `${locked.length} face(s) locked — the other ${unlockedCount} will be re-rolled (number + effect)`)}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn small" data-refine-dice="${dice.id}" ${refineDisabled?'disabled':''}>${tt(`洗練（${costLabel}）`, `Refine (${costLabel})`)}</button>
      <button class="btn small secondary" data-refine-base-attack="${dice.id}" ${baseAtkDisabled?'disabled':''}>${tt(`洗練基礎攻擊（${baseAtkCostLabel}）`, `Refine Base ATK (${baseAtkCostLabel})`)}</button>
    </div>
  </div>`;
}

async function loadDiceConfig(){
  try{
    const r = await storage.get(seasonKey('dice_settings'));
    if(r){
      const s = JSON.parse(r.value);
      if(s.gachaRates && typeof s.gachaRates.common === 'number') DICE_GACHA_RATES = s.gachaRates;
      if(Array.isArray(s.baseAttackRange) && s.baseAttackRange.length === 2) DICE_BASE_ATTACK_RANGE = s.baseAttackRange;
      if(Array.isArray(s.epicBaseAttackRange) && s.epicBaseAttackRange.length === 2) DICE_EPIC_BASE_ATTACK_RANGE = s.epicBaseAttackRange;
      if(Array.isArray(s.gachaCardIds) && s.gachaCardIds.length === 3 && s.gachaCardIds.every(id=>typeof id === 'string' && id)) DICE_GACHA_CARD_IDS = s.gachaCardIds;
      if(typeof s.gachaCostQty === 'number' && s.gachaCostQty > 0) DICE_GACHA_COST_QTY = s.gachaCostQty;
    }
  }catch(e){ /* keep defaults */ }
}
async function saveDiceConfig(){
  await storage.set(seasonKey('dice_settings'), JSON.stringify({
    gachaRates: DICE_GACHA_RATES, baseAttackRange: DICE_BASE_ATTACK_RANGE,
    epicBaseAttackRange: DICE_EPIC_BASE_ATTACK_RANGE,
    gachaCardIds: DICE_GACHA_CARD_IDS, gachaCostQty: DICE_GACHA_COST_QTY,
  }));
}

// 骰子面效果：記憶體中一律用「完整物件」（DICE_FACE_EFFECT_POOL 裡的那個參照，含中英文
// label/desc），存檔到伺服器時才精簡成只存 id（見 serializePlayerForStorage）。這裡是讀取
// 端的還原：不管存進來的是舊格式（完整物件，早期資料）還是新格式（純字串 id），一律用 id
// 去 DICE_FACE_EFFECT_POOL 查表換回同一個標準物件——新舊資料都吃得下，不需要額外的遷移腳本。
function resolveDiceFaceEffect(effectRef){
  if(!effectRef) return null;
  const id = typeof effectRef === 'string' ? effectRef : effectRef.id;
  return DICE_FACE_EFFECT_POOL.find(e => e.id === id) || null;
}
// 確保玩家資料有骰子欄位：p.dice（id -> 骰子物件的字典）與 p.diceSlots（3 個裝備欄）。
// 同時負責把每顆骰子每一面的 effect 從存檔精簡格式還原成完整物件（見 resolveDiceFaceEffect），
// 讓其餘程式碼（戰鬥計算、渲染）都能沿用原本讀 effect.kind / effect.label 的寫法，不用改動。
function ensureDiceInventory(p){
  if(!p.dice || typeof p.dice !== 'object') p.dice = {};
  Object.values(p.dice).forEach(d=>{
    if(typeof d.level !== 'number' || d.level < 1) d.level = 1; // 舊資料補上等級欄位
    if(typeof d.favorite !== 'boolean') d.favorite = false; // 舊資料補上最愛欄位，預設不是最愛
    if(Array.isArray(d.faces)) d.faces.forEach(f=>{ f.effect = resolveDiceFaceEffect(f.effect); });
  });
  if(!Array.isArray(p.diceSlots) || p.diceSlots.length !== DICE_EQUIP_SLOTS) p.diceSlots = [null, null, null];
  // 清掉裝備欄裡指向不存在骰子的殘留 id（例如舊資料損毀、或被賣掉/拆解後沒清乾淨）
  p.diceSlots = p.diceSlots.map(id => (id && p.dice[id]) ? id : null);
  return p.dice;
}
// 存檔前的序列化：把骰子面的 effect 從完整物件（含中英文說明文字，單面可能上百 bytes）
// 精簡成只存 id（十幾個 bytes）。玩家骰子一多，完整物件會讓存檔 JSON 膨脹到數十 KB，
// 是造成 CAS 網址過長、寫入失敗的主因之一（另一半是 CAS 比對機制本身，見 savePlayerCAS）。
// 還原邏輯見 resolveDiceFaceEffect，讀檔時會自動把 id 換回完整物件，兩邊格式互通。
function serializePlayerForStorage(p){
  if(!p.dice || typeof p.dice !== 'object') return JSON.stringify(p);
  const slimDice = {};
  for(const [id, d] of Object.entries(p.dice)){
    slimDice[id] = {
      ...d,
      faces: Array.isArray(d.faces) ? d.faces.map(f => ({num: f.num, effect: f.effect ? f.effect.id : null})) : d.faces,
    };
  }
  return JSON.stringify({...p, dice: slimDice});
}

function rollDiceQuality(){
  const r = Math.random();
  let acc = 0;
  for(const q of DICE_QUALITY_IDS){
    acc += DICE_GACHA_RATES[q];
    if(r < acc) return q;
  }
  return DICE_QUALITY_IDS[DICE_QUALITY_IDS.length - 1]; // 保底 fallback，理論上機率總和=1不會走到
}

// 骰子面數字：不是固定 1~6，是隨機分配、可重複（例如 2、2、3、3、6、6）。
function rollDiceFaceNumbers(){
  const nums = [];
  for(let i=0;i<6;i++) nums.push(1 + Math.floor(Math.random()*6));
  return nums;
}

// 加權隨機抽一個面效果：權重總和目前是 100（見 DICE_FACE_EFFECT_POOL 各項 weight），
// 常見效果權重高、稀有效果權重低，讓「效果面數量」（品質決定）仍是決定強度的主軸，
// 稀有效果只是錦上添花的驚喜，不會取代常見效果的基本盤。
function rollFaceEffect(){
  const totalWeight = DICE_FACE_EFFECT_POOL.reduce((sum, e)=> sum + (e.weight||1), 0);
  let r = Math.random() * totalWeight;
  for(const eff of DICE_FACE_EFFECT_POOL){
    r -= (eff.weight||1);
    if(r < 0) return eff;
  }
  return DICE_FACE_EFFECT_POOL[DICE_FACE_EFFECT_POOL.length-1]; // 保底 fallback，理論上不會走到
}

// 生成一顆全新骰子：品質決定「有幾面帶效果」，效果面在 6 面裡隨機挑選（不重複挑到同一個面）。
function rollNewDice(quality){
  const meta = DICE_QUALITY_META[quality];
  const nums = rollDiceFaceNumbers();
  const effectFaceCount = Math.min(meta.effectFaces, 6);
  const idxPool = [0,1,2,3,4,5];
  for(let i=idxPool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxPool[i], idxPool[j]] = [idxPool[j], idxPool[i]];
  }
  const effectIdxs = new Set(idxPool.slice(0, effectFaceCount));
  const faces = nums.map((num, i)=>({num, effect: effectIdxs.has(i) ? rollFaceEffect() : null}));
  const [minAtk, maxAtk] = quality === 'epic' ? DICE_EPIC_BASE_ATTACK_RANGE : DICE_BASE_ATTACK_RANGE;
  const baseAttack = minAtk + Math.floor(Math.random()*(maxAtk - minAtk + 1));
  return {id: uid(), quality, baseAttack, faces, level: 1, createdAt: new Date().toISOString()};
}

// 抽骰：用 CAS 保護「扣卡 + 產生骰子」這整個讀-改-寫，避免玩家手滑連點兩次
// 抽卡時兩個請求交錯，導致卡片被扣兩次卻只拿到一顆骰子（或反過來多拿骰子）。
async function doDiceGacha(){
  const p = state.player;
  ensureDiceInventory(p);
  const missing = DICE_GACHA_CARD_IDS.some(cardId => (p.cards[cardId]||0) < DICE_GACHA_COST_QTY);
  if(missing){
    showToast(tt('缺少抽骰所需的卡片（太陽、月亮、星星各1張）', 'Missing cards needed for the draw (Sun, Moon, Star x1 each)'));
    return;
  }
  let resultDice = null;
  let applied;
  try{
    applied = await updatePlayerCAS(p.nickname, (player)=>{
      ensureDiceInventory(player);
      for(const cardId of DICE_GACHA_CARD_IDS){
        const owned = player.cards[cardId] || 0;
        if(owned < DICE_GACHA_COST_QTY) throw new Error('dice gacha: insufficient card ' + cardId);
        player.cards[cardId] = owned - DICE_GACHA_COST_QTY;
      }
      const dice = rollNewDice(rollDiceQuality());
      player.dice[dice.id] = dice;
      resultDice = dice;
    });
  }catch(e){
    showToast(tt('卡片不足或資料忙碌中，請重新整理後再試', 'Not enough cards, or data is busy — refresh and try again'));
    return;
  }
  if(!applied || !resultDice) return;
  state.player = applied; // ✅ 直接沿用 CAS 寫入成功後回傳的物件，不再額外重讀——
  // 原本這裡是 `await loadPlayer(...)`，多打一次網路請求；那次讀取一旦失敗（吞例外回傳 null），
  // state.player 會被打成 null，但下面沒有檢查就照樣顯示「獲得骰子」成功訊息，導致玩家看到
  // 文字卻覺得畫面上沒拿到（其實伺服器端資料是正確的，只是這次多餘的重讀把本地畫面弄壞了）。
  const meta = DICE_QUALITY_META[resultDice.quality];
  showToast(tt(`🎲 獲得一顆「${meta.label}」骰子！`, `🎲 Obtained a ${meta.labelEn} die!`));
  renderTab();
  updateHeaderCoins();
}

// 裝備／卸下骰子：屬於低頻、單人本地操作，用一般 savePlayer 即可，
// 不像抽卡（讀-改-寫）或攻擊那樣需要 CAS。
async function doEquipDice(diceId, slotIndex){
  const p = state.player;
  ensureDiceInventory(p);
  if(!p.dice[diceId] || slotIndex < 0 || slotIndex >= DICE_EQUIP_SLOTS) return;
  p.diceSlots = p.diceSlots.map((id, i) => (i === slotIndex ? diceId : (id === diceId ? null : id)));
  await savePlayer(p);
  renderTab();
}
async function doUnequipDice(slotIndex){
  const p = state.player;
  ensureDiceInventory(p);
  if(slotIndex < 0 || slotIndex >= DICE_EQUIP_SLOTS) return;
  p.diceSlots[slotIndex] = null;
  await savePlayer(p);
  renderTab();
}
// 切換骰子「最愛」標記：純粹是一個保護開關，避免一鍵拆解/單顆拆解時不小心
// 拆掉還想留著的骰子；不影響戰鬥數值。
async function doToggleDiceFavorite(diceId){
  const p = state.player;
  ensureDiceInventory(p);
  const dice = p.dice[diceId];
  if(!dice) return;
  dice.favorite = !dice.favorite;
  await savePlayer(p);
  renderTab();
}

// 強化骰子：花「骰子精華」提升基礎攻擊力，每滿 DICE_ENHANCE_EFFECT_FACE_INTERVAL 級
// 額外嘗試把一面「空白面」轉成「效果面」。用 CAS 保護讀-改-寫，避免連點兩次強化
// 只扣一次材料卻升兩級（或反過來扣兩次材料只升一級）。
async function doEnhanceDice(diceId){
  const p = state.player;
  ensureMaterials(p);
  ensureDiceInventory(p);
  const dice = p.dice[diceId];
  if(!dice) return;
  const cost = diceEnhanceCost(dice);
  if(cost === null){ showToast(tt('此骰子已達強化等級上限','This die is already at max enhancement level')); return; }
  if(p.materials.diceEssence < cost){ showToast(tt(`骰子精華不足，需要 ${cost}`, `Not enough Dice Essence, need ${cost}`)); return; }
  let applied;
  let leveledUp = null;
  try{
    applied = await updatePlayerCAS(p.nickname, (player)=>{
      ensureMaterials(player);
      ensureDiceInventory(player);
      const d = player.dice[diceId];
      if(!d) throw new Error('dice not found');
      const c = diceEnhanceCost(d);
      if(c === null) throw new Error('max level');
      if(player.materials.diceEssence < c) throw new Error('insufficient essence');
      player.materials.diceEssence -= c;
      d.level += 1;
      d.baseAttack += (DICE_ENHANCE_ATK_PER_LEVEL[d.quality] || 6);
      let gotNewEffectFace = false;
      if(d.level % DICE_ENHANCE_EFFECT_FACE_INTERVAL === 0){
        const blankIdxs = d.faces.map((f,i)=> f.effect ? null : i).filter(i=> i!==null);
        if(blankIdxs.length > 0){
          const pick = blankIdxs[Math.floor(Math.random()*blankIdxs.length)];
          d.faces[pick] = {...d.faces[pick], effect: rollFaceEffect()};
          gotNewEffectFace = true;
        } else {
          // 六面都已經有效果了，改發額外基礎攻擊力當作獎勵，避免升級變成純浪費
          d.baseAttack += (DICE_ENHANCE_ATK_PER_LEVEL[d.quality] || 6);
        }
      }
      leveledUp = {level: d.level, gotNewEffectFace};
      bumpQuest(player, 'dice_enhance', 1);
    });
  }catch(e){
    showToast(tt('強化失敗，材料不足或資料忙碌中，請重新整理後再試','Enhancement failed — not enough materials or data busy, refresh and try again'));
    return;
  }
  if(!applied) return;
  state.player = applied; // ✅ 沿用 CAS 寫入成功後的物件，不再多打一次可能失敗的 loadPlayer
  const msg = leveledUp && leveledUp.gotNewEffectFace
    ? tt(`✨ 骰子強化至 Lv.${leveledUp.level}，並新增一面效果面！`, `✨ Die enhanced to Lv.${leveledUp.level} and gained a new effect face!`)
    : tt(`✨ 骰子強化至 Lv.${leveledUp ? leveledUp.level : '?'}！`, `✨ Die enhanced to Lv.${leveledUp ? leveledUp.level : '?'}!`);
  showToast(msg);
  renderTab();
  updateHeaderCoins();
}

// 拆解骰子：換回骰子精華，讓抽到的重複/低階骰子有去處。裝備中的骰子需先卸下才能拆，
// 避免不小心拆掉正在使用的骰子。
async function doDismantleDice(diceId){
  // 整個函式包一層 try/catch：原本 dice.quality 若因舊資料損毀而缺值，
  // DICE_QUALITY_META[dice.quality].label 會直接丟出 TypeError，
  // 而外層呼叫端只有 try/finally 沒有 catch，導致例外變成「未捕捉的 Promise rejection」，
  // 使用者畫面上完全沒有任何提示（連 confirm 對話框都不會跳出來）——這正是「點擊拆解沒反應」的成因之一。
  // 這裡統一補上 fallback 與錯誤提示，任何未預期例外都會跳 toast + 印 console，不會再靜默失敗。
  try{
    const p = state.player;
    ensureDiceInventory(p);
    const dice = p.dice[diceId];
    if(!dice){
      showToast(tt('找不到這顆骰子，畫面可能未更新，請重新整理','Die not found — try refreshing the page'));
      return;
    }
    if(p.diceSlots.includes(diceId)){
      showToast(tt('請先卸下裝備中的骰子再拆解','Unequip this die before dismantling it'));
      return;
    }
    if(dice.favorite){
      showToast(tt('這顆骰子已標記為最愛，請先取消最愛才能拆解','This die is marked as favorite — unmark it before dismantling'));
      return;
    }
    const meta = DICE_QUALITY_META[dice.quality] || DICE_QUALITY_META.common; // fallback：避免舊資料 quality 缺值時直接炸掉
    const previewRefund = diceDismantleRefund(dice);
    if(!confirm(tt(`確定要拆解這顆${meta.label}骰子嗎？將獲得 ${previewRefund} 骰子精華，此動作無法復原。`, `Dismantle this ${meta.labelEn} die? You'll receive ${previewRefund} Dice Essence. This cannot be undone.`))) return;
    let refund = 0;
    let applied;
    try{
      applied = await updatePlayerCAS(p.nickname, (player)=>{
        ensureMaterials(player);
        ensureDiceInventory(player);
        const d = player.dice[diceId];
        if(!d) throw new Error('dice not found');
        refund = diceDismantleRefund(d);
        player.materials.diceEssence += refund;
        delete player.dice[diceId];
        player.diceSlots = player.diceSlots.map(id => id === diceId ? null : id);
      });
    }catch(e){
      console.error('[doDismantleDice] updatePlayerCAS failed', e);
      showToast(tt('拆解失敗，請重新整理後再試','Dismantle failed, refresh and try again'));
      return;
    }
    if(!applied) return;
    state.player = applied; // ✅ 沿用 CAS 寫入成功後的物件，不再多打一次可能失敗的 loadPlayer
    showToast(tt(`♻️ 拆解完成，獲得 ${refund} 骰子精華`, `♻️ Dismantled — gained ${refund} Dice Essence`));
    renderTab();
    updateHeaderCoins();
  }catch(e){
    console.error('[doDismantleDice] unexpected error', e);
    showToast(tt('拆解發生未預期的錯誤，請打開瀏覽器 Console 查看詳細訊息','Unexpected error while dismantling — check the browser console for details'));
  }
}

// 一鍵拆解所有骰子：只拆「未裝備、未標記最愛」的骰子，裝備中與最愛的一律跳過，
// 避免誤拆正在使用或想留著的骰子。跟單顆拆解一樣先用目前畫面上的資料算出預覽數字
// 給玩家看，實際扣款/發放精華則在 CAS callback 內重新讀最新資料計算一次，避免預覽
// 與實際不一致（例如拆解按下去前，骰子已經被其他分頁強化過）。
async function doDismantleAllDice(){
  try{
    const p = state.player;
    ensureDiceInventory(p);
    const targets = Object.values(p.dice).filter(d => !p.diceSlots.includes(d.id) && !d.favorite);
    if(targets.length === 0){
      showToast(tt('沒有可拆解的骰子（裝備中與最愛的骰子不會被拆解）','No dice available to dismantle (equipped and favorited dice are skipped)'));
      return;
    }
    const previewRefund = targets.reduce((sum,d)=> sum + diceDismantleRefund(d), 0);
    if(!confirm(tt(`確定要拆解 ${targets.length} 顆骰子嗎？將獲得約 ${previewRefund} 骰子精華，裝備中與最愛的骰子不會被拆解，此動作無法復原。`, `Dismantle ${targets.length} dice? You'll receive about ${previewRefund} Dice Essence. Equipped and favorited dice are skipped. This cannot be undone.`))) return;
    let refund = 0;
    let count = 0;
    let applied;
    try{
      applied = await updatePlayerCAS(p.nickname, (player)=>{
        ensureMaterials(player);
        ensureDiceInventory(player);
        const ids = Object.values(player.dice).filter(d => !player.diceSlots.includes(d.id) && !d.favorite).map(d=>d.id);
        refund = 0;
        count = 0;
        ids.forEach(id=>{
          const d = player.dice[id];
          if(!d) return;
          refund += diceDismantleRefund(d);
          count += 1;
          delete player.dice[id];
        });
        player.materials.diceEssence += refund;
        player.diceSlots = player.diceSlots.map(id => (id && player.dice[id]) ? id : null);
      });
    }catch(e){
      console.error('[doDismantleAllDice] updatePlayerCAS failed', e);
      showToast(tt('拆解失敗，請重新整理後再試','Dismantle failed, refresh and try again'));
      return;
    }
    if(!applied) return;
    state.player = applied; // ✅ 沿用 CAS 寫入成功後的物件，不再多打一次可能失敗的 loadPlayer
    showToast(tt(`♻️ 一鍵拆解完成，共拆解 ${count} 顆骰子，獲得 ${refund} 骰子精華`, `♻️ Dismantled ${count} dice — gained ${refund} Dice Essence`));
    renderTab();
    updateHeaderCoins();
  }catch(e){
    console.error('[doDismantleAllDice] unexpected error', e);
    showToast(tt('拆解發生未預期的錯誤，請打開瀏覽器 Console 查看詳細訊息','Unexpected error while dismantling — check the browser console for details'));
  }
}

function diceFaceNumBonusLabel(num){
  const b = DICE_FACE_NUM_BONUS[num];
  if(!b) return '';
  if(b.critRate) return tt(`暴擊率+${Math.round(b.critRate*100)}%`, `Crit rate +${Math.round(b.critRate*100)}%`);
  if(b.critDmg) return tt(`暴擊傷害+${Math.round(b.critDmg*100)}%`, `Crit dmg +${Math.round(b.critDmg*100)}%`);
  return '';
}
function diceFaceLabel(face){
  const numBonusLabel = diceFaceNumBonusLabel(face.num);
  if(!face.effect) return numBonusLabel ? `${face.num}·${numBonusLabel}` : `${face.num}`;
  const effLabel = tt(face.effect.label, face.effect.labelEn);
  return numBonusLabel ? `${face.num}·${numBonusLabel}·${effLabel}` : `${face.num}·${effLabel}`;
}

function renderDiceCard(dice, opts){
  opts = opts || {};
  const meta = DICE_QUALITY_META[dice.quality] || DICE_QUALITY_META.common;
  const epicGlow = dice.quality === 'epic' ? 'animation:legendary-pulse 2.6s ease-in-out infinite;' : '';
  // 舊資料或損毀的骰子快照可能沒有 faces 陣列，這裡防呆避免整頁因為
  // .map() 撞到 undefined 而整個 render() 掛掉（例如拍賣行自動結算過期拍賣時）。
  const faces = Array.isArray(dice.faces) ? dice.faces : [];
  const facesHtml = faces.map(f=>{
    const numBonusLabel = diceFaceNumBonusLabel(f.num);
    const titleParts = [];
    if(numBonusLabel) titleParts.push(numBonusLabel);
    if(f.effect) titleParts.push(tt(f.effect.desc||f.effect.label, f.effect.descEn||f.effect.labelEn));
    return `<span style="display:inline-block;min-width:26px;padding:3px 5px;margin:2px;border-radius:6px;border:1px solid ${f.effect ? meta.color : 'var(--line)'};font-family:'Space Mono',monospace;font-size:11px;${f.effect ? `color:${meta.color};` : 'color:var(--muted);'}" title="${titleParts.join(' · ')}">${diceFaceLabel(f)}</span>`;
  }).join('');
  return `<div style="border:1px solid ${meta.color};border-radius:10px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,0.03);${epicGlow}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="display:flex;align-items:center;gap:6px;font-family:'Cinzel',serif;color:${meta.color};font-weight:600;">
        <span style="width:16px;height:16px;border-radius:5px;background:${meta.color};box-shadow:0 0 6px ${meta.color};display:inline-block;"></span>
        ${tt(meta.label, meta.labelEn)} ${tt('骰子','Die')}
      </span>
      <span class="countdown">${tt('基礎攻擊','Base ATK')} ${dice.baseAttack}　${tt('Lv.','Lv.')}${dice.level||1}</span>
    </div>
    <div>${facesHtml}</div>
    ${opts.showRefine ? renderDiceRefineSection(dice) : ''}
    ${opts.actionHtml || ''}
  </div>`;
}

        <span class="dice-slot-chip" style="border-color:${DICE_QUALITY_META.epic.color};color:${DICE_QUALITY_META.epic.color};"><span class="dice-slot-swatch" style="background:${DICE_QUALITY_META.epic.color};"></span>${tt('史詩','Epic')} ${Math.round(DICE_GACHA_RATES.epic*100)}%</span>

  if(gachaBtn) gachaBtn.onclick = async ()=>{
    gachaBtn.disabled = true;
    try{ await doDiceGacha(); } finally { renderTab(); }
  };
  const talismanUseBtn = document.getElementById('dice-shop-talisman-use-btn');
  if(talismanUseBtn) talismanUseBtn.onclick = async ()=>{
    talismanUseBtn.disabled = true;
    try{ await useGhostDiceTalisman(); } finally { renderTab(); }
  };
  body.querySelectorAll('[data-equip-dice]').forEach(btn=>{
    btn.onclick = ()=> doEquipDice(btn.dataset.equipDice, parseInt(btn.dataset.equipSlot, 10));
  });
  body.querySelectorAll('[data-unequip-slot]').forEach(btn=>{
    btn.onclick = ()=> doUnequipDice(parseInt(btn.dataset.unequipSlot, 10));
  });
  body.querySelectorAll('[data-toggle-favorite-dice]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      try{ await doToggleDiceFavorite(btn.dataset.toggleFavoriteDice); }
      finally { renderTab(); }
    };
  });
  const dismantleAllBtn = document.getElementById('dice-dismantle-all-btn');
  if(dismantleAllBtn) dismantleAllBtn.onclick = async ()=>{
    dismantleAllBtn.disabled = true;
    try{ await doDismantleAllDice(); }
    catch(e){ console.error('[dismantle-all-dice btn] unexpected error', e); }
    finally { renderTab(); }
  };
  body.querySelectorAll('[data-enhance-dice]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      try{ await doEnhanceDice(btn.dataset.enhanceDice); } finally { renderTab(); }
    };
  });
  body.querySelectorAll('[data-dismantle-dice]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      try{ await doDismantleDice(btn.dataset.dismantleDice); }
      catch(e){ console.error('[dismantle-dice btn] unexpected error', e); }
      finally { renderTab(); }
    };
  });
  // 洗練鎖定 checkbox：只更新 DICE_REFINE_SELECTION 這個前端暫存物件，再整頁重繪
  // 一次，讓費用文字/按鈕的 disabled 狀態、以及「鎖滿5面時其餘 checkbox 要跟著
  // disable」這件事都自動跟著 renderDiceRefineSection 重新算好，不用手動同步兩處邏輯。
  body.querySelectorAll('[data-refine-lock]').forEach(cb=>{
    cb.onchange = ()=>{
      const diceId = cb.dataset.refineLock;
      const idx = parseInt(cb.dataset.faceIndex, 10);
      const arr = diceRefineGetLocked(diceId).slice();
      if(cb.checked){
        if(arr.length >= 5){ cb.checked = false; return; } // 保險：理論上 disabled 屬性已擋掉，這裡再擋一次
        if(!arr.includes(idx)) arr.push(idx);
      }else{
        const pos = arr.indexOf(idx);
        if(pos >= 0) arr.splice(pos, 1);
      }
      DICE_REFINE_SELECTION[diceId] = arr;
      renderTab();
    };
  });
  body.querySelectorAll('[data-refine-pay]').forEach(radio=>{
    radio.onchange = ()=>{
      if(!radio.checked) return;
      DICE_REFINE_PAYMENT[radio.dataset.refinePay] = radio.value === 'essence' ? 'essence' : 'coins';
      renderTab();
    };
  });
  body.querySelectorAll('[data-refine-dice]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      const diceId = btn.dataset.refineDice;
      try{ await doRefineDice(diceId, diceRefineGetLocked(diceId), diceRefineGetPayment(diceId)); }
      catch(e){ console.error('[refine-dice btn] unexpected error', e); }
      finally { renderTab(); }
    };
  });
  body.querySelectorAll('[data-refine-base-attack]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      const diceId = btn.dataset.refineBaseAttack;
      try{ await doRefineDiceBaseAttack(diceId, diceRefineGetPayment(diceId)); }
      catch(e){ console.error('[refine-base-attack btn] unexpected error', e); }
      finally { renderTab(); }
    };
  });
}

// renderBoss 內有非同步 await（ensureBossState），
// 若使用者在等待期間切走分頁又切回來、或短時間內重複觸發渲染，
// 舊的那次非同步呼叫仍會在背景跑完，若不比對序號直接寫 DOM，
// 就可能用「先發起但後完成」的舊資料覆蓋掉新畫面（畫面回退/閃爍）。
// 每次呼叫 renderBoss 都令 bossRenderGen 遞增並記下自己的 myGen，
// 等到真的要寫 DOM 前才比對 myGen 是否仍是最新，不是就直接丟棄。
let bossRenderGen = 0;
// 記住目前 #boss-subview 裡實際渲染的是哪個子分頁（'ghost'/'dice'），renderBoss 靠這個判斷
// 「同一個子分頁重複渲染」（例如幽冥Boss攻擊後重繪）該不該跳過外層 innerHTML 整段重建——
// 避免每次攻擊都清空重建導致捲動位置被重置、又讓還原捲動位置的邏輯永遠判斷成「首次渲染」。
// 切到不同子分頁（或切回主線Boss）時才需要真的重建，讓分頁高亮跟著更新。
let lastBossSubviewKind = null;
function renderBoss(body){
  const p = state.player;
  ensureMaterials(p);
  ensureProfession(p);
  ensureDiceInventory(p);
  if(!SEASON_ACTIVE){
    body.innerHTML = `<div class="panel"><h2>${tt('Boss 戰','Boss Battle')}</h2><p class="sub">${tt('目前沒有進行中的賽季。','No season is currently active.')}</p></div>`;
    return;
  }
  // 階段三：Boss 頁面內加一組子分頁切換「戰鬥／骰子」，骰子商店先獨立運作，
  // 不影響原本的戰鬥渲染邏輯（含下方 CAS 重試、bossRenderGen 防閃爍機制）。
  if(!state.bossView) state.bossView = 'battle';
  const bossNavHtml = `<div class="tabs" style="margin:0 0 14px;">
    <div class="tab ${state.bossView==='battle'?'active':''}" data-boss-view="battle">⚔️ ${tt('Boss 戰','Battle')}</div>
    <div class="tab ${state.bossView==='ghost'?'active':''}" data-boss-view="ghost">👻 ${tt('幽冥Boss','Ghost Boss')}</div>
    <div class="tab ${state.bossView==='dice'?'active':''}" data-boss-view="dice">🎲 ${tt('骰子','Dice')}</div>
  </div>`;
  const bindBossNav = ()=>{
    body.querySelectorAll('[data-boss-view]').forEach(el=>{
      el.onclick = ()=>{ state.bossView = el.dataset.bossView; renderTab(); };
    });
  };
  if(state.bossView === 'ghost'){
    const sameSubviewAlreadyRendered = !!document.getElementById('boss-subview') && lastBossSubviewKind === 'ghost';
    if(!sameSubviewAlreadyRendered){
      body.innerHTML = `${bossNavHtml}<div id="boss-subview"></div>`;
      bindBossNav();
      lastBossSubviewKind = 'ghost';
    }
    renderGhostBoss(document.getElementById('boss-subview'));
    return;
  }
  if(state.bossView === 'dice'){
    const sameSubviewAlreadyRendered = !!document.getElementById('boss-subview') && lastBossSubviewKind === 'dice';
    if(!sameSubviewAlreadyRendered){
      body.innerHTML = `${bossNavHtml}<div id="boss-subview"></div>`;
      bindBossNav();
      lastBossSubviewKind = 'dice';
    }
    renderDiceShop(document.getElementById('boss-subview'));
    return;
  }
  lastBossSubviewKind = null;
  const myGen = ++bossRenderGen;
  const bossAlreadyRendered = !!document.getElementById('boss-burst-btn');
  if(!bossAlreadyRendered){
    body.innerHTML = `${bossNavHtml}<div class="panel"><p class="sub">${tt('讀取戰況中…','Loading battle status…')}</p></div>`;
    bindBossNav();
  }
  (async ()=>{
    const boss = await ensureBossState(p.nickname);
    if(boss.clearedToday){
      const clearedMeta = BOSS_STAGE_META[2];
      const html = `<div class="panel">
        <h2>⚔️ ${tt(SEASON_LABEL_ZH, SEASON_LABEL_EN)} · ${tt('Boss 戰','Boss Battle')}</h2>
        <p class="sub">${tt(`第 ${boss.cycle} 輪　·　今日已擊殺 ${boss.killCount||0}/${BOSS_MAX_DAILY_KILLS} 次`, `Cycle ${boss.cycle} · Kills today ${boss.killCount||0}/${BOSS_MAX_DAILY_KILLS}`)}</p>
        <div style="text-align:center;">
          <img src="${clearedMeta.img}" style="width:100%;border-radius:14px;border:1px solid var(--gold);box-shadow:0 0 22px rgba(139,107,209,0.4);margin-bottom:10px;filter:grayscale(0.6) brightness(0.7);" alt="${clearedMeta.label}" />
          <div style="font-family:'Cinzel Decorative',serif;color:var(--gold-bright);font-size:16px;">🎉 ${tt('今日擊殺上限已達成！','Daily kill limit reached!')}</div>
          <p class="sub" style="margin-top:8px;">${tt(`你今天已經擊殺了 ${boss.killCount||0} 隻 Boss，明天再來挑戰新一輪（更難）吧！`, `You've slain ${boss.killCount||0} Bosses today - come back tomorrow for a new, harder cycle!`)}</p>
        </div>
      </div>`;
      if(myGen !== bossRenderGen) return;
      const bossScrollY2 = window.scrollY;
      body.innerHTML = bossNavHtml + html;
      bindBossNav();
      if(bossAlreadyRendered) window.scrollTo(0, bossScrollY2);
      return;
    }
    // 🎁 階段C：有待開啟的寶箱時，先讓玩家 3 選 1，選完才繼續顯示戰鬥畫面/能攻擊。
    if(boss.pendingChest){
      const chestOrder = getBossChestShuffleOrder(boss);
      const chestLabels = [
        tt('神秘寶箱 一','Mystery Chest I'),
        tt('神秘寶箱 二','Mystery Chest II'),
        tt('神秘寶箱 三','Mystery Chest III'),
      ];
      const chestHtml = `<div class="panel" style="text-align:center;">
        <h2>🎁 ${tt('星軌寶箱','Star-Trail Chest')}</h2>
        <p class="sub">${tt('三個寶箱裡藏著金幣、骰子精華或職業材料，憑直覺選一個開啟吧！','Three chests hide coins, Dice Essence, or profession materials - pick one on instinct!')}</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;">
          ${chestOrder.map((choice,i)=>`<button class="btn" id="chest-choice-${choice}">🎁 ${chestLabels[i]}</button>`).join('')}
        </div>
      </div>`;
      if(myGen !== bossRenderGen) return;
      const bossScrollY3 = window.scrollY;
      body.innerHTML = bossNavHtml + chestHtml;
      bindBossNav();
      if(bossAlreadyRendered) window.scrollTo(0, bossScrollY3);
      const doChestChoice = async (choice)=>{
        ['chest-choice-coins','chest-choice-essence','chest-choice-material'].forEach(id=>{
          const b = document.getElementById(id);
          if(b) b.disabled = true;
        });
        try{
          const result = await resolveBossChestChoice(p.nickname, choice);
          if(result){
            if(result.player) state.player = result.player; // ✅ 沿用 CAS 寫入成功後的物件，不再多打一次可能失敗的 loadPlayer
            let msg = '';
            if(result.choice === 'coins') msg = tt(`🎁 開啟金幣寶箱，獲得 ✦${result.coins}！`, `🎁 Opened the coin chest, gained ✦${result.coins}!`);
            else if(result.choice === 'essence') msg = tt(`🎁 開啟精華寶箱，獲得 💠${result.essence} 骰子精華！`, `🎁 Opened the essence chest, gained 💠${result.essence} Dice Essence!`);
            else if(result.choice === 'material'){
              const def = PROFESSION_DEFS.find(d=>d.materialId===result.materialId);
              const label = def ? professionMaterialLabel(def) : result.materialId;
              const icon = def ? def.materialIcon : '';
              msg = tt(`🎁 開啟材料寶箱，獲得 ${icon}${label} ×${result.qty}！`, `🎁 Opened the material chest, gained ${icon}${label} ×${result.qty}!`);
            }
            if(msg) showToast(msg);
          }
        } finally {
          renderTab();
          updateHeaderCoins();
        }
      };
      const coinsBtn = document.getElementById('chest-choice-coins');
      const essenceBtn = document.getElementById('chest-choice-essence');
      const materialBtn = document.getElementById('chest-choice-material');
      if(coinsBtn) coinsBtn.onclick = ()=>doChestChoice('coins');
      if(essenceBtn) essenceBtn.onclick = ()=>doChestChoice('essence');
      if(materialBtn) materialBtn.onclick = ()=>doChestChoice('material');
      return;
    }
    const meta = BOSS_STAGE_META[boss.stage-1];
    const pct = Math.max(0, Math.min(100, (boss.hp/boss.maxHp)*100));
    let html = `<div class="panel">
      <h2>⚔️ ${tt(SEASON_LABEL_ZH, SEASON_LABEL_EN)} · ${tt('Boss 戰','Boss Battle')}</h2>
      <p class="sub">${tt(`第 ${boss.cycle} 輪　第 ${boss.stage}/3 階段　·　今日已擊殺 ${boss.killCount||0}/${BOSS_MAX_DAILY_KILLS} 次　·　每日 00:00 重置`, `Cycle ${boss.cycle} · Stage ${boss.stage}/3 · Kills today ${boss.killCount||0}/${BOSS_MAX_DAILY_KILLS} · Resets daily at 00:00`)}</p>
      ${(()=>{
        const affixMeta = bossAffixLabel(boss.activeAffix);
        if(!affixMeta) return '';
        return `<div style="border:1px solid var(--danger);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:rgba(193,91,91,0.10);text-align:center;">
          <div class="countdown">${affixMeta.icon} ${tt('特殊詞綴','Boss Affix')}：<b style="color:#ff8080;">${tt(affixMeta.zh, affixMeta.en)}</b></div>
          <div class="countdown" style="margin-top:2px;color:var(--muted);">${tt(affixMeta.descZh, affixMeta.descEn)}</div>
        </div>`;
      })()}
      <div style="text-align:center;">
        <img id="boss-portrait-img" class="boss-hero-img" src="${meta.img}" style="border-radius:14px;border:1px solid var(--gold);box-shadow:0 0 22px rgba(139,107,209,0.4);margin-bottom:10px;" alt="${meta.label}" />
        <div style="font-family:'Cinzel Decorative',serif;color:var(--gold-bright);font-size:16px;">${tt(meta.label, meta.labelEn)}</div>
        <p class="sub" style="margin-top:4px;">${tt(meta.desc, meta.descEn)}</p>
      </div>
      <div id="boss-hp-track" style="position:relative;background:var(--bg-panel-raised, rgba(255,255,255,0.06));border-radius:999px;height:18px;overflow:hidden;border:1px solid var(--line);margin:12px 0 4px;">
        <div id="boss-hp-ghost" class="hp-bar-ghost" style="width:${pct}%;"></div>
        <div id="boss-hp-fill" class="hp-bar-fill" style="width:${pct}%;background:linear-gradient(90deg, var(--violet), var(--gold));"></div>
      </div>
      <div class="countdown" style="text-align:center;margin-bottom:12px;">${Math.max(0,boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()} HP</div>
      ${boss.minion ? (()=>{
        const mMeta = BOSS_MINION_TYPES.find(m => m.id === boss.minion.typeId) || BOSS_MINION_TYPES[0];
        const mPct = Math.max(0, Math.min(100, (boss.minion.hp/boss.minion.maxHp)*100));
        return `<div style="border:1px solid var(--danger);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:rgba(193,91,91,0.08);display:flex;gap:10px;align-items:center;">
          ${mMeta.img ? `<img src="${mMeta.img}" alt="${tt(mMeta.labelZh, mMeta.labelEn)}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--danger);flex-shrink:0;" />` : ''}
          <div style="flex:1;min-width:0;">
            <div class="countdown" style="margin-bottom:6px;">${mMeta.icon} ${tt('小怪出現','A minion appeared')}：<b style="color:#ff8080;">${tt(mMeta.labelZh, mMeta.labelEn)}</b>　${tt('（優先承受這次攻擊傷害，殺死後才有溢出傷害打Boss）','(Absorbs this attack first — overflow damage carries to the Boss)')}</div>
            <div style="background:var(--bg-panel-raised, rgba(255,255,255,0.06));border-radius:999px;height:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:4px;">
              <div style="height:100%;width:${mPct}%;background:linear-gradient(90deg, var(--danger), #ff8080);"></div>
            </div>
            <div class="countdown">${boss.minion.hp.toLocaleString()} / ${boss.minion.maxHp.toLocaleString()} HP</div>
          </div>
        </div>`;
      })() : ''}
      ${boss.activeEvent ? (()=>{
        const eMeta = BOSS_EVENT_TYPES.find(e => e.id === boss.activeEvent.id) || BOSS_EVENT_TYPES[0];
        const isDebuff = eMeta.kind === 'debuff';
        const borderColor = isDebuff ? 'var(--danger)' : 'var(--gold)';
        const bgColor = isDebuff ? 'rgba(193,91,91,0.08)' : 'rgba(201,162,74,0.08)';
        return `<div style="border:1px solid ${borderColor};border-radius:10px;padding:10px 12px;margin-bottom:10px;background:${bgColor};">
          <div class="countdown">${eMeta.icon} ${tt('本階段事件','Stage event')}：<b style="color:${isDebuff?'#ff8080':'var(--gold-bright)'};">${tt(eMeta.labelZh, eMeta.labelEn)}</b>　${tt(eMeta.descZh, eMeta.descEn)}${boss.activeEvent.hitsLeft > 1 ? tt(`（剩餘 ${boss.activeEvent.hitsLeft} 次攻擊）`, ` (${boss.activeEvent.hitsLeft} attacks left)`) : ''}</div>
        </div>`;
      })() : ''}
      <div class="countdown" style="margin-bottom:10px;">${tt('本輪已造成傷害','Damage this cycle')}：<b style="color:var(--gold-bright);">${(boss.cycleDamage||0).toLocaleString()}</b></div>
      ${(boss.comboStreak||0) > 0 ? `<div class="countdown" style="margin-bottom:10px;">🔥 ${tt('連擊中','Combo streak')}：<b style="color:var(--gold-bright);">×${boss.comboStreak}</b>　（${tt('下次攻擊加成','next hit bonus')} +${Math.round(Math.min((boss.comboStreak||0) * BOSS_COMBO_STREAK_BONUS_PER_HIT, BOSS_COMBO_STREAK_CAP) * 100)}%）</div>` : ''}
      <div class="mb-battle-blocks">
        <div class="mb-reward-block">
          <div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px;background:rgba(139,107,209,0.06);">
            <div class="countdown">🎁 ${tt('擊殺獎勵','Kill Reward')}（${tt('基礎','base')}）：<b style="color:var(--gold-bright);">✦${bossCurrentBaseReward(boss.cycle).coins}</b></div>
            <div class="countdown">🏆 ${tt('擊殺獎池','Kill Bonus Pool')}（${tt('全額入袋','all yours')}）：<b style="color:var(--gold-bright);">✦${bossCurrentBonusPool(boss.cycle).coins.toLocaleString()}</b></div>
            <div class="countdown">💠 ${tt('破階精華','Per-stage Essence')}：<b style="color:var(--gold-bright);">${bossCurrentStageEssence(boss.cycle)}</b>　|　💠 ${tt('通關加碼','Clear bonus')}：<b style="color:var(--gold-bright);">${bossCurrentClearEssence(boss.cycle)}</b></div>
          </div>
        </div>
        <div class="mb-dice-block">
          <div class="mb-dice-equip">
            ${(()=>{
              const equipped = p.diceSlots.map(id => id ? p.dice[id] : null);
              const equippedCount = equipped.filter(Boolean).length;
              const slotsHtml = equipped.map((dice, i) => {
                if(!dice){
                  return `<span class="dice-slot-chip" style="border-style:dashed;color:var(--muted);">${tt(`骰${i+1}：未裝備`, `Die ${i+1}: empty`)}</span>`;
                }
                const meta = DICE_QUALITY_META[dice.quality];
                return `<span class="dice-slot-chip" style="border-color:${meta.color};color:${meta.color};">
                  <span class="dice-slot-swatch" style="background:${meta.color};"></span>
                  ${tt(meta.label, meta.labelEn)} · ${tt('基礎','ATK')}${dice.baseAttack}
                </span>`;
              }).join('');
              const lastRoll = state.bossLastAttack;
              const lastRollComboHtml = lastRoll && lastRoll.comboTier === 'triple' ? tt('　🎯豹子×2','　🎯Triple×2')
                : lastRoll && lastRoll.comboTier === 'pair' ? tt(`　✌️對子×${DICE_COMBO_MULT.pair}`, `　✌️Pair×${DICE_COMBO_MULT.pair}`) : '';
              const lastRollQualityComboHtml = lastRoll && lastRoll.qualityComboTier === 'triple' ? tt(`　🔷品質豹子×${DICE_QUALITY_COMBO_MULT.triple}`, `　🔷Quality Triple×${DICE_QUALITY_COMBO_MULT.triple}`)
                : lastRoll && lastRoll.qualityComboTier === 'pair' ? tt(`　🔷品質對子×${DICE_QUALITY_COMBO_MULT.pair}`, `　🔷Quality Pair×${DICE_QUALITY_COMBO_MULT.pair}`) : '';
              const lastRollStreakHtml = lastRoll && lastRoll.comboStreakBonus > 0 ? tt(`　🔥連擊+${Math.round(lastRoll.comboStreakBonus*100)}%`, `　🔥Streak+${Math.round(lastRoll.comboStreakBonus*100)}%`) : '';
              const lastRollEventHtml = lastRoll && lastRoll.eventApplied ? (()=>{
                const eMeta = BOSS_EVENT_TYPES.find(e => e.id === lastRoll.eventApplied.id);
                return eMeta ? `　${eMeta.icon}${tt(eMeta.labelZh, eMeta.labelEn)}` : '';
              })() : '';
              const lastRollHtml = (lastRoll && lastRoll.rolls) ? `<div class="countdown" style="margin-top:6px;">${tt('上次擲骰','Last roll')}：${lastRoll.rolls.map(r=>r.face.num).join(' · ')}${lastRollComboHtml}${lastRollQualityComboHtml}${lastRollStreakHtml}${lastRoll.isCrit ? tt('　💥暴擊','　💥Crit') : ''}${lastRollEventHtml}</div>` : '';
              return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;">
                <div class="countdown">🎲 ${tt('已裝備骰子','Equipped dice')}：</div>
                <div>${slotsHtml}</div>
                ${equippedCount===0 ? `<div class="countdown" style="color:var(--danger);">${tt('尚未裝備骰子，請先到「骰子」分頁裝備','No dice equipped — equip in the Dice tab first')}</div>` : ''}
                ${lastRollHtml}
              </div>`;
            })()}
          </div>
          <!-- 🎲 上次擲骰的骰子畫面：整頁重繪（renderTab）不會再把它換成空白容器——
               有上次結果時直接用 renderSettledDiceHtml 原樣畫出來、保持可見，直到玩家
               按下一次攻擊、playDiceRollAnimation 重新接管這個容器為止。 -->
          <div id="dice-roll-anim" class="dice-roll-anim mb-dice-anim" style="${state.bossLastAttack && state.bossLastAttack.rolls ? '' : 'display:none;'}">${state.bossLastAttack && state.bossLastAttack.rolls ? renderSettledDiceHtml(state.bossLastAttack.rolls, state.bossLastAttack.comboTier, state.bossLastAttack.qualityComboTier, state.bossLastAttack.allWild, state.bossLastAttack.isCrit) : ''}</div>
          <div class="mb-dice-attack">
            <button class="btn" id="boss-burst-btn" ${(p.coins < BOSS_COIN_COST) ? 'disabled' : ''}>${tt(`🎲 擲骰攻擊（消耗✦${BOSS_COIN_COST}）`, `🎲 Dice Attack (✦${BOSS_COIN_COST})`)}</button>
          </div>
        </div>
      </div>
    </div>`;
    if(myGen !== bossRenderGen) return; // 已經有更新的一次 renderBoss 呼叫了，這份是過期結果，丟棄不寫 DOM
    const bossScrollY = window.scrollY;
    body.innerHTML = bossNavHtml + html;
    bindBossNav();
    if(bossAlreadyRendered) window.scrollTo(0, bossScrollY);
    // 🔊 打擊感：剛才 performBossAttack 記下的「攻擊前血量%」在這裡消費掉——播完
    // 一次就清掉，避免下次單純切頁籤重繪（不是真的打了一下）又重播一次動畫。
    if(state.bossHpAnim && state.bossHpAnim.stage === boss.stage && state.bossHpAnim.cycle === boss.cycle){
      animateHpGhostBar('boss-hp-fill', 'boss-hp-ghost', state.bossHpAnim.fromPct, pct);
      playHitImpactFx({portraitId:'boss-portrait-img', trackId:'boss-hp-track', crit: state.bossHpAnim.crit});
    }
    state.bossHpAnim = null;
    // 點擊後立刻把兩顆按鈕都 disable，避免使用者在 performBossAttack 還沒
    // resolve（尤其 resolveBossAttack 內有 CAS 重試、可能要好幾輪 await）
    // 之前手滑連點，一次點擊觸發多次扣金幣/多次攻擊。等 performBossAttack
    // resolve 後在 finally 裡強制 renderTab() 一次，依當下最新的
    // state.player.coins 重新計算按鈕該不該恢復可點——
    // 不論 performBossAttack 是成功、因金幣不足提早 return、還是 catch 到
    // CAS 重試失敗，都會走到這裡重新計算，不會卡死在 disabled 狀態。
    const btn = document.getElementById('boss-burst-btn');
    if(btn){
      btn.onclick = async ()=>{
        btn.disabled = true;
        try{
          await doBossBurst();
        } finally {
          renderTab();
        }
      };
    }
  })();
}

// 入場按鈕：呼叫 unlockGhostBossToday，處理卡片不足的情況並顯示訊息。
async function doGhostBossUnlock(){
  const p = state.player;
  let result;
  try{
    result = await unlockGhostBossToday(p.nickname);
  }catch(e){
    showToast(tt('資料忙碌中，請稍後再試', 'Data is busy, try again shortly'));

    showToast(tt(`死神卡不足，需要 ${GHOST_BOSS_ENTRY_CARD_COST} 張`, `Not enough Death cards - need ${GHOST_BOSS_ENTRY_CARD_COST}`));
    return;
  }
  if(result.player) state.player = result.player;
  showToast(result.alreadyUnlocked
    ? tt('今日已解鎖過了', 'Already unlocked today')
    : tt('🥀 解鎖成功！幽冥活動 Boss 挑戰開始', '🥀 Unlocked! The Ghost Event Boss challenge begins'));

async function doSeasonCardDraw(){
  const p = state.player;
  ensureMaterials(p);
  const owned = SEASON_CARDS.filter(c=>!p.seasonCards[c.id]);
  if(owned.length === 0){ showToast(tt('12 張賽季卡已全部收集完成！','All 12 season cards already collected!')); return; }
  if(p.materials.contrib < SEASON_CARD_DRAW_COST){ showToast(tt(`貢獻點不足，需要 ${SEASON_CARD_DRAW_COST}`, `Not enough contribution points, need ${SEASON_CARD_DRAW_COST}`)); return; }
  p.materials.contrib -= SEASON_CARD_DRAW_COST;
  const card = owned[Math.floor(Math.random()*owned.length)];
  p.seasonCards[card.id] = (p.seasonCards[card.id]||0) + 1;
  const completedNow = SEASON_CARDS.every(c=>p.seasonCards[c.id]);
  state.seasonCardDrawResult = card;
  await savePlayer(p);
  render();
  if(completedNow){
    setTimeout(()=>{
      const legendEl = document.getElementById('season-legendary-reveal');
      if(legendEl) legendEl.classList.add('legendary-reveal');
      playLegendaryRevealFx();
      showToast(tt(`🎉 抽到「${seasonCardName(card)}」！12 張賽季卡已全部收集完成，第13張傳說卡「${seasonLegendaryCardName(SEASON_LEGENDARY_CARD)}」已解鎖！`, `🎉 Drew "${seasonCardName(card)}"! All 12 season cards collected - the 13th legendary card "${seasonLegendaryCardName(SEASON_LEGENDARY_CARD)}" is now unlocked!`), {legendary:true});
    }, 380);
  } else {
    showToast(tt(`✨ 抽到「${seasonCardName(card)}」！`, `✨ Drew "${seasonCardName(card)}"!`));
  }
}
async function doExchangeContrib(){
  const p = state.player;
  ensureMaterials(p);
  const isComplete = SEASON_CARDS.every(c=>p.seasonCards[c.id]);
  if(!isComplete){ showToast(tt('需先集滿全部賽季卡才能兌換','Collect all season cards first to unlock exchange')); return; }
  const input = document.getElementById('season-contrib-exchange-amount');
  let amount = input ? parseInt(input.value, 10) : p.materials.contrib;
  if(isNaN(amount) || amount <= 0){ showToast(tt('請輸入有效的貢獻點數量','Please enter a valid contribution amount')); return; }
  if(amount > p.materials.contrib) amount = p.materials.contrib;
  if(amount <= 0){ showToast(tt('貢獻點不足','Not enough contribution points')); return; }
  const gain = Math.floor(amount * SEASON_CONTRIB_EXCHANGE_RATE.coins);
  if(gain <= 0){ showToast(tt('兌換數量太少，無法產生任何回饋','Amount too small to yield any reward')); return; }
  p.materials.contrib -= amount;
  p.coins += gain;
  await savePlayer(p);
  render();
  showToast(tt(`✨ 兌換成功！花費 🏅${amount} 獲得 💰 金幣 x${gain}`, `✨ Exchanged! Spent 🏅${amount} for 💰 Coins x${gain}`));
}

  let html = '';
  const ownedCount = SEASON_CARDS.filter(c=>p.seasonCards[c.id]).length;

  const cardResult = state.seasonCardDrawResult;

      ${(()=>{
        const zodiacDone = starChartAllZodiacUnlocked(p);
        const zodiacCount = p.starChart.unlocked.filter(id=>STAR_CHART_ZODIAC_BY_ID[id]).length;
        return zodiacDone ? '' : `<div class="countdown" style="margin-top:8px;color:var(--muted);">🔒 ${tt(`先點滿全部 12 星座才能解鎖行星圈（目前 ${zodiacCount}/12）`, `Light up all 12 zodiac nodes first to unlock the Planet Ring (currently ${zodiacCount}/12)`)}</div>`;
      })()}
      ${Object.keys(STAR_CHART_PLANET_DEFS).map(key=>{

              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function wireStarChart(body){
  const p = state.player;
  body.querySelectorAll('.sc-node[data-zodiac]').forEach(el=>{
    el.onclick = ()=>{
      const zid = el.dataset.zodiac;
      if(p.starChart.unlocked.includes(zid)) return;
      unlockStarChartNode(zid);
    };
  });
  body.querySelectorAll('.sc-node[data-planet-node]').forEach(el=>{
    el.onclick = ()=>{
      const nid = el.dataset.planetNode;
      if(p.starChart.unlocked.includes(nid)) return;
      unlockStarChartPlanetNode(nid);
    };
  });
}

// ---------- 三牌共鳴 ----------
const DEFAULT_SLOT_SETTINGS = {
  cost: 50,
  multCommon: 2,
  multUncommon: 5,
  multRare: 15,
  contribRate: 20,   // 百分比，未中獎時投入獎池；共鳴一次／超級共鳴用同一個比例，
                      // 且會「各抽一份」：一份存入「三牌共鳴」獎池，另一份存入「幸運之星」獎池（兩池各自獨立累積）
  jackpotBase: 200,  // 中頭獎後「三牌共鳴」獎池重置的保底金額
  megaCost: 1000,       // 「超級共鳴」每次花費
  megaJackpotMult: 5,   // 「超級共鳴」中頭獎（三張史詩）時，拿走的獎池倍率
};
let SLOT_SETTINGS = {...DEFAULT_SLOT_SETTINGS};
let SLOT_JACKPOT = DEFAULT_SLOT_SETTINGS.jackpotBase;
// 上一位中獎者（任何稀有度中獎都算，不限頭獎），顯示在「三牌共鳴」面板上
// 給大家看看最近是誰手氣好；資料來源跟 initWinBroadcastPoll 共用同一個
// storage key（config:latest_win），這裡只是額外把它快取成畫面可以直接讀的全域變數。
let LATEST_WIN = null;
async function loadSlotConfig(){
  try{
    const r = await storage.get('config:slot_settings');
    if(r){
      const s = JSON.parse(r.value);
      Object.keys(DEFAULT_SLOT_SETTINGS).forEach(k=>{
        if(typeof s[k] === 'number' && s[k] >= 0) SLOT_SETTINGS[k] = s[k];
      });
    }
  }catch(e){ /* keep defaults */ }
  try{
    const r2 = await storage.get('config:slot_jackpot');
    if(r2){
      const v = parseFloat(r2.value);
      if(!isNaN(v) && v >= 0) SLOT_JACKPOT = v;
    }
  }catch(e){ /* keep default */ }
  try{
    // config:latest_win 每種等級中獎都會寫入（供全服廣播 toast 用）；
    // 這裡只在「上一筆剛好是頭獎」時才拿來當作面板上的「上一輪中獎者」，
    // 沒有另外開新的 storage key，避免多一次網路請求。
    const r3 = await storage.get('config:latest_win');
    if(r3){
      const w3 = JSON.parse(r3.value);
      if(w3.tier === 'jackpot') LATEST_WIN = w3;
    }
  }catch(e){ /* keep null，畫面上就不顯示上一輪中獎者 */ }
}
async function saveSlotSettings(newSettings){
  SLOT_SETTINGS = {...newSettings};
  await storage.set('config:slot_settings', JSON.stringify(SLOT_SETTINGS));
}
async function saveSlotJackpot(newValue){
  SLOT_JACKPOT = newValue;
  await storage.set('config:slot_jackpot', JSON.stringify(SLOT_JACKPOT));
}
// 每次要「讀取」或「疊加」獎池前，先向 storage 重新抓最新值，
// 避免用分頁自己記憶體裡過期的 SLOT_JACKPOT 去覆蓋別人剛存進去的貢獻
// （這個 KV storage 是 last-write-wins，沒有原子疊加，所以這裡用「盡量縮短讀寫間隔」
// 來把競態窗口降到最小；理論上仍有極低機率的同時寫入，但已能修正絕大多數情況）。
async function syncSlotJackpot(){
  try{
    const r = await storage.get('config:slot_jackpot');
    if(r){
      const v = parseFloat(r.value);
      if(!isNaN(v) && v >= 0){ SLOT_JACKPOT = v; return v; }
    }
  }catch(e){ /* 抓不到就先沿用目前記憶體裡的值 */ }
  return SLOT_JACKPOT;
}

// ---------- 每日星運之星（塔羅樂透） ----------
// 玩法：GMT+8 每天固定時間鎖定，系統從 78 張塔羅牌中「均勻隨機」抽出 1 張幸運卡；
// 凡是在鎖定前已完成「今日塔羅指引」抽卡、且三張牌其中含有幸運卡的玩家都算中獎。
// 幸運之星有自己獨立的獎池（FORTUNE_STAR_JACKPOT），跟「三牌共鳴」獎池（SLOT_JACKPOT）
// 分開累積：共鳴一次／超級共鳴每次沒中獎時，會依各自獨立設定的抽成比例
// （SLOT_SETTINGS.contribRate／FORTUNE_STAR_SETTINGS.contribRate）分別存入這兩個獎池，
// 彼此互不影響（不再是幸運之星整包搬走共鳴獎池）。
// 鎖定當下把「幸運之星」自己的獎池金額鎖定為本輪獎金、幸運之星獎池歸零重置；
// 公布時平分給所有中獎者，無人中獎或除不盡的餘數則留在幸運之星獎池累加到下一輪。
// 跟其餘「排程」行為一樣，這個 app 沒有後端 cron，所有時間判定
// 都是靠「剛好有玩家在那個時間點之後打開/操作 app」時順便觸發並寫回共用 storage
// （沒有玩家在線時會延遲到下一個有人上線的時刻才補觸發）。
const DEFAULT_FORTUNE_STAR_SETTINGS = {
  enabled: true,
  lockHour: 20, lockMinute: 0,     // GMT+8 鎖定時間（預設 8:00pm）
  revealHour: 22, revealMinute: 0, // GMT+8 公布時間（預設 10:00pm）
  contribRate: 20,   // 百分比，未中獎時投入幸運之星獎池；跟三牌共鳴的 contribRate 各自獨立設定
};
let FORTUNE_STAR_SETTINGS = {...DEFAULT_FORTUNE_STAR_SETTINGS};
// 幸運之星自己獨立的獎池（不再共用「三牌共鳴」的 SLOT_JACKPOT）
let FORTUNE_STAR_JACKPOT = 0;
async function loadFortuneStarConfig(){
  try{
    const r = await storage.get('config:fortunestar_settings');
    if(r){
      const s = JSON.parse(r.value);
      Object.keys(DEFAULT_FORTUNE_STAR_SETTINGS).forEach(k=>{
        if(typeof s[k] === 'boolean') FORTUNE_STAR_SETTINGS[k] = s[k];
        else if(typeof s[k] === 'number' && s[k] >= 0) FORTUNE_STAR_SETTINGS[k] = s[k];
      });
    }
  }catch(e){ /* keep defaults */ }
  try{
    const r2 = await storage.get('config:fortunestar_jackpot');
    if(r2){
      const v = parseFloat(r2.value);
      if(!isNaN(v) && v >= 0) FORTUNE_STAR_JACKPOT = v;
    }
  }catch(e){ /* keep default */ }
}
async function saveFortuneStarSettings(newSettings){
  FORTUNE_STAR_SETTINGS = {...newSettings};
  await storage.set('config:fortunestar_settings', JSON.stringify(FORTUNE_STAR_SETTINGS));
}
async function saveFortuneStarJackpot(newValue){
  FORTUNE_STAR_JACKPOT = newValue;
  await storage.set('config:fortunestar_jackpot', JSON.stringify(FORTUNE_STAR_JACKPOT));
}
// 跟 syncSlotJackpot 同樣道理：讀取／疊加幸運之星獎池前先重新抓一次最新值，
// 縮短「讀舊值→算新值→寫回」之間的競態窗口。
async function syncFortuneStarJackpot(){
  try{
    const r = await storage.get('config:fortunestar_jackpot');
    if(r){
      const v = parseFloat(r.value);
      if(!isNaN(v) && v >= 0){ FORTUNE_STAR_JACKPOT = v; return v; }
    }
  }catch(e){ /* 抓不到就先沿用目前記憶體裡的值 */ }
  return FORTUNE_STAR_JACKPOT;
}
// 用「絕對 UTC 毫秒數 + 8 小時」再取 getUTC* 的方式換算 GMT+8 的年月日/時分，
// 不受玩家瀏覽器所在時區影響，確保全服玩家看到的鎖定/公布時間點一致。
function gmt8Parts(ts){
  const d = new Date((typeof ts === 'number' ? ts : Date.now()) + 8*3600*1000);
  return {y:d.getUTCFullYear(), m:d.getUTCMonth()+1, day:d.getUTCDate(), hour:d.getUTCHours(), minute:d.getUTCMinutes()};
}
function gmt8DateStr(ts){
  const p = gmt8Parts(ts);
  return `${p.y}-${p.m}-${p.day}`;
}
function gmt8MinutesOfDay(ts){
  const p = gmt8Parts(ts);
  return p.hour*60 + p.minute;
}
function fortuneStarRoundKey(dateStr){ return `config:fortunestar_round:${dateStr}`; }
function fortuneStarEntryKey(dateStr, nick){ return `fortunestar_entry:${dateStr}:${(nick||'').toLowerCase()}`; }
async function loadFortuneStarRound(dateStr){
  try{
    const r = await storage.get(fortuneStarRoundKey(dateStr));
    if(!r) return null;
    return JSON.parse(r.value);
  }catch(e){ return null; }
}
async function saveFortuneStarRound(dateStr, round){
  await storage.set(fortuneStarRoundKey(dateStr), JSON.stringify(round));
  return round;
}
// 玩家抽今日塔羅時呼叫：把當下 GMT+8 日期的參賽紀錄（三張牌 id）寫入專屬 key，
// 之後鎖定/公布只需要 storage.list 這個日期的前綴，不用整包掃描所有玩家資料。
// 回傳明確狀態字串，讓呼叫端（claimDaily）可以把「這次抽卡到底有沒有真的被列入
// 本輪參賽名單」如實記錄下來，而不是事後用本地日期去近似猜測：
//   'disabled' - 星運之星功能未開啟，本來就不需要記錄
//   'locked'   - 已過今日 GMT+8 鎖定時間，本次抽卡不算入本輪參賽名單（靜默放棄寫入）
//   'error'    - 該寫入時發生錯誤（best effort，不影響其餘抽卡流程，但玩家資格不確定）
//   'ok'       - 已成功寫入本輪參賽名單
async function recordFortuneStarEntry(nickname, cardIds){
  if(!FORTUNE_STAR_SETTINGS.enabled) return 'disabled';
  const dateStr = gmt8DateStr();
  // 鎖定時間之後才抽的人不算這次參賽者（維持跟現有存檔一致的「最後寫入生效」邏輯，
  // 這裡用寫入前的即時時間判斷即可，不需要額外鎖）。
  if(gmt8MinutesOfDay() >= FORTUNE_STAR_SETTINGS.lockHour*60 + FORTUNE_STAR_SETTINGS.lockMinute) return 'locked';
  try{
    await storage.set(fortuneStarEntryKey(dateStr, nickname), JSON.stringify({nickname, cardIds, enteredAt: Date.now()}));
    return 'ok';
  }catch(e){ /* best effort：頂多這次沒被記錄到參賽名單，不影響其餘抽卡流程 */ return 'error'; }
}

async function listFortuneStarEntries(dateStr){

    return parseKvRows(rows);

}
// 名單鎖定前（round 還是 open / 尚未建立）目前已經有多少人參加的即時人數快取，

let FORTUNE_STAR_LIVE_COUNT_TODAY = null;
// 「我今天是否已經在參賽名單裡」的即時查核結果：true/false 代表已經查到明確答案，
// null 代表還沒查過。之所以獨立於 state.player.lastFortuneStarEntry 這個快取欄位，
// 是因為抽卡時「寫入參賽名單」跟「把狀態存回玩家資料」是兩次分開的存檔，遇到網路

// 也分得到獎池。這裡直接拿當下的參賽名單核對是否有自己，作為更準確的判斷依據。
let FORTUNE_STAR_ENTERED_TODAY = null;
async function refreshFortuneStarLiveCount(){
  if(!FORTUNE_STAR_SETTINGS.enabled) return;
  try{
    const entries = await listFortuneStarEntries(gmt8DateStr());
    FORTUNE_STAR_LIVE_COUNT_TODAY = entries.length;
    const myLower = (state.nickname||'').toLowerCase();
    FORTUNE_STAR_ENTERED_TODAY = entries.some(e=>(e.nickname||'').toLowerCase() === myLower);
  }catch(e){ /* keep previous value */ }

async function lockFortuneStarRound(dateStr){
  try{
    // 防止同一天被重複鎖定：例如 GM 連點兩次「強制鎖定」測試按鈕，或多個玩家
    // 分頁的排程輪詢剛好同時判斷「今天還沒鎖定」而一起觸發。若已經是 locked／
    // revealed，直接回傳既有的 round，不要再鎖一次——否則第二次鎖定會把「這次」
    // 的（已經重置成保底值的）獎池數字寫進 round，蓋掉第一次鎖定時真正鎖進去的
    // 金額，導致那筆錢從此在系統裡憑空消失（沒有玩家拿到，也不會退回獎池）。
    const existing = await loadFortuneStarRound(dateStr);
    if(existing && existing.phase !== 'open'){
      return existing;
    }
    await syncFortuneStarJackpot();
    const entries = await listFortuneStarEntries(dateStr);
    const lucky = DECK[Math.floor(Math.random()*DECK.length)]; // 均勻隨機，不套用稀有度加權
    const pool = FORTUNE_STAR_JACKPOT;
    const round = {date: dateStr, phase:'locked', pool, luckyCardId: lucky.id, participantCount: entries.length, lockedAt: Date.now()};
    await saveFortuneStarRound(dateStr, round);
    // 幸運之星獎池歸零重置，重新從下一輪的抽成累積（不影響「三牌共鳴」自己的獎池）
    await saveFortuneStarJackpot(0);
    return round;
  }catch(e){ return null; }
}
async function revealFortuneStarRound(dateStr, round){
  try{
    // 重新讀一次最新狀態：如果已經被別的觸發來源（另一個玩家分頁的排程、或 GM
    // 連點到第二次的「強制公布」）公布過了，直接回傳既有結果就好，不要照傳進來的
    // 舊 round 物件重算一次——否則會對獎池重複加總、或對中獎者重複發放獎金。
    const latest = await loadFortuneStarRound(dateStr);
    if(latest && latest.phase === 'revealed') return latest;
    if(latest) round = latest;
    const entries = await listFortuneStarEntries(dateStr);
    const winners = entries.filter(e=>e.cardIds && e.cardIds.includes(round.luckyCardId));
    let winnerPayload = [];
    if(winners.length > 0){
      const share = Math.floor(round.pool / winners.length);
      const remainder = round.pool - share*winners.length;
      if(share > 0){
        await Promise.all(winners.map(async w=>{
          await createPendingReward(w.nickname, 'coins', {amount: share, source:'fortunestar'});
          await createNotification(w.nickname, 'system', 'fortunestar_win', {amount: share, date: dateStr});
        }));
      }
      // 徽章解鎖統計獨立於分潤金額，即使獎池被瓜分到每人 0 元，中獎紀錄仍然算數
      await Promise.all(winners.map(w=>createPendingReward(w.nickname, 'stat_bump', {statKey:'totalFortuneStarWins', amount:1})));
      winnerPayload = winners.map(w=>({nickname: w.nickname, amount: share}));
      // 除不盡的餘數留在幸運之星自己的獎池，累加到下一輪，不會憑空消失
      if(remainder > 0){ await syncFortuneStarJackpot(); await saveFortuneStarJackpot(FORTUNE_STAR_JACKPOT + remainder); }
    } else if(round.pool > 0){
      // 無人中獎：獎池退回幸運之星自己的獎池，累加到下一輪（不會流回「三牌共鳴」獎池）
      await syncFortuneStarJackpot();
      await saveFortuneStarJackpot(FORTUNE_STAR_JACKPOT + round.pool);
    }
    const newRound = {...round, phase:'revealed', winners: winnerPayload, revealedAt: Date.now()};
    await saveFortuneStarRound(dateStr, newRound);
    return newRound;
  }catch(e){ return round; }
}
// 依序檢查「昨天」與「今天」兩個 GMT+8 日期的星運之星狀態，該鎖定/該公布就補做，
// 讓即使整段時間完全沒人在線、隔天才有人打開 app 的情況也能補上（僅限跨一天，
// 超過一天以上沒人上線這種極端情況本來就是這個無後端排程架構的既有限制）。
let fortuneStarChecking = false;
async function checkFortuneStarSchedule(){
  if(fortuneStarChecking) return;
  fortuneStarChecking = true;
  try{
    if(!FORTUNE_STAR_SETTINGS.enabled) return;
    const lockMin = FORTUNE_STAR_SETTINGS.lockHour*60 + FORTUNE_STAR_SETTINGS.lockMinute;
    const revealMin = FORTUNE_STAR_SETTINGS.revealHour*60 + FORTUNE_STAR_SETTINGS.revealMinute;
    const todayDate = gmt8DateStr();
    const yesterdayDate = gmt8DateStr(Date.now() - 24*3600*1000);
    for(const dateStr of [yesterdayDate, todayDate]){
      const isToday = dateStr === todayDate;
      const nowMin = isToday ? gmt8MinutesOfDay() : 24*60; // 非今天：視為當天已經完全過完，該做的都要補做
      let round = await loadFortuneStarRound(dateStr);
      if(!round && nowMin >= lockMin){
        round = await lockFortuneStarRound(dateStr);
      }
      if(round && round.phase === 'open' && nowMin >= lockMin){
        round = await lockFortuneStarRound(dateStr);
      }
      if(round && round.phase === 'locked' && nowMin >= revealMin){
        round = await revealFortuneStarRound(dateStr, round);
      }
      if(isToday){
        FORTUNE_STAR_ROUND_TODAY = round; // null 代表今天還沒鎖定（仍是開放參賽狀態）
        // 名單還沒鎖定時，順便刷新即時參賽人數快取，給首頁面板顯示用；
        // 一旦鎖定，round.participantCount 就是正式人數，不用再查即時的。
        if(!round || round.phase === 'open') await refreshFortuneStarLiveCount();
      }
    }
  }catch(e){ /* best effort，下次輪詢/開啟 app 再重試 */ }
  finally{ fortuneStarChecking = false; }
}
function initFortuneStarPoll(){
  const poll = ()=>{
    if(document.visibilityState !== 'visible') return; // 背景分頁不輪詢
    if(!state.nickname) return;
    checkFortuneStarSchedule().then(()=>{

}

// 簡單的字串 hash，拿來當 seeded PRNG 的種子（不需要密碼學等級，只求同一天同一人結果穩定）。
function hashStringToSeed(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h >>> 0);
}
// mulberry32：輕量 seeded PRNG，同種子每次呼叫序列都相同。
function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 用「暱稱+日期」決定性洗牌，從非固定任務中抽出當天要出現的任務 key 清單（含固定的 checkin）。
function pickDailyQuestKeys(nickname, dateStr){
  const fixedKeys = QUEST_DEFS.filter(q=>q.fixed).map(q=>q.key);
  const poolDefs = QUEST_DEFS.filter(q=>!q.fixed);
  const need = Math.max(0, DAILY_QUEST_POOL_SIZE - fixedKeys.length);
  const rand = mulberry32(hashStringToSeed(`${(nickname||'').trim().toLowerCase()}|${dateStr}`));
  const pool = poolDefs.map(q=>q.key);
  // Fisher-Yates，用 seeded rand 取代 Math.random，確保同一天同一人結果固定
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(rand() * (i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return [...fixedKeys, ...pool.slice(0, need)];
}
// ---------- 簽到逐日紀錄 / 補簽 ----------
// 舊制只存 lastClaim + streak 累加數字，改成逐日紀錄（checkinDates）才能支援
// 「補簽任意過去某天」後把連續簽到鏈接起來。ensureCheckinDates 對舊資料做一次性回填：
// 用既有的 lastClaim + streak 反推出一條連續鏈，避免升級當下既有連續簽到被歸零。
function ensureCheckinDates(p){
  if(p.checkinDates) return;
  p.checkinDates = {};
  if(p.lastClaim){
    const streak = Math.max(1, p.streak||1);
    let cur = p.lastClaim;
    for(let i=0;i<streak;i++){
      p.checkinDates[cur] = true;
      cur = addDaysToDateStr(cur, -1);
    }
  }
}
// 算出「目前這條連續簽到鏈」：今天已簽就從今天往回數，今天還沒簽就從昨天往回數，
// 中間缺一天就斷了；補簽把某天補上後，這裡會自動把鏈重新接起來。
function computeCurrentStreak(p){
  ensureCheckinDates(p);
  const dates = p.checkinDates;
  const today = todayStr();
  const yest = yesterdayStr();
  let anchor;
  if(dates[today]) anchor = today;
  else if(dates[yest]) anchor = yest;
  else return 0;
  let count = 0;
  let cur = anchor;
  while(dates[cur]){
    count++;
    cur = addDaysToDateStr(cur, -1);
  }
  return count;
}
const MAKEUP_CHECKIN_COST = 80; // 骰子精華直接扣，量級比照原本設想的兌換券
const MAKEUP_CHECKIN_MAX_DAYS_BACK = 30; // 候選清單最多往前抓幾天，避免清單無限長
// 列出可以補簽的日期（今天以前、加入日期以後、尚未簽到過），由近到遠排序。
function getMakeupCandidateDates(p){
  ensureCheckinDates(p);
  const dates = p.checkinDates;
  const joinDate = p.joinedAt ? new Date(p.joinedAt) : null;
  if(joinDate) joinDate.setHours(0,0,0,0);
  const list = [];
  let cur = parseDateStr(yesterdayStr());
  for(let i=0;i<MAKEUP_CHECKIN_MAX_DAYS_BACK;i++){
    if(joinDate && cur < joinDate) break;
    const ds = dateStrFromDate(cur);
    if(!dates[ds]) list.push(ds);
    cur.setDate(cur.getDate() - 1);
  }
  return list;
}
async function doMakeupCheckin(dateStr){
  const p = state.player;
  if(!p) return;
  ensureMaterials(p);
  ensureCheckinDates(p);
  if(p.checkinDates[dateStr]){ showToast(tt('這天已經簽到過了','Already checked in that day')); return; }
  const today = todayStr();
  if(p.lastMakeupDate === today){
    showToast(tt('今天已經使用過補簽了，明天再來','You already used a makeup check-in today - come back tomorrow'));
    return;
  }
  if((p.materials.diceEssence||0) < MAKEUP_CHECKIN_COST){
    showToast(tt(`骰子精華不足，補簽需要 💠${MAKEUP_CHECKIN_COST}`, `Not enough Dice Essence, makeup check-in needs 💠${MAKEUP_CHECKIN_COST}`));
    return;
  }
  p.materials.diceEssence -= MAKEUP_CHECKIN_COST;
  p.checkinDates[dateStr] = true;
  p.lastMakeupDate = today;
  p.streak = computeCurrentStreak(p);
  await savePlayer(p);
  showToast(tt(`✅ 已補簽 ${dateStr}，花費 💠${MAKEUP_CHECKIN_COST} 骰子精華，目前連續簽到 ${p.streak} 天`, `✅ Made up check-in for ${dateStr} for 💠${MAKEUP_CHECKIN_COST} Dice Essence - current streak: ${p.streak} day(s)`));
  render();
}
function ensureDailyQuests(p){
  const today = todayStr();
  if(!p.daily || p.daily.date !== today){
    p.daily = {date: today, progress:{}, claimed:[], quests: pickDailyQuestKeys(p.nickname, today)};
  }
  if(!p.daily.progress) p.daily.progress = {};
  if(!p.daily.claimed) p.daily.claimed = [];
  if(!p.daily.quests || !p.daily.quests.length) p.daily.quests = pickDailyQuestKeys(p.nickname, today);
  return p.daily;
}
function todaysQuestDefs(p){
  const daily = ensureDailyQuests(p);
  return daily.quests.map(k=>QUEST_BY_KEY[k]).filter(Boolean);
}
function bumpQuest(p, key, amount){
  const daily = ensureDailyQuests(p);
  const def = QUEST_BY_KEY[key];
  if(!def) return;
  if(!daily.quests.includes(key)) return; // 今天沒抽到這項任務，不列入進度
  const cur = daily.progress[key] || 0;
  daily.progress[key] = Math.min(def.target, cur + (amount||1));
}
async function claimQuest(questKey){
  const p = state.player;
  const daily = ensureDailyQuests(p);
  const def = QUEST_BY_KEY[questKey];
  if(!def || !daily.quests.includes(questKey)) return;
  if(daily.claimed.includes(questKey)) return;
  const progress = daily.progress[questKey] || 0;
  if(progress < def.target) return;
  daily.claimed.push(questKey);
  const reward = QUEST_SETTINGS.rewards[questKey] || 0;
  p.coins = (p.coins||0) + reward;
  let bonusAwarded = false;
  if(daily.quests.every(k=>daily.claimed.includes(k)) && !daily.bonusClaimed){
    daily.bonusClaimed = true;
    p.coins += QUEST_SETTINGS.completionBonus;
    bonusAwarded = true;
  }
  await savePlayer(p);
  if(bonusAwarded){
    showToast(tt(`已領取「${def.nameZh}」✦${reward}，並完成今日全部任務，額外獲得 ✦${QUEST_SETTINGS.completionBonus} 🎉`, `Claimed "${def.nameEn}" for ✦${reward} - and completed all daily quests for a bonus ✦${QUEST_SETTINGS.completionBonus} 🎉`));
  } else {
    showToast(tt(`已領取「${def.nameZh}」✦${reward}`, `Claimed "${def.nameEn}" for ✦${reward}`));
  }
  render();
}

let TITLE_HOLDERS = {wealth:null, collection:null, resonance:null, streak:null, boss:null, harvest:null, auction:null, dice:null, updatedAt:0};
async function loadTitleHolders(){
  try{
    const r = await storage.get('config:title_holders');
    if(r){
      const s = JSON.parse(r.value);
      TITLE_HOLDERS = {
        wealth: s.wealth || null,
        collection: s.collection || null,
        resonance: s.resonance || null,
        streak: s.streak || null,
        boss: s.boss || null,
        harvest: s.harvest || null,
        auction: s.auction || null,
        dice: s.dice || null,
        updatedAt: s.updatedAt || 0,
      };
    }
  }catch(e){ /* keep defaults */ }
}
async function saveTitleHolders(){
  TITLE_HOLDERS.updatedAt = Date.now();
  await storage.set('config:title_holders', JSON.stringify(TITLE_HOLDERS));
}
// 依排行榜頁面已經算好的榜單重新判斷榜首，若有變動才寫回，避免每次開排行榜都打一次寫入
async function refreshTitleHoldersFromLeaderboards(byCoins, byCards, bySlotSpend, byStreak, byBossDamage, byHarvest, byAuctionVolume, byDiceScore){
  const nextWealth = (byCoins[0] && byCoins[0].coins > 0) ? byCoins[0].nickname : null;
  const nextCollection = (byCards[0] && byCards[0].total > 0) ? byCards[0].nickname : null;
  const nextResonance = (bySlotSpend[0] && bySlotSpend[0].spend > 0) ? bySlotSpend[0].nickname : null;
  const nextStreak = (byStreak && byStreak[0] && byStreak[0].streak > 0) ? byStreak[0].nickname : null;
  const nextBoss = (byBossDamage && byBossDamage[0] && byBossDamage[0].damage > 0) ? byBossDamage[0].nickname : null;
  const nextHarvest = (byHarvest && byHarvest[0] && byHarvest[0].harvests > 0) ? byHarvest[0].nickname : null;
  const nextAuction = (byAuctionVolume && byAuctionVolume[0] && byAuctionVolume[0].volume > 0) ? byAuctionVolume[0].nickname : null;
  const nextDice = (byDiceScore && byDiceScore[0] && byDiceScore[0].score > 0) ? byDiceScore[0].nickname : null;
  const changed = nextWealth !== TITLE_HOLDERS.wealth
    || nextCollection !== TITLE_HOLDERS.collection
    || nextResonance !== TITLE_HOLDERS.resonance
    || nextStreak !== TITLE_HOLDERS.streak
    || nextBoss !== TITLE_HOLDERS.boss
    || nextHarvest !== TITLE_HOLDERS.harvest
    || nextAuction !== TITLE_HOLDERS.auction
    || nextDice !== TITLE_HOLDERS.dice;
  if(changed){
    TITLE_HOLDERS.wealth = nextWealth;
    TITLE_HOLDERS.collection = nextCollection;
    TITLE_HOLDERS.resonance = nextResonance;
    TITLE_HOLDERS.streak = nextStreak;
    TITLE_HOLDERS.boss = nextBoss;
    TITLE_HOLDERS.harvest = nextHarvest;
    TITLE_HOLDERS.auction = nextAuction;
    TITLE_HOLDERS.dice = nextDice;
    await saveTitleHolders();
  }
}

const MAX_EQUIPPED_BADGES = 3;
function ensureUnlockedBadges(p){
  if(!p) return [];
  if(!Array.isArray(p.unlockedBadges)) p.unlockedBadges = [];

  if(!p) return [];
  return (p.equippedBadges||[]).filter(k=>ACHIEVEMENT_BY_KEY[k] && isBadgeUnlocked(p, k)).slice(0, MAX_EQUIPPED_BADGES);

async function toggleEquipBadge(key){
  const p = state.player;
  if(!p) return;
  const a = ACHIEVEMENT_BY_KEY[key];
  if(!a || !isBadgeUnlocked(p, key)){ showToast(tt('尚未解鎖此徽章 🔒','This badge is not unlocked yet 🔒')); return; }
  p.equippedBadges = p.equippedBadges || [];
  const idx = p.equippedBadges.indexOf(key);
  if(idx >= 0){
    p.equippedBadges.splice(idx, 1);
  } else {
    if(p.equippedBadges.length >= MAX_EQUIPPED_BADGES){
      showToast(tt(`最多只能裝備 ${MAX_EQUIPPED_BADGES} 個徽章，請先取消其他徽章`, `You can equip up to ${MAX_EQUIPPED_BADGES} badges - unequip one first`));
      return;
    }
    p.equippedBadges.push(key);
  }
  await savePlayer(p);
  renderTab();
}
async function checkAchievementUnlocks(p){
  if(!p) return;
  ensureUnlockedBadges(p);
  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(a=>{
    if(!p.unlockedBadges.includes(a.key) && a.check(p)){
      p.unlockedBadges.push(a.key);
      newlyUnlocked.push(a.key);
    }
  });
  if(newlyUnlocked.length === 0) return;
  await savePlayer(p);
  newlyUnlocked.forEach(k=>{
    const a = ACHIEVEMENT_BY_KEY[k];
    showToast(tt(`🏅 解鎖成就：${a.nameZh}！`, `🏅 Achievement unlocked: ${a.nameEn}!`), {legendary:true});
    showAchievementUnlockModal(a.key);
  });
}

const FARM_UPGRADE_REQS = {

  7: {cards:[{type:'arcana', count:4}], coins:1000},
  8: {cards:[{type:'arcana', count:10}], coins:10000, harvests:1000},
};
function reqCardPool(req){
  if(req.type==='rarity') return DECK.filter(c=>c.rarity===req.rarity);
  if(req.type==='suit') return DECK.filter(c=>c.arcana==='minor' && req.suits.includes(c.id.split('_')[0]));
  if(req.type==='arcana') return DECK.filter(c=>c.arcana==='major');
  return [];
}
function countCardsForReq(p, req){
  return reqCardPool(req).reduce((sum,c)=>sum+(p.cards[c.id]||0),0);
}
function consumeCardsForReq(p, req){
  let remaining = req.count;
  for(const c of reqCardPool(req)){
    if(remaining<=0) break;
    const have = p.cards[c.id]||0;
    const take = Math.min(have, remaining);
    p.cards[c.id] = have - take;
    remaining -= take;
  }
}
function defaultMaterialSelection(p, req){
  const sel = {};
  let remaining = req.count;
  for(const c of reqCardPool(req)){
    if(remaining<=0) break;
    const have = p.cards[c.id]||0;
    const take = Math.min(have, remaining);
    if(take>0) sel[c.id] = take;
    remaining -= take;
  }
  return sel;
}
function reqLabel(req){
  if(req.type==='rarity') return tt(`${RARITY_LABEL[req.rarity]}卡 ×${req.count}`, `${RARITY_LABEL[req.rarity]} cards ×${req.count}`);
  if(req.type==='suit'){
    const labels = req.suits.map(s=>SUITS.find(x=>x.key===s)?.label || s).join('/');
    return tt(`${labels}花色卡 ×${req.count}（任意混搭）`, `${labels} suit cards ×${req.count} (any mix)`);
  }
  if(req.type==='arcana') return tt(`大阿爾卡納 ×${req.count}`, `Major Arcana ×${req.count}`);
  return '';
}

function ensureSuitUpgrades(p){
  if(!p.suitUpgrades) p.suitUpgrades = {};
  SUIT_KEYS.forEach(k=>{ if(typeof p.suitUpgrades[k] !== 'number') p.suitUpgrades[k] = 0; });
  return p.suitUpgrades;
}
// 花色目前的升級階數：0=基礎, 1=新芽, 2=綻放, 3=星輝
function suitUpgradeTier(p, suitKey){
  return ensureSuitUpgrades(p)[suitKey] || 0;
}
// 依花色目前的升級階數，算出玩家買這個花色的種子時，實際會拿到哪個 SEED_TYPES key
function effectiveSeedKey(p, suitKey){
  let seed = SEED_TYPES[suitKey];
  let level = suitUpgradeTier(p, suitKey);
  while(level > 0 && seed && seed.upgradesTo){
    seed = SEED_TYPES[seed.upgradesTo];
    level--;
  }
  return seed ? seed.key : suitKey;
}
function nextSuitUpgradeTierName(level){
  return level === 0 ? 'sprout' : (level === 1 ? 'bloom' : (level === 2 ? 'starlight' : null));
}
async function confirmSuitUpgrade(suitKey){
  const p = state.player;
  if(!p) return;
  const level = suitUpgradeTier(p, suitKey);
  const tierName = nextSuitUpgradeTierName(level);
  if(!tierName){ showToast(tt('此花色已升級到最高階','This suit is already fully upgraded')); return; }
  const req = SUIT_UPGRADE_REQS[suitKey] && SUIT_UPGRADE_REQS[suitKey][tierName];
  if(!req) return;
  if((p.farmLevel||0) < req.tierLevel){
    showToast(tt(`花園等級需達 Lv.${req.tierLevel} 才能升級此花色`, `Requires garden Lv.${req.tierLevel} to upgrade this suit`));
    return;
  }
  for(const c of req.cards){
    const have = countCardsForReq(p, c);
    if(have < c.count){
      showToast(tt('材料不足，無法升級','Not enough materials to upgrade'));
      return;
    }
  }
  req.cards.forEach(c=>consumeCardsForReq(p, c));
  ensureSuitUpgrades(p)[suitKey] = level + 1;
  await savePlayer(p);
  const upgradedSeed = SEED_TYPES[effectiveSeedKey(p, suitKey)];
  showToast(tt(`✨ ${seedName(SEED_TYPES[suitKey])}已升級為${seedName(upgradedSeed)}！`, `✨ ${seedName(SEED_TYPES[suitKey])} upgraded to ${seedName(upgradedSeed)}!`));
  render();
}

    showToast(tt(`收成次數不足，需累計收成 ${nextReqCheck.harvests} 次才能升級`, `Not enough harvests - you need ${nextReqCheck.harvests} total harvests to upgrade`));

async function confirmFarmUpgrade(){
  const p = state.player;
  if(!p) return;
  const level = p.farmLevel||0;
  if(level >= FARM_MAX_LEVEL) return;
  const nextLevel = level+1;
  const req = FARM_UPGRADE_REQS[nextLevel];
  const selections = state.farmUpgradeSelections || req.cards.map(r=>defaultMaterialSelection(p, r));
  for(let ri=0; ri<req.cards.length; ri++){
    const r = req.cards[ri];
    const sel = selections[ri] || {};
    const poolIds = reqCardPool(r).map(c=>c.id);
    let total = 0;
    for(const cid of Object.keys(sel)){
      const qty = sel[cid]||0;
      if(qty<=0) continue;
      if(!poolIds.includes(cid) || qty > (p.cards[cid]||0)){
        showToast(tt('材料選擇有誤，請重新確認','Material selection is invalid - please recheck'));
        return;
      }
      total += qty;
    }
    if(total !== r.count){
      showToast(tt(`「${reqLabel(r)}」尚未選滿所需數量`, `You haven't selected the full amount for "${reqLabel(r)}"`));
      return;
    }
  }
  if(req.coins && (p.coins||0) < req.coins){
    showToast(tt('金幣不足，無法升級','Not enough coins to upgrade'));
    return;
  }
  if(req.harvests && ((p.stats && p.stats.totalHarvests) || 0) < req.harvests){
    showToast(tt(`收成次數不足，需累計收成 ${req.harvests} 次才能升級`, `Not enough harvests - you need ${req.harvests} total harvests to upgrade`));
    return;
  }
  req.cards.forEach((r, ri)=>{
    const sel = selections[ri] || {};
    Object.keys(sel).forEach(cid=>{
      const qty = sel[cid]||0;
      if(qty>0) p.cards[cid] = (p.cards[cid]||0) - qty;
    });
  });
  if(req.coins) p.coins -= req.coins;
  p.farmLevel = nextLevel;
  ensureFarm(p);
  state.farmUpgradeMode = false;
  state.farmUpgradeSelections = null;
  await savePlayer(p);
  showToast(tt(`🌱 花園升級到 Lv.${nextLevel}！`, `🌱 Garden upgraded to Lv.${nextLevel}!`));
  render();
}

const EXPEDITION_DURATION_META = {

function buildExpeditionDurations(tier){
  const durations = {};
  EXPEDITION_DURATION_KEYS.forEach(key=>{
    const meta = EXPEDITION_DURATION_META[key];
    const minutes = meta.ms / 60000;
    const rate = Math.max(0.5, Math.min(0.99, tier.baseSuccessRate + meta.rateAdj));
    const factor = meta.rewardFactor || 1;
    durations[key] = {
      durationMs: meta.ms,
      commonCount: tier.commonCount,
      uncommonCount: tier.uncommonCount,
      successRate: Math.round(rate * 100) / 100,
      rewardCoinsMin: Math.max(1, Math.round(tier.coinPerMinMin * minutes * factor)),
      rewardCoinsMax: Math.max(1, Math.round(tier.coinPerMinMax * minutes * factor)),
      rewardExp: Math.max(1, Math.round(tier.expPerMin * minutes * factor)),
      failExp: Math.max(0, Math.round(tier.failExpPerMin * minutes * factor)),
    };
  });
  return durations;
}

function ensureExpedition(p){
  if(typeof p.expLevel !== 'number' || p.expLevel < 0) p.expLevel = 0;
  if(typeof p.expExp !== 'number' || p.expExp < 0) p.expExp = 0;
  if(p.expedition === undefined) p.expedition = null;
  if(p.expedition && (!p.expedition.tierId || !p.expedition.durationKey || !p.expedition.readyAt)) p.expedition = null;
  if(!p.expeditionRolls || typeof p.expeditionRolls !== 'object') p.expeditionRolls = {};
  // 🔥 階段四：連勝計數，不隨派遣重置，只在結算（claimExpedition）時更新
  if(typeof p.expeditionStreak !== 'number' || p.expeditionStreak < 0) p.expeditionStreak = 0;
  // 🔥 成就專用：只計「亡命」風險等級＋8小時遠征的連續成功次數，跟上面獎勵加成用的 expeditionStreak 分開算，
  // 避免舊存檔（例如加上風險等級限制前）已經用一般遠征累積的連勝數，誤觸發這個成就
  if(typeof p.expeditionRecklessStreak !== 'number' || p.expeditionRecklessStreak < 0) p.expeditionRecklessStreak = 0;
  // 階段三：補齊舊存檔（升級前就已經在路上的遠征）缺少的事件節點欄位，維持行為等同「這趟沒有事件節點」
  if(p.expedition){
    if(!Array.isArray(p.expedition.events)) p.expedition.events = [];
    if(typeof p.expedition.eventSuccessDelta !== 'number') p.expedition.eventSuccessDelta = 0;
    if(typeof p.expedition.eventRewardPctDelta !== 'number') p.expedition.eventRewardPctDelta = 0;
    if(!Array.isArray(p.expedition.extraBlessings)) p.expedition.extraBlessings = [];
  }
  return p.expedition;
}

// 每個任務需要 commonCount 張不同的 common 卡 + uncommonCount 張不同的 uncommon 卡，
// 這些卡牌由系統隨機抽定、每種各需 1 張；玩家若沒有該卡，需要去拍賣行收購。
// 同一階的四種時長選項共用相同的卡牌需求數量。
// 3小時遠征額外需要 tier.rareCount 張 rare 卡；8小時遠征額外需要 tier.epicCount 張 epic（頂級稀有度）卡
// （rareCount / epicCount 由 GM 頁面「遠征玩法設定」調整，每一階分別設定）
function expeditionExtraCardsForDuration(durationKey, tier){
  if(durationKey === 'd3h') return {rare:(tier&&tier.rareCount)||0, epic:0};
  if(durationKey === 'd8h') return {rare:0, epic:(tier&&tier.epicCount)||0};

}
function expeditionQuestCardCount(variant, durationKey, tier){
  const extra = expeditionExtraCardsForDuration(durationKey, tier);
  return (variant.commonCount||0) + (variant.uncommonCount||0) + extra.rare + extra.epic;

function rollExpeditionRequiredCards(variant, durationKey, tier){
  const picks = [];
  const used = new Set();
  function pickFrom(rarity, count){
    const pool = DECK.filter(c=>c.rarity===rarity && !used.has(c.id));
    for(let i=0; i<count && pool.length>0; i++){
      const idx = Math.floor(Math.random()*pool.length);
      const card = pool.splice(idx,1)[0];
      used.add(card.id);
      picks.push(card.id);
    }
  }
  if(variant.commonCount > 0) pickFrom('common', variant.commonCount);
  if(variant.uncommonCount > 0) pickFrom('uncommon', variant.uncommonCount);
  const extra = expeditionExtraCardsForDuration(durationKey, tier);
  if(extra.rare > 0) pickFrom('rare', extra.rare);
  if(extra.epic > 0) pickFrom('epic', extra.epic);
  return picks;
}
// 取得（必要時重新產生）某個任務＋時長目前指定的出征卡牌清單。
// 回傳 {cards, changed}；changed=true 代表需要把 p 存檔。
function getExpeditionRequiredCards(p, tier, durationKey){
  ensureExpedition(p);
  const variant = tier.durations[durationKey];
  const key = expeditionRollKey(tier.id, durationKey);
  const wanted = expeditionQuestCardCount(variant, durationKey, tier);
  const existing = p.expeditionRolls[key];
  const valid = Array.isArray(existing) && existing.length === wanted && existing.every(id=>DECK_BY_ID[id]);
  if(valid) return {cards: existing, changed:false};
  const cards = rollExpeditionRequiredCards(variant, durationKey, tier);
  p.expeditionRolls[key] = cards;
  return {cards, changed:true};

const EXP_MAX_LEVEL = 12;

  while(p.expLevel < EXP_MAX_LEVEL && p.expExp >= EXP_TABLE[p.expLevel+1]){
