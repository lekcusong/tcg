    ? (SEASON_CARDS.every(sc=>p.seasonCards[sc.id]) ? 1 : 0)
    : (p.seasonCards[c.id] || 0);
  const name = isLegendaryCard ? seasonLegendaryCardName(c) : seasonCardName(c);
  const content = document.getElementById('card-modal-content');
  const showLegendaryFx = isLegendaryCard && owned > 0;

  let mediaHtml;
  if(owned > 0 && isLegendaryCard){
    mediaHtml = `<div class="card-modal-img${showLegendaryFx?' legendary-img':''}" style="padding:0;overflow:hidden;">${seasonLegendaryVideoMarkup(c, 'height:auto;')}</div>`;
  } else if(owned > 0){
    mediaHtml = `<img src="${c.image}" alt="${escapeHtml(name)}" class="card-modal-img" />`;
  } else {
    mediaHtml = `<div class="card-modal-icon locked-img">🔒</div>`;
  }

  let bodyHtml = `
    ${mediaHtml}
    ${showLegendaryFx ? `<div class="legendary-modal-badge">✨ ${tt('傳說卡','Legendary Card')} ✨</div>` : ''}
    <div class="card-modal-name">${owned>0 ? escapeHtml(name) : '???'}</div>
    <div class="card-modal-rarity">${isLegendaryCard ? tt('傳說・第13張','Legendary · 13th Card') : tt('賽季卡・黃道十二宮','Season Card · Zodiac')}</div>
  `;

  if(owned > 0 && !isLegendaryCard){
    bodyHtml += `<div class="card-modal-sell-box"><div style="font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;">${tt(`持有 x${owned}`, `Owned x${owned}`)}</div></div>`;
  } else if(owned === 0){
    bodyHtml += `<div class="card-modal-locked-note">${isLegendaryCard ? tt('集滿 12 張賽季卡即可解鎖','Collect all 12 season cards to unlock') : tt('尚未擁有此卡，前往賽季頁抽取賽季卡試試','Not yet owned - try drawing season cards on the Season tab')}</div>`;
  }

  content.innerHTML = bodyHtml;

  const idx = SEASON_MODAL_LIST.indexOf(cardId);
  const hasList = idx !== -1 && SEASON_MODAL_LIST.length > 1;
  let navHtml = '';
  if(hasList){
    navHtml = `
      <button class="card-modal-nav prev" id="card-modal-prev">‹</button>
      <button class="card-modal-nav next" id="card-modal-next">›</button>
    `;
  }
  document.getElementById('card-modal-nav-slot').innerHTML = navHtml;
  if(hasList){
    document.getElementById('card-modal-prev').onclick = ()=>{
      const prevIdx = (idx - 1 + SEASON_MODAL_LIST.length) % SEASON_MODAL_LIST.length;
      openSeasonCardModal(SEASON_MODAL_LIST[prevIdx]);
    };
    document.getElementById('card-modal-next').onclick = ()=>{
      const nextIdx = (idx + 1) % SEASON_MODAL_LIST.length;
      openSeasonCardModal(SEASON_MODAL_LIST[nextIdx]);
    };
  }

  document.getElementById('card-modal').style.display = 'flex';
  const modalBox = document.querySelector('.card-modal-box');
  if(modalBox) modalBox.classList.toggle('legendary-modal', showLegendaryFx);
  if(showLegendaryFx) playLegendaryRevealFx();
}

function sellableExtraCommonUncommon(){
  const targets = ['common','uncommon'];
  const items = [];
  let totalQty = 0, totalCoins = 0;
  DECK.filter(c=>targets.includes(c.rarity)).forEach(c=>{
    const owned = (state.player.cards[c.id]) || 0;
    if(owned > 1){
      const qty = owned - 1;
      const price = SELL_PRICES[c.rarity] || 0;
      items.push({cardId:c.id, qty, price});
      totalQty += qty;
      totalCoins += qty * price;
    }
  });
  return {items, totalQty, totalCoins};
}

async function sellExtraCommonUncommon(){
  if(!state.player) return;
  const {items, totalQty, totalCoins} = sellableExtraCommonUncommon();
  if(items.length === 0){
    showToast(tt('目前沒有多餘的普通或罕見卡牌可以出售','No extra common or uncommon cards to sell right now'));
    return;
  }
  const ok = window.confirm(tt(
    `確定要一鍵出售所有多出來的普通與罕見卡牌嗎？\n每張卡都會保留 1 張，其餘 ${totalQty} 張將被出售，共獲得 ✦${totalCoins} 枚金幣，此動作無法復原。`,
    `Sell all extra common and uncommon cards? Each card keeps 1 copy - the remaining ${totalQty} cards will be sold for ✦${totalCoins} coins total. This cannot be undone.`
  ));
  if(!ok) return;
  items.forEach(it=>{
    state.player.cards[it.cardId] = (state.player.cards[it.cardId] || 0) - it.qty;
  });
  state.player.coins = (state.player.coins||0) + totalCoins;
  bumpQuest(state.player, 'sell', 1);
  await savePlayer(state.player);
  showToast(tt(`已出售 ${totalQty} 張多餘卡牌，獲得 ✦${totalCoins} 枚金幣`, `Sold ${totalQty} extra cards for ✦${totalCoins} coins`));
  render();
}

async function sellCard(cardId, qty){
  if(!state.player) return;
  const c = DECK_BY_ID[cardId];
  if(!c) return;
  qty = Math.max(1, parseInt(qty, 10) || 1);
  const owned = state.player.cards[cardId] || 0;
  if(owned <= 0){ showToast(tt('你沒有這張卡可以出售',"You don't have this card to sell")); return; }
  qty = Math.min(qty, owned);
  const price = SELL_PRICES[c.rarity] || 0;
  const total = qty * price;
  const warnPrefix = (c.rarity === 'rare' || c.rarity === 'epic') ? tt('⚠️ 這是稀有卡牌！\n','⚠️ This is a rare card!\n') : '';
  const ok = window.confirm(tt(`${warnPrefix}確定要出售「${c.name}」x${qty} 嗎？\n將獲得 ✦${total} 枚金幣，此動作無法復原。`, `${warnPrefix}Sell "${c.name}" x${qty}?\nYou'll receive ✦${total} coins. This cannot be undone.`));
  if(!ok) return;
  state.player.cards[cardId] = owned - qty;
  state.player.coins = (state.player.coins||0) + total;
  bumpQuest(state.player, 'sell', 1);
  await savePlayer(state.player);
  closeCardModal();
  showToast(tt(`已出售 ${c.name} x${qty}，獲得 ✦${total} 枚金幣`, `Sold ${c.name} x${qty} for ✦${total} coins`));
  render();
}

// ---------- Boot 診斷：追蹤分頁是否被瀏覽器（尤其 iOS Safari）中途重新載入 ----------
// 玩家回報「遊戲開著、操作到一半突然跳回登入畫面」，但程式邏輯裡沒有任何主動登出
// 的路徑（唯一會清空 state.player 的地方是登出按鈕）。唯一合理的解釋是分頁本身被
// 系統終止重載，boot() 重跑一次，因為密碼不落地儲存，所以看起來像「被登出」。
// 這裡記一筆輕量 log（navigation type + 裝置資訊），方便之後從資料庫比對頻率/機型，
// 不會擋住開機流程，寫入失敗也完全略過。
const BOOT_LOG_KEY = 'diag:boot_log';
const BOOT_LOG_MAX = 300;
async function logBootDiagnostic(){
  if(!rememberedNick) return; // 只在「這台裝置先前登入過」時才記，降低雜訊、避免每個訪客都寫一筆
  try{
    const navEntries = performance.getEntriesByType('navigation');
    const navType = navEntries && navEntries[0] ? navEntries[0].type : null; // 'navigate' | 'reload' | 'back_forward' | 'prerender'
    const entry = {
      ts: Date.now(),
      nickname: rememberedNick,
      navType,
      hadSessionToken: (()=>{ try{ return !!localStorage.getItem('my-session'); }catch(e){ return null; } })(),
      ua: (navigator.userAgent || '').slice(0, 140),
    };
    const r = await storage.get(BOOT_LOG_KEY);
    const arr = r ? JSON.parse(r.value) : [];
    arr.push(entry);
    if(arr.length > BOOT_LOG_MAX) arr.splice(0, arr.length - BOOT_LOG_MAX);
    await storage.set(BOOT_LOG_KEY, JSON.stringify(arr));
  }catch(e){ /* 診斷用途，失敗完全不影響遊戲啟動 */ }
}

// ---------- 靜默續登：分頁重新載入時，用登入當下簽發的 session token 換回登入狀態 ----------
// 只有 token 對得上、且沒過期才會生效；對不上或過期就默默放棄，回退到正常登入畫面，
// 不會顯示任何錯誤訊息打斷玩家（因為這本來就只是「盡量」而不是必要流程）。
async function tryAutoLoginFromSessionToken(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem('my-session') || 'null'); }catch(e){ saved = null; }
  if(!saved || !saved.nickname || !saved.token) return;
  try{
    // 用 CAS（updatePlayerCAS）而不是「讀一份、改一改、整包存回去」：如果跟 savePlayer
    // 一樣直接整包覆蓋，只要玩家這段期間在另一台裝置/分頁有寫入（好友幫忙澆水、拍賣成交、
    // 遠征結算…），這次續登寫回去的舊資料就會把那筆新進度蓋掉——跟心跳曾經修過的「存檔跳回
    // 過去」是同一類問題，而且因為每次分頁重載都會觸發，發生機率比心跳高得多，這裡必須用 CAS。
    let newToken = null;
    const applied = await updatePlayerCAS(saved.nickname, (player)=>{
      if(!player.sessionToken || player.sessionToken !== saved.token) throw new Error('session token mismatch'); // 對不上（例如已在別處登出/換裝置）
      if(!player.sessionTokenExpiresAt || Date.now() > player.sessionTokenExpiresAt) throw new Error('session token expired');
      newToken = genSessionToken();
      player.sessionToken = newToken;
      player.sessionTokenExpiresAt = Date.now() + SESSION_TOKEN_TTL_MS;
    });
    if(!applied || !newToken) return;
    const p = await applyPendingRewards(applied);
    state.nickname = p.nickname;
    state.player = p;
    try{ localStorage.setItem('my-session', JSON.stringify({nickname: p.nickname, token: newToken})); }catch(e){}
    // 跟正常登入（doLogin）拿一致的初始徽章資料，避免靜默續登後通知/聊天未讀要等第一次輪詢（12~15秒）才出現
    fetchNotifications().then(notifs=>{
      const unread = notifs.filter(n=>!n.read);
      notifUnreadCount = unread.length;
      unread.forEach(n=>notifBadgeSeenIds.add(n.id));
      const badge = document.getElementById('notif-badge');
      if(badge){ badge.style.display = notifUnreadCount>0 ? 'inline-flex' : 'none'; badge.textContent = notifUnreadCount>9?'9+':String(notifUnreadCount); }
    }).catch(()=>{});
    fetchChatMessages().then(messages=>{
      const lastSeen = p.lastSeenChatAt || 0;
      chatUnreadCount = messages.filter(m=>m.nickname !== state.nickname && m.createdAt > lastSeen).length;
      updateChatBadgeDom();
    }).catch(()=>{});
  }catch(e){ /* 靜默失敗即可，回退正常登入畫面 */ }
}

async function doLogin(nick, password, confirmPassword){
  nick = nick.trim();
  if(!nick){ showToast(tt('請輸入暱稱 ✦','Please enter a nickname ✦')); return; }
  if(nick.length > 20){ showToast(tt('暱稱請在20字以內','Nickname must be 20 characters or fewer')); return; }
  if(!password || password.length < 4){ showToast(tt('密碼至少需要4個字元','Password must be at least 4 characters')); return; }

  const btn = document.getElementById('login-btn');
  if(btn){ btn.disabled = true; btn.textContent = t('loggingIn'); }

  try{
    const hash = await hashPassword(password);
    let p = await loadPlayer(nick);

    if(!p){
      if(!confirmPassword || confirmPassword !== password){
        showToast(tt('這是新帳號，請再次輸入相同密碼以確認 🔒','This is a new account - please confirm your password 🔒'));
        if(btn){ btn.disabled = false; btn.textContent = t('loginBtn'); }
        return;
      }
      p = newPlayer(nick, hash);
      await savePlayer(p);
      addToPlayerIndex(p.nickname).catch(()=>{});
      showToast(tt(`歡迎加入，${nick}！已為你建立帳號 ✦`, `Welcome, ${nick}! Your account has been created ✦`));
    } else if(!p.passwordHash){
      p.passwordHash = hash;
      await savePlayer(p);
      showToast(tt('已為此帳號設定密碼','Password set for this account'));
    } else if(p.passwordHash !== hash){
      showToast(tt('密碼錯誤，請重新輸入 🔒','Incorrect password, please try again 🔒'));
      if(btn){ btn.disabled = false; btn.textContent = t('loginBtn'); }
      return;
    }

    // 簽發本次登入的 session token，讓分頁之後如果被系統重新載入（常見於 iOS Safari
    // 記憶體壓力大時），boot() 能靜默用 token 續登，不用逼玩家重新輸入密碼。
    // 密碼本身依然不存；這個 token 效期到、或玩家主動登出時就會失效。
    // 用 updatePlayerCAS 而不是直接 savePlayer 整包覆蓋：避免這次登入的寫入，
    // 蓋掉玩家在別的裝置/分頁這段期間剛好寫入的更新進度（跟心跳那個「存檔跳回過去」是同一類問題）。
    let sessionToken = null;
    try{
      const applied = await updatePlayerCAS(p.nickname, (player)=>{
        sessionToken = genSessionToken();
        player.sessionToken = sessionToken;
        player.sessionTokenExpiresAt = Date.now() + SESSION_TOKEN_TTL_MS;
      });
      if(applied) p = applied; // 用 CAS 寫入成功後的最新物件繼續往下走
    }catch(e){ /* token 簽發失敗不影響這次登入，頂多下次重載要重新輸入密碼 */ }

    state.nickname = p.nickname;
    state.player = p;
    await applyPendingRewards(state.player);
    try{
      localStorage.setItem('my-nickname', p.nickname);
      if(sessionToken) localStorage.setItem('my-session', JSON.stringify({nickname: p.nickname, token: sessionToken}));
    }catch(e){}
    updatePresenceHeartbeat();
    render();
    fetchNotifications().then(notifs=>{
      const unread = notifs.filter(n=>!n.read);
      notifUnreadCount = unread.length;
      unread.forEach(n=>notifBadgeSeenIds.add(n.id));
      const badge = document.getElementById('notif-badge');
      if(badge){ badge.style.display = notifUnreadCount>0 ? 'inline-flex' : 'none'; badge.textContent = notifUnreadCount>9?'9+':String(notifUnreadCount); }
    }).catch(()=>{});
    showDailyPopupIfNeeded().then(()=>{
      fetchAnnouncement().then(ann=>{
        if(ann && ann.body && ann.updatedAt && (!p.lastSeenAnnouncementAt || ann.updatedAt > p.lastSeenAnnouncementAt)){
          showAnnounceModal(ann);
        }
      }).catch(()=>{});
    });
    fetchChatMessages().then(messages=>{
      const lastSeen = p.lastSeenChatAt || 0;
      chatUnreadCount = messages.filter(m=>m.nickname !== state.nickname && m.createdAt > lastSeen).length;
      updateChatBadgeDom();
    }).catch(()=>{});
  }catch(err){
    showToast(tt('登入失敗，請檢查網路後再試一次 ⚠','Login failed, please check your connection and try again ⚠'));
    if(btn){ btn.disabled = false; btn.textContent = t('loginBtn'); }
    console.error('Login error:', err);
  }
}

function doLogout(){
  // 【2026-08 修正】登出時把這個分頁自己起的所有背景計時器都停掉（尤其是無 visibility
  // 防護、會整包覆蓋存檔的心跳），避免這個分頁之後在背景被喚醒時，還拿著登出前的舊
  // state.player 寫回資料庫、覆蓋掉玩家在其他裝置上後來的進度。
  if(presenceHeartbeatInterval){ clearInterval(presenceHeartbeatInterval); presenceHeartbeatInterval = null; }
  if(farmTickInterval){ clearInterval(farmTickInterval); farmTickInterval = null; }
  if(expeditionTickInterval){ clearInterval(expeditionTickInterval); expeditionTickInterval = null; }
  if(professionTickInterval){ clearInterval(professionTickInterval); professionTickInterval = null; }
  // 撤銷這次登入簽發的 session token（伺服器端 + 本機都清），避免舊分頁/舊裝置
  // 殘留的 token 在玩家主動登出後還能被拿來靜默續登。best effort：撤銷失敗也不擋登出。
  if(state.player){
    const p = state.player;
    p.sessionToken = null;
    p.sessionTokenExpiresAt = null;
    savePlayer(p).catch(()=>{});
  }
  state.nickname = null; state.player = null; state.tab='home';
  chatUnreadCount = 0;
  notifUnreadCount = 0;
  try{ localStorage.removeItem('my-nickname'); localStorage.removeItem('my-session'); }catch(e){}
  render();
}

// ---------- Daily draw ----------
function canClaimToday(){
  return state.player.lastClaim !== todayStr();
}
async function claimDaily(){
  if(!canClaimToday()) return;
  const drawn = [weightedDraw(), weightedDraw(), weightedDraw()];
  state.drawResults = drawn;
  state.drawSource = 'daily';
  state.flipped = [false,false,false];

  ensureCheckinDates(state.player);
  state.player.checkinDates[todayStr()] = true;
  const newStreak = computeCurrentStreak(state.player);
  state.player.streak = newStreak;

  const bonus = STREAK_BONUS[newStreak] || 0;
  state.player.coins += DAILY_COINS + bonus;
  drawn.forEach(c=>{

async function pullSlot(isMega){

  let slotContrib = 0;
  let fsContrib = 0;

  // 結算前重新同步兩個獎池最新值，避免用這個分頁自己過期的快照

  try{
    await syncSlotJackpot();
    await syncFortuneStarJackpot();
  }catch(e){
    showToast(tt('連線異常，請稍後再試','Connection issue, please try again later'));

    return;

  if(allSame && rarities[0] === 'epic'){

    winTier = 'jackpot';
    winMsg = isMega
      ? tt(`✨💫🔥 超級命運共鳴！贏得獎池 ${SLOT_SETTINGS.megaJackpotMult} 倍 ✦${winAmount}！`, `✨💫🔥 Mega Fated Resonance! Won ${SLOT_SETTINGS.megaJackpotMult}x the jackpot pool - ✦${winAmount}!`)
      : tt(`✨💫 命運共鳴！贏得整個獎池 ✦${winAmount}！`, `✨💫 Fated Resonance! Won the entire jackpot pool ✦${winAmount}!`);
    jackpotAfterWin = SLOT_SETTINGS.jackpotBase;
  } else if(allSame && rarities[0] === 'rare'){
    winAmount = cost * SLOT_SETTINGS.multRare;
    coins += winAmount;
    winTier = 'rare';
    winMsg = tt(`✨ 三張稀有共鳴！獲得 ✦${winAmount} 金幣`, `✨ Three Rare Resonance! Won ✦${winAmount} coins`);
  } else if(allSame && rarities[0] === 'uncommon'){
    winAmount = cost * SLOT_SETTINGS.multUncommon;
    coins += winAmount;
    winTier = 'uncommon';
    winMsg = tt(`✨ 三張罕見共鳴！獲得 ✦${winAmount} 金幣`, `✨ Three Uncommon Resonance! Won ✦${winAmount} coins`);
  } else if(allSame && rarities[0] === 'common'){
    winAmount = cost * SLOT_SETTINGS.multCommon;
    coins += winAmount;
    winTier = 'common';

  } else {
    // 沒中獎：兩個獨立獎池「各抽一份」，比例各自獨立設定（共鳴一次／超級共鳴都用同一組比例）

    // 中間可能發生的頭獎重置或其他玩家的貢獻。
    isJackpotContrib = true;
    slotContrib = Math.round(cost * SLOT_SETTINGS.contribRate / 100);
    fsContrib = Math.round(cost * FORTUNE_STAR_SETTINGS.contribRate / 100);
  }

  // 把這次結果套用到本地玩家物件，準備存檔；下面若存檔失敗會整組復原。
  state.player.coins = coins;
  state.player.slotSpend = prevSlotSpend + cost;
  state.player.cards = cards;
  bumpQuest(state.player, 'slot', 1);
  if(winTier === 'jackpot'){
    state.player.stats = state.player.stats || {};
    state.player.stats.totalJackpotWins = (state.player.stats.totalJackpotWins || 0) + 1;
    if(isMega){
      state.player.stats.totalMegaJackpotWins = (state.player.stats.totalMegaJackpotWins || 0) + 1;
    }
  }
  state.drawResults = drawn;
  state.drawSource = 'slot';
  state.flipped = [false,false,false];

  try{

    // 這樣即使中途斷線，最壞情況只是這次共鳴沒生效、可以重試，
    // 不會出現獎池已經清空、全服都收到中獎公告，但贏家自己卻沒拿到錢的情況。
    await savePlayer(state.player);

      // 這裡額外幫贏家自己寫一筆永久信箱通知，做法比照 boss_reward／fortunestar_win。
      await createNotification(state.nickname, 'system', 'jackpot_self_win', {amount: winAmount, mega: isMega, mult: SLOT_SETTINGS.megaJackpotMult}).catch(()=>{});

      await syncSlotJackpot();
      await saveSlotJackpot(SLOT_JACKPOT + slotContrib);
      await syncFortuneStarJackpot();
      await saveFortuneStarJackpot(FORTUNE_STAR_JACKPOT + fsContrib);
    }
  }catch(e){
    // 存檔失敗：整組復原本地狀態，不套用任何本次抽卡效果，提示玩家重試
    state.player.coins = prevCoins;
    state.player.slotSpend = prevSlotSpend;
    state.player.cards = prevCards;
    if(prevStats) state.player.stats = prevStats; else delete state.player.stats;
    state.drawResults = null;
    state.drawSource = null;
    showToast(tt('存檔失敗，本次共鳴未生效，請檢查網路後重試','Save failed, this pull did not take effect, please check your connection and retry'));
    render();
    unlockSlotButtons();
    return;
  }

  render();
  // 按鈕在整段翻牌動畫（含史詩特效）跑完之前持續保持鎖定，
  // 直到 flipCard 翻完第三張牌並呼叫 unlockSlotButtons() 才解鎖，
  // 這樣玩家沒辦法在動畫還在跑的時候就搶點下一次。
  setTimeout(()=>{ flipCard(0, unlockSlotButtons); }, 300);

  if(winMsg){
    setTimeout(()=>showToast(winMsg), 1700);
    const winPayload = { nickname: state.nickname, tier: winTier, amount: winAmount, ts: Date.now() };
    storage.set('config:latest_win', JSON.stringify(winPayload)).catch(()=>{});
    if(winTier === 'jackpot') LATEST_WIN = winPayload; // 面板上「上一輪中獎者」只認頭獎

      <p class="sub" style="margin:0 0 10px;">${tt(`本輪獎池：<b style="color:var(--gold-bright);">✦ ${round.pool}</b> · ${timeReached ? '幸運卡已可公布' : `幸運卡將於 ${revealLabel} GMT+8 公布`}`, `This round's pool: <b style="color:var(--gold-bright);">✦ ${round.pool}</b> · ${timeReached ? 'The lucky card can now be revealed' : `Revealed at ${revealLabel} GMT+8`}`)}</p>

      <p class="sub" style="margin:0 0 6px;">${round.winners && round.winners.length > 0
        ? tt(`🎉 本輪 ${round.winners.length} 位中獎者，每人獲得 ✦${round.winners[0].amount}`, `🎉 ${round.winners.length} winner(s) this round, each receiving ✦${round.winners[0].amount}`)

      ${winnerNames ? `<p class="sub" style="margin:0 0 6px;color:var(--gold-bright);">${tt(`👑 ${winnerNames}`, `👑 ${winnerNames}`)}</p>` : ''}
      ${won ? `<p class="sub" style="margin:0 0 6px;color:var(--gold-bright);">${tt(`✨ 恭喜你中獎了！✦${won.amount} 已送入信箱`, `✨ Congratulations, you won! ✦${won.amount} has been sent to your mailbox`)}</p>` : ''}

  }
  return `<div class="panel">

// ---------- Friends ----------
function freqKey(id){ return `freq:${id}`; }
// 依玩家分流：key 前綴帶上收件人暱稱，讓 fetchNotifications 只需查詢
// 自己的通知，不用再撈全站 notif: 資料回瀏覽器端過濾（那個做法會讓
// 每個在線玩家每次輪詢都重複下載全站所有人的通知，流量隨玩家數/
// 通知數倍增）。
function notifKey(nick, id){ return `notif:${(nick||'').toLowerCase()}:${id}`; }
// 通知的輕量 meta key（注意：故意放在 notif: 前綴「之外」的獨立 namespace，
// 避免被 fetchNotifications 的 storage.list('notif:<nick>:') 前綴掃描也一併撈到）。
// 只記錄「最新一筆通知的 id + 時間戳」，輪詢時先讀這個小 key，沒變就代表沒有
// 新通知，不必再對每一筆通知各發一次 storage.get（N+1）。
function notifMetaKey(nick){ return `notifmeta:${(nick||'').toLowerCase()}`; }
async function touchNotifMeta(nick, lastId){
  try{ await storage.set(notifMetaKey(nick), JSON.stringify({lastId, updatedAt: Date.now()})); }
  catch(e){ /* best effort，meta 寫入失敗頂多讓輪詢多做一次整包重抓，不影響正確性 */ }
}
async function fetchNotifMeta(nick){
  try{
    const r = await storage.get(notifMetaKey(nick));
    if(!r) return null;
    return JSON.parse(r.value);
  }catch(e){ return null; }
}
function notifMetaSignature(meta){
  return meta ? `${meta.lastId}:${meta.updatedAt}` : '';
}
// 依玩家分流：key 前綴帶上暱稱，讓 fetchPendingRewardsFor 只需查詢
// 該玩家自己的資料，不會被全站 pendingreward: 資料量拖累、撞到
// PostgREST 預設回傳筆數上限而撈不到（曾導致「有通知但收不到卡」）。
function pendingRewardKey(nick, id){ return `pendingreward:${(nick||'').toLowerCase()}:${id}`; }

// ---------- Notifications (e.g. a friend watered/stole from your plot) ----------
async function fetchNotifications(){
  try{
    // 只查詢自己的前綴（notif:<nick>:），不再撈全站 notif: 資料
    // 回瀏覽器端過濾——避免每個玩家每次輪詢都重複下載全站所有人
    // 的通知內容。
    const myNick = (state.nickname||'').toLowerCase();
    const rows = await storage.listValues(`notif:${myNick}:`);
    const items = parseKvRows(rows);
    return items.sort((a,b)=>b.createdAt-a.createdAt);
  }catch(e){ return []; }
}
const NOTIF_MAX_STORED = 200; // 每位玩家保留的通知上限，避免單一玩家的 notif: 前綴無限長大
async function createNotification(to, from, type, extra){
  if((to||'').toLowerCase() === (from||'').toLowerCase()) return; // don't notify yourself
  const n = {id: uid(), to, from, type, read:false, createdAt: Date.now(), ...extra};
  try{ await storage.set(notifKey(to, n.id), JSON.stringify(n)); }catch(e){ /* best effort */ }
  touchNotifMeta(to, n.id).catch(()=>{});
  pruneNotifications(to).catch(()=>{});
}
async function pruneNotifications(nick){
  // notif: 從不刪除的話，單一玩家的通知會無限長大。這裡只保留
  // 該玩家最新的 NOTIF_MAX_STORED 筆（storage.list 已依 key 由新到舊排序）。
  const myNick = (nick||'').toLowerCase();
  const list = await storage.list(`notif:${myNick}:`);
  if(!list || !list.keys || list.keys.length <= NOTIF_MAX_STORED) return;
  const excessKeys = list.keys.slice(NOTIF_MAX_STORED);
  await Promise.all(excessKeys.map(k=>storage.delete(k).catch(()=>{})));
}
// ---------- Pending rewards (GM grants land here first, then get applied to the
// player's own freshest data next time they refresh/open mailbox — avoids the
// grant being silently overwritten if the player's client saves stale data
// in the meantime) ----------
async function createPendingReward(targetNick, grantKind, payload){
  // id 只在這裡產生一次，下面重試迴圈永遠對同一個 key 寫入同一份內容，
  // 所以重試不會導致玩家收到兩次獎勵（覆蓋式寫入，非疊加）。
  const r = {id: uid(), to: targetNick, grantKind, createdAt: Date.now(), ...payload};
  const key = pendingRewardKey(targetNick, r.id);
  const body = JSON.stringify(r);
  const RETRY_DELAYS_MS = [300, 600]; // 失敗後重試 2 次，間隔遞增
  let lastErr = null;
  for(let attempt = 0; attempt <= RETRY_DELAYS_MS.length; attempt++){
    try{
      await storage.set(key, body);
      return true;
    }catch(e){
      lastErr = e;
      if(attempt < RETRY_DELAYS_MS.length){
        await new Promise(res=>setTimeout(res, RETRY_DELAYS_MS[attempt]));
      }
    }
  }
  // 全部重試都失敗：記錄下來方便事後排查/補償，並在 console 留下詳細資訊。
  console.error('createPendingReward failed after retries', {targetNick, grantKind, payload, error: lastErr});
  try{
    const failKey = `failedreward:${(targetNick||'').toLowerCase()}:${r.id}`;
    await storage.set(failKey, JSON.stringify({...r, failedAt: Date.now(), errorMessage: lastErr ? String(lastErr.message||lastErr) : 'unknown'}));
  }catch(e){ /* 連失敗記錄都寫不進去，只能靠 console.error 了 */ }
  return false;
}
async function fetchPendingRewardsFor(nick){
  try{
    // 只查詢這個玩家自己的前綴（pendingreward:<nick>:），
    // 不再撈全站 pendingreward: 資料再靠前端過濾，避免被全站資料量
    // 拖累而撞到 PostgREST 預設回傳筆數上限撈不到自己的獎勵。
    const myLower = (nick||'').toLowerCase();
    const rows = await storage.listValues(`pendingreward:${myLower}:`);
    return parseKvRows(rows, (data, k)=>({key:k, data}));
  }catch(e){ return []; }
}
// Applies any pending rewards for this player directly onto the freshly-loaded
// player object (mutates in place), deletes the consumed records, and saves.
// Safe to call every time a player's data is freshly loaded.
async function applyPendingRewards(player){
  const pending = await fetchPendingRewardsFor(player.nickname);
  if(pending.length === 0) return player;
  let changed = false;
  for(const {key, data} of pending){
    if(data.grantKind === 'coins'){
      player.coins = Math.max(0, (player.coins||0) + (data.amount||0));
      changed = true;
    } else if(data.grantKind === 'card'){
      player.cards[data.cardId] = Math.max(0, (player.cards[data.cardId]||0) + (data.qty||1));
      changed = true;
    } else if(data.grantKind === 'material'){
      ensureProfession(player);
      player.professionMaterials[data.materialId] = Math.max(0, (player.professionMaterials[data.materialId]||0) + (data.qty||1));
      changed = true;
    } else if(data.grantKind === 'item'){
      ensureProfession(player);
      player.professionItems[data.itemId] = Math.max(0, (player.professionItems[data.itemId]||0) + (data.qty||1));
      changed = true;
    } else if(data.grantKind === 'dice'){
      ensureDiceInventory(player);
      if(data.diceData && data.diceData.id){
        player.dice[data.diceData.id] = {...data.diceData};
        changed = true;
      }
    } else if(data.grantKind === 'auction_sale'){
      // 拍賣賣家收款：金額 + 成交次數 + 交易量一起套用，避免分兩筆寫入時中間被覆蓋。
      // 交易量記的是「成交價格」（未扣手續費前），跟買家那邊記的口徑一致，方便排行榜比較。
      player.coins = Math.max(0, (player.coins||0) + (data.amount||0));
      ensureStats(player).totalAuctionTrades += 1;
      if(typeof data.price === 'number') ensureStats(player).totalAuctionVolume += data.price;
      changed = true;
    } else if(data.grantKind === 'auction_trade_stat'){
      ensureStats(player).totalAuctionTrades += 1;
      if(typeof data.price === 'number') ensureStats(player).totalAuctionVolume += data.price;
      changed = true;
    } else if(data.grantKind === 'ghost_talisman'){
      if(!player.materials) player.materials = {};
      player.materials.ghostDiceTalisman = Math.max(0, (player.materials.ghostDiceTalisman||0) + (data.qty||1));
      changed = true;
    } else if(data.grantKind === 'stat_bump'){
      // 通用統計數字累加（例如每日星運之星中獎次數），供成就徽章的 check() 判斷用
      const stats = ensureStats(player);
      stats[data.statKey] = (stats[data.statKey] || 0) + (data.amount || 1);
      changed = true;
    }
    await storage.delete(key).catch(()=>{});
  }
  if(changed) await savePlayer(player);
  return player;
}
async function markNotificationRead(toNick, notifId){
  try{
    const key = notifKey(toNick, notifId);
    const r = await storage.get(key);
    if(!r) return;
    const n = JSON.parse(r.value);
    n.read = true;
    await storage.set(key, JSON.stringify(n));
  }catch(e){ /* ignore */ }
}
async function markAllNotificationsRead(notifs){
  await Promise.all(notifs.filter(n=>!n.read).map(n=>markNotificationRead(n.to, n.id)));
}

function initNotifPoll(){
  let lastNotifMetaSig; // 初始為 undefined，確保第一次一定會真的抓一次
  const poll = async ()=>{
    if(document.visibilityState !== 'visible') return; // 背景分頁不輪詢
    if(!state.nickname) return;
    try{
      const meta = await fetchNotifMeta(state.nickname);
      const sig = notifMetaSignature(meta);
      if(sig === lastNotifMetaSig) return; // meta 沒變，代表沒有新通知，不需要整包重抓
      lastNotifMetaSig = sig;
      const notifs = await fetchNotifications();
      const unread = notifs.filter(n=>!n.read);
      const newOnes = unread.filter(n=>!notifBadgeSeenIds.has(n.id));
      newOnes.forEach(n=>{ notifBadgeSeenIds.add(n.id); showToast(`🔔 ${notifText(n)}`); });
      notifUnreadCount = unread.length;
      const badge = document.getElementById('notif-badge');
      if(badge){ badge.style.display = notifUnreadCount>0 ? 'inline-flex' : 'none'; badge.textContent = notifUnreadCount>9?'9+':String(notifUnreadCount); }
    }catch(e){ /* ignore */ }
  };
  setInterval(poll, 12000);
  registerVisiblePoll(poll);
}

// ---------- Chat channel ----------
// 聊天訊息改成單一 key（CHAT_LOG_KEY）存整個陣列，
// 取代舊版「每則訊息各自存一個 chat:<id> key」的做法：
// 舊做法每次抓訊息都要 storage.list 再對每個 key 各發一次 storage.get（N+1），
// 輪詢、送訊息、算未讀都各自重抓一次，訊息一多就非常吃頻寬。
// 改成單一 key 後，讀/寫都只需要一次網路請求。
const CHAT_LOG_KEY = 'chat:log';
const CHAT_META_KEY = 'chat:meta'; // 輕量 key：只存 {count,lastId,updatedAt}，輪詢先讀這個，變了才抓整包聊天記錄
const CHAT_MAX_MESSAGES = 300;
const CHAT_TRIM_BATCH = 100; // 累積超過上限+100則才一次清洗回上限，減少清洗頻率
let lastChatFingerprint = null;
async function fetchChatMessages(){
  try{
    const r = await storage.get(CHAT_LOG_KEY);
    if(!r) return [];
    const arr = JSON.parse(r.value);
    return Array.isArray(arr) ? arr.sort((a,b)=>a.createdAt-b.createdAt) : [];
  }catch(e){ return []; }
}
async function fetchChatMeta(){
  try{
    const r = await storage.get(CHAT_META_KEY);
    if(!r) return null;
    return JSON.parse(r.value);
  }catch(e){ return null; }
}
function chatMetaSignature(meta){
  return meta ? `${meta.count}:${meta.lastId}` : '';
}
async function updateChatMeta(all){
  try{
    const last = all[all.length-1];
    await storage.set(CHAT_META_KEY, JSON.stringify({count: all.length, lastId: last ? last.id : null, updatedAt: Date.now()}));
  }catch(e){ /* best effort，meta 更新失敗頂多讓輪詢多抓一次整包，不影響正確性 */ }
}
async function sendChatMessage(text){
  text = (text||'').trim();
  if(!text) return;
  if(text.length > 300){ showToast(tt('訊息請在300字以內','Message must be 300 characters or fewer')); return; }
  const msg = {id: uid(), nickname: state.nickname, text, createdAt: Date.now(), isGM: isGM(), badges: equippedBadgeKeys(state.player), titles: titleKeysHeldBy(state.nickname), avatarId: state.player && state.player.avatarId};
  let all;
  try{
    all = await fetchChatMessages();
    all.push(msg);
    if(all.length > CHAT_MAX_MESSAGES + CHAT_TRIM_BATCH) all.splice(0, all.length - CHAT_MAX_MESSAGES);
    await storage.set(CHAT_LOG_KEY, JSON.stringify(all));
  }catch(e){ showToast(tt('傳送失敗，請再試一次 ⚠','Failed to send - please try again ⚠')); return; }
  updateChatMeta(all).catch(()=>{});
  if(state.tab === 'chat') renderTab();
}
async function deleteChatMessage(id){
  if(!isGM()) return;
  let filtered;
  try{
    const all = await fetchChatMessages();
    filtered = all.filter(m=>m.id !== id);
    await storage.set(CHAT_LOG_KEY, JSON.stringify(filtered));
  }catch(e){ /* ignore */ }
  if(filtered) updateChatMeta(filtered).catch(()=>{});
  if(state.tab === 'chat') renderTab();
}
function initChatPoll(){
  let lastPollMetaSig = null;
  const poll = async ()=>{
    if(document.visibilityState !== 'visible') return; // 背景分頁不輪詢
    if(!state.nickname || state.tab !== 'chat') return;
    try{
      const meta = await fetchChatMeta();
      const sig = chatMetaSignature(meta);
      if(sig === lastPollMetaSig) return; // meta 沒變，代表聊天記錄沒有新增/刪除，不需要重抓整包
      lastPollMetaSig = sig;
      const messages = await fetchChatMessages();
      const fingerprint = messages.map(m=>m.id).join(',');
      if(fingerprint === lastChatFingerprint) return;
      lastChatFingerprint = fingerprint;
      // 只更新訊息列表本身，完全不動輸入框（不 touch DOM、不重設 value），
      // 這樣打字打到一半時視窗/游標都不會被打斷或跳動。
      updateChatMessagesDom(messages);
      markChatAsRead();
    }catch(e){ /* ignore */ }
  };
  setInterval(poll, 4000);
  registerVisiblePoll(poll);
}
// 只重繪 #chat-scroll 裡面的訊息，不動輸入框、不整包 renderTab()。
// 只有玩家原本就已經捲到（或接近）最底部時，才在更新後自動捲到底；
// 如果玩家往上捲在看歷史訊息，更新時會保留原本的捲動位置，不會被強制跳走。
function updateChatMessagesDom(messages){
  const scrollBox = document.getElementById('chat-scroll');
  if(!scrollBox) return; // 不在聊天分頁上，什麼都不用做
  const wasNearBottom = (scrollBox.scrollTop + scrollBox.clientHeight) >= (scrollBox.scrollHeight - 40);
  const recent = messages.slice(-CHAT_MAX_MESSAGES);
  scrollBox.innerHTML = recent.length === 0 ? `<div class="empty-note">${tt('目前還沒有訊息，說點什麼吧！','No messages yet - say something!')}</div>` : recent.map(m=>`
        <div class="chat-msg${m.nickname.toLowerCase()===state.nickname.toLowerCase()?' mine':''}">
          <div class="chat-msg-head">
            <div class="chat-avatar" data-view-profile="${escapeHtml(m.nickname)}">${avatarBoxHtml(m.avatarId)}</div>
            <span class="chat-msg-name" data-view-profile="${escapeHtml(m.nickname)}" style="${m.isGM?'color:var(--gold);':''}">${escapeHtml(m.nickname)}${m.isGM?' ⚡':''}</span>
            ${(m.titles||[]).length ? `<span class="title-row" style="display:inline-flex;gap:3px;">${(m.titles||[]).map(k=>titleInlineHtml(k,11)).join('')}</span>` : ''}
            ${(m.badges||[]).length ? `<span class="badge-row" style="display:inline-flex;gap:2px;">${(m.badges||[]).map(k=>badgeInlineHtml(k,15)).join('')}</span>` : ''}
            <span class="chat-msg-time">${timeAgo(m.createdAt)}</span>
            ${isGM() ? `<button class="chat-msg-del" data-chat-del="${m.id}" title="${tt('刪除訊息','Delete message')}">✕</button>` : ''}
          </div>
          <div class="chat-msg-text">${escapeHtml(m.text)}</div>
        </div>
      `).join('');
  bindProfileClickTargets(scrollBox);
  scrollBox.querySelectorAll('[data-chat-del]').forEach(btn=>{
    btn.onclick = ()=>deleteChatMessage(btn.dataset.chatDel);
  });
  if(wasNearBottom) scrollBox.scrollTop = scrollBox.scrollHeight;
}
function updateChatBadgeDom(){
  const badge = document.getElementById('chat-tab-badge');
  if(badge){ badge.style.display = chatUnreadCount>0 ? 'inline-flex' : 'none'; badge.textContent = chatUnreadCount>9?'9+':String(chatUnreadCount); }
}
async function markChatAsRead(){
  if(!state.player) return;
  chatUnreadCount = 0;
  updateChatBadgeDom();
  const now = Date.now();
  if((state.player.lastSeenChatAt||0) >= now) return;
  state.player.lastSeenChatAt = now;
  try{ await savePlayer(state.player); }catch(e){ /* ignore */ }
}
function initChatUnreadPoll(){
  let lastUnreadMetaSig = null;
  const poll = async ()=>{
    if(document.visibilityState !== 'visible') return; // 背景分頁不輪詢
    if(!state.nickname || !state.player) return;
    if(state.tab === 'chat') return; // already tracked as read while viewing
    try{
      const meta = await fetchChatMeta();
      const sig = chatMetaSignature(meta);
      if(sig === lastUnreadMetaSig) return; // meta 沒變，代表沒有新訊息，不需要重抓整包聊天記錄算未讀
      lastUnreadMetaSig = sig;
      const messages = await fetchChatMessages();
      const lastSeen = state.player.lastSeenChatAt || 0;
      chatUnreadCount = messages.filter(m=>m.nickname !== state.nickname && m.createdAt > lastSeen).length;
      updateChatBadgeDom();
    }catch(e){ /* ignore */ }
  };
  setInterval(poll, 15000);
  registerVisiblePoll(poll);
}

// ---------- 玩家暱稱輕量索引 ----------
// broadcastJackpotWin 之前呼叫 fetchAllPlayers() 只是為了拿到全部玩家的暱稱，
// 卻要把每個玩家的完整存檔（卡牌、材料、骰子…可能好幾十 KB）都下載下來，
// 中獎越常發生，這筆浪費就越常發生。這裡改成只維護一份「暱稱清單」的
// 小 key，中獎廣播只需要讀這一個小檔案。索引在玩家註冊、被 GM 刪除時
// 即時更新；也會在排行榜快取重算、GM 主控台開啟時（這兩處本來就會抓一次
// 全部玩家完整資料）順便補齊漏掉的舊帳號，不需要額外的網路請求。
const PLAYER_INDEX_KEY = 'config:player_index';
async function fetchPlayerIndex(){
  try{
    const r = await storage.get(PLAYER_INDEX_KEY);
    if(!r) return [];
    const arr = JSON.parse(r.value);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
async function addToPlayerIndex(nick){
  if(!nick) return;
  try{
    const idx = await fetchPlayerIndex();
    const lower = nick.toLowerCase();
    if(!idx.some(n=>n.toLowerCase()===lower)){
      idx.push(nick);
      await storage.set(PLAYER_INDEX_KEY, JSON.stringify(idx));
    }
  }catch(e){ /* best effort：索引寫入失敗頂多讓中獎廣播漏抓這位玩家，不影響玩家資料本身 */ }
}
async function removeFromPlayerIndex(nick){
  if(!nick) return;
  try{
    const idx = await fetchPlayerIndex();
    const lower = nick.toLowerCase();
    const next = idx.filter(n=>n.toLowerCase()!==lower);
    if(next.length !== idx.length) await storage.set(PLAYER_INDEX_KEY, JSON.stringify(next));
  }catch(e){ /* ignore */ }
}
// 利用「本來就已經抓到手」的完整玩家清單，順便補齊索引裡漏掉的暱稱
// （例如索引機制上線前就已存在的舊帳號）。不額外發任何請求抓玩家資料。
async function syncPlayerIndexFromPlayers(players){
  try{
    const idx = await fetchPlayerIndex();
    const known = new Set(idx.map(n=>n.toLowerCase()));
    const next = idx.slice();
    let changed = false;
    (players||[]).forEach(p=>{
      if(p && p.nickname && !known.has(p.nickname.toLowerCase())){
        known.add(p.nickname.toLowerCase());
        next.push(p.nickname);
        changed = true;
      }
    });
    if(changed) await storage.set(PLAYER_INDEX_KEY, JSON.stringify(next));
  }catch(e){ /* ignore */ }
}
async function fetchAllPlayers(){
  try{
    const rows = await storage.listValues('player:');
    return parseKvRows(rows);
  }catch(e){ return []; }
}
function playerTotalCards(p){ return Object.values(p.cards||{}).reduce((a,b)=>a+b,0); }
function playerUniqueCards(p){ return Object.keys(p.cards||{}).filter(k=>(p.cards[k]||0)>0).length; }

// ---------- 好友關係（獨立記錄，不寫在玩家資料裡，避免被其他存檔動作覆蓋掉） ----------
function friendshipKey(nickA, nickB){
  const a = (nickA||'').trim().toLowerCase(), b = (nickB||'').trim().toLowerCase();
  const [first, second] = a < b ? [a, b] : [b, a];
  return `friendship:${first}_${second}`;
}
async function fetchAllFriendships(){
  try{
    const rows = await storage.listValues('friendship:');
    return parseKvRows(rows, (v, k)=>({...v, _key:k}));
  }catch(e){ return []; }
}
async function fetchMyFriends(nickname){
  const all = await fetchAllFriendships();
  const lower = nickname.toLowerCase();
  return all
    .filter(f=>f.a && f.b && (f.a.toLowerCase()===lower || f.b.toLowerCase()===lower))
    .map(f=> f.a.toLowerCase()===lower ? f.b : f.a);
}
// 花園分頁每秒都會整段重繪一次（farmTickInterval），如果每次重繪都重新對 fetchMyFriends
// 掃描一次「全站」好友關係表再逐筆抓值，會變成每秒打一輪很重的網路請求；領取寵物尋寶獎勵時
// 剛好也會觸發一次 renderTab → renderFarm，得排在這些每秒發出的請求後面才輪得到，
// 玩家就會感覺「按領獎勵很慢」。好友名單變動不頻繁，這裡加一層短期快取，
// 只有在資料過期或好友關係真的變動時才重新抓，大幅減少花園分頁的網路請求量。
let myFriendsCache = null; // {nickname, friends, fetchedAt}
const MY_FRIENDS_CACHE_MS = 8000;
function invalidateMyFriendsCache(){ myFriendsCache = null; }
async function fetchMyFriendsCached(nickname){
  const now = Date.now();
  if(myFriendsCache && myFriendsCache.nickname === nickname && (now - myFriendsCache.fetchedAt) < MY_FRIENDS_CACHE_MS){
    return myFriendsCache.friends;
  }
  const friends = await fetchMyFriends(nickname);
  myFriendsCache = {nickname, friends, fetchedAt: now};
  return friends;
}
// 【修 bug】renderFarm() 顯示「正在查看的好友花園」時，過去每次重繪都直接
// await loadPlayer(state.farmVisiting) 真的打一次 API，完全沒有快取。
// farmTickInterval 每秒都會觸發一次 renderTab()→renderFarm()，只要玩家開著
// 好友花園分頁沒切走，就會無限期每秒發一次網路請求：egress 爆量，而且
// render() 要 await 這次網路來回才能畫完，每秒都會頓一下。
// 比照上面 fetchMyFriendsCached 的做法加短期快取，只有換人查看或快取過期
// 時才真的重抓；澆水/偷菜等會改變該好友花園狀態的操作要記得呼叫
// invalidateVisitingPlayerCache() 強制下一次重抓最新資料。
let visitingPlayerCache = null; // {nickname, player, fetchedAt}
const VISITING_PLAYER_CACHE_MS = 8000;
function invalidateVisitingPlayerCache(){ visitingPlayerCache = null; }
async function loadPlayerCached(nickname){
  const now = Date.now();
  if(visitingPlayerCache && visitingPlayerCache.nickname === nickname && (now - visitingPlayerCache.fetchedAt) < VISITING_PLAYER_CACHE_MS){
    return visitingPlayerCache.player;
  }
  const player = await loadPlayer(nickname);
  visitingPlayerCache = {nickname, player, fetchedAt: now};
  return player;
}
async function isFriendWith(nickA, nickB){
  try{
    const all = await fetchAllFriendships();
    const a = (nickA||'').toLowerCase(), b = (nickB||'').toLowerCase();
    return all.some(f=> f.a && f.b && (
      (f.a.toLowerCase()===a && f.b.toLowerCase()===b) ||
      (f.a.toLowerCase()===b && f.b.toLowerCase()===a)
    ));
  }catch(e){ return false; }
}
async function createFriendship(nickA, nickB){
  await storage.set(friendshipKey(nickA, nickB), JSON.stringify({a:nickA, b:nickB, since:Date.now()}));
}
async function deleteFriendship(nickA, nickB){
  try{
    const all = await fetchAllFriendships();
    const a = (nickA||'').toLowerCase(), b = (nickB||'').toLowerCase();
    const match = all.find(f=> f.a && f.b && (
      (f.a.toLowerCase()===a && f.b.toLowerCase()===b) ||
      (f.a.toLowerCase()===b && f.b.toLowerCase()===a)
    ));
    if(match && match._key){ await storage.delete(match._key); return; }
    await storage.delete(friendshipKey(nickA, nickB));
  }catch(e){ /* ignore */ }
}

async function sendFriendRequest(targetNick){
  targetNick = (targetNick||'').trim();
  if(!targetNick){ showToast(tt('請輸入好友暱稱 ✦','Please enter a friend nickname ✦')); return; }
  if(targetNick.toLowerCase() === state.nickname.toLowerCase()){ showToast(tt('不能加自己為好友',"You can't add yourself as a friend")); return; }
  if(await isFriendWith(state.nickname, targetNick)){ showToast(tt('你們已經是好友了','You are already friends')); return; }
  const target = await loadPlayer(targetNick);
  if(!target){ showToast(tt('找不到此占卜師，請確認暱稱是否正確',"Couldn't find this diviner - please check the nickname")); return; }
  const all = await fetchFriendRequests();
  const meLower = state.nickname.toLowerCase(), targetLower = target.nickname.toLowerCase();
  const dup = all.find(r=>r.status==='pending' && (
    ((r.from||'').toLowerCase()===meLower && (r.to||'').toLowerCase()===targetLower) ||
    ((r.from||'').toLowerCase()===targetLower && (r.to||'').toLowerCase()===meLower)
  ));
  if(dup){ showToast(tt('已經有待處理的好友邀請','There is already a pending friend request')); return; }
  const req = {id: uid(), from: state.nickname, to: target.nickname, status:'pending', createdAt: Date.now()};
  await storage.set(freqKey(req.id), JSON.stringify(req));
  await createNotification(target.nickname, state.nickname, 'friend_request', {});
  showToast(tt(`已送出好友邀請給 ${target.nickname} 🕊`, `Friend request sent to ${target.nickname} 🕊`));
  render();
}

async function respondFriendRequest(reqId, accept){
  const r = await storage.get(freqKey(reqId));
  if(!r) return;
  const req = JSON.parse(r.value);
  if(req.status !== 'pending' || (req.to||'').toLowerCase() !== state.nickname.toLowerCase()) return;
  req.status = accept ? 'accepted' : 'declined';
  await storage.set(freqKey(reqId), JSON.stringify(req));
  if(accept){
    await createFriendship(state.nickname, req.from);
    invalidateMyFriendsCache();
    showToast(tt(`你與 ${req.from} 已成為好友 ✦`, `You and ${req.from} are now friends ✦`));
  } else {
    showToast(tt('已婉拒好友邀請','Friend request declined'));
  }
  render();
}

async function cancelFriendRequest(reqId){
  const r = await storage.get(freqKey(reqId));
  if(!r) return;
  const req = JSON.parse(r.value);
  if(req.status !== 'pending' || (req.from||'').toLowerCase() !== state.nickname.toLowerCase()) return;
  req.status = 'cancelled';
  await storage.set(freqKey(reqId), JSON.stringify(req));
  showToast(tt('已取消好友邀請','Friend request canceled'));
  render();
}

async function removeFriend(friendNick){
  await deleteFriendship(state.nickname, friendNick);
  invalidateMyFriendsCache();
  showToast(tt(`已將 ${friendNick} 從好友移除`, `Removed ${friendNick} from friends`));
  render();
}

// ---------- Auctions ----------
// 拍賣行支援多種物品類型：卡片（cardId，數量固定 1）、材料、職業成品（可堆疊，數量可自訂）
function auctionItemMeta(itemType, itemId){
  if(itemType === 'material'){
    const def = PROFESSION_DEFS.find(d=>d.materialId===itemId);
    return def ? {icon:def.materialIcon, label:professionMaterialLabel(def)} : {icon:'❓', label:itemId};
  }
  if(itemType === 'professionItem'){
    const meta = professionItemMeta(itemId);
    return meta ? {icon:meta.icon, label:professionRecipeLabel(meta)} : {icon:'❓', label:itemId};
  }
  const c = DECK_BY_ID[itemId];
  return c ? {icon:c.icon||'🎴', label:c.name, rarity:c.rarity} : {icon:'❓', label:itemId};
}
// 依卡片稀有度回傳對應的 CSS 顏色變數名稱（與 .rar-xxx 徽章顏色一致）
function rarityColorVar(rarity){
  const map = {common:'--common', uncommon:'--uncommon', rare:'--rare', epic:'--legendary-a', legendary:'--legendary-a'};
  return map[rarity] || null;
}
function auctionDisplayInfo(a){
  if(a.itemType === 'dice'){
    const d = a.diceData;
    if(!d) return {iconHtml:`<div class="icon-box">🎲</div>`, name: tt('未知骰子','Unknown die'), nameOnly: tt('未知骰子','Unknown die')};
    const meta = DICE_QUALITY_META[d.quality] || DICE_QUALITY_META.common;
    const label = tt(`${meta.label} 骰子 Lv.${d.level||1}（基礎 ${d.baseAttack}）`, `${meta.labelEn} Die Lv.${d.level||1} (Base ${d.baseAttack})`);
    // 拍賣快照存的 face.effect 可能是完整物件（近期資料）或純 id（極舊資料），統一透過
    // resolveDiceFaceEffect 換回標準物件，才能餵給 renderDiceCard 顯示完整面效果說明。
    const normalizedDice = {...d, faces: Array.isArray(d.faces) ? d.faces.map(f=>({...f, effect: resolveDiceFaceEffect(f.effect)})) : []};
    return {
      iconHtml: `<div class="icon-box" style="display:flex;align-items:center;justify-content:center;font-size:24px;border-color:${meta.color};">🎲</div>`,
      name: `<span style="color:${meta.color};font-weight:600;">${escapeHtml(label)}</span>`,
      nameOnly: label,
      detailsHtml: renderDiceCard(normalizedDice, {}),
    };
  }
  if(a.itemType === 'material' || a.itemType === 'professionItem'){
    const meta = auctionItemMeta(a.itemType, a.itemId);
    return {
      iconHtml: `<div class="icon-box" style="display:flex;align-items:center;justify-content:center;font-size:26px;">${meta.icon}</div>`,
      name: `${escapeHtml(meta.label)} × ${a.qty}`,
      nameOnly: meta.label,
    };
  }
  const c = DECK_BY_ID[a.itemId];
  if(!c) return {iconHtml:`<div class="icon-box">❓</div>`, name: tt('未知卡片','Unknown card'), nameOnly: tt('未知卡片','Unknown card')};
  const colorVar = rarityColorVar(c.rarity);
  const styledName = colorVar ? `<span style="color:var(${colorVar});font-weight:600;">${escapeHtml(c.name)}</span>` : escapeHtml(c.name);
  return {iconHtml: `<div class="icon-box cf-${c.rarity}">${iconBoxInner(c)}</div>`, name: styledName, nameOnly: c.name, rarity: c.rarity};
}
function auctionOwnedQty(p, itemType, itemId){
  if(itemType === 'dice') return (p.dice && p.dice[itemId]) ? 1 : 0;
  if(itemType === 'material') return (p.professionMaterials && p.professionMaterials[itemId]) || 0;
  if(itemType === 'professionItem') return (p.professionItems && p.professionItems[itemId]) || 0;
  return (p.cards && p.cards[itemId]) || 0;
}
function auctionAdjustInventory(p, itemType, itemId, delta, diceData){
  if(itemType === 'dice'){
    ensureDiceInventory(p);
    if(delta < 0){
      // 上架時移除：若正裝備中先卸下，再從庫存刪除
      p.diceSlots = p.diceSlots.map(id => id === itemId ? null : id);
      delete p.dice[itemId];
    } else if(delta > 0 && diceData){
      // 得標／流標退回：用拍賣建立時存下的骰子快照還原完整物件（品質/等級/面效果都要一致）
      p.dice[itemId] = {...diceData};
    }
    return;
  }
  if(itemType === 'material'){
    ensureProfession(p);
    // 防呆：不管上層呼叫端的檢查有沒有漏洞，這裡永遠不讓材料被扣成負數
    // （跟 pending reward 領取那邊的 Math.max(0, ...) 同一種寫法）。
    p.professionMaterials[itemId] = Math.max(0, (p.professionMaterials[itemId]||0) + delta);
  } else if(itemType === 'professionItem'){
    ensureProfession(p);
    p.professionItems[itemId] = (p.professionItems[itemId]||0) + delta;
  } else {
    p.cards[itemId] = (p.cards[itemId]||0) + delta;
  }
}
// 拍賣物品發放給「別人」（得標者/流標退回賣家）一律走 pendingReward，
// 不直接 loadPlayer+mutate+savePlayer —— 因為拍賣結算可能由任何正在瀏覽
// 拍賣頁的玩家觸發，得標者當下若在自己畫面做其他操作並存檔，會用他手上
// 舊的資料整包覆寫掉這裡剛加上去的卡，導致「收購成功卻沒收到卡」。
async function grantAuctionItem(nick, itemType, itemId, qty, diceData){
  if(itemType === 'dice') return createPendingReward(nick, 'dice', {diceData});
  if(itemType === 'material') return createPendingReward(nick, 'material', {materialId:itemId, qty});
  if(itemType === 'professionItem') return createPendingReward(nick, 'item', {itemId, qty});
  return createPendingReward(nick, 'card', {cardId:itemId, qty});
}
// 讓舊資料（只有 cardId，沒有 itemType/itemId/qty）也能沿用同一套邏輯
function normalizeAuction(a){
  if(!a) return a;
  if(!a.itemType){ a.itemType = 'card'; a.itemId = a.cardId; }
  if(typeof a.qty !== 'number' || a.qty < 1) a.qty = 1;
  if(!Array.isArray(a.bidHistory)) a.bidHistory = [];
  return a;
}

// 拍賣行成交手續費：賣家成交金額會被抽走這個比例（直接從遊戲幣總量中消失，作為金幣回收機制），
// 避免玩家間買賣完全不影響金幣總量、加速通膨。GM 可在後台調整。
const DEFAULT_AUCTION_FEE_PCT = 0.08;
let AUCTION_FEE_PCT = DEFAULT_AUCTION_FEE_PCT;
async function loadAuctionConfig(){
  try{
    const r = await storage.get('config:auction_fee');
    if(r){
      const s = JSON.parse(r.value);
      if(typeof s.feePct === 'number' && s.feePct >= 0 && s.feePct <= 1) AUCTION_FEE_PCT = s.feePct;
    }
  }catch(e){ /* keep defaults */ }
}
async function saveAuctionConfig(){
  await storage.set('config:auction_fee', JSON.stringify({feePct: AUCTION_FEE_PCT}));
}
function auctionFeeAmount(price, venusReductionPct){
  const effPct = Math.max(0, AUCTION_FEE_PCT - (venusReductionPct||0)); // ♀️ 星盤金星節點：以賣家的加成減免手續費百分點
  return Math.min(price, Math.round((price||0) * effPct));
}
async function listAuction(itemType, itemId, qty, startBid, buyoutPrice, durMs){
  if(!itemId){ showToast(tt('請選擇物品','Please choose an item')); return; }
  if(itemType !== 'material' && itemType !== 'professionItem' && itemType !== 'dice') itemType = 'card';
  if(itemType === 'card' && !isCardAuctionTradable(itemId)){
    showToast(tt('普通／不常見卡牌無法上架拍賣','Common/Uncommon cards cannot be listed on the auction'));
    return;
  }
  qty = (itemType === 'card' || itemType === 'dice') ? 1 : Math.max(1, Math.floor(qty||1));
  const owned = auctionOwnedQty(state.player, itemType, itemId);
  if(owned < qty){ showToast(tt('數量不足，無法上架','Not enough quantity to list')); return; }
  if(!isGM()){
    const existingAuctions = await fetchAuctions();
    const activeCount = existingAuctions.filter(a=>a.status==='active' && a.seller===state.nickname).length;
    if(activeCount >= 5){
      showToast(tt('最多同時上架 5 個拍賣','You can only have 5 active auctions at a time'));
      return;
    }
  }
  let diceSnapshot = null;
  if(itemType === 'dice'){
    ensureDiceInventory(state.player);
    if(state.player.diceSlots.includes(itemId)){
      showToast(tt('請先到「骰子」分頁卸下裝備中的骰子，再上架拍賣','Unequip this die in the Dice tab before listing it for auction'));
      return;
    }
    diceSnapshot = {...state.player.dice[itemId]};
  }
  const hasStart = startBid && startBid >= 1;
  const hasBuyout = buyoutPrice && buyoutPrice >= 1;
  if(!hasStart && !hasBuyout){ showToast(tt('起標價與一口價至少要填一個','Please fill in either a starting bid or a buyout price')); return; }
  if(hasStart && hasBuyout && buyoutPrice <= startBid){ showToast(tt('一口價必須高於起標價','Buyout price must be higher than the starting bid')); return; }
  // 🔒 修正材料變負數的漏洞：上面那個 owned<qty 檢查是在 await fetchAuctions() 之前做的，
  // 但真正扣庫存的 auctionAdjustInventory 在那個 await 之後才執行。await 期間如果玩家
  // 同時觸發了其他會消耗同一種材料的動作（例如職業頁面按下「生產」），因為兩邊操作的
  // 都是同一個 state.player 物件參考，那個動作會直接在這段 await 空檔把材料扣掉、存檔；
  // 等 fetchAuctions() 回來後，這裡就會拿著「已經扣過的最新庫存」再扣一次，扣成負數
  // （這就是玩家回報的材料變成 -4）。修法：緊貼在真正扣庫存之前，用當下最新的
  // state.player 再驗證一次數量足夠，不足就中止，不再依賴函式最上面那個提早做的檢查。
  const ownedNow = auctionOwnedQty(state.player, itemType, itemId);
  if(ownedNow < qty){ showToast(tt('數量不足，無法上架','Not enough quantity to list')); return; }
  auctionAdjustInventory(state.player, itemType, itemId, -qty);
  bumpQuest(state.player, 'auction', 1);
  await savePlayer(state.player);
  const auction = {
    id: uid(), seller: state.nickname, itemType, itemId, qty,
    diceData: diceSnapshot,
    startBid: hasStart ? startBid : null,
    buyoutPrice: hasBuyout ? buyoutPrice : null,
    currentBid: 0, currentBidder: null, createdAt: Date.now(),
    endsAt: Date.now() + durMs, status:'active', bidHistory: []
  };
  await storage.set(`auction:${auction.id}`, JSON.stringify(auction));
  showToast(tt('已建立拍賣 🔨','Auction created 🔨'));
  render();
}
async function fetchAuctions(){
  try{
    const rows = await storage.listValues('auction:');
    return parseKvRows(rows).map(normalizeAuction);
  }catch(e){ return []; }
}
async function placeBid(auctionId, amount){
  const r = await storage.get(`auction:${auctionId}`);
  if(!r){ showToast(tt('拍賣不存在','Auction does not exist')); return; }
  const auction = normalizeAuction(JSON.parse(r.value));
  if(auction.status !== 'active' || Date.now() > auction.endsAt){ showToast(tt('此拍賣已結束','This auction has ended')); return; }
  if(!auction.startBid){ showToast(tt('這個拍賣沒有開放競標，只能直接購買','This auction is not open for bidding - only direct purchase')); return; }
  const minBid = auction.currentBid > 0 ? auction.currentBid + 1 : auction.startBid;
  if(amount < minBid){ showToast(tt(`出價至少要 ${minBid} 枚遊戲幣`, `Bid must be at least ${minBid} coins`)); return; }
  if(auction.buyoutPrice && amount >= auction.buyoutPrice){ showToast(tt(`出價已達一口價，請直接使用「直接購買」`, `Your bid has reached the buyout price - please use "Buy Now" instead`)); return; }
  if(auction.seller === state.nickname){ showToast(tt('不能競標自己的拍賣',"You can't bid on your own auction")); return; }
  // refund previous bidder. If it's the same person raising their own bid,
  // refund straight into state.player instead of a separately-loaded copy —
  // otherwise savePlayer(state.player) below overwrites that refund.
  if(auction.currentBidder === state.nickname){
    state.player.coins += auction.currentBid;
  } else if(auction.currentBidder){
    await createPendingReward(auction.currentBidder, 'coins', {amount: auction.currentBid});
    const itemName = auctionDisplayInfo(auction).nameOnly;
    await createNotification(auction.currentBidder, state.nickname, 'auction_outbid', {cardName: itemName, price: amount});
  }
  if(amount > state.player.coins){ showToast(tt('遊戲幣不足','Not enough coins')); return; }
  state.player.coins -= amount;
  bumpQuest(state.player, 'auction', 1);
  await savePlayer(state.player);
  auction.currentBid = amount;
  auction.currentBidder = state.nickname;
  if(!Array.isArray(auction.bidHistory)) auction.bidHistory = [];
  auction.bidHistory.push({bidder: state.nickname, amount, at: Date.now()});
  if(auction.bidHistory.length > 20) auction.bidHistory = auction.bidHistory.slice(-20);
  await storage.set(`auction:${auctionId}`, JSON.stringify(auction));
  showToast(tt('出價成功！✦','Bid placed! ✦'));
  renderTab();
  updateHeaderCoins();
}
async function buyoutAuction(auctionId){
  const r = await storage.get(`auction:${auctionId}`);
  if(!r){ showToast(tt('拍賣不存在','Auction does not exist')); return; }
  const auction = normalizeAuction(JSON.parse(r.value));
  if(auction.status !== 'active' || Date.now() > auction.endsAt){ showToast(tt('此拍賣已結束','This auction has ended')); return; }
  if(!auction.buyoutPrice){ showToast(tt('這個拍賣沒有開放直接購買','This auction is not open for direct purchase')); return; }
  if(auction.seller === state.nickname){ showToast(tt('不能購買自己的拍賣',"You can't buy your own auction")); return; }
  const price = auction.buyoutPrice;
  const itemName = auctionDisplayInfo(auction).nameOnly;
  // refund previous bidder if any (they got beaten by a buyout).
  // If the buyer IS the previous bidder, refund straight into state.player
  // instead of a separately-loaded copy — otherwise the savePlayer(state.player)
  // below would overwrite that refund with the stale in-memory balance.
  if(auction.currentBidder === state.nickname){
    state.player.coins += auction.currentBid;
  } else if(auction.currentBidder){
    await createPendingReward(auction.currentBidder, 'coins', {amount: auction.currentBid});
    await createNotification(auction.currentBidder, state.nickname, 'auction_outbid', {cardName: itemName, price});
  }
  if(price > state.player.coins){ showToast(tt('遊戲幣不足','Not enough coins')); return; }
  state.player.coins -= price;
  auctionAdjustInventory(state.player, auction.itemType, auction.itemId, auction.qty, auction.diceData);
  bumpQuest(state.player, 'auction', 1);
  ensureStats(state.player).totalAuctionTrades += 1;
  ensureStats(state.player).totalAuctionVolume += price; // 買家這筆交易量算「一口價全額」
  await savePlayer(state.player);
  const sellerForFee = (auction.seller === state.nickname) ? state.player : await loadPlayer(auction.seller);
  const fee = auctionFeeAmount(price, sellerForFee ? starChartVenusFeeReductionPct(sellerForFee) : 0);
  const payout = price - fee;
  // 賣家收款走 pendingReward：賣家不是當前操作者，若直接 loadPlayer+savePlayer，
  // 賣家自己那邊若同時存檔會把這筆收款覆蓋掉（同「沒收到卡」的成因）。
  // createPendingReward 內建重試，這裡只需處理「重試後仍失敗」的情況。
  // price 一併帶過去，讓賣家那邊記錄的交易量用「成交價」而非「扣完手續費的實收金額」，
  // 買賣雙方口徑才會一致。
  const sellerPayoutOk = await createPendingReward(auction.seller, 'auction_sale', {amount: payout, price});
  auction.status = 'completed';
  auction.currentBid = price;
  auction.currentBidder = state.nickname;
  auction.viaBuyout = true;
  await storage.set(`auction:${auctionId}`, JSON.stringify(auction));
  await createNotification(auction.seller, state.nickname, 'auction_sold', {cardName: itemName, price: payout, viaBuyout:true});
  if(sellerPayoutOk){
    showToast(tt('購買成功！✦','Purchase successful! ✦'));
  } else {
    // 商品與金幣已經在買家這邊完成扣款/入手，賣家的入帳失敗紀錄已寫入
    // failedreward:，需要 GM 後續查看並手動補發。買家操作本身仍算成功，
    // 但提示一下，避免買家以為異常是自己這邊造成的。
    showToast(tt('購買成功，但賣家收款延遲，系統已記錄將盡快處理 ✦','Purchase successful, but the seller\'s payout is delayed — this has been logged for follow-up ✦'));
  }
  renderTab();
  updateHeaderCoins();
}
async function resolveAuction(auction){
  if(auction.status !== 'active' || Date.now() < auction.endsAt) return;
  const itemName = auctionDisplayInfo(auction).nameOnly;
  if(auction.currentBidder){
    await grantAuctionItem(auction.currentBidder, auction.itemType, auction.itemId, auction.qty, auction.diceData);
    await createPendingReward(auction.currentBidder, 'auction_trade_stat', {price: auction.currentBid});
    const sellerForFee = await loadPlayer(auction.seller);
    const fee = auctionFeeAmount(auction.currentBid, sellerForFee ? starChartVenusFeeReductionPct(sellerForFee) : 0);
    const payout = auction.currentBid - fee;
    // 這裡是背景自動結算（沒有明確的「操作中玩家」可以跳 toast），
    // 失敗時 createPendingReward 內部會重試、寫 failedreward: 記錄並 console.error，
    // 之後可在 GM 後台或 storage 查 failedreward: 前綴找出所有未成功發放的收款。
    await createPendingReward(auction.seller, 'auction_sale', {amount: payout, price: auction.currentBid});
    await createNotification(auction.seller, auction.currentBidder, 'auction_sold', {cardName: itemName, price: payout});
    await createNotification(auction.currentBidder, auction.seller, 'auction_won', {cardName: itemName, price: auction.currentBid});
  } else {
    await grantAuctionItem(auction.seller, auction.itemType, auction.itemId, auction.qty, auction.diceData);
    await createNotification(auction.seller, 'system', 'auction_unsold', {cardName: itemName});
  }
  auction.status = 'completed';
  await storage.set(`auction:${auction.id}`, JSON.stringify(auction));
}
async function cancelAuction(auctionId){
  const r = await storage.get(`auction:${auctionId}`);
  if(!r) return;
  const auction = normalizeAuction(JSON.parse(r.value));
  if(auction.status !== 'active' || auction.seller !== state.nickname || auction.currentBidder) return;
  auctionAdjustInventory(state.player, auction.itemType, auction.itemId, auction.qty, auction.diceData);
  await savePlayer(state.player);
  auction.status = 'cancelled';
  await storage.set(`auction:${auctionId}`, JSON.stringify(auction));
  showToast(tt('已取消拍賣並取回物品','Auction canceled and item returned'));
  renderTab();
}

function allCardOptions(){
  return DECK.filter(c=>AUCTION_TRADABLE_RARITIES.includes(c.rarity)).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}
async function createWantToBuy(cardId, pricePerCard, quantity, durMs){
  if(!cardId){ showToast(tt('請選擇卡片','Please choose a card')); return; }
  if(!isCardAuctionTradable(cardId)){ showToast(tt('普通／不常見卡牌無法建立求購單','Common/Uncommon cards cannot be requested via buy orders')); return; }
  if(!pricePerCard || pricePerCard < 1){ showToast(tt('請輸入有效的收購單價','Please enter a valid price per card')); return; }
  quantity = Math.floor(quantity);
  if(!quantity || quantity < 1){ showToast(tt('請輸入有效的收購數量','Please enter a valid quantity')); return; }
  const totalCost = pricePerCard * quantity;
  if(totalCost > state.player.coins){ showToast(tt('遊戲幣不足以鎖定這筆收購款項','Not enough coins to lock this buy order')); return; }
  state.player.coins -= totalCost;
  await savePlayer(state.player);
  const order = {
    id: uid(), buyer: state.nickname, cardId,
    pricePerCard, quantity, remaining: quantity,
    createdAt: Date.now(), endsAt: Date.now() + durMs, status: 'active'
  };
  await storage.set(`wtb:${order.id}`, JSON.stringify(order));
  showToast(tt('已建立求購單 📥','Buy order created 📥'));
  render();
}
async function fetchWantToBuys(){
  try{
    const rows = await storage.listValues('wtb:');
    return parseKvRows(rows);
  }catch(e){ return []; }
}
async function fulfillWantToBuy(orderId, sellQty){
  const r = await storage.get(`wtb:${orderId}`);
  if(!r){ showToast(tt('求購單不存在','Buy order does not exist')); return; }
  const order = JSON.parse(r.value);
  if(order.status !== 'active' || Date.now() > order.endsAt){ showToast(tt('這個求購單已結束','This buy order has ended')); return; }
  if(order.buyer === state.nickname){ showToast(tt('不能賣給自己的求購單',"You can't fulfill your own buy order")); return; }
  const owned = state.player.cards[order.cardId] || 0;
  sellQty = Math.floor(sellQty) || 0;
  if(sellQty < 1){ showToast(tt('請輸入有效的出售數量','Please enter a valid quantity')); return; }
  if(sellQty > owned){ showToast(tt('你沒有這麼多這張卡',"You don't have that many of this card")); return; }
  if(sellQty > order.remaining){ showToast(tt('超過這筆求購單剩餘的收購數量','Exceeds the remaining quantity on this buy order')); return; }
  const total = order.pricePerCard * sellQty;
  const cardName = (DECK_BY_ID[order.cardId] && DECK_BY_ID[order.cardId].name) || tt('未知卡片','Unknown card');
  state.player.cards[order.cardId] = owned - sellQty;
  state.player.coins += total;
  bumpQuest(state.player, 'auction', 1);
  ensureStats(state.player).totalAuctionTrades += 1;
  ensureStats(state.player).totalAuctionVolume += total; // 求購單賣家這筆交易量算「成交總額」
  await savePlayer(state.player);
  // 求購單買家收到卡片：買家不是當前操作者（是賣家在賣），若直接
  // loadPlayer+savePlayer，買家自己那邊若同時存檔會把這張卡覆蓋掉。
  await grantAuctionItem(order.buyer, 'card', order.cardId, sellQty);
  await createPendingReward(order.buyer, 'auction_trade_stat', {price: total});
  order.remaining -= sellQty;
  if(order.remaining <= 0){ order.status = 'completed'; }
  await storage.set(`wtb:${orderId}`, JSON.stringify(order));
  await createNotification(order.buyer, state.nickname, 'wtb_filled', {cardName, price: order.pricePerCard, qty: sellQty});
  showToast(tt(`已賣出 x${sellQty}「${cardName}」，獲得 ✦${total}`, `Sold x${sellQty} "${cardName}" for ✦${total}`));
  render();
}
async function resolveWantToBuy(order){
  if(order.status !== 'active' || Date.now() < order.endsAt) return;
  if(order.remaining > 0){
    await createPendingReward(order.buyer, 'coins', {amount: order.pricePerCard * order.remaining});
  }
  order.status = 'expired';
  await storage.set(`wtb:${order.id}`, JSON.stringify(order));
}
async function cancelWantToBuy(orderId){
  const r = await storage.get(`wtb:${orderId}`);
  if(!r) return;
  const order = JSON.parse(r.value);
  if(order.status !== 'active' || order.buyer !== state.nickname) return;
  if(order.remaining > 0){
    state.player.coins += order.pricePerCard * order.remaining;
    await savePlayer(state.player);
  }

function fmtCountdown(ms){
  if(ms <= 0) return tt('已截標','Ended');

  const m = Math.floor((ms%3600000)/60000);
  return tt(`${h}時${m}分`, `${h}h ${m}m`);
}

// 每種項目各自獨立呼叫 createPendingReward（互不影響、沒有共用狀態要處理併發），
// 這裡只是把「只抓一次目標玩家」「只跳一次總結 toast」這兩件事集中起來，體驗上像是「一次發放」。
// 欄位留空／為0的項目會被忽略，不會發放空值。
async function gmGrantBundle(targetNick, opts){
  if(!isGM()) return;
  targetNick = (targetNick||'').trim();
  if(!targetNick){ showToast(tt('請輸入目標玩家暱稱','Please enter the target player nickname')); return; }

  const hasCoins = opts.coinAmount !== '' && opts.coinAmount !== null && opts.coinAmount !== undefined && !isNaN(opts.coinAmount) && parseInt(opts.coinAmount) !== 0;
  const coinAmount = hasCoins ? parseInt(opts.coinAmount) : 0;
  const cards = (opts.cards||[])
    .map(it=>({cardId: it.cardId, qty: parseInt(it.qty) || 1}))
    .filter(it=>it.cardId && DECK_BY_ID[it.cardId] && it.qty > 0);
  const materialQty = parseInt(opts.materialQty) || 0;
  const hasMaterial = !!opts.materialId && PROFESSION_MATERIAL_IDS.includes(opts.materialId) && materialQty > 0;
  const itemQty = parseInt(opts.itemQty) || 0;
  const hasItem = !!opts.itemId && PROFESSION_ITEM_IDS.includes(opts.itemId) && itemQty > 0;
  const talismanQty = parseInt(opts.talismanQty) || 0;
  const hasTalisman = talismanQty > 0;

  if(!hasCoins && cards.length === 0 && !hasMaterial && !hasItem && !hasTalisman){
    showToast(tt('請至少填寫一項要發放的內容','Please fill in at least one item to grant'));
    return;
  }

  const target = await loadPlayer(targetNick);
  if(!target){ showToast(tt('找不到此玩家','Player not found')); return; }

  const summaryZh = [];
  const summaryEn = [];

  if(hasCoins){
    await createPendingReward(target.nickname, 'coins', {amount: coinAmount});
    await createNotification(target.nickname, GM_NICKNAME, 'gm_grant', {grantKind:'coins', amount: coinAmount});
    summaryZh.push(`✦${coinAmount}`); summaryEn.push(`✦${coinAmount}`);
  }
  for(const it of cards){
    const c = DECK_BY_ID[it.cardId];
    await createPendingReward(target.nickname, 'card', {cardId: it.cardId, qty: it.qty});
    await createNotification(target.nickname, GM_NICKNAME, 'gm_grant', {grantKind:'card', label:c.name, qty: it.qty});
    summaryZh.push(`${c.name} x${it.qty}`); summaryEn.push(`${c.name} x${it.qty}`);
  }
  if(hasMaterial){
    const def = PROFESSION_DEFS.find(d=>d.materialId===opts.materialId);
    const label = def ? professionMaterialLabel(def) : opts.materialId;
    await createPendingReward(target.nickname, 'material', {materialId: opts.materialId, qty: materialQty});
    await createNotification(target.nickname, GM_NICKNAME, 'gm_grant', {grantKind:'material', label, qty: materialQty});
    summaryZh.push(`${label} x${materialQty}`); summaryEn.push(`${label} x${materialQty}`);
  }
  if(hasItem){
    const meta = professionItemMeta(opts.itemId);
    const label = meta ? professionRecipeLabel(meta) : opts.itemId;
    await createPendingReward(target.nickname, 'item', {itemId: opts.itemId, qty: itemQty});
    await createNotification(target.nickname, GM_NICKNAME, 'gm_grant', {grantKind:'item', label, qty: itemQty});
    summaryZh.push(`${label} x${itemQty}`); summaryEn.push(`${label} x${itemQty}`);
  }
  if(hasTalisman){
    const label = tt('幽冥骰符','Ghost Dice Talisman');
    await createPendingReward(target.nickname, 'ghost_talisman', {qty: talismanQty});
    await createNotification(target.nickname, GM_NICKNAME, 'gm_grant', {grantKind:'ghost_talisman', label, qty: talismanQty});
    summaryZh.push(`🔮${label} x${talismanQty}`); summaryEn.push(`🔮${label} x${talismanQty}`);
  }

  showToast(tt(`已一次發放給 ${target.nickname}：${summaryZh.join('、')} ⚡`, `Granted to ${target.nickname}: ${summaryEn.join(', ')} ⚡`));
  if(target.nickname.toLowerCase() === state.nickname.toLowerCase()){
    await refreshPlayer();
  }
  render();
}

        if(!state.farmUpgradeMode && !petSynthesisOpenId){

          const farmScrollY = window.scrollY;

      if(state.tab === 'expedition'){
        // 玩家正在點開家具/飾品下拉選單或武器勾選框時，這個元素會是 document.activeElement；
        // 這時候如果整段重繪，原生 <select> 的下拉選單會因為底層 DOM 被整個換掉而被強制關閉，
        // 玩家還沒選完選項視窗就消失了。所以偵測到正在互動時，這一秒先跳過重繪，等選完失焦後再繼續倒數。
        const active = document.activeElement;
        const isPickerActive = active && typeof active.id === 'string' &&
          (active.id.startsWith('furniture-sel-') || active.id.startsWith('accessory-sel-') || active.id.startsWith('weapon-sel-'));
        if(isPickerActive) return;
        // 🐛 連勝加碼 Boss 攻擊動畫（playDiceRollAnimation）播放期間也跳過這一秒的整段
        // 重繪，理由跟上面的下拉選單一樣：重繪會把動畫正在操作的 #streak-boss-dice-anim
        // 節點整個換掉，動畫收尾的隱藏邏輯就作用在被換掉、看不到的舊節點上，畫面上
        // 反而卡住不會消失。見 attackStreakBoss() 開頭的說明。
        if(state.streakBossAnimating) return;
        // 🎲 遠征補骰翻盤動畫（rollExpeditionRescue）播放期間同樣要跳過整段重繪，
        // 理由跟上面連勝加碼 Boss 的動畫一致：重繪會把動畫正在操作的
        // #expedition-rescue-dice-anim 節點整個換掉，導致動畫卡住不會收尾。
        if(state.expeditionRescueAnimating) return;
        // 遠征頁每秒重繪倒數計時，會連帶重建「使用道具」的選單，重繪後預設值會被重設；
        // 重繪前先記住家具/飾品下拉選單的值、武器勾選框的勾選狀態，重繪後再還原，避免玩家選了下一秒就消失。
        const savedSelects = Array.from(document.querySelectorAll('select[id^="furniture-sel-"], select[id^="accessory-sel-"], select[id^="weapon-sel-"]')).map(el=>({id: el.id, value: el.value}));
        await renderTab();
        savedSelects.forEach(({id, value})=>{
          const el = document.getElementById(id);
          if(el && !el.disabled && Array.from(el.options).some(o=>o.value===value)) el.value = value;
        });
      }
      else { clearInterval(expeditionTickInterval); expeditionTickInterval = null; }
    }, 1000);
  }
  if(professionTickInterval){ clearInterval(professionTickInterval); professionTickInterval = null; }
  if(state.tab === 'profession'){
    professionTickInterval = setInterval(()=>{
      if(state.tab === 'profession'){
        const professionScrollY = window.scrollY;
        renderTab();
        window.scrollTo(0, professionScrollY);
      }
      else { clearInterval(professionTickInterval); professionTickInterval = null; }
    }, 1000);
  }
}

const GM_PAGE_SIZE = 10;
function pagerHtml(current, total, idPrefix){
  if(total<=1) return '';
  return `<div class="form-row" style="justify-content:center;margin-top:10px;gap:10px;align-items:center;">
    <button class="btn small secondary" id="${idPrefix}-prev" ${current<=1?'disabled':''}>‹ ${tt('上一頁','Prev')}</button>
    <span style="font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);">${tt(`第 ${current} / ${total} 頁`, `Page ${current} / ${total}`)}</span>
    <button class="btn small secondary" id="${idPrefix}-next" ${current>=total?'disabled':''}>${tt('下一頁','Next')} ›</button>
  </div>`;
}
function wirePager(current, total, idPrefix, pageField){
  if(total<=1) return;
  const prevBtn = document.getElementById(`${idPrefix}-prev`);
  const nextBtn = document.getElementById(`${idPrefix}-next`);
  if(prevBtn) prevBtn.onclick = ()=>{ state[pageField] = Math.max(1, current - 1); renderTab(); };
  if(nextBtn) nextBtn.onclick = ()=>{ state[pageField] = Math.min(total, current + 1); renderTab(); };
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 拍賣行只開放稀有度較高的卡牌（rare 以上），common/uncommon 太容易取得，
// 開放拍賣意義不大又會洗版拍賣列表，這裡統一集中判斷，賣卡跟收購單都共用同一條規則。
const AUCTION_TRADABLE_RARITIES = ['rare', 'epic', 'legendary'];
function isCardAuctionTradable(cardId){
  const c = DECK.find(d=>d.id===cardId);
  return !!c && AUCTION_TRADABLE_RARITIES.includes(c.rarity);
}
function ownedCardOptions(){
  return DECK.filter(c=>(state.player.cards[c.id]||0) > 0 && AUCTION_TRADABLE_RARITIES.includes(c.rarity))
    .map(c=>`<option value="${c.id}">${c.name} (${tt(`持有 ${state.player.cards[c.id]}`, `x${state.player.cards[c.id]} owned`)})</option>`).join('');
}

async function renderMailbox(body){
  body.innerHTML = `<div class="loading-line">${tt('讀取信箱中...','Loading mailbox...')}</div>`;
  await refreshPlayer();
  const notifs = await fetchNotifications();
  const unreadNotifCount = notifs.filter(n=>!n.read).length;

  if(!state.mailboxCat) state.mailboxCat = 'all';
  const filtered = state.mailboxCat==='all' ? notifs : notifs.filter(n=>notifCategory(n.type)===state.mailboxCat);

  const NOTIF_PAGE_SIZE = 8;
  const NOTIF_MAX_PAGES = 10;
  const notifsCapped = filtered.slice(0, NOTIF_PAGE_SIZE * NOTIF_MAX_PAGES);
  const notifTotalPages = Math.max(1, Math.ceil(notifsCapped.length / NOTIF_PAGE_SIZE));
  if(!state.notifPage || state.notifPage < 1) state.notifPage = 1;
  if(state.notifPage > notifTotalPages) state.notifPage = notifTotalPages;
  const notifPageStart = (state.notifPage - 1) * NOTIF_PAGE_SIZE;
  const recentNotifs = notifsCapped.slice(notifPageStart, notifPageStart + NOTIF_PAGE_SIZE);

  const CATS = [
    {key:'all', label:t('mailboxCatAll')},
    {key:'auction', label:t('mailboxCatAuction')},
    {key:'boss', label:t('mailboxCatBoss')},
    {key:'friends', label:t('mailboxCatFriends')},
    {key:'gm', label:t('mailboxCatGM')},
    {key:'resonance', label:t('mailboxCatResonance')},
  ];

  let html = `<div class="panel">
    <h2>${t('tabMailbox')}${unreadNotifCount>0?` <span style="color:#e0455f;font-size:12px;">(${unreadNotifCount})</span>`:''}</h2>
    <div class="form-row" style="gap:6px;flex-wrap:wrap;">
      ${CATS.map(c=>`<button class="btn small${state.mailboxCat===c.key?'':' secondary'}" data-mailbox-cat="${c.key}">${c.label}</button>`).join('')}
    </div>
  </div>`;

  html += `<div class="panel">
    ${recentNotifs.length===0 ? `<div class="empty-note">${t('mailboxEmpty')}</div>` : recentNotifs.map(n=>`
      <div class="listing">
        <div class="left"><div class="icon-box">${n.type==='friend_request'?'🕊':(n.type==='steal'||n.type==='steal_bulk')?'🌾':(n.type==='water'||n.type==='water_bulk')?'🚿':n.type==='pet_help_bulk'?'🐾':(n.type.startsWith('auction')||n.type.startsWith('wtb'))?'💰':n.type==='gm_grant'?'⚡':n.type==='boss_reward'?'⚔️':(n.type==='jackpot_win'||n.type==='jackpot_self_win')?'💫':'🔔'}</div><div class="meta"><div>${escapeHtml(notifText(n))}</div><div class="who">${timeAgo(n.createdAt)}</div></div></div>
      </div>
    `).join('')}
    ${notifTotalPages > 1 ? `
      <div class="form-row" style="justify-content:center;margin-top:8px;gap:6px;">
        <button class="btn small secondary" id="notif-page-prev" ${state.notifPage<=1?'disabled':''}>‹</button>
        ${Array.from({length:notifTotalPages}, (_,i)=>i+1).map(pn=>`<button class="btn small${pn===state.notifPage?'':' secondary'}" data-notif-page="${pn}">${pn}</button>`).join('')}
        <button class="btn small secondary" id="notif-page-next" ${state.notifPage>=notifTotalPages?'disabled':''}>›</button>
      </div>
    ` : ''}
  </div>`;

  body.innerHTML = html;

  document.querySelectorAll('[data-mailbox-cat]').forEach(b=>{
    b.onclick = ()=>{ state.mailboxCat = b.dataset.mailboxCat; state.notifPage = 1; renderTab(); };
  });
  document.querySelectorAll('[data-notif-page]').forEach(b=>{
    b.onclick = ()=>{ state.notifPage = Number(b.dataset.notifPage); renderTab(); };
  });
  const notifPrevBtn = document.getElementById('notif-page-prev');
  if(notifPrevBtn) notifPrevBtn.onclick = ()=>{ state.notifPage = Math.max(1, state.notifPage - 1); renderTab(); };
  const notifNextBtn = document.getElementById('notif-page-next');
  if(notifNextBtn) notifNextBtn.onclick = ()=>{ state.notifPage = state.notifPage + 1; renderTab(); };

  // Viewing this tab counts as having seen the notifications: mark them
  // read and clear the header badge (without a full re-render, so we don't
  // interrupt anything the user is doing on this screen).
  if(unreadNotifCount > 0){
    markAllNotificationsRead(notifs).then(()=>{
      notifUnreadCount = 0;
      notifs.forEach(n=>notifBadgeSeenIds.add(n.id));
      const badge = document.getElementById('notif-badge');
      if(badge) badge.style.display = 'none';
    });
  }
}
