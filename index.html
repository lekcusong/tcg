let BOSS_COMBO_STREAK_CAP = DEFAULT_BOSS_COMBO_STREAK_CAP;

// 👹 小怪：Boss 戰鬥過程中額外出現的小怪。攻擊時若目前有存活小怪，這次攻擊的
// 傷害會優先打在小怪身上；打不死則剩餘（溢出）傷害才繼續打 Boss。小怪被擊殺
// 後立刻發放金幣獎勵，沒有小怪存活時每次攻擊才有機會刷出新的一隻。
const BOSS_MINION_TYPES = [
  {id:'imp',   icon:'👹', labelZh:'骰靈小惡魔', labelEn:'Dice Imp',        hp:150, rewardCoinsMin:10, rewardCoinsMax:25, weight:5},
  {id:'wisp',  icon:'👻', labelZh:'星軌幽光',   labelEn:'Star-Trail Wisp', hp:80,  rewardCoinsMin:5,  rewardCoinsMax:15, weight:4},
  {id:'golem', icon:'🗿', labelZh:'碎石護衛',   labelEn:'Stone Guardian',  hp:400, rewardCoinsMin:30, rewardCoinsMax:60, weight:1},
];
const DEFAULT_BOSS_MINION_SPAWN_CHANCE = 0.15; // 每次攻擊、且目前沒有存活小怪時，有此機率額外刷出一隻
let BOSS_MINION_SPAWN_CHANCE = DEFAULT_BOSS_MINION_SPAWN_CHANCE;

// 依 BOSS_MINION_TYPES 的 weight 權重抽一種小怪類型，回傳存進 boss 存檔用的小怪物件。
function spawnBossMinion(){
  const totalWeight = BOSS_MINION_TYPES.reduce((sum, m) => sum + m.weight, 0);
  let roll = Math.random() * totalWeight;
  let picked = BOSS_MINION_TYPES[BOSS_MINION_TYPES.length - 1];
  for(const m of BOSS_MINION_TYPES){
    if(roll < m.weight){ picked = m; break; }
    roll -= m.weight;
  }
  return {typeId: picked.id, hp: picked.hp, maxHp: picked.hp};
}

// ✨ 隨機事件：每次 Boss 進入新的一階（stage）或新一輪（cycle）時，有機率觸發
// 一張隨機事件卡（同一時間只會有一張生效，換階時舊的會先被清掉重抽）。效果分兩種：
//   - 立即生效型（寶箱／詛咒）：resolveBossAttack 判定當下就直接套用/算好獎勵，
//     不需要額外狀態追蹤，寶箱/詛咒補償走 grantBossEventReward 用 CAS 另外發放。
//   - 持續生效型（祝福／風暴／迷霧）：寫進 boss.activeEvent = {id, hitsLeft, value}，
//     由 rollDiceAttack 在下 N 次攻擊套用傷害加成/減損，每次攻擊消耗 1 次，
//     hitsLeft 歸零後 resolveBossAttack 會自動清除。
const BOSS_EVENT_TYPES = [
  {id:'blessing', icon:'🙏', labelZh:'星辰祝福', labelEn:'Starlight Blessing',
    descZh:'下一次攻擊必定暴擊，且傷害額外 +30%！', descEn:'Your next attack is a guaranteed critical hit with +30% bonus damage!',
    kind:'buff', weight:3, hits:1, value:0.30},
  {id:'storm', icon:'🌩️', labelZh:'星軌風暴', labelEn:'Star-Trail Storm',
    descZh:'接下來 3 次攻擊傷害 +25%！', descEn:'Your next 3 attacks deal +25% bonus damage!',
    kind:'buff', weight:2, hits:3, value:0.25},
  {id:'treasure', icon:'🎁', labelZh:'星軌寶箱', labelEn:'Star-Trail Chest',
    descZh:'當場獲得額外金幣！', descEn:'Instantly gain bonus coins!',
    kind:'instant', weight:3},
  {id:'curse', icon:'☠️', labelZh:'蛇神詛咒', labelEn:"Serpent's Curse",
    descZh:'此階段血量 +20%，換取立即的金幣補償。', descEn:'This stage gains +20% HP, in exchange for an instant coin compensation.',
    kind:'instant', weight:2, value:0.20},
  {id:'fog', icon:'🌫️', labelZh:'迷霧繚繞', labelEn:'Veiling Fog',
    descZh:'下一次攻擊傷害 -30%……小心！', descEn:'Your next attack deals -30% damage... watch out!',
    kind:'debuff', weight:1, hits:1, value:0.30},
];
const DEFAULT_BOSS_EVENT_TRIGGER_CHANCE = 0.35; // 每次換階/換輪時，觸發隨機事件卡的機率
let BOSS_EVENT_TRIGGER_CHANCE = DEFAULT_BOSS_EVENT_TRIGGER_CHANCE;
const DEFAULT_BOSS_TREASURE_COINS = {min:50, max:120};
let BOSS_TREASURE_COINS = {...DEFAULT_BOSS_TREASURE_COINS};

// 依 BOSS_EVENT_TYPES 的 weight 權重抽一張事件卡。
function pickBossEvent(){
  const totalWeight = BOSS_EVENT_TYPES.reduce((sum, e) => sum + e.weight, 0);
  let roll = Math.random() * totalWeight;
  let picked = BOSS_EVENT_TYPES[BOSS_EVENT_TYPES.length - 1];
  for(const e of BOSS_EVENT_TYPES){
    if(roll < e.weight){ picked = e; break; }
    roll -= e.weight;
  }
  return picked;
}
// 換階/換輪時呼叫：以 BOSS_EVENT_TRIGGER_CHANCE 機率決定是否觸發事件卡，
// 直接就地修改傳入的 newBoss（清掉舊事件、寫入新的 activeEvent 或套用詛咒血量）。
// 回傳值給呼叫端（resolveBossAttack → performBossAttack）用來顯示訊息/發放寶箱與詛咒補償；
// buff/debuff 卡不需要額外發獎，回傳 {id, kind} 純粹供顯示用。
function maybeTriggerBossEvent(newBoss){
  newBoss.activeEvent = null; // 進新階段一律先清掉上一階殘留的事件效果，同時間只會有一張事件卡生效
  if(Math.random() >= BOSS_EVENT_TRIGGER_CHANCE) return null;
  const ev = pickBossEvent();
  if(ev.kind === 'buff' || ev.kind === 'debuff'){
    newBoss.activeEvent = {id: ev.id, hitsLeft: ev.hits, value: ev.value || 0};
    return {id: ev.id, kind: ev.kind};
  }
  if(ev.id === 'treasure'){
    const coins = Math.round(BOSS_TREASURE_COINS.min + Math.random() * (BOSS_TREASURE_COINS.max - BOSS_TREASURE_COINS.min));
    return {id: ev.id, kind: ev.kind, coins};
  }
  if(ev.id === 'curse'){
    const bonusHp = Math.round(newBoss.maxHp * (ev.value || 0.20));
    newBoss.maxHp += bonusHp;
    newBoss.hp += bonusHp;
    const coins = Math.round((BOSS_TREASURE_COINS.min + BOSS_TREASURE_COINS.max) / 4); // 詛咒補償：約寶箱金幣量的一半
    return {id: ev.id, kind: ev.kind, coins, bonusHp};
  }
  return null;
}

async function loadBossRoguelikeConfig(){
  try{
    const r = await storage.get(seasonKey('boss_roguelike_settings'));
    if(r){
      const s = JSON.parse(r.value);
      if(typeof s.comboStreakBonusPerHit === 'number' && s.comboStreakBonusPerHit >= 0) BOSS_COMBO_STREAK_BONUS_PER_HIT = s.comboStreakBonusPerHit;
      if(typeof s.comboStreakCap === 'number' && s.comboStreakCap >= 0) BOSS_COMBO_STREAK_CAP = s.comboStreakCap;
      if(typeof s.minionSpawnChance === 'number' && s.minionSpawnChance >= 0 && s.minionSpawnChance <= 1) BOSS_MINION_SPAWN_CHANCE = s.minionSpawnChance;
      if(typeof s.eventTriggerChance === 'number' && s.eventTriggerChance >= 0 && s.eventTriggerChance <= 1) BOSS_EVENT_TRIGGER_CHANCE = s.eventTriggerChance;
      if(s.treasureCoins) BOSS_TREASURE_COINS = s.treasureCoins;
    }
  }catch(e){ /* keep defaults */ }
}
async function saveBossRoguelikeConfig(){
  await storage.set(seasonKey('boss_roguelike_settings'), JSON.stringify({
    comboStreakBonusPerHit: BOSS_COMBO_STREAK_BONUS_PER_HIT,
    comboStreakCap: BOSS_COMBO_STREAK_CAP,
    minionSpawnChance: BOSS_MINION_SPAWN_CHANCE,
    eventTriggerChance: BOSS_EVENT_TRIGGER_CHANCE,
    treasureCoins: BOSS_TREASURE_COINS,
  }));
}

function bossStageMaxHp(stage, cycle){
  const base = BOSS_STAGE_HP[stage-1] || BOSS_STAGE_HP[0];
  return Math.round(base * Math.pow(BOSS_DIFFICULTY_MULT, cycle-1));
}
// 獎勵倍率：與血量難度倍率各自獨立，可設不同數字。同樣以「第1輪=基準值」往上疊。
function bossRewardMult(cycle){
  return Math.pow(BOSS_REWARD_MULT, cycle-1);
}
function bossCurrentBaseReward(cycle){
  const m = bossRewardMult(cycle);
  return {
    coins: Math.round(BOSS_BASE_REWARD.coins * m),
  };
}
function bossCurrentBonusPool(cycle){
  const m = bossRewardMult(cycle);
  return {
    coins: Math.round(BOSS_BONUS_POOL.coins * m),
  };
}
// ---------- 單人 Boss 進度：每位玩家一份獨立存檔 ----------
// 每人一把 key，天然沒有跨玩家的讀-改-寫競態，也不會有「別人的網路抖動
// 害我進度歸零」的問題（那是舊版全服共用一份 boss:state 才會發生的坑）。
function bossSoloKey(nickname){
  return `boss:solo:${CURRENT_SEASON_ID}:${nickname}`;
}
// 「今天」的日期字串（當地時間，YYYY-MM-DD），用來判斷是否跨過每日
// 00:00 重置點。用本地時間而非 UTC，這樣重置時間點才會符合玩家直覺的午夜。
function bossTodayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function bossFreshState(){
  return {
    seasonId: CURRENT_SEASON_ID,
    resetDate: bossTodayStr(),
    cycle: 1,
    stage: 1,
    hp: bossStageMaxHp(1,1),
    maxHp: bossStageMaxHp(1,1),
    cycleDamage: 0, // 本輪（尚未破台的這個 cycle）累積造成的傷害，僅供顯示用
    comboStreak: 0, // 🔥 資料骨架：連續組合命中次數，每日隨進度重置一起歸零（尚未接上攻擊流程）
    minion: null,   // 👹 目前存活的小怪：{typeId, hp, maxHp}，已接上 resolveBossAttack 的攻擊流程
    activeEvent: null, // ✨ 目前生效中的隨機事件：{id, hitsLeft, value}，換階/換輪時可能重抽（見 maybeTriggerBossEvent）
  };
}
// 注意：這裡不再吞掉讀取失敗（網路抖動、API 錯誤等）。storage.get() 本身在
// 請求失敗時會 throw；過去全服共用版本曾經把任何失敗都當成「查無資料」
// 回傳 null，導致誤判成「還沒有 Boss」而覆蓋寫入，把進度整個抹掉。這裡
// 讀取失敗會直接往上拋出，由呼叫端決定重試或提示玩家稍後再試。
async function loadPlayerBossStateRaw(nickname){
  // CAS 比對改用 updated_at 短戳記，而不是整包 value 塞進網址（見 savePlayerBossStateCAS
  // 註解），所以這裡額外多 select updated_at 供比對用。
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(bossSoloKey(nickname))}&select=value,updated_at`,
    { headers: SB_HEADERS }
  );
  if(!res.ok) throw new Error('storage get failed: ' + res.status);
  const rows = await res.json();
  if(!rows || rows.length === 0) return {state: null, raw: null, updatedAt: null};
  return {state: JSON.parse(rows[0].value), raw: rows[0].value, updatedAt: rows[0].updated_at || null};
}
async function savePlayerBossState(nickname, s){
  await storage.set(bossSoloKey(nickname), JSON.stringify(s));
}
// 只有在資料庫現存 updated_at 仍等於 prevUpdatedAt 時才寫入 newState（Compare-And-Swap）。
// 單人模式下同一位玩家理論上不會有「別人」跟自己搶同一把 key，但玩家本人
// 短時間內連點兩次攻擊（一般爆發／超爆發）時，兩個請求還是可能交錯，一樣
// 需要 CAS 才不會互相覆蓋。
// 【2026-08 修正】原本比對條件是 value=eq.<整包舊 JSON>，等於每次寫入都要把整份狀態
// 塞進網址查詢參數；一旦狀態變大（例如骰子系統上線後 player 資料膨脹，這裡雖然存的是
// boss 狀態不含骰子，但同一顆 kv_store 表、同一套寫法用在 player 上就直接爆掉，見
// savePlayerCAS），網址長度可能超過伺服器/CDN 上限，導致每次寫入都失敗且重試無效。
// 改成比對 updated_at（一個很短的時間戳記），網址長度固定，不會再因為資料變大而壞掉。
async function savePlayerBossStateCAS(nickname, prevUpdatedAt, newState){
  const filter = prevUpdatedAt
    ? `updated_at=eq.${encodeURIComponent(prevUpdatedAt)}`
    : `updated_at=is.null`; // 舊資料/從未寫過 updated_at 的極少數情況 fallback
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(bossSoloKey(nickname))}&${filter}`,
    {
      method: 'PATCH',
      headers: {
        ...SB_HEADERS,
        'Content-Type': 'application/json',
        Prefer: 'return=representation',
      },
      body: JSON.stringify({ value: JSON.stringify(newState), updated_at: new Date().toISOString() }),
    }
  );
  if(!res.ok) throw new Error('storage CAS update failed: ' + res.status);
  const rows = await res.json();
  return Array.isArray(rows) && rows.length > 0;
}
// 確保這位玩家的 Boss 進度存在且是「今天」的（跨天、跨賽季都視為需要重置）。
// 資料庫已有一筆但需要覆蓋（換季／跨天／損毀資料）時用 CAS 覆蓋，沒搶到
// 就重讀最新狀態再試；資料庫完全沒有這筆（第一次挑戰）才直接寫入，沒有
// 「蓋掉別人進度」的風險（本來就是自己的 key）。
async function ensureBossState(nickname, attempt){
  attempt = attempt || 0;
  if(attempt >= 8) throw new Error('ensureBossState contention exceeded retries');
  const {state: s, raw, updatedAt} = await loadPlayerBossStateRaw(nickname);
  const needsReset = !s || s.seasonId !== CURRENT_SEASON_ID || s.resetDate !== bossTodayStr();
  if(needsReset){
    const fresh = bossFreshState();
    if(raw){
      const applied = await savePlayerBossStateCAS(nickname, updatedAt, fresh);
      if(applied) return fresh;
      return ensureBossState(nickname, attempt + 1);
    }
    await savePlayerBossState(nickname, fresh);
    return fresh;
  }
  return s;
}
// 階段四：攻擊邏輯改寫 —— 用玩家裝備的 3 顆骰子取代原本的武器/飾品加成。
// 武器/飾品加成（BOSS_WEAPON_DMG_BONUS 等）不再影響 Boss 戰，改為只在遠征生效；
// 這裡刻意不去讀 professionItems，Boss 戰的傷害完全由骰子決定。
// 注意：這裡呼叫的骰子相關 function（ensureDiceInventory / DICE_FACE_MULT 等）
// 在檔案稍後才定義，但因為都是 function 宣告會被提升（hoisted），提前呼叫沒有問題。
function rollDiceAttack(p, activeEvent){
  ensureDiceInventory(p);
  const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
  const rolls = equippedIds.map(id => {
    const dice = p.dice[id];
    const faceIdx = Math.floor(Math.random() * 6);
    const face = dice.faces[faceIdx];
    const mult = DICE_FACE_MULT[face.num] || 1;
    return {diceId: id, quality: dice.quality, face, damage: dice.baseAttack * mult};
  });
  let totalDamage = rolls.reduce((sum, r) => sum + r.damage, 0);
  // 面效果：3 顆骰子若同時開出多個帶效果的面，同時生效、疊加套用，影響整次攻擊的總傷害
  let atkBonus = 0, critRateBonus = 0, critDmgBonus = 0, flatDmgBonus = 0, comboBoostBonus = 0, contribBonusPct = 0, coinRefundChance = 0;
  rolls.forEach(r => {
    const eff = r.face.effect;
    if(!eff) return;
    if(eff.kind === 'atk') atkBonus += eff.value;
    else if(eff.kind === 'crit_rate') critRateBonus += eff.value;
    else if(eff.kind === 'crit_dmg') critDmgBonus += eff.value;
    else if(eff.kind === 'flat_dmg') flatDmgBonus += eff.value;
    else if(eff.kind === 'contrib_bonus') contribBonusPct += eff.value;
    else if(eff.kind === 'coin_refund') coinRefundChance += eff.value;
    else if(eff.kind === 'combo_boost') comboBoostBonus += eff.value;
    // 'wild' 沒有數值型加成，只影響下面 computeNumberCombo 的對子/豹子判定
  });
  totalDamage += flatDmgBonus; // 固定傷害先加進基數，之後才吃百分比加成，這樣才「划算」
  if(atkBonus > 0) totalDamage *= (1 + atkBonus);
  let isCrit = critRateBonus > 0 && Math.random() < critRateBonus;
  if(isCrit) totalDamage *= (1 + critDmgBonus);
  // 組合加成：改為分級——2 顆骰子開出同號碼（對子）與 3 顆骰子開出同號碼（豹子）
  // 給不同倍率，只取最大重複次數對應的最高一階（不會疊加），只要裝備 ≥2 顆骰子
  // 就有機會觸發，不再要求一定要裝滿 3 顆才算數。萬能面（wild）視為與任何數字相同。
  const combo = computeNumberCombo(rolls);
  if(combo.mult > 1) totalDamage *= (combo.mult + comboBoostBonus);
  // 金幣返還：多個效果面疊加時直接加總機率，但設上限避免疊到接近「打怪不用錢」。
  coinRefundChance = Math.min(coinRefundChance, 0.8);
  const coinRefunded = coinRefundChance > 0 && Math.random() < coinRefundChance;
  // ✨ 隨機事件效果：套用在最終傷害上（祝福/風暴為加成、迷霧為減損），並標記
  // 這次攻擊是否吃到事件效果，供 UI/訊息顯示；實際的 hitsLeft 遞減交給
  // resolveBossAttack 在 CAS 迴圈內處理（見該函式開頭），這裡只負責算傷害。
  let eventApplied = null;
  if(activeEvent){
    if(activeEvent.id === 'blessing'){
      totalDamage *= (1 + (activeEvent.value||0.30));
      isCrit = true;
      eventApplied = {id:'blessing'};
    } else if(activeEvent.id === 'storm'){
      totalDamage *= (1 + (activeEvent.value||0.25));
      eventApplied = {id:'storm'};
    } else if(activeEvent.id === 'fog'){
      totalDamage *= Math.max(0, 1 - (activeEvent.value||0.30));
      eventApplied = {id:'fog'};
    }
  }
  return {
    damage: Math.max(1, Math.round(totalDamage)),
    rolls, atkBonus, critRateBonus, critDmgBonus, isCrit,
    flatDmgBonus, comboBoostBonus, contribBonusPct, coinRefunded,
    comboTier: combo.tier, sameNumber: combo.tier === 'triple', // sameNumber 保留給舊程式相容，等同「豹子」
    eventApplied,
  };
}

// 計算「N 顆骰子開出相同數字」的組合加成：只看最大重複次數，2 顆同號=對子、
// 3 顆同號=豹子；只裝備 1 顆（或 0 顆）骰子時沒有比較基準，不會觸發。
// 萬能面（wild 效果）不看自己的數字，直接算進目前最大的那一組，等同「百搭」。
function computeNumberCombo(rolls){
  if(rolls.length < 2) return {tier:null, mult:1};
  let wildCount = 0;
  const counts = {};
  rolls.forEach(r => {
    if(r.face.effect && r.face.effect.kind === 'wild'){ wildCount++; return; }
    counts[r.face.num] = (counts[r.face.num]||0) + 1;
  });
  const values = Object.values(counts);
  let maxCount = (values.length ? Math.max(...values) : 0) + wildCount;
  maxCount = Math.min(maxCount, rolls.length);
  if(maxCount >= 3) return {tier:'triple', mult: DICE_COMBO_MULT.triple};
  if(maxCount === 2) return {tier:'pair', mult: DICE_COMBO_MULT.pair};
  return {tier:null, mult:1};
}

// 核心：用樂觀鎖 (CAS) 處理單次攻擊對「自己這份」boss 狀態的讀-改-寫。
// 每次重試都會重新讀取「當下最新」的自己 boss 狀態並在其基礎上扣血/判斷
// 破關，只有寫入當下狀態仍等於自己讀到的那份時才會成功；沒搶到（例如手滑
// 短時間內連點一般爆發+超爆發交錯送出）會立刻重讀最新狀態、在最新進度上
// 重新計算後再試一次，而不是直接拿舊快照覆蓋，因此不會發生進度倒退。
// 👹 小怪：若目前有存活小怪，這次攻擊的傷害優先打在小怪身上；打不死則剩餘
// （溢出）傷害才繼續打 Boss。小怪被打死後，沒有存活小怪時才有機會刷出新的
// 一隻（不會同時存在 2 隻）。實際的金幣獎勵留給呼叫端用 minionResult
// 另外走 updatePlayerCAS 發放，這裡只負責 boss/小怪血量本身的讀-改-寫。
async function resolveBossAttack(nickname, damage){
  for(let attempt = 0; attempt < 8; attempt++){
    const {state: boss, raw, updatedAt} = await loadPlayerBossStateRaw(nickname);
    if(!boss || !raw){
      await ensureBossState(nickname);
      continue;
    }
    if(boss.hp <= 0) continue; // 理論上不會出現（結算與重置在同一次寫入內完成），保底重試
    const newBoss = {...boss};
    // ✨ 這次攻擊若吃到持續生效型事件（祝福/風暴/迷霧），消耗 1 次；歸零後自動清除。
    // 傷害本身已經在呼叫端 rollDiceAttack 算好套用了，這裡只負責更新剩餘次數。
    if(newBoss.activeEvent){
      const ae = {...newBoss.activeEvent, hitsLeft: newBoss.activeEvent.hitsLeft - 1};
      newBoss.activeEvent = ae.hitsLeft > 0 ? ae : null;
    }
    let bossDamage = damage;
    let minionResult = null; // 給呼叫端顯示訊息/發獎用：{typeId, killed, hp, maxHp}
    if(newBoss.minion){
      const minion = {...newBoss.minion};
      const minionDamage = Math.min(bossDamage, minion.hp);
      minion.hp -= minionDamage;
      bossDamage -= minionDamage; // 只有打死小怪後還剩的傷害，才會繼續打 Boss
      if(minion.hp <= 0){
        minionResult = {typeId: minion.typeId, killed: true};
        newBoss.minion = null;
      } else {
        minionResult = {typeId: minion.typeId, killed: false, hp: minion.hp, maxHp: minion.maxHp};
        newBoss.minion = minion;
      }
    }
    let minionSpawned = null;
    if(!newBoss.minion && Math.random() < BOSS_MINION_SPAWN_CHANCE){
      minionSpawned = spawnBossMinion();
      newBoss.minion = minionSpawned;
    }
    newBoss.hp = Math.max(0, boss.hp - bossDamage);
    newBoss.cycleDamage = (boss.cycleDamage||0) + bossDamage;
    let cycleCompleteFor = null;
    let eventTriggered = null; // ✨ 這次攻擊若打進了新階段/新一輪，這裡記錄新抽到的事件卡（供顯示/發獎用）
    if(newBoss.hp <= 0){
      if(newBoss.stage < 3){
        newBoss.stage += 1;
        newBoss.maxHp = bossStageMaxHp(newBoss.stage, newBoss.cycle);
        newBoss.hp = newBoss.maxHp;
        eventTriggered = maybeTriggerBossEvent(newBoss); // 詛咒會就地調整剛設好的 maxHp/hp
      } else {
        cycleCompleteFor = newBoss.cycle;
        const nextCycle = newBoss.cycle + 1;
        newBoss.cycle = nextCycle;
        newBoss.stage = 1;
        newBoss.maxHp = bossStageMaxHp(1, nextCycle);
        newBoss.hp = newBoss.maxHp;
        newBoss.cycleDamage = 0; // 進入下一輪，本輪傷害歸零重算
        eventTriggered = maybeTriggerBossEvent(newBoss);
      }
    }
    const applied = await savePlayerBossStateCAS(nickname, updatedAt, newBoss);
    if(applied) return {prevBoss: boss, newBoss, cycleCompleteFor, minionResult, minionSpawned, eventTriggered};
    // 沒搶到：這段期間已經有另一次攻擊先寫入了，回到迴圈開頭重讀最新狀態再試
  }
  throw new Error('boss state contention exceeded retries');
}

// 小怪被擊殺時發放獎勵：跟 Boss 破台獎勵一樣走 CAS 安全寫入玩家資料，避免跟
// 同時間其他資料寫入（例如剛好在買賣、拆解骰子）互相蓋掉。獎勵金額每次擊殺
// 現場隨機（在該小怪種類的區間內），不放進 resolveBossAttack 的 CAS 迴圈裡，
// 這樣即使 boss 狀態那邊重試好幾輪，獎勵也只會真的計算、發放一次。
async function grantBossMinionReward(nickname, minionTypeId){
  const meta = BOSS_MINION_TYPES.find(m => m.id === minionTypeId) || BOSS_MINION_TYPES[0];
  const rewardCoins = Math.round(meta.rewardCoinsMin + Math.random() * (meta.rewardCoinsMax - meta.rewardCoinsMin));
  const applied = await updatePlayerCAS(nickname, (player)=>{
    ensureMaterials(player);
    player.coins = (player.coins||0) + rewardCoins;
  });
  if(!applied) return null; // 玩家不存在（理論上不會發生，保底）
  return {coins: rewardCoins};
}

// ✨ 隨機事件（寶箱／詛咒）獎勵發放：金額已經在 maybeTriggerBossEvent 觸發當下
// 算好並存在 eventTriggered.coins 裡（跟著那次成功寫入的 boss 狀態一起
// 決定，不會因為 resolveBossAttack 重試而重複算錢），這裡只是照抄那個數字用
// CAS 安全地加進玩家資料，寫法跟 grantBossMinionReward 一致。
async function grantBossEventReward(nickname, eventTriggered){
  const rewardCoins = eventTriggered.coins || 0;
  if(rewardCoins <= 0) return {coins:0};
  const applied = await updatePlayerCAS(nickname, (player)=>{
    ensureMaterials(player);
    player.coins = (player.coins||0) + rewardCoins;
  });
  if(!applied) return null; // 玩家不存在（理論上不會發生，保底）
  return {coins: rewardCoins};
}

// 單人模式破台獎勵：不用再等全服結算、不跟別人分獎池，直接全額發給自己
// （這在數學上等同舊版「依貢獻比例分配」公式中只有自己一位玩家的極限情況：
// share = 自己的點數 / 自己的點數 = 100%）。
async function settleBossReward(nickname, cycle){
  const baseReward = bossCurrentBaseReward(cycle);
  const bonusPool = bossCurrentBonusPool(cycle);
  const rewardCoins = baseReward.coins + bonusPool.coins;
  // 用 CAS 安全地把獎勵加上去：即使玩家這一刻剛好也在收成、買賣而觸發別的
  // 存檔動作，這裡的重試機制都會在「當下最新」的資料上重新加總，不會被
  // 互相蓋掉。
  const applied = await updatePlayerCAS(nickname, (player)=>{
    player.coins = (player.coins||0) + rewardCoins;
  });
  if(!applied) return null; // 玩家不存在（理論上不會發生，保底）
  // 只有在確定獎勵真的寫進玩家資料後才發通知，避免「恭喜獲得獎勵」的通知
  // 先到，但錢包/背包其實沒真的加到的情況。
  await createNotification(nickname, 'system', 'boss_reward', {coins: rewardCoins});
  return {coins: rewardCoins};
}

// 階段五：擲骰動畫。真正的骰子結果（burst）在動畫開始前就已經算好（rollDiceAttack
// 是純運算、無副作用），動畫只是「開獎」式地把已經決定好的數字揭曉出來，
// 不會出現動畫播完後結果又變的情況。用 #dice-roll-anim 容器直接操作 DOM，
// 全程不呼叫 renderTab()，避免整個 Boss 面板重繪把動畫打斷。
function playDiceRollAnimation(diceObjs, burst){
  const stage = document.getElementById('dice-roll-anim');
  const btn = document.getElementById('boss-burst-btn');
  if(!stage || diceObjs.length === 0){
    return Promise.resolve(); // 沒有動畫容器（理論上不會發生）或沒裝備骰子時直接跳過
  }
  return new Promise(resolve=>{
    if(btn){ btn.disabled = true; btn.style.display = 'none'; }
    stage.style.display = 'flex';
    stage.innerHTML = diceObjs.map((d, i)=>{
      const meta = DICE_QUALITY_META[d.quality];
      return `<div class="dice-roll-die" id="dice-roll-die-${i}" style="border-color:${meta.color};color:${meta.color};animation-delay:${i*40}ms;">?</div>`;
    }).join('');
    const dieEls = diceObjs.map((_,i)=>document.getElementById(`dice-roll-die-${i}`));
    const spin = setInterval(()=>{
      dieEls.forEach(el=>{ if(el) el.textContent = String(1 + Math.floor(Math.random()*6)); });
    }, 80);
    setTimeout(()=>{
      clearInterval(spin);
      burst.rolls.forEach((r, i)=>{
        const el = dieEls[i];
        if(!el) return;
        el.style.animation = 'none';
        void el.offsetWidth; // 強制重新觸發 settle 動畫（重設 animation 需要先讓瀏覽器讀到 'none'）
        el.classList.add('settled');
        el.textContent = String(r.face.num);
        if(r.face.effect) el.classList.add('has-effect');
        // 對子/豹子開出時，讓每顆骰子跟著脈動發光，呼應暴擊般的視覺衝擊
        if(burst.comboTier === 'triple') el.classList.add('combo-glow-triple');
        else if(burst.comboTier === 'pair') el.classList.add('combo-glow-pair');
      });
      if(burst.comboTier === 'triple' || burst.comboTier === 'pair'){
        const flash = document.createElement('div');
        flash.className = `dice-roll-flash ${burst.comboTier}`;
        stage.insertBefore(flash, stage.firstChild);
      }
      const badges = [];
      if(burst.comboTier === 'triple') badges.push(`<span class="dice-roll-badge triple">${tt('🎯 豹子 ×2！','🎯 Triple ×2!')}</span>`);
      else if(burst.comboTier === 'pair') badges.push(`<span class="dice-roll-badge pair">${tt(`✌️ 對子 ×${DICE_COMBO_MULT.pair}！`, `✌️ Pair ×${DICE_COMBO_MULT.pair}!`)}</span>`);
      if(burst.isCrit) badges.push(`<span class="dice-roll-badge crit">${tt('💥 暴擊！','💥 Critical!')}</span>`);
      if(badges.length){
        const wrap = document.createElement('div');
        wrap.className = 'dice-roll-badges';
        wrap.style.position = 'relative';
        wrap.style.zIndex = '1';
        wrap.innerHTML = badges.join('');
        stage.appendChild(wrap);
      }
      setTimeout(()=>{
        stage.style.display = 'none';
        stage.innerHTML = '';
        if(btn){ btn.style.display = ''; }
        resolve();
      }, badges.length ? 750 : 450);
    }, 900);
  });
}

// 攻擊流程：擲 3 顆骰子取代原本的「一般爆發／超爆發」雙按鈕設計。
// 攻擊消耗金幣：預設固定扣 BOSS_COIN_COST，但骰子若開出「金幣返還」效果面，
// 這次攻擊有機率不扣（見 burst.coinRefunded）；CAS 重試、貢獻結算、
// 破關發獎、UI 訊息與階段二/三完全共用。
async function performBossAttack(){
  const p = state.player;
  ensureMaterials(p);
  ensureDiceInventory(p);
  const equippedIds = p.diceSlots.filter(id => id && p.dice[id]);
  if(equippedIds.length === 0){
    showToast(tt('請先到「骰子」分頁裝備至少 1 顆骰子', 'Equip at least 1 die in the Dice tab first'));
    return;
  }
  if(BOSS_DAILY_ATTACK_LIMIT > 0 && ensureBossAttackCount(p) >= BOSS_DAILY_ATTACK_LIMIT){
    showToast(tt(`今日攻擊次數已用完（${BOSS_DAILY_ATTACK_LIMIT} 次），請明天再來`, `You've used all your attacks today (${BOSS_DAILY_ATTACK_LIMIT}) - come back tomorrow`));
    return;
  }
  const cost = BOSS_COIN_COST;
  if(p.coins < cost){
    showToast(tt(`金幣不足，需要 ${cost}`, `Not enough coins, need ${cost}`));
    return;
  }
  // ✨ 先確保/讀取今日 Boss 狀態，才知道目前是否有生效中的隨機事件（祝福/風暴/迷霧）
  // 要套用到這次攻擊上；接著才算出這次攻擊的真實結果（純運算，無副作用），
  // 動畫只負責把它「揭曉」出來。
  const currentBoss = await ensureBossState(p.nickname);
  const burst = rollDiceAttack(p, currentBoss.activeEvent);
  await playDiceRollAnimation(equippedIds.map(id => p.dice[id]), burst);

  if(!burst.coinRefunded){
    p.coins -= cost; // 觸發「金幣返還」效果時這次攻擊不扣金幣
  }
  const contribGain = Math.round(burst.damage * BOSS_CONTRIB_RATE * (1 + (burst.contribBonusPct||0)) * starChartContribMultiplier(p)); // 貢獻點依「實際造成的傷害」計算，骰子加成的傷害、貢獻點加成面效果與星盤風象加成都會反映在這裡
  p.materials.contrib += contribGain; // 賽季總貢獻點（可花費，賽季結束才歸零）
  ensureStats(p).totalBossDamage += burst.damage; // 累計對 Boss 造成的總傷害（永久累計，用於排行榜／稱號，不隨賽季重置）
  ensureBossAttackCount(p);
  p.bossAttackCount += 1; // 今日已攻擊次數（依 BOSS_DAILY_ATTACK_LIMIT 換日歸零）
  await savePlayer(p);

  let result;
  try{
    result = await resolveBossAttack(p.nickname, burst.damage);
  }catch(e){
    showToast(tt('Boss 狀態忙碌中，請稍後再試','Boss state is busy, try again shortly'));
    renderTab();
    updateHeaderCoins();
    return;
  }
  const { prevBoss, newBoss, cycleCompleteFor, minionResult, minionSpawned, eventTriggered } = result;

  // 👹 小怪擊殺獎勵：獨立於 Boss 破台獎勵，用自己的 CAS 更新玩家資料，不影響
  // 上面已經寫入的 state.player（擊殺當下先算好，稍後跟 Boss 破台一樣重讀玩家最新資料）。
  let minionReward = null;
  if(minionResult && minionResult.killed){
    minionReward = await grantBossMinionReward(p.nickname, minionResult.typeId);
    state.player = await loadPlayer(p.nickname);
  }

  // ✨ 事件卡（寶箱／詛咒）獎勵：跟小怪獎勵一樣獨立走 CAS 發放，不影響已寫入的
  // state.player；祝福/風暴/迷霧是 buff/debuff，不會走到這裡發獎，純粹顯示用。
  let eventReward = null;
  if(eventTriggered && (eventTriggered.id === 'treasure' || eventTriggered.id === 'curse')){
    eventReward = await grantBossEventReward(p.nickname, eventTriggered);
    state.player = await loadPlayer(p.nickname);
  }

  let defeatMsg = '';
  if(cycleCompleteFor){
    const reward = await settleBossReward(p.nickname, cycleCompleteFor);
    defeatMsg = tt(`🎉 你擊敗了「終焉蛇神」！獲得 ✦${reward?reward.coins:0} 金幣，Boss 第 ${newBoss.cycle} 輪重新降臨（更難）！`, `🎉 You defeated the Doomsday Serpent God! Gained ✦${reward?reward.coins:0} coins - Cycle ${newBoss.cycle} begins (harder)!`);
    state.player = await loadPlayer(p.nickname);
  } else if(newBoss.stage > prevBoss.stage){
    defeatMsg = tt(`⚔️ 「${BOSS_STAGE_META[newBoss.stage-2].label}」被擊破！Boss 進入「${BOSS_STAGE_META[newBoss.stage-1].label}」！`, `⚔️ "${BOSS_STAGE_META[newBoss.stage-2].labelEn}" defeated! The Boss enters "${BOSS_STAGE_META[newBoss.stage-1].labelEn}"!`);
  }

  state.bossLastAttack = {damage: burst.damage, contrib: contribGain, rolls: burst.rolls, comboTier: burst.comboTier, sameNumber: burst.sameNumber, isCrit: burst.isCrit, eventApplied: burst.eventApplied};
  checkAchievementUnlocks(state.player);
  renderTab();
  updateHeaderCoins();
  // 👹 小怪這次攻擊的結果（打傷/擊殺/新出現），附加在後面一起顯示，不管這次
  // 攻擊本身是不是同時打出了 Boss 階段/輪次的結算訊息都要提到。
  let minionMsgPart = '';
  if(minionResult){
    const meta = BOSS_MINION_TYPES.find(m => m.id === minionResult.typeId) || BOSS_MINION_TYPES[0];
    if(minionResult.killed){
      minionMsgPart += tt(`　💀擊殺了「${meta.labelZh}」！獲得 ✦${minionReward?minionReward.coins:0}`, `　💀Defeated the ${meta.labelEn}! Gained ✦${minionReward?minionReward.coins:0}`);
    } else {
      minionMsgPart += tt(`　🗡️「${meta.labelZh}」剩餘 ${minionResult.hp}/${minionResult.maxHp} HP`, `　🗡️${meta.labelEn} at ${minionResult.hp}/${minionResult.maxHp} HP`);
    }
  }
  if(minionSpawned){
    const spawnMeta = BOSS_MINION_TYPES.find(m => m.id === minionSpawned.typeId) || BOSS_MINION_TYPES[0];
    minionMsgPart += tt(`　👹一隻「${spawnMeta.labelZh}」出現了！`, `　👹A ${spawnMeta.labelEn} appeared!`);
  }
  // ✨ 事件相關訊息：這次攻擊「吃到」了持續生效型事件的加成/減損（eventApplied），
  // 以及這次攻擊「打進新階段」因而重新抽到的事件卡（eventTriggered），兩者互相獨立、
  // 同一次攻擊有可能同時出現（例如：吃到風暴的最後一次加成，同時又打穿階段抽到新事件）。
  let eventMsgPart = '';
  if(burst.eventApplied){
    const meta = BOSS_EVENT_TYPES.find(e => e.id === burst.eventApplied.id);
    if(meta) eventMsgPart += tt(`　${meta.icon}「${meta.labelZh}」生效中！`, `　${meta.icon}${meta.labelEn} in effect!`);
  }
  if(eventTriggered){
    const meta = BOSS_EVENT_TYPES.find(e => e.id === eventTriggered.id);
    if(meta){
      if(eventTriggered.id === 'treasure'){
        eventMsgPart += tt(`　${meta.icon}觸發「${meta.labelZh}」！獲得 ✦${eventReward?eventReward.coins:0}`, `　${meta.icon}${meta.labelEn} triggered! Gained ✦${eventReward?eventReward.coins:0}`);
      } else if(eventTriggered.id === 'curse'){
        eventMsgPart += tt(`　${meta.icon}觸發「${meta.labelZh}」！本階段血量 +20%，補償 ✦${eventReward?eventReward.coins:0}`, `　${meta.icon}${meta.labelEn} triggered! This stage's HP +20%, compensation ✦${eventReward?eventReward.coins:0}`);
      } else {
        eventMsgPart += tt(`　${meta.icon}新階段出現「${meta.labelZh}」：${meta.descZh}`, `　${meta.icon}New stage event: ${meta.descEn}`);
      }
    }
  }
  if(defeatMsg){
    showToast(defeatMsg + minionMsgPart + eventMsgPart);
  } else {
    const diceTag = burst.rolls.map(r => r.face.num).join('·');
    const bonusTags = [];
    if(burst.comboTier === 'triple') bonusTags.push(tt('🎯豹子×2','🎯Triple×2'));
    else if(burst.comboTier === 'pair') bonusTags.push(tt(`✌️對子×${DICE_COMBO_MULT.pair}`, `✌️Pair×${DICE_COMBO_MULT.pair}`));
    if(burst.isCrit) bonusTags.push(tt('💥暴擊','💥Crit'));
    if(burst.coinRefunded) bonusTags.push(tt('♻️金幣未消耗','♻️Coin refunded'));
    const bonusStr = bonusTags.length ? `（${bonusTags.join('、')}）` : '';
    showToast(tt(`🎲 擲出 ${diceTag}，造成 ${burst.damage.toLocaleString()} 傷害！${bonusStr}　貢獻點 +${contribGain}`, `🎲 Rolled ${diceTag}, dealt ${burst.damage.toLocaleString()} damage!${bonusStr}  Contribution +${contribGain}`) + minionMsgPart + eventMsgPart);
  }
}

async function doBossBurst(){
  await performBossAttack();
}

// ---------- 骰子系統（階段三：資料結構 + 商店抽卡）----------
// 這階段只做「擁有骰子」這件事：資料模型、玩家骰子欄位、抽卡機率與消耗。
// 還沒接上真正的攻擊流程（面數字倍率、面效果疊加、相同號碼加成留到階段四），
// 方便先獨立驗證抽卡機率分佈與資料是否正確，不受戰鬥邏輯干擾。

// 抽骰消耗的 3 張特定 epic 卡：沿用現有牌庫的「太陽／月亮／星星」（非新設計卡片）。
// 選這三張是因為主題上跟賽季的星象/星軌意象最搭；若要改成別的 epic 卡，改這個陣列即可。
const DEFAULT_DICE_GACHA_CARD_IDS = ['major_17', 'major_18', 'major_19']; // The Star / The Moon / The Sun
let DICE_GACHA_CARD_IDS = [...DEFAULT_DICE_GACHA_CARD_IDS]; // GM 可在「骰子商店設定」調整成任意 3 張 epic 卡
const DEFAULT_DICE_GACHA_COST_QTY = 1; // 每張消耗數量（固定 3 張不同 epic 卡 = 1 抽，暫定）
let DICE_GACHA_COST_QTY = DEFAULT_DICE_GACHA_COST_QTY;

const DICE_QUALITY_IDS = ['common', 'rare', 'epic'];
// effectFaces：品質對應「有幾面帶效果」。史詩暫定固定 3 面（設計文件寫「3 面或以上」，
// 這裡先取下限，之後若要做成隨機 3~4 面，只要改這裡的 rollDice 邏輯即可）。
const DICE_QUALITY_META = {
  common: {label:'普通', labelEn:'Common', effectFaces:1, color:'var(--common)'},
  rare:   {label:'稀有', labelEn:'Rare',   effectFaces:2, color:'var(--rare)'},
  epic:   {label:'史詩', labelEn:'Epic',   effectFaces:3, color:'var(--legendary-a)'},
};
const DEFAULT_DICE_GACHA_RATES = {common:0.80, rare:0.15, epic:0.05}; // 無保底
let DICE_GACHA_RATES = {...DEFAULT_DICE_GACHA_RATES};

// 骰子基礎攻擊力隨機範圍（暫定數值，待階段四攻擊公式定案時再校準）。
const DEFAULT_DICE_BASE_ATTACK_RANGE = [80, 160];
let DICE_BASE_ATTACK_RANGE = [...DEFAULT_DICE_BASE_ATTACK_RANGE];

const DICE_EQUIP_SLOTS = 3; // 玩家同時裝備 3 顆不同骰子

// 面數字對應傷害倍率（1號=1.1x … 6號=1.6x），供階段四攻擊邏輯使用。
const DICE_FACE_MULT = {1:1.1, 2:1.2, 3:1.3, 4:1.4, 5:1.5, 6:1.6};

// 面效果池：效果綁在「物理面」而非數值，所以同一顆骰子的兩個「3」效果可以不同。
// 抽卡時對每一個被選中的效果面各自獨立抽一次效果（可能抽到同一種效果，這是預期內的）。
// 分三個層級並用 weight 做加權隨機（見 rollFaceEffect），避免擴充效果池後把原本
// 「效果面數量＝強度」的設計稀釋掉——常見效果權重高、容易抽到，稀有效果權重低、
// 抽到時才有「驚喜感」。四個 tier=common 的是原本就有的效果，id 沒變、不影響舊資料。
const DICE_FACE_EFFECT_POOL = [
  // 常見（合計權重 72）
  {id:'atk10',     kind:'atk',           value:0.10, weight:18, tier:'common',   label:'攻擊 +10%',     labelEn:'ATK +10%'},
  {id:'atk5',      kind:'atk',           value:0.05, weight:18, tier:'common',   label:'攻擊 +5%',      labelEn:'ATK +5%'},
  {id:'crit5',     kind:'crit_rate',     value:0.05, weight:18, tier:'common',   label:'暴擊率 +5%',    labelEn:'Crit rate +5%'},
  {id:'critdmg10', kind:'crit_dmg',      value:0.10, weight:18, tier:'common',   label:'暴擊傷害 +10%', labelEn:'Crit damage +10%'},
  // 少見（合計權重 24）：功能跟常見的百分比加成不同，讓效果池更多元
  {id:'flatdmg40', kind:'flat_dmg',      value:40,   weight:8,  tier:'uncommon', label:'固定傷害 +40',  labelEn:'Flat DMG +40', desc:'這次攻擊固定多造成 40 點傷害（會再吃百分比加成）', descEn:'This attack deals 40 extra flat damage before percentage bonuses'},
  {id:'contrib20', kind:'contrib_bonus', value:0.20, weight:8,  tier:'uncommon', label:'貢獻點 +20%',   labelEn:'Contribution +20%', desc:'這次攻擊獲得的貢獻點額外 +20%', descEn:'This attack grants 20% more contribution points'},
  {id:'refund15',  kind:'coin_refund',   value:0.15, weight:8,  tier:'uncommon', label:'金幣返還 15%',  labelEn:'Coin Refund 15%', desc:'15% 機率這次攻擊不消耗金幣', descEn:'15% chance this attack does not consume coins'},
  // 稀有（合計權重 4）：影響機制而非單純加數字，刻意壓低機率
  {id:'wild',      kind:'wild',          value:0,    weight:2,  tier:'rare',     label:'萬能面',        labelEn:'Wild Face', desc:'計算對子/豹子時，這一面視為與任何數字相同', descEn:'Counts as matching any number for Pair/Triple bonuses'},
  {id:'comboboost15', kind:'combo_boost', value:0.15, weight:2, tier:'rare',     label:'組合加成 +15%', labelEn:'Combo Bonus +15%', desc:'觸發對子/豹子時，倍率額外 +15%（沒觸發組合則無效果）', descEn:'When Pair/Triple triggers, adds +15% to its multiplier (no effect otherwise)'},
];

// 組合加成：原本「三顆骰子開出同號才 ×2」改成分級——2 顆同號（對子）與 3 顆同號（豹子）
// 給不同倍率，只要裝備 ≥2 顆骰子就有機會觸發，不再要求一定要裝滿 3 顆。
const DEFAULT_DICE_COMBO_MULT = {pair:1.3, triple:2.0};
let DICE_COMBO_MULT = {...DEFAULT_DICE_COMBO_MULT};

// ---------- 骰子強化系統 ----------
// 玩家可花費「骰子精華」提升已擁有骰子的基礎攻擊力，每滿一定等級數會嘗試把一面
// 還沒有效果的面轉換成帶效果的面（等於變相增加觸發機率）；精華主要來源是拆解
// 用不到的骰子（DICE_DISMANTLE_REFUND），形成「抽到重複/低階骰子 → 拆解 → 強化主力骰子」的循環。
const DICE_ENHANCE_MAX_LEVEL = 10;
const DEFAULT_DICE_ENHANCE_ATK_PER_LEVEL = {common:6, rare:10, epic:16}; // 每級增加的基礎攻擊力（依品質）
let DICE_ENHANCE_ATK_PER_LEVEL = {...DEFAULT_DICE_ENHANCE_ATK_PER_LEVEL};
const DEFAULT_DICE_ENHANCE_BASE_COST = {common:8, rare:14, epic:22}; // 精華消耗 = 品質基礎值 × 目標等級
let DICE_ENHANCE_BASE_COST = {...DEFAULT_DICE_ENHANCE_BASE_COST};
const DICE_ENHANCE_EFFECT_FACE_INTERVAL = 3; // 每滿 3 級嘗試新增一面效果面（若六面都已有效果，改發基礎攻擊力）
const DEFAULT_DICE_DISMANTLE_REFUND = {common:5, rare:15, epic:40}; // 拆解骰子返還的精華基準值（依品質）
let DICE_DISMANTLE_REFUND = {...DEFAULT_DICE_DISMANTLE_REFUND};

// 計算強化到下一級所需的精華，已達上限回傳 null。
function diceEnhanceCost(dice){
  if(dice.level >= DICE_ENHANCE_MAX_LEVEL) return null;
  const nextLevel = dice.level + 1;
  return Math.round((DICE_ENHANCE_BASE_COST[dice.quality]||8) * nextLevel);
}
// 拆解可回收的精華：品質基礎值，另外把該骰子已投入強化的部份精華以五折折算返還，
// 避免「強化到很高等級再拆解」變成無腦刷精華的漏洞，但仍保留部分回收誘因。
function diceDismantleRefund(dice){
  const base = DICE_DISMANTLE_REFUND[dice.quality] || 5;
  let invested = 0;
  for(let lvl=1; lvl<dice.level; lvl++){
    invested += Math.round((DICE_ENHANCE_BASE_COST[dice.quality]||8) * (lvl+1));
  }
  return base + Math.round(invested * 0.5);
}

async function loadDiceConfig(){
  try{
    const r = await storage.get(seasonKey('dice_settings'));
    if(r){
      const s = JSON.parse(r.value);
      if(s.gachaRates && typeof s.gachaRates.common === 'number') DICE_GACHA_RATES = s.gachaRates;
      if(Array.isArray(s.baseAttackRange) && s.baseAttackRange.length === 2) DICE_BASE_ATTACK_RANGE = s.baseAttackRange;
      if(Array.isArray(s.gachaCardIds) && s.gachaCardIds.length === 3 && s.gachaCardIds.every(id=>typeof id === 'string' && id)) DICE_GACHA_CARD_IDS = s.gachaCardIds;
      if(typeof s.gachaCostQty === 'number' && s.gachaCostQty > 0) DICE_GACHA_COST_QTY = s.gachaCostQty;
    }
  }catch(e){ /* keep defaults */ }
}
async function saveDiceConfig(){
  await storage.set(seasonKey('dice_settings'), JSON.stringify({
    gachaRates: DICE_GACHA_RATES, baseAttackRange: DICE_BASE_ATTACK_RANGE,
    gachaCardIds: DICE_GACHA_CARD_IDS, gachaCostQty: DICE_GACHA_COST_QTY,
  }));
}

// 骰子面效果：記憶體中一律用「完整物件」（DICE_FACE_EFFECT_POOL 裡的那個參照，含中英文
// label/desc），存檔到伺服器時才精簡成只存 id（見 serializePlayerForStorage）。這裡是讀取
// 端的還原：不管存進來的是舊格式（完整物件，早期資料）還是新格式（純字串 id），一律用 id
// 去 DICE_FACE_EFFECT_POOL 查表換回同一個標準物件——新舊資料都吃得下，不需要額外的遷移腳本。
function resolveDiceFaceEffect(effectRef){
  if(!effectRef) return null;
  const id = typeof effectRef === 'string' ? effectRef : effectRef.id;
  return DICE_FACE_EFFECT_POOL.find(e => e.id === id) || null;
}
// 確保玩家資料有骰子欄位：p.dice（id -> 骰子物件的字典）與 p.diceSlots（3 個裝備欄）。
// 同時負責把每顆骰子每一面的 effect 從存檔精簡格式還原成完整物件（見 resolveDiceFaceEffect），
// 讓其餘程式碼（戰鬥計算、渲染）都能沿用原本讀 effect.kind / effect.label 的寫法，不用改動。
function ensureDiceInventory(p){
  if(!p.dice || typeof p.dice !== 'object') p.dice = {};
  Object.values(p.dice).forEach(d=>{
    if(typeof d.level !== 'number' || d.level < 1) d.level = 1; // 舊資料補上等級欄位
    if(Array.isArray(d.faces)) d.faces.forEach(f=>{ f.effect = resolveDiceFaceEffect(f.effect); });
  });
  if(!Array.isArray(p.diceSlots) || p.diceSlots.length !== DICE_EQUIP_SLOTS) p.diceSlots = [null, null, null];
  // 清掉裝備欄裡指向不存在骰子的殘留 id（例如舊資料損毀、或被賣掉/拆解後沒清乾淨）
  p.diceSlots = p.diceSlots.map(id => (id && p.dice[id]) ? id : null);
  return p.dice;
}
// 存檔前的序列化：把骰子面的 effect 從完整物件（含中英文說明文字，單面可能上百 bytes）
// 精簡成只存 id（十幾個 bytes）。玩家骰子一多，完整物件會讓存檔 JSON 膨脹到數十 KB，
// 是造成 CAS 網址過長、寫入失敗的主因之一（另一半是 CAS 比對機制本身，見 savePlayerCAS）。
// 還原邏輯見 resolveDiceFaceEffect，讀檔時會自動把 id 換回完整物件，兩邊格式互通。
function serializePlayerForStorage(p){
  if(!p.dice || typeof p.dice !== 'object') return JSON.stringify(p);
  const slimDice = {};
  for(const [id, d] of Object.entries(p.dice)){
    slimDice[id] = {
      ...d,
      faces: Array.isArray(d.faces) ? d.faces.map(f => ({num: f.num, effect: f.effect ? f.effect.id : null})) : d.faces,
    };
  }
  return JSON.stringify({...p, dice: slimDice});
}

function rollDiceQuality(){
  const r = Math.random();
  let acc = 0;
  for(const q of DICE_QUALITY_IDS){
    acc += DICE_GACHA_RATES[q];
    if(r < acc) return q;
  }
  return DICE_QUALITY_IDS[DICE_QUALITY_IDS.length - 1]; // 保底 fallback，理論上機率總和=1不會走到
}

// 骰子面數字：不是固定 1~6，是隨機分配、可重複（例如 2、2、3、3、6、6）。
function rollDiceFaceNumbers(){
  const nums = [];
  for(let i=0;i<6;i++) nums.push(1 + Math.floor(Math.random()*6));
  return nums;
}

// 加權隨機抽一個面效果：權重總和目前是 100（見 DICE_FACE_EFFECT_POOL 各項 weight），
// 常見效果權重高、稀有效果權重低，讓「效果面數量」（品質決定）仍是決定強度的主軸，
// 稀有效果只是錦上添花的驚喜，不會取代常見效果的基本盤。
function rollFaceEffect(){
  const totalWeight = DICE_FACE_EFFECT_POOL.reduce((sum, e)=> sum + (e.weight||1), 0);
  let r = Math.random() * totalWeight;
  for(const eff of DICE_FACE_EFFECT_POOL){
    r -= (eff.weight||1);
    if(r < 0) return eff;
  }
  return DICE_FACE_EFFECT_POOL[DICE_FACE_EFFECT_POOL.length-1]; // 保底 fallback，理論上不會走到
}

// 生成一顆全新骰子：品質決定「有幾面帶效果」，效果面在 6 面裡隨機挑選（不重複挑到同一個面）。
function rollNewDice(quality){
  const meta = DICE_QUALITY_META[quality];
  const nums = rollDiceFaceNumbers();
  const effectFaceCount = Math.min(meta.effectFaces, 6);
  const idxPool = [0,1,2,3,4,5];
  for(let i=idxPool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxPool[i], idxPool[j]] = [idxPool[j], idxPool[i]];
  }
  const effectIdxs = new Set(idxPool.slice(0, effectFaceCount));
  const faces = nums.map((num, i)=>({num, effect: effectIdxs.has(i) ? rollFaceEffect() : null}));
  const [minAtk, maxAtk] = DICE_BASE_ATTACK_RANGE;
  const baseAttack = minAtk + Math.floor(Math.random()*(maxAtk - minAtk + 1));
  return {id: uid(), quality, baseAttack, faces, level: 1, createdAt: new Date().toISOString()};
}

// 抽骰：用 CAS 保護「扣卡 + 產生骰子」這整個讀-改-寫，避免玩家手滑連點兩次
// 抽卡時兩個請求交錯，導致卡片被扣兩次卻只拿到一顆骰子（或反過來多拿骰子）。
async function doDiceGacha(){
  const p = state.player;
  ensureDiceInventory(p);
  const missing = DICE_GACHA_CARD_IDS.some(cardId => (p.cards[cardId]||0) < DICE_GACHA_COST_QTY);
  if(missing){
    showToast(tt('缺少抽骰所需的卡片（太陽、月亮、星星各1張）', 'Missing cards needed for the draw (Sun, Moon, Star x1 each)'));
    return;
  }
  let resultDice = null;
  let applied;
  try{
    applied = await updatePlayerCAS(p.nickname, (player)=>{
      ensureDiceInventory(player);
      for(const cardId of DICE_GACHA_CARD_IDS){
        const owned = player.cards[cardId] || 0;
        if(owned < DICE_GACHA_COST_QTY) throw new Error('dice gacha: insufficient card ' + cardId);
        player.cards[cardId] = owned - DICE_GACHA_COST_QTY;
      }
      const dice = rollNewDice(rollDiceQuality());
      player.dice[dice.id] = dice;
      resultDice = dice;
    });
  }catch(e){
    showToast(tt('卡片不足或資料忙碌中，請重新整理後再試', 'Not enough cards, or data is busy — refresh and try again'));
    return;
  }
  if(!applied || !resultDice) return;
  state.player = await loadPlayer(p.nickname);
  const meta = DICE_QUALITY_META[resultDice.quality];
  showToast(tt(`🎲 獲得一顆「${meta.label}」骰子！`, `🎲 Obtained a ${meta.labelEn} die!`));
  renderTab();
  updateHeaderCoins();
}

// 裝備／卸下骰子：屬於低頻、單人本地操作，用一般 savePlayer 即可，
// 不像抽卡（讀-改-寫）或攻擊那樣需要 CAS。
async function doEquipDice(diceId, slotIndex){
  const p = state.player;
  ensureDiceInventory(p);
  if(!p.dice[diceId] || slotIndex < 0 || slotIndex >= DICE_EQUIP_SLOTS) return;
  p.diceSlots = p.diceSlots.map((id, i) => (i === slotIndex ? diceId : (id === diceId ? null : id)));
  await savePlayer(p);
  renderTab();
}
async function doUnequipDice(slotIndex){
  const p = state.player;
  ensureDiceInventory(p);
  if(slotIndex < 0 || slotIndex >= DICE_EQUIP_SLOTS) return;
  p.diceSlots[slotIndex] = null;
  await savePlayer(p);
  renderTab();
}

// 強化骰子：花「骰子精華」提升基礎攻擊力，每滿 DICE_ENHANCE_EFFECT_FACE_INTERVAL 級
// 額外嘗試把一面「空白面」轉成「效果面」。用 CAS 保護讀-改-寫，避免連點兩次強化
// 只扣一次材料卻升兩級（或反過來扣兩次材料只升一級）。
async function doEnhanceDice(diceId){
  const p = state.player;
  ensureMaterials(p);
  ensureDiceInventory(p);
  const dice = p.dice[diceId];
  if(!dice) return;
  const cost = diceEnhanceCost(dice);
  if(cost === null){ showToast(tt('此骰子已達強化等級上限','This die is already at max enhancement level')); return; }
  if(p.materials.diceEssence < cost){ showToast(tt(`骰子精華不足，需要 ${cost}`, `Not enough Dice Essence, need ${cost}`)); return; }
  let applied;
  let leveledUp = null;
  try{
    applied = await updatePlayerCAS(p.nickname, (player)=>{
      ensureMaterials(player);
      ensureDiceInventory(player);
      const d = player.dice[diceId];
      if(!d) throw new Error('dice not found');
      const c = diceEnhanceCost(d);
      if(c === null) throw new Error('max level');
      if(player.materials.diceEssence < c) throw new Error('insufficient essence');
      player.materials.diceEssence -= c;
      d.level += 1;
      d.baseAttack += (DICE_ENHANCE_ATK_PER_LEVEL[d.quality] || 6);
      let gotNewEffectFace = false;
      if(d.level % DICE_ENHANCE_EFFECT_FACE_INTERVAL === 0){
        const blankIdxs = d.faces.map((f,i)=> f.effect ? null : i).filter(i=> i!==null);
        if(blankIdxs.length > 0){
          const pick = blankIdxs[Math.floor(Math.random()*blankIdxs.length)];
          d.faces[pick] = {...d.faces[pick], effect: rollFaceEffect()};
          gotNewEffectFace = true;
        } else {
          // 六面都已經有效果了，改發額外基礎攻擊力當作獎勵，避免升級變成純浪費
          d.baseAttack += (DICE_ENHANCE_ATK_PER_LEVEL[d.quality] || 6);
        }
      }
      leveledUp = {level: d.level, gotNewEffectFace};
    });
  }catch(e){
    showToast(tt('強化失敗，材料不足或資料忙碌中，請重新整理後再試','Enhancement failed — not enough materials or data busy, refresh and try again'));
    return;
  }
  if(!applied) return;
  state.player = await loadPlayer(p.nickname);
  const msg = leveledUp && leveledUp.gotNewEffectFace
    ? tt(`✨ 骰子強化至 Lv.${leveledUp.level}，並新增一面效果面！`, `✨ Die enhanced to Lv.${leveledUp.level} and gained a new effect face!`)
    : tt(`✨ 骰子強化至 Lv.${leveledUp ? leveledUp.level : '?'}！`, `✨ Die enhanced to Lv.${leveledUp ? leveledUp.level : '?'}!`);
  showToast(msg);
  renderTab();
  updateHeaderCoins();
}

// 拆解骰子：換回骰子精華，讓抽到的重複/低階骰子有去處。裝備中的骰子需先卸下才能拆，
// 避免不小心拆掉正在使用的骰子。
async function doDismantleDice(diceId){
  // 整個函式包一層 try/catch：原本 dice.quality 若因舊資料損毀而缺值，
  // DICE_QUALITY_META[dice.quality].label 會直接丟出 TypeError，
  // 而外層呼叫端只有 try/finally 沒有 catch，導致例外變成「未捕捉的 Promise rejection」，
  // 使用者畫面上完全沒有任何提示（連 confirm 對話框都不會跳出來）——這正是「點擊拆解沒反應」的成因之一。
  // 這裡統一補上 fallback 與錯誤提示，任何未預期例外都會跳 toast + 印 console，不會再靜默失敗。
  try{
    const p = state.player;
    ensureDiceInventory(p);
    const dice = p.dice[diceId];
    if(!dice){
      showToast(tt('找不到這顆骰子，畫面可能未更新，請重新整理','Die not found — try refreshing the page'));
      return;
    }
    if(p.diceSlots.includes(diceId)){
      showToast(tt('請先卸下裝備中的骰子再拆解','Unequip this die before dismantling it'));
      return;
    }
    const meta = DICE_QUALITY_META[dice.quality] || DICE_QUALITY_META.common; // fallback：避免舊資料 quality 缺值時直接炸掉
    const previewRefund = diceDismantleRefund(dice);
    if(!confirm(tt(`確定要拆解這顆${meta.label}骰子嗎？將獲得 ${previewRefund} 骰子精華，此動作無法復原。`, `Dismantle this ${meta.labelEn} die? You'll receive ${previewRefund} Dice Essence. This cannot be undone.`))) return;
    let refund = 0;
    let applied;
    try{
      applied = await updatePlayerCAS(p.nickname, (player)=>{
        ensureMaterials(player);
        ensureDiceInventory(player);
        const d = player.dice[diceId];
        if(!d) throw new Error('dice not found');
        refund = diceDismantleRefund(d);
        player.materials.diceEssence += refund;
        delete player.dice[diceId];
        player.diceSlots = player.diceSlots.map(id => id === diceId ? null : id);
      });
    }catch(e){
      console.error('[doDismantleDice] updatePlayerCAS failed', e);
      showToast(tt('拆解失敗，請重新整理後再試','Dismantle failed, refresh and try again'));
      return;
    }
    if(!applied) return;
    state.player = await loadPlayer(p.nickname);
    showToast(tt(`♻️ 拆解完成，獲得 ${refund} 骰子精華`, `♻️ Dismantled — gained ${refund} Dice Essence`));
    renderTab();
    updateHeaderCoins();
  }catch(e){
    console.error('[doDismantleDice] unexpected error', e);
    showToast(tt('拆解發生未預期的錯誤，請打開瀏覽器 Console 查看詳細訊息','Unexpected error while dismantling — check the browser console for details'));
  }
}

function diceFaceLabel(face){
  if(!face.effect) return `${face.num}`;
  return `${face.num}·${tt(face.effect.label, face.effect.labelEn)}`;
}

function renderDiceCard(dice, opts){
  opts = opts || {};
  const meta = DICE_QUALITY_META[dice.quality];
  const epicGlow = dice.quality === 'epic' ? 'animation:legendary-pulse 2.6s ease-in-out infinite;' : '';
  const facesHtml = dice.faces.map(f=>`<span style="display:inline-block;min-width:26px;padding:3px 5px;margin:2px;border-radius:6px;border:1px solid ${f.effect ? meta.color : 'var(--line)'};font-family:'Space Mono',monospace;font-size:11px;${f.effect ? `color:${meta.color};` : 'color:var(--muted);'}" title="${f.effect ? tt(f.effect.desc||f.effect.label, f.effect.descEn||f.effect.labelEn) : ''}">${diceFaceLabel(f)}</span>`).join('');
  return `<div style="border:1px solid ${meta.color};border-radius:10px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,0.03);${epicGlow}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="display:flex;align-items:center;gap:6px;font-family:'Cinzel',serif;color:${meta.color};font-weight:600;">
        <span style="width:16px;height:16px;border-radius:5px;background:${meta.color};box-shadow:0 0 6px ${meta.color};display:inline-block;"></span>
        ${tt(meta.label, meta.labelEn)} ${tt('骰子','Die')}
      </span>
      <span class="countdown">${tt('基礎攻擊','Base ATK')} ${dice.baseAttack}　${tt('Lv.','Lv.')}${dice.level||1}</span>
    </div>
    <div>${facesHtml}</div>
    ${opts.actionHtml || ''}
  </div>`;
}

function renderDiceShop(body){

  ensureMaterials(p);
  ensureDiceInventory(p);
  const cardCounts = DICE_GACHA_CARD_IDS.map(id=>({id, name: DECK_BY_ID[id] ? DECK_BY_ID[id].name : id, owned: p.cards[id]||0}));
  const canDraw = cardCounts.every(c=>c.owned >= DICE_GACHA_COST_QTY);
  const diceList = Object.values(p.dice).sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));

  let html = `<div class="panel">
    <h2>🎲 ${tt('骰子商店','Dice Shop')}</h2>
    <p class="sub">${tt('用 3 張特定 epic 卡抽一顆骰子，沒有保底機制。', 'Spend 3 specific epic cards to draw one die. No pity system.')}</p>
    <div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;">
      ${cardCounts.map(c=>`<div class="countdown" style="margin-bottom:4px;">${tt(c.name,c.name)}：<b style="color:${c.owned>=DICE_GACHA_COST_QTY?'var(--gold-bright)':'var(--danger)'};">${c.owned}</b> / ${DICE_GACHA_COST_QTY}</div>`).join('')}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
        <span class="dice-slot-chip" style="border-color:${DICE_QUALITY_META.common.color};color:${DICE_QUALITY_META.common.color};"><span class="dice-slot-swatch" style="background:${DICE_QUALITY_META.common.color};"></span>${tt('普通','Common')} ${Math.round(DICE_GACHA_RATES.common*100)}%</span>
        <span class="dice-slot-chip" style="border-color:${DICE_QUALITY_META.rare.color};color:${DICE_QUALITY_META.rare.color};"><span class="dice-slot-swatch" style="background:${DICE_QUALITY_META.rare.color};"></span>${tt('稀有','Rare')} ${Math.round(DICE_GACHA_RATES.rare*100)}%</span>
        <span class="dice-slot-chip" style="border-color:${DICE_QUALITY_META.epic.color};color:${DICE_QUALITY_META.epic.color};"><span class="dice-slot-swatch" style="background:${DICE_QUALITY_META.epic.color};"></span>${tt('史詩','Epic')} ${Math.round(DICE_GACHA_RATES.epic*100)}%</span>
      </div>
    </div>
    <button class="btn full" id="dice-gacha-btn" ${canDraw ? '' : 'disabled'}>${tt('✦ 抽一顆骰子','✦ Draw a Die')}</button>
  </div>
  <div class="panel">
    <h2>${tt('裝備欄','Equipped')}</h2>
    <p class="sub">${tt('同時裝備最多 3 顆骰子，出戰 Boss 時會依此欄位擲骰；2 顆同號觸發「對子」、3 顆同號觸發「豹子」加成。','Equip up to 3 dice — Boss attacks roll whatever is equipped here; 2 matching numbers trigger a Pair bonus, 3 matching trigger a Triple bonus.')}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
      ${p.diceSlots.map((diceId, i)=>{
        const dice = diceId ? p.dice[diceId] : null;
        if(!dice) return `<div style="flex:1;min-width:120px;border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center;color:var(--muted);">${tt('空欄位','Empty')}</div>`;
        const meta = DICE_QUALITY_META[dice.quality];
        return `<div style="flex:1;min-width:120px;border:1px solid ${meta.color};border-radius:10px;padding:10px;text-align:center;">
          <div style="width:24px;height:24px;margin:0 auto 4px;border-radius:7px;background:${meta.color};box-shadow:0 0 8px ${meta.color};"></div>
          <div style="color:${meta.color};font-size:12px;">${tt(meta.label,meta.labelEn)}</div>
          <div class="countdown">${tt('基礎','Base')} ${dice.baseAttack}</div>
          <button class="btn small secondary" data-unequip-slot="${i}" style="margin-top:6px;">${tt('卸下','Unequip')}</button>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="panel">

    <p class="sub">💠 ${tt('骰子精華','Dice Essence')}：<b style="color:var(--gold-bright);">${p.materials.diceEssence}</b>　${tt('（拆解用不到的骰子可以取得，用於強化骰子）','(Gained by dismantling unwanted dice; spend it to enhance dice)')}</p>
    ${diceList.length === 0 ? `<p class="sub">${tt('還沒有任何骰子，先去商店抽一顆吧。','No dice yet — draw one from the shop above.')}</p>` : diceList.map(dice=>{
      const equippedSlot = p.diceSlots.indexOf(dice.id);

        : `<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">${p.diceSlots.map((_,i)=>`<button class="btn small" data-equip-dice="${dice.id}" data-equip-slot="${i}">${tt('裝備到欄','Equip to slot')} ${i+1}</button>`).join('')}</div>`;

        ? `<button class="btn small secondary" disabled>${tt('已達強化上限','Max level')}</button>`
        : `<button class="btn small" data-enhance-dice="${dice.id}" ${p.materials.diceEssence < enhCost ? 'disabled' : ''}>${tt(`強化（💠${enhCost}）`, `Enhance (💠${enhCost})`)}</button>`;
      const dismantleBtnHtml = equippedSlot >= 0

      const actionHtml = `${equipActionHtml}<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">${enhanceBtnHtml}${dismantleBtnHtml}</div>`;
      return renderDiceCard(dice, {actionHtml});
    }).join('')}
  </div>`;
  body.innerHTML = html;

  const gachaBtn = document.getElementById('dice-gacha-btn');
  if(gachaBtn) gachaBtn.onclick = async ()=>{
    gachaBtn.disabled = true;
    try{ await doDiceGacha(); } finally { renderTab(); }
  };
  body.querySelectorAll('[data-equip-dice]').forEach(btn=>{
    btn.onclick = ()=> doEquipDice(btn.dataset.equipDice, parseInt(btn.dataset.equipSlot, 10));
  });
  body.querySelectorAll('[data-unequip-slot]').forEach(btn=>{
    btn.onclick = ()=> doUnequipDice(parseInt(btn.dataset.unequipSlot, 10));
  });
  body.querySelectorAll('[data-enhance-dice]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      try{ await doEnhanceDice(btn.dataset.enhanceDice); } finally { renderTab(); }
    };
  });
  body.querySelectorAll('[data-dismantle-dice]').forEach(btn=>{
    btn.onclick = async ()=>{
      btn.disabled = true;
      try{ await doDismantleDice(btn.dataset.dismantleDice); }
      catch(e){ console.error('[dismantle-dice btn] unexpected error', e); }
      finally { renderTab(); }
    };
  });
}

// renderBoss 內有非同步 await（ensureBossState），
// 若使用者在等待期間切走分頁又切回來、或短時間內重複觸發渲染，
// 舊的那次非同步呼叫仍會在背景跑完，若不比對序號直接寫 DOM，
// 就可能用「先發起但後完成」的舊資料覆蓋掉新畫面（畫面回退/閃爍）。
// 每次呼叫 renderBoss 都令 bossRenderGen 遞增並記下自己的 myGen，
// 等到真的要寫 DOM 前才比對 myGen 是否仍是最新，不是就直接丟棄。
let bossRenderGen = 0;
function renderBoss(body){
  const p = state.player;
  ensureMaterials(p);
  ensureProfession(p);
  ensureDiceInventory(p);
  if(!SEASON_ACTIVE){
    body.innerHTML = `<div class="panel"><h2>${tt('Boss 戰','Boss Battle')}</h2><p class="sub">${tt('目前沒有進行中的賽季。','No season is currently active.')}</p></div>`;
    return;
  }
  // 階段三：Boss 頁面內加一組子分頁切換「戰鬥／骰子」，骰子商店先獨立運作，
  // 不影響原本的戰鬥渲染邏輯（含下方 CAS 重試、bossRenderGen 防閃爍機制）。
  if(!state.bossView) state.bossView = 'battle';
  const bossNavHtml = `<div class="tabs" style="margin:0 0 14px;">
    <div class="tab ${state.bossView==='battle'?'active':''}" data-boss-view="battle">⚔️ ${tt('Boss 戰','Battle')}</div>
    <div class="tab ${state.bossView==='dice'?'active':''}" data-boss-view="dice">🎲 ${tt('骰子','Dice')}</div>
  </div>`;
  const bindBossNav = ()=>{
    body.querySelectorAll('[data-boss-view]').forEach(el=>{
      el.onclick = ()=>{ state.bossView = el.dataset.bossView; renderTab(); };
    });
  };
  if(state.bossView === 'dice'){
    body.innerHTML = `${bossNavHtml}<div id="boss-subview"></div>`;
    bindBossNav();
    renderDiceShop(document.getElementById('boss-subview'));
    return;
  }
  const myGen = ++bossRenderGen;
  const bossAlreadyRendered = !!document.getElementById('boss-burst-btn');
  if(!bossAlreadyRendered){
    body.innerHTML = `${bossNavHtml}<div class="panel"><p class="sub">${tt('讀取戰況中…','Loading battle status…')}</p></div>`;
    bindBossNav();
  }
  (async ()=>{
    const boss = await ensureBossState(p.nickname);
    const meta = BOSS_STAGE_META[boss.stage-1];
    const pct = Math.max(0, Math.min(100, (boss.hp/boss.maxHp)*100));
    let html = `<div class="panel">
      <h2>⚔️ ${tt(SEASON_LABEL_ZH, SEASON_LABEL_EN)} · ${tt('Boss 戰','Boss Battle')}</h2>
      <p class="sub">${tt(`第 ${boss.cycle} 輪　第 ${boss.stage}/3 階段　·　每日 00:00 重置`, `Cycle ${boss.cycle} · Stage ${boss.stage}/3 · Resets daily at 00:00`)}</p>
      <div style="text-align:center;">
        <img src="${meta.img}" style="width:100%;max-width:340px;border-radius:14px;border:1px solid var(--gold);box-shadow:0 0 22px rgba(139,107,209,0.4);margin-bottom:10px;" alt="${meta.label}" />
        <div style="font-family:'Cinzel Decorative',serif;color:var(--gold-bright);font-size:16px;">${tt(meta.label, meta.labelEn)}</div>
        <p class="sub" style="margin-top:4px;">${tt(meta.desc, meta.descEn)}</p>
      </div>
      <div style="background:var(--bg-panel-raised, rgba(255,255,255,0.06));border-radius:999px;height:18px;overflow:hidden;border:1px solid var(--line);margin:12px 0 4px;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg, var(--violet), var(--gold));"></div>
      </div>
      <div class="countdown" style="text-align:center;margin-bottom:12px;">${Math.max(0,boss.hp).toLocaleString()} / ${boss.maxHp.toLocaleString()} HP</div>
      ${boss.minion ? (()=>{
        const mMeta = BOSS_MINION_TYPES.find(m => m.id === boss.minion.typeId) || BOSS_MINION_TYPES[0];
        const mPct = Math.max(0, Math.min(100, (boss.minion.hp/boss.minion.maxHp)*100));
        return `<div style="border:1px solid var(--danger);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:rgba(193,91,91,0.08);">
          <div class="countdown" style="margin-bottom:6px;">${mMeta.icon} ${tt('小怪出現','A minion appeared')}：<b style="color:#ff8080;">${tt(mMeta.labelZh, mMeta.labelEn)}</b>　${tt('（優先承受這次攻擊傷害，殺死後才有溢出傷害打Boss）','(Absorbs this attack first — overflow damage carries to the Boss)')}</div>
          <div style="background:var(--bg-panel-raised, rgba(255,255,255,0.06));border-radius:999px;height:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:4px;">
            <div style="height:100%;width:${mPct}%;background:linear-gradient(90deg, var(--danger), #ff8080);"></div>
          </div>
          <div class="countdown">${boss.minion.hp.toLocaleString()} / ${boss.minion.maxHp.toLocaleString()} HP</div>
        </div>`;
      })() : ''}
      ${boss.activeEvent ? (()=>{
        const eMeta = BOSS_EVENT_TYPES.find(e => e.id === boss.activeEvent.id) || BOSS_EVENT_TYPES[0];
        const isDebuff = eMeta.kind === 'debuff';
        const borderColor = isDebuff ? 'var(--danger)' : 'var(--gold)';
        const bgColor = isDebuff ? 'rgba(193,91,91,0.08)' : 'rgba(201,162,74,0.08)';
        return `<div style="border:1px solid ${borderColor};border-radius:10px;padding:10px 12px;margin-bottom:10px;background:${bgColor};">
          <div class="countdown">${eMeta.icon} ${tt('本階段事件','Stage event')}：<b style="color:${isDebuff?'#ff8080':'var(--gold-bright)'};">${tt(eMeta.labelZh, eMeta.labelEn)}</b>　${tt(eMeta.descZh, eMeta.descEn)}${boss.activeEvent.hitsLeft > 1 ? tt(`（剩餘 ${boss.activeEvent.hitsLeft} 次攻擊）`, ` (${boss.activeEvent.hitsLeft} attacks left)`) : ''}</div>
        </div>`;
      })() : ''}
      <div class="countdown" style="margin-bottom:10px;">${tt('本輪已造成傷害','Damage this cycle')}：<b style="color:var(--gold-bright);">${(boss.cycleDamage||0).toLocaleString()}</b></div>
      <div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px;background:rgba(139,107,209,0.06);">
        <div class="countdown">🎁 ${tt('擊殺獎勵','Kill Reward')}（${tt('基礎','base')}）：<b style="color:var(--gold-bright);">✦${bossCurrentBaseReward(boss.cycle).coins}</b></div>
        <div class="countdown">🏆 ${tt('擊殺獎池','Kill Bonus Pool')}（${tt('全額入袋','all yours')}）：<b style="color:var(--gold-bright);">✦${bossCurrentBonusPool(boss.cycle).coins.toLocaleString()}</b></div>
      </div>
      ${(()=>{
        const equipped = p.diceSlots.map(id => id ? p.dice[id] : null);
        const equippedCount = equipped.filter(Boolean).length;
        const slotsHtml = equipped.map((dice, i) => {
          if(!dice){
            return `<span class="dice-slot-chip" style="border-style:dashed;color:var(--muted);">${tt(`骰${i+1}：未裝備`, `Die ${i+1}: empty`)}</span>`;
          }
          const meta = DICE_QUALITY_META[dice.quality];
          return `<span class="dice-slot-chip" style="border-color:${meta.color};color:${meta.color};">
            <span class="dice-slot-swatch" style="background:${meta.color};"></span>
            ${tt(meta.label, meta.labelEn)} · ${tt('基礎','ATK')}${dice.baseAttack}
          </span>`;
        }).join('');
        const lastRoll = state.bossLastAttack;
        const lastRollComboHtml = lastRoll && lastRoll.comboTier === 'triple' ? tt('　🎯豹子×2','　🎯Triple×2')
          : lastRoll && lastRoll.comboTier === 'pair' ? tt(`　✌️對子×${DICE_COMBO_MULT.pair}`, `　✌️Pair×${DICE_COMBO_MULT.pair}`) : '';
        const lastRollEventHtml = lastRoll && lastRoll.eventApplied ? (()=>{
          const eMeta = BOSS_EVENT_TYPES.find(e => e.id === lastRoll.eventApplied.id);
          return eMeta ? `　${eMeta.icon}${tt(eMeta.labelZh, eMeta.labelEn)}` : '';
        })() : '';
        const lastRollHtml = (lastRoll && lastRoll.rolls) ? `<div class="countdown" style="margin-top:6px;">${tt('上次擲骰','Last roll')}：${lastRoll.rolls.map(r=>r.face.num).join(' · ')}${lastRollComboHtml}${lastRoll.isCrit ? tt('　💥暴擊','　💥Crit') : ''}${lastRollEventHtml}</div>` : '';
        return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;">
          <div class="countdown">🎲 ${tt('已裝備骰子','Equipped dice')}：</div>
          <div>${slotsHtml}</div>
          ${equippedCount===0 ? `<div class="countdown" style="color:var(--danger);">${tt('尚未裝備骰子，請先到「骰子」分頁裝備','No dice equipped — equip in the Dice tab first')}</div>` : ''}
          ${lastRollHtml}
        </div>`;
      })()}
      <div id="dice-roll-anim" class="dice-roll-anim" style="display:none;"></div>
      ${BOSS_DAILY_ATTACK_LIMIT > 0 ? `<div class="countdown" style="text-align:center;margin-bottom:8px;">${tt('今日剩餘攻擊次數','Attacks left today')}：<b style="color:${bossAttacksRemaining(p)>0?'var(--gold-bright)':'var(--danger)'};">${bossAttacksRemaining(p)}</b> / ${BOSS_DAILY_ATTACK_LIMIT}</div>` : ''}
      <button class="btn" id="boss-burst-btn" ${(p.coins < BOSS_COIN_COST || bossAttacksRemaining(p) <= 0) ? 'disabled' : ''}>${bossAttacksRemaining(p) <= 0 ? tt('今日攻擊次數已用完','No attacks left today') : tt(`🎲 擲骰攻擊（消耗✦${BOSS_COIN_COST}）`, `🎲 Dice Attack (✦${BOSS_COIN_COST})`)}</button>
    </div>`;
    if(myGen !== bossRenderGen) return; // 已經有更新的一次 renderBoss 呼叫了，這份是過期結果，丟棄不寫 DOM
    const bossScrollY = window.scrollY;
    body.innerHTML = bossNavHtml + html;
    bindBossNav();
    if(bossAlreadyRendered) window.scrollTo(0, bossScrollY);
    // 點擊後立刻把兩顆按鈕都 disable，避免使用者在 performBossAttack 還沒
    // resolve（尤其 resolveBossAttack 內有 CAS 重試、可能要好幾輪 await）
    // 之前手滑連點，一次點擊觸發多次扣金幣/多次攻擊。等 performBossAttack
    // resolve 後在 finally 裡強制 renderTab() 一次，依當下最新的
    // state.player.coins 重新計算按鈕該不該恢復可點——
    // 不論 performBossAttack 是成功、因金幣不足提早 return、還是 catch 到
    // CAS 重試失敗，都會走到這裡重新計算，不會卡死在 disabled 狀態。
    const btn = document.getElementById('boss-burst-btn');
    if(btn){
      btn.onclick = async ()=>{
        btn.disabled = true;
        try{
          await doBossBurst();
        } finally {
          renderTab();
        }
      };
    }
  })();
}

async function doSeasonCardDraw(){
  const p = state.player;
  ensureMaterials(p);
  const owned = SEASON_CARDS.filter(c=>!p.seasonCards[c.id]);
  if(owned.length === 0){ showToast(tt('12 張賽季卡已全部收集完成！','All 12 season cards already collected!')); return; }
  if(p.materials.contrib < SEASON_CARD_DRAW_COST){ showToast(tt(`貢獻點不足，需要 ${SEASON_CARD_DRAW_COST}`, `Not enough contribution points, need ${SEASON_CARD_DRAW_COST}`)); return; }
  p.materials.contrib -= SEASON_CARD_DRAW_COST;
  const card = owned[Math.floor(Math.random()*owned.length)];
  p.seasonCards[card.id] = (p.seasonCards[card.id]||0) + 1;
  const completedNow = SEASON_CARDS.every(c=>p.seasonCards[c.id]);
  state.seasonCardDrawResult = card;
  await savePlayer(p);
  render();
  if(completedNow){
    setTimeout(()=>{
      const legendEl = document.getElementById('season-legendary-reveal');
      if(legendEl) legendEl.classList.add('legendary-reveal');
      playLegendaryRevealFx();
      showToast(tt(`🎉 抽到「${seasonCardName(card)}」！12 張賽季卡已全部收集完成，第13張傳說卡「${seasonLegendaryCardName(SEASON_LEGENDARY_CARD)}」已解鎖！`, `🎉 Drew "${seasonCardName(card)}"! All 12 season cards collected - the 13th legendary card "${seasonLegendaryCardName(SEASON_LEGENDARY_CARD)}" is now unlocked!`), {legendary:true});
    }, 380);
  } else {
    showToast(tt(`✨ 抽到「${seasonCardName(card)}」！`, `✨ Drew "${seasonCardName(card)}"!`));
  }
}
async function doExchangeContrib(type){
  const p = state.player;
  ensureMaterials(p);
  const isComplete = SEASON_CARDS.every(c=>p.seasonCards[c.id]);
  if(!isComplete){ showToast(tt('需先集滿全部賽季卡才能兌換','Collect all season cards first to unlock exchange')); return; }
  const input = document.getElementById('season-contrib-exchange-amount');
  let amount = input ? parseInt(input.value, 10) : p.materials.contrib;
  if(isNaN(amount) || amount <= 0){ showToast(tt('請輸入有效的貢獻點數量','Please enter a valid contribution amount')); return; }
  if(amount > p.materials.contrib) amount = p.materials.contrib;
  if(amount <= 0){ showToast(tt('貢獻點不足','Not enough contribution points')); return; }
  const rate = type === 'moon' ? SEASON_CONTRIB_EXCHANGE_RATE.moon : SEASON_CONTRIB_EXCHANGE_RATE.coins;
  const gain = Math.floor(amount * rate);
  if(gain <= 0){ showToast(tt('兌換數量太少，無法產生任何回饋','Amount too small to yield any reward')); return; }
  p.materials.contrib -= amount;
  if(type === 'moon'){ p.materials.moon += gain; }
  else { p.coins += gain; }
  await savePlayer(p);
  render();
  showToast(type === 'moon'
    ? tt(`✨ 兌換成功！花費 🏅${amount} 獲得 🌙 日月之輝 x${gain}`, `✨ Exchanged! Spent 🏅${amount} for 🌙 Sun-Moon Brilliance x${gain}`)

}

const DEFAULT_SLOT_SETTINGS = {
  cost: 50,
  multCommon: 2,
  multUncommon: 5,
  multRare: 15,
  contribRate: 10,   // 百分比，未中獎時投入獎池
  jackpotBase: 200,  // 中頭獎後獎池重置的保底金額
};
let SLOT_SETTINGS = {...DEFAULT_SLOT_SETTINGS};
let SLOT_JACKPOT = DEFAULT_SLOT_SETTINGS.jackpotBase;
async function loadSlotConfig(){
  try{
    const r = await storage.get('config:slot_settings');
    if(r){
      const s = JSON.parse(r.value);
      Object.keys(DEFAULT_SLOT_SETTINGS).forEach(k=>{
        if(typeof s[k] === 'number' && s[k] >= 0) SLOT_SETTINGS[k] = s[k];
      });
    }
  }catch(e){ /* keep defaults */ }
  try{
    const r2 = await storage.get('config:slot_jackpot');
    if(r2){
      const v = parseFloat(r2.value);
      if(!isNaN(v) && v >= 0) SLOT_JACKPOT = v;
    }
  }catch(e){ /* keep default */ }
}
async function saveSlotSettings(newSettings){
  SLOT_SETTINGS = {...newSettings};
  await storage.set('config:slot_settings', JSON.stringify(SLOT_SETTINGS));
}
async function saveSlotJackpot(newValue){
  SLOT_JACKPOT = newValue;
  await storage.set('config:slot_jackpot', JSON.stringify(SLOT_JACKPOT));
}
// 每次要「讀取」或「疊加」獎池前，先向 storage 重新抓最新值，
// 避免用分頁自己記憶體裡過期的 SLOT_JACKPOT 去覆蓋別人剛存進去的貢獻
// （這個 KV storage 是 last-write-wins，沒有原子疊加，所以這裡用「盡量縮短讀寫間隔」
// 來把競態窗口降到最小；理論上仍有極低機率的同時寫入，但已能修正絕大多數情況）。
async function syncSlotJackpot(){
  try{
    const r = await storage.get('config:slot_jackpot');
    if(r){
      const v = parseFloat(r.value);
      if(!isNaN(v) && v >= 0){ SLOT_JACKPOT = v; return v; }
    }
  }catch(e){ /* 抓不到就先沿用目前記憶體裡的值 */ }
  return SLOT_JACKPOT;
}

  {key:'checkin', nameZh:'完成每日簽到', nameEn:'Complete daily check-in', target:1, icon:'🔮'},
  {key:'slot', nameZh:'玩一次三牌共鳴', nameEn:'Play Resonance once', target:1, icon:'✨'},

  {key:'harvest', nameZh:'收成一次花園', nameEn:'Harvest a plot', target:1, icon:'🌾'},
  {key:'water', nameZh:'幫好友澆水一次', nameEn:"Water a friend's plot", target:1, icon:'🚿'},
  {key:'sell', nameZh:'出售一張卡片', nameEn:'Sell a card', target:1, icon:'💰'},
  {key:'auction', nameZh:'上架或出價一次拍賣', nameEn:'List or bid on an auction', target:1, icon:'🔨'},
];
const QUEST_BY_KEY = Object.fromEntries(QUEST_DEFS.map(q=>[q.key,q]));
const DEFAULT_QUEST_SETTINGS = {
  rewards: {checkin:10, slot:10, plant:10, harvest:10, water:5, sell:5, auction:10},
  completionBonus: 20,
};
let QUEST_SETTINGS = JSON.parse(JSON.stringify(DEFAULT_QUEST_SETTINGS));
async function loadQuestSettings(){
  try{
    const r = await storage.get('config:quest_settings');
    if(r){
      const s = JSON.parse(r.value);
      QUEST_DEFS.forEach(q=>{
        if(s.rewards && typeof s.rewards[q.key] === 'number' && s.rewards[q.key] >= 0) QUEST_SETTINGS.rewards[q.key] = s.rewards[q.key];
      });
      if(typeof s.completionBonus === 'number' && s.completionBonus >= 0) QUEST_SETTINGS.completionBonus = s.completionBonus;
    }
  }catch(e){ /* keep defaults */ }
}
async function saveQuestSettings(newSettings){
  QUEST_SETTINGS = JSON.parse(JSON.stringify(newSettings));
  await storage.set('config:quest_settings', JSON.stringify(QUEST_SETTINGS));
}
function ensureDailyQuests(p){
  const today = todayStr();
  if(!p.daily || p.daily.date !== today){
    p.daily = {date: today, progress:{}, claimed:[]};
  }
  if(!p.daily.progress) p.daily.progress = {};
  if(!p.daily.claimed) p.daily.claimed = [];
  return p.daily;
}
function bumpQuest(p, key, amount){
  const daily = ensureDailyQuests(p);
  const def = QUEST_BY_KEY[key];
  if(!def) return;
  const cur = daily.progress[key] || 0;
  daily.progress[key] = Math.min(def.target, cur + (amount||1));
}
async function claimQuest(questKey){
  const p = state.player;
  const daily = ensureDailyQuests(p);
  const def = QUEST_BY_KEY[questKey];
  if(!def) return;
  if(daily.claimed.includes(questKey)) return;
  const progress = daily.progress[questKey] || 0;
  if(progress < def.target) return;
  daily.claimed.push(questKey);
  const reward = QUEST_SETTINGS.rewards[questKey] || 0;
  p.coins = (p.coins||0) + reward;
  let bonusAwarded = false;
  if(QUEST_DEFS.every(q=>daily.claimed.includes(q.key)) && !daily.bonusClaimed){
    daily.bonusClaimed = true;
    p.coins += QUEST_SETTINGS.completionBonus;
    bonusAwarded = true;
  }
  await savePlayer(p);
  if(bonusAwarded){
    showToast(tt(`已領取「${def.nameZh}」✦${reward}，並完成今日全部任務，額外獲得 ✦${QUEST_SETTINGS.completionBonus} 🎉`, `Claimed "${def.nameEn}" for ✦${reward} - and completed all daily quests for a bonus ✦${QUEST_SETTINGS.completionBonus} 🎉`));
  } else {
    showToast(tt(`已領取「${def.nameZh}」✦${reward}`, `Claimed "${def.nameEn}" for ✦${reward}`));
  }
  render();
}

let TITLE_HOLDERS = {wealth:null, collection:null, resonance:null, streak:null, boss:null, updatedAt:0};
async function loadTitleHolders(){
  try{
    const r = await storage.get('config:title_holders');
    if(r){
      const s = JSON.parse(r.value);
      TITLE_HOLDERS = {
        wealth: s.wealth || null,
        collection: s.collection || null,
        resonance: s.resonance || null,
        streak: s.streak || null,
        boss: s.boss || null,
        updatedAt: s.updatedAt || 0,
      };
    }
  }catch(e){ /* keep defaults */ }
}
async function saveTitleHolders(){
  TITLE_HOLDERS.updatedAt = Date.now();
  await storage.set('config:title_holders', JSON.stringify(TITLE_HOLDERS));
}
// 依排行榜頁面已經算好的榜單重新判斷榜首，若有變動才寫回，避免每次開排行榜都打一次寫入
async function refreshTitleHoldersFromLeaderboards(byCoins, byCards, bySlotSpend, byStreak, byBossDamage){
  const nextWealth = (byCoins[0] && byCoins[0].coins > 0) ? byCoins[0].nickname : null;
  const nextCollection = (byCards[0] && byCards[0].total > 0) ? byCards[0].nickname : null;
  const nextResonance = (bySlotSpend[0] && bySlotSpend[0].spend > 0) ? bySlotSpend[0].nickname : null;
  const nextStreak = (byStreak && byStreak[0] && byStreak[0].streak > 0) ? byStreak[0].nickname : null;
  const nextBoss = (byBossDamage && byBossDamage[0] && byBossDamage[0].damage > 0) ? byBossDamage[0].nickname : null;
  const changed = nextWealth !== TITLE_HOLDERS.wealth
    || nextCollection !== TITLE_HOLDERS.collection
    || nextResonance !== TITLE_HOLDERS.resonance
    || nextStreak !== TITLE_HOLDERS.streak
    || nextBoss !== TITLE_HOLDERS.boss;
  if(changed){
    TITLE_HOLDERS.wealth = nextWealth;
    TITLE_HOLDERS.collection = nextCollection;
    TITLE_HOLDERS.resonance = nextResonance;
    TITLE_HOLDERS.streak = nextStreak;
    TITLE_HOLDERS.boss = nextBoss;
    await saveTitleHolders();
  }
}

const MAX_EQUIPPED_BADGES = 3;
function ensureUnlockedBadges(p){
  if(!p) return [];
  if(!Array.isArray(p.unlockedBadges)) p.unlockedBadges = [];

  if(!p) return [];

async function toggleEquipBadge(key){
  const p = state.player;
  if(!p) return;
  const a = ACHIEVEMENT_BY_KEY[key];
  if(!a || !isBadgeUnlocked(p, key)){ showToast(tt('尚未解鎖此徽章 🔒','This badge is not unlocked yet 🔒')); return; }
  p.equippedBadges = p.equippedBadges || [];
  const idx = p.equippedBadges.indexOf(key);
  if(idx >= 0){
    p.equippedBadges.splice(idx, 1);
  } else {
    if(p.equippedBadges.length >= MAX_EQUIPPED_BADGES){
      showToast(tt(`最多只能裝備 ${MAX_EQUIPPED_BADGES} 個徽章，請先取消其他徽章`, `You can equip up to ${MAX_EQUIPPED_BADGES} badges - unequip one first`));
      return;
    }
    p.equippedBadges.push(key);
  }
  await savePlayer(p);
  renderTab();
}
async function checkAchievementUnlocks(p){
  if(!p) return;
  ensureUnlockedBadges(p);
  const newlyUnlocked = [];
  ACHIEVEMENTS.forEach(a=>{
    if(!p.unlockedBadges.includes(a.key) && a.check(p)){
      p.unlockedBadges.push(a.key);
      newlyUnlocked.push(a.key);
    }
  });
  if(newlyUnlocked.length === 0) return;
  await savePlayer(p);
  newlyUnlocked.forEach(k=>{
    const a = ACHIEVEMENT_BY_KEY[k];
    showToast(tt(`🏅 解鎖成就：${a.nameZh}！`, `🏅 Achievement unlocked: ${a.nameEn}!`), {legendary:true});
    showAchievementUnlockModal(a.key);
  });
}

function reqCardPool(req){
  if(req.type==='rarity') return DECK.filter(c=>c.rarity===req.rarity);
  if(req.type==='suit') return DECK.filter(c=>c.arcana==='minor' && req.suits.includes(c.id.split('_')[0]));
  if(req.type==='arcana') return DECK.filter(c=>c.arcana==='major');
  return [];
}
function countCardsForReq(p, req){
  return reqCardPool(req).reduce((sum,c)=>sum+(p.cards[c.id]||0),0);
}
function consumeCardsForReq(p, req){
  let remaining = req.count;
  for(const c of reqCardPool(req)){
    if(remaining<=0) break;
    const have = p.cards[c.id]||0;
    const take = Math.min(have, remaining);
    p.cards[c.id] = have - take;
    remaining -= take;
  }
}
function defaultMaterialSelection(p, req){
  const sel = {};
  let remaining = req.count;
  for(const c of reqCardPool(req)){
    if(remaining<=0) break;
    const have = p.cards[c.id]||0;
    const take = Math.min(have, remaining);
    if(take>0) sel[c.id] = take;
    remaining -= take;
  }
  return sel;
}
function reqLabel(req){
  if(req.type==='rarity') return tt(`${RARITY_LABEL[req.rarity]}卡 ×${req.count}`, `${RARITY_LABEL[req.rarity]} cards ×${req.count}`);
  if(req.type==='suit'){
    const labels = req.suits.map(s=>SUITS.find(x=>x.key===s)?.label || s).join('/');
    return tt(`${labels}花色卡 ×${req.count}（任意混搭）`, `${labels} suit cards ×${req.count} (any mix)`);
  }
  if(req.type==='arcana') return tt(`大阿爾卡納 ×${req.count}`, `Major Arcana ×${req.count}`);
  return '';
}

function suitUpgradeTier(p, suitKey){

// 依花色目前的升級階數，算出玩家買這個花色的種子時，實際會拿到哪個 SEED_TYPES key
function effectiveSeedKey(p, suitKey){
  let seed = SEED_TYPES[suitKey];
  let level = suitUpgradeTier(p, suitKey);
  while(level > 0 && seed && seed.upgradesTo){
    seed = SEED_TYPES[seed.upgradesTo];
    level--;
  }
  return seed ? seed.key : suitKey;
}
function nextSuitUpgradeTierName(level){
  return level === 0 ? 'sprout' : (level === 1 ? 'bloom' : (level === 2 ? 'starlight' : null));

  const req = SUIT_UPGRADE_REQS[suitKey] && SUIT_UPGRADE_REQS[suitKey][tierName];

      showToast(tt('材料不足，無法升級','Not enough materials to upgrade'));

  }
  req.cards.forEach(c=>consumeCardsForReq(p, c));
  ensureSuitUpgrades(p)[suitKey] = level + 1;
  await savePlayer(p);
  const upgradedSeed = SEED_TYPES[effectiveSeedKey(p, suitKey)];
  showToast(tt(`✨ ${seedName(SEED_TYPES[suitKey])}已升級為${seedName(upgradedSeed)}！`, `✨ ${seedName(SEED_TYPES[suitKey])} upgraded to ${seedName(upgradedSeed)}!`));

async function confirmFarmUpgrade(){
  const p = state.player;
  if(!p) return;
  const level = p.farmLevel||0;
  if(level >= FARM_MAX_LEVEL) return;
  const nextLevel = level+1;
  const req = FARM_UPGRADE_REQS[nextLevel];
  const selections = state.farmUpgradeSelections || req.cards.map(r=>defaultMaterialSelection(p, r));
  for(let ri=0; ri<req.cards.length; ri++){
    const r = req.cards[ri];
    const sel = selections[ri] || {};
    const poolIds = reqCardPool(r).map(c=>c.id);
    let total = 0;
    for(const cid of Object.keys(sel)){
      const qty = sel[cid]||0;
      if(qty<=0) continue;
      if(!poolIds.includes(cid) || qty > (p.cards[cid]||0)){
        showToast(tt('材料選擇有誤，請重新確認','Material selection is invalid - please recheck'));
        return;
      }
      total += qty;
    }
    if(total !== r.count){
      showToast(tt(`「${reqLabel(r)}」尚未選滿所需數量`, `You haven't selected the full amount for "${reqLabel(r)}"`));
      return;
    }
  }
  if(req.coins && (p.coins||0) < req.coins){
    showToast(tt('金幣不足，無法升級','Not enough coins to upgrade'));
    return;
  }
  if(req.harvests && ((p.stats && p.stats.totalHarvests) || 0) < req.harvests){
    showToast(tt(`收成次數不足，需累計收成 ${req.harvests} 次才能升級`, `Not enough harvests - you need ${req.harvests} total harvests to upgrade`));
    return;
  }
  req.cards.forEach((r, ri)=>{
    const sel = selections[ri] || {};
    Object.keys(sel).forEach(cid=>{
      const qty = sel[cid]||0;
      if(qty>0) p.cards[cid] = (p.cards[cid]||0) - qty;
    });
  });
  if(req.coins) p.coins -= req.coins;
  p.farmLevel = nextLevel;
  ensureFarm(p);
  state.farmUpgradeMode = false;
  state.farmUpgradeSelections = null;
  await savePlayer(p);
  showToast(tt(`🌱 花園升級到 Lv.${nextLevel}！`, `🌱 Garden upgraded to Lv.${nextLevel}!`));
  render();
}
function seedName(seed){

function ensureFarm(p){
  const wanted = farmPlotCount(p);

  while(p.farm.length < wanted){
    p.farm.push({seed:null, plantedAt:null, readyAt:null, witherAt:null, waterLog:{}, stolenBy:[]});
  }
  p.farm.forEach(plot=>{

    if(!Array.isArray(plot.stolenBy)) plot.stolenBy = [];
  });

function plotStatus(plot, now){
  if(!plot || !plot.seed) return 'empty';
  if(plot.witherAt && now >= plot.witherAt) return 'withered';
  if(now >= plot.readyAt) return 'ready';
  return 'growing';
}
function timeAgo(ts){
  const diff = Date.now() - ts;
  if(diff < 0) return tt('剛剛','just now');
  const min = Math.floor(diff/60000);
  if(min < 1) return tt('剛剛','just now');
  if(min < 60) return tt(`${min} 分鐘前`, `${min} min ago`);
  const hr = Math.floor(min/60);
  if(hr < 24) return tt(`${hr} 小時前`, `${hr}h ago`);
  return tt(`${Math.floor(hr/24)} 天前`, `${Math.floor(hr/24)}d ago`);
}
const ONLINE_THRESHOLD_MS = 3 * 60 * 1000; // 3 分鐘內有活動視為線上
function isPlayerOnline(p){
  return !!(p && p.lastActiveAt && (Date.now() - p.lastActiveAt) < ONLINE_THRESHOLD_MS);
}
function presenceHtml(p){
  if(!p) return '';
  if(isPlayerOnline(p)){
    return `<span class="presence-dot presence-online" title="${tt('線上','Online')}"></span><span class="presence-text presence-online-text">${tt('線上','Online')}</span>`;
  }
  const lastActive = p.lastActiveAt || p.joinedAt || 0;
  const label = lastActive ? tt(`最後上線：${timeAgo(lastActive)}`, `Last online: ${timeAgo(lastActive)}`) : tt('尚未上線過','Never logged in');
  return `<span class="presence-dot presence-offline" title="${tt('離線','Offline')}"></span><span class="presence-text">${label}</span>`;
}
function formatDuration(ms){
  if(ms < 0) ms = 0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h > 0) return tt(`${h}時${String(m).padStart(2,'0')}分`, `${h}h ${String(m).padStart(2,'0')}m`);
  if(m > 0) return tt(`${m}分${String(s).padStart(2,'0')}秒`, `${m}m ${String(s).padStart(2,'0')}s`);
  return tt(`${s}秒`, `${s}s`);
}

function buildExpeditionDurations(tier){

    const minutes = meta.ms / 60000;
    const rate = Math.max(0.5, Math.min(0.99, tier.baseSuccessRate + meta.rateAdj));
    const factor = meta.rewardFactor || 1;
    durations[key] = {
      durationMs: meta.ms,
      commonCount: tier.commonCount,
      uncommonCount: tier.uncommonCount,
      successRate: Math.round(rate * 100) / 100,
      rewardCoinsMin: Math.max(1, Math.round(tier.coinPerMinMin * minutes * factor)),
      rewardCoinsMax: Math.max(1, Math.round(tier.coinPerMinMax * minutes * factor)),
      rewardExp: Math.max(1, Math.round(tier.expPerMin * minutes * factor)),

function ensureExpedition(p){
  if(typeof p.expLevel !== 'number' || p.expLevel < 0) p.expLevel = 0;
  if(typeof p.expExp !== 'number' || p.expExp < 0) p.expExp = 0;
  if(p.expedition === undefined) p.expedition = null;
  if(p.expedition && (!p.expedition.tierId || !p.expedition.durationKey || !p.expedition.readyAt)) p.expedition = null;
  if(!p.expeditionRolls || typeof p.expeditionRolls !== 'object') p.expeditionRolls = {};
  // 🔥 階段四：連勝計數，不隨派遣重置，只在結算（claimExpedition）時更新
  if(typeof p.expeditionStreak !== 'number' || p.expeditionStreak < 0) p.expeditionStreak = 0;
  // 🔥 成就專用：只計「亡命」風險等級＋8小時遠征的連續成功次數，跟上面獎勵加成用的 expeditionStreak 分開算，
  // 避免舊存檔（例如加上風險等級限制前）已經用一般遠征累積的連勝數，誤觸發這個成就
  if(typeof p.expeditionRecklessStreak !== 'number' || p.expeditionRecklessStreak < 0) p.expeditionRecklessStreak = 0;
  // 階段三：補齊舊存檔（升級前就已經在路上的遠征）缺少的事件節點欄位，維持行為等同「這趟沒有事件節點」
  if(p.expedition){
    if(!Array.isArray(p.expedition.events)) p.expedition.events = [];
    if(typeof p.expedition.eventSuccessDelta !== 'number') p.expedition.eventSuccessDelta = 0;
    if(typeof p.expedition.eventRewardPctDelta !== 'number') p.expedition.eventRewardPctDelta = 0;
    if(!Array.isArray(p.expedition.extraBlessings)) p.expedition.extraBlessings = [];
  }
  return p.expedition;
}
